syntax = "proto3";
package fixture.treasury.v1;
option go_package = "example.com/protomap-fixtures/gen/treasury;treasurypb";
import "common/common.proto";

// Bank statement lookup.
service BankStatementLookup {
  rpc FindStatement(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

