syntax = "proto3";
package fixture.fleet.v1;
option go_package = "example.com/protomap-fixtures/gen/fleet;fleetpb";
import "common/common.proto";

// Driver duty assessment.
service DriverDutyAssessment {
  rpc AssessDuty(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Driver qualification assessment.
service DriverQualificationAssessment {
  rpc AssessQualification(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Fleet fuel coordination.
service FleetFuelCoordination {
  rpc Refuel(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Fleet maintenance coordination.
service FleetMaintenanceCoordination {
  rpc Maintain(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Fleet safety action preparation.
service FleetSafetyActionPreparation {
  rpc PrepareAction(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Fleet safety coordination.
service FleetSafetyCoordination {
  rpc AssessSafety(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Fuel card authorization.
service FuelCardAuthorization {
  rpc AuthorizeFuel(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

