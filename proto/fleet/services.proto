}

// Vehicle service history.
service VehicleServiceHistory {
  rpc FindHistory(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Vehicle suitability evaluation.
service VehicleSuitabilityEvaluation {
  rpc EvaluateSuitability(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}
