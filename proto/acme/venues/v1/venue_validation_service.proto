syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueValidationServiceProto";
option java_package = "com.acme.venues.v1";

// Checks venues against the rules before anything acts on them.
service VenueValidationService {
  // Validates a venue.
  rpc ValidateVenue(ValidateVenueRequest) returns (ValidateVenueResponse);

  // Previews a venue.
  rpc PreviewVenue(PreviewVenueRequest) returns (PreviewVenueResponse);

  // Checks a venue.
  rpc CheckVenueEligibility(CheckVenueEligibilityRequest) returns (CheckVenueEligibilityResponse);

  // Normalizes a venue.
  rpc NormalizeVenue(NormalizeVenueRequest) returns (NormalizeVenueResponse);

  // Explains a venue.
  rpc ExplainVenueDecision(ExplainVenueDecisionRequest) returns (ExplainVenueDecisionResponse);

  // Scores a venue.
  rpc ScoreVenue(ScoreVenueRequest) returns (ScoreVenueResponse);

  // Lints a venue.
  rpc LintVenues(LintVenuesRequest) returns (LintVenuesResponse);

  // Returns a venue.
  rpc GetVenueRules(GetVenueRulesRequest) returns (GetVenueRulesResponse);
}

// The request of `ValidateVenue`.
message ValidateVenueRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  ValidateVenueRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVenue`.
message ValidateVenueResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  ValidateVenueResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

