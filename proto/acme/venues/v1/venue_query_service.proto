syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueQueryServiceProto";
option java_package = "com.acme.venues.v1";

// Answers read-only questions about venues, for screens and reports.
service VenueQueryService {
  // Returns a venue.
  rpc LookupVenue(LookupVenueRequest) returns (LookupVenueResponse);

  // Lists venues a page at a time.
  rpc BrowseVenues(BrowseVenuesRequest) returns (BrowseVenuesResponse);

  // Lists venues a page at a time.
  rpc FindVenues(FindVenuesRequest) returns (FindVenuesResponse);

  // Counts venues by status.
  rpc CountVenues(CountVenuesRequest) returns (CountVenuesResponse);

  // Summarizes a venue.
  rpc SummarizeVenues(SummarizeVenuesRequest) returns (SummarizeVenuesResponse);

  // Lists venues a page at a time.
  rpc SuggestVenues(SuggestVenuesRequest) returns (SuggestVenuesResponse);

  // Returns a venue.
  rpc PeekVenue(PeekVenueRequest) returns (PeekVenueResponse);
}

// The request of `LookupVenue`.
message LookupVenueRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupVenue`.
message LookupVenueResponse {
  Venue venue = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseVenues`.
message BrowseVenuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseVenuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseVenues`.
message BrowseVenuesResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindVenues`.
message FindVenuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindVenuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindVenues`.
message FindVenuesResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountVenues`.
message CountVenuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountVenuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountVenues`.
message CountVenuesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeVenues`.
message SummarizeVenuesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  SummarizeVenuesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeVenues`.
message SummarizeVenuesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestVenues`.
message SuggestVenuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestVenuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestVenues`.
message SuggestVenuesResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekVenue`.
message PeekVenueRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekVenue`.
message PeekVenueResponse {
  Venue venue = 1;
  acme.common.v1.OperationResult result = 2;
}
