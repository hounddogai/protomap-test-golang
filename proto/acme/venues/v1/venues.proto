syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenuesProto";
option java_package = "com.acme.venues.v1";

// Where a venue is in its lifecycle.
enum VenueStatus {
  VENUE_STATUS_UNSPECIFIED = 0;
  VENUE_STATUS_PLANNED = 1;
  VENUE_STATUS_AVAILABLE = 2;
  VENUE_STATUS_RESERVED = 3;
  VENUE_STATUS_RETIRED = 4;
}

// Where a venue section is in its lifecycle.
enum VenueSectionStatus {
  VENUE_SECTION_STATUS_UNSPECIFIED = 0;
  VENUE_SECTION_STATUS_ACTIVE = 1;
  VENUE_SECTION_STATUS_INACTIVE = 2;
}

// Where a venue policy is in its lifecycle.
enum VenuePolicyStatus {
  VENUE_POLICY_STATUS_UNSPECIFIED = 0;
  VENUE_POLICY_STATUS_DRAFT = 1;
  VENUE_POLICY_STATUS_ENABLED = 2;
  VENUE_POLICY_STATUS_DISABLED = 3;
  VENUE_POLICY_STATUS_RETIRED = 4;
}

// The dimensions of a venue.
message VenueDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a venue.
message VenueComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A venue of the venues domain.
message Venue {
  string venue_id = 1;
  string code = 2;
  string name = 3;
  VenueStatus status = 4;
  repeated string category_path = 5;
  VenueDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, VenueComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// A venue section of the venues domain.
message VenueSection {
  string venue_section_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated VenueSection children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  VenueSectionStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The condition of a venue policy.
message VenuePolicyCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a venue policy.
message VenuePolicyDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a venue policy.
message VenuePolicyRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a venue policy.
message VenuePolicyBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A venue policy of the venues domain.
message VenuePolicy {
  string venue_policy_id = 1;
  string name = 2;
  string description = 3;
  VenuePolicyStatus status = 4;
  int32 priority = 5;
  repeated VenuePolicyCondition conditions = 6;
  oneof action {
    VenuePolicyDiscountAction discount = 7;
    VenuePolicyRouteAction route = 8;
    VenuePolicyBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
