syntax = "proto3";

package acme.venues.v1;

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.venues.v1";

// A reference to a venue of the venues domain.
message VenueRef {
  string venue_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a venue section of the venues domain.
message VenueSectionRef {
  string venue_section_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a venue policy of the venues domain.
message VenuePolicyRef {
  string venue_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}
