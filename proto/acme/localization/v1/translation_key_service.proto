syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationKeyServiceProto";
option java_package = "com.acme.localization.v1";

// Manages translation keys: creates, reads, changes, and lists them.
service TranslationKeyService {
  // Creates a translation key.
  rpc CreateTranslationKey(CreateTranslationKeyRequest) returns (CreateTranslationKeyResponse);

  // Returns a translation key.
  rpc GetTranslationKey(GetTranslationKeyRequest) returns (GetTranslationKeyResponse);

  // Deletes a translation key.
  rpc DeleteTranslationKey(DeleteTranslationKeyRequest) returns (DeleteTranslationKeyResponse);

  // Returns several translation keys at once.
  rpc BatchGetTranslationKeys(BatchGetTranslationKeysRequest) returns (BatchGetTranslationKeysResponse);

  // Lists translation keys a page at a time.
  rpc SearchTranslationKeys(SearchTranslationKeysRequest) returns (SearchTranslationKeysResponse);

  // Streams the changes of translation keys as they happen.
  rpc WatchTranslationKeys(WatchTranslationKeysRequest) returns (stream WatchTranslationKeysResponse);

  // Takes a stream of translation keys and answers once at the end.
  rpc BatchCreateTranslationKeys(stream BatchCreateTranslationKeysRequest) returns (BatchCreateTranslationKeysResponse);
}

// The request of `CreateTranslationKey`.
message CreateTranslationKeyRequest {
  acme.common.v1.RequestContext context = 1;
  TranslationKey translation_key = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateTranslationKey`.
message CreateTranslationKeyResponse {
  TranslationKey translation_key = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetTranslationKey`.
message GetTranslationKeyRequest {
  acme.common.v1.RequestContext context = 1;
  string translation_key_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTranslationKey`.
message GetTranslationKeyResponse {
  TranslationKey translation_key = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteTranslationKey`.
message DeleteTranslationKeyRequest {
  acme.common.v1.RequestContext context = 1;
  string translation_key_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTranslationKey`.
message DeleteTranslationKeyResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `BatchGetTranslationKeys`.
message BatchGetTranslationKeysRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string translation_key_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetTranslationKeys`.
message BatchGetTranslationKeysResponse {
  repeated TranslationKey translation_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchTranslationKeys`.
message SearchTranslationKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranslationKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchTranslationKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchTranslationKeys`.
message SearchTranslationKeysResponse {
  repeated TranslationKey translation_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchTranslationKeys`.
message WatchTranslationKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranslationKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchTranslationKeysRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchTranslationKeys`.
message WatchTranslationKeysResponse {
  TranslationKey translation_key = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateTranslationKeys`.
message BatchCreateTranslationKeysRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateTranslationKeysRequest.StreamHeader header = 2;
    TranslationKey record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateTranslationKeys`.
message BatchCreateTranslationKeysResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string translation_key_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateTranslationKeysResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}
