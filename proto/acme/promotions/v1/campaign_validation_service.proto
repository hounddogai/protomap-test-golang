syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignValidationServiceProto";
option java_package = "com.acme.promotions.v1";

// Checks campaigns against the rules before anything acts on them.
service CampaignValidationService {
  // Validates a campaign.
  rpc ValidateCampaign(ValidateCampaignRequest) returns (ValidateCampaignResponse);

  // Previews a campaign.
  rpc PreviewCampaign(PreviewCampaignRequest) returns (PreviewCampaignResponse);

  // Checks a campaign.
  rpc CheckCampaignEligibility(CheckCampaignEligibilityRequest) returns (CheckCampaignEligibilityResponse);

  // Normalizes a campaign.
  rpc NormalizeCampaign(NormalizeCampaignRequest) returns (NormalizeCampaignResponse);

  // Explains a campaign.
  rpc ExplainCampaignDecision(ExplainCampaignDecisionRequest) returns (ExplainCampaignDecisionResponse);

  // Scores a campaign.
  rpc ScoreCampaign(ScoreCampaignRequest) returns (ScoreCampaignResponse);

  // Lints a campaign.
  rpc LintCampaigns(LintCampaignsRequest) returns (LintCampaignsResponse);

  // Returns a campaign.
  rpc GetCampaignRules(GetCampaignRulesRequest) returns (GetCampaignRulesResponse);
}

// The request of `ValidateCampaign`.
message ValidateCampaignRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_id = 2;
  Campaign campaign = 3;
  ValidateCampaignRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCampaign`.
message ValidateCampaignResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Campaign campaign = 1;
  ValidateCampaignResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

