syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "RedemptionApprovalServiceProto";
option java_package = "com.acme.promotions.v1";

// Routes redemptions through approval, with escalation and delegation.
service RedemptionApprovalService {
  // Submits a redemption.
  rpc SubmitRedemption(SubmitRedemptionRequest) returns (SubmitRedemptionResponse);

  // Approves a redemption.
  rpc ApproveRedemption(ApproveRedemptionRequest) returns (ApproveRedemptionResponse);

  // Rejects a redemption.
  rpc RejectRedemption(RejectRedemptionRequest) returns (RejectRedemptionResponse);

  // Delegates a redemption.
  rpc DelegateRedemptionApproval(DelegateRedemptionApprovalRequest) returns (DelegateRedemptionApprovalResponse);

  // Recalls a redemption.
  rpc RecallRedemption(RecallRedemptionRequest) returns (RecallRedemptionResponse);

  // Comments a redemption.
  rpc CommentRedemptionApproval(CommentRedemptionApprovalRequest) returns (CommentRedemptionApprovalResponse);
}

// The request of `SubmitRedemption`.
message SubmitRedemptionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  Redemption redemption = 3;
  SubmitRedemptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRedemption`.
message SubmitRedemptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Redemption redemption = 1;
  SubmitRedemptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

