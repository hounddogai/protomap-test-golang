syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "PromotionsProto";
option java_package = "com.acme.promotions.v1";

// Where a promotion is in its lifecycle.
enum PromotionStatus {
  PROMOTION_STATUS_UNSPECIFIED = 0;
  PROMOTION_STATUS_DRAFT = 1;
  PROMOTION_STATUS_ENABLED = 2;
  PROMOTION_STATUS_DISABLED = 3;
  PROMOTION_STATUS_RETIRED = 4;
}

// Where a coupon is in its lifecycle.
enum CouponStatus {
  COUPON_STATUS_UNSPECIFIED = 0;
  COUPON_STATUS_PENDING = 1;
  COUPON_STATUS_OPEN = 2;
  COUPON_STATUS_FROZEN = 3;
  COUPON_STATUS_CLOSED = 4;
}

// Where a campaign is in its lifecycle.
enum CampaignStatus {
  CAMPAIGN_STATUS_UNSPECIFIED = 0;
  CAMPAIGN_STATUS_TENTATIVE = 1;
  CAMPAIGN_STATUS_CONFIRMED = 2;
  CAMPAIGN_STATUS_CANCELLED = 3;
  CAMPAIGN_STATUS_COMPLETED = 4;
}

// Where a redemption is in its lifecycle.
enum RedemptionStatus {
  REDEMPTION_STATUS_UNSPECIFIED = 0;
  REDEMPTION_STATUS_RECEIVED = 1;
  REDEMPTION_STATUS_PROCESSED = 2;
  REDEMPTION_STATUS_DISCARDED = 3;
}

// The condition of a promotion.
message PromotionCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a promotion.
message PromotionDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a promotion.
message PromotionRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a promotion.
message PromotionBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A promotion of the promotions domain.
message Promotion {
  string promotion_id = 1;
  string name = 2;
  string description = 3;
  PromotionStatus status = 4;
  int32 priority = 5;
  repeated PromotionCondition conditions = 6;
  oneof action {
    PromotionDiscountAction discount = 7;
    PromotionRouteAction route = 8;
    PromotionBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The limit of a coupon.
message CouponLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a coupon.
message CouponCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a coupon.
message CouponBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A coupon of the promotions domain.
message Coupon {
  string coupon_id = 1;
  PromotionRef holder = 2;
  CouponStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated CouponLimit limits = 7;
  oneof funding {
    CouponCardFunding card = 8;
    CouponBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The participant of a campaign.
message CampaignParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a campaign.
message CampaignDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a campaign.
message CampaignWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A campaign of the promotions domain.
message Campaign {
  string campaign_id = 1;
  string title = 2;
  CampaignStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated CampaignParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    CampaignDailyRule daily = 7;
    CampaignWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The measurement of a redemption.
message RedemptionMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A redemption of the promotions domain.
message Redemption {
  string redemption_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  CouponRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated RedemptionMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
