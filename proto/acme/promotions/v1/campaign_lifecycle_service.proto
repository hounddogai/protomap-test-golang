syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignLifecycleServiceProto";
option java_package = "com.acme.promotions.v1";

// Moves a campaign between the states of its lifecycle.
service CampaignLifecycleService {
  // Activates a campaign.
  rpc ActivateCampaign(ActivateCampaignRequest) returns (ActivateCampaignResponse);

  // Suspends a campaign.
  rpc SuspendCampaign(SuspendCampaignRequest) returns (SuspendCampaignResponse);

  // Reinstates a campaign.
  rpc ReinstateCampaign(ReinstateCampaignRequest) returns (ReinstateCampaignResponse);

  // Terminates a campaign.
  rpc TerminateCampaign(TerminateCampaignRequest) returns (TerminateCampaignResponse);

  // Renews a campaign.
  rpc RenewCampaign(RenewCampaignRequest) returns (RenewCampaignResponse);

  // Expires a campaign.
  rpc ExpireCampaign(ExpireCampaignRequest) returns (ExpireCampaignResponse);

  // Schedules a campaign.
  rpc ScheduleCampaignExpiry(ScheduleCampaignExpiryRequest) returns (ScheduleCampaignExpiryResponse);
}

// The request of `ActivateCampaign`.
message ActivateCampaignRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_id = 2;
  ActivateCampaignRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCampaign`.
message ActivateCampaignResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Campaign campaign = 1;
  ActivateCampaignResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

