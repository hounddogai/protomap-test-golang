// The request of `StreamCampaignChanges`.
message StreamCampaignChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Campaign change = 2;
    StreamCampaignChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamCampaignChanges`.
message StreamCampaignChangesResponse {
  Campaign campaign = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

