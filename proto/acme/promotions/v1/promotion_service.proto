syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "PromotionServiceProto";
option java_package = "com.acme.promotions.v1";

// Manages promotions: creates, reads, changes, and lists them.
service PromotionService {
  // Creates a promotion.
  rpc CreatePromotion(CreatePromotionRequest) returns (CreatePromotionResponse);

  // Returns a promotion.
  rpc GetPromotion(GetPromotionRequest) returns (GetPromotionResponse);

  // Deletes a promotion.
  rpc DeletePromotion(DeletePromotionRequest) returns (DeletePromotionResponse);

  // Lists promotions a page at a time.
  rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsResponse);

  // Returns several promotions at once.
  rpc BatchGetPromotions(BatchGetPromotionsRequest) returns (BatchGetPromotionsResponse);

  // Lists promotions a page at a time.
  rpc SearchPromotions(SearchPromotionsRequest) returns (SearchPromotionsResponse);

  // Takes a stream of promotions and answers once at the end.
  rpc BatchCreatePromotions(stream BatchCreatePromotionsRequest) returns (BatchCreatePromotionsResponse);

  // Creates a promotion.
  rpc ClonePromotion(ClonePromotionRequest) returns (ClonePromotionResponse);
}

// The request of `CreatePromotion`.
message CreatePromotionRequest {
  acme.common.v1.RequestContext context = 1;
  Promotion promotion = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreatePromotion`.
message CreatePromotionResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetPromotion`.
message GetPromotionRequest {
  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPromotion`.
message GetPromotionResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeletePromotion`.
message DeletePromotionRequest {
  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePromotion`.
message DeletePromotionResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListPromotions`.
message ListPromotionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPromotionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPromotions`.
message ListPromotionsResponse {
  repeated Promotion promotions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetPromotions`.
message BatchGetPromotionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string promotion_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetPromotions`.
message BatchGetPromotionsResponse {
  repeated Promotion promotions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchPromotions`.
message SearchPromotionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchPromotionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchPromotions`.
message SearchPromotionsResponse {
  repeated Promotion promotions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchCreatePromotions`.
message BatchCreatePromotionsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreatePromotionsRequest.StreamHeader header = 2;
    Promotion record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreatePromotions`.
message BatchCreatePromotionsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string promotion_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreatePromotionsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ClonePromotion`.
message ClonePromotionRequest {
  acme.common.v1.RequestContext context = 1;
  Promotion promotion = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `ClonePromotion`.
message ClonePromotionResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}
