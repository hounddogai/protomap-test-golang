syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "RedemptionLifecycleServiceProto";
option java_package = "com.acme.promotions.v1";

// Moves a redemption between the states of its lifecycle.
service RedemptionLifecycleService {
  // Activates a redemption.
  rpc ActivateRedemption(ActivateRedemptionRequest) returns (ActivateRedemptionResponse);

  // Suspends a redemption.
  rpc SuspendRedemption(SuspendRedemptionRequest) returns (SuspendRedemptionResponse);

  // Terminates a redemption.
  rpc TerminateRedemption(TerminateRedemptionRequest) returns (TerminateRedemptionResponse);

  // Renews a redemption.
  rpc RenewRedemption(RenewRedemptionRequest) returns (RenewRedemptionResponse);

  // Expires a redemption.
  rpc ExpireRedemption(ExpireRedemptionRequest) returns (ExpireRedemptionResponse);

  // Schedules a redemption.
  rpc ScheduleRedemptionExpiry(ScheduleRedemptionExpiryRequest) returns (ScheduleRedemptionExpiryResponse);
}

// The request of `ActivateRedemption`.
message ActivateRedemptionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  ActivateRedemptionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRedemption`.
message ActivateRedemptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Redemption redemption = 1;
  ActivateRedemptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

