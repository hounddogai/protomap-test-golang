syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "PromotionLifecycleServiceProto";
option java_package = "com.acme.promotions.v1";

// Moves a promotion between the states of its lifecycle.
service PromotionLifecycleService {
  // Activates a promotion.
  rpc ActivatePromotion(ActivatePromotionRequest) returns (ActivatePromotionResponse);

  // Suspends a promotion.
  rpc SuspendPromotion(SuspendPromotionRequest) returns (SuspendPromotionResponse);

  // Reinstates a promotion.
  rpc ReinstatePromotion(ReinstatePromotionRequest) returns (ReinstatePromotionResponse);

  // Terminates a promotion.
  rpc TerminatePromotion(TerminatePromotionRequest) returns (TerminatePromotionResponse);

  // Expires a promotion.
  rpc ExpirePromotion(ExpirePromotionRequest) returns (ExpirePromotionResponse);

  // Returns a promotion.
  rpc GetPromotionLifecycle(GetPromotionLifecycleRequest) returns (GetPromotionLifecycleResponse);

  // Schedules a promotion.
  rpc SchedulePromotionExpiry(SchedulePromotionExpiryRequest) returns (SchedulePromotionExpiryResponse);
}

// The request of `ActivatePromotion`.
message ActivatePromotionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  ActivatePromotionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePromotion`.
message ActivatePromotionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Promotion promotion = 1;
  ActivatePromotionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

