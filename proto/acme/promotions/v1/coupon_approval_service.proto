syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CouponApprovalServiceProto";
option java_package = "com.acme.promotions.v1";

// Routes coupons through approval, with escalation and delegation.
service CouponApprovalService {
  // Submits a coupon.
  rpc SubmitCoupon(SubmitCouponRequest) returns (SubmitCouponResponse);

  // Approves a coupon.
  rpc ApproveCoupon(ApproveCouponRequest) returns (ApproveCouponResponse);

  // Rejects a coupon.
  rpc RejectCoupon(RejectCouponRequest) returns (RejectCouponResponse);

  // Escalates a coupon.
  rpc EscalateCoupon(EscalateCouponRequest) returns (EscalateCouponResponse);

  // Lists coupons a page at a time.
  rpc ListPendingCoupons(ListPendingCouponsRequest) returns (ListPendingCouponsResponse);

  // Delegates a coupon.
  rpc DelegateCouponApproval(DelegateCouponApprovalRequest) returns (DelegateCouponApprovalResponse);

  // Recalls a coupon.
  rpc RecallCoupon(RecallCouponRequest) returns (RecallCouponResponse);

  // Returns a coupon.
  rpc GetCouponApprovalStatus(GetCouponApprovalStatusRequest) returns (GetCouponApprovalStatusResponse);
}

// The request of `SubmitCoupon`.
message SubmitCouponRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  Coupon coupon = 3;
  SubmitCouponRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCoupon`.
message SubmitCouponResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coupon coupon = 1;
  SubmitCouponResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

