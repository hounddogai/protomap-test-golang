syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CouponReportingServiceProto";
option java_package = "com.acme.promotions.v1";

// Builds and schedules reports about coupons.
service CouponReportingService {
  // Generates a coupon.
  rpc GenerateCouponReport(GenerateCouponReportRequest) returns (GenerateCouponReportResponse);

  // Returns a coupon.
  rpc FetchCouponReport(FetchCouponReportRequest) returns (FetchCouponReportResponse);

  // Schedules a coupon.
  rpc ScheduleCouponReport(ScheduleCouponReportRequest) returns (ScheduleCouponReportResponse);

  // Streams the changes of coupons as they happen.
  rpc StreamCouponMetrics(StreamCouponMetricsRequest) returns (stream StreamCouponMetricsResponse);

  // Lists coupons a page at a time.
  rpc ListCouponReports(ListCouponReportsRequest) returns (ListCouponReportsResponse);

  // Shares a coupon.
  rpc ShareCouponReport(ShareCouponReportRequest) returns (ShareCouponReportResponse);

  // Counts coupons by status.
  rpc CountCouponTotals(CountCouponTotalsRequest) returns (CountCouponTotalsResponse);

  // Deletes a coupon.
  rpc DeleteCouponReport(DeleteCouponReportRequest) returns (DeleteCouponReportResponse);
}

// The request of `GenerateCouponReport`.
message GenerateCouponReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  GenerateCouponReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateCouponReport`.
message GenerateCouponReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchCouponReport`.
message FetchCouponReportRequest {
  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchCouponReport`.
message FetchCouponReportResponse {
  Coupon coupon = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleCouponReport`.
message ScheduleCouponReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  ScheduleCouponReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleCouponReport`.
message ScheduleCouponReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamCouponMetrics`.
message StreamCouponMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CouponStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamCouponMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamCouponMetrics`.
message StreamCouponMetricsResponse {
  Coupon coupon = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCouponReports`.
message ListCouponReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CouponStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCouponReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCouponReports`.
message ListCouponReportsResponse {
  repeated Coupon coupons = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareCouponReport`.
message ShareCouponReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  ShareCouponReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareCouponReport`.
message ShareCouponReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coupon coupon = 1;
  ShareCouponReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCouponTotals`.
message CountCouponTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CouponStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCouponTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCouponTotals`.
message CountCouponTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteCouponReport`.
message DeleteCouponReportRequest {
  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCouponReport`.
message DeleteCouponReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
