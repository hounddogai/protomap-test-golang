syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "RedemptionSyncServiceProto";
option java_package = "com.acme.promotions.v1";

// Keeps redemptions in step with the systems of record in other regions.
service RedemptionSyncService {
  // Syncs a redemption.
  rpc SyncRedemptions(SyncRedemptionsRequest) returns (SyncRedemptionsResponse);

  // Pushs a redemption.
  rpc PushRedemption(PushRedemptionRequest) returns (PushRedemptionResponse);

  // Pulls a redemption.
  rpc PullRedemptions(PullRedemptionsRequest) returns (PullRedemptionsResponse);

  // Reconciles a redemption.
  rpc ReconcileRedemptions(ReconcileRedemptionsRequest) returns (ReconcileRedemptionsResponse);

  // Resolves a redemption.
  rpc ResolveRedemptionConflict(ResolveRedemptionConflictRequest) returns (ResolveRedemptionConflictResponse);

  // Returns a redemption.
  rpc GetRedemptionSyncState(GetRedemptionSyncStateRequest) returns (GetRedemptionSyncStateResponse);

  // Lists redemptions a page at a time.
  rpc ListRedemptionConflicts(ListRedemptionConflictsRequest) returns (ListRedemptionConflictsResponse);
}

// The request of `SyncRedemptions`.
message SyncRedemptionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  Redemption redemption = 3;
  SyncRedemptionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncRedemptions`.
message SyncRedemptionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Redemption redemption = 1;
  SyncRedemptionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

