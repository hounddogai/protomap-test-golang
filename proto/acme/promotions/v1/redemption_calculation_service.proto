syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "RedemptionCalculationServiceProto";
option java_package = "com.acme.promotions.v1";

// Computes the figures of a redemption, such as totals, taxes, and estimates.
service RedemptionCalculationService {
  // Calculates a redemption.
  rpc CalculateRedemption(CalculateRedemptionRequest) returns (CalculateRedemptionResponse);

  // Estimates a redemption.
  rpc EstimateRedemption(EstimateRedemptionRequest) returns (EstimateRedemptionResponse);

  // Quotes a redemption.
  rpc QuoteRedemption(QuoteRedemptionRequest) returns (QuoteRedemptionResponse);

  // Compares a redemption.
  rpc CompareRedemptionOptions(CompareRedemptionOptionsRequest) returns (CompareRedemptionOptionsResponse);

  // Recalculates a redemption.
  rpc RecalculateRedemptions(RecalculateRedemptionsRequest) returns (RecalculateRedemptionsResponse);

  // Simulates a redemption.
  rpc SimulateRedemption(SimulateRedemptionRequest) returns (SimulateRedemptionResponse);

  // Explains a redemption.
  rpc ExplainRedemptionCalculation(ExplainRedemptionCalculationRequest) returns (ExplainRedemptionCalculationResponse);

  // Returns a redemption.
  rpc GetRedemptionRates(GetRedemptionRatesRequest) returns (GetRedemptionRatesResponse);
}

// The request of `CalculateRedemption`.
message CalculateRedemptionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  Redemption redemption = 3;
  CalculateRedemptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRedemption`.
message CalculateRedemptionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRedemptionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Redemption redemption = 1;
  CalculateRedemptionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

