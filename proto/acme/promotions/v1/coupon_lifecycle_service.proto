syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CouponLifecycleServiceProto";
option java_package = "com.acme.promotions.v1";

// Moves a coupon between the states of its lifecycle.
service CouponLifecycleService {
  // Activates a coupon.
  rpc ActivateCoupon(ActivateCouponRequest) returns (ActivateCouponResponse);

  // Suspends a coupon.
  rpc SuspendCoupon(SuspendCouponRequest) returns (SuspendCouponResponse);

  // Reinstates a coupon.
  rpc ReinstateCoupon(ReinstateCouponRequest) returns (ReinstateCouponResponse);

  // Terminates a coupon.
  rpc TerminateCoupon(TerminateCouponRequest) returns (TerminateCouponResponse);

  // Renews a coupon.
  rpc RenewCoupon(RenewCouponRequest) returns (RenewCouponResponse);

  // Expires a coupon.
  rpc ExpireCoupon(ExpireCouponRequest) returns (ExpireCouponResponse);

  // Schedules a coupon.
  rpc ScheduleCouponExpiry(ScheduleCouponExpiryRequest) returns (ScheduleCouponExpiryResponse);
}

// The request of `ActivateCoupon`.
message ActivateCouponRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  ActivateCouponRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCoupon`.
message ActivateCouponResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coupon coupon = 1;
  ActivateCouponResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

