syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignCalculationServiceProto";
option java_package = "com.acme.promotions.v1";

// Computes the figures of a campaign, such as totals, taxes, and estimates.
service CampaignCalculationService {
  // Calculates a campaign.
  rpc CalculateCampaign(CalculateCampaignRequest) returns (CalculateCampaignResponse);

  // Estimates a campaign.
  rpc EstimateCampaign(EstimateCampaignRequest) returns (EstimateCampaignResponse);

  // Quotes a campaign.
  rpc QuoteCampaign(QuoteCampaignRequest) returns (QuoteCampaignResponse);

  // Compares a campaign.
  rpc CompareCampaignOptions(CompareCampaignOptionsRequest) returns (CompareCampaignOptionsResponse);

  // Recalculates a campaign.
  rpc RecalculateCampaigns(RecalculateCampaignsRequest) returns (RecalculateCampaignsResponse);

  // Explains a campaign.
  rpc ExplainCampaignCalculation(ExplainCampaignCalculationRequest) returns (ExplainCampaignCalculationResponse);

  // Returns a campaign.
  rpc GetCampaignRates(GetCampaignRatesRequest) returns (GetCampaignRatesResponse);
}

// The request of `CalculateCampaign`.
message CalculateCampaignRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_id = 2;
  Campaign campaign = 3;
  CalculateCampaignRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCampaign`.
message CalculateCampaignResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCampaignResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Campaign campaign = 1;
  CalculateCampaignResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

