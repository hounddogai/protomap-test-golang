syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "PromotionQueryServiceProto";
option java_package = "com.acme.promotions.v1";

// Answers read-only questions about promotions, for screens and reports.
service PromotionQueryService {
  // Returns a promotion.
  rpc LookupPromotion(LookupPromotionRequest) returns (LookupPromotionResponse);

  // Lists promotions a page at a time.
  rpc BrowsePromotions(BrowsePromotionsRequest) returns (BrowsePromotionsResponse);

  // Counts promotions by status.
  rpc CountPromotions(CountPromotionsRequest) returns (CountPromotionsResponse);

  // Returns several promotions at once.
  rpc ResolvePromotions(ResolvePromotionsRequest) returns (ResolvePromotionsResponse);

  // Streams every matching promotion.
  rpc ExportPromotions(ExportPromotionsRequest) returns (stream ExportPromotionsResponse);

  // Lists promotions a page at a time.
  rpc SuggestPromotions(SuggestPromotionsRequest) returns (SuggestPromotionsResponse);

  // Returns a promotion.
  rpc PeekPromotion(PeekPromotionRequest) returns (PeekPromotionResponse);
}

// The request of `LookupPromotion`.
message LookupPromotionRequest {
  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPromotion`.
message LookupPromotionResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePromotions`.
message BrowsePromotionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePromotionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePromotions`.
message BrowsePromotionsResponse {
  repeated Promotion promotions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPromotions`.
message CountPromotionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPromotionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPromotions`.
message CountPromotionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePromotions`.
message ResolvePromotionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string promotion_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePromotions`.
message ResolvePromotionsResponse {
  repeated Promotion promotions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPromotions`.
message ExportPromotionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPromotionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPromotions`.
message ExportPromotionsResponse {
  Promotion promotion = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPromotions`.
message SuggestPromotionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPromotionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPromotions`.
message SuggestPromotionsResponse {
  repeated Promotion promotions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPromotion`.
message PeekPromotionRequest {
  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPromotion`.
message PeekPromotionResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}
