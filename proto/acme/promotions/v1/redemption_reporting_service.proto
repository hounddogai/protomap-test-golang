syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "RedemptionReportingServiceProto";
option java_package = "com.acme.promotions.v1";

// Builds and schedules reports about redemptions.
service RedemptionReportingService {
  // Generates a redemption.
  rpc GenerateRedemptionReport(GenerateRedemptionReportRequest) returns (GenerateRedemptionReportResponse);

  // Returns a redemption.
  rpc FetchRedemptionReport(FetchRedemptionReportRequest) returns (FetchRedemptionReportResponse);

  // Schedules a redemption.
  rpc ScheduleRedemptionReport(ScheduleRedemptionReportRequest) returns (ScheduleRedemptionReportResponse);

  // Streams the changes of redemptions as they happen.
  rpc StreamRedemptionMetrics(StreamRedemptionMetricsRequest) returns (stream StreamRedemptionMetricsResponse);

  // Lists redemptions a page at a time.
  rpc ListRedemptionReports(ListRedemptionReportsRequest) returns (ListRedemptionReportsResponse);

  // Shares a redemption.
  rpc ShareRedemptionReport(ShareRedemptionReportRequest) returns (ShareRedemptionReportResponse);

  // Counts redemptions by status.
  rpc CountRedemptionTotals(CountRedemptionTotalsRequest) returns (CountRedemptionTotalsResponse);

  // Deletes a redemption.
  rpc DeleteRedemptionReport(DeleteRedemptionReportRequest) returns (DeleteRedemptionReportResponse);
}

// The request of `GenerateRedemptionReport`.
message GenerateRedemptionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  GenerateRedemptionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRedemptionReport`.
message GenerateRedemptionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRedemptionReport`.
message FetchRedemptionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRedemptionReport`.
message FetchRedemptionReportResponse {
  Redemption redemption = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleRedemptionReport`.
message ScheduleRedemptionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  ScheduleRedemptionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRedemptionReport`.
message ScheduleRedemptionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamRedemptionMetrics`.
message StreamRedemptionMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RedemptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRedemptionMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRedemptionMetrics`.
message StreamRedemptionMetricsResponse {
  Redemption redemption = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRedemptionReports`.
message ListRedemptionReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RedemptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRedemptionReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRedemptionReports`.
message ListRedemptionReportsResponse {
  repeated Redemption redemptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRedemptionReport`.
message ShareRedemptionReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  ShareRedemptionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRedemptionReport`.
message ShareRedemptionReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Redemption redemption = 1;
  ShareRedemptionReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRedemptionTotals`.
message CountRedemptionTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RedemptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRedemptionTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRedemptionTotals`.
message CountRedemptionTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteRedemptionReport`.
message DeleteRedemptionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRedemptionReport`.
message DeleteRedemptionReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
