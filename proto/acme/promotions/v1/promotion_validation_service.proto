  }

  Promotion promotion = 1;
  LintPromotionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPromotionRules`.
message GetPromotionRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPromotionRules`.
message GetPromotionRulesResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}
