syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "RedemptionValidationServiceProto";
option java_package = "com.acme.promotions.v1";

// Checks redemptions against the rules before anything acts on them.
service RedemptionValidationService {
  // Validates a redemption.
  rpc ValidateRedemption(ValidateRedemptionRequest) returns (ValidateRedemptionResponse);

  // Previews a redemption.
  rpc PreviewRedemption(PreviewRedemptionRequest) returns (PreviewRedemptionResponse);

  // Checks a redemption.
  rpc CheckRedemptionEligibility(CheckRedemptionEligibilityRequest) returns (CheckRedemptionEligibilityResponse);

  // Normalizes a redemption.
  rpc NormalizeRedemption(NormalizeRedemptionRequest) returns (NormalizeRedemptionResponse);

  // Explains a redemption.
  rpc ExplainRedemptionDecision(ExplainRedemptionDecisionRequest) returns (ExplainRedemptionDecisionResponse);

  // Scores a redemption.
  rpc ScoreRedemption(ScoreRedemptionRequest) returns (ScoreRedemptionResponse);

  // Lints a redemption.
  rpc LintRedemptions(LintRedemptionsRequest) returns (LintRedemptionsResponse);

  // Returns a redemption.
  rpc GetRedemptionRules(GetRedemptionRulesRequest) returns (GetRedemptionRulesResponse);
}

// The request of `ValidateRedemption`.
message ValidateRedemptionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string redemption_id = 2;
  Redemption redemption = 3;
  ValidateRedemptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRedemption`.
message ValidateRedemptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Redemption redemption = 1;
  ValidateRedemptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

