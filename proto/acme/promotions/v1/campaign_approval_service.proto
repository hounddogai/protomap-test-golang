syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignApprovalServiceProto";
option java_package = "com.acme.promotions.v1";

// Routes campaigns through approval, with escalation and delegation.
service CampaignApprovalService {
  // Submits a campaign.
  rpc SubmitCampaign(SubmitCampaignRequest) returns (SubmitCampaignResponse);

  // Approves a campaign.
  rpc ApproveCampaign(ApproveCampaignRequest) returns (ApproveCampaignResponse);

  // Rejects a campaign.
  rpc RejectCampaign(RejectCampaignRequest) returns (RejectCampaignResponse);

  // Escalates a campaign.
  rpc EscalateCampaign(EscalateCampaignRequest) returns (EscalateCampaignResponse);

  // Lists campaigns a page at a time.
  rpc ListPendingCampaigns(ListPendingCampaignsRequest) returns (ListPendingCampaignsResponse);

  // Comments a campaign.
  rpc CommentCampaignApproval(CommentCampaignApprovalRequest) returns (CommentCampaignApprovalResponse);
}

// The request of `SubmitCampaign`.
message SubmitCampaignRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_id = 2;
  Campaign campaign = 3;
  SubmitCampaignRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCampaign`.
message SubmitCampaignResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Campaign campaign = 1;
  SubmitCampaignResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

