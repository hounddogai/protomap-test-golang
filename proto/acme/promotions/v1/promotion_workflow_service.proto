option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "PromotionWorkflowServiceProto";
option java_package = "com.acme.promotions.v1";

// Runs the long-lived workflow that takes a promotion from start to finish.
service PromotionWorkflowService {
  // Starts a promotion.
  rpc StartPromotionWorkflow(StartPromotionWorkflowRequest) returns (StartPromotionWorkflowResponse);

  // Advances a promotion.
  rpc AdvancePromotionWorkflow(AdvancePromotionWorkflowRequest) returns (AdvancePromotionWorkflowResponse);

  // Cancels a promotion.
  rpc CancelPromotionWorkflow(CancelPromotionWorkflowRequest) returns (CancelPromotionWorkflowResponse);

  // Retrys a promotion.
  rpc RetryPromotionWorkflow(RetryPromotionWorkflowRequest) returns (RetryPromotionWorkflowResponse);

  // Pauses a promotion.
  rpc PausePromotionWorkflow(PausePromotionWorkflowRequest) returns (PausePromotionWorkflowResponse);

  // Resumes a promotion.
  rpc ResumePromotionWorkflow(ResumePromotionWorkflowRequest) returns (ResumePromotionWorkflowResponse);

  // Returns a promotion.
  rpc InspectPromotionWorkflow(InspectPromotionWorkflowRequest) returns (InspectPromotionWorkflowResponse);

  // Lists promotions a page at a time.
  rpc ListPromotionWorkflows(ListPromotionWorkflowsRequest) returns (ListPromotionWorkflowsResponse);

  // Signals a promotion.
  rpc SignalPromotionWorkflow(SignalPromotionWorkflowRequest) returns (SignalPromotionWorkflowResponse);
}

// The request of `StartPromotionWorkflow`.
message StartPromotionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  Promotion promotion = 3;
  StartPromotionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPromotionWorkflow`.
message StartPromotionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Promotion promotion = 1;
  StartPromotionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

