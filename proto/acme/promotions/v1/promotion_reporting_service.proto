syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "PromotionReportingServiceProto";
option java_package = "com.acme.promotions.v1";

// Builds and schedules reports about promotions.
service PromotionReportingService {
  // Generates a promotion.
  rpc GeneratePromotionReport(GeneratePromotionReportRequest) returns (GeneratePromotionReportResponse);

  // Returns a promotion.
  rpc FetchPromotionReport(FetchPromotionReportRequest) returns (FetchPromotionReportResponse);

  // Schedules a promotion.
  rpc SchedulePromotionReport(SchedulePromotionReportRequest) returns (SchedulePromotionReportResponse);

  // Streams the changes of promotions as they happen.
  rpc StreamPromotionMetrics(StreamPromotionMetricsRequest) returns (stream StreamPromotionMetricsResponse);

  // Shares a promotion.
  rpc SharePromotionReport(SharePromotionReportRequest) returns (SharePromotionReportResponse);

  // Counts promotions by status.
  rpc CountPromotionTotals(CountPromotionTotalsRequest) returns (CountPromotionTotalsResponse);
}

// The request of `GeneratePromotionReport`.
message GeneratePromotionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  GeneratePromotionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePromotionReport`.
message GeneratePromotionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPromotionReport`.
message FetchPromotionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPromotionReport`.
message FetchPromotionReportResponse {
  Promotion promotion = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePromotionReport`.
message SchedulePromotionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  SchedulePromotionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePromotionReport`.
message SchedulePromotionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPromotionMetrics`.
message StreamPromotionMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPromotionMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPromotionMetrics`.
message StreamPromotionMetricsResponse {
  Promotion promotion = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SharePromotionReport`.
message SharePromotionReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string promotion_id = 2;
  SharePromotionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePromotionReport`.
message SharePromotionReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Promotion promotion = 1;
  SharePromotionReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPromotionTotals`.
message CountPromotionTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PromotionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPromotionTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPromotionTotals`.
message CountPromotionTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
