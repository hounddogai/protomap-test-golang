syntax = "proto3";

package acme.promotions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/promotions/v1/promotions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Promotions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/promotions/v1;promotionsv1";
option java_multiple_files = true;
option java_outer_classname = "CouponWorkflowServiceProto";
option java_package = "com.acme.promotions.v1";

// Runs the long-lived workflow that takes a coupon from start to finish.
service CouponWorkflowService {
  // Starts a coupon.
  rpc StartCouponWorkflow(StartCouponWorkflowRequest) returns (StartCouponWorkflowResponse);

  // Advances a coupon.
  rpc AdvanceCouponWorkflow(AdvanceCouponWorkflowRequest) returns (AdvanceCouponWorkflowResponse);

  // Cancels a coupon.
  rpc CancelCouponWorkflow(CancelCouponWorkflowRequest) returns (CancelCouponWorkflowResponse);

  // Retrys a coupon.
  rpc RetryCouponWorkflow(RetryCouponWorkflowRequest) returns (RetryCouponWorkflowResponse);

  // Pauses a coupon.
  rpc PauseCouponWorkflow(PauseCouponWorkflowRequest) returns (PauseCouponWorkflowResponse);

  // Resumes a coupon.
  rpc ResumeCouponWorkflow(ResumeCouponWorkflowRequest) returns (ResumeCouponWorkflowResponse);

  // Returns a coupon.
  rpc InspectCouponWorkflow(InspectCouponWorkflowRequest) returns (InspectCouponWorkflowResponse);

  // Lists coupons a page at a time.
  rpc ListCouponWorkflows(ListCouponWorkflowsRequest) returns (ListCouponWorkflowsResponse);

  // Signals a coupon.
  rpc SignalCouponWorkflow(SignalCouponWorkflowRequest) returns (SignalCouponWorkflowResponse);
}

// The request of `StartCouponWorkflow`.
message StartCouponWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coupon_id = 2;
  Coupon coupon = 3;
  StartCouponWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCouponWorkflow`.
message StartCouponWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coupon coupon = 1;
  StartCouponWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

