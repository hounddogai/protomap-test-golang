syntax = "proto3";

package acme.tours.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/venues/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Tours.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/tours/v1;toursv1";
option java_multiple_files = true;
option java_outer_classname = "ToursProto";
option java_package = "com.acme.tours.v1";

// Where a tour is in its lifecycle.
enum TourStatus {
  TOUR_STATUS_UNSPECIFIED = 0;
  TOUR_STATUS_TENTATIVE = 1;
  TOUR_STATUS_CONFIRMED = 2;
  TOUR_STATUS_CANCELLED = 3;
  TOUR_STATUS_COMPLETED = 4;
}

// Where a tour stop is in its lifecycle.
enum TourStopStatus {
  TOUR_STOP_STATUS_UNSPECIFIED = 0;
  TOUR_STOP_STATUS_TENTATIVE = 1;
  TOUR_STOP_STATUS_CONFIRMED = 2;
  TOUR_STOP_STATUS_CANCELLED = 3;
  TOUR_STOP_STATUS_COMPLETED = 4;
}

// Where a tour budget is in its lifecycle.
enum TourBudgetStatus {
  TOUR_BUDGET_STATUS_UNSPECIFIED = 0;
  TOUR_BUDGET_STATUS_PENDING = 1;
  TOUR_BUDGET_STATUS_OPEN = 2;
  TOUR_BUDGET_STATUS_FROZEN = 3;
  TOUR_BUDGET_STATUS_CLOSED = 4;
}

// The participant of a tour.
message TourParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a tour.
message TourDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a tour.
message TourWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A tour of the tours domain.
message Tour {
  string tour_id = 1;
  string title = 2;
  TourStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated TourParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    TourDailyRule daily = 7;
    TourWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The participant of a tour stop.
message TourStopParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a tour stop.
message TourStopDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a tour stop.
message TourStopWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A tour stop of the tours domain.
message TourStop {
  string tour_stop_id = 1;
  string title = 2;
  TourStopStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated TourStopParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    TourStopDailyRule daily = 7;
    TourStopWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The limit of a tour budget.
message TourBudgetLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a tour budget.
message TourBudgetCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a tour budget.
message TourBudgetBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A tour budget of the tours domain.
message TourBudget {
  string tour_budget_id = 1;
  acme.venues.v1.VenueRef holder = 2;
  TourBudgetStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated TourBudgetLimit limits = 7;
  oneof funding {
    TourBudgetCardFunding card = 8;
    TourBudgetBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}
