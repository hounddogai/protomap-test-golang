syntax = "proto3";

package acme.tours.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/tours/v1/tours.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Tours.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/tours/v1;toursv1";
option java_multiple_files = true;
option java_outer_classname = "TourQueryServiceProto";
option java_package = "com.acme.tours.v1";

// Answers read-only questions about tours, for screens and reports.
service TourQueryService {
  // Returns a tour.
  rpc LookupTour(LookupTourRequest) returns (LookupTourResponse);

  // Lists tours a page at a time.
  rpc BrowseTours(BrowseToursRequest) returns (BrowseToursResponse);

  // Lists tours a page at a time.
  rpc FindTours(FindToursRequest) returns (FindToursResponse);

  // Counts tours by status.
  rpc CountTours(CountToursRequest) returns (CountToursResponse);

  // Returns several tours at once.
  rpc ResolveTours(ResolveToursRequest) returns (ResolveToursResponse);

  // Streams every matching tour.
  rpc ExportTours(ExportToursRequest) returns (stream ExportToursResponse);

  // Summarizes a tour.
  rpc SummarizeTours(SummarizeToursRequest) returns (SummarizeToursResponse);
}

// The request of `LookupTour`.
message LookupTourRequest {
  acme.common.v1.RequestContext context = 1;
  string tour_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupTour`.
message LookupTourResponse {
  Tour tour = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseTours`.
message BrowseToursRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TourStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseToursRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseTours`.
message BrowseToursResponse {
  repeated Tour tours = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindTours`.
message FindToursRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TourStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindToursRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindTours`.
message FindToursResponse {
  repeated Tour tours = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTours`.
message CountToursRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TourStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountToursRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTours`.
message CountToursResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveTours`.
message ResolveToursRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string tour_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveTours`.
message ResolveToursResponse {
  repeated Tour tours = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportTours`.
message ExportToursRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TourStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportToursRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportTours`.
message ExportToursResponse {
  Tour tour = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeTours`.
message SummarizeToursRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tour_id = 2;
  SummarizeToursRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeTours`.
message SummarizeToursResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}
