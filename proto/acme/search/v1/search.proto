syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/search/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchProto";
option java_package = "com.acme.search.v1";

// Where a search index is in its lifecycle.
enum SearchIndexStatus {
  SEARCH_INDEX_STATUS_UNSPECIFIED = 0;
  SEARCH_INDEX_STATUS_PLANNED = 1;
  SEARCH_INDEX_STATUS_AVAILABLE = 2;
  SEARCH_INDEX_STATUS_RESERVED = 3;
  SEARCH_INDEX_STATUS_RETIRED = 4;
}

// Where a search query is in its lifecycle.
enum SearchQueryStatus {
  SEARCH_QUERY_STATUS_UNSPECIFIED = 0;
  SEARCH_QUERY_STATUS_RECEIVED = 1;
  SEARCH_QUERY_STATUS_PROCESSED = 2;
  SEARCH_QUERY_STATUS_DISCARDED = 3;
}

// Where a synonym is in its lifecycle.
enum SynonymStatus {
  SYNONYM_STATUS_UNSPECIFIED = 0;
  SYNONYM_STATUS_DRAFT = 1;
  SYNONYM_STATUS_ENABLED = 2;
  SYNONYM_STATUS_DISABLED = 3;
  SYNONYM_STATUS_RETIRED = 4;
}

// The dimensions of a search index.
message SearchIndexDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a search index.
message SearchIndexComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A search index of the search domain.
message SearchIndex {
  string search_index_id = 1;
  string code = 2;
  string name = 3;
  SearchIndexStatus status = 4;
  repeated string category_path = 5;
  SearchIndexDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, SearchIndexComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The measurement of a search query.
message SearchQueryMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A search query of the search domain.
message SearchQuery {
  string search_query_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  SearchIndexRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated SearchQueryMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of a synonym.
message SynonymCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a synonym.
message SynonymDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a synonym.
message SynonymRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a synonym.
message SynonymBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A synonym of the search domain.
message Synonym {
  string synonym_id = 1;
  string name = 2;
  string description = 3;
  SynonymStatus status = 4;
  int32 priority = 5;
  repeated SynonymCondition conditions = 6;
  oneof action {
    SynonymDiscountAction discount = 7;
    SynonymRouteAction route = 8;
    SynonymBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
