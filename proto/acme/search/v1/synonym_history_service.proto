syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SynonymHistoryServiceProto";
option java_package = "com.acme.search.v1";

// Keeps every version of a synonym and restores earlier ones.
service SynonymHistoryService {
  // Records a synonym.
  rpc RecordSynonymVersion(RecordSynonymVersionRequest) returns (RecordSynonymVersionResponse);

  // Lists synonyms a page at a time.
  rpc ListSynonymVersions(ListSynonymVersionsRequest) returns (ListSynonymVersionsResponse);

  // Returns a synonym.
  rpc GetSynonymVersion(GetSynonymVersionRequest) returns (GetSynonymVersionResponse);

  // Compares a synonym.
  rpc CompareSynonymVersions(CompareSynonymVersionsRequest) returns (CompareSynonymVersionsResponse);

  // Reverts a synonym.
  rpc RevertSynonym(RevertSynonymRequest) returns (RevertSynonymResponse);

  // Annotates a synonym.
  rpc AnnotateSynonymVersion(AnnotateSynonymVersionRequest) returns (AnnotateSynonymVersionResponse);

  // Deletes a synonym.
  rpc PruneSynonymVersions(PruneSynonymVersionsRequest) returns (PruneSynonymVersionsResponse);
}

// The request of `RecordSynonymVersion`.
message RecordSynonymVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  Synonym synonym = 3;
  RecordSynonymVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordSynonymVersion`.
message RecordSynonymVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  RecordSynonymVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListSynonymVersions`.
message ListSynonymVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SynonymStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSynonymVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSynonymVersions`.
message ListSynonymVersionsResponse {
  repeated Synonym synonyms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetSynonymVersion`.
message GetSynonymVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSynonymVersion`.
message GetSynonymVersionResponse {
  Synonym synonym = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareSynonymVersions`.
message CompareSynonymVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  Synonym synonym = 3;
  CompareSynonymVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareSynonymVersions`.
message CompareSynonymVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  CompareSynonymVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertSynonym`.
message RevertSynonymRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  Synonym synonym = 3;
  RevertSynonymRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertSynonym`.
message RevertSynonymResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  RevertSynonymResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateSynonymVersion`.
message AnnotateSynonymVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  Synonym synonym = 3;
  AnnotateSynonymVersionRequest.Details details = 4;
  string reason = 5;
