// The request of `PruneSynonymVersions`.
message PruneSynonymVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneSynonymVersions`.
message PruneSynonymVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
