message GetSynonymSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSynonymSyncState`.
message GetSynonymSyncStateResponse {
  Synonym synonym = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListSynonymConflicts`.
message ListSynonymConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SynonymStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSynonymConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSynonymConflicts`.
message ListSynonymConflictsResponse {
  repeated Synonym synonyms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
