syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchQueryValidationServiceProto";
option java_package = "com.acme.search.v1";

// Checks search queries against the rules before anything acts on them.
service SearchQueryValidationService {
  // Validates a search query.
  rpc ValidateSearchQuery(ValidateSearchQueryRequest) returns (ValidateSearchQueryResponse);

  // Previews a search query.
  rpc PreviewSearchQuery(PreviewSearchQueryRequest) returns (PreviewSearchQueryResponse);

  // Normalizes a search query.
  rpc NormalizeSearchQuery(NormalizeSearchQueryRequest) returns (NormalizeSearchQueryResponse);

  // Explains a search query.
  rpc ExplainSearchQueryDecision(ExplainSearchQueryDecisionRequest) returns (ExplainSearchQueryDecisionResponse);

  // Scores a search query.
  rpc ScoreSearchQuery(ScoreSearchQueryRequest) returns (ScoreSearchQueryResponse);

  // Lints a search query.
  rpc LintSearchQueries(LintSearchQueriesRequest) returns (LintSearchQueriesResponse);

  // Returns a search query.
  rpc GetSearchQueryRules(GetSearchQueryRulesRequest) returns (GetSearchQueryRulesResponse);
}

// The request of `ValidateSearchQuery`.
message ValidateSearchQueryRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  SearchQuery search_query = 3;
  ValidateSearchQueryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSearchQuery`.
message ValidateSearchQueryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchQuery search_query = 1;
  ValidateSearchQueryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

