// The request of `GetSearchQueryRules`.
message GetSearchQueryRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSearchQueryRules`.
message GetSearchQueryRulesResponse {
  SearchQuery search_query = 1;
  acme.common.v1.OperationResult result = 2;
}
