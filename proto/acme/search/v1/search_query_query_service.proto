syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchQueryQueryServiceProto";
option java_package = "com.acme.search.v1";

// Answers read-only questions about search queries, for screens and reports.
service SearchQueryQueryService {
  // Returns a search query.
  rpc LookupSearchQuery(LookupSearchQueryRequest) returns (LookupSearchQueryResponse);

  // Lists search queries a page at a time.
  rpc BrowseSearchQueries(BrowseSearchQueriesRequest) returns (BrowseSearchQueriesResponse);

  // Lists search queries a page at a time.
  rpc FindSearchQueries(FindSearchQueriesRequest) returns (FindSearchQueriesResponse);

  // Counts search queries by status.
  rpc CountSearchQueries(CountSearchQueriesRequest) returns (CountSearchQueriesResponse);

  // Streams every matching search query.
  rpc ExportSearchQueries(ExportSearchQueriesRequest) returns (stream ExportSearchQueriesResponse);

  // Summarizes a search query.
  rpc SummarizeSearchQueries(SummarizeSearchQueriesRequest) returns (SummarizeSearchQueriesResponse);

  // Lists search queries a page at a time.
  rpc SuggestSearchQueries(SuggestSearchQueriesRequest) returns (SuggestSearchQueriesResponse);

  // Returns a search query.
  rpc PeekSearchQuery(PeekSearchQueryRequest) returns (PeekSearchQueryResponse);
}

// The request of `LookupSearchQuery`.
message LookupSearchQueryRequest {
  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSearchQuery`.
message LookupSearchQueryResponse {
  SearchQuery search_query = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSearchQueries`.
message BrowseSearchQueriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchQueryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSearchQueriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSearchQueries`.
message BrowseSearchQueriesResponse {
  repeated SearchQuery search_queries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSearchQueries`.
message FindSearchQueriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchQueryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSearchQueriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSearchQueries`.
message FindSearchQueriesResponse {
  repeated SearchQuery search_queries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSearchQueries`.
message CountSearchQueriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchQueryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSearchQueriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSearchQueries`.
message CountSearchQueriesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSearchQueries`.
message ExportSearchQueriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchQueryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSearchQueriesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSearchQueries`.
message ExportSearchQueriesResponse {
  SearchQuery search_query = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSearchQueries`.
message SummarizeSearchQueriesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  SummarizeSearchQueriesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSearchQueries`.
message SummarizeSearchQueriesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSearchQueries`.
message SuggestSearchQueriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchQueryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSearchQueriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSearchQueries`.
message SuggestSearchQueriesResponse {
  repeated SearchQuery search_queries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSearchQuery`.
message PeekSearchQueryRequest {
  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSearchQuery`.
message PeekSearchQueryResponse {
  SearchQuery search_query = 1;
  acme.common.v1.OperationResult result = 2;
}
