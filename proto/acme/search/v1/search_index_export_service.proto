syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchIndexExportServiceProto";
option java_package = "com.acme.search.v1";

// Exports search indexes to files and other systems.
service SearchIndexExportService {
  // Streams every matching search index.
  rpc StreamSearchIndexExport(StreamSearchIndexExportRequest) returns (stream StreamSearchIndexExportResponse);

  // Returns a search index.
  rpc GetSearchIndexExport(GetSearchIndexExportRequest) returns (GetSearchIndexExportResponse);

  // Cancels a search index.
  rpc CancelSearchIndexExport(CancelSearchIndexExportRequest) returns (CancelSearchIndexExportResponse);

  // Lists search indexes a page at a time.
  rpc ListSearchIndexExports(ListSearchIndexExportsRequest) returns (ListSearchIndexExportsResponse);

  // Schedules a search index.
  rpc ScheduleSearchIndexExport(ScheduleSearchIndexExportRequest) returns (ScheduleSearchIndexExportResponse);

  // Shares a search index.
  rpc ShareSearchIndexExport(ShareSearchIndexExportRequest) returns (ShareSearchIndexExportResponse);
}

// The request of `StreamSearchIndexExport`.
message StreamSearchIndexExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchIndexStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSearchIndexExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamSearchIndexExport`.
message StreamSearchIndexExportResponse {
  SearchIndex search_index = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetSearchIndexExport`.
message GetSearchIndexExportRequest {
  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSearchIndexExport`.
message GetSearchIndexExportResponse {
  SearchIndex search_index = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelSearchIndexExport`.
message CancelSearchIndexExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  CancelSearchIndexExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelSearchIndexExport`.
message CancelSearchIndexExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchIndex search_index = 1;
  CancelSearchIndexExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListSearchIndexExports`.
message ListSearchIndexExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SearchIndexStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSearchIndexExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSearchIndexExports`.
message ListSearchIndexExportsResponse {
  repeated SearchIndex search_indexes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleSearchIndexExport`.
message ScheduleSearchIndexExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  ScheduleSearchIndexExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSearchIndexExport`.
message ScheduleSearchIndexExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareSearchIndexExport`.
message ShareSearchIndexExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  ShareSearchIndexExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSearchIndexExport`.
message ShareSearchIndexExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchIndex search_index = 1;
  ShareSearchIndexExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
