syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SynonymAdminServiceProto";
option java_package = "com.acme.search.v1";

// Operator actions on synonyms that support staff run by hand.
service SynonymAdminService {
  // Archives a synonym.
  rpc ArchiveSynonym(ArchiveSynonymRequest) returns (ArchiveSynonymResponse);

  // Restores a synonym.
  rpc RestoreSynonym(RestoreSynonymRequest) returns (RestoreSynonymResponse);

  // Deletes a synonym.
  rpc PurgeSynonym(PurgeSynonymRequest) returns (PurgeSynonymResponse);

  // Reassigns a synonym.
  rpc ReassignSynonym(ReassignSynonymRequest) returns (ReassignSynonymResponse);

  // Locks a synonym.
  rpc LockSynonym(LockSynonymRequest) returns (LockSynonymResponse);

  // Unlocks a synonym.
  rpc UnlockSynonym(UnlockSynonymRequest) returns (UnlockSynonymResponse);

  // Transfers a synonym.
  rpc TransferSynonym(TransferSynonymRequest) returns (TransferSynonymResponse);

  // Repairs a synonym.
  rpc RepairSynonym(RepairSynonymRequest) returns (RepairSynonymResponse);

  // Returns a synonym.
  rpc InspectSynonym(InspectSynonymRequest) returns (InspectSynonymResponse);
}

// The request of `ArchiveSynonym`.
message ArchiveSynonymRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  ArchiveSynonymRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveSynonym`.
message ArchiveSynonymResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  ArchiveSynonymResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreSynonym`.
message RestoreSynonymRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
