}

// The request of `PurgeSynonym`.
message PurgeSynonymRequest {
  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeSynonym`.
message PurgeSynonymResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignSynonym`.
message ReassignSynonymRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
