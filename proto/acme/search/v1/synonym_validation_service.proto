syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SynonymValidationServiceProto";
option java_package = "com.acme.search.v1";

// Checks synonyms against the rules before anything acts on them.
service SynonymValidationService {
  // Validates a synonym.
  rpc ValidateSynonym(ValidateSynonymRequest) returns (ValidateSynonymResponse);

  // Previews a synonym.
  rpc PreviewSynonym(PreviewSynonymRequest) returns (PreviewSynonymResponse);

  // Checks a synonym.
  rpc CheckSynonymEligibility(CheckSynonymEligibilityRequest) returns (CheckSynonymEligibilityResponse);

  // Normalizes a synonym.
  rpc NormalizeSynonym(NormalizeSynonymRequest) returns (NormalizeSynonymResponse);

  // Explains a synonym.
  rpc ExplainSynonymDecision(ExplainSynonymDecisionRequest) returns (ExplainSynonymDecisionResponse);

  // Scores a synonym.
  rpc ScoreSynonym(ScoreSynonymRequest) returns (ScoreSynonymResponse);

  // Lints a synonym.
  rpc LintSynonyms(LintSynonymsRequest) returns (LintSynonymsResponse);
}

// The request of `ValidateSynonym`.
message ValidateSynonymRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  Synonym synonym = 3;
  ValidateSynonymRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSynonym`.
message ValidateSynonymResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  ValidateSynonymResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

