syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchIndexValidationServiceProto";
option java_package = "com.acme.search.v1";

// Checks search indexes against the rules before anything acts on them.
service SearchIndexValidationService {
  // Validates a search index.
  rpc ValidateSearchIndex(ValidateSearchIndexRequest) returns (ValidateSearchIndexResponse);

  // Previews a search index.
  rpc PreviewSearchIndex(PreviewSearchIndexRequest) returns (PreviewSearchIndexResponse);

  // Checks a search index.
  rpc CheckSearchIndexEligibility(CheckSearchIndexEligibilityRequest) returns (CheckSearchIndexEligibilityResponse);

  // Normalizes a search index.
  rpc NormalizeSearchIndex(NormalizeSearchIndexRequest) returns (NormalizeSearchIndexResponse);

  // Explains a search index.
  rpc ExplainSearchIndexDecision(ExplainSearchIndexDecisionRequest) returns (ExplainSearchIndexDecisionResponse);

  // Scores a search index.
  rpc ScoreSearchIndex(ScoreSearchIndexRequest) returns (ScoreSearchIndexResponse);

  // Lints a search index.
  rpc LintSearchIndexes(LintSearchIndexesRequest) returns (LintSearchIndexesResponse);

  // Returns a search index.
  rpc GetSearchIndexRules(GetSearchIndexRulesRequest) returns (GetSearchIndexRulesResponse);
}

// The request of `ValidateSearchIndex`.
message ValidateSearchIndexRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  SearchIndex search_index = 3;
  ValidateSearchIndexRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSearchIndex`.
message ValidateSearchIndexResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchIndex search_index = 1;
  ValidateSearchIndexResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

