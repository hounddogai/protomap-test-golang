syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SynonymNotificationServiceProto";
option java_package = "com.acme.search.v1";

// Tells the people who follow a synonym what changed.
service SynonymNotificationService {
  // Subscribes a synonym.
  rpc SubscribeSynonymUpdates(SubscribeSynonymUpdatesRequest) returns (SubscribeSynonymUpdatesResponse);

  // Unsubscribes a synonym.
  rpc UnsubscribeSynonymUpdates(UnsubscribeSynonymUpdatesRequest) returns (UnsubscribeSynonymUpdatesResponse);

  // Lists synonyms a page at a time.
  rpc ListSynonymSubscriptions(ListSynonymSubscriptionsRequest) returns (ListSynonymSubscriptionsResponse);

  // Sends a synonym.
  rpc SendSynonymTestNotice(SendSynonymTestNoticeRequest) returns (SendSynonymTestNoticeResponse);

  // Returns a synonym.
  rpc GetSynonymPreferences(GetSynonymPreferencesRequest) returns (GetSynonymPreferencesResponse);

  // Streams the changes of synonyms as they happen.
  rpc StreamSynonymNotices(StreamSynonymNoticesRequest) returns (stream StreamSynonymNoticesResponse);
}

// The request of `SubscribeSynonymUpdates`.
message SubscribeSynonymUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  SubscribeSynonymUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeSynonymUpdates`.
message SubscribeSynonymUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  SubscribeSynonymUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeSynonymUpdates`.
message UnsubscribeSynonymUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  UnsubscribeSynonymUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeSynonymUpdates`.
message UnsubscribeSynonymUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  UnsubscribeSynonymUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListSynonymSubscriptions`.
message ListSynonymSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SynonymStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSynonymSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSynonymSubscriptions`.
message ListSynonymSubscriptionsResponse {
  repeated Synonym synonyms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendSynonymTestNotice`.
message SendSynonymTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  SendSynonymTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendSynonymTestNotice`.
message SendSynonymTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  SendSynonymTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetSynonymPreferences`.
message GetSynonymPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSynonymPreferences`.
message GetSynonymPreferencesResponse {
  Synonym synonym = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamSynonymNotices`.
message StreamSynonymNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SynonymStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSynonymNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSynonymNotices`.
message StreamSynonymNoticesResponse {
  Synonym synonym = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
