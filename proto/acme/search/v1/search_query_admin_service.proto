syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchQueryAdminServiceProto";
option java_package = "com.acme.search.v1";

// Operator actions on search queries that support staff run by hand.
service SearchQueryAdminService {
  // Archives a search query.
  rpc ArchiveSearchQuery(ArchiveSearchQueryRequest) returns (ArchiveSearchQueryResponse);

  // Restores a search query.
  rpc RestoreSearchQuery(RestoreSearchQueryRequest) returns (RestoreSearchQueryResponse);

  // Deletes a search query.
  rpc PurgeSearchQuery(PurgeSearchQueryRequest) returns (PurgeSearchQueryResponse);

  // Reassigns a search query.
  rpc ReassignSearchQuery(ReassignSearchQueryRequest) returns (ReassignSearchQueryResponse);

  // Locks a search query.
  rpc LockSearchQuery(LockSearchQueryRequest) returns (LockSearchQueryResponse);

  // Unlocks a search query.
  rpc UnlockSearchQuery(UnlockSearchQueryRequest) returns (UnlockSearchQueryResponse);

  // Transfers a search query.
  rpc TransferSearchQuery(TransferSearchQueryRequest) returns (TransferSearchQueryResponse);

  // Repairs a search query.
  rpc RepairSearchQuery(RepairSearchQueryRequest) returns (RepairSearchQueryResponse);

  // Returns a search query.
  rpc InspectSearchQuery(InspectSearchQueryRequest) returns (InspectSearchQueryResponse);
}

// The request of `ArchiveSearchQuery`.
message ArchiveSearchQueryRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  ArchiveSearchQueryRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveSearchQuery`.
message ArchiveSearchQueryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchQuery search_query = 1;
  ArchiveSearchQueryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreSearchQuery`.
message RestoreSearchQueryRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
