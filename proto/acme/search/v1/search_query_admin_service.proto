}

// The request of `PurgeSearchQuery`.
message PurgeSearchQueryRequest {
  acme.common.v1.RequestContext context = 1;
  string search_query_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeSearchQuery`.
message PurgeSearchQueryResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

