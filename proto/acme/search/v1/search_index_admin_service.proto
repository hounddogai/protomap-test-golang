  }

  SearchIndex search_index = 1;
  TransferSearchIndexResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RepairSearchIndex`.
message RepairSearchIndexRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  SearchIndex search_index = 3;
  RepairSearchIndexRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RepairSearchIndex`.
message RepairSearchIndexResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchIndex search_index = 1;
  RepairSearchIndexResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `InspectSearchIndex`.
message InspectSearchIndexRequest {
  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectSearchIndex`.
message InspectSearchIndexResponse {
  SearchIndex search_index = 1;
  acme.common.v1.OperationResult result = 2;
}
