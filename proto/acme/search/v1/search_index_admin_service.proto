syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SearchIndexAdminServiceProto";
option java_package = "com.acme.search.v1";

// Operator actions on search indexes that support staff run by hand.
service SearchIndexAdminService {
  // Archives a search index.
  rpc ArchiveSearchIndex(ArchiveSearchIndexRequest) returns (ArchiveSearchIndexResponse);

  // Restores a search index.
  rpc RestoreSearchIndex(RestoreSearchIndexRequest) returns (RestoreSearchIndexResponse);

  // Reassigns a search index.
  rpc ReassignSearchIndex(ReassignSearchIndexRequest) returns (ReassignSearchIndexResponse);

  // Unlocks a search index.
  rpc UnlockSearchIndex(UnlockSearchIndexRequest) returns (UnlockSearchIndexResponse);

  // Transfers a search index.
  rpc TransferSearchIndex(TransferSearchIndexRequest) returns (TransferSearchIndexResponse);

  // Repairs a search index.
  rpc RepairSearchIndex(RepairSearchIndexRequest) returns (RepairSearchIndexResponse);

  // Returns a search index.
  rpc InspectSearchIndex(InspectSearchIndexRequest) returns (InspectSearchIndexResponse);
}

// The request of `ArchiveSearchIndex`.
message ArchiveSearchIndexRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  ArchiveSearchIndexRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveSearchIndex`.
message ArchiveSearchIndexResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SearchIndex search_index = 1;
  ArchiveSearchIndexResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreSearchIndex`.
message RestoreSearchIndexRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string search_index_id = 2;
  RestoreSearchIndexRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `RestoreSearchIndex`.
message RestoreSearchIndexResponse {
