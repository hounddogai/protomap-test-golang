syntax = "proto3";

package acme.search.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/search/v1/search.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Search.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/search/v1;searchv1";
option java_multiple_files = true;
option java_outer_classname = "SynonymExportServiceProto";
option java_package = "com.acme.search.v1";

// Exports synonyms to files and other systems.
service SynonymExportService {
  // Streams every matching synonym.
  rpc StreamSynonymExport(StreamSynonymExportRequest) returns (stream StreamSynonymExportResponse);

  // Returns a synonym.
  rpc GetSynonymExport(GetSynonymExportRequest) returns (GetSynonymExportResponse);

  // Lists synonyms a page at a time.
  rpc ListSynonymExports(ListSynonymExportsRequest) returns (ListSynonymExportsResponse);

  // Schedules a synonym.
  rpc ScheduleSynonymExport(ScheduleSynonymExportRequest) returns (ScheduleSynonymExportResponse);

  // Retrys a synonym.
  rpc RetrySynonymExport(RetrySynonymExportRequest) returns (RetrySynonymExportResponse);

  // Shares a synonym.
  rpc ShareSynonymExport(ShareSynonymExportRequest) returns (ShareSynonymExportResponse);
}

// The request of `StreamSynonymExport`.
message StreamSynonymExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SynonymStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSynonymExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamSynonymExport`.
message StreamSynonymExportResponse {
  Synonym synonym = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetSynonymExport`.
message GetSynonymExportRequest {
  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSynonymExport`.
message GetSynonymExportResponse {
  Synonym synonym = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListSynonymExports`.
message ListSynonymExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SynonymStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSynonymExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSynonymExports`.
message ListSynonymExportsResponse {
  repeated Synonym synonyms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleSynonymExport`.
message ScheduleSynonymExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  ScheduleSynonymExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSynonymExport`.
message ScheduleSynonymExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetrySynonymExport`.
message RetrySynonymExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  Synonym synonym = 3;
  RetrySynonymExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetrySynonymExport`.
message RetrySynonymExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  RetrySynonymExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareSynonymExport`.
message ShareSynonymExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string synonym_id = 2;
  ShareSynonymExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSynonymExport`.
message ShareSynonymExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Synonym synonym = 1;
  ShareSynonymExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
