syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/keymanagement/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeymanagementProto";
option java_package = "com.acme.keymanagement.v1";

// Where a crypto key is in its lifecycle.
enum CryptoKeyStatus {
  CRYPTO_KEY_STATUS_UNSPECIFIED = 0;
  CRYPTO_KEY_STATUS_PENDING = 1;
  CRYPTO_KEY_STATUS_OPEN = 2;
  CRYPTO_KEY_STATUS_FROZEN = 3;
  CRYPTO_KEY_STATUS_CLOSED = 4;
}

// Where a key ring is in its lifecycle.
enum KeyRingStatus {
  KEY_RING_STATUS_UNSPECIFIED = 0;
  KEY_RING_STATUS_ACTIVE = 1;
  KEY_RING_STATUS_INACTIVE = 2;
}

// Where a key rotation is in its lifecycle.
enum KeyRotationStatus {
  KEY_ROTATION_STATUS_UNSPECIFIED = 0;
  KEY_ROTATION_STATUS_TENTATIVE = 1;
  KEY_ROTATION_STATUS_CONFIRMED = 2;
  KEY_ROTATION_STATUS_CANCELLED = 3;
  KEY_ROTATION_STATUS_COMPLETED = 4;
}

// The limit of a crypto key.
message CryptoKeyLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a crypto key.
message CryptoKeyCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a crypto key.
message CryptoKeyBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A crypto key of the keymanagement domain.
message CryptoKey {
  string crypto_key_id = 1;
  KeyRingRef holder = 2;
  CryptoKeyStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated CryptoKeyLimit limits = 7;
  oneof funding {
    CryptoKeyCardFunding card = 8;
    CryptoKeyBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// A key ring of the keymanagement domain.
message KeyRing {
  string key_ring_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated KeyRing children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  KeyRingStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The participant of a key rotation.
message KeyRotationParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a key rotation.
message KeyRotationDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a key rotation.
message KeyRotationWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A key rotation of the keymanagement domain.
message KeyRotation {
  string key_rotation_id = 1;
  string title = 2;
  KeyRotationStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated KeyRotationParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    KeyRotationDailyRule daily = 7;
    KeyRotationWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}
