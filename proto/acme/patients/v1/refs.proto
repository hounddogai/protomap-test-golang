syntax = "proto3";

package acme.patients.v1;

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.patients.v1";

// A reference to a patient of the patients domain.
message PatientRef {
  string patient_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to a medical record of the patients domain.
message MedicalRecordRef {
  string medical_record_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an allergy of the patients domain.
message AllergyRef {
  string allergy_id = 1;
  string display_name = 2;
  string kind = 3;
}
