syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "PatientQueryServiceProto";
option java_package = "com.acme.patients.v1";

// Answers read-only questions about patients, for screens and reports.
service PatientQueryService {
  // Returns a patient.
  rpc LookupPatient(LookupPatientRequest) returns (LookupPatientResponse);

  // Lists patients a page at a time.
  rpc BrowsePatients(BrowsePatientsRequest) returns (BrowsePatientsResponse);

  // Lists patients a page at a time.
  rpc FindPatients(FindPatientsRequest) returns (FindPatientsResponse);

  // Counts patients by status.
  rpc CountPatients(CountPatientsRequest) returns (CountPatientsResponse);

  // Returns several patients at once.
  rpc ResolvePatients(ResolvePatientsRequest) returns (ResolvePatientsResponse);

  // Summarizes a patient.
  rpc SummarizePatients(SummarizePatientsRequest) returns (SummarizePatientsResponse);

  // Returns a patient.
  rpc PeekPatient(PeekPatientRequest) returns (PeekPatientResponse);
}

// The request of `LookupPatient`.
message LookupPatientRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPatient`.
message LookupPatientResponse {
  Patient patient = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePatients`.
message BrowsePatientsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePatientsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePatients`.
message BrowsePatientsResponse {
  repeated Patient patients = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPatients`.
message FindPatientsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPatientsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPatients`.
message FindPatientsResponse {
  repeated Patient patients = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPatients`.
message CountPatientsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPatientsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPatients`.
message CountPatientsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePatients`.
message ResolvePatientsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string patient_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePatients`.
message ResolvePatientsResponse {
  repeated Patient patients = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizePatients`.
message SummarizePatientsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  SummarizePatientsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePatients`.
message SummarizePatientsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekPatient`.
message PeekPatientRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPatient`.
message PeekPatientResponse {
  Patient patient = 1;
  acme.common.v1.OperationResult result = 2;
}
