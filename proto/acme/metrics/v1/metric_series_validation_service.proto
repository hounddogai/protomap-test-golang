syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "MetricSeriesValidationServiceProto";
option java_package = "com.acme.metrics.v1";

// Checks metric serieses against the rules before anything acts on them.
service MetricSeriesValidationService {
  // Validates a metric series.
  rpc ValidateMetricSeries(ValidateMetricSeriesRequest) returns (ValidateMetricSeriesResponse);

  // Previews a metric series.
  rpc PreviewMetricSeries(PreviewMetricSeriesRequest) returns (PreviewMetricSeriesResponse);

  // Checks a metric series.
  rpc CheckMetricSeriesEligibility(CheckMetricSeriesEligibilityRequest) returns (CheckMetricSeriesEligibilityResponse);

  // Normalizes a metric series.
  rpc NormalizeMetricSeries(NormalizeMetricSeriesRequest) returns (NormalizeMetricSeriesResponse);

  // Explains a metric series.
  rpc ExplainMetricSeriesDecision(ExplainMetricSeriesDecisionRequest) returns (ExplainMetricSeriesDecisionResponse);

  // Scores a metric series.
  rpc ScoreMetricSeries(ScoreMetricSeriesRequest) returns (ScoreMetricSeriesResponse);

  // Lints a metric series.
  rpc LintMetricSerieses(LintMetricSeriesesRequest) returns (LintMetricSeriesesResponse);

  // Returns a metric series.
  rpc GetMetricSeriesRules(GetMetricSeriesRulesRequest) returns (GetMetricSeriesRulesResponse);
}

// The request of `ValidateMetricSeries`.
message ValidateMetricSeriesRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_series_id = 2;
  MetricSeries metric_series = 3;
  ValidateMetricSeriesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMetricSeries`.
message ValidateMetricSeriesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MetricSeries metric_series = 1;
  ValidateMetricSeriesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

