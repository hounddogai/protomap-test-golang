syntax = "proto3";

package acme.metrics.v1;

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.metrics.v1";

// A reference to a metric series of the metrics domain.
message MetricSeriesRef {
  string metric_series_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a metric alert of the metrics domain.
message MetricAlertRef {
  string metric_alert_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a dashboard of the metrics domain.
message DashboardRef {
  string dashboard_id = 1;
  string display_name = 2;
  string number = 3;
}
