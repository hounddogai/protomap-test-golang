syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "BenefitPlanQueryServiceProto";
option java_package = "com.acme.benefits.v1";

// Answers read-only questions about benefit plans, for screens and reports.
service BenefitPlanQueryService {
  // Returns a benefit plan.
  rpc LookupBenefitPlan(LookupBenefitPlanRequest) returns (LookupBenefitPlanResponse);

  // Lists benefit plans a page at a time.
  rpc BrowseBenefitPlans(BrowseBenefitPlansRequest) returns (BrowseBenefitPlansResponse);

  // Lists benefit plans a page at a time.
  rpc FindBenefitPlans(FindBenefitPlansRequest) returns (FindBenefitPlansResponse);

  // Counts benefit plans by status.
  rpc CountBenefitPlans(CountBenefitPlansRequest) returns (CountBenefitPlansResponse);

  // Returns several benefit plans at once.
  rpc ResolveBenefitPlans(ResolveBenefitPlansRequest) returns (ResolveBenefitPlansResponse);

  // Streams every matching benefit plan.
  rpc ExportBenefitPlans(ExportBenefitPlansRequest) returns (stream ExportBenefitPlansResponse);

  // Summarizes a benefit plan.
  rpc SummarizeBenefitPlans(SummarizeBenefitPlansRequest) returns (SummarizeBenefitPlansResponse);

  // Lists benefit plans a page at a time.
  rpc SuggestBenefitPlans(SuggestBenefitPlansRequest) returns (SuggestBenefitPlansResponse);

  // Returns a benefit plan.
  rpc PeekBenefitPlan(PeekBenefitPlanRequest) returns (PeekBenefitPlanResponse);
}

// The request of `LookupBenefitPlan`.
message LookupBenefitPlanRequest {
  acme.common.v1.RequestContext context = 1;
  string benefit_plan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupBenefitPlan`.
message LookupBenefitPlanResponse {
  BenefitPlan benefit_plan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseBenefitPlans`.
message BrowseBenefitPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BenefitPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseBenefitPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseBenefitPlans`.
message BrowseBenefitPlansResponse {
  repeated BenefitPlan benefit_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindBenefitPlans`.
message FindBenefitPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BenefitPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindBenefitPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindBenefitPlans`.
message FindBenefitPlansResponse {
  repeated BenefitPlan benefit_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBenefitPlans`.
message CountBenefitPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BenefitPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBenefitPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBenefitPlans`.
message CountBenefitPlansResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveBenefitPlans`.
message ResolveBenefitPlansRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string benefit_plan_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveBenefitPlans`.
message ResolveBenefitPlansResponse {
  repeated BenefitPlan benefit_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportBenefitPlans`.
message ExportBenefitPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BenefitPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportBenefitPlansRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportBenefitPlans`.
message ExportBenefitPlansResponse {
  BenefitPlan benefit_plan = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeBenefitPlans`.
message SummarizeBenefitPlansRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string benefit_plan_id = 2;
  SummarizeBenefitPlansRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeBenefitPlans`.
message SummarizeBenefitPlansResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestBenefitPlans`.
message SuggestBenefitPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BenefitPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestBenefitPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestBenefitPlans`.
message SuggestBenefitPlansResponse {
  repeated BenefitPlan benefit_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekBenefitPlan`.
message PeekBenefitPlanRequest {
  acme.common.v1.RequestContext context = 1;
  string benefit_plan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekBenefitPlan`.
message PeekBenefitPlanResponse {
  BenefitPlan benefit_plan = 1;
  acme.common.v1.OperationResult result = 2;
}
