  }

  TelemetryReading telemetry_reading = 1;
  ExplainTelemetryReadingCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTelemetryReadingRates`.
message GetTelemetryReadingRatesRequest {
