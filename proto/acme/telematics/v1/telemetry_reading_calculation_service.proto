syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TelemetryReadingCalculationServiceProto";
option java_package = "com.acme.telematics.v1";

// Computes the figures of a telemetry reading, such as totals, taxes, and estimates.
service TelemetryReadingCalculationService {
  // Calculates a telemetry reading.
  rpc CalculateTelemetryReading(CalculateTelemetryReadingRequest) returns (CalculateTelemetryReadingResponse);

  // Estimates a telemetry reading.
  rpc EstimateTelemetryReading(EstimateTelemetryReadingRequest) returns (EstimateTelemetryReadingResponse);

  // Compares a telemetry reading.
  rpc CompareTelemetryReadingOptions(CompareTelemetryReadingOptionsRequest) returns (CompareTelemetryReadingOptionsResponse);

  // Recalculates a telemetry reading.
  rpc RecalculateTelemetryReadings(RecalculateTelemetryReadingsRequest) returns (RecalculateTelemetryReadingsResponse);

  // Simulates a telemetry reading.
  rpc SimulateTelemetryReading(SimulateTelemetryReadingRequest) returns (SimulateTelemetryReadingResponse);

  // Explains a telemetry reading.
  rpc ExplainTelemetryReadingCalculation(ExplainTelemetryReadingCalculationRequest) returns (ExplainTelemetryReadingCalculationResponse);

  // Returns a telemetry reading.
  rpc GetTelemetryReadingRates(GetTelemetryReadingRatesRequest) returns (GetTelemetryReadingRatesResponse);
}

// The request of `CalculateTelemetryReading`.
message CalculateTelemetryReadingRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string telemetry_reading_id = 2;
  TelemetryReading telemetry_reading = 3;
  CalculateTelemetryReadingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTelemetryReading`.
message CalculateTelemetryReadingResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTelemetryReadingResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TelemetryReading telemetry_reading = 1;
  CalculateTelemetryReadingResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

