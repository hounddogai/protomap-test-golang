syntax = "proto3";

package acme.telematics.v1;

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.telematics.v1";

// A reference to a telemetry reading of the telematics domain.
message TelemetryReadingRef {
  string telemetry_reading_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a geo fence of the telematics domain.
message GeoFenceRef {
  string geo_fence_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a trip log of the telematics domain.
message TripLogRef {
  string trip_log_id = 1;
  string display_name = 2;
  string number = 3;
}
