syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/telematics/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TelematicsProto";
option java_package = "com.acme.telematics.v1";

// Where a telemetry reading is in its lifecycle.
enum TelemetryReadingStatus {
  TELEMETRY_READING_STATUS_UNSPECIFIED = 0;
  TELEMETRY_READING_STATUS_RECEIVED = 1;
  TELEMETRY_READING_STATUS_PROCESSED = 2;
  TELEMETRY_READING_STATUS_DISCARDED = 3;
}

// Where a geo fence is in its lifecycle.
enum GeoFenceStatus {
  GEO_FENCE_STATUS_UNSPECIFIED = 0;
  GEO_FENCE_STATUS_DRAFT = 1;
  GEO_FENCE_STATUS_ENABLED = 2;
  GEO_FENCE_STATUS_DISABLED = 3;
  GEO_FENCE_STATUS_RETIRED = 4;
}

// Where a trip log is in its lifecycle.
enum TripLogStatus {
  TRIP_LOG_STATUS_UNSPECIFIED = 0;
  TRIP_LOG_STATUS_DRAFT = 1;
  TRIP_LOG_STATUS_ISSUED = 2;
  TRIP_LOG_STATUS_APPROVED = 3;
  TRIP_LOG_STATUS_PAID = 4;
  TRIP_LOG_STATUS_VOID = 5;
}

// The measurement of a telemetry reading.
message TelemetryReadingMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A telemetry reading of the telematics domain.
message TelemetryReading {
  string telemetry_reading_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  GeoFenceRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated TelemetryReadingMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of a geo fence.
message GeoFenceCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a geo fence.
message GeoFenceDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a geo fence.
message GeoFenceRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a geo fence.
message GeoFenceBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A geo fence of the telematics domain.
message GeoFence {
  string geo_fence_id = 1;
  string name = 2;
  string description = 3;
  GeoFenceStatus status = 4;
  int32 priority = 5;
  repeated GeoFenceCondition conditions = 6;
  oneof action {
    GeoFenceDiscountAction discount = 7;
    GeoFenceRouteAction route = 8;
    GeoFenceBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of a trip log.
message TripLogLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  TripLogLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a trip log line.
message TripLogLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a trip log.
message TripLogCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a trip log.
message TripLogBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a trip log.
message TripLogAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A trip log of the telematics domain.
message TripLog {
  string trip_log_id = 1;
  string number = 2;
  TripLogStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated TripLogLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    TripLogCardSettlement card = 8;
    TripLogBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated TripLogAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
