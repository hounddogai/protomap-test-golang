syntax = "proto3";

package acme.yards.v1;

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.yards.v1";

// A reference to a yard of the yards domain.
message YardRef {
  string yard_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a dock of the yards domain.
message DockRef {
  string dock_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a yard move of the yards domain.
message YardMoveRef {
  string yard_move_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
