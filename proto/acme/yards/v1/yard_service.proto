syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardServiceProto";
option java_package = "com.acme.yards.v1";

// Manages yards: creates, reads, changes, and lists them.
service YardService {
  // Creates a yard.
  rpc CreateYard(CreateYardRequest) returns (CreateYardResponse);

  // Returns a yard.
  rpc GetYard(GetYardRequest) returns (GetYardResponse);

  // Deletes a yard.
  rpc DeleteYard(DeleteYardRequest) returns (DeleteYardResponse);

  // Returns several yards at once.
  rpc BatchGetYards(BatchGetYardsRequest) returns (BatchGetYardsResponse);

  // Lists yards a page at a time.
  rpc SearchYards(SearchYardsRequest) returns (SearchYardsResponse);

  // Streams the changes of yards as they happen.
  rpc WatchYards(WatchYardsRequest) returns (stream WatchYardsResponse);

  // Takes a stream of yards and answers once at the end.
  rpc BatchCreateYards(stream BatchCreateYardsRequest) returns (BatchCreateYardsResponse);

  // Creates a yard.
  rpc CloneYard(CloneYardRequest) returns (CloneYardResponse);
}

// The request of `CreateYard`.
message CreateYardRequest {
  acme.common.v1.RequestContext context = 1;
  Yard yard = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateYard`.
message CreateYardResponse {
  Yard yard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetYard`.
message GetYardRequest {
  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetYard`.
message GetYardResponse {
  Yard yard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteYard`.
message DeleteYardRequest {
  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteYard`.
message DeleteYardResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `BatchGetYards`.
message BatchGetYardsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string yard_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetYards`.
message BatchGetYardsResponse {
  repeated Yard yards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchYards`.
message SearchYardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchYardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchYards`.
message SearchYardsResponse {
  repeated Yard yards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchYards`.
message WatchYardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchYardsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchYards`.
message WatchYardsResponse {
  Yard yard = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateYards`.
message BatchCreateYardsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateYardsRequest.StreamHeader header = 2;
    Yard record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateYards`.
message BatchCreateYardsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string yard_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateYardsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneYard`.
message CloneYardRequest {
  acme.common.v1.RequestContext context = 1;
  Yard yard = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneYard`.
message CloneYardResponse {
  Yard yard = 1;
  acme.common.v1.OperationResult result = 2;
}
