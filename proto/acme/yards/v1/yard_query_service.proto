syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardQueryServiceProto";
option java_package = "com.acme.yards.v1";

// Answers read-only questions about yards, for screens and reports.
service YardQueryService {
  // Returns a yard.
  rpc LookupYard(LookupYardRequest) returns (LookupYardResponse);

  // Lists yards a page at a time.
  rpc BrowseYards(BrowseYardsRequest) returns (BrowseYardsResponse);

  // Lists yards a page at a time.
  rpc FindYards(FindYardsRequest) returns (FindYardsResponse);

  // Counts yards by status.
  rpc CountYards(CountYardsRequest) returns (CountYardsResponse);

  // Streams every matching yard.
  rpc ExportYards(ExportYardsRequest) returns (stream ExportYardsResponse);

  // Summarizes a yard.
  rpc SummarizeYards(SummarizeYardsRequest) returns (SummarizeYardsResponse);

  // Returns a yard.
  rpc PeekYard(PeekYardRequest) returns (PeekYardResponse);
}

// The request of `LookupYard`.
message LookupYardRequest {
  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupYard`.
message LookupYardResponse {
  Yard yard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseYards`.
message BrowseYardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseYardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseYards`.
message BrowseYardsResponse {
  repeated Yard yards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindYards`.
message FindYardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindYardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindYards`.
message FindYardsResponse {
  repeated Yard yards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountYards`.
message CountYardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountYardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountYards`.
message CountYardsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportYards`.
message ExportYardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportYardsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportYards`.
message ExportYardsResponse {
  Yard yard = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeYards`.
message SummarizeYardsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  SummarizeYardsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeYards`.
message SummarizeYardsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekYard`.
message PeekYardRequest {
  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekYard`.
message PeekYardResponse {
  Yard yard = 1;
  acme.common.v1.OperationResult result = 2;
}
