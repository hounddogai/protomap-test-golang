syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "ChartOfAccountsServiceProto";
option java_package = "com.acme.accounting.v1";

// Manages chart of accountses: creates, reads, changes, and lists them.
service ChartOfAccountsService {
  // Creates a chart of accounts.
  rpc CreateChartOfAccounts(CreateChartOfAccountsRequest) returns (CreateChartOfAccountsResponse);

  // Returns a chart of accounts.
  rpc GetChartOfAccounts(GetChartOfAccountsRequest) returns (GetChartOfAccountsResponse);

  // Changes a chart of accounts.
  rpc UpdateChartOfAccounts(UpdateChartOfAccountsRequest) returns (UpdateChartOfAccountsResponse);

  // Deletes a chart of accounts.
  rpc DeleteChartOfAccounts(DeleteChartOfAccountsRequest) returns (DeleteChartOfAccountsResponse);

  // Lists chart of accountses a page at a time.
  rpc ListChartOfAccountses(ListChartOfAccountsesRequest) returns (ListChartOfAccountsesResponse);

  // Returns several chart of accountses at once.
  rpc BatchGetChartOfAccountses(BatchGetChartOfAccountsesRequest) returns (BatchGetChartOfAccountsesResponse);

  // Streams the changes of chart of accountses as they happen.
  rpc WatchChartOfAccountses(WatchChartOfAccountsesRequest) returns (stream WatchChartOfAccountsesResponse);

  // Takes a stream of chart of accountses and answers once at the end.
  rpc BatchCreateChartOfAccountses(stream BatchCreateChartOfAccountsesRequest) returns (BatchCreateChartOfAccountsesResponse);
}

// The request of `CreateChartOfAccounts`.
message CreateChartOfAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  ChartOfAccounts chart_of_accounts = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateChartOfAccounts`.
message CreateChartOfAccountsResponse {
  ChartOfAccounts chart_of_accounts = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetChartOfAccounts`.
message GetChartOfAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetChartOfAccounts`.
message GetChartOfAccountsResponse {
  ChartOfAccounts chart_of_accounts = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateChartOfAccounts`.
message UpdateChartOfAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  ChartOfAccounts chart_of_accounts = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateChartOfAccounts`.
message UpdateChartOfAccountsResponse {
  ChartOfAccounts chart_of_accounts = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteChartOfAccounts`.
message DeleteChartOfAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteChartOfAccounts`.
message DeleteChartOfAccountsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListChartOfAccountses`.
message ListChartOfAccountsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChartOfAccountsStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListChartOfAccountsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListChartOfAccountses`.
message ListChartOfAccountsesResponse {
  repeated ChartOfAccounts chart_of_accountses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetChartOfAccountses`.
message BatchGetChartOfAccountsesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string chart_of_accounts_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetChartOfAccountses`.
message BatchGetChartOfAccountsesResponse {
  repeated ChartOfAccounts chart_of_accountses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchChartOfAccountses`.
message WatchChartOfAccountsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChartOfAccountsStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchChartOfAccountsesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchChartOfAccountses`.
message WatchChartOfAccountsesResponse {
  ChartOfAccounts chart_of_accounts = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateChartOfAccountses`.
message BatchCreateChartOfAccountsesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateChartOfAccountsesRequest.StreamHeader header = 2;
    ChartOfAccounts record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateChartOfAccountses`.
message BatchCreateChartOfAccountsesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string chart_of_accounts_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateChartOfAccountsesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}
