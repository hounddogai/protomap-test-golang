syntax = "proto3";

package acme.accounting.v1;

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.accounting.v1";

// A reference to a chart of accounts of the accounting domain.
message ChartOfAccountsRef {
  string chart_of_accounts_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to an accrual of the accounting domain.
message AccrualRef {
  string accrual_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an allocation of the accounting domain.
message AllocationRef {
  string allocation_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a reconciliation of the accounting domain.
message ReconciliationRef {
  string reconciliation_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
