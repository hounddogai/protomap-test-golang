syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "ChartOfAccountsQueryServiceProto";
option java_package = "com.acme.accounting.v1";

// Answers read-only questions about chart of accountses, for screens and reports.
service ChartOfAccountsQueryService {
  // Returns a chart of accounts.
  rpc LookupChartOfAccounts(LookupChartOfAccountsRequest) returns (LookupChartOfAccountsResponse);

  // Lists chart of accountses a page at a time.
  rpc BrowseChartOfAccountses(BrowseChartOfAccountsesRequest) returns (BrowseChartOfAccountsesResponse);

  // Lists chart of accountses a page at a time.
  rpc FindChartOfAccountses(FindChartOfAccountsesRequest) returns (FindChartOfAccountsesResponse);

  // Counts chart of accountses by status.
  rpc CountChartOfAccountses(CountChartOfAccountsesRequest) returns (CountChartOfAccountsesResponse);

  // Returns several chart of accountses at once.
  rpc ResolveChartOfAccountses(ResolveChartOfAccountsesRequest) returns (ResolveChartOfAccountsesResponse);

  // Streams every matching chart of accounts.
  rpc ExportChartOfAccountses(ExportChartOfAccountsesRequest) returns (stream ExportChartOfAccountsesResponse);

  // Summarizes a chart of accounts.
  rpc SummarizeChartOfAccountses(SummarizeChartOfAccountsesRequest) returns (SummarizeChartOfAccountsesResponse);

  // Returns a chart of accounts.
  rpc PeekChartOfAccounts(PeekChartOfAccountsRequest) returns (PeekChartOfAccountsResponse);
}

// The request of `LookupChartOfAccounts`.
message LookupChartOfAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupChartOfAccounts`.
message LookupChartOfAccountsResponse {
  ChartOfAccounts chart_of_accounts = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseChartOfAccountses`.
message BrowseChartOfAccountsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChartOfAccountsStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseChartOfAccountsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseChartOfAccountses`.
message BrowseChartOfAccountsesResponse {
  repeated ChartOfAccounts chart_of_accountses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindChartOfAccountses`.
message FindChartOfAccountsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChartOfAccountsStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindChartOfAccountsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindChartOfAccountses`.
message FindChartOfAccountsesResponse {
  repeated ChartOfAccounts chart_of_accountses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountChartOfAccountses`.
message CountChartOfAccountsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChartOfAccountsStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountChartOfAccountsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountChartOfAccountses`.
message CountChartOfAccountsesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveChartOfAccountses`.
message ResolveChartOfAccountsesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string chart_of_accounts_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveChartOfAccountses`.
message ResolveChartOfAccountsesResponse {
  repeated ChartOfAccounts chart_of_accountses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportChartOfAccountses`.
message ExportChartOfAccountsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChartOfAccountsStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportChartOfAccountsesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportChartOfAccountses`.
message ExportChartOfAccountsesResponse {
  ChartOfAccounts chart_of_accounts = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeChartOfAccountses`.
message SummarizeChartOfAccountsesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  SummarizeChartOfAccountsesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeChartOfAccountses`.
message SummarizeChartOfAccountsesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekChartOfAccounts`.
message PeekChartOfAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekChartOfAccounts`.
message PeekChartOfAccountsResponse {
  ChartOfAccounts chart_of_accounts = 1;
  acme.common.v1.OperationResult result = 2;
}
