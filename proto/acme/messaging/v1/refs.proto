syntax = "proto3";

package acme.messaging.v1;

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.messaging.v1";

// A reference to a conversation of the messaging domain.
message ConversationRef {
  string conversation_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a chat message of the messaging domain.
message ChatMessageRef {
  string chat_message_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a channel of the messaging domain.
message ChannelRef {
  string channel_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a participant of the messaging domain.
message ParticipantRef {
  string participant_id = 1;
  string display_name = 2;
  string email = 3;
}
