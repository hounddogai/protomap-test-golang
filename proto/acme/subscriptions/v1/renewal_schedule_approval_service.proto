syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RenewalScheduleApprovalServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Routes renewal schedules through approval, with escalation and delegation.
service RenewalScheduleApprovalService {
  // Submits a renewal schedule.
  rpc SubmitRenewalSchedule(SubmitRenewalScheduleRequest) returns (SubmitRenewalScheduleResponse);

  // Approves a renewal schedule.
  rpc ApproveRenewalSchedule(ApproveRenewalScheduleRequest) returns (ApproveRenewalScheduleResponse);

  // Rejects a renewal schedule.
  rpc RejectRenewalSchedule(RejectRenewalScheduleRequest) returns (RejectRenewalScheduleResponse);

  // Escalates a renewal schedule.
  rpc EscalateRenewalSchedule(EscalateRenewalScheduleRequest) returns (EscalateRenewalScheduleResponse);

  // Lists renewal schedules a page at a time.
  rpc ListPendingRenewalSchedules(ListPendingRenewalSchedulesRequest) returns (ListPendingRenewalSchedulesResponse);

  // Delegates a renewal schedule.
  rpc DelegateRenewalScheduleApproval(DelegateRenewalScheduleApprovalRequest) returns (DelegateRenewalScheduleApprovalResponse);

  // Returns a renewal schedule.
  rpc GetRenewalScheduleApprovalStatus(GetRenewalScheduleApprovalStatusRequest) returns (GetRenewalScheduleApprovalStatusResponse);
}

// The request of `SubmitRenewalSchedule`.
message SubmitRenewalScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string renewal_schedule_id = 2;
  RenewalSchedule renewal_schedule = 3;
  SubmitRenewalScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRenewalSchedule`.
message SubmitRenewalScheduleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RenewalSchedule renewal_schedule = 1;
  SubmitRenewalScheduleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

