syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionPlanQueryServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Answers read-only questions about subscription plans, for screens and reports.
service SubscriptionPlanQueryService {
  // Returns a subscription plan.
  rpc LookupSubscriptionPlan(LookupSubscriptionPlanRequest) returns (LookupSubscriptionPlanResponse);

  // Lists subscription plans a page at a time.
  rpc BrowseSubscriptionPlans(BrowseSubscriptionPlansRequest) returns (BrowseSubscriptionPlansResponse);

  // Lists subscription plans a page at a time.
  rpc FindSubscriptionPlans(FindSubscriptionPlansRequest) returns (FindSubscriptionPlansResponse);

  // Counts subscription plans by status.
  rpc CountSubscriptionPlans(CountSubscriptionPlansRequest) returns (CountSubscriptionPlansResponse);

  // Returns several subscription plans at once.
  rpc ResolveSubscriptionPlans(ResolveSubscriptionPlansRequest) returns (ResolveSubscriptionPlansResponse);

  // Streams every matching subscription plan.
  rpc ExportSubscriptionPlans(ExportSubscriptionPlansRequest) returns (stream ExportSubscriptionPlansResponse);

  // Summarizes a subscription plan.
  rpc SummarizeSubscriptionPlans(SummarizeSubscriptionPlansRequest) returns (SummarizeSubscriptionPlansResponse);

  // Lists subscription plans a page at a time.
  rpc SuggestSubscriptionPlans(SuggestSubscriptionPlansRequest) returns (SuggestSubscriptionPlansResponse);

  // Returns a subscription plan.
  rpc PeekSubscriptionPlan(PeekSubscriptionPlanRequest) returns (PeekSubscriptionPlanResponse);
}

// The request of `LookupSubscriptionPlan`.
message LookupSubscriptionPlanRequest {
  acme.common.v1.RequestContext context = 1;
  string subscription_plan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSubscriptionPlan`.
message LookupSubscriptionPlanResponse {
  SubscriptionPlan subscription_plan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSubscriptionPlans`.
message BrowseSubscriptionPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSubscriptionPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSubscriptionPlans`.
message BrowseSubscriptionPlansResponse {
  repeated SubscriptionPlan subscription_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSubscriptionPlans`.
message FindSubscriptionPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSubscriptionPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSubscriptionPlans`.
message FindSubscriptionPlansResponse {
  repeated SubscriptionPlan subscription_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSubscriptionPlans`.
message CountSubscriptionPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSubscriptionPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSubscriptionPlans`.
message CountSubscriptionPlansResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSubscriptionPlans`.
message ResolveSubscriptionPlansRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string subscription_plan_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSubscriptionPlans`.
message ResolveSubscriptionPlansResponse {
  repeated SubscriptionPlan subscription_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSubscriptionPlans`.
message ExportSubscriptionPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSubscriptionPlansRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSubscriptionPlans`.
message ExportSubscriptionPlansResponse {
  SubscriptionPlan subscription_plan = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSubscriptionPlans`.
message SummarizeSubscriptionPlansRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_plan_id = 2;
  SummarizeSubscriptionPlansRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSubscriptionPlans`.
message SummarizeSubscriptionPlansResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSubscriptionPlans`.
message SuggestSubscriptionPlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionPlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSubscriptionPlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSubscriptionPlans`.
message SuggestSubscriptionPlansResponse {
  repeated SubscriptionPlan subscription_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSubscriptionPlan`.
message PeekSubscriptionPlanRequest {
  acme.common.v1.RequestContext context = 1;
  string subscription_plan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSubscriptionPlan`.
message PeekSubscriptionPlanResponse {
  SubscriptionPlan subscription_plan = 1;
  acme.common.v1.OperationResult result = 2;
}
