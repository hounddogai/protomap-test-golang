syntax = "proto3";

package acme.subscriptions.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.subscriptions.v1";

// A reference to a subscription of the subscriptions domain.
message SubscriptionRef {
  string subscription_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a subscription plan of the subscriptions domain.
message SubscriptionPlanRef {
  string subscription_plan_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a renewal schedule of the subscriptions domain.
message RenewalScheduleRef {
  string renewal_schedule_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a usage record of the subscriptions domain.
message UsageRecordRef {
  string usage_record_id = 1;
  string display_name = 2;
  string kind = 3;
}
