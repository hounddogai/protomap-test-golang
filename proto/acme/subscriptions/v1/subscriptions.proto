syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionsProto";
option java_package = "com.acme.subscriptions.v1";

// Where a subscription is in its lifecycle.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_PENDING = 1;
  SUBSCRIPTION_STATUS_OPEN = 2;
  SUBSCRIPTION_STATUS_FROZEN = 3;
  SUBSCRIPTION_STATUS_CLOSED = 4;
}

// Where a subscription plan is in its lifecycle.
enum SubscriptionPlanStatus {
  SUBSCRIPTION_PLAN_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_PLAN_STATUS_DRAFT = 1;
  SUBSCRIPTION_PLAN_STATUS_ENABLED = 2;
  SUBSCRIPTION_PLAN_STATUS_DISABLED = 3;
  SUBSCRIPTION_PLAN_STATUS_RETIRED = 4;
}

// Where a renewal schedule is in its lifecycle.
enum RenewalScheduleStatus {
  RENEWAL_SCHEDULE_STATUS_UNSPECIFIED = 0;
  RENEWAL_SCHEDULE_STATUS_TENTATIVE = 1;
  RENEWAL_SCHEDULE_STATUS_CONFIRMED = 2;
  RENEWAL_SCHEDULE_STATUS_CANCELLED = 3;
  RENEWAL_SCHEDULE_STATUS_COMPLETED = 4;
}

// Where a usage record is in its lifecycle.
enum UsageRecordStatus {
  USAGE_RECORD_STATUS_UNSPECIFIED = 0;
  USAGE_RECORD_STATUS_RECEIVED = 1;
  USAGE_RECORD_STATUS_PROCESSED = 2;
  USAGE_RECORD_STATUS_DISCARDED = 3;
}

// The limit of a subscription.
message SubscriptionLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a subscription.
message SubscriptionCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a subscription.
message SubscriptionBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A subscription of the subscriptions domain.
message Subscription {
  string subscription_id = 1;
  acme.customers.v1.CustomerRef holder = 2;
  SubscriptionStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated SubscriptionLimit limits = 7;
  oneof funding {
    SubscriptionCardFunding card = 8;
    SubscriptionBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The condition of a subscription plan.
message SubscriptionPlanCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a subscription plan.
message SubscriptionPlanDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a subscription plan.
message SubscriptionPlanRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a subscription plan.
message SubscriptionPlanBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A subscription plan of the subscriptions domain.
message SubscriptionPlan {
  string subscription_plan_id = 1;
  string name = 2;
  string description = 3;
  SubscriptionPlanStatus status = 4;
  int32 priority = 5;
  repeated SubscriptionPlanCondition conditions = 6;
  oneof action {
    SubscriptionPlanDiscountAction discount = 7;
    SubscriptionPlanRouteAction route = 8;
    SubscriptionPlanBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The participant of a renewal schedule.
message RenewalScheduleParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a renewal schedule.
message RenewalScheduleDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a renewal schedule.
message RenewalScheduleWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A renewal schedule of the subscriptions domain.
message RenewalSchedule {
  string renewal_schedule_id = 1;
  string title = 2;
  RenewalScheduleStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated RenewalScheduleParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    RenewalScheduleDailyRule daily = 7;
    RenewalScheduleWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The measurement of a usage record.
message UsageRecordMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A usage record of the subscriptions domain.
message UsageRecord {
  string usage_record_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  acme.customers.v1.CustomerRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated UsageRecordMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
