syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "UsageRecordValidationServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Checks usage records against the rules before anything acts on them.
service UsageRecordValidationService {
  // Validates a usage record.
  rpc ValidateUsageRecord(ValidateUsageRecordRequest) returns (ValidateUsageRecordResponse);

  // Previews a usage record.
  rpc PreviewUsageRecord(PreviewUsageRecordRequest) returns (PreviewUsageRecordResponse);

  // Normalizes a usage record.
  rpc NormalizeUsageRecord(NormalizeUsageRecordRequest) returns (NormalizeUsageRecordResponse);

  // Explains a usage record.
  rpc ExplainUsageRecordDecision(ExplainUsageRecordDecisionRequest) returns (ExplainUsageRecordDecisionResponse);

  // Scores a usage record.
  rpc ScoreUsageRecord(ScoreUsageRecordRequest) returns (ScoreUsageRecordResponse);

  // Lints a usage record.
  rpc LintUsageRecords(LintUsageRecordsRequest) returns (LintUsageRecordsResponse);
}

// The request of `ValidateUsageRecord`.
message ValidateUsageRecordRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string usage_record_id = 2;
  UsageRecord usage_record = 3;
  ValidateUsageRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateUsageRecord`.
message ValidateUsageRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  UsageRecord usage_record = 1;
  ValidateUsageRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

