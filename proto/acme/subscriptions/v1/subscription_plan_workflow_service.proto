syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionPlanWorkflowServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Runs the long-lived workflow that takes a subscription plan from start to finish.
service SubscriptionPlanWorkflowService {
  // Starts a subscription plan.
  rpc StartSubscriptionPlanWorkflow(StartSubscriptionPlanWorkflowRequest) returns (StartSubscriptionPlanWorkflowResponse);

  // Advances a subscription plan.
  rpc AdvanceSubscriptionPlanWorkflow(AdvanceSubscriptionPlanWorkflowRequest) returns (AdvanceSubscriptionPlanWorkflowResponse);

  // Cancels a subscription plan.
  rpc CancelSubscriptionPlanWorkflow(CancelSubscriptionPlanWorkflowRequest) returns (CancelSubscriptionPlanWorkflowResponse);

  // Retrys a subscription plan.
  rpc RetrySubscriptionPlanWorkflow(RetrySubscriptionPlanWorkflowRequest) returns (RetrySubscriptionPlanWorkflowResponse);

  // Pauses a subscription plan.
  rpc PauseSubscriptionPlanWorkflow(PauseSubscriptionPlanWorkflowRequest) returns (PauseSubscriptionPlanWorkflowResponse);

  // Resumes a subscription plan.
  rpc ResumeSubscriptionPlanWorkflow(ResumeSubscriptionPlanWorkflowRequest) returns (ResumeSubscriptionPlanWorkflowResponse);

  // Returns a subscription plan.
  rpc InspectSubscriptionPlanWorkflow(InspectSubscriptionPlanWorkflowRequest) returns (InspectSubscriptionPlanWorkflowResponse);

  // Lists subscription plans a page at a time.
  rpc ListSubscriptionPlanWorkflows(ListSubscriptionPlanWorkflowsRequest) returns (ListSubscriptionPlanWorkflowsResponse);

  // Signals a subscription plan.
  rpc SignalSubscriptionPlanWorkflow(SignalSubscriptionPlanWorkflowRequest) returns (SignalSubscriptionPlanWorkflowResponse);
}

// The request of `StartSubscriptionPlanWorkflow`.
message StartSubscriptionPlanWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_plan_id = 2;
  SubscriptionPlan subscription_plan = 3;
  StartSubscriptionPlanWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSubscriptionPlanWorkflow`.
message StartSubscriptionPlanWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SubscriptionPlan subscription_plan = 1;
  StartSubscriptionPlanWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

