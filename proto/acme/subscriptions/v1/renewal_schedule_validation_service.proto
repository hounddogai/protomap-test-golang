syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RenewalScheduleValidationServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Checks renewal schedules against the rules before anything acts on them.
service RenewalScheduleValidationService {
  // Validates a renewal schedule.
  rpc ValidateRenewalSchedule(ValidateRenewalScheduleRequest) returns (ValidateRenewalScheduleResponse);

  // Previews a renewal schedule.
  rpc PreviewRenewalSchedule(PreviewRenewalScheduleRequest) returns (PreviewRenewalScheduleResponse);

  // Checks a renewal schedule.
  rpc CheckRenewalScheduleEligibility(CheckRenewalScheduleEligibilityRequest) returns (CheckRenewalScheduleEligibilityResponse);

  // Normalizes a renewal schedule.
  rpc NormalizeRenewalSchedule(NormalizeRenewalScheduleRequest) returns (NormalizeRenewalScheduleResponse);

  // Explains a renewal schedule.
  rpc ExplainRenewalScheduleDecision(ExplainRenewalScheduleDecisionRequest) returns (ExplainRenewalScheduleDecisionResponse);

  // Scores a renewal schedule.
  rpc ScoreRenewalSchedule(ScoreRenewalScheduleRequest) returns (ScoreRenewalScheduleResponse);

  // Returns a renewal schedule.
  rpc GetRenewalScheduleRules(GetRenewalScheduleRulesRequest) returns (GetRenewalScheduleRulesResponse);
}

// The request of `ValidateRenewalSchedule`.
message ValidateRenewalScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string renewal_schedule_id = 2;
  RenewalSchedule renewal_schedule = 3;
  ValidateRenewalScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRenewalSchedule`.
message ValidateRenewalScheduleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RenewalSchedule renewal_schedule = 1;
  ValidateRenewalScheduleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

