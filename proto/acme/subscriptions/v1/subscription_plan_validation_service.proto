syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionPlanValidationServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Checks subscription plans against the rules before anything acts on them.
service SubscriptionPlanValidationService {
  // Validates a subscription plan.
  rpc ValidateSubscriptionPlan(ValidateSubscriptionPlanRequest) returns (ValidateSubscriptionPlanResponse);

  // Previews a subscription plan.
  rpc PreviewSubscriptionPlan(PreviewSubscriptionPlanRequest) returns (PreviewSubscriptionPlanResponse);

  // Checks a subscription plan.
  rpc CheckSubscriptionPlanEligibility(CheckSubscriptionPlanEligibilityRequest) returns (CheckSubscriptionPlanEligibilityResponse);

  // Normalizes a subscription plan.
  rpc NormalizeSubscriptionPlan(NormalizeSubscriptionPlanRequest) returns (NormalizeSubscriptionPlanResponse);

  // Scores a subscription plan.
  rpc ScoreSubscriptionPlan(ScoreSubscriptionPlanRequest) returns (ScoreSubscriptionPlanResponse);

  // Lints a subscription plan.
  rpc LintSubscriptionPlans(LintSubscriptionPlansRequest) returns (LintSubscriptionPlansResponse);

  // Returns a subscription plan.
  rpc GetSubscriptionPlanRules(GetSubscriptionPlanRulesRequest) returns (GetSubscriptionPlanRulesResponse);
}

// The request of `ValidateSubscriptionPlan`.
message ValidateSubscriptionPlanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_plan_id = 2;
  SubscriptionPlan subscription_plan = 3;
  ValidateSubscriptionPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSubscriptionPlan`.
message ValidateSubscriptionPlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SubscriptionPlan subscription_plan = 1;
  ValidateSubscriptionPlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

