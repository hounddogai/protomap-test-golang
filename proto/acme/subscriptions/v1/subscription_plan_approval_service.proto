syntax = "proto3";

package acme.subscriptions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/subscriptions/v1/subscriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Subscriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/subscriptions/v1;subscriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionPlanApprovalServiceProto";
option java_package = "com.acme.subscriptions.v1";

// Routes subscription plans through approval, with escalation and delegation.
service SubscriptionPlanApprovalService {
  // Submits a subscription plan.
  rpc SubmitSubscriptionPlan(SubmitSubscriptionPlanRequest) returns (SubmitSubscriptionPlanResponse);

  // Approves a subscription plan.
  rpc ApproveSubscriptionPlan(ApproveSubscriptionPlanRequest) returns (ApproveSubscriptionPlanResponse);

  // Rejects a subscription plan.
  rpc RejectSubscriptionPlan(RejectSubscriptionPlanRequest) returns (RejectSubscriptionPlanResponse);

  // Escalates a subscription plan.
  rpc EscalateSubscriptionPlan(EscalateSubscriptionPlanRequest) returns (EscalateSubscriptionPlanResponse);

  // Lists subscription plans a page at a time.
  rpc ListPendingSubscriptionPlans(ListPendingSubscriptionPlansRequest) returns (ListPendingSubscriptionPlansResponse);

  // Delegates a subscription plan.
  rpc DelegateSubscriptionPlanApproval(DelegateSubscriptionPlanApprovalRequest) returns (DelegateSubscriptionPlanApprovalResponse);

  // Recalls a subscription plan.
  rpc RecallSubscriptionPlan(RecallSubscriptionPlanRequest) returns (RecallSubscriptionPlanResponse);

  // Returns a subscription plan.
  rpc GetSubscriptionPlanApprovalStatus(GetSubscriptionPlanApprovalStatusRequest) returns (GetSubscriptionPlanApprovalStatusResponse);
}

// The request of `SubmitSubscriptionPlan`.
message SubmitSubscriptionPlanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_plan_id = 2;
  SubscriptionPlan subscription_plan = 3;
  SubmitSubscriptionPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSubscriptionPlan`.
message SubmitSubscriptionPlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SubscriptionPlan subscription_plan = 1;
  SubmitSubscriptionPlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

