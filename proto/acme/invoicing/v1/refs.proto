syntax = "proto3";

package acme.invoicing.v1;

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.invoicing.v1";

// A reference to an invoice batch of the invoicing domain.
message InvoiceBatchRef {
  string invoice_batch_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an invoice template of the invoicing domain.
message InvoiceTemplateRef {
  string invoice_template_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an e invoice of the invoicing domain.
message EInvoiceRef {
  string e_invoice_id = 1;
  string display_name = 2;
  string number = 3;
}
