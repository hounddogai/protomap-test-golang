syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceBatchQueryServiceProto";
option java_package = "com.acme.invoicing.v1";

// Answers read-only questions about invoice batches, for screens and reports.
service InvoiceBatchQueryService {
  // Returns an invoice batch.
  rpc LookupInvoiceBatch(LookupInvoiceBatchRequest) returns (LookupInvoiceBatchResponse);

  // Lists invoice batches a page at a time.
  rpc BrowseInvoiceBatches(BrowseInvoiceBatchesRequest) returns (BrowseInvoiceBatchesResponse);

  // Lists invoice batches a page at a time.
  rpc FindInvoiceBatches(FindInvoiceBatchesRequest) returns (FindInvoiceBatchesResponse);

  // Counts invoice batches by status.
  rpc CountInvoiceBatches(CountInvoiceBatchesRequest) returns (CountInvoiceBatchesResponse);

  // Returns several invoice batches at once.
  rpc ResolveInvoiceBatches(ResolveInvoiceBatchesRequest) returns (ResolveInvoiceBatchesResponse);

  // Streams every matching invoice batch.
  rpc ExportInvoiceBatches(ExportInvoiceBatchesRequest) returns (stream ExportInvoiceBatchesResponse);

  // Lists invoice batches a page at a time.
  rpc SuggestInvoiceBatches(SuggestInvoiceBatchesRequest) returns (SuggestInvoiceBatchesResponse);

  // Returns an invoice batch.
  rpc PeekInvoiceBatch(PeekInvoiceBatchRequest) returns (PeekInvoiceBatchResponse);
}

// The request of `LookupInvoiceBatch`.
message LookupInvoiceBatchRequest {
  acme.common.v1.RequestContext context = 1;
  string invoice_batch_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupInvoiceBatch`.
message LookupInvoiceBatchResponse {
  InvoiceBatch invoice_batch = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseInvoiceBatches`.
message BrowseInvoiceBatchesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceBatchStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseInvoiceBatchesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseInvoiceBatches`.
message BrowseInvoiceBatchesResponse {
  repeated InvoiceBatch invoice_batches = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindInvoiceBatches`.
message FindInvoiceBatchesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceBatchStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindInvoiceBatchesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindInvoiceBatches`.
message FindInvoiceBatchesResponse {
  repeated InvoiceBatch invoice_batches = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountInvoiceBatches`.
message CountInvoiceBatchesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceBatchStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountInvoiceBatchesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountInvoiceBatches`.
message CountInvoiceBatchesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveInvoiceBatches`.
message ResolveInvoiceBatchesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string invoice_batch_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveInvoiceBatches`.
message ResolveInvoiceBatchesResponse {
  repeated InvoiceBatch invoice_batches = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportInvoiceBatches`.
message ExportInvoiceBatchesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceBatchStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportInvoiceBatchesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportInvoiceBatches`.
message ExportInvoiceBatchesResponse {
  InvoiceBatch invoice_batch = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestInvoiceBatches`.
message SuggestInvoiceBatchesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceBatchStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestInvoiceBatchesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestInvoiceBatches`.
message SuggestInvoiceBatchesResponse {
  repeated InvoiceBatch invoice_batches = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekInvoiceBatch`.
message PeekInvoiceBatchRequest {
  acme.common.v1.RequestContext context = 1;
  string invoice_batch_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekInvoiceBatch`.
message PeekInvoiceBatchResponse {
  InvoiceBatch invoice_batch = 1;
  acme.common.v1.OperationResult result = 2;
}
