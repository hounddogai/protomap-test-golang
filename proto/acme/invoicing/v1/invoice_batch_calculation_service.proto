syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceBatchCalculationServiceProto";
option java_package = "com.acme.invoicing.v1";

// Computes the figures of an invoice batch, such as totals, taxes, and estimates.
service InvoiceBatchCalculationService {
  // Calculates an invoice batch.
  rpc CalculateInvoiceBatch(CalculateInvoiceBatchRequest) returns (CalculateInvoiceBatchResponse);

  // Estimates an invoice batch.
  rpc EstimateInvoiceBatch(EstimateInvoiceBatchRequest) returns (EstimateInvoiceBatchResponse);

  // Quotes an invoice batch.
  rpc QuoteInvoiceBatch(QuoteInvoiceBatchRequest) returns (QuoteInvoiceBatchResponse);

  // Compares an invoice batch.
  rpc CompareInvoiceBatchOptions(CompareInvoiceBatchOptionsRequest) returns (CompareInvoiceBatchOptionsResponse);

  // Recalculates an invoice batch.
  rpc RecalculateInvoiceBatches(RecalculateInvoiceBatchesRequest) returns (RecalculateInvoiceBatchesResponse);

  // Simulates an invoice batch.
  rpc SimulateInvoiceBatch(SimulateInvoiceBatchRequest) returns (SimulateInvoiceBatchResponse);

  // Explains an invoice batch.
  rpc ExplainInvoiceBatchCalculation(ExplainInvoiceBatchCalculationRequest) returns (ExplainInvoiceBatchCalculationResponse);

  // Returns an invoice batch.
  rpc GetInvoiceBatchRates(GetInvoiceBatchRatesRequest) returns (GetInvoiceBatchRatesResponse);
}

// The request of `CalculateInvoiceBatch`.
message CalculateInvoiceBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_batch_id = 2;
  InvoiceBatch invoice_batch = 3;
  CalculateInvoiceBatchRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateInvoiceBatch`.
message CalculateInvoiceBatchResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateInvoiceBatchResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  InvoiceBatch invoice_batch = 1;
  CalculateInvoiceBatchResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

