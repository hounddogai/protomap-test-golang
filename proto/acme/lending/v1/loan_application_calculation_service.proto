syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LoanApplicationCalculationServiceProto";
option java_package = "com.acme.lending.v1";

// Computes the figures of a loan application, such as totals, taxes, and estimates.
service LoanApplicationCalculationService {
  // Calculates a loan application.
  rpc CalculateLoanApplication(CalculateLoanApplicationRequest) returns (CalculateLoanApplicationResponse);

  // Estimates a loan application.
  rpc EstimateLoanApplication(EstimateLoanApplicationRequest) returns (EstimateLoanApplicationResponse);

  // Quotes a loan application.
  rpc QuoteLoanApplication(QuoteLoanApplicationRequest) returns (QuoteLoanApplicationResponse);

  // Compares a loan application.
  rpc CompareLoanApplicationOptions(CompareLoanApplicationOptionsRequest) returns (CompareLoanApplicationOptionsResponse);

  // Recalculates a loan application.
  rpc RecalculateLoanApplications(RecalculateLoanApplicationsRequest) returns (RecalculateLoanApplicationsResponse);

  // Simulates a loan application.
  rpc SimulateLoanApplication(SimulateLoanApplicationRequest) returns (SimulateLoanApplicationResponse);

  // Explains a loan application.
  rpc ExplainLoanApplicationCalculation(ExplainLoanApplicationCalculationRequest) returns (ExplainLoanApplicationCalculationResponse);

  // Returns a loan application.
  rpc GetLoanApplicationRates(GetLoanApplicationRatesRequest) returns (GetLoanApplicationRatesResponse);
}

// The request of `CalculateLoanApplication`.
message CalculateLoanApplicationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string loan_application_id = 2;
  LoanApplication loan_application = 3;
  CalculateLoanApplicationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLoanApplication`.
message CalculateLoanApplicationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLoanApplicationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LoanApplication loan_application = 1;
  CalculateLoanApplicationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

