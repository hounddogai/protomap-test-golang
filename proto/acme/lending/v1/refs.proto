syntax = "proto3";

package acme.lending.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.lending.v1";

// A reference to a loan application of the lending domain.
message LoanApplicationRef {
  string loan_application_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a loan of the lending domain.
message LoanRef {
  string loan_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a collateral of the lending domain.
message CollateralRef {
  string collateral_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a repayment of the lending domain.
message RepaymentRef {
  string repayment_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}
