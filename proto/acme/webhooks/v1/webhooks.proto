syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/webhooks/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhooksProto";
option java_package = "com.acme.webhooks.v1";

// Where a webhook endpoint is in its lifecycle.
enum WebhookEndpointStatus {
  WEBHOOK_ENDPOINT_STATUS_UNSPECIFIED = 0;
  WEBHOOK_ENDPOINT_STATUS_PLANNED = 1;
  WEBHOOK_ENDPOINT_STATUS_AVAILABLE = 2;
  WEBHOOK_ENDPOINT_STATUS_RESERVED = 3;
  WEBHOOK_ENDPOINT_STATUS_RETIRED = 4;
}

// Where a webhook delivery is in its lifecycle.
enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
  WEBHOOK_DELIVERY_STATUS_RECEIVED = 1;
  WEBHOOK_DELIVERY_STATUS_PROCESSED = 2;
  WEBHOOK_DELIVERY_STATUS_DISCARDED = 3;
}

// Where a webhook secret is in its lifecycle.
enum WebhookSecretStatus {
  WEBHOOK_SECRET_STATUS_UNSPECIFIED = 0;
  WEBHOOK_SECRET_STATUS_PENDING = 1;
  WEBHOOK_SECRET_STATUS_OPEN = 2;
  WEBHOOK_SECRET_STATUS_FROZEN = 3;
  WEBHOOK_SECRET_STATUS_CLOSED = 4;
}

// The dimensions of a webhook endpoint.
message WebhookEndpointDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a webhook endpoint.
message WebhookEndpointComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A webhook endpoint of the webhooks domain.
message WebhookEndpoint {
  string webhook_endpoint_id = 1;
  string code = 2;
  string name = 3;
  WebhookEndpointStatus status = 4;
  repeated string category_path = 5;
  WebhookEndpointDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, WebhookEndpointComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The measurement of a webhook delivery.
message WebhookDeliveryMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A webhook delivery of the webhooks domain.
message WebhookDelivery {
  string webhook_delivery_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  WebhookEndpointRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated WebhookDeliveryMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The limit of a webhook secret.
message WebhookSecretLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a webhook secret.
message WebhookSecretCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a webhook secret.
message WebhookSecretBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A webhook secret of the webhooks domain.
message WebhookSecret {
  string webhook_secret_id = 1;
  WebhookEndpointRef holder = 2;
  WebhookSecretStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated WebhookSecretLimit limits = 7;
  oneof funding {
    WebhookSecretCardFunding card = 8;
    WebhookSecretBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}
