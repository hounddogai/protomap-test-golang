syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "DisputeValidationServiceProto";
option java_package = "com.acme.payments.v1";

// Checks disputes against the rules before anything acts on them.
service DisputeValidationService {
  // Validates a dispute.
  rpc ValidateDispute(ValidateDisputeRequest) returns (ValidateDisputeResponse);

  // Previews a dispute.
  rpc PreviewDispute(PreviewDisputeRequest) returns (PreviewDisputeResponse);

  // Checks a dispute.
  rpc CheckDisputeEligibility(CheckDisputeEligibilityRequest) returns (CheckDisputeEligibilityResponse);

  // Normalizes a dispute.
  rpc NormalizeDispute(NormalizeDisputeRequest) returns (NormalizeDisputeResponse);

  // Explains a dispute.
  rpc ExplainDisputeDecision(ExplainDisputeDecisionRequest) returns (ExplainDisputeDecisionResponse);

  // Scores a dispute.
  rpc ScoreDispute(ScoreDisputeRequest) returns (ScoreDisputeResponse);

  // Lints a dispute.
  rpc LintDisputes(LintDisputesRequest) returns (LintDisputesResponse);

  // Returns a dispute.
  rpc GetDisputeRules(GetDisputeRulesRequest) returns (GetDisputeRulesResponse);
}

// The request of `ValidateDispute`.
message ValidateDisputeRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  Dispute dispute = 3;
  ValidateDisputeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDispute`.
message ValidateDisputeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dispute dispute = 1;
  ValidateDisputeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

