syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentInstrumentSyncServiceProto";
option java_package = "com.acme.payments.v1";

// Keeps payment instruments in step with the systems of record in other regions.
service PaymentInstrumentSyncService {
  // Syncs a payment instrument.
  rpc SyncPaymentInstruments(SyncPaymentInstrumentsRequest) returns (SyncPaymentInstrumentsResponse);

  // Pushs a payment instrument.
  rpc PushPaymentInstrument(PushPaymentInstrumentRequest) returns (PushPaymentInstrumentResponse);

  // Pulls a payment instrument.
  rpc PullPaymentInstruments(PullPaymentInstrumentsRequest) returns (PullPaymentInstrumentsResponse);

  // Reconciles a payment instrument.
  rpc ReconcilePaymentInstruments(ReconcilePaymentInstrumentsRequest) returns (ReconcilePaymentInstrumentsResponse);

  // Exchanges changes of payment instruments with a peer.
  rpc StreamPaymentInstrumentChanges(stream StreamPaymentInstrumentChangesRequest) returns (stream StreamPaymentInstrumentChangesResponse);

  // Resolves a payment instrument.
  rpc ResolvePaymentInstrumentConflict(ResolvePaymentInstrumentConflictRequest) returns (ResolvePaymentInstrumentConflictResponse);

  // Returns a payment instrument.
  rpc GetPaymentInstrumentSyncState(GetPaymentInstrumentSyncStateRequest) returns (GetPaymentInstrumentSyncStateResponse);

  // Lists payment instruments a page at a time.
  rpc ListPaymentInstrumentConflicts(ListPaymentInstrumentConflictsRequest) returns (ListPaymentInstrumentConflictsResponse);
}

// The request of `SyncPaymentInstruments`.
message SyncPaymentInstrumentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  PaymentInstrument payment_instrument = 3;
  SyncPaymentInstrumentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncPaymentInstruments`.
message SyncPaymentInstrumentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentInstrument payment_instrument = 1;
  SyncPaymentInstrumentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushPaymentInstrument`.
message PushPaymentInstrumentRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  PaymentInstrument payment_instrument = 3;
  PushPaymentInstrumentRequest.Details details = 4;
