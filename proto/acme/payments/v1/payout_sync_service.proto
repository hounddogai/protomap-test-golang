    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  ResolvePayoutConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPayoutSyncState`.
message GetPayoutSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPayoutSyncState`.
message GetPayoutSyncStateResponse {
  Payout payout = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListPayoutConflicts`.
message ListPayoutConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PayoutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPayoutConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPayoutConflicts`.
message ListPayoutConflictsResponse {
  repeated Payout payouts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
