syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PayoutSyncServiceProto";
option java_package = "com.acme.payments.v1";

// Keeps payouts in step with the systems of record in other regions.
service PayoutSyncService {
  // Syncs a payout.
  rpc SyncPayouts(SyncPayoutsRequest) returns (SyncPayoutsResponse);

  // Pushs a payout.
  rpc PushPayout(PushPayoutRequest) returns (PushPayoutResponse);

  // Pulls a payout.
  rpc PullPayouts(PullPayoutsRequest) returns (PullPayoutsResponse);

  // Reconciles a payout.
  rpc ReconcilePayouts(ReconcilePayoutsRequest) returns (ReconcilePayoutsResponse);

  // Exchanges changes of payouts with a peer.
  rpc StreamPayoutChanges(stream StreamPayoutChangesRequest) returns (stream StreamPayoutChangesResponse);

  // Resolves a payout.
  rpc ResolvePayoutConflict(ResolvePayoutConflictRequest) returns (ResolvePayoutConflictResponse);

  // Returns a payout.
  rpc GetPayoutSyncState(GetPayoutSyncStateRequest) returns (GetPayoutSyncStateResponse);

  // Lists payouts a page at a time.
  rpc ListPayoutConflicts(ListPayoutConflictsRequest) returns (ListPayoutConflictsResponse);
}

// The request of `SyncPayouts`.
message SyncPayoutsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  SyncPayoutsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncPayouts`.
message SyncPayoutsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  SyncPayoutsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushPayout`.
message PushPayoutRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  PushPayoutRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushPayout`.
message PushPayoutResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  PushPayoutResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullPayouts`.
message PullPayoutsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  PullPayoutsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullPayouts`.
message PullPayoutsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
