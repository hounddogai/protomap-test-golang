// The request of `StreamPayoutChanges`.
message StreamPayoutChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Payout change = 2;
    StreamPayoutChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamPayoutChanges`.
message StreamPayoutChangesResponse {
  Payout payout = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolvePayoutConflict`.
message ResolvePayoutConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  ResolvePayoutConflictRequest.Details details = 4;
  string reason = 5;
