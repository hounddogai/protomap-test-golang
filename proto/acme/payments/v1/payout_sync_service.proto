    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  PullPayoutsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcilePayouts`.
message ReconcilePayoutsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  ReconcilePayoutsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcilePayouts`.
message ReconcilePayoutsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
