syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "RefundApprovalServiceProto";
option java_package = "com.acme.payments.v1";

// Routes refunds through approval, with escalation and delegation.
service RefundApprovalService {
  // Submits a refund.
  rpc SubmitRefund(SubmitRefundRequest) returns (SubmitRefundResponse);

  // Approves a refund.
  rpc ApproveRefund(ApproveRefundRequest) returns (ApproveRefundResponse);

  // Lists refunds a page at a time.
  rpc ListPendingRefunds(ListPendingRefundsRequest) returns (ListPendingRefundsResponse);

  // Delegates a refund.
  rpc DelegateRefundApproval(DelegateRefundApprovalRequest) returns (DelegateRefundApprovalResponse);

  // Recalls a refund.
  rpc RecallRefund(RecallRefundRequest) returns (RecallRefundResponse);

  // Returns a refund.
  rpc GetRefundApprovalStatus(GetRefundApprovalStatusRequest) returns (GetRefundApprovalStatusResponse);

  // Comments a refund.
  rpc CommentRefundApproval(CommentRefundApprovalRequest) returns (CommentRefundApprovalResponse);
}

// The request of `SubmitRefund`.
message SubmitRefundRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  Refund refund = 3;
  SubmitRefundRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRefund`.
message SubmitRefundResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refund refund = 1;
  SubmitRefundResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveRefund`.
message ApproveRefundRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
