syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "RefundWorkflowServiceProto";
option java_package = "com.acme.payments.v1";

// Runs the long-lived workflow that takes a refund from start to finish.
service RefundWorkflowService {
  // Starts a refund.
  rpc StartRefundWorkflow(StartRefundWorkflowRequest) returns (StartRefundWorkflowResponse);

  // Advances a refund.
  rpc AdvanceRefundWorkflow(AdvanceRefundWorkflowRequest) returns (AdvanceRefundWorkflowResponse);

  // Cancels a refund.
  rpc CancelRefundWorkflow(CancelRefundWorkflowRequest) returns (CancelRefundWorkflowResponse);

  // Retrys a refund.
  rpc RetryRefundWorkflow(RetryRefundWorkflowRequest) returns (RetryRefundWorkflowResponse);

  // Pauses a refund.
  rpc PauseRefundWorkflow(PauseRefundWorkflowRequest) returns (PauseRefundWorkflowResponse);

  // Returns a refund.
  rpc InspectRefundWorkflow(InspectRefundWorkflowRequest) returns (InspectRefundWorkflowResponse);
}

// The request of `StartRefundWorkflow`.
message StartRefundWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  Refund refund = 3;
  StartRefundWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRefundWorkflow`.
message StartRefundWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refund refund = 1;
  StartRefundWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

