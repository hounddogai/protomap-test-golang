syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentLifecycleServiceProto";
option java_package = "com.acme.payments.v1";

// Moves a payment between the states of its lifecycle.
service PaymentLifecycleService {
  // Activates a payment.
  rpc ActivatePayment(ActivatePaymentRequest) returns (ActivatePaymentResponse);

  // Suspends a payment.
  rpc SuspendPayment(SuspendPaymentRequest) returns (SuspendPaymentResponse);

  // Terminates a payment.
  rpc TerminatePayment(TerminatePaymentRequest) returns (TerminatePaymentResponse);

  // Renews a payment.
  rpc RenewPayment(RenewPaymentRequest) returns (RenewPaymentResponse);

  // Expires a payment.
  rpc ExpirePayment(ExpirePaymentRequest) returns (ExpirePaymentResponse);

  // Schedules a payment.
  rpc SchedulePaymentExpiry(SchedulePaymentExpiryRequest) returns (SchedulePaymentExpiryResponse);
}

// The request of `ActivatePayment`.
message ActivatePaymentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_id = 2;
  ActivatePaymentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePayment`.
message ActivatePaymentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payment payment = 1;
  ActivatePaymentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

