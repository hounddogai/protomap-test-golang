syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PayoutCalculationServiceProto";
option java_package = "com.acme.payments.v1";

// Computes the figures of a payout, such as totals, taxes, and estimates.
service PayoutCalculationService {
  // Calculates a payout.
  rpc CalculatePayout(CalculatePayoutRequest) returns (CalculatePayoutResponse);

  // Estimates a payout.
  rpc EstimatePayout(EstimatePayoutRequest) returns (EstimatePayoutResponse);

  // Compares a payout.
  rpc ComparePayoutOptions(ComparePayoutOptionsRequest) returns (ComparePayoutOptionsResponse);

  // Recalculates a payout.
  rpc RecalculatePayouts(RecalculatePayoutsRequest) returns (RecalculatePayoutsResponse);

  // Simulates a payout.
  rpc SimulatePayout(SimulatePayoutRequest) returns (SimulatePayoutResponse);

  // Explains a payout.
  rpc ExplainPayoutCalculation(ExplainPayoutCalculationRequest) returns (ExplainPayoutCalculationResponse);
}

// The request of `CalculatePayout`.
message CalculatePayoutRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  CalculatePayoutRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePayout`.
message CalculatePayoutResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePayoutResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Payout payout = 1;
  CalculatePayoutResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

