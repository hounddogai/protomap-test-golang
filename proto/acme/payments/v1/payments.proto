syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentsProto";
option java_package = "com.acme.payments.v1";

// Where a payment is in its lifecycle.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_DRAFT = 1;
  PAYMENT_STATUS_ISSUED = 2;
  PAYMENT_STATUS_APPROVED = 3;
  PAYMENT_STATUS_PAID = 4;
  PAYMENT_STATUS_VOID = 5;
}

// Where a refund is in its lifecycle.
enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_DRAFT = 1;
  REFUND_STATUS_ISSUED = 2;
  REFUND_STATUS_APPROVED = 3;
  REFUND_STATUS_PAID = 4;
  REFUND_STATUS_VOID = 5;
}

// Where a payment instrument is in its lifecycle.
enum PaymentInstrumentStatus {
  PAYMENT_INSTRUMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_INSTRUMENT_STATUS_PENDING = 1;
  PAYMENT_INSTRUMENT_STATUS_OPEN = 2;
  PAYMENT_INSTRUMENT_STATUS_FROZEN = 3;
  PAYMENT_INSTRUMENT_STATUS_CLOSED = 4;
}

// Where a payout is in its lifecycle.
enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_DRAFT = 1;
  PAYOUT_STATUS_ISSUED = 2;
  PAYOUT_STATUS_APPROVED = 3;
  PAYOUT_STATUS_PAID = 4;
  PAYOUT_STATUS_VOID = 5;
}

// Where a dispute is in its lifecycle.
enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;
  DISPUTE_STATUS_NEW = 1;
  DISPUTE_STATUS_OPEN = 2;
  DISPUTE_STATUS_WAITING = 3;
  DISPUTE_STATUS_RESOLVED = 4;
  DISPUTE_STATUS_CLOSED = 5;
}

// The line of a payment.
message PaymentLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  PaymentLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a payment line.
message PaymentLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a payment.
message PaymentCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a payment.
message PaymentBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a payment.
message PaymentAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A payment of the payments domain.
message Payment {
  string payment_id = 1;
  string number = 2;
  PaymentStatus status = 3;
  RefundRef counterparty = 4;
  repeated PaymentLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    PaymentCardSettlement card = 8;
    PaymentBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated PaymentAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a refund.
message RefundLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  RefundLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a refund line.
message RefundLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a refund.
message RefundCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a refund.
message RefundBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a refund.
message RefundAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A refund of the payments domain.
message Refund {
  string refund_id = 1;
  string number = 2;
  RefundStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated RefundLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    RefundCardSettlement card = 8;
    RefundBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated RefundAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The limit of a payment instrument.
message PaymentInstrumentLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a payment instrument.
message PaymentInstrumentCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a payment instrument.
message PaymentInstrumentBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A payment instrument of the payments domain.
message PaymentInstrument {
  string payment_instrument_id = 1;
  acme.customers.v1.CustomerRef holder = 2;
  PaymentInstrumentStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated PaymentInstrumentLimit limits = 7;
  oneof funding {
    PaymentInstrumentCardFunding card = 8;
    PaymentInstrumentBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The line of a payout.
message PayoutLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  PayoutLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a payout line.
message PayoutLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a payout.
message PayoutCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a payout.
message PayoutBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a payout.
message PayoutAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A payout of the payments domain.
message Payout {
  string payout_id = 1;
  string number = 2;
  PayoutStatus status = 3;
  RefundRef counterparty = 4;
  repeated PayoutLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    PayoutCardSettlement card = 8;
    PayoutBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated PayoutAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of a dispute.
message DisputeComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a dispute.
message DisputeSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a dispute.
message DisputeChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a dispute.
message DisputeStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A dispute of the payments domain.
message Dispute {
  string dispute_id = 1;
  string subject = 2;
  DisputeStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated DisputeComment comments = 7;
  DisputeSla sla = 8;
  oneof origin {
    PaymentRef customer = 9;
    string external_reference = 10;
    DisputeChannelOrigin channel = 11;
  }
  repeated DisputeStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
