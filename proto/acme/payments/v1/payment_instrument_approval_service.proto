syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentInstrumentApprovalServiceProto";
option java_package = "com.acme.payments.v1";

// Routes payment instruments through approval, with escalation and delegation.
service PaymentInstrumentApprovalService {
  // Submits a payment instrument.
  rpc SubmitPaymentInstrument(SubmitPaymentInstrumentRequest) returns (SubmitPaymentInstrumentResponse);

  // Approves a payment instrument.
  rpc ApprovePaymentInstrument(ApprovePaymentInstrumentRequest) returns (ApprovePaymentInstrumentResponse);

  // Rejects a payment instrument.
  rpc RejectPaymentInstrument(RejectPaymentInstrumentRequest) returns (RejectPaymentInstrumentResponse);

  // Escalates a payment instrument.
  rpc EscalatePaymentInstrument(EscalatePaymentInstrumentRequest) returns (EscalatePaymentInstrumentResponse);

  // Lists payment instruments a page at a time.
  rpc ListPendingPaymentInstruments(ListPendingPaymentInstrumentsRequest) returns (ListPendingPaymentInstrumentsResponse);

  // Delegates a payment instrument.
  rpc DelegatePaymentInstrumentApproval(DelegatePaymentInstrumentApprovalRequest) returns (DelegatePaymentInstrumentApprovalResponse);

  // Recalls a payment instrument.
  rpc RecallPaymentInstrument(RecallPaymentInstrumentRequest) returns (RecallPaymentInstrumentResponse);

  // Returns a payment instrument.
  rpc GetPaymentInstrumentApprovalStatus(GetPaymentInstrumentApprovalStatusRequest) returns (GetPaymentInstrumentApprovalStatusResponse);

  // Comments a payment instrument.
  rpc CommentPaymentInstrumentApproval(CommentPaymentInstrumentApprovalRequest) returns (CommentPaymentInstrumentApprovalResponse);
}

// The request of `SubmitPaymentInstrument`.
message SubmitPaymentInstrumentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  PaymentInstrument payment_instrument = 3;
  SubmitPaymentInstrumentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPaymentInstrument`.
message SubmitPaymentInstrumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentInstrument payment_instrument = 1;
  SubmitPaymentInstrumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

