syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentServiceProto";
option java_package = "com.acme.payments.v1";

// Manages payments: creates, reads, changes, and lists them.
service PaymentService {
  // Creates a payment.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // Returns a payment.
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // Changes a payment.
  rpc UpdatePayment(UpdatePaymentRequest) returns (UpdatePaymentResponse);

  // Deletes a payment.
  rpc DeletePayment(DeletePaymentRequest) returns (DeletePaymentResponse);

  // Lists payments a page at a time.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);

  // Returns several payments at once.
  rpc BatchGetPayments(BatchGetPaymentsRequest) returns (BatchGetPaymentsResponse);

  // Lists payments a page at a time.
  rpc SearchPayments(SearchPaymentsRequest) returns (SearchPaymentsResponse);

  // Streams the changes of payments as they happen.
  rpc WatchPayments(WatchPaymentsRequest) returns (stream WatchPaymentsResponse);

  // Takes a stream of payments and answers once at the end.
  rpc BatchCreatePayments(stream BatchCreatePaymentsRequest) returns (BatchCreatePaymentsResponse);

  // Creates a payment.
  rpc ClonePayment(ClonePaymentRequest) returns (ClonePaymentResponse);
}

// The request of `CreatePayment`.
message CreatePaymentRequest {
  acme.common.v1.RequestContext context = 1;
  Payment payment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreatePayment`.
message CreatePaymentResponse {
  Payment payment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetPayment`.
message GetPaymentRequest {
  acme.common.v1.RequestContext context = 1;
  string payment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPayment`.
message GetPaymentResponse {
  Payment payment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdatePayment`.
message UpdatePaymentRequest {
  acme.common.v1.RequestContext context = 1;
  Payment payment = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdatePayment`.
message UpdatePaymentResponse {
  Payment payment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeletePayment`.
message DeletePaymentRequest {
  acme.common.v1.RequestContext context = 1;
  string payment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePayment`.
message DeletePaymentResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListPayments`.
message ListPaymentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PaymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPaymentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPayments`.
message ListPaymentsResponse {
  repeated Payment payments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetPayments`.
message BatchGetPaymentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string payment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetPayments`.
message BatchGetPaymentsResponse {
  repeated Payment payments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchPayments`.
message SearchPaymentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PaymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchPaymentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchPayments`.
message SearchPaymentsResponse {
  repeated Payment payments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchPayments`.
message WatchPaymentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PaymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchPaymentsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchPayments`.
message WatchPaymentsResponse {
  Payment payment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreatePayments`.
message BatchCreatePaymentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreatePaymentsRequest.StreamHeader header = 2;
    Payment record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreatePayments`.
message BatchCreatePaymentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string payment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreatePaymentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ClonePayment`.
message ClonePaymentRequest {
  acme.common.v1.RequestContext context = 1;
  Payment payment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `ClonePayment`.
message ClonePaymentResponse {
  Payment payment = 1;
  acme.common.v1.OperationResult result = 2;
}
