syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "DisputeCalculationServiceProto";
option java_package = "com.acme.payments.v1";

// Computes the figures of a dispute, such as totals, taxes, and estimates.
service DisputeCalculationService {
  // Calculates a dispute.
  rpc CalculateDispute(CalculateDisputeRequest) returns (CalculateDisputeResponse);

  // Estimates a dispute.
  rpc EstimateDispute(EstimateDisputeRequest) returns (EstimateDisputeResponse);

  // Quotes a dispute.
  rpc QuoteDispute(QuoteDisputeRequest) returns (QuoteDisputeResponse);

  // Compares a dispute.
  rpc CompareDisputeOptions(CompareDisputeOptionsRequest) returns (CompareDisputeOptionsResponse);

  // Recalculates a dispute.
  rpc RecalculateDisputes(RecalculateDisputesRequest) returns (RecalculateDisputesResponse);

  // Simulates a dispute.
  rpc SimulateDispute(SimulateDisputeRequest) returns (SimulateDisputeResponse);

  // Explains a dispute.
  rpc ExplainDisputeCalculation(ExplainDisputeCalculationRequest) returns (ExplainDisputeCalculationResponse);

  // Returns a dispute.
  rpc GetDisputeRates(GetDisputeRatesRequest) returns (GetDisputeRatesResponse);
}

// The request of `CalculateDispute`.
message CalculateDisputeRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  Dispute dispute = 3;
  CalculateDisputeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDispute`.
message CalculateDisputeResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDisputeResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Dispute dispute = 1;
  CalculateDisputeResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

