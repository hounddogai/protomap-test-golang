syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentInstrumentValidationServiceProto";
option java_package = "com.acme.payments.v1";

// Checks payment instruments against the rules before anything acts on them.
service PaymentInstrumentValidationService {
  // Validates a payment instrument.
  rpc ValidatePaymentInstrument(ValidatePaymentInstrumentRequest) returns (ValidatePaymentInstrumentResponse);

  // Previews a payment instrument.
  rpc PreviewPaymentInstrument(PreviewPaymentInstrumentRequest) returns (PreviewPaymentInstrumentResponse);

  // Checks a payment instrument.
  rpc CheckPaymentInstrumentEligibility(CheckPaymentInstrumentEligibilityRequest) returns (CheckPaymentInstrumentEligibilityResponse);

  // Normalizes a payment instrument.
  rpc NormalizePaymentInstrument(NormalizePaymentInstrumentRequest) returns (NormalizePaymentInstrumentResponse);

  // Explains a payment instrument.
  rpc ExplainPaymentInstrumentDecision(ExplainPaymentInstrumentDecisionRequest) returns (ExplainPaymentInstrumentDecisionResponse);

  // Scores a payment instrument.
  rpc ScorePaymentInstrument(ScorePaymentInstrumentRequest) returns (ScorePaymentInstrumentResponse);

  // Lints a payment instrument.
  rpc LintPaymentInstruments(LintPaymentInstrumentsRequest) returns (LintPaymentInstrumentsResponse);
}

// The request of `ValidatePaymentInstrument`.
message ValidatePaymentInstrumentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  PaymentInstrument payment_instrument = 3;
  ValidatePaymentInstrumentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePaymentInstrument`.
message ValidatePaymentInstrumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentInstrument payment_instrument = 1;
  ValidatePaymentInstrumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

