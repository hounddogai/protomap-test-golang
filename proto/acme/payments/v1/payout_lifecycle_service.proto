syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PayoutLifecycleServiceProto";
option java_package = "com.acme.payments.v1";

// Moves a payout between the states of its lifecycle.
service PayoutLifecycleService {
  // Activates a payout.
  rpc ActivatePayout(ActivatePayoutRequest) returns (ActivatePayoutResponse);

  // Suspends a payout.
  rpc SuspendPayout(SuspendPayoutRequest) returns (SuspendPayoutResponse);

  // Reinstates a payout.
  rpc ReinstatePayout(ReinstatePayoutRequest) returns (ReinstatePayoutResponse);

  // Renews a payout.
  rpc RenewPayout(RenewPayoutRequest) returns (RenewPayoutResponse);

  // Expires a payout.
  rpc ExpirePayout(ExpirePayoutRequest) returns (ExpirePayoutResponse);

  // Returns a payout.
  rpc GetPayoutLifecycle(GetPayoutLifecycleRequest) returns (GetPayoutLifecycleResponse);

  // Schedules a payout.
  rpc SchedulePayoutExpiry(SchedulePayoutExpiryRequest) returns (SchedulePayoutExpiryResponse);
}

// The request of `ActivatePayout`.
message ActivatePayoutRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  ActivatePayoutRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePayout`.
message ActivatePayoutResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  ActivatePayoutResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

