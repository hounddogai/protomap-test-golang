syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "DisputeLifecycleServiceProto";
option java_package = "com.acme.payments.v1";

// Moves a dispute between the states of its lifecycle.
service DisputeLifecycleService {
  // Activates a dispute.
  rpc ActivateDispute(ActivateDisputeRequest) returns (ActivateDisputeResponse);

  // Suspends a dispute.
  rpc SuspendDispute(SuspendDisputeRequest) returns (SuspendDisputeResponse);

  // Reinstates a dispute.
  rpc ReinstateDispute(ReinstateDisputeRequest) returns (ReinstateDisputeResponse);

  // Terminates a dispute.
  rpc TerminateDispute(TerminateDisputeRequest) returns (TerminateDisputeResponse);

  // Renews a dispute.
  rpc RenewDispute(RenewDisputeRequest) returns (RenewDisputeResponse);

  // Expires a dispute.
  rpc ExpireDispute(ExpireDisputeRequest) returns (ExpireDisputeResponse);

  // Returns a dispute.
  rpc GetDisputeLifecycle(GetDisputeLifecycleRequest) returns (GetDisputeLifecycleResponse);

  // Schedules a dispute.
  rpc ScheduleDisputeExpiry(ScheduleDisputeExpiryRequest) returns (ScheduleDisputeExpiryResponse);
}

// The request of `ActivateDispute`.
message ActivateDisputeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  ActivateDisputeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDispute`.
message ActivateDisputeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dispute dispute = 1;
  ActivateDisputeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

