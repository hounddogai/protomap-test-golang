syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentInstrumentLifecycleServiceProto";
option java_package = "com.acme.payments.v1";

// Moves a payment instrument between the states of its lifecycle.
service PaymentInstrumentLifecycleService {
  // Activates a payment instrument.
  rpc ActivatePaymentInstrument(ActivatePaymentInstrumentRequest) returns (ActivatePaymentInstrumentResponse);

  // Suspends a payment instrument.
  rpc SuspendPaymentInstrument(SuspendPaymentInstrumentRequest) returns (SuspendPaymentInstrumentResponse);

  // Reinstates a payment instrument.
  rpc ReinstatePaymentInstrument(ReinstatePaymentInstrumentRequest) returns (ReinstatePaymentInstrumentResponse);

  // Terminates a payment instrument.
  rpc TerminatePaymentInstrument(TerminatePaymentInstrumentRequest) returns (TerminatePaymentInstrumentResponse);

  // Renews a payment instrument.
  rpc RenewPaymentInstrument(RenewPaymentInstrumentRequest) returns (RenewPaymentInstrumentResponse);

  // Expires a payment instrument.
  rpc ExpirePaymentInstrument(ExpirePaymentInstrumentRequest) returns (ExpirePaymentInstrumentResponse);

  // Returns a payment instrument.
  rpc GetPaymentInstrumentLifecycle(GetPaymentInstrumentLifecycleRequest) returns (GetPaymentInstrumentLifecycleResponse);

  // Schedules a payment instrument.
  rpc SchedulePaymentInstrumentExpiry(SchedulePaymentInstrumentExpiryRequest) returns (SchedulePaymentInstrumentExpiryResponse);
}

// The request of `ActivatePaymentInstrument`.
message ActivatePaymentInstrumentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  ActivatePaymentInstrumentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePaymentInstrument`.
message ActivatePaymentInstrumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentInstrument payment_instrument = 1;
  ActivatePaymentInstrumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

