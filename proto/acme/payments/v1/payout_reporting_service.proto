syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PayoutReportingServiceProto";
option java_package = "com.acme.payments.v1";

// Builds and schedules reports about payouts.
service PayoutReportingService {
  // Generates a payout.
  rpc GeneratePayoutReport(GeneratePayoutReportRequest) returns (GeneratePayoutReportResponse);

  // Returns a payout.
  rpc FetchPayoutReport(FetchPayoutReportRequest) returns (FetchPayoutReportResponse);

  // Schedules a payout.
  rpc SchedulePayoutReport(SchedulePayoutReportRequest) returns (SchedulePayoutReportResponse);

  // Streams the changes of payouts as they happen.
  rpc StreamPayoutMetrics(StreamPayoutMetricsRequest) returns (stream StreamPayoutMetricsResponse);

  // Shares a payout.
  rpc SharePayoutReport(SharePayoutReportRequest) returns (SharePayoutReportResponse);

  // Deletes a payout.
  rpc DeletePayoutReport(DeletePayoutReportRequest) returns (DeletePayoutReportResponse);
}

// The request of `GeneratePayoutReport`.
message GeneratePayoutReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  GeneratePayoutReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePayoutReport`.
message GeneratePayoutReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPayoutReport`.
message FetchPayoutReportRequest {
  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPayoutReport`.
message FetchPayoutReportResponse {
  Payout payout = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePayoutReport`.
message SchedulePayoutReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  SchedulePayoutReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePayoutReport`.
message SchedulePayoutReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPayoutMetrics`.
message StreamPayoutMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PayoutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPayoutMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPayoutMetrics`.
message StreamPayoutMetricsResponse {
  Payout payout = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SharePayoutReport`.
message SharePayoutReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  SharePayoutReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePayoutReport`.
message SharePayoutReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  SharePayoutReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePayoutReport`.
message DeletePayoutReportRequest {
  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePayoutReport`.
message DeletePayoutReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
