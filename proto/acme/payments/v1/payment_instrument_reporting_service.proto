syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentInstrumentReportingServiceProto";
option java_package = "com.acme.payments.v1";

// Builds and schedules reports about payment instruments.
service PaymentInstrumentReportingService {
  // Generates a payment instrument.
  rpc GeneratePaymentInstrumentReport(GeneratePaymentInstrumentReportRequest) returns (GeneratePaymentInstrumentReportResponse);

  // Returns a payment instrument.
  rpc FetchPaymentInstrumentReport(FetchPaymentInstrumentReportRequest) returns (FetchPaymentInstrumentReportResponse);

  // Schedules a payment instrument.
  rpc SchedulePaymentInstrumentReport(SchedulePaymentInstrumentReportRequest) returns (SchedulePaymentInstrumentReportResponse);

  // Streams the changes of payment instruments as they happen.
  rpc StreamPaymentInstrumentMetrics(StreamPaymentInstrumentMetricsRequest) returns (stream StreamPaymentInstrumentMetricsResponse);

  // Shares a payment instrument.
  rpc SharePaymentInstrumentReport(SharePaymentInstrumentReportRequest) returns (SharePaymentInstrumentReportResponse);

  // Counts payment instruments by status.
  rpc CountPaymentInstrumentTotals(CountPaymentInstrumentTotalsRequest) returns (CountPaymentInstrumentTotalsResponse);

  // Deletes a payment instrument.
  rpc DeletePaymentInstrumentReport(DeletePaymentInstrumentReportRequest) returns (DeletePaymentInstrumentReportResponse);
}

// The request of `GeneratePaymentInstrumentReport`.
message GeneratePaymentInstrumentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  GeneratePaymentInstrumentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePaymentInstrumentReport`.
message GeneratePaymentInstrumentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPaymentInstrumentReport`.
message FetchPaymentInstrumentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPaymentInstrumentReport`.
message FetchPaymentInstrumentReportResponse {
  PaymentInstrument payment_instrument = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePaymentInstrumentReport`.
message SchedulePaymentInstrumentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  SchedulePaymentInstrumentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePaymentInstrumentReport`.
message SchedulePaymentInstrumentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPaymentInstrumentMetrics`.
message StreamPaymentInstrumentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PaymentInstrumentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPaymentInstrumentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPaymentInstrumentMetrics`.
message StreamPaymentInstrumentMetricsResponse {
  PaymentInstrument payment_instrument = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SharePaymentInstrumentReport`.
message SharePaymentInstrumentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  SharePaymentInstrumentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePaymentInstrumentReport`.
message SharePaymentInstrumentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentInstrument payment_instrument = 1;
  SharePaymentInstrumentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPaymentInstrumentTotals`.
message CountPaymentInstrumentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PaymentInstrumentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPaymentInstrumentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPaymentInstrumentTotals`.
message CountPaymentInstrumentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePaymentInstrumentReport`.
message DeletePaymentInstrumentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePaymentInstrumentReport`.
message DeletePaymentInstrumentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
