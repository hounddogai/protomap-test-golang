syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "RefundReportingServiceProto";
option java_package = "com.acme.payments.v1";

// Builds and schedules reports about refunds.
service RefundReportingService {
  // Generates a refund.
  rpc GenerateRefundReport(GenerateRefundReportRequest) returns (GenerateRefundReportResponse);

  // Returns a refund.
  rpc FetchRefundReport(FetchRefundReportRequest) returns (FetchRefundReportResponse);

  // Schedules a refund.
  rpc ScheduleRefundReport(ScheduleRefundReportRequest) returns (ScheduleRefundReportResponse);

  // Streams the changes of refunds as they happen.
  rpc StreamRefundMetrics(StreamRefundMetricsRequest) returns (stream StreamRefundMetricsResponse);

  // Lists refunds a page at a time.
  rpc ListRefundReports(ListRefundReportsRequest) returns (ListRefundReportsResponse);

  // Shares a refund.
  rpc ShareRefundReport(ShareRefundReportRequest) returns (ShareRefundReportResponse);

  // Counts refunds by status.
  rpc CountRefundTotals(CountRefundTotalsRequest) returns (CountRefundTotalsResponse);

  // Deletes a refund.
  rpc DeleteRefundReport(DeleteRefundReportRequest) returns (DeleteRefundReportResponse);
}

// The request of `GenerateRefundReport`.
message GenerateRefundReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  GenerateRefundReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRefundReport`.
message GenerateRefundReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRefundReport`.
message FetchRefundReportRequest {
  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRefundReport`.
message FetchRefundReportResponse {
  Refund refund = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleRefundReport`.
message ScheduleRefundReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  ScheduleRefundReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRefundReport`.
message ScheduleRefundReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamRefundMetrics`.
message StreamRefundMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRefundMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRefundMetrics`.
message StreamRefundMetricsResponse {
  Refund refund = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRefundReports`.
message ListRefundReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRefundReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRefundReports`.
message ListRefundReportsResponse {
  repeated Refund refunds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRefundReport`.
message ShareRefundReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  ShareRefundReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRefundReport`.
message ShareRefundReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refund refund = 1;
  ShareRefundReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRefundTotals`.
message CountRefundTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRefundTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRefundTotals`.
message CountRefundTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteRefundReport`.
message DeleteRefundReportRequest {
  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRefundReport`.
message DeleteRefundReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
