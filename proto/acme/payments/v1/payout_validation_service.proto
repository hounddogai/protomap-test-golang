syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PayoutValidationServiceProto";
option java_package = "com.acme.payments.v1";

// Checks payouts against the rules before anything acts on them.
service PayoutValidationService {
  // Validates a payout.
  rpc ValidatePayout(ValidatePayoutRequest) returns (ValidatePayoutResponse);

  // Previews a payout.
  rpc PreviewPayout(PreviewPayoutRequest) returns (PreviewPayoutResponse);

  // Checks a payout.
  rpc CheckPayoutEligibility(CheckPayoutEligibilityRequest) returns (CheckPayoutEligibilityResponse);

  // Normalizes a payout.
  rpc NormalizePayout(NormalizePayoutRequest) returns (NormalizePayoutResponse);

  // Scores a payout.
  rpc ScorePayout(ScorePayoutRequest) returns (ScorePayoutResponse);

  // Lints a payout.
  rpc LintPayouts(LintPayoutsRequest) returns (LintPayoutsResponse);

  // Returns a payout.
  rpc GetPayoutRules(GetPayoutRulesRequest) returns (GetPayoutRulesResponse);
}

// The request of `ValidatePayout`.
message ValidatePayoutRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  Payout payout = 3;
  ValidatePayoutRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePayout`.
message ValidatePayoutResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payout payout = 1;
  ValidatePayoutResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

