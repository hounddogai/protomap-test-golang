// The request of `GetPayoutRules`.
message GetPayoutRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string payout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPayoutRules`.
message GetPayoutRulesResponse {
  Payout payout = 1;
  acme.common.v1.OperationResult result = 2;
}
