syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "RefundQueryServiceProto";
option java_package = "com.acme.payments.v1";

// Answers read-only questions about refunds, for screens and reports.
service RefundQueryService {
  // Returns a refund.
  rpc LookupRefund(LookupRefundRequest) returns (LookupRefundResponse);

  // Lists refunds a page at a time.
  rpc BrowseRefunds(BrowseRefundsRequest) returns (BrowseRefundsResponse);

  // Lists refunds a page at a time.
  rpc FindRefunds(FindRefundsRequest) returns (FindRefundsResponse);

  // Returns several refunds at once.
  rpc ResolveRefunds(ResolveRefundsRequest) returns (ResolveRefundsResponse);

  // Streams every matching refund.
  rpc ExportRefunds(ExportRefundsRequest) returns (stream ExportRefundsResponse);

  // Summarizes a refund.
  rpc SummarizeRefunds(SummarizeRefundsRequest) returns (SummarizeRefundsResponse);

  // Lists refunds a page at a time.
  rpc SuggestRefunds(SuggestRefundsRequest) returns (SuggestRefundsResponse);

  // Returns a refund.
  rpc PeekRefund(PeekRefundRequest) returns (PeekRefundResponse);
}

// The request of `LookupRefund`.
message LookupRefundRequest {
  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRefund`.
message LookupRefundResponse {
  Refund refund = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRefunds`.
message BrowseRefundsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRefundsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRefunds`.
message BrowseRefundsResponse {
  repeated Refund refunds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindRefunds`.
message FindRefundsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindRefundsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindRefunds`.
message FindRefundsResponse {
  repeated Refund refunds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveRefunds`.
message ResolveRefundsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string refund_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveRefunds`.
message ResolveRefundsResponse {
  repeated Refund refunds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportRefunds`.
message ExportRefundsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportRefundsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportRefunds`.
message ExportRefundsResponse {
  Refund refund = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeRefunds`.
message SummarizeRefundsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  SummarizeRefundsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeRefunds`.
message SummarizeRefundsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestRefunds`.
message SuggestRefundsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefundStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestRefundsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestRefunds`.
message SuggestRefundsResponse {
  repeated Refund refunds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekRefund`.
message PeekRefundRequest {
  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekRefund`.
message PeekRefundResponse {
  Refund refund = 1;
  acme.common.v1.OperationResult result = 2;
}
