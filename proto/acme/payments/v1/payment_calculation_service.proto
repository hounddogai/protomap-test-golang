syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentCalculationServiceProto";
option java_package = "com.acme.payments.v1";

// Computes the figures of a payment, such as totals, taxes, and estimates.
service PaymentCalculationService {
  // Calculates a payment.
  rpc CalculatePayment(CalculatePaymentRequest) returns (CalculatePaymentResponse);

  // Estimates a payment.
  rpc EstimatePayment(EstimatePaymentRequest) returns (EstimatePaymentResponse);

  // Quotes a payment.
  rpc QuotePayment(QuotePaymentRequest) returns (QuotePaymentResponse);

  // Recalculates a payment.
  rpc RecalculatePayments(RecalculatePaymentsRequest) returns (RecalculatePaymentsResponse);

  // Simulates a payment.
  rpc SimulatePayment(SimulatePaymentRequest) returns (SimulatePaymentResponse);

  // Explains a payment.
  rpc ExplainPaymentCalculation(ExplainPaymentCalculationRequest) returns (ExplainPaymentCalculationResponse);

  // Returns a payment.
  rpc GetPaymentRates(GetPaymentRatesRequest) returns (GetPaymentRatesResponse);
}

// The request of `CalculatePayment`.
message CalculatePaymentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_id = 2;
  Payment payment = 3;
  CalculatePaymentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePayment`.
message CalculatePaymentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePaymentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Payment payment = 1;
  CalculatePaymentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

