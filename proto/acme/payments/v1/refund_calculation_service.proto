syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "RefundCalculationServiceProto";
option java_package = "com.acme.payments.v1";

// Computes the figures of a refund, such as totals, taxes, and estimates.
service RefundCalculationService {
  // Calculates a refund.
  rpc CalculateRefund(CalculateRefundRequest) returns (CalculateRefundResponse);

  // Estimates a refund.
  rpc EstimateRefund(EstimateRefundRequest) returns (EstimateRefundResponse);

  // Quotes a refund.
  rpc QuoteRefund(QuoteRefundRequest) returns (QuoteRefundResponse);

  // Compares a refund.
  rpc CompareRefundOptions(CompareRefundOptionsRequest) returns (CompareRefundOptionsResponse);

  // Recalculates a refund.
  rpc RecalculateRefunds(RecalculateRefundsRequest) returns (RecalculateRefundsResponse);

  // Simulates a refund.
  rpc SimulateRefund(SimulateRefundRequest) returns (SimulateRefundResponse);

  // Explains a refund.
  rpc ExplainRefundCalculation(ExplainRefundCalculationRequest) returns (ExplainRefundCalculationResponse);

  // Returns a refund.
  rpc GetRefundRates(GetRefundRatesRequest) returns (GetRefundRatesResponse);
}

// The request of `CalculateRefund`.
message CalculateRefundRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refund_id = 2;
  Refund refund = 3;
  CalculateRefundRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRefund`.
message CalculateRefundResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRefundResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Refund refund = 1;
  CalculateRefundResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

