syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentValidationServiceProto";
option java_package = "com.acme.payments.v1";

// Checks payments against the rules before anything acts on them.
service PaymentValidationService {
  // Validates a payment.
  rpc ValidatePayment(ValidatePaymentRequest) returns (ValidatePaymentResponse);

  // Previews a payment.
  rpc PreviewPayment(PreviewPaymentRequest) returns (PreviewPaymentResponse);

  // Checks a payment.
  rpc CheckPaymentEligibility(CheckPaymentEligibilityRequest) returns (CheckPaymentEligibilityResponse);

  // Normalizes a payment.
  rpc NormalizePayment(NormalizePaymentRequest) returns (NormalizePaymentResponse);

  // Explains a payment.
  rpc ExplainPaymentDecision(ExplainPaymentDecisionRequest) returns (ExplainPaymentDecisionResponse);

  // Scores a payment.
  rpc ScorePayment(ScorePaymentRequest) returns (ScorePaymentResponse);

  // Lints a payment.
  rpc LintPayments(LintPaymentsRequest) returns (LintPaymentsResponse);

  // Returns a payment.
  rpc GetPaymentRules(GetPaymentRulesRequest) returns (GetPaymentRulesResponse);
}

// The request of `ValidatePayment`.
message ValidatePaymentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_id = 2;
  Payment payment = 3;
  ValidatePaymentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePayment`.
message ValidatePaymentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Payment payment = 1;
  ValidatePaymentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

