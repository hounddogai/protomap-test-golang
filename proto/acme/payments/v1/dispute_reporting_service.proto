syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "DisputeReportingServiceProto";
option java_package = "com.acme.payments.v1";

// Builds and schedules reports about disputes.
service DisputeReportingService {
  // Generates a dispute.
  rpc GenerateDisputeReport(GenerateDisputeReportRequest) returns (GenerateDisputeReportResponse);

  // Returns a dispute.
  rpc FetchDisputeReport(FetchDisputeReportRequest) returns (FetchDisputeReportResponse);

  // Schedules a dispute.
  rpc ScheduleDisputeReport(ScheduleDisputeReportRequest) returns (ScheduleDisputeReportResponse);

  // Streams the changes of disputes as they happen.
  rpc StreamDisputeMetrics(StreamDisputeMetricsRequest) returns (stream StreamDisputeMetricsResponse);

  // Lists disputes a page at a time.
  rpc ListDisputeReports(ListDisputeReportsRequest) returns (ListDisputeReportsResponse);

  // Shares a dispute.
  rpc ShareDisputeReport(ShareDisputeReportRequest) returns (ShareDisputeReportResponse);

  // Counts disputes by status.
  rpc CountDisputeTotals(CountDisputeTotalsRequest) returns (CountDisputeTotalsResponse);

  // Deletes a dispute.
  rpc DeleteDisputeReport(DeleteDisputeReportRequest) returns (DeleteDisputeReportResponse);
}

// The request of `GenerateDisputeReport`.
message GenerateDisputeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  GenerateDisputeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDisputeReport`.
message GenerateDisputeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDisputeReport`.
message FetchDisputeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDisputeReport`.
message FetchDisputeReportResponse {
  Dispute dispute = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDisputeReport`.
message ScheduleDisputeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  ScheduleDisputeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDisputeReport`.
message ScheduleDisputeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamDisputeMetrics`.
message StreamDisputeMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DisputeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDisputeMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDisputeMetrics`.
message StreamDisputeMetricsResponse {
  Dispute dispute = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDisputeReports`.
message ListDisputeReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DisputeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDisputeReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDisputeReports`.
message ListDisputeReportsResponse {
  repeated Dispute disputes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDisputeReport`.
message ShareDisputeReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  ShareDisputeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDisputeReport`.
message ShareDisputeReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dispute dispute = 1;
  ShareDisputeReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDisputeTotals`.
message CountDisputeTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DisputeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDisputeTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDisputeTotals`.
message CountDisputeTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDisputeReport`.
message DeleteDisputeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDisputeReport`.
message DeleteDisputeReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
