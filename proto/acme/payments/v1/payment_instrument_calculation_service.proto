syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentInstrumentCalculationServiceProto";
option java_package = "com.acme.payments.v1";

// Computes the figures of a payment instrument, such as totals, taxes, and estimates.
service PaymentInstrumentCalculationService {
  // Calculates a payment instrument.
  rpc CalculatePaymentInstrument(CalculatePaymentInstrumentRequest) returns (CalculatePaymentInstrumentResponse);

  // Estimates a payment instrument.
  rpc EstimatePaymentInstrument(EstimatePaymentInstrumentRequest) returns (EstimatePaymentInstrumentResponse);

  // Quotes a payment instrument.
  rpc QuotePaymentInstrument(QuotePaymentInstrumentRequest) returns (QuotePaymentInstrumentResponse);

  // Compares a payment instrument.
  rpc ComparePaymentInstrumentOptions(ComparePaymentInstrumentOptionsRequest) returns (ComparePaymentInstrumentOptionsResponse);

  // Explains a payment instrument.
  rpc ExplainPaymentInstrumentCalculation(ExplainPaymentInstrumentCalculationRequest) returns (ExplainPaymentInstrumentCalculationResponse);

  // Returns a payment instrument.
  rpc GetPaymentInstrumentRates(GetPaymentInstrumentRatesRequest) returns (GetPaymentInstrumentRatesResponse);
}

// The request of `CalculatePaymentInstrument`.
message CalculatePaymentInstrumentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_instrument_id = 2;
  PaymentInstrument payment_instrument = 3;
  CalculatePaymentInstrumentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePaymentInstrument`.
message CalculatePaymentInstrumentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePaymentInstrumentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  PaymentInstrument payment_instrument = 1;
  CalculatePaymentInstrumentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

