syntax = "proto3";

package acme.payments.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payments/v1/payments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payments/v1;paymentsv1";
option java_multiple_files = true;
option java_outer_classname = "DisputeSyncServiceProto";
option java_package = "com.acme.payments.v1";

// Keeps disputes in step with the systems of record in other regions.
service DisputeSyncService {
  // Syncs a dispute.
  rpc SyncDisputes(SyncDisputesRequest) returns (SyncDisputesResponse);

  // Pushs a dispute.
  rpc PushDispute(PushDisputeRequest) returns (PushDisputeResponse);

  // Pulls a dispute.
  rpc PullDisputes(PullDisputesRequest) returns (PullDisputesResponse);

  // Reconciles a dispute.
  rpc ReconcileDisputes(ReconcileDisputesRequest) returns (ReconcileDisputesResponse);

  // Exchanges changes of disputes with a peer.
  rpc StreamDisputeChanges(stream StreamDisputeChangesRequest) returns (stream StreamDisputeChangesResponse);

  // Resolves a dispute.
  rpc ResolveDisputeConflict(ResolveDisputeConflictRequest) returns (ResolveDisputeConflictResponse);

  // Returns a dispute.
  rpc GetDisputeSyncState(GetDisputeSyncStateRequest) returns (GetDisputeSyncStateResponse);

  // Lists disputes a page at a time.
  rpc ListDisputeConflicts(ListDisputeConflictsRequest) returns (ListDisputeConflictsResponse);
}

// The request of `SyncDisputes`.
message SyncDisputesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispute_id = 2;
  Dispute dispute = 3;
  SyncDisputesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncDisputes`.
message SyncDisputesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dispute dispute = 1;
  SyncDisputesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushDispute`.
message PushDisputeRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
