syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "AssetsProto";
option java_package = "com.acme.assets.v1";

// Where a fixed asset is in its lifecycle.
enum FixedAssetStatus {
  FIXED_ASSET_STATUS_UNSPECIFIED = 0;
  FIXED_ASSET_STATUS_PLANNED = 1;
  FIXED_ASSET_STATUS_AVAILABLE = 2;
  FIXED_ASSET_STATUS_RESERVED = 3;
  FIXED_ASSET_STATUS_RETIRED = 4;
}

// Where a depreciation is in its lifecycle.
enum DepreciationStatus {
  DEPRECIATION_STATUS_UNSPECIFIED = 0;
  DEPRECIATION_STATUS_TENTATIVE = 1;
  DEPRECIATION_STATUS_CONFIRMED = 2;
  DEPRECIATION_STATUS_CANCELLED = 3;
  DEPRECIATION_STATUS_COMPLETED = 4;
}

// Where an asset transfer is in its lifecycle.
enum AssetTransferStatus {
  ASSET_TRANSFER_STATUS_UNSPECIFIED = 0;
  ASSET_TRANSFER_STATUS_DRAFT = 1;
  ASSET_TRANSFER_STATUS_ISSUED = 2;
  ASSET_TRANSFER_STATUS_APPROVED = 3;
  ASSET_TRANSFER_STATUS_PAID = 4;
  ASSET_TRANSFER_STATUS_VOID = 5;
}

// Where a disposal is in its lifecycle.
enum DisposalStatus {
  DISPOSAL_STATUS_UNSPECIFIED = 0;
  DISPOSAL_STATUS_NEW = 1;
  DISPOSAL_STATUS_OPEN = 2;
  DISPOSAL_STATUS_WAITING = 3;
  DISPOSAL_STATUS_RESOLVED = 4;
  DISPOSAL_STATUS_CLOSED = 5;
}

// The dimensions of a fixed asset.
message FixedAssetDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a fixed asset.
message FixedAssetComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A fixed asset of the assets domain.
message FixedAsset {
  string fixed_asset_id = 1;
  string code = 2;
  string name = 3;
  FixedAssetStatus status = 4;
  repeated string category_path = 5;
  FixedAssetDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, FixedAssetComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The participant of a depreciation.
message DepreciationParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a depreciation.
message DepreciationDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a depreciation.
message DepreciationWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A depreciation of the assets domain.
message Depreciation {
  string depreciation_id = 1;
  string title = 2;
  DepreciationStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated DepreciationParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    DepreciationDailyRule daily = 7;
    DepreciationWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of an asset transfer.
message AssetTransferLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  AssetTransferLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an asset transfer line.
message AssetTransferLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an asset transfer.
message AssetTransferCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an asset transfer.
message AssetTransferBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an asset transfer.
message AssetTransferAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An asset transfer of the assets domain.
message AssetTransfer {
  string asset_transfer_id = 1;
  string number = 2;
  AssetTransferStatus status = 3;
  FixedAssetRef counterparty = 4;
  repeated AssetTransferLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    AssetTransferCardSettlement card = 8;
    AssetTransferBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated AssetTransferAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of a disposal.
message DisposalComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a disposal.
message DisposalSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a disposal.
message DisposalChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a disposal.
message DisposalStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A disposal of the assets domain.
message Disposal {
  string disposal_id = 1;
  string subject = 2;
  DisposalStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated DisposalComment comments = 7;
  DisposalSla sla = 8;
  oneof origin {
    FixedAssetRef customer = 9;
    string external_reference = 10;
    DisposalChannelOrigin channel = 11;
  }
  repeated DisposalStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
