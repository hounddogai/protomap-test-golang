syntax = "proto3";

package acme.assets.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.assets.v1";

// A reference to a fixed asset of the assets domain.
message FixedAssetRef {
  string fixed_asset_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a depreciation of the assets domain.
message DepreciationRef {
  string depreciation_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to an asset transfer of the assets domain.
message AssetTransferRef {
  string asset_transfer_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a disposal of the assets domain.
message DisposalRef {
  string disposal_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
