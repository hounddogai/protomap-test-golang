syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "FixedAssetCalculationServiceProto";
option java_package = "com.acme.assets.v1";

// Computes the figures of a fixed asset, such as totals, taxes, and estimates.
service FixedAssetCalculationService {
  // Calculates a fixed asset.
  rpc CalculateFixedAsset(CalculateFixedAssetRequest) returns (CalculateFixedAssetResponse);

  // Estimates a fixed asset.
  rpc EstimateFixedAsset(EstimateFixedAssetRequest) returns (EstimateFixedAssetResponse);

  // Quotes a fixed asset.
  rpc QuoteFixedAsset(QuoteFixedAssetRequest) returns (QuoteFixedAssetResponse);

  // Recalculates a fixed asset.
  rpc RecalculateFixedAssets(RecalculateFixedAssetsRequest) returns (RecalculateFixedAssetsResponse);

  // Explains a fixed asset.
  rpc ExplainFixedAssetCalculation(ExplainFixedAssetCalculationRequest) returns (ExplainFixedAssetCalculationResponse);

  // Returns a fixed asset.
  rpc GetFixedAssetRates(GetFixedAssetRatesRequest) returns (GetFixedAssetRatesResponse);
}

// The request of `CalculateFixedAsset`.
message CalculateFixedAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  CalculateFixedAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFixedAsset`.
message CalculateFixedAssetResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFixedAssetResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FixedAsset fixed_asset = 1;
  CalculateFixedAssetResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

