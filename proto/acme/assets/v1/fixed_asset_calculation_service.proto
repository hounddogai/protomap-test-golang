  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  ExplainFixedAssetCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainFixedAssetCalculation`.
message ExplainFixedAssetCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FixedAsset fixed_asset = 1;
  ExplainFixedAssetCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetFixedAssetRates`.
message GetFixedAssetRatesRequest {
