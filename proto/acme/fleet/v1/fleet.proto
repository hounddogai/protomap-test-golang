syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/fleet/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "FleetProto";
option java_package = "com.acme.fleet.v1";

// Where a vehicle is in its lifecycle.
enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_PLANNED = 1;
  VEHICLE_STATUS_AVAILABLE = 2;
  VEHICLE_STATUS_RESERVED = 3;
  VEHICLE_STATUS_RETIRED = 4;
}

// Where a vehicle group is in its lifecycle.
enum VehicleGroupStatus {
  VEHICLE_GROUP_STATUS_UNSPECIFIED = 0;
  VEHICLE_GROUP_STATUS_ACTIVE = 1;
  VEHICLE_GROUP_STATUS_INACTIVE = 2;
}

// Where an inspection is in its lifecycle.
enum InspectionStatus {
  INSPECTION_STATUS_UNSPECIFIED = 0;
  INSPECTION_STATUS_NEW = 1;
  INSPECTION_STATUS_OPEN = 2;
  INSPECTION_STATUS_WAITING = 3;
  INSPECTION_STATUS_RESOLVED = 4;
  INSPECTION_STATUS_CLOSED = 5;
}

// The dimensions of a vehicle.
message VehicleDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a vehicle.
message VehicleComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A vehicle of the fleet domain.
message Vehicle {
  string vehicle_id = 1;
  string code = 2;
  string name = 3;
  VehicleStatus status = 4;
  repeated string category_path = 5;
  VehicleDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, VehicleComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// A vehicle group of the fleet domain.
message VehicleGroup {
  string vehicle_group_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated VehicleGroup children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  VehicleGroupStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The comment of an inspection.
message InspectionComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of an inspection.
message InspectionSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of an inspection.
message InspectionChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of an inspection.
message InspectionStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// An inspection of the fleet domain.
message Inspection {
  string inspection_id = 1;
  string subject = 2;
  InspectionStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated InspectionComment comments = 7;
  InspectionSla sla = 8;
  oneof origin {
    VehicleGroupRef customer = 9;
    string external_reference = 10;
    InspectionChannelOrigin channel = 11;
  }
  repeated InspectionStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
