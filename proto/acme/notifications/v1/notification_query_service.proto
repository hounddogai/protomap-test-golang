syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationQueryServiceProto";
option java_package = "com.acme.notifications.v1";

// Answers read-only questions about notifications, for screens and reports.
service NotificationQueryService {
  // Returns a notification.
  rpc LookupNotification(LookupNotificationRequest) returns (LookupNotificationResponse);

  // Lists notifications a page at a time.
  rpc BrowseNotifications(BrowseNotificationsRequest) returns (BrowseNotificationsResponse);

  // Lists notifications a page at a time.
  rpc FindNotifications(FindNotificationsRequest) returns (FindNotificationsResponse);

  // Counts notifications by status.
  rpc CountNotifications(CountNotificationsRequest) returns (CountNotificationsResponse);

  // Returns several notifications at once.
  rpc ResolveNotifications(ResolveNotificationsRequest) returns (ResolveNotificationsResponse);

  // Streams every matching notification.
  rpc ExportNotifications(ExportNotificationsRequest) returns (stream ExportNotificationsResponse);

  // Summarizes a notification.
  rpc SummarizeNotifications(SummarizeNotificationsRequest) returns (SummarizeNotificationsResponse);

  // Returns a notification.
  rpc PeekNotification(PeekNotificationRequest) returns (PeekNotificationResponse);
}

// The request of `LookupNotification`.
message LookupNotificationRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupNotification`.
message LookupNotificationResponse {
  Notification notification = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseNotifications`.
message BrowseNotificationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseNotificationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseNotifications`.
message BrowseNotificationsResponse {
  repeated Notification notifications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindNotifications`.
message FindNotificationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindNotificationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindNotifications`.
message FindNotificationsResponse {
  repeated Notification notifications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountNotifications`.
message CountNotificationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountNotificationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountNotifications`.
message CountNotificationsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveNotifications`.
message ResolveNotificationsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string notification_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveNotifications`.
message ResolveNotificationsResponse {
  repeated Notification notifications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportNotifications`.
message ExportNotificationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportNotificationsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportNotifications`.
message ExportNotificationsResponse {
  Notification notification = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeNotifications`.
message SummarizeNotificationsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  SummarizeNotificationsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeNotifications`.
message SummarizeNotificationsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekNotification`.
message PeekNotificationRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekNotification`.
message PeekNotificationResponse {
  Notification notification = 1;
  acme.common.v1.OperationResult result = 2;
}
