syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationValidationServiceProto";
option java_package = "com.acme.notifications.v1";

// Checks notifications against the rules before anything acts on them.
service NotificationValidationService {
  // Validates a notification.
  rpc ValidateNotification(ValidateNotificationRequest) returns (ValidateNotificationResponse);

  // Previews a notification.
  rpc PreviewNotification(PreviewNotificationRequest) returns (PreviewNotificationResponse);

  // Checks a notification.
  rpc CheckNotificationEligibility(CheckNotificationEligibilityRequest) returns (CheckNotificationEligibilityResponse);

  // Normalizes a notification.
  rpc NormalizeNotification(NormalizeNotificationRequest) returns (NormalizeNotificationResponse);

  // Explains a notification.
  rpc ExplainNotificationDecision(ExplainNotificationDecisionRequest) returns (ExplainNotificationDecisionResponse);

  // Scores a notification.
  rpc ScoreNotification(ScoreNotificationRequest) returns (ScoreNotificationResponse);

  // Lints a notification.
  rpc LintNotifications(LintNotificationsRequest) returns (LintNotificationsResponse);

  // Returns a notification.
  rpc GetNotificationRules(GetNotificationRulesRequest) returns (GetNotificationRulesResponse);
}

// The request of `ValidateNotification`.
message ValidateNotificationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  ValidateNotificationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateNotification`.
message ValidateNotificationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  ValidateNotificationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

