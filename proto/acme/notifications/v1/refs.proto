syntax = "proto3";

package acme.notifications.v1;

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.notifications.v1";

// A reference to a notification of the notifications domain.
message NotificationRef {
  string notification_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a notification template of the notifications domain.
message NotificationTemplateRef {
  string notification_template_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a delivery attempt of the notifications domain.
message DeliveryAttemptRef {
  string delivery_attempt_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a subscription of the notifications domain.
message SubscriptionRef {
  string subscription_id = 1;
  string display_name = 2;
  int64 version = 3;
}
