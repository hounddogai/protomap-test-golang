syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "WorkspaceServiceProto";
option java_package = "com.acme.datahub.v1";

// Manages workspaces: creates, reads, changes, and lists them.
service WorkspaceService {
  // Creates a workspace.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  // Returns a workspace.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);

  // Changes a workspace.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);

  // Deletes a workspace.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Lists workspaces a page at a time.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);

  // Returns several workspaces at once.
  rpc BatchGetWorkspaces(BatchGetWorkspacesRequest) returns (BatchGetWorkspacesResponse);

  // Lists workspaces a page at a time.
  rpc SearchWorkspaces(SearchWorkspacesRequest) returns (SearchWorkspacesResponse);

  // Streams the changes of workspaces as they happen.
  rpc WatchWorkspaces(WatchWorkspacesRequest) returns (stream WatchWorkspacesResponse);

  // Takes a stream of workspaces and answers once at the end.
  rpc BatchCreateWorkspaces(stream BatchCreateWorkspacesRequest) returns (BatchCreateWorkspacesResponse);

  // Creates a workspace.
  rpc CloneWorkspace(CloneWorkspaceRequest) returns (CloneWorkspaceResponse);
}

// The request of `CreateWorkspace`.
message CreateWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  Workspace workspace = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateWorkspace`.
message CreateWorkspaceResponse {
  Workspace workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetWorkspace`.
message GetWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetWorkspace`.
message GetWorkspaceResponse {
  Workspace workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateWorkspace`.
message UpdateWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  Workspace workspace = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateWorkspace`.
message UpdateWorkspaceResponse {
  Workspace workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteWorkspace`.
message DeleteWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteWorkspace`.
message DeleteWorkspaceResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListWorkspaces`.
message ListWorkspacesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWorkspacesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWorkspaces`.
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetWorkspaces`.
message BatchGetWorkspacesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string workspace_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetWorkspaces`.
message BatchGetWorkspacesResponse {
  repeated Workspace workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchWorkspaces`.
message SearchWorkspacesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchWorkspacesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchWorkspaces`.
message SearchWorkspacesResponse {
  repeated Workspace workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchWorkspaces`.
message WatchWorkspacesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchWorkspacesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchWorkspaces`.
message WatchWorkspacesResponse {
  Workspace workspace = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateWorkspaces`.
message BatchCreateWorkspacesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateWorkspacesRequest.StreamHeader header = 2;
    Workspace record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateWorkspaces`.
message BatchCreateWorkspacesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string workspace_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateWorkspacesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneWorkspace`.
message CloneWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  Workspace workspace = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneWorkspace`.
message CloneWorkspaceResponse {
  Workspace workspace = 1;
  acme.common.v1.OperationResult result = 2;
}
