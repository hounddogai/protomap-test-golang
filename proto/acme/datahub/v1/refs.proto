syntax = "proto3";

package acme.datahub.v1;

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.datahub.v1";

// A reference to a workspace of the datahub domain.
message WorkspaceRef {
  string workspace_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a notebook of the datahub domain.
message NotebookRef {
  string notebook_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a data share of the datahub domain.
message DataShareRef {
  string data_share_id = 1;
  string display_name = 2;
  string number = 3;
}
