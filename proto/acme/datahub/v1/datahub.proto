syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/datahub/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DatahubProto";
option java_package = "com.acme.datahub.v1";

// Where a workspace is in its lifecycle.
enum WorkspaceStatus {
  WORKSPACE_STATUS_UNSPECIFIED = 0;
  WORKSPACE_STATUS_NEW = 1;
  WORKSPACE_STATUS_OPEN = 2;
  WORKSPACE_STATUS_WAITING = 3;
  WORKSPACE_STATUS_RESOLVED = 4;
  WORKSPACE_STATUS_CLOSED = 5;
}

// Where a notebook is in its lifecycle.
enum NotebookStatus {
  NOTEBOOK_STATUS_UNSPECIFIED = 0;
  NOTEBOOK_STATUS_DRAFT = 1;
  NOTEBOOK_STATUS_ISSUED = 2;
  NOTEBOOK_STATUS_APPROVED = 3;
  NOTEBOOK_STATUS_PAID = 4;
  NOTEBOOK_STATUS_VOID = 5;
}

// Where a data share is in its lifecycle.
enum DataShareStatus {
  DATA_SHARE_STATUS_UNSPECIFIED = 0;
  DATA_SHARE_STATUS_DRAFT = 1;
  DATA_SHARE_STATUS_ISSUED = 2;
  DATA_SHARE_STATUS_APPROVED = 3;
  DATA_SHARE_STATUS_PAID = 4;
  DATA_SHARE_STATUS_VOID = 5;
}

// The comment of a workspace.
message WorkspaceComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a workspace.
message WorkspaceSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a workspace.
message WorkspaceChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a workspace.
message WorkspaceStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A workspace of the datahub domain.
message Workspace {
  string workspace_id = 1;
  string subject = 2;
  WorkspaceStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated WorkspaceComment comments = 7;
  WorkspaceSla sla = 8;
  oneof origin {
    acme.customers.v1.CustomerRef customer = 9;
    string external_reference = 10;
    WorkspaceChannelOrigin channel = 11;
  }
  repeated WorkspaceStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of a notebook.
message NotebookLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  NotebookLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a notebook line.
message NotebookLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a notebook.
message NotebookCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a notebook.
message NotebookBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a notebook.
message NotebookAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A notebook of the datahub domain.
message Notebook {
  string notebook_id = 1;
  string number = 2;
  NotebookStatus status = 3;
  WorkspaceRef counterparty = 4;
  repeated NotebookLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    NotebookCardSettlement card = 8;
    NotebookBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated NotebookAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a data share.
message DataShareLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  DataShareLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a data share line.
message DataShareLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a data share.
message DataShareCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a data share.
message DataShareBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a data share.
message DataShareAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A data share of the datahub domain.
message DataShare {
  string data_share_id = 1;
  string number = 2;
  DataShareStatus status = 3;
  NotebookRef counterparty = 4;
  repeated DataShareLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    DataShareCardSettlement card = 8;
    DataShareBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated DataShareAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
