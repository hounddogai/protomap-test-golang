syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionQueryServiceProto";
option java_package = "com.acme.admissions.v1";

// Answers read-only questions about admissions, for screens and reports.
service AdmissionQueryService {
  // Returns an admission.
  rpc LookupAdmission(LookupAdmissionRequest) returns (LookupAdmissionResponse);

  // Lists admissions a page at a time.
  rpc BrowseAdmissions(BrowseAdmissionsRequest) returns (BrowseAdmissionsResponse);

  // Counts admissions by status.
  rpc CountAdmissions(CountAdmissionsRequest) returns (CountAdmissionsResponse);

  // Returns several admissions at once.
  rpc ResolveAdmissions(ResolveAdmissionsRequest) returns (ResolveAdmissionsResponse);

  // Streams every matching admission.
  rpc ExportAdmissions(ExportAdmissionsRequest) returns (stream ExportAdmissionsResponse);

  // Summarizes an admission.
  rpc SummarizeAdmissions(SummarizeAdmissionsRequest) returns (SummarizeAdmissionsResponse);

  // Lists admissions a page at a time.
  rpc SuggestAdmissions(SuggestAdmissionsRequest) returns (SuggestAdmissionsResponse);

  // Returns an admission.
  rpc PeekAdmission(PeekAdmissionRequest) returns (PeekAdmissionResponse);
}

// The request of `LookupAdmission`.
message LookupAdmissionRequest {
  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupAdmission`.
message LookupAdmissionResponse {
  Admission admission = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseAdmissions`.
message BrowseAdmissionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AdmissionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseAdmissionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseAdmissions`.
message BrowseAdmissionsResponse {
  repeated Admission admissions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAdmissions`.
message CountAdmissionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AdmissionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAdmissionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAdmissions`.
message CountAdmissionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveAdmissions`.
message ResolveAdmissionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string admission_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveAdmissions`.
message ResolveAdmissionsResponse {
  repeated Admission admissions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportAdmissions`.
message ExportAdmissionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AdmissionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportAdmissionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportAdmissions`.
message ExportAdmissionsResponse {
  Admission admission = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeAdmissions`.
message SummarizeAdmissionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  SummarizeAdmissionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeAdmissions`.
message SummarizeAdmissionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestAdmissions`.
message SuggestAdmissionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AdmissionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestAdmissionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestAdmissions`.
message SuggestAdmissionsResponse {
  repeated Admission admissions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekAdmission`.
message PeekAdmissionRequest {
  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekAdmission`.
message PeekAdmissionResponse {
  Admission admission = 1;
  acme.common.v1.OperationResult result = 2;
}
