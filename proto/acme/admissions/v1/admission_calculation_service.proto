syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionCalculationServiceProto";
option java_package = "com.acme.admissions.v1";

// Computes the figures of an admission, such as totals, taxes, and estimates.
service AdmissionCalculationService {
  // Calculates an admission.
  rpc CalculateAdmission(CalculateAdmissionRequest) returns (CalculateAdmissionResponse);

  // Estimates an admission.
  rpc EstimateAdmission(EstimateAdmissionRequest) returns (EstimateAdmissionResponse);

  // Compares an admission.
  rpc CompareAdmissionOptions(CompareAdmissionOptionsRequest) returns (CompareAdmissionOptionsResponse);

  // Recalculates an admission.
  rpc RecalculateAdmissions(RecalculateAdmissionsRequest) returns (RecalculateAdmissionsResponse);

  // Simulates an admission.
  rpc SimulateAdmission(SimulateAdmissionRequest) returns (SimulateAdmissionResponse);

  // Explains an admission.
  rpc ExplainAdmissionCalculation(ExplainAdmissionCalculationRequest) returns (ExplainAdmissionCalculationResponse);

  // Returns an admission.
  rpc GetAdmissionRates(GetAdmissionRatesRequest) returns (GetAdmissionRatesResponse);
}

// The request of `CalculateAdmission`.
message CalculateAdmissionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  Admission admission = 3;
  CalculateAdmissionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAdmission`.
message CalculateAdmissionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAdmissionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Admission admission = 1;
  CalculateAdmissionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

