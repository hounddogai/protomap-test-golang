syntax = "proto3";

package acme.admissions.v1;

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.admissions.v1";

// A reference to an admission of the admissions domain.
message AdmissionRef {
  string admission_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a gate scan of the admissions domain.
message GateScanRef {
  string gate_scan_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a wristband of the admissions domain.
message WristbandRef {
  string wristband_id = 1;
  string display_name = 2;
  string code = 3;
}
