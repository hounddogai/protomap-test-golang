syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionsProto";
option java_package = "com.acme.admissions.v1";

// Where an admission is in its lifecycle.
enum AdmissionStatus {
  ADMISSION_STATUS_UNSPECIFIED = 0;
  ADMISSION_STATUS_RECEIVED = 1;
  ADMISSION_STATUS_PROCESSED = 2;
  ADMISSION_STATUS_DISCARDED = 3;
}

// Where a gate scan is in its lifecycle.
enum GateScanStatus {
  GATE_SCAN_STATUS_UNSPECIFIED = 0;
  GATE_SCAN_STATUS_RECEIVED = 1;
  GATE_SCAN_STATUS_PROCESSED = 2;
  GATE_SCAN_STATUS_DISCARDED = 3;
}

// Where a wristband is in its lifecycle.
enum WristbandStatus {
  WRISTBAND_STATUS_UNSPECIFIED = 0;
  WRISTBAND_STATUS_PLANNED = 1;
  WRISTBAND_STATUS_AVAILABLE = 2;
  WRISTBAND_STATUS_RESERVED = 3;
  WRISTBAND_STATUS_RETIRED = 4;
}

// The measurement of an admission.
message AdmissionMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// An admission of the admissions domain.
message Admission {
  string admission_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  GateScanRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated AdmissionMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The measurement of a gate scan.
message GateScanMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A gate scan of the admissions domain.
message GateScan {
  string gate_scan_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  AdmissionRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated GateScanMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The dimensions of a wristband.
message WristbandDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a wristband.
message WristbandComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A wristband of the admissions domain.
message Wristband {
  string wristband_id = 1;
  string code = 2;
  string name = 3;
  WristbandStatus status = 4;
  repeated string category_path = 5;
  WristbandDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, WristbandComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}
