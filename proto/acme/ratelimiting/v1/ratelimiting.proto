syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/ratelimiting/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RatelimitingProto";
option java_package = "com.acme.ratelimiting.v1";

// Where a rate limit is in its lifecycle.
enum RateLimitStatus {
  RATE_LIMIT_STATUS_UNSPECIFIED = 0;
  RATE_LIMIT_STATUS_DRAFT = 1;
  RATE_LIMIT_STATUS_ENABLED = 2;
  RATE_LIMIT_STATUS_DISABLED = 3;
  RATE_LIMIT_STATUS_RETIRED = 4;
}

// Where a quota bucket is in its lifecycle.
enum QuotaBucketStatus {
  QUOTA_BUCKET_STATUS_UNSPECIFIED = 0;
  QUOTA_BUCKET_STATUS_PENDING = 1;
  QUOTA_BUCKET_STATUS_OPEN = 2;
  QUOTA_BUCKET_STATUS_FROZEN = 3;
  QUOTA_BUCKET_STATUS_CLOSED = 4;
}

// Where a throttle is in its lifecycle.
enum ThrottleStatus {
  THROTTLE_STATUS_UNSPECIFIED = 0;
  THROTTLE_STATUS_RECEIVED = 1;
  THROTTLE_STATUS_PROCESSED = 2;
  THROTTLE_STATUS_DISCARDED = 3;
}

// The condition of a rate limit.
message RateLimitCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a rate limit.
message RateLimitDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a rate limit.
message RateLimitRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a rate limit.
message RateLimitBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A rate limit of the ratelimiting domain.
message RateLimit {
  string rate_limit_id = 1;
  string name = 2;
  string description = 3;
  RateLimitStatus status = 4;
  int32 priority = 5;
  repeated RateLimitCondition conditions = 6;
  oneof action {
    RateLimitDiscountAction discount = 7;
    RateLimitRouteAction route = 8;
    RateLimitBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The limit of a quota bucket.
message QuotaBucketLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a quota bucket.
message QuotaBucketCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a quota bucket.
message QuotaBucketBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A quota bucket of the ratelimiting domain.
message QuotaBucket {
  string quota_bucket_id = 1;
  RateLimitRef holder = 2;
  QuotaBucketStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated QuotaBucketLimit limits = 7;
  oneof funding {
    QuotaBucketCardFunding card = 8;
    QuotaBucketBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The measurement of a throttle.
message ThrottleMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A throttle of the ratelimiting domain.
message Throttle {
  string throttle_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  RateLimitRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated ThrottleMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
