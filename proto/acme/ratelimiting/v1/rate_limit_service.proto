syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Manages rate limits: creates, reads, changes, and lists them.
service RateLimitService {
  // Creates a rate limit.
  rpc CreateRateLimit(CreateRateLimitRequest) returns (CreateRateLimitResponse);

  // Returns a rate limit.
  rpc GetRateLimit(GetRateLimitRequest) returns (GetRateLimitResponse);

  // Changes a rate limit.
  rpc UpdateRateLimit(UpdateRateLimitRequest) returns (UpdateRateLimitResponse);

  // Deletes a rate limit.
  rpc DeleteRateLimit(DeleteRateLimitRequest) returns (DeleteRateLimitResponse);

  // Lists rate limits a page at a time.
  rpc ListRateLimits(ListRateLimitsRequest) returns (ListRateLimitsResponse);

  // Returns several rate limits at once.
  rpc BatchGetRateLimits(BatchGetRateLimitsRequest) returns (BatchGetRateLimitsResponse);

  // Lists rate limits a page at a time.
  rpc SearchRateLimits(SearchRateLimitsRequest) returns (SearchRateLimitsResponse);

  // Streams the changes of rate limits as they happen.
  rpc WatchRateLimits(WatchRateLimitsRequest) returns (stream WatchRateLimitsResponse);

  // Takes a stream of rate limits and answers once at the end.
  rpc BatchCreateRateLimits(stream BatchCreateRateLimitsRequest) returns (BatchCreateRateLimitsResponse);

  // Creates a rate limit.
  rpc CloneRateLimit(CloneRateLimitRequest) returns (CloneRateLimitResponse);
}

// The request of `CreateRateLimit`.
message CreateRateLimitRequest {
  acme.common.v1.RequestContext context = 1;
  RateLimit rate_limit = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateRateLimit`.
message CreateRateLimitResponse {
  RateLimit rate_limit = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetRateLimit`.
message GetRateLimitRequest {
  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRateLimit`.
message GetRateLimitResponse {
  RateLimit rate_limit = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateRateLimit`.
message UpdateRateLimitRequest {
  acme.common.v1.RequestContext context = 1;
  RateLimit rate_limit = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateRateLimit`.
message UpdateRateLimitResponse {
  RateLimit rate_limit = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteRateLimit`.
message DeleteRateLimitRequest {
  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRateLimit`.
message DeleteRateLimitResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListRateLimits`.
message ListRateLimitsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RateLimitStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRateLimitsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRateLimits`.
message ListRateLimitsResponse {
  repeated RateLimit rate_limits = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetRateLimits`.
message BatchGetRateLimitsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string rate_limit_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetRateLimits`.
message BatchGetRateLimitsResponse {
  repeated RateLimit rate_limits = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchRateLimits`.
message SearchRateLimitsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RateLimitStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchRateLimitsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchRateLimits`.
message SearchRateLimitsResponse {
  repeated RateLimit rate_limits = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchRateLimits`.
message WatchRateLimitsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RateLimitStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchRateLimitsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchRateLimits`.
message WatchRateLimitsResponse {
  RateLimit rate_limit = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateRateLimits`.
message BatchCreateRateLimitsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateRateLimitsRequest.StreamHeader header = 2;
    RateLimit record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateRateLimits`.
message BatchCreateRateLimitsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string rate_limit_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateRateLimitsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneRateLimit`.
message CloneRateLimitRequest {
  acme.common.v1.RequestContext context = 1;
  RateLimit rate_limit = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneRateLimit`.
message CloneRateLimitResponse {
  RateLimit rate_limit = 1;
  acme.common.v1.OperationResult result = 2;
}
