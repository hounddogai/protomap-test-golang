syntax = "proto3";

package acme.ratelimiting.v1;

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.ratelimiting.v1";

// A reference to a rate limit of the ratelimiting domain.
message RateLimitRef {
  string rate_limit_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a quota bucket of the ratelimiting domain.
message QuotaBucketRef {
  string quota_bucket_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a throttle of the ratelimiting domain.
message ThrottleRef {
  string throttle_id = 1;
  string display_name = 2;
  string kind = 3;
}
