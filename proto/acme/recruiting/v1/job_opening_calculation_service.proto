syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "JobOpeningCalculationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Computes the figures of a job opening, such as totals, taxes, and estimates.
service JobOpeningCalculationService {
  // Calculates a job opening.
  rpc CalculateJobOpening(CalculateJobOpeningRequest) returns (CalculateJobOpeningResponse);

  // Estimates a job opening.
  rpc EstimateJobOpening(EstimateJobOpeningRequest) returns (EstimateJobOpeningResponse);

  // Quotes a job opening.
  rpc QuoteJobOpening(QuoteJobOpeningRequest) returns (QuoteJobOpeningResponse);

  // Compares a job opening.
  rpc CompareJobOpeningOptions(CompareJobOpeningOptionsRequest) returns (CompareJobOpeningOptionsResponse);

  // Recalculates a job opening.
  rpc RecalculateJobOpenings(RecalculateJobOpeningsRequest) returns (RecalculateJobOpeningsResponse);

  // Simulates a job opening.
  rpc SimulateJobOpening(SimulateJobOpeningRequest) returns (SimulateJobOpeningResponse);

  // Explains a job opening.
  rpc ExplainJobOpeningCalculation(ExplainJobOpeningCalculationRequest) returns (ExplainJobOpeningCalculationResponse);

  // Returns a job opening.
  rpc GetJobOpeningRates(GetJobOpeningRatesRequest) returns (GetJobOpeningRatesResponse);
}

// The request of `CalculateJobOpening`.
message CalculateJobOpeningRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  JobOpening job_opening = 3;
  CalculateJobOpeningRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateJobOpening`.
message CalculateJobOpeningResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateJobOpeningResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  JobOpening job_opening = 1;
  CalculateJobOpeningResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

