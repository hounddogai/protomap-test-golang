syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "JobOpeningQueryServiceProto";
option java_package = "com.acme.recruiting.v1";

// Answers read-only questions about job openings, for screens and reports.
service JobOpeningQueryService {
  // Returns a job opening.
  rpc LookupJobOpening(LookupJobOpeningRequest) returns (LookupJobOpeningResponse);

  // Lists job openings a page at a time.
  rpc BrowseJobOpenings(BrowseJobOpeningsRequest) returns (BrowseJobOpeningsResponse);

  // Counts job openings by status.
  rpc CountJobOpenings(CountJobOpeningsRequest) returns (CountJobOpeningsResponse);

  // Returns several job openings at once.
  rpc ResolveJobOpenings(ResolveJobOpeningsRequest) returns (ResolveJobOpeningsResponse);

  // Streams every matching job opening.
  rpc ExportJobOpenings(ExportJobOpeningsRequest) returns (stream ExportJobOpeningsResponse);

  // Summarizes a job opening.
  rpc SummarizeJobOpenings(SummarizeJobOpeningsRequest) returns (SummarizeJobOpeningsResponse);

  // Lists job openings a page at a time.
  rpc SuggestJobOpenings(SuggestJobOpeningsRequest) returns (SuggestJobOpeningsResponse);

  // Returns a job opening.
  rpc PeekJobOpening(PeekJobOpeningRequest) returns (PeekJobOpeningResponse);
}

// The request of `LookupJobOpening`.
message LookupJobOpeningRequest {
  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupJobOpening`.
message LookupJobOpeningResponse {
  JobOpening job_opening = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseJobOpenings`.
message BrowseJobOpeningsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated JobOpeningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseJobOpeningsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseJobOpenings`.
message BrowseJobOpeningsResponse {
  repeated JobOpening job_openings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountJobOpenings`.
message CountJobOpeningsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated JobOpeningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountJobOpeningsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountJobOpenings`.
message CountJobOpeningsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveJobOpenings`.
message ResolveJobOpeningsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string job_opening_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveJobOpenings`.
message ResolveJobOpeningsResponse {
  repeated JobOpening job_openings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportJobOpenings`.
message ExportJobOpeningsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated JobOpeningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportJobOpeningsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportJobOpenings`.
message ExportJobOpeningsResponse {
  JobOpening job_opening = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeJobOpenings`.
message SummarizeJobOpeningsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  SummarizeJobOpeningsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeJobOpenings`.
message SummarizeJobOpeningsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestJobOpenings`.
message SuggestJobOpeningsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated JobOpeningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestJobOpeningsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestJobOpenings`.
message SuggestJobOpeningsResponse {
  repeated JobOpening job_openings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekJobOpening`.
message PeekJobOpeningRequest {
  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekJobOpening`.
message PeekJobOpeningResponse {
  JobOpening job_opening = 1;
  acme.common.v1.OperationResult result = 2;
}
