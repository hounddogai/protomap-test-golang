syntax = "proto3";

package acme.recruiting.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.recruiting.v1";

// A reference to a job opening of the recruiting domain.
message JobOpeningRef {
  string job_opening_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a candidate of the recruiting domain.
message CandidateRef {
  string candidate_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to an interview of the recruiting domain.
message InterviewRef {
  string interview_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to an offer of the recruiting domain.
message OfferRef {
  string offer_id = 1;
  string display_name = 2;
  string number = 3;
}
