syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/employees/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "RecruitingProto";
option java_package = "com.acme.recruiting.v1";

// Where a job opening is in its lifecycle.
enum JobOpeningStatus {
  JOB_OPENING_STATUS_UNSPECIFIED = 0;
  JOB_OPENING_STATUS_DRAFT = 1;
  JOB_OPENING_STATUS_ISSUED = 2;
  JOB_OPENING_STATUS_APPROVED = 3;
  JOB_OPENING_STATUS_PAID = 4;
  JOB_OPENING_STATUS_VOID = 5;
}

// Where a candidate is in its lifecycle.
enum CandidateStatus {
  CANDIDATE_STATUS_UNSPECIFIED = 0;
  CANDIDATE_STATUS_PROSPECT = 1;
  CANDIDATE_STATUS_ACTIVE = 2;
  CANDIDATE_STATUS_SUSPENDED = 3;
  CANDIDATE_STATUS_CLOSED = 4;
}

// Where an interview is in its lifecycle.
enum InterviewStatus {
  INTERVIEW_STATUS_UNSPECIFIED = 0;
  INTERVIEW_STATUS_TENTATIVE = 1;
  INTERVIEW_STATUS_CONFIRMED = 2;
  INTERVIEW_STATUS_CANCELLED = 3;
  INTERVIEW_STATUS_COMPLETED = 4;
}

// Where an offer is in its lifecycle.
enum OfferStatus {
  OFFER_STATUS_UNSPECIFIED = 0;
  OFFER_STATUS_DRAFT = 1;
  OFFER_STATUS_ISSUED = 2;
  OFFER_STATUS_APPROVED = 3;
  OFFER_STATUS_PAID = 4;
  OFFER_STATUS_VOID = 5;
}

// The line of a job opening.
message JobOpeningLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  JobOpeningLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a job opening line.
message JobOpeningLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a job opening.
message JobOpeningCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a job opening.
message JobOpeningBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a job opening.
message JobOpeningAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A job opening of the recruiting domain.
message JobOpening {
  string job_opening_id = 1;
  string number = 2;
  JobOpeningStatus status = 3;
  InterviewRef counterparty = 4;
  repeated JobOpeningLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    JobOpeningCardSettlement card = 8;
    JobOpeningBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated JobOpeningAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The preferences of a candidate.
message CandidatePreferences {
  string language = 1;
  bool marketing_opt_in = 2;
  repeated string channels = 3;
  acme.common.v1.TimeWindow quiet_hours = 4;
}

// The passport of a candidate.
message CandidatePassport {
  string number = 1;
  string issuing_country = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// The national id of a candidate.
message CandidateNationalId {
  string number = 1;
  string issuing_country = 2;
}

// A candidate of the recruiting domain.
message Candidate {
  string candidate_id = 1;
  acme.common.v1.PersonName name = 2;
  acme.common.v1.ContactInfo contact = 3;
  acme.common.v1.PostalAddress primary_address = 4;
  CandidateStatus status = 5;
  repeated string segments = 6;
  map<string, string> attributes = 7;
  CandidatePreferences preferences = 8;
  oneof identity_document {
    CandidatePassport passport = 9;
    CandidateNationalId national_id = 10;
    string tax_number = 11;
  }
  acme.identity.v1.UserRef relationship_manager = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The participant of an interview.
message InterviewParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of an interview.
message InterviewDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of an interview.
message InterviewWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// An interview of the recruiting domain.
message Interview {
  string interview_id = 1;
  string title = 2;
  InterviewStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated InterviewParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    InterviewDailyRule daily = 7;
    InterviewWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of an offer.
message OfferLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  OfferLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an offer line.
message OfferLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an offer.
message OfferCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an offer.
message OfferBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an offer.
message OfferAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An offer of the recruiting domain.
message Offer {
  string offer_id = 1;
  string number = 2;
  OfferStatus status = 3;
  acme.employees.v1.EmployeeRef counterparty = 4;
  repeated OfferLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    OfferCardSettlement card = 8;
    OfferBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated OfferAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
