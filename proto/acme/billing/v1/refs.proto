syntax = "proto3";

package acme.billing.v1;

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.billing.v1";

// A reference to a billing account of the billing domain.
message BillingAccountRef {
  string billing_account_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to an invoice of the billing domain.
message InvoiceRef {
  string invoice_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a credit note of the billing domain.
message CreditNoteRef {
  string credit_note_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a payment term of the billing domain.
message PaymentTermRef {
  string payment_term_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a dunning of the billing domain.
message DunningRef {
  string dunning_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
