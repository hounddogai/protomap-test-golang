syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "BillingProto";
option java_package = "com.acme.billing.v1";

// Where a billing account is in its lifecycle.
enum BillingAccountStatus {
  BILLING_ACCOUNT_STATUS_UNSPECIFIED = 0;
  BILLING_ACCOUNT_STATUS_PENDING = 1;
  BILLING_ACCOUNT_STATUS_OPEN = 2;
  BILLING_ACCOUNT_STATUS_FROZEN = 3;
  BILLING_ACCOUNT_STATUS_CLOSED = 4;
}

// Where an invoice is in its lifecycle.
enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_DRAFT = 1;
  INVOICE_STATUS_ISSUED = 2;
  INVOICE_STATUS_APPROVED = 3;
  INVOICE_STATUS_PAID = 4;
  INVOICE_STATUS_VOID = 5;
}

// Where a credit note is in its lifecycle.
enum CreditNoteStatus {
  CREDIT_NOTE_STATUS_UNSPECIFIED = 0;
  CREDIT_NOTE_STATUS_DRAFT = 1;
  CREDIT_NOTE_STATUS_ISSUED = 2;
  CREDIT_NOTE_STATUS_APPROVED = 3;
  CREDIT_NOTE_STATUS_PAID = 4;
  CREDIT_NOTE_STATUS_VOID = 5;
}

// Where a payment term is in its lifecycle.
enum PaymentTermStatus {
  PAYMENT_TERM_STATUS_UNSPECIFIED = 0;
  PAYMENT_TERM_STATUS_DRAFT = 1;
  PAYMENT_TERM_STATUS_ENABLED = 2;
  PAYMENT_TERM_STATUS_DISABLED = 3;
  PAYMENT_TERM_STATUS_RETIRED = 4;
}

// Where a dunning is in its lifecycle.
enum DunningStatus {
  DUNNING_STATUS_UNSPECIFIED = 0;
  DUNNING_STATUS_NEW = 1;
  DUNNING_STATUS_OPEN = 2;
  DUNNING_STATUS_WAITING = 3;
  DUNNING_STATUS_RESOLVED = 4;
  DUNNING_STATUS_CLOSED = 5;
}

// The limit of a billing account.
message BillingAccountLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a billing account.
message BillingAccountCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a billing account.
message BillingAccountBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A billing account of the billing domain.
message BillingAccount {
  string billing_account_id = 1;
  InvoiceRef holder = 2;
  BillingAccountStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated BillingAccountLimit limits = 7;
  oneof funding {
    BillingAccountCardFunding card = 8;
    BillingAccountBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The line of an invoice.
message InvoiceLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  InvoiceLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an invoice line.
message InvoiceLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an invoice.
message InvoiceCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an invoice.
message InvoiceBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an invoice.
message InvoiceAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An invoice of the billing domain.
message Invoice {
  string invoice_id = 1;
  string number = 2;
  InvoiceStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated InvoiceLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    InvoiceCardSettlement card = 8;
    InvoiceBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated InvoiceAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a credit note.
message CreditNoteLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  CreditNoteLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a credit note line.
message CreditNoteLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a credit note.
message CreditNoteCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a credit note.
message CreditNoteBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a credit note.
message CreditNoteAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A credit note of the billing domain.
message CreditNote {
  string credit_note_id = 1;
  string number = 2;
  CreditNoteStatus status = 3;
  InvoiceRef counterparty = 4;
  repeated CreditNoteLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    CreditNoteCardSettlement card = 8;
    CreditNoteBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated CreditNoteAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The condition of a payment term.
message PaymentTermCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a payment term.
message PaymentTermDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a payment term.
message PaymentTermRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a payment term.
message PaymentTermBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A payment term of the billing domain.
message PaymentTerm {
  string payment_term_id = 1;
  string name = 2;
  string description = 3;
  PaymentTermStatus status = 4;
  int32 priority = 5;
  repeated PaymentTermCondition conditions = 6;
  oneof action {
    PaymentTermDiscountAction discount = 7;
    PaymentTermRouteAction route = 8;
    PaymentTermBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The comment of a dunning.
message DunningComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a dunning.
message DunningSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a dunning.
message DunningChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a dunning.
message DunningStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A dunning of the billing domain.
message Dunning {
  string dunning_id = 1;
  string subject = 2;
  DunningStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated DunningComment comments = 7;
  DunningSla sla = 8;
  oneof origin {
    BillingAccountRef customer = 9;
    string external_reference = 10;
    DunningChannelOrigin channel = 11;
  }
  repeated DunningStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
