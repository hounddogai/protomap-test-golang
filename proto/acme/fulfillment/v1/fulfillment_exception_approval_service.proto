syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "FulfillmentExceptionApprovalServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Routes fulfillment exceptions through approval, with escalation and delegation.
service FulfillmentExceptionApprovalService {
  // Submits a fulfillment exception.
  rpc SubmitFulfillmentException(SubmitFulfillmentExceptionRequest) returns (SubmitFulfillmentExceptionResponse);

  // Approves a fulfillment exception.
  rpc ApproveFulfillmentException(ApproveFulfillmentExceptionRequest) returns (ApproveFulfillmentExceptionResponse);

  // Rejects a fulfillment exception.
  rpc RejectFulfillmentException(RejectFulfillmentExceptionRequest) returns (RejectFulfillmentExceptionResponse);

  // Escalates a fulfillment exception.
  rpc EscalateFulfillmentException(EscalateFulfillmentExceptionRequest) returns (EscalateFulfillmentExceptionResponse);

  // Delegates a fulfillment exception.
  rpc DelegateFulfillmentExceptionApproval(DelegateFulfillmentExceptionApprovalRequest) returns (DelegateFulfillmentExceptionApprovalResponse);

  // Comments a fulfillment exception.
  rpc CommentFulfillmentExceptionApproval(CommentFulfillmentExceptionApprovalRequest) returns (CommentFulfillmentExceptionApprovalResponse);
}

// The request of `SubmitFulfillmentException`.
message SubmitFulfillmentExceptionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fulfillment_exception_id = 2;
  FulfillmentException fulfillment_exception = 3;
  SubmitFulfillmentExceptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFulfillmentException`.
message SubmitFulfillmentExceptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FulfillmentException fulfillment_exception = 1;
  SubmitFulfillmentExceptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

