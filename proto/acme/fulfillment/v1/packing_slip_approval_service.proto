syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "PackingSlipApprovalServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Routes packing slips through approval, with escalation and delegation.
service PackingSlipApprovalService {
  // Submits a packing slip.
  rpc SubmitPackingSlip(SubmitPackingSlipRequest) returns (SubmitPackingSlipResponse);

  // Approves a packing slip.
  rpc ApprovePackingSlip(ApprovePackingSlipRequest) returns (ApprovePackingSlipResponse);

  // Rejects a packing slip.
  rpc RejectPackingSlip(RejectPackingSlipRequest) returns (RejectPackingSlipResponse);

  // Escalates a packing slip.
  rpc EscalatePackingSlip(EscalatePackingSlipRequest) returns (EscalatePackingSlipResponse);

  // Lists packing slips a page at a time.
  rpc ListPendingPackingSlips(ListPendingPackingSlipsRequest) returns (ListPendingPackingSlipsResponse);

  // Delegates a packing slip.
  rpc DelegatePackingSlipApproval(DelegatePackingSlipApprovalRequest) returns (DelegatePackingSlipApprovalResponse);

  // Recalls a packing slip.
  rpc RecallPackingSlip(RecallPackingSlipRequest) returns (RecallPackingSlipResponse);

  // Returns a packing slip.
  rpc GetPackingSlipApprovalStatus(GetPackingSlipApprovalStatusRequest) returns (GetPackingSlipApprovalStatusResponse);

  // Comments a packing slip.
  rpc CommentPackingSlipApproval(CommentPackingSlipApprovalRequest) returns (CommentPackingSlipApprovalResponse);
}

// The request of `SubmitPackingSlip`.
message SubmitPackingSlipRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string packing_slip_id = 2;
  PackingSlip packing_slip = 3;
  SubmitPackingSlipRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPackingSlip`.
message SubmitPackingSlipResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PackingSlip packing_slip = 1;
  SubmitPackingSlipResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

