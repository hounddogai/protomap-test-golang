syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "FulfillmentWorkflowServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Runs the long-lived workflow that takes a fulfillment from start to finish.
service FulfillmentWorkflowService {
  // Starts a fulfillment.
  rpc StartFulfillmentWorkflow(StartFulfillmentWorkflowRequest) returns (StartFulfillmentWorkflowResponse);

  // Advances a fulfillment.
  rpc AdvanceFulfillmentWorkflow(AdvanceFulfillmentWorkflowRequest) returns (AdvanceFulfillmentWorkflowResponse);

  // Cancels a fulfillment.
  rpc CancelFulfillmentWorkflow(CancelFulfillmentWorkflowRequest) returns (CancelFulfillmentWorkflowResponse);

  // Pauses a fulfillment.
  rpc PauseFulfillmentWorkflow(PauseFulfillmentWorkflowRequest) returns (PauseFulfillmentWorkflowResponse);

  // Resumes a fulfillment.
  rpc ResumeFulfillmentWorkflow(ResumeFulfillmentWorkflowRequest) returns (ResumeFulfillmentWorkflowResponse);

  // Returns a fulfillment.
  rpc InspectFulfillmentWorkflow(InspectFulfillmentWorkflowRequest) returns (InspectFulfillmentWorkflowResponse);

  // Lists fulfillments a page at a time.
  rpc ListFulfillmentWorkflows(ListFulfillmentWorkflowsRequest) returns (ListFulfillmentWorkflowsResponse);

  // Signals a fulfillment.
  rpc SignalFulfillmentWorkflow(SignalFulfillmentWorkflowRequest) returns (SignalFulfillmentWorkflowResponse);
}

// The request of `StartFulfillmentWorkflow`.
message StartFulfillmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fulfillment_id = 2;
  Fulfillment fulfillment = 3;
  StartFulfillmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFulfillmentWorkflow`.
message StartFulfillmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Fulfillment fulfillment = 1;
  StartFulfillmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

