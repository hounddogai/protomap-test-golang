syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "FulfillmentExceptionValidationServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Checks fulfillment exceptions against the rules before anything acts on them.
service FulfillmentExceptionValidationService {
  // Validates a fulfillment exception.
  rpc ValidateFulfillmentException(ValidateFulfillmentExceptionRequest) returns (ValidateFulfillmentExceptionResponse);

  // Previews a fulfillment exception.
  rpc PreviewFulfillmentException(PreviewFulfillmentExceptionRequest) returns (PreviewFulfillmentExceptionResponse);

  // Checks a fulfillment exception.
  rpc CheckFulfillmentExceptionEligibility(CheckFulfillmentExceptionEligibilityRequest) returns (CheckFulfillmentExceptionEligibilityResponse);

  // Normalizes a fulfillment exception.
  rpc NormalizeFulfillmentException(NormalizeFulfillmentExceptionRequest) returns (NormalizeFulfillmentExceptionResponse);

  // Explains a fulfillment exception.
  rpc ExplainFulfillmentExceptionDecision(ExplainFulfillmentExceptionDecisionRequest) returns (ExplainFulfillmentExceptionDecisionResponse);

  // Scores a fulfillment exception.
  rpc ScoreFulfillmentException(ScoreFulfillmentExceptionRequest) returns (ScoreFulfillmentExceptionResponse);

  // Lints a fulfillment exception.
  rpc LintFulfillmentExceptions(LintFulfillmentExceptionsRequest) returns (LintFulfillmentExceptionsResponse);

  // Returns a fulfillment exception.
  rpc GetFulfillmentExceptionRules(GetFulfillmentExceptionRulesRequest) returns (GetFulfillmentExceptionRulesResponse);
}

// The request of `ValidateFulfillmentException`.
message ValidateFulfillmentExceptionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fulfillment_exception_id = 2;
  FulfillmentException fulfillment_exception = 3;
  ValidateFulfillmentExceptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFulfillmentException`.
message ValidateFulfillmentExceptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FulfillmentException fulfillment_exception = 1;
  ValidateFulfillmentExceptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

