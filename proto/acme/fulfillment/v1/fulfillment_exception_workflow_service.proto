option java_multiple_files = true;
option java_outer_classname = "FulfillmentExceptionWorkflowServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Runs the long-lived workflow that takes a fulfillment exception from start to finish.
service FulfillmentExceptionWorkflowService {
  // Starts a fulfillment exception.
  rpc StartFulfillmentExceptionWorkflow(StartFulfillmentExceptionWorkflowRequest) returns (StartFulfillmentExceptionWorkflowResponse);

  // Advances a fulfillment exception.
  rpc AdvanceFulfillmentExceptionWorkflow(AdvanceFulfillmentExceptionWorkflowRequest) returns (AdvanceFulfillmentExceptionWorkflowResponse);

  // Cancels a fulfillment exception.
  rpc CancelFulfillmentExceptionWorkflow(CancelFulfillmentExceptionWorkflowRequest) returns (CancelFulfillmentExceptionWorkflowResponse);

  // Retrys a fulfillment exception.
  rpc RetryFulfillmentExceptionWorkflow(RetryFulfillmentExceptionWorkflowRequest) returns (RetryFulfillmentExceptionWorkflowResponse);

  // Pauses a fulfillment exception.
  rpc PauseFulfillmentExceptionWorkflow(PauseFulfillmentExceptionWorkflowRequest) returns (PauseFulfillmentExceptionWorkflowResponse);

  // Resumes a fulfillment exception.
  rpc ResumeFulfillmentExceptionWorkflow(ResumeFulfillmentExceptionWorkflowRequest) returns (ResumeFulfillmentExceptionWorkflowResponse);

  // Signals a fulfillment exception.
  rpc SignalFulfillmentExceptionWorkflow(SignalFulfillmentExceptionWorkflowRequest) returns (SignalFulfillmentExceptionWorkflowResponse);
}

// The request of `StartFulfillmentExceptionWorkflow`.
message StartFulfillmentExceptionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fulfillment_exception_id = 2;
  FulfillmentException fulfillment_exception = 3;
  StartFulfillmentExceptionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFulfillmentExceptionWorkflow`.
message StartFulfillmentExceptionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FulfillmentException fulfillment_exception = 1;
  StartFulfillmentExceptionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

