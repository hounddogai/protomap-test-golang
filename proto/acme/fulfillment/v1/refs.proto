syntax = "proto3";

package acme.fulfillment.v1;

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.fulfillment.v1";

// A reference to a fulfillment of the fulfillment domain.
message FulfillmentRef {
  string fulfillment_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a packing slip of the fulfillment domain.
message PackingSlipRef {
  string packing_slip_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a fulfillment exception of the fulfillment domain.
message FulfillmentExceptionRef {
  string fulfillment_exception_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
