syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "FulfillmentServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Manages fulfillments: creates, reads, changes, and lists them.
service FulfillmentService {
  // Creates a fulfillment.
  rpc CreateFulfillment(CreateFulfillmentRequest) returns (CreateFulfillmentResponse);

  // Returns a fulfillment.
  rpc GetFulfillment(GetFulfillmentRequest) returns (GetFulfillmentResponse);

  // Changes a fulfillment.
  rpc UpdateFulfillment(UpdateFulfillmentRequest) returns (UpdateFulfillmentResponse);

  // Returns several fulfillments at once.
  rpc BatchGetFulfillments(BatchGetFulfillmentsRequest) returns (BatchGetFulfillmentsResponse);

  // Lists fulfillments a page at a time.
  rpc SearchFulfillments(SearchFulfillmentsRequest) returns (SearchFulfillmentsResponse);

  // Streams the changes of fulfillments as they happen.
  rpc WatchFulfillments(WatchFulfillmentsRequest) returns (stream WatchFulfillmentsResponse);

  // Takes a stream of fulfillments and answers once at the end.
  rpc BatchCreateFulfillments(stream BatchCreateFulfillmentsRequest) returns (BatchCreateFulfillmentsResponse);

  // Creates a fulfillment.
  rpc CloneFulfillment(CloneFulfillmentRequest) returns (CloneFulfillmentResponse);
}

// The request of `CreateFulfillment`.
message CreateFulfillmentRequest {
  acme.common.v1.RequestContext context = 1;
  Fulfillment fulfillment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateFulfillment`.
message CreateFulfillmentResponse {
  Fulfillment fulfillment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetFulfillment`.
message GetFulfillmentRequest {
  acme.common.v1.RequestContext context = 1;
  string fulfillment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFulfillment`.
message GetFulfillmentResponse {
  Fulfillment fulfillment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateFulfillment`.
message UpdateFulfillmentRequest {
  acme.common.v1.RequestContext context = 1;
  Fulfillment fulfillment = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateFulfillment`.
message UpdateFulfillmentResponse {
  Fulfillment fulfillment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BatchGetFulfillments`.
message BatchGetFulfillmentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string fulfillment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetFulfillments`.
message BatchGetFulfillmentsResponse {
  repeated Fulfillment fulfillments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchFulfillments`.
message SearchFulfillmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FulfillmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchFulfillmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchFulfillments`.
message SearchFulfillmentsResponse {
  repeated Fulfillment fulfillments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchFulfillments`.
message WatchFulfillmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FulfillmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchFulfillmentsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchFulfillments`.
message WatchFulfillmentsResponse {
  Fulfillment fulfillment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateFulfillments`.
message BatchCreateFulfillmentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateFulfillmentsRequest.StreamHeader header = 2;
    Fulfillment record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateFulfillments`.
message BatchCreateFulfillmentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string fulfillment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateFulfillmentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneFulfillment`.
message CloneFulfillmentRequest {
  acme.common.v1.RequestContext context = 1;
  Fulfillment fulfillment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneFulfillment`.
message CloneFulfillmentResponse {
  Fulfillment fulfillment = 1;
  acme.common.v1.OperationResult result = 2;
}
