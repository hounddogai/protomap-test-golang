syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/fulfillment/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "FulfillmentProto";
option java_package = "com.acme.fulfillment.v1";

// Where a fulfillment is in its lifecycle.
enum FulfillmentStatus {
  FULFILLMENT_STATUS_UNSPECIFIED = 0;
  FULFILLMENT_STATUS_DRAFT = 1;
  FULFILLMENT_STATUS_ISSUED = 2;
  FULFILLMENT_STATUS_APPROVED = 3;
  FULFILLMENT_STATUS_PAID = 4;
  FULFILLMENT_STATUS_VOID = 5;
}

// Where a packing slip is in its lifecycle.
enum PackingSlipStatus {
  PACKING_SLIP_STATUS_UNSPECIFIED = 0;
  PACKING_SLIP_STATUS_DRAFT = 1;
  PACKING_SLIP_STATUS_ISSUED = 2;
  PACKING_SLIP_STATUS_APPROVED = 3;
  PACKING_SLIP_STATUS_PAID = 4;
  PACKING_SLIP_STATUS_VOID = 5;
}

// Where a fulfillment exception is in its lifecycle.
enum FulfillmentExceptionStatus {
  FULFILLMENT_EXCEPTION_STATUS_UNSPECIFIED = 0;
  FULFILLMENT_EXCEPTION_STATUS_NEW = 1;
  FULFILLMENT_EXCEPTION_STATUS_OPEN = 2;
  FULFILLMENT_EXCEPTION_STATUS_WAITING = 3;
  FULFILLMENT_EXCEPTION_STATUS_RESOLVED = 4;
  FULFILLMENT_EXCEPTION_STATUS_CLOSED = 5;
}

// The line of a fulfillment.
message FulfillmentLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  FulfillmentLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a fulfillment line.
message FulfillmentLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a fulfillment.
message FulfillmentCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a fulfillment.
message FulfillmentBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a fulfillment.
message FulfillmentAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A fulfillment of the fulfillment domain.
message Fulfillment {
  string fulfillment_id = 1;
  string number = 2;
  FulfillmentStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated FulfillmentLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    FulfillmentCardSettlement card = 8;
    FulfillmentBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated FulfillmentAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a packing slip.
message PackingSlipLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  PackingSlipLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a packing slip line.
message PackingSlipLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a packing slip.
message PackingSlipCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a packing slip.
message PackingSlipBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a packing slip.
message PackingSlipAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A packing slip of the fulfillment domain.
message PackingSlip {
  string packing_slip_id = 1;
  string number = 2;
  PackingSlipStatus status = 3;
  FulfillmentRef counterparty = 4;
  repeated PackingSlipLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    PackingSlipCardSettlement card = 8;
    PackingSlipBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated PackingSlipAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of a fulfillment exception.
message FulfillmentExceptionComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a fulfillment exception.
message FulfillmentExceptionSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a fulfillment exception.
message FulfillmentExceptionChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a fulfillment exception.
message FulfillmentExceptionStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A fulfillment exception of the fulfillment domain.
message FulfillmentException {
  string fulfillment_exception_id = 1;
  string subject = 2;
  FulfillmentExceptionStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated FulfillmentExceptionComment comments = 7;
  FulfillmentExceptionSla sla = 8;
  oneof origin {
    PackingSlipRef customer = 9;
    string external_reference = 10;
    FulfillmentExceptionChannelOrigin channel = 11;
  }
  repeated FulfillmentExceptionStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
