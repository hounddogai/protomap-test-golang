syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "FulfillmentQueryServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Answers read-only questions about fulfillments, for screens and reports.
service FulfillmentQueryService {
  // Returns a fulfillment.
  rpc LookupFulfillment(LookupFulfillmentRequest) returns (LookupFulfillmentResponse);

  // Lists fulfillments a page at a time.
  rpc BrowseFulfillments(BrowseFulfillmentsRequest) returns (BrowseFulfillmentsResponse);

  // Lists fulfillments a page at a time.
  rpc FindFulfillments(FindFulfillmentsRequest) returns (FindFulfillmentsResponse);

  // Counts fulfillments by status.
  rpc CountFulfillments(CountFulfillmentsRequest) returns (CountFulfillmentsResponse);

  // Returns several fulfillments at once.
  rpc ResolveFulfillments(ResolveFulfillmentsRequest) returns (ResolveFulfillmentsResponse);

  // Streams every matching fulfillment.
  rpc ExportFulfillments(ExportFulfillmentsRequest) returns (stream ExportFulfillmentsResponse);

  // Summarizes a fulfillment.
  rpc SummarizeFulfillments(SummarizeFulfillmentsRequest) returns (SummarizeFulfillmentsResponse);

  // Returns a fulfillment.
  rpc PeekFulfillment(PeekFulfillmentRequest) returns (PeekFulfillmentResponse);
}

// The request of `LookupFulfillment`.
message LookupFulfillmentRequest {
  acme.common.v1.RequestContext context = 1;
  string fulfillment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFulfillment`.
message LookupFulfillmentResponse {
  Fulfillment fulfillment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFulfillments`.
message BrowseFulfillmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FulfillmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFulfillmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFulfillments`.
message BrowseFulfillmentsResponse {
  repeated Fulfillment fulfillments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindFulfillments`.
message FindFulfillmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FulfillmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindFulfillmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindFulfillments`.
message FindFulfillmentsResponse {
  repeated Fulfillment fulfillments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFulfillments`.
message CountFulfillmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FulfillmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFulfillmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFulfillments`.
message CountFulfillmentsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveFulfillments`.
message ResolveFulfillmentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string fulfillment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveFulfillments`.
message ResolveFulfillmentsResponse {
  repeated Fulfillment fulfillments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFulfillments`.
message ExportFulfillmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FulfillmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFulfillmentsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFulfillments`.
message ExportFulfillmentsResponse {
  Fulfillment fulfillment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFulfillments`.
message SummarizeFulfillmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fulfillment_id = 2;
  SummarizeFulfillmentsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFulfillments`.
message SummarizeFulfillmentsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekFulfillment`.
message PeekFulfillmentRequest {
  acme.common.v1.RequestContext context = 1;
  string fulfillment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFulfillment`.
message PeekFulfillmentResponse {
  Fulfillment fulfillment = 1;
  acme.common.v1.OperationResult result = 2;
}
