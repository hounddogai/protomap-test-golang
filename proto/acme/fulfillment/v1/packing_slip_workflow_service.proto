syntax = "proto3";

package acme.fulfillment.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fulfillment/v1/fulfillment.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fulfillment.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_outer_classname = "PackingSlipWorkflowServiceProto";
option java_package = "com.acme.fulfillment.v1";

// Runs the long-lived workflow that takes a packing slip from start to finish.
service PackingSlipWorkflowService {
  // Starts a packing slip.
  rpc StartPackingSlipWorkflow(StartPackingSlipWorkflowRequest) returns (StartPackingSlipWorkflowResponse);

  // Advances a packing slip.
  rpc AdvancePackingSlipWorkflow(AdvancePackingSlipWorkflowRequest) returns (AdvancePackingSlipWorkflowResponse);

  // Cancels a packing slip.
  rpc CancelPackingSlipWorkflow(CancelPackingSlipWorkflowRequest) returns (CancelPackingSlipWorkflowResponse);

  // Retrys a packing slip.
  rpc RetryPackingSlipWorkflow(RetryPackingSlipWorkflowRequest) returns (RetryPackingSlipWorkflowResponse);

  // Pauses a packing slip.
  rpc PausePackingSlipWorkflow(PausePackingSlipWorkflowRequest) returns (PausePackingSlipWorkflowResponse);

  // Resumes a packing slip.
  rpc ResumePackingSlipWorkflow(ResumePackingSlipWorkflowRequest) returns (ResumePackingSlipWorkflowResponse);

  // Returns a packing slip.
  rpc InspectPackingSlipWorkflow(InspectPackingSlipWorkflowRequest) returns (InspectPackingSlipWorkflowResponse);

  // Lists packing slips a page at a time.
  rpc ListPackingSlipWorkflows(ListPackingSlipWorkflowsRequest) returns (ListPackingSlipWorkflowsResponse);

  // Signals a packing slip.
  rpc SignalPackingSlipWorkflow(SignalPackingSlipWorkflowRequest) returns (SignalPackingSlipWorkflowResponse);
}

// The request of `StartPackingSlipWorkflow`.
message StartPackingSlipWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string packing_slip_id = 2;
  PackingSlip packing_slip = 3;
  StartPackingSlipWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPackingSlipWorkflow`.
message StartPackingSlipWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PackingSlip packing_slip = 1;
  StartPackingSlipWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

