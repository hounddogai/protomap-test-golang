syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverHomeQueryServiceProto";
option java_package = "com.acme.driverapp.v1";

// Answers read-only questions about driver homes, for screens and reports.
service DriverHomeQueryService {
  // Returns a driver home.
  rpc LookupDriverHome(LookupDriverHomeRequest) returns (LookupDriverHomeResponse);

  // Lists driver homes a page at a time.
  rpc BrowseDriverHomes(BrowseDriverHomesRequest) returns (BrowseDriverHomesResponse);

  // Lists driver homes a page at a time.
  rpc FindDriverHomes(FindDriverHomesRequest) returns (FindDriverHomesResponse);

  // Counts driver homes by status.
  rpc CountDriverHomes(CountDriverHomesRequest) returns (CountDriverHomesResponse);

  // Returns several driver homes at once.
  rpc ResolveDriverHomes(ResolveDriverHomesRequest) returns (ResolveDriverHomesResponse);

  // Streams every matching driver home.
  rpc ExportDriverHomes(ExportDriverHomesRequest) returns (stream ExportDriverHomesResponse);

  // Summarizes a driver home.
  rpc SummarizeDriverHomes(SummarizeDriverHomesRequest) returns (SummarizeDriverHomesResponse);

  // Returns a driver home.
  rpc PeekDriverHome(PeekDriverHomeRequest) returns (PeekDriverHomeResponse);
}

// The request of `LookupDriverHome`.
message LookupDriverHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDriverHome`.
message LookupDriverHomeResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDriverHomes`.
message BrowseDriverHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDriverHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDriverHomes`.
message BrowseDriverHomesResponse {
  repeated DriverHome driver_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDriverHomes`.
message FindDriverHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDriverHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDriverHomes`.
message FindDriverHomesResponse {
  repeated DriverHome driver_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDriverHomes`.
message CountDriverHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDriverHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDriverHomes`.
message CountDriverHomesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveDriverHomes`.
message ResolveDriverHomesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string driver_home_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveDriverHomes`.
message ResolveDriverHomesResponse {
  repeated DriverHome driver_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDriverHomes`.
message ExportDriverHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDriverHomesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDriverHomes`.
message ExportDriverHomesResponse {
  DriverHome driver_home = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDriverHomes`.
message SummarizeDriverHomesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  SummarizeDriverHomesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDriverHomes`.
message SummarizeDriverHomesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekDriverHome`.
message PeekDriverHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDriverHome`.
message PeekDriverHomeResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}
