syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverappProto";
option java_package = "com.acme.driverapp.v1";

// Where a driver home is in its lifecycle.
enum DriverHomeStatus {
  DRIVER_HOME_STATUS_UNSPECIFIED = 0;
  DRIVER_HOME_STATUS_NEW = 1;
  DRIVER_HOME_STATUS_OPEN = 2;
  DRIVER_HOME_STATUS_WAITING = 3;
  DRIVER_HOME_STATUS_RESOLVED = 4;
  DRIVER_HOME_STATUS_CLOSED = 5;
}

// Where a driver inbox is in its lifecycle.
enum DriverInboxStatus {
  DRIVER_INBOX_STATUS_UNSPECIFIED = 0;
  DRIVER_INBOX_STATUS_DRAFT = 1;
  DRIVER_INBOX_STATUS_ISSUED = 2;
  DRIVER_INBOX_STATUS_APPROVED = 3;
  DRIVER_INBOX_STATUS_PAID = 4;
  DRIVER_INBOX_STATUS_VOID = 5;
}

// The comment of a driver home.
message DriverHomeComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a driver home.
message DriverHomeSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a driver home.
message DriverHomeChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a driver home.
message DriverHomeStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A driver home of the driverapp domain.
message DriverHome {
  string driver_home_id = 1;
  string subject = 2;
  DriverHomeStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated DriverHomeComment comments = 7;
  DriverHomeSla sla = 8;
  oneof origin {
    acme.customers.v1.CustomerRef customer = 9;
    string external_reference = 10;
    DriverHomeChannelOrigin channel = 11;
  }
  repeated DriverHomeStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of a driver inbox.
message DriverInboxLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  DriverInboxLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a driver inbox line.
message DriverInboxLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a driver inbox.
message DriverInboxCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a driver inbox.
message DriverInboxBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a driver inbox.
message DriverInboxAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A driver inbox of the driverapp domain.
message DriverInbox {
  string driver_inbox_id = 1;
  string number = 2;
  DriverInboxStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated DriverInboxLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    DriverInboxCardSettlement card = 8;
    DriverInboxBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated DriverInboxAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
