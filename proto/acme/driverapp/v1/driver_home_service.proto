syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverHomeServiceProto";
option java_package = "com.acme.driverapp.v1";

// Manages driver homes: creates, reads, changes, and lists them.
service DriverHomeService {
  // Creates a driver home.
  rpc CreateDriverHome(CreateDriverHomeRequest) returns (CreateDriverHomeResponse);

  // Returns a driver home.
  rpc GetDriverHome(GetDriverHomeRequest) returns (GetDriverHomeResponse);

  // Changes a driver home.
  rpc UpdateDriverHome(UpdateDriverHomeRequest) returns (UpdateDriverHomeResponse);

  // Lists driver homes a page at a time.
  rpc ListDriverHomes(ListDriverHomesRequest) returns (ListDriverHomesResponse);

  // Lists driver homes a page at a time.
  rpc SearchDriverHomes(SearchDriverHomesRequest) returns (SearchDriverHomesResponse);

  // Takes a stream of driver homes and answers once at the end.
  rpc BatchCreateDriverHomes(stream BatchCreateDriverHomesRequest) returns (BatchCreateDriverHomesResponse);

  // Creates a driver home.
  rpc CloneDriverHome(CloneDriverHomeRequest) returns (CloneDriverHomeResponse);
}

// The request of `CreateDriverHome`.
message CreateDriverHomeRequest {
  acme.common.v1.RequestContext context = 1;
  DriverHome driver_home = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateDriverHome`.
message CreateDriverHomeResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetDriverHome`.
message GetDriverHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDriverHome`.
message GetDriverHomeResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateDriverHome`.
message UpdateDriverHomeRequest {
  acme.common.v1.RequestContext context = 1;
  DriverHome driver_home = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateDriverHome`.
message UpdateDriverHomeResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListDriverHomes`.
message ListDriverHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDriverHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDriverHomes`.
message ListDriverHomesResponse {
  repeated DriverHome driver_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchDriverHomes`.
message SearchDriverHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchDriverHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchDriverHomes`.
message SearchDriverHomesResponse {
  repeated DriverHome driver_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchCreateDriverHomes`.
message BatchCreateDriverHomesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateDriverHomesRequest.StreamHeader header = 2;
    DriverHome record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateDriverHomes`.
message BatchCreateDriverHomesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string driver_home_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateDriverHomesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneDriverHome`.
message CloneDriverHomeRequest {
  acme.common.v1.RequestContext context = 1;
  DriverHome driver_home = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneDriverHome`.
message CloneDriverHomeResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}
