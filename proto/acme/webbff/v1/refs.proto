syntax = "proto3";

package acme.webbff.v1;

option csharp_namespace = "Acme.Webbff.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webbff/v1;webbffv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.webbff.v1";

// A reference to a page composition of the webbff domain.
message PageCompositionRef {
  string page_composition_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a widget layout of the webbff domain.
message WidgetLayoutRef {
  string widget_layout_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a client session of the webbff domain.
message ClientSessionRef {
  string client_session_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
