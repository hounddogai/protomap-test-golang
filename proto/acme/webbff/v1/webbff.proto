syntax = "proto3";

package acme.webbff.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/webbff/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webbff.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webbff/v1;webbffv1";
option java_multiple_files = true;
option java_outer_classname = "WebbffProto";
option java_package = "com.acme.webbff.v1";

// Where a page composition is in its lifecycle.
enum PageCompositionStatus {
  PAGE_COMPOSITION_STATUS_UNSPECIFIED = 0;
  PAGE_COMPOSITION_STATUS_DRAFT = 1;
  PAGE_COMPOSITION_STATUS_ISSUED = 2;
  PAGE_COMPOSITION_STATUS_APPROVED = 3;
  PAGE_COMPOSITION_STATUS_PAID = 4;
  PAGE_COMPOSITION_STATUS_VOID = 5;
}

// Where a widget layout is in its lifecycle.
enum WidgetLayoutStatus {
  WIDGET_LAYOUT_STATUS_UNSPECIFIED = 0;
  WIDGET_LAYOUT_STATUS_ACTIVE = 1;
  WIDGET_LAYOUT_STATUS_INACTIVE = 2;
}

// Where a client session is in its lifecycle.
enum ClientSessionStatus {
  CLIENT_SESSION_STATUS_UNSPECIFIED = 0;
  CLIENT_SESSION_STATUS_NEW = 1;
  CLIENT_SESSION_STATUS_OPEN = 2;
  CLIENT_SESSION_STATUS_WAITING = 3;
  CLIENT_SESSION_STATUS_RESOLVED = 4;
  CLIENT_SESSION_STATUS_CLOSED = 5;
}

// The line of a page composition.
message PageCompositionLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  PageCompositionLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a page composition line.
message PageCompositionLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a page composition.
message PageCompositionCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a page composition.
message PageCompositionBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a page composition.
message PageCompositionAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A page composition of the webbff domain.
message PageComposition {
  string page_composition_id = 1;
  string number = 2;
  PageCompositionStatus status = 3;
  WidgetLayoutRef counterparty = 4;
  repeated PageCompositionLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    PageCompositionCardSettlement card = 8;
    PageCompositionBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated PageCompositionAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// A widget layout of the webbff domain.
message WidgetLayout {
  string widget_layout_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated WidgetLayout children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  WidgetLayoutStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The comment of a client session.
message ClientSessionComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a client session.
message ClientSessionSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a client session.
message ClientSessionChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a client session.
message ClientSessionStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A client session of the webbff domain.
message ClientSession {
  string client_session_id = 1;
  string subject = 2;
  ClientSessionStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ClientSessionComment comments = 7;
  ClientSessionSla sla = 8;
  oneof origin {
    WidgetLayoutRef customer = 9;
    string external_reference = 10;
    ClientSessionChannelOrigin channel = 11;
  }
  repeated ClientSessionStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
