syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RouteQueryServiceProto";
option java_package = "com.acme.routing.v1";

// Answers read-only questions about routes, for screens and reports.
service RouteQueryService {
  // Returns a route.
  rpc LookupRoute(LookupRouteRequest) returns (LookupRouteResponse);

  // Lists routes a page at a time.
  rpc BrowseRoutes(BrowseRoutesRequest) returns (BrowseRoutesResponse);

  // Lists routes a page at a time.
  rpc FindRoutes(FindRoutesRequest) returns (FindRoutesResponse);

  // Counts routes by status.
  rpc CountRoutes(CountRoutesRequest) returns (CountRoutesResponse);

  // Streams every matching route.
  rpc ExportRoutes(ExportRoutesRequest) returns (stream ExportRoutesResponse);

  // Summarizes a route.
  rpc SummarizeRoutes(SummarizeRoutesRequest) returns (SummarizeRoutesResponse);

  // Lists routes a page at a time.
  rpc SuggestRoutes(SuggestRoutesRequest) returns (SuggestRoutesResponse);

  // Returns a route.
  rpc PeekRoute(PeekRouteRequest) returns (PeekRouteResponse);
}

// The request of `LookupRoute`.
message LookupRouteRequest {
  acme.common.v1.RequestContext context = 1;
  string route_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRoute`.
message LookupRouteResponse {
  Route route = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRoutes`.
message BrowseRoutesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRoutesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRoutes`.
message BrowseRoutesResponse {
  repeated Route routes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindRoutes`.
message FindRoutesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindRoutesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindRoutes`.
message FindRoutesResponse {
  repeated Route routes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRoutes`.
message CountRoutesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRoutesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRoutes`.
message CountRoutesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportRoutes`.
message ExportRoutesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportRoutesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportRoutes`.
message ExportRoutesResponse {
  Route route = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeRoutes`.
message SummarizeRoutesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_id = 2;
  SummarizeRoutesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeRoutes`.
message SummarizeRoutesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestRoutes`.
message SuggestRoutesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestRoutesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestRoutes`.
message SuggestRoutesResponse {
  repeated Route routes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekRoute`.
message PeekRouteRequest {
  acme.common.v1.RequestContext context = 1;
  string route_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekRoute`.
message PeekRouteResponse {
  Route route = 1;
  acme.common.v1.OperationResult result = 2;
}
