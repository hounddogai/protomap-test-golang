syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/drivers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RoutingProto";
option java_package = "com.acme.routing.v1";

// Where a route is in its lifecycle.
enum RouteStatus {
  ROUTE_STATUS_UNSPECIFIED = 0;
  ROUTE_STATUS_DRAFT = 1;
  ROUTE_STATUS_ISSUED = 2;
  ROUTE_STATUS_APPROVED = 3;
  ROUTE_STATUS_PAID = 4;
  ROUTE_STATUS_VOID = 5;
}

// Where a stop is in its lifecycle.
enum StopStatus {
  STOP_STATUS_UNSPECIFIED = 0;
  STOP_STATUS_TENTATIVE = 1;
  STOP_STATUS_CONFIRMED = 2;
  STOP_STATUS_CANCELLED = 3;
  STOP_STATUS_COMPLETED = 4;
}

// Where a route plan is in its lifecycle.
enum RoutePlanStatus {
  ROUTE_PLAN_STATUS_UNSPECIFIED = 0;
  ROUTE_PLAN_STATUS_DRAFT = 1;
  ROUTE_PLAN_STATUS_ISSUED = 2;
  ROUTE_PLAN_STATUS_APPROVED = 3;
  ROUTE_PLAN_STATUS_PAID = 4;
  ROUTE_PLAN_STATUS_VOID = 5;
}

// The line of a route.
message RouteLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  RouteLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a route line.
message RouteLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a route.
message RouteCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a route.
message RouteBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a route.
message RouteAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A route of the routing domain.
message Route {
  string route_id = 1;
  string number = 2;
  RouteStatus status = 3;
  acme.drivers.v1.DriverRef counterparty = 4;
  repeated RouteLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    RouteCardSettlement card = 8;
    RouteBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated RouteAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The participant of a stop.
message StopParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a stop.
message StopDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a stop.
message StopWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A stop of the routing domain.
message Stop {
  string stop_id = 1;
  string title = 2;
  StopStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated StopParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    StopDailyRule daily = 7;
    StopWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a route plan.
message RoutePlanLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  RoutePlanLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a route plan line.
message RoutePlanLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a route plan.
message RoutePlanCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a route plan.
message RoutePlanBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a route plan.
message RoutePlanAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A route plan of the routing domain.
message RoutePlan {
  string route_plan_id = 1;
  string number = 2;
  RoutePlanStatus status = 3;
  acme.drivers.v1.DriverRef counterparty = 4;
  repeated RoutePlanLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    RoutePlanCardSettlement card = 8;
    RoutePlanBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated RoutePlanAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
