syntax = "proto3";

package acme.patientapp.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patientapp/v1/patientapp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "PatientHomeQueryServiceProto";
option java_package = "com.acme.patientapp.v1";

// Answers read-only questions about patient homes, for screens and reports.
service PatientHomeQueryService {
  // Returns a patient home.
  rpc LookupPatientHome(LookupPatientHomeRequest) returns (LookupPatientHomeResponse);

  // Lists patient homes a page at a time.
  rpc BrowsePatientHomes(BrowsePatientHomesRequest) returns (BrowsePatientHomesResponse);

  // Lists patient homes a page at a time.
  rpc FindPatientHomes(FindPatientHomesRequest) returns (FindPatientHomesResponse);

  // Counts patient homes by status.
  rpc CountPatientHomes(CountPatientHomesRequest) returns (CountPatientHomesResponse);

  // Streams every matching patient home.
  rpc ExportPatientHomes(ExportPatientHomesRequest) returns (stream ExportPatientHomesResponse);

  // Lists patient homes a page at a time.
  rpc SuggestPatientHomes(SuggestPatientHomesRequest) returns (SuggestPatientHomesResponse);

  // Returns a patient home.
  rpc PeekPatientHome(PeekPatientHomeRequest) returns (PeekPatientHomeResponse);
}

// The request of `LookupPatientHome`.
message LookupPatientHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPatientHome`.
message LookupPatientHomeResponse {
  PatientHome patient_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePatientHomes`.
message BrowsePatientHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePatientHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePatientHomes`.
message BrowsePatientHomesResponse {
  repeated PatientHome patient_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPatientHomes`.
message FindPatientHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPatientHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPatientHomes`.
message FindPatientHomesResponse {
  repeated PatientHome patient_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPatientHomes`.
message CountPatientHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPatientHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPatientHomes`.
message CountPatientHomesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPatientHomes`.
message ExportPatientHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPatientHomesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPatientHomes`.
message ExportPatientHomesResponse {
  PatientHome patient_home = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPatientHomes`.
message SuggestPatientHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPatientHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPatientHomes`.
message SuggestPatientHomesResponse {
  repeated PatientHome patient_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPatientHome`.
message PeekPatientHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPatientHome`.
message PeekPatientHomeResponse {
  PatientHome patient_home = 1;
  acme.common.v1.OperationResult result = 2;
}
