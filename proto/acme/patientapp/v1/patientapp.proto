syntax = "proto3";

package acme.patientapp.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "PatientappProto";
option java_package = "com.acme.patientapp.v1";

// Where a patient home is in its lifecycle.
enum PatientHomeStatus {
  PATIENT_HOME_STATUS_UNSPECIFIED = 0;
  PATIENT_HOME_STATUS_NEW = 1;
  PATIENT_HOME_STATUS_OPEN = 2;
  PATIENT_HOME_STATUS_WAITING = 3;
  PATIENT_HOME_STATUS_RESOLVED = 4;
  PATIENT_HOME_STATUS_CLOSED = 5;
}

// Where a care inbox is in its lifecycle.
enum CareInboxStatus {
  CARE_INBOX_STATUS_UNSPECIFIED = 0;
  CARE_INBOX_STATUS_DRAFT = 1;
  CARE_INBOX_STATUS_ISSUED = 2;
  CARE_INBOX_STATUS_APPROVED = 3;
  CARE_INBOX_STATUS_PAID = 4;
  CARE_INBOX_STATUS_VOID = 5;
}

// The comment of a patient home.
message PatientHomeComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a patient home.
message PatientHomeSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a patient home.
message PatientHomeChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a patient home.
message PatientHomeStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A patient home of the patientapp domain.
message PatientHome {
  string patient_home_id = 1;
  string subject = 2;
  PatientHomeStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated PatientHomeComment comments = 7;
  PatientHomeSla sla = 8;
  oneof origin {
    acme.patients.v1.PatientRef customer = 9;
    string external_reference = 10;
    PatientHomeChannelOrigin channel = 11;
  }
  repeated PatientHomeStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of a care inbox.
message CareInboxLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  CareInboxLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a care inbox line.
message CareInboxLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a care inbox.
message CareInboxCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a care inbox.
message CareInboxBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a care inbox.
message CareInboxAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A care inbox of the patientapp domain.
message CareInbox {
  string care_inbox_id = 1;
  string number = 2;
  CareInboxStatus status = 3;
  acme.patients.v1.PatientRef counterparty = 4;
  repeated CareInboxLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    CareInboxCardSettlement card = 8;
    CareInboxBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated CareInboxAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
