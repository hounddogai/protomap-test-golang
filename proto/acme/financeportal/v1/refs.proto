syntax = "proto3";

package acme.financeportal.v1;

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.financeportal.v1";

// A reference to a finance workspace of the financeportal domain.
message FinanceWorkspaceRef {
  string finance_workspace_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to an approval inbox of the financeportal domain.
message ApprovalInboxRef {
  string approval_inbox_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a close checklist of the financeportal domain.
message CloseChecklistRef {
  string close_checklist_id = 1;
  string display_name = 2;
  string number = 3;
}
