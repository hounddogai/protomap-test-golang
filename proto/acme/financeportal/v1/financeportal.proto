syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/financeportal/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/suppliers/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "FinanceportalProto";
option java_package = "com.acme.financeportal.v1";

// Where a finance workspace is in its lifecycle.
enum FinanceWorkspaceStatus {
  FINANCE_WORKSPACE_STATUS_UNSPECIFIED = 0;
  FINANCE_WORKSPACE_STATUS_NEW = 1;
  FINANCE_WORKSPACE_STATUS_OPEN = 2;
  FINANCE_WORKSPACE_STATUS_WAITING = 3;
  FINANCE_WORKSPACE_STATUS_RESOLVED = 4;
  FINANCE_WORKSPACE_STATUS_CLOSED = 5;
}

// Where an approval inbox is in its lifecycle.
enum ApprovalInboxStatus {
  APPROVAL_INBOX_STATUS_UNSPECIFIED = 0;
  APPROVAL_INBOX_STATUS_DRAFT = 1;
  APPROVAL_INBOX_STATUS_ISSUED = 2;
  APPROVAL_INBOX_STATUS_APPROVED = 3;
  APPROVAL_INBOX_STATUS_PAID = 4;
  APPROVAL_INBOX_STATUS_VOID = 5;
}

// Where a close checklist is in its lifecycle.
enum CloseChecklistStatus {
  CLOSE_CHECKLIST_STATUS_UNSPECIFIED = 0;
  CLOSE_CHECKLIST_STATUS_DRAFT = 1;
  CLOSE_CHECKLIST_STATUS_ISSUED = 2;
  CLOSE_CHECKLIST_STATUS_APPROVED = 3;
  CLOSE_CHECKLIST_STATUS_PAID = 4;
  CLOSE_CHECKLIST_STATUS_VOID = 5;
}

// The comment of a finance workspace.
message FinanceWorkspaceComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a finance workspace.
message FinanceWorkspaceSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a finance workspace.
message FinanceWorkspaceChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a finance workspace.
message FinanceWorkspaceStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A finance workspace of the financeportal domain.
message FinanceWorkspace {
  string finance_workspace_id = 1;
  string subject = 2;
  FinanceWorkspaceStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated FinanceWorkspaceComment comments = 7;
  FinanceWorkspaceSla sla = 8;
  oneof origin {
    acme.suppliers.v1.SupplierRef customer = 9;
    string external_reference = 10;
    FinanceWorkspaceChannelOrigin channel = 11;
  }
  repeated FinanceWorkspaceStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of an approval inbox.
message ApprovalInboxLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  ApprovalInboxLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an approval inbox line.
message ApprovalInboxLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an approval inbox.
message ApprovalInboxCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an approval inbox.
message ApprovalInboxBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an approval inbox.
message ApprovalInboxAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An approval inbox of the financeportal domain.
message ApprovalInbox {
  string approval_inbox_id = 1;
  string number = 2;
  ApprovalInboxStatus status = 3;
  CloseChecklistRef counterparty = 4;
  repeated ApprovalInboxLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    ApprovalInboxCardSettlement card = 8;
    ApprovalInboxBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated ApprovalInboxAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a close checklist.
message CloseChecklistLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  CloseChecklistLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a close checklist line.
message CloseChecklistLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a close checklist.
message CloseChecklistCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a close checklist.
message CloseChecklistBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a close checklist.
message CloseChecklistAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A close checklist of the financeportal domain.
message CloseChecklist {
  string close_checklist_id = 1;
  string number = 2;
  CloseChecklistStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated CloseChecklistLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    CloseChecklistCardSettlement card = 8;
    CloseChecklistBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated CloseChecklistAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
