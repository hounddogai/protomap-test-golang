syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "FinanceWorkspaceQueryServiceProto";
option java_package = "com.acme.financeportal.v1";

// Answers read-only questions about finance workspaces, for screens and reports.
service FinanceWorkspaceQueryService {
  // Returns a finance workspace.
  rpc LookupFinanceWorkspace(LookupFinanceWorkspaceRequest) returns (LookupFinanceWorkspaceResponse);

  // Lists finance workspaces a page at a time.
  rpc BrowseFinanceWorkspaces(BrowseFinanceWorkspacesRequest) returns (BrowseFinanceWorkspacesResponse);

  // Counts finance workspaces by status.
  rpc CountFinanceWorkspaces(CountFinanceWorkspacesRequest) returns (CountFinanceWorkspacesResponse);

  // Returns several finance workspaces at once.
  rpc ResolveFinanceWorkspaces(ResolveFinanceWorkspacesRequest) returns (ResolveFinanceWorkspacesResponse);

  // Streams every matching finance workspace.
  rpc ExportFinanceWorkspaces(ExportFinanceWorkspacesRequest) returns (stream ExportFinanceWorkspacesResponse);

  // Summarizes a finance workspace.
  rpc SummarizeFinanceWorkspaces(SummarizeFinanceWorkspacesRequest) returns (SummarizeFinanceWorkspacesResponse);

  // Returns a finance workspace.
  rpc PeekFinanceWorkspace(PeekFinanceWorkspaceRequest) returns (PeekFinanceWorkspaceResponse);
}

// The request of `LookupFinanceWorkspace`.
message LookupFinanceWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFinanceWorkspace`.
message LookupFinanceWorkspaceResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFinanceWorkspaces`.
message BrowseFinanceWorkspacesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FinanceWorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFinanceWorkspacesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFinanceWorkspaces`.
message BrowseFinanceWorkspacesResponse {
  repeated FinanceWorkspace finance_workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFinanceWorkspaces`.
message CountFinanceWorkspacesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FinanceWorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFinanceWorkspacesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFinanceWorkspaces`.
message CountFinanceWorkspacesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveFinanceWorkspaces`.
message ResolveFinanceWorkspacesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string finance_workspace_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveFinanceWorkspaces`.
message ResolveFinanceWorkspacesResponse {
  repeated FinanceWorkspace finance_workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFinanceWorkspaces`.
message ExportFinanceWorkspacesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FinanceWorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFinanceWorkspacesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFinanceWorkspaces`.
message ExportFinanceWorkspacesResponse {
  FinanceWorkspace finance_workspace = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFinanceWorkspaces`.
message SummarizeFinanceWorkspacesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  SummarizeFinanceWorkspacesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFinanceWorkspaces`.
message SummarizeFinanceWorkspacesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekFinanceWorkspace`.
message PeekFinanceWorkspaceRequest {
  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFinanceWorkspace`.
message PeekFinanceWorkspaceResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}
