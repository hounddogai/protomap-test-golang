syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "DevicesProto";
option java_package = "com.acme.devices.v1";

// Where a managed device is in its lifecycle.
enum ManagedDeviceStatus {
  MANAGED_DEVICE_STATUS_UNSPECIFIED = 0;
  MANAGED_DEVICE_STATUS_PLANNED = 1;
  MANAGED_DEVICE_STATUS_AVAILABLE = 2;
  MANAGED_DEVICE_STATUS_RESERVED = 3;
  MANAGED_DEVICE_STATUS_RETIRED = 4;
}

// Where a device policy is in its lifecycle.
enum DevicePolicyStatus {
  DEVICE_POLICY_STATUS_UNSPECIFIED = 0;
  DEVICE_POLICY_STATUS_DRAFT = 1;
  DEVICE_POLICY_STATUS_ENABLED = 2;
  DEVICE_POLICY_STATUS_DISABLED = 3;
  DEVICE_POLICY_STATUS_RETIRED = 4;
}

// Where a compliance scan is in its lifecycle.
enum ComplianceScanStatus {
  COMPLIANCE_SCAN_STATUS_UNSPECIFIED = 0;
  COMPLIANCE_SCAN_STATUS_RECEIVED = 1;
  COMPLIANCE_SCAN_STATUS_PROCESSED = 2;
  COMPLIANCE_SCAN_STATUS_DISCARDED = 3;
}

// The dimensions of a managed device.
message ManagedDeviceDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a managed device.
message ManagedDeviceComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A managed device of the devices domain.
message ManagedDevice {
  string managed_device_id = 1;
  string code = 2;
  string name = 3;
  ManagedDeviceStatus status = 4;
  repeated string category_path = 5;
  ManagedDeviceDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, ManagedDeviceComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The condition of a device policy.
message DevicePolicyCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a device policy.
message DevicePolicyDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a device policy.
message DevicePolicyRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a device policy.
message DevicePolicyBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A device policy of the devices domain.
message DevicePolicy {
  string device_policy_id = 1;
  string name = 2;
  string description = 3;
  DevicePolicyStatus status = 4;
  int32 priority = 5;
  repeated DevicePolicyCondition conditions = 6;
  oneof action {
    DevicePolicyDiscountAction discount = 7;
    DevicePolicyRouteAction route = 8;
    DevicePolicyBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The measurement of a compliance scan.
message ComplianceScanMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A compliance scan of the devices domain.
message ComplianceScan {
  string compliance_scan_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  acme.recruiting.v1.CandidateRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated ComplianceScanMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
