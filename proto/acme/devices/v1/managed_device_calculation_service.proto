syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ManagedDeviceCalculationServiceProto";
option java_package = "com.acme.devices.v1";

// Computes the figures of a managed device, such as totals, taxes, and estimates.
service ManagedDeviceCalculationService {
  // Calculates a managed device.
  rpc CalculateManagedDevice(CalculateManagedDeviceRequest) returns (CalculateManagedDeviceResponse);

  // Estimates a managed device.
  rpc EstimateManagedDevice(EstimateManagedDeviceRequest) returns (EstimateManagedDeviceResponse);

  // Quotes a managed device.
  rpc QuoteManagedDevice(QuoteManagedDeviceRequest) returns (QuoteManagedDeviceResponse);

  // Recalculates a managed device.
  rpc RecalculateManagedDevices(RecalculateManagedDevicesRequest) returns (RecalculateManagedDevicesResponse);

  // Simulates a managed device.
  rpc SimulateManagedDevice(SimulateManagedDeviceRequest) returns (SimulateManagedDeviceResponse);

  // Explains a managed device.
  rpc ExplainManagedDeviceCalculation(ExplainManagedDeviceCalculationRequest) returns (ExplainManagedDeviceCalculationResponse);
}

// The request of `CalculateManagedDevice`.
message CalculateManagedDeviceRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string managed_device_id = 2;
  ManagedDevice managed_device = 3;
  CalculateManagedDeviceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateManagedDevice`.
message CalculateManagedDeviceResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateManagedDeviceResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ManagedDevice managed_device = 1;
  CalculateManagedDeviceResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

