  acme.common.v1.RequestContext context = 1;
  string managed_device_id = 2;
  ManagedDevice managed_device = 3;
  ExplainManagedDeviceCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainManagedDeviceCalculation`.
message ExplainManagedDeviceCalculationResponse {
  // What the operation decided.
  message Outcome {
