syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ArticleQueryServiceProto";
option java_package = "com.acme.content.v1";

// Answers read-only questions about articles, for screens and reports.
service ArticleQueryService {
  // Returns an article.
  rpc LookupArticle(LookupArticleRequest) returns (LookupArticleResponse);

  // Lists articles a page at a time.
  rpc BrowseArticles(BrowseArticlesRequest) returns (BrowseArticlesResponse);

  // Lists articles a page at a time.
  rpc FindArticles(FindArticlesRequest) returns (FindArticlesResponse);

  // Counts articles by status.
  rpc CountArticles(CountArticlesRequest) returns (CountArticlesResponse);

  // Returns several articles at once.
  rpc ResolveArticles(ResolveArticlesRequest) returns (ResolveArticlesResponse);

  // Streams every matching article.
  rpc ExportArticles(ExportArticlesRequest) returns (stream ExportArticlesResponse);

  // Summarizes an article.
  rpc SummarizeArticles(SummarizeArticlesRequest) returns (SummarizeArticlesResponse);

  // Lists articles a page at a time.
  rpc SuggestArticles(SuggestArticlesRequest) returns (SuggestArticlesResponse);

  // Returns an article.
  rpc PeekArticle(PeekArticleRequest) returns (PeekArticleResponse);
}

// The request of `LookupArticle`.
message LookupArticleRequest {
  acme.common.v1.RequestContext context = 1;
  string article_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupArticle`.
message LookupArticleResponse {
  Article article = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseArticles`.
message BrowseArticlesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ArticleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseArticlesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseArticles`.
message BrowseArticlesResponse {
  repeated Article articles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindArticles`.
message FindArticlesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ArticleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindArticlesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindArticles`.
message FindArticlesResponse {
  repeated Article articles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountArticles`.
message CountArticlesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ArticleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountArticlesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountArticles`.
message CountArticlesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveArticles`.
message ResolveArticlesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string article_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveArticles`.
message ResolveArticlesResponse {
  repeated Article articles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportArticles`.
message ExportArticlesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ArticleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportArticlesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportArticles`.
message ExportArticlesResponse {
  Article article = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeArticles`.
message SummarizeArticlesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string article_id = 2;
  SummarizeArticlesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeArticles`.
message SummarizeArticlesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestArticles`.
message SuggestArticlesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ArticleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestArticlesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestArticles`.
message SuggestArticlesResponse {
  repeated Article articles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekArticle`.
message PeekArticleRequest {
  acme.common.v1.RequestContext context = 1;
  string article_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekArticle`.
message PeekArticleResponse {
  Article article = 1;
  acme.common.v1.OperationResult result = 2;
}
