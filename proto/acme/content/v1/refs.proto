syntax = "proto3";

package acme.content.v1;

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.content.v1";

// A reference to an article of the content domain.
message ArticleRef {
  string article_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a content block of the content domain.
message ContentBlockRef {
  string content_block_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a content revision of the content domain.
message ContentRevisionRef {
  string content_revision_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a taxonomy of the content domain.
message TaxonomyRef {
  string taxonomy_id = 1;
  string display_name = 2;
  string path = 3;
}
