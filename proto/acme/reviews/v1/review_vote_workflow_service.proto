syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ReviewVoteWorkflowServiceProto";
option java_package = "com.acme.reviews.v1";

// Runs the long-lived workflow that takes a review vote from start to finish.
service ReviewVoteWorkflowService {
  // Starts a review vote.
  rpc StartReviewVoteWorkflow(StartReviewVoteWorkflowRequest) returns (StartReviewVoteWorkflowResponse);

  // Advances a review vote.
  rpc AdvanceReviewVoteWorkflow(AdvanceReviewVoteWorkflowRequest) returns (AdvanceReviewVoteWorkflowResponse);

  // Retrys a review vote.
  rpc RetryReviewVoteWorkflow(RetryReviewVoteWorkflowRequest) returns (RetryReviewVoteWorkflowResponse);

  // Pauses a review vote.
  rpc PauseReviewVoteWorkflow(PauseReviewVoteWorkflowRequest) returns (PauseReviewVoteWorkflowResponse);

  // Resumes a review vote.
  rpc ResumeReviewVoteWorkflow(ResumeReviewVoteWorkflowRequest) returns (ResumeReviewVoteWorkflowResponse);

  // Returns a review vote.
  rpc InspectReviewVoteWorkflow(InspectReviewVoteWorkflowRequest) returns (InspectReviewVoteWorkflowResponse);

  // Lists review votes a page at a time.
  rpc ListReviewVoteWorkflows(ListReviewVoteWorkflowsRequest) returns (ListReviewVoteWorkflowsResponse);

  // Signals a review vote.
  rpc SignalReviewVoteWorkflow(SignalReviewVoteWorkflowRequest) returns (SignalReviewVoteWorkflowResponse);
}

// The request of `StartReviewVoteWorkflow`.
message StartReviewVoteWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string review_vote_id = 2;
  ReviewVote review_vote = 3;
  StartReviewVoteWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartReviewVoteWorkflow`.
message StartReviewVoteWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReviewVote review_vote = 1;
  StartReviewVoteWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

