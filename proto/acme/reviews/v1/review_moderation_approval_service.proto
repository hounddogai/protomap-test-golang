syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ReviewModerationApprovalServiceProto";
option java_package = "com.acme.reviews.v1";

// Routes review moderations through approval, with escalation and delegation.
service ReviewModerationApprovalService {
  // Submits a review moderation.
  rpc SubmitReviewModeration(SubmitReviewModerationRequest) returns (SubmitReviewModerationResponse);

  // Approves a review moderation.
  rpc ApproveReviewModeration(ApproveReviewModerationRequest) returns (ApproveReviewModerationResponse);

  // Rejects a review moderation.
  rpc RejectReviewModeration(RejectReviewModerationRequest) returns (RejectReviewModerationResponse);

  // Escalates a review moderation.
  rpc EscalateReviewModeration(EscalateReviewModerationRequest) returns (EscalateReviewModerationResponse);

  // Lists review moderations a page at a time.
  rpc ListPendingReviewModerations(ListPendingReviewModerationsRequest) returns (ListPendingReviewModerationsResponse);

  // Recalls a review moderation.
  rpc RecallReviewModeration(RecallReviewModerationRequest) returns (RecallReviewModerationResponse);

  // Returns a review moderation.
  rpc GetReviewModerationApprovalStatus(GetReviewModerationApprovalStatusRequest) returns (GetReviewModerationApprovalStatusResponse);

  // Comments a review moderation.
  rpc CommentReviewModerationApproval(CommentReviewModerationApprovalRequest) returns (CommentReviewModerationApprovalResponse);
}

// The request of `SubmitReviewModeration`.
message SubmitReviewModerationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string review_moderation_id = 2;
  ReviewModeration review_moderation = 3;
  SubmitReviewModerationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitReviewModeration`.
message SubmitReviewModerationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReviewModeration review_moderation = 1;
  SubmitReviewModerationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

