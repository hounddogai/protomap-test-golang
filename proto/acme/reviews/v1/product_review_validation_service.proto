syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ProductReviewValidationServiceProto";
option java_package = "com.acme.reviews.v1";

// Checks product reviews against the rules before anything acts on them.
service ProductReviewValidationService {
  // Validates a product review.
  rpc ValidateProductReview(ValidateProductReviewRequest) returns (ValidateProductReviewResponse);

  // Previews a product review.
  rpc PreviewProductReview(PreviewProductReviewRequest) returns (PreviewProductReviewResponse);

  // Checks a product review.
  rpc CheckProductReviewEligibility(CheckProductReviewEligibilityRequest) returns (CheckProductReviewEligibilityResponse);

  // Explains a product review.
  rpc ExplainProductReviewDecision(ExplainProductReviewDecisionRequest) returns (ExplainProductReviewDecisionResponse);

  // Scores a product review.
  rpc ScoreProductReview(ScoreProductReviewRequest) returns (ScoreProductReviewResponse);

  // Returns a product review.
  rpc GetProductReviewRules(GetProductReviewRulesRequest) returns (GetProductReviewRulesResponse);
}

// The request of `ValidateProductReview`.
message ValidateProductReviewRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string product_review_id = 2;
  ProductReview product_review = 3;
  ValidateProductReviewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateProductReview`.
message ValidateProductReviewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductReview product_review = 1;
  ValidateProductReviewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewProductReview`.
message PreviewProductReviewRequest {
  // What the operation needs besides the record.
  message Details {
