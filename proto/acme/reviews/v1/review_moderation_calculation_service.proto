syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ReviewModerationCalculationServiceProto";
option java_package = "com.acme.reviews.v1";

// Computes the figures of a review moderation, such as totals, taxes, and estimates.
service ReviewModerationCalculationService {
  // Calculates a review moderation.
  rpc CalculateReviewModeration(CalculateReviewModerationRequest) returns (CalculateReviewModerationResponse);

  // Estimates a review moderation.
  rpc EstimateReviewModeration(EstimateReviewModerationRequest) returns (EstimateReviewModerationResponse);

  // Quotes a review moderation.
  rpc QuoteReviewModeration(QuoteReviewModerationRequest) returns (QuoteReviewModerationResponse);

  // Recalculates a review moderation.
  rpc RecalculateReviewModerations(RecalculateReviewModerationsRequest) returns (RecalculateReviewModerationsResponse);

  // Explains a review moderation.
  rpc ExplainReviewModerationCalculation(ExplainReviewModerationCalculationRequest) returns (ExplainReviewModerationCalculationResponse);

  // Returns a review moderation.
  rpc GetReviewModerationRates(GetReviewModerationRatesRequest) returns (GetReviewModerationRatesResponse);
}

// The request of `CalculateReviewModeration`.
message CalculateReviewModerationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string review_moderation_id = 2;
  ReviewModeration review_moderation = 3;
  CalculateReviewModerationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReviewModeration`.
message CalculateReviewModerationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReviewModerationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReviewModeration review_moderation = 1;
  CalculateReviewModerationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

