  acme.common.v1.RequestContext context = 1;
  string review_moderation_id = 2;
  ReviewModeration review_moderation = 3;
  ExplainReviewModerationCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainReviewModerationCalculation`.
message ExplainReviewModerationCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReviewModeration review_moderation = 1;
  ExplainReviewModerationCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

