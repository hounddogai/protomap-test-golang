syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ProductReviewWorkflowServiceProto";
option java_package = "com.acme.reviews.v1";

// Runs the long-lived workflow that takes a product review from start to finish.
service ProductReviewWorkflowService {
  // Starts a product review.
  rpc StartProductReviewWorkflow(StartProductReviewWorkflowRequest) returns (StartProductReviewWorkflowResponse);

  // Advances a product review.
  rpc AdvanceProductReviewWorkflow(AdvanceProductReviewWorkflowRequest) returns (AdvanceProductReviewWorkflowResponse);

  // Cancels a product review.
  rpc CancelProductReviewWorkflow(CancelProductReviewWorkflowRequest) returns (CancelProductReviewWorkflowResponse);

  // Retrys a product review.
  rpc RetryProductReviewWorkflow(RetryProductReviewWorkflowRequest) returns (RetryProductReviewWorkflowResponse);

  // Pauses a product review.
  rpc PauseProductReviewWorkflow(PauseProductReviewWorkflowRequest) returns (PauseProductReviewWorkflowResponse);

  // Resumes a product review.
  rpc ResumeProductReviewWorkflow(ResumeProductReviewWorkflowRequest) returns (ResumeProductReviewWorkflowResponse);

  // Returns a product review.
  rpc InspectProductReviewWorkflow(InspectProductReviewWorkflowRequest) returns (InspectProductReviewWorkflowResponse);

  // Lists product reviews a page at a time.
  rpc ListProductReviewWorkflows(ListProductReviewWorkflowsRequest) returns (ListProductReviewWorkflowsResponse);

  // Signals a product review.
  rpc SignalProductReviewWorkflow(SignalProductReviewWorkflowRequest) returns (SignalProductReviewWorkflowResponse);
}

// The request of `StartProductReviewWorkflow`.
message StartProductReviewWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_review_id = 2;
  ProductReview product_review = 3;
  StartProductReviewWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartProductReviewWorkflow`.
message StartProductReviewWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductReview product_review = 1;
  StartProductReviewWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

