// The request of `GetProductReviewApprovalStatus`.
message GetProductReviewApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string product_review_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetProductReviewApprovalStatus`.
message GetProductReviewApprovalStatusResponse {
  ProductReview product_review = 1;
  acme.common.v1.OperationResult result = 2;
}
