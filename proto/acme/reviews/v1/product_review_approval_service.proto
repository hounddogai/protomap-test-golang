syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ProductReviewApprovalServiceProto";
option java_package = "com.acme.reviews.v1";

// Routes product reviews through approval, with escalation and delegation.
service ProductReviewApprovalService {
  // Submits a product review.
  rpc SubmitProductReview(SubmitProductReviewRequest) returns (SubmitProductReviewResponse);

  // Approves a product review.
  rpc ApproveProductReview(ApproveProductReviewRequest) returns (ApproveProductReviewResponse);

  // Rejects a product review.
  rpc RejectProductReview(RejectProductReviewRequest) returns (RejectProductReviewResponse);

  // Escalates a product review.
  rpc EscalateProductReview(EscalateProductReviewRequest) returns (EscalateProductReviewResponse);

  // Lists product reviews a page at a time.
  rpc ListPendingProductReviews(ListPendingProductReviewsRequest) returns (ListPendingProductReviewsResponse);

  // Recalls a product review.
  rpc RecallProductReview(RecallProductReviewRequest) returns (RecallProductReviewResponse);

  // Returns a product review.
  rpc GetProductReviewApprovalStatus(GetProductReviewApprovalStatusRequest) returns (GetProductReviewApprovalStatusResponse);
}

// The request of `SubmitProductReview`.
message SubmitProductReviewRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_review_id = 2;
  ProductReview product_review = 3;
  SubmitProductReviewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitProductReview`.
message SubmitProductReviewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductReview product_review = 1;
  SubmitProductReviewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveProductReview`.
message ApproveProductReviewRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
