syntax = "proto3";

package acme.reviews.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/reviews/v1/reviews.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Reviews.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/reviews/v1;reviewsv1";
option java_multiple_files = true;
option java_outer_classname = "ReviewVoteCalculationServiceProto";
option java_package = "com.acme.reviews.v1";

// Computes the figures of a review vote, such as totals, taxes, and estimates.
service ReviewVoteCalculationService {
  // Calculates a review vote.
  rpc CalculateReviewVote(CalculateReviewVoteRequest) returns (CalculateReviewVoteResponse);

  // Estimates a review vote.
  rpc EstimateReviewVote(EstimateReviewVoteRequest) returns (EstimateReviewVoteResponse);

  // Quotes a review vote.
  rpc QuoteReviewVote(QuoteReviewVoteRequest) returns (QuoteReviewVoteResponse);

  // Compares a review vote.
  rpc CompareReviewVoteOptions(CompareReviewVoteOptionsRequest) returns (CompareReviewVoteOptionsResponse);

  // Recalculates a review vote.
  rpc RecalculateReviewVotes(RecalculateReviewVotesRequest) returns (RecalculateReviewVotesResponse);

  // Explains a review vote.
  rpc ExplainReviewVoteCalculation(ExplainReviewVoteCalculationRequest) returns (ExplainReviewVoteCalculationResponse);

  // Returns a review vote.
  rpc GetReviewVoteRates(GetReviewVoteRatesRequest) returns (GetReviewVoteRatesResponse);
}

// The request of `CalculateReviewVote`.
message CalculateReviewVoteRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string review_vote_id = 2;
  ReviewVote review_vote = 3;
  CalculateReviewVoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReviewVote`.
message CalculateReviewVoteResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReviewVoteResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReviewVote review_vote = 1;
  CalculateReviewVoteResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

