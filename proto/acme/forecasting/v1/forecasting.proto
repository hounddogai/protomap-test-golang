syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/forecasting/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastingProto";
option java_package = "com.acme.forecasting.v1";

// Where a demand forecast is in its lifecycle.
enum DemandForecastStatus {
  DEMAND_FORECAST_STATUS_UNSPECIFIED = 0;
  DEMAND_FORECAST_STATUS_DRAFT = 1;
  DEMAND_FORECAST_STATUS_ISSUED = 2;
  DEMAND_FORECAST_STATUS_APPROVED = 3;
  DEMAND_FORECAST_STATUS_PAID = 4;
  DEMAND_FORECAST_STATUS_VOID = 5;
}

// Where a forecast model is in its lifecycle.
enum ForecastModelStatus {
  FORECAST_MODEL_STATUS_UNSPECIFIED = 0;
  FORECAST_MODEL_STATUS_PLANNED = 1;
  FORECAST_MODEL_STATUS_AVAILABLE = 2;
  FORECAST_MODEL_STATUS_RESERVED = 3;
  FORECAST_MODEL_STATUS_RETIRED = 4;
}

// Where a scenario is in its lifecycle.
enum ScenarioStatus {
  SCENARIO_STATUS_UNSPECIFIED = 0;
  SCENARIO_STATUS_NEW = 1;
  SCENARIO_STATUS_OPEN = 2;
  SCENARIO_STATUS_WAITING = 3;
  SCENARIO_STATUS_RESOLVED = 4;
  SCENARIO_STATUS_CLOSED = 5;
}

// The line of a demand forecast.
message DemandForecastLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  DemandForecastLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a demand forecast line.
message DemandForecastLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a demand forecast.
message DemandForecastCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a demand forecast.
message DemandForecastBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a demand forecast.
message DemandForecastAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A demand forecast of the forecasting domain.
message DemandForecast {
  string demand_forecast_id = 1;
  string number = 2;
  DemandForecastStatus status = 3;
  ScenarioRef counterparty = 4;
  repeated DemandForecastLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    DemandForecastCardSettlement card = 8;
    DemandForecastBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated DemandForecastAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The dimensions of a forecast model.
message ForecastModelDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a forecast model.
message ForecastModelComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A forecast model of the forecasting domain.
message ForecastModel {
  string forecast_model_id = 1;
  string code = 2;
  string name = 3;
  ForecastModelStatus status = 4;
  repeated string category_path = 5;
  ForecastModelDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, ForecastModelComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The comment of a scenario.
message ScenarioComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a scenario.
message ScenarioSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a scenario.
message ScenarioChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a scenario.
message ScenarioStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A scenario of the forecasting domain.
message Scenario {
  string scenario_id = 1;
  string subject = 2;
  ScenarioStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ScenarioComment comments = 7;
  ScenarioSla sla = 8;
  oneof origin {
    ForecastModelRef customer = 9;
    string external_reference = 10;
    ScenarioChannelOrigin channel = 11;
  }
  repeated ScenarioStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
