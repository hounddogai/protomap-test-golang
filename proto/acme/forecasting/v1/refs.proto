syntax = "proto3";

package acme.forecasting.v1;

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.forecasting.v1";

// A reference to a demand forecast of the forecasting domain.
message DemandForecastRef {
  string demand_forecast_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a forecast model of the forecasting domain.
message ForecastModelRef {
  string forecast_model_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a scenario of the forecasting domain.
message ScenarioRef {
  string scenario_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
