syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseRequisitionQueryServiceProto";
option java_package = "com.acme.procurement.v1";

// Answers read-only questions about purchase requisitions, for screens and reports.
service PurchaseRequisitionQueryService {
  // Returns a purchase requisition.
  rpc LookupPurchaseRequisition(LookupPurchaseRequisitionRequest) returns (LookupPurchaseRequisitionResponse);

  // Lists purchase requisitions a page at a time.
  rpc BrowsePurchaseRequisitions(BrowsePurchaseRequisitionsRequest) returns (BrowsePurchaseRequisitionsResponse);

  // Lists purchase requisitions a page at a time.
  rpc FindPurchaseRequisitions(FindPurchaseRequisitionsRequest) returns (FindPurchaseRequisitionsResponse);

  // Counts purchase requisitions by status.
  rpc CountPurchaseRequisitions(CountPurchaseRequisitionsRequest) returns (CountPurchaseRequisitionsResponse);

  // Returns several purchase requisitions at once.
  rpc ResolvePurchaseRequisitions(ResolvePurchaseRequisitionsRequest) returns (ResolvePurchaseRequisitionsResponse);

  // Streams every matching purchase requisition.
  rpc ExportPurchaseRequisitions(ExportPurchaseRequisitionsRequest) returns (stream ExportPurchaseRequisitionsResponse);

  // Summarizes a purchase requisition.
  rpc SummarizePurchaseRequisitions(SummarizePurchaseRequisitionsRequest) returns (SummarizePurchaseRequisitionsResponse);

  // Lists purchase requisitions a page at a time.
  rpc SuggestPurchaseRequisitions(SuggestPurchaseRequisitionsRequest) returns (SuggestPurchaseRequisitionsResponse);

  // Returns a purchase requisition.
  rpc PeekPurchaseRequisition(PeekPurchaseRequisitionRequest) returns (PeekPurchaseRequisitionResponse);
}

// The request of `LookupPurchaseRequisition`.
message LookupPurchaseRequisitionRequest {
  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPurchaseRequisition`.
message LookupPurchaseRequisitionResponse {
  PurchaseRequisition purchase_requisition = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePurchaseRequisitions`.
message BrowsePurchaseRequisitionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseRequisitionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePurchaseRequisitionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePurchaseRequisitions`.
message BrowsePurchaseRequisitionsResponse {
  repeated PurchaseRequisition purchase_requisitions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPurchaseRequisitions`.
message FindPurchaseRequisitionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseRequisitionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPurchaseRequisitionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPurchaseRequisitions`.
message FindPurchaseRequisitionsResponse {
  repeated PurchaseRequisition purchase_requisitions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPurchaseRequisitions`.
message CountPurchaseRequisitionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseRequisitionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPurchaseRequisitionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPurchaseRequisitions`.
message CountPurchaseRequisitionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePurchaseRequisitions`.
message ResolvePurchaseRequisitionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string purchase_requisition_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePurchaseRequisitions`.
message ResolvePurchaseRequisitionsResponse {
  repeated PurchaseRequisition purchase_requisitions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPurchaseRequisitions`.
message ExportPurchaseRequisitionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseRequisitionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPurchaseRequisitionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPurchaseRequisitions`.
message ExportPurchaseRequisitionsResponse {
  PurchaseRequisition purchase_requisition = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePurchaseRequisitions`.
message SummarizePurchaseRequisitionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  SummarizePurchaseRequisitionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePurchaseRequisitions`.
message SummarizePurchaseRequisitionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPurchaseRequisitions`.
message SuggestPurchaseRequisitionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseRequisitionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPurchaseRequisitionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPurchaseRequisitions`.
message SuggestPurchaseRequisitionsResponse {
  repeated PurchaseRequisition purchase_requisitions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPurchaseRequisition`.
message PeekPurchaseRequisitionRequest {
  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPurchaseRequisition`.
message PeekPurchaseRequisitionResponse {
  PurchaseRequisition purchase_requisition = 1;
  acme.common.v1.OperationResult result = 2;
}
