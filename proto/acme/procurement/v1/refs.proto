syntax = "proto3";

package acme.procurement.v1;

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.procurement.v1";

// A reference to a purchase requisition of the procurement domain.
message PurchaseRequisitionRef {
  string purchase_requisition_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a purchase order of the procurement domain.
message PurchaseOrderRef {
  string purchase_order_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a goods receipt of the procurement domain.
message GoodsReceiptRef {
  string goods_receipt_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a rfq of the procurement domain.
message RfqRef {
  string rfq_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
