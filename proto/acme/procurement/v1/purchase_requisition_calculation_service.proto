syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseRequisitionCalculationServiceProto";
option java_package = "com.acme.procurement.v1";

// Computes the figures of a purchase requisition, such as totals, taxes, and estimates.
service PurchaseRequisitionCalculationService {
  // Calculates a purchase requisition.
  rpc CalculatePurchaseRequisition(CalculatePurchaseRequisitionRequest) returns (CalculatePurchaseRequisitionResponse);

  // Estimates a purchase requisition.
  rpc EstimatePurchaseRequisition(EstimatePurchaseRequisitionRequest) returns (EstimatePurchaseRequisitionResponse);

  // Quotes a purchase requisition.
  rpc QuotePurchaseRequisition(QuotePurchaseRequisitionRequest) returns (QuotePurchaseRequisitionResponse);

  // Compares a purchase requisition.
  rpc ComparePurchaseRequisitionOptions(ComparePurchaseRequisitionOptionsRequest) returns (ComparePurchaseRequisitionOptionsResponse);

  // Recalculates a purchase requisition.
  rpc RecalculatePurchaseRequisitions(RecalculatePurchaseRequisitionsRequest) returns (RecalculatePurchaseRequisitionsResponse);

  // Explains a purchase requisition.
  rpc ExplainPurchaseRequisitionCalculation(ExplainPurchaseRequisitionCalculationRequest) returns (ExplainPurchaseRequisitionCalculationResponse);

  // Returns a purchase requisition.
  rpc GetPurchaseRequisitionRates(GetPurchaseRequisitionRatesRequest) returns (GetPurchaseRequisitionRatesResponse);
}

// The request of `CalculatePurchaseRequisition`.
message CalculatePurchaseRequisitionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  PurchaseRequisition purchase_requisition = 3;
  CalculatePurchaseRequisitionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePurchaseRequisition`.
message CalculatePurchaseRequisitionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePurchaseRequisitionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  PurchaseRequisition purchase_requisition = 1;
  CalculatePurchaseRequisitionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

