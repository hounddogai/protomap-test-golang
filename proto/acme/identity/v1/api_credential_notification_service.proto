syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "ApiCredentialNotificationServiceProto";
option java_package = "com.acme.identity.v1";

// Tells the people who follow an api credential what changed.
service ApiCredentialNotificationService {
  // Subscribes an api credential.
  rpc SubscribeApiCredentialUpdates(SubscribeApiCredentialUpdatesRequest) returns (SubscribeApiCredentialUpdatesResponse);

  // Unsubscribes an api credential.
  rpc UnsubscribeApiCredentialUpdates(UnsubscribeApiCredentialUpdatesRequest) returns (UnsubscribeApiCredentialUpdatesResponse);

  // Notifys an api credential.
  rpc NotifyApiCredentialWatchers(NotifyApiCredentialWatchersRequest) returns (NotifyApiCredentialWatchersResponse);

  // Lists api credentials a page at a time.
  rpc ListApiCredentialSubscriptions(ListApiCredentialSubscriptionsRequest) returns (ListApiCredentialSubscriptionsResponse);

  // Sends an api credential.
  rpc SendApiCredentialTestNotice(SendApiCredentialTestNoticeRequest) returns (SendApiCredentialTestNoticeResponse);

  // Returns an api credential.
  rpc GetApiCredentialPreferences(GetApiCredentialPreferencesRequest) returns (GetApiCredentialPreferencesResponse);

  // Streams the changes of api credentials as they happen.
  rpc StreamApiCredentialNotices(StreamApiCredentialNoticesRequest) returns (stream StreamApiCredentialNoticesResponse);
}

// The request of `SubscribeApiCredentialUpdates`.
message SubscribeApiCredentialUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  SubscribeApiCredentialUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeApiCredentialUpdates`.
message SubscribeApiCredentialUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  SubscribeApiCredentialUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeApiCredentialUpdates`.
message UnsubscribeApiCredentialUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  UnsubscribeApiCredentialUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeApiCredentialUpdates`.
message UnsubscribeApiCredentialUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  UnsubscribeApiCredentialUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyApiCredentialWatchers`.
message NotifyApiCredentialWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
