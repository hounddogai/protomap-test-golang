syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "SessionQueryServiceProto";
option java_package = "com.acme.identity.v1";

// Answers read-only questions about sessions, for screens and reports.
service SessionQueryService {
  // Returns a session.
  rpc LookupSession(LookupSessionRequest) returns (LookupSessionResponse);

  // Lists sessions a page at a time.
  rpc BrowseSessions(BrowseSessionsRequest) returns (BrowseSessionsResponse);

  // Lists sessions a page at a time.
  rpc FindSessions(FindSessionsRequest) returns (FindSessionsResponse);

  // Counts sessions by status.
  rpc CountSessions(CountSessionsRequest) returns (CountSessionsResponse);

  // Streams every matching session.
  rpc ExportSessions(ExportSessionsRequest) returns (stream ExportSessionsResponse);

  // Summarizes a session.
  rpc SummarizeSessions(SummarizeSessionsRequest) returns (SummarizeSessionsResponse);

  // Lists sessions a page at a time.
  rpc SuggestSessions(SuggestSessionsRequest) returns (SuggestSessionsResponse);
}

// The request of `LookupSession`.
message LookupSessionRequest {
  acme.common.v1.RequestContext context = 1;
  string session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSession`.
message LookupSessionResponse {
  Session session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSessions`.
message BrowseSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSessions`.
message BrowseSessionsResponse {
  repeated Session sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSessions`.
message FindSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSessions`.
message FindSessionsResponse {
  repeated Session sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSessions`.
message CountSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSessions`.
message CountSessionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSessions`.
message ExportSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSessionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSessions`.
message ExportSessionsResponse {
  Session session = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSessions`.
message SummarizeSessionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string session_id = 2;
  SummarizeSessionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSessions`.
message SummarizeSessionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSessions`.
message SuggestSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSessions`.
message SuggestSessionsResponse {
  repeated Session sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
