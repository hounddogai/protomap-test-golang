syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/identity.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "TenantExportServiceProto";
option java_package = "com.acme.identity.v1";

// Exports tenants to files and other systems.
service TenantExportService {
  // Streams every matching tenant.
  rpc StreamTenantExport(StreamTenantExportRequest) returns (stream StreamTenantExportResponse);

  // Returns a tenant.
  rpc GetTenantExport(GetTenantExportRequest) returns (GetTenantExportResponse);

  // Cancels a tenant.
  rpc CancelTenantExport(CancelTenantExportRequest) returns (CancelTenantExportResponse);

  // Lists tenants a page at a time.
  rpc ListTenantExports(ListTenantExportsRequest) returns (ListTenantExportsResponse);

  // Schedules a tenant.
  rpc ScheduleTenantExport(ScheduleTenantExportRequest) returns (ScheduleTenantExportResponse);

  // Retrys a tenant.
  rpc RetryTenantExport(RetryTenantExportRequest) returns (RetryTenantExportResponse);
}

// The request of `StreamTenantExport`.
message StreamTenantExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TenantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTenantExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamTenantExport`.
message StreamTenantExportResponse {
  Tenant tenant = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetTenantExport`.
message GetTenantExportRequest {
  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTenantExport`.
message GetTenantExportResponse {
  Tenant tenant = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelTenantExport`.
message CancelTenantExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  CancelTenantExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelTenantExport`.
message CancelTenantExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tenant tenant = 1;
  CancelTenantExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListTenantExports`.
message ListTenantExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TenantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTenantExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTenantExports`.
message ListTenantExportsResponse {
  repeated Tenant tenants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleTenantExport`.
message ScheduleTenantExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  ScheduleTenantExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTenantExport`.
message ScheduleTenantExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryTenantExport`.
message RetryTenantExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  Tenant tenant = 3;
  RetryTenantExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryTenantExport`.
message RetryTenantExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tenant tenant = 1;
  RetryTenantExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
