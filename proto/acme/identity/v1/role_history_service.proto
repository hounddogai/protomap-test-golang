syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "RoleHistoryServiceProto";
option java_package = "com.acme.identity.v1";

// Keeps every version of a role and restores earlier ones.
service RoleHistoryService {
  // Records a role.
  rpc RecordRoleVersion(RecordRoleVersionRequest) returns (RecordRoleVersionResponse);

  // Lists roles a page at a time.
  rpc ListRoleVersions(ListRoleVersionsRequest) returns (ListRoleVersionsResponse);

  // Returns a role.
  rpc GetRoleVersion(GetRoleVersionRequest) returns (GetRoleVersionResponse);

  // Compares a role.
  rpc CompareRoleVersions(CompareRoleVersionsRequest) returns (CompareRoleVersionsResponse);

  // Reverts a role.
  rpc RevertRole(RevertRoleRequest) returns (RevertRoleResponse);

  // Annotates a role.
  rpc AnnotateRoleVersion(AnnotateRoleVersionRequest) returns (AnnotateRoleVersionResponse);

  // Deletes a role.
  rpc PruneRoleVersions(PruneRoleVersionsRequest) returns (PruneRoleVersionsResponse);
}

// The request of `RecordRoleVersion`.
message RecordRoleVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  Role role = 3;
  RecordRoleVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordRoleVersion`.
message RecordRoleVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Role role = 1;
  RecordRoleVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListRoleVersions`.
message ListRoleVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRoleVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRoleVersions`.
message ListRoleVersionsResponse {
  repeated Role roles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRoleVersion`.
message GetRoleVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRoleVersion`.
message GetRoleVersionResponse {
  Role role = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareRoleVersions`.
message CompareRoleVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  Role role = 3;
  CompareRoleVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareRoleVersions`.
message CompareRoleVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Role role = 1;
  CompareRoleVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertRole`.
message RevertRoleRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  Role role = 3;
  RevertRoleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertRole`.
message RevertRoleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Role role = 1;
  RevertRoleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateRoleVersion`.
message AnnotateRoleVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  Role role = 3;
  AnnotateRoleVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateRoleVersion`.
message AnnotateRoleVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Role role = 1;
  AnnotateRoleVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneRoleVersions`.
message PruneRoleVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneRoleVersions`.
message PruneRoleVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
