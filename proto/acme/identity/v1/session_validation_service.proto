syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "SessionValidationServiceProto";
option java_package = "com.acme.identity.v1";

// Checks sessions against the rules before anything acts on them.
service SessionValidationService {
  // Validates a session.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);

  // Previews a session.
  rpc PreviewSession(PreviewSessionRequest) returns (PreviewSessionResponse);

  // Checks a session.
  rpc CheckSessionEligibility(CheckSessionEligibilityRequest) returns (CheckSessionEligibilityResponse);

  // Explains a session.
  rpc ExplainSessionDecision(ExplainSessionDecisionRequest) returns (ExplainSessionDecisionResponse);

  // Scores a session.
  rpc ScoreSession(ScoreSessionRequest) returns (ScoreSessionResponse);

  // Lints a session.
  rpc LintSessions(LintSessionsRequest) returns (LintSessionsResponse);

  // Returns a session.
  rpc GetSessionRules(GetSessionRulesRequest) returns (GetSessionRulesResponse);
}

// The request of `ValidateSession`.
message ValidateSessionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string session_id = 2;
  Session session = 3;
  ValidateSessionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSession`.
message ValidateSessionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Session session = 1;
  ValidateSessionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

