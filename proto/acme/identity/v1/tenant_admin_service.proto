syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/identity.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "TenantAdminServiceProto";
option java_package = "com.acme.identity.v1";

// Operator actions on tenants that support staff run by hand.
service TenantAdminService {
  // Archives a tenant.
  rpc ArchiveTenant(ArchiveTenantRequest) returns (ArchiveTenantResponse);

  // Restores a tenant.
  rpc RestoreTenant(RestoreTenantRequest) returns (RestoreTenantResponse);

  // Deletes a tenant.
  rpc PurgeTenant(PurgeTenantRequest) returns (PurgeTenantResponse);

  // Reassigns a tenant.
  rpc ReassignTenant(ReassignTenantRequest) returns (ReassignTenantResponse);

  // Locks a tenant.
  rpc LockTenant(LockTenantRequest) returns (LockTenantResponse);

  // Unlocks a tenant.
  rpc UnlockTenant(UnlockTenantRequest) returns (UnlockTenantResponse);

  // Returns a tenant.
  rpc InspectTenant(InspectTenantRequest) returns (InspectTenantResponse);
}

// The request of `ArchiveTenant`.
message ArchiveTenantRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  ArchiveTenantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveTenant`.
message ArchiveTenantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tenant tenant = 1;
  ArchiveTenantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreTenant`.
message RestoreTenantRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  RestoreTenantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `RestoreTenant`.
message RestoreTenantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tenant tenant = 1;
  RestoreTenantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeTenant`.
message PurgeTenantRequest {
  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeTenant`.
message PurgeTenantResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignTenant`.
message ReassignTenantRequest {
  // What the operation needs besides the record.
  message Details {
    UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  ReassignTenantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReassignTenant`.
message ReassignTenantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tenant tenant = 1;
  ReassignTenantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `LockTenant`.
message LockTenantRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  LockTenantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `LockTenant`.
message LockTenantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tenant tenant = 1;
  LockTenantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
