syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "ApiCredentialValidationServiceProto";
option java_package = "com.acme.identity.v1";

// Checks api credentials against the rules before anything acts on them.
service ApiCredentialValidationService {
  // Validates an api credential.
  rpc ValidateApiCredential(ValidateApiCredentialRequest) returns (ValidateApiCredentialResponse);

  // Previews an api credential.
  rpc PreviewApiCredential(PreviewApiCredentialRequest) returns (PreviewApiCredentialResponse);

  // Checks an api credential.
  rpc CheckApiCredentialEligibility(CheckApiCredentialEligibilityRequest) returns (CheckApiCredentialEligibilityResponse);

  // Normalizes an api credential.
  rpc NormalizeApiCredential(NormalizeApiCredentialRequest) returns (NormalizeApiCredentialResponse);

  // Explains an api credential.
  rpc ExplainApiCredentialDecision(ExplainApiCredentialDecisionRequest) returns (ExplainApiCredentialDecisionResponse);

  // Scores an api credential.
  rpc ScoreApiCredential(ScoreApiCredentialRequest) returns (ScoreApiCredentialResponse);

  // Lints an api credential.
  rpc LintApiCredentials(LintApiCredentialsRequest) returns (LintApiCredentialsResponse);

  // Returns an api credential.
  rpc GetApiCredentialRules(GetApiCredentialRulesRequest) returns (GetApiCredentialRulesResponse);
}

// The request of `ValidateApiCredential`.
message ValidateApiCredentialRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  ApiCredential api_credential = 3;
  ValidateApiCredentialRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateApiCredential`.
message ValidateApiCredentialResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  ValidateApiCredentialResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

