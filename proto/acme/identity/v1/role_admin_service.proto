syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/identity.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "RoleAdminServiceProto";
option java_package = "com.acme.identity.v1";

// Operator actions on roles that support staff run by hand.
service RoleAdminService {
  // Archives a role.
  rpc ArchiveRole(ArchiveRoleRequest) returns (ArchiveRoleResponse);

  // Restores a role.
  rpc RestoreRole(RestoreRoleRequest) returns (RestoreRoleResponse);

  // Deletes a role.
  rpc PurgeRole(PurgeRoleRequest) returns (PurgeRoleResponse);

  // Locks a role.
  rpc LockRole(LockRoleRequest) returns (LockRoleResponse);

  // Unlocks a role.
  rpc UnlockRole(UnlockRoleRequest) returns (UnlockRoleResponse);

  // Transfers a role.
  rpc TransferRole(TransferRoleRequest) returns (TransferRoleResponse);

  // Repairs a role.
  rpc RepairRole(RepairRoleRequest) returns (RepairRoleResponse);

  // Returns a role.
  rpc InspectRole(InspectRoleRequest) returns (InspectRoleResponse);
}

// The request of `ArchiveRole`.
message ArchiveRoleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  ArchiveRoleRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveRole`.
message ArchiveRoleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Role role = 1;
  ArchiveRoleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreRole`.
message RestoreRoleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  RestoreRoleRequest.Details details = 3;
