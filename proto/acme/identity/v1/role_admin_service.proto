// The request of `InspectRole`.
message InspectRoleRequest {
  acme.common.v1.RequestContext context = 1;
  string role_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectRole`.
message InspectRoleResponse {
  Role role = 1;
  acme.common.v1.OperationResult result = 2;
}
