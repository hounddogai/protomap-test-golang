  RestoreApiCredentialResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeApiCredential`.
message PurgeApiCredentialRequest {
  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeApiCredential`.
message PurgeApiCredentialResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignApiCredential`.
message ReassignApiCredentialRequest {
  // What the operation needs besides the record.
  message Details {
    UserRef assignee = 1;
