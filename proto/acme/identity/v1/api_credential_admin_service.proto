syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/identity.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "ApiCredentialAdminServiceProto";
option java_package = "com.acme.identity.v1";

// Operator actions on api credentials that support staff run by hand.
service ApiCredentialAdminService {
  // Archives an api credential.
  rpc ArchiveApiCredential(ArchiveApiCredentialRequest) returns (ArchiveApiCredentialResponse);

  // Restores an api credential.
  rpc RestoreApiCredential(RestoreApiCredentialRequest) returns (RestoreApiCredentialResponse);

  // Deletes an api credential.
  rpc PurgeApiCredential(PurgeApiCredentialRequest) returns (PurgeApiCredentialResponse);

  // Reassigns an api credential.
  rpc ReassignApiCredential(ReassignApiCredentialRequest) returns (ReassignApiCredentialResponse);

  // Locks an api credential.
  rpc LockApiCredential(LockApiCredentialRequest) returns (LockApiCredentialResponse);

  // Unlocks an api credential.
  rpc UnlockApiCredential(UnlockApiCredentialRequest) returns (UnlockApiCredentialResponse);

  // Transfers an api credential.
  rpc TransferApiCredential(TransferApiCredentialRequest) returns (TransferApiCredentialResponse);

  // Repairs an api credential.
  rpc RepairApiCredential(RepairApiCredentialRequest) returns (RepairApiCredentialResponse);

  // Returns an api credential.
  rpc InspectApiCredential(InspectApiCredentialRequest) returns (InspectApiCredentialResponse);
}

// The request of `ArchiveApiCredential`.
message ArchiveApiCredentialRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  ArchiveApiCredentialRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveApiCredential`.
message ArchiveApiCredentialResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  ArchiveApiCredentialResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreApiCredential`.
message RestoreApiCredentialRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    UserRef new_owner = 3;
