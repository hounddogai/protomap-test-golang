syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "UserValidationServiceProto";
option java_package = "com.acme.identity.v1";

// Checks users against the rules before anything acts on them.
service UserValidationService {
  // Validates a user.
  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);

  // Previews a user.
  rpc PreviewUser(PreviewUserRequest) returns (PreviewUserResponse);

  // Checks a user.
  rpc CheckUserEligibility(CheckUserEligibilityRequest) returns (CheckUserEligibilityResponse);

  // Normalizes a user.
  rpc NormalizeUser(NormalizeUserRequest) returns (NormalizeUserResponse);

  // Explains a user.
  rpc ExplainUserDecision(ExplainUserDecisionRequest) returns (ExplainUserDecisionResponse);

  // Scores a user.
  rpc ScoreUser(ScoreUserRequest) returns (ScoreUserResponse);

  // Lints a user.
  rpc LintUsers(LintUsersRequest) returns (LintUsersResponse);

  // Returns a user.
  rpc GetUserRules(GetUserRulesRequest) returns (GetUserRulesResponse);
}

// The request of `ValidateUser`.
message ValidateUserRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string user_id = 2;
  User user = 3;
  ValidateUserRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateUser`.
message ValidateUserResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  User user = 1;
  ValidateUserResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

