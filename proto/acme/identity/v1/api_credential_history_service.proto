syntax = "proto3";

package acme.identity.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/identity.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Identity.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/identity/v1;identityv1";
option java_multiple_files = true;
option java_outer_classname = "ApiCredentialHistoryServiceProto";
option java_package = "com.acme.identity.v1";

// Keeps every version of an api credential and restores earlier ones.
service ApiCredentialHistoryService {
  // Records an api credential.
  rpc RecordApiCredentialVersion(RecordApiCredentialVersionRequest) returns (RecordApiCredentialVersionResponse);

  // Lists api credentials a page at a time.
  rpc ListApiCredentialVersions(ListApiCredentialVersionsRequest) returns (ListApiCredentialVersionsResponse);

  // Returns an api credential.
  rpc GetApiCredentialVersion(GetApiCredentialVersionRequest) returns (GetApiCredentialVersionResponse);

  // Compares an api credential.
  rpc CompareApiCredentialVersions(CompareApiCredentialVersionsRequest) returns (CompareApiCredentialVersionsResponse);

  // Annotates an api credential.
  rpc AnnotateApiCredentialVersion(AnnotateApiCredentialVersionRequest) returns (AnnotateApiCredentialVersionResponse);

  // Deletes an api credential.
  rpc PruneApiCredentialVersions(PruneApiCredentialVersionsRequest) returns (PruneApiCredentialVersionsResponse);
}

// The request of `RecordApiCredentialVersion`.
message RecordApiCredentialVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  ApiCredential api_credential = 3;
  RecordApiCredentialVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordApiCredentialVersion`.
message RecordApiCredentialVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  RecordApiCredentialVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListApiCredentialVersions`.
message ListApiCredentialVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApiCredentialStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListApiCredentialVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListApiCredentialVersions`.
message ListApiCredentialVersionsResponse {
  repeated ApiCredential api_credentials = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetApiCredentialVersion`.
message GetApiCredentialVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetApiCredentialVersion`.
message GetApiCredentialVersionResponse {
  ApiCredential api_credential = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareApiCredentialVersions`.
message CompareApiCredentialVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  ApiCredential api_credential = 3;
  CompareApiCredentialVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareApiCredentialVersions`.
message CompareApiCredentialVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  CompareApiCredentialVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateApiCredentialVersion`.
message AnnotateApiCredentialVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  ApiCredential api_credential = 3;
  AnnotateApiCredentialVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateApiCredentialVersion`.
message AnnotateApiCredentialVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiCredential api_credential = 1;
  AnnotateApiCredentialVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneApiCredentialVersions`.
message PruneApiCredentialVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string api_credential_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneApiCredentialVersions`.
message PruneApiCredentialVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
