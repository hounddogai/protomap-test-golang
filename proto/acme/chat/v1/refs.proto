syntax = "proto3";

package acme.chat.v1;

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.chat.v1";

// A reference to a chat room of the chat domain.
message ChatRoomRef {
  string chat_room_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a chat bot of the chat domain.
message ChatBotRef {
  string chat_bot_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a handoff of the chat domain.
message HandoffRef {
  string handoff_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
