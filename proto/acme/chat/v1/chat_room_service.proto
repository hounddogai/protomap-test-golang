syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "ChatRoomServiceProto";
option java_package = "com.acme.chat.v1";

// Manages chat rooms: creates, reads, changes, and lists them.
service ChatRoomService {
  // Creates a chat room.
  rpc CreateChatRoom(CreateChatRoomRequest) returns (CreateChatRoomResponse);

  // Returns a chat room.
  rpc GetChatRoom(GetChatRoomRequest) returns (GetChatRoomResponse);

  // Changes a chat room.
  rpc UpdateChatRoom(UpdateChatRoomRequest) returns (UpdateChatRoomResponse);

  // Deletes a chat room.
  rpc DeleteChatRoom(DeleteChatRoomRequest) returns (DeleteChatRoomResponse);

  // Lists chat rooms a page at a time.
  rpc ListChatRooms(ListChatRoomsRequest) returns (ListChatRoomsResponse);

  // Returns several chat rooms at once.
  rpc BatchGetChatRooms(BatchGetChatRoomsRequest) returns (BatchGetChatRoomsResponse);

  // Lists chat rooms a page at a time.
  rpc SearchChatRooms(SearchChatRoomsRequest) returns (SearchChatRoomsResponse);

  // Takes a stream of chat rooms and answers once at the end.
  rpc BatchCreateChatRooms(stream BatchCreateChatRoomsRequest) returns (BatchCreateChatRoomsResponse);

  // Creates a chat room.
  rpc CloneChatRoom(CloneChatRoomRequest) returns (CloneChatRoomResponse);
}

// The request of `CreateChatRoom`.
message CreateChatRoomRequest {
  acme.common.v1.RequestContext context = 1;
  ChatRoom chat_room = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateChatRoom`.
message CreateChatRoomResponse {
  ChatRoom chat_room = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetChatRoom`.
message GetChatRoomRequest {
  acme.common.v1.RequestContext context = 1;
  string chat_room_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetChatRoom`.
message GetChatRoomResponse {
  ChatRoom chat_room = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateChatRoom`.
message UpdateChatRoomRequest {
  acme.common.v1.RequestContext context = 1;
  ChatRoom chat_room = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateChatRoom`.
message UpdateChatRoomResponse {
  ChatRoom chat_room = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteChatRoom`.
message DeleteChatRoomRequest {
  acme.common.v1.RequestContext context = 1;
  string chat_room_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteChatRoom`.
message DeleteChatRoomResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListChatRooms`.
message ListChatRoomsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChatRoomStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListChatRoomsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListChatRooms`.
message ListChatRoomsResponse {
  repeated ChatRoom chat_rooms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetChatRooms`.
message BatchGetChatRoomsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string chat_room_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetChatRooms`.
message BatchGetChatRoomsResponse {
  repeated ChatRoom chat_rooms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchChatRooms`.
message SearchChatRoomsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChatRoomStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchChatRoomsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchChatRooms`.
message SearchChatRoomsResponse {
  repeated ChatRoom chat_rooms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchCreateChatRooms`.
message BatchCreateChatRoomsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateChatRoomsRequest.StreamHeader header = 2;
    ChatRoom record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateChatRooms`.
message BatchCreateChatRoomsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string chat_room_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateChatRoomsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneChatRoom`.
message CloneChatRoomRequest {
  acme.common.v1.RequestContext context = 1;
  ChatRoom chat_room = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneChatRoom`.
message CloneChatRoomResponse {
  ChatRoom chat_room = 1;
  acme.common.v1.OperationResult result = 2;
}
