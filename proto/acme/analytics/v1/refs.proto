syntax = "proto3";

package acme.analytics.v1;

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.analytics.v1";

// A reference to an analytics event of the analytics domain.
message AnalyticsEventRef {
  string analytics_event_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a funnel of the analytics domain.
message FunnelRef {
  string funnel_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a cohort of the analytics domain.
message CohortRef {
  string cohort_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an analytics report of the analytics domain.
message AnalyticsReportRef {
  string analytics_report_id = 1;
  string display_name = 2;
  string number = 3;
}
