syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsProto";
option java_package = "com.acme.analytics.v1";

// Where an analytics event is in its lifecycle.
enum AnalyticsEventStatus {
  ANALYTICS_EVENT_STATUS_UNSPECIFIED = 0;
  ANALYTICS_EVENT_STATUS_RECEIVED = 1;
  ANALYTICS_EVENT_STATUS_PROCESSED = 2;
  ANALYTICS_EVENT_STATUS_DISCARDED = 3;
}

// Where a funnel is in its lifecycle.
enum FunnelStatus {
  FUNNEL_STATUS_UNSPECIFIED = 0;
  FUNNEL_STATUS_DRAFT = 1;
  FUNNEL_STATUS_ENABLED = 2;
  FUNNEL_STATUS_DISABLED = 3;
  FUNNEL_STATUS_RETIRED = 4;
}

// Where a cohort is in its lifecycle.
enum CohortStatus {
  COHORT_STATUS_UNSPECIFIED = 0;
  COHORT_STATUS_DRAFT = 1;
  COHORT_STATUS_ENABLED = 2;
  COHORT_STATUS_DISABLED = 3;
  COHORT_STATUS_RETIRED = 4;
}

// Where an analytics report is in its lifecycle.
enum AnalyticsReportStatus {
  ANALYTICS_REPORT_STATUS_UNSPECIFIED = 0;
  ANALYTICS_REPORT_STATUS_DRAFT = 1;
  ANALYTICS_REPORT_STATUS_ISSUED = 2;
  ANALYTICS_REPORT_STATUS_APPROVED = 3;
  ANALYTICS_REPORT_STATUS_PAID = 4;
  ANALYTICS_REPORT_STATUS_VOID = 5;
}

// The measurement of an analytics event.
message AnalyticsEventMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// An analytics event of the analytics domain.
message AnalyticsEvent {
  string analytics_event_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  FunnelRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated AnalyticsEventMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of a funnel.
message FunnelCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a funnel.
message FunnelDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a funnel.
message FunnelRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a funnel.
message FunnelBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A funnel of the analytics domain.
message Funnel {
  string funnel_id = 1;
  string name = 2;
  string description = 3;
  FunnelStatus status = 4;
  int32 priority = 5;
  repeated FunnelCondition conditions = 6;
  oneof action {
    FunnelDiscountAction discount = 7;
    FunnelRouteAction route = 8;
    FunnelBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The condition of a cohort.
message CohortCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a cohort.
message CohortDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a cohort.
message CohortRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a cohort.
message CohortBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A cohort of the analytics domain.
message Cohort {
  string cohort_id = 1;
  string name = 2;
  string description = 3;
  CohortStatus status = 4;
  int32 priority = 5;
  repeated CohortCondition conditions = 6;
  oneof action {
    CohortDiscountAction discount = 7;
    CohortRouteAction route = 8;
    CohortBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of an analytics report.
message AnalyticsReportLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  AnalyticsReportLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an analytics report line.
message AnalyticsReportLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an analytics report.
message AnalyticsReportCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an analytics report.
message AnalyticsReportBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an analytics report.
message AnalyticsReportAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An analytics report of the analytics domain.
message AnalyticsReport {
  string analytics_report_id = 1;
  string number = 2;
  AnalyticsReportStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated AnalyticsReportLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    AnalyticsReportCardSettlement card = 8;
    AnalyticsReportBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated AnalyticsReportAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
