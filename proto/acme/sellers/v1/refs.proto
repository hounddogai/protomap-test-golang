syntax = "proto3";

package acme.sellers.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.sellers.v1";

// A reference to a seller of the sellers domain.
message SellerRef {
  string seller_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to a seller listing of the sellers domain.
message SellerListingRef {
  string seller_listing_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a seller payout schedule of the sellers domain.
message SellerPayoutScheduleRef {
  string seller_payout_schedule_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a seller scorecard of the sellers domain.
message SellerScorecardRef {
  string seller_scorecard_id = 1;
  string display_name = 2;
  string number = 3;
}
