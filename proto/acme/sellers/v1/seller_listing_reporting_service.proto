syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerListingReportingServiceProto";
option java_package = "com.acme.sellers.v1";

// Builds and schedules reports about seller listings.
service SellerListingReportingService {
  // Generates a seller listing.
  rpc GenerateSellerListingReport(GenerateSellerListingReportRequest) returns (GenerateSellerListingReportResponse);

  // Returns a seller listing.
  rpc FetchSellerListingReport(FetchSellerListingReportRequest) returns (FetchSellerListingReportResponse);

  // Schedules a seller listing.
  rpc ScheduleSellerListingReport(ScheduleSellerListingReportRequest) returns (ScheduleSellerListingReportResponse);

  // Streams the changes of seller listings as they happen.
  rpc StreamSellerListingMetrics(StreamSellerListingMetricsRequest) returns (stream StreamSellerListingMetricsResponse);

  // Lists seller listings a page at a time.
  rpc ListSellerListingReports(ListSellerListingReportsRequest) returns (ListSellerListingReportsResponse);

  // Shares a seller listing.
  rpc ShareSellerListingReport(ShareSellerListingReportRequest) returns (ShareSellerListingReportResponse);

  // Counts seller listings by status.
  rpc CountSellerListingTotals(CountSellerListingTotalsRequest) returns (CountSellerListingTotalsResponse);

  // Deletes a seller listing.
  rpc DeleteSellerListingReport(DeleteSellerListingReportRequest) returns (DeleteSellerListingReportResponse);
}

// The request of `GenerateSellerListingReport`.
message GenerateSellerListingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  GenerateSellerListingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateSellerListingReport`.
message GenerateSellerListingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchSellerListingReport`.
message FetchSellerListingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchSellerListingReport`.
message FetchSellerListingReportResponse {
  SellerListing seller_listing = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleSellerListingReport`.
message ScheduleSellerListingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  ScheduleSellerListingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSellerListingReport`.
message ScheduleSellerListingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamSellerListingMetrics`.
message StreamSellerListingMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerListingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSellerListingMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSellerListingMetrics`.
message StreamSellerListingMetricsResponse {
  SellerListing seller_listing = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListSellerListingReports`.
message ListSellerListingReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerListingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSellerListingReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSellerListingReports`.
message ListSellerListingReportsResponse {
  repeated SellerListing seller_listings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareSellerListingReport`.
message ShareSellerListingReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  ShareSellerListingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSellerListingReport`.
message ShareSellerListingReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerListing seller_listing = 1;
  ShareSellerListingReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSellerListingTotals`.
message CountSellerListingTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerListingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSellerListingTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSellerListingTotals`.
message CountSellerListingTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteSellerListingReport`.
message DeleteSellerListingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSellerListingReport`.
message DeleteSellerListingReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
