syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerPayoutScheduleCalculationServiceProto";
option java_package = "com.acme.sellers.v1";

// Computes the figures of a seller payout schedule, such as totals, taxes, and estimates.
service SellerPayoutScheduleCalculationService {
  // Calculates a seller payout schedule.
  rpc CalculateSellerPayoutSchedule(CalculateSellerPayoutScheduleRequest) returns (CalculateSellerPayoutScheduleResponse);

  // Estimates a seller payout schedule.
  rpc EstimateSellerPayoutSchedule(EstimateSellerPayoutScheduleRequest) returns (EstimateSellerPayoutScheduleResponse);

  // Quotes a seller payout schedule.
  rpc QuoteSellerPayoutSchedule(QuoteSellerPayoutScheduleRequest) returns (QuoteSellerPayoutScheduleResponse);

  // Compares a seller payout schedule.
  rpc CompareSellerPayoutScheduleOptions(CompareSellerPayoutScheduleOptionsRequest) returns (CompareSellerPayoutScheduleOptionsResponse);

  // Recalculates a seller payout schedule.
  rpc RecalculateSellerPayoutSchedules(RecalculateSellerPayoutSchedulesRequest) returns (RecalculateSellerPayoutSchedulesResponse);

  // Simulates a seller payout schedule.
  rpc SimulateSellerPayoutSchedule(SimulateSellerPayoutScheduleRequest) returns (SimulateSellerPayoutScheduleResponse);

  // Explains a seller payout schedule.
  rpc ExplainSellerPayoutScheduleCalculation(ExplainSellerPayoutScheduleCalculationRequest) returns (ExplainSellerPayoutScheduleCalculationResponse);

  // Returns a seller payout schedule.
  rpc GetSellerPayoutScheduleRates(GetSellerPayoutScheduleRatesRequest) returns (GetSellerPayoutScheduleRatesResponse);
}

// The request of `CalculateSellerPayoutSchedule`.
message CalculateSellerPayoutScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  SellerPayoutSchedule seller_payout_schedule = 3;
  CalculateSellerPayoutScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSellerPayoutSchedule`.
message CalculateSellerPayoutScheduleResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSellerPayoutScheduleResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SellerPayoutSchedule seller_payout_schedule = 1;
  CalculateSellerPayoutScheduleResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

