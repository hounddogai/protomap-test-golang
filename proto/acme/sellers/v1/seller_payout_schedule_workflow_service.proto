option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerPayoutScheduleWorkflowServiceProto";
option java_package = "com.acme.sellers.v1";

// Runs the long-lived workflow that takes a seller payout schedule from start to finish.
service SellerPayoutScheduleWorkflowService {
  // Starts a seller payout schedule.
  rpc StartSellerPayoutScheduleWorkflow(StartSellerPayoutScheduleWorkflowRequest) returns (StartSellerPayoutScheduleWorkflowResponse);

  // Advances a seller payout schedule.
  rpc AdvanceSellerPayoutScheduleWorkflow(AdvanceSellerPayoutScheduleWorkflowRequest) returns (AdvanceSellerPayoutScheduleWorkflowResponse);

  // Cancels a seller payout schedule.
  rpc CancelSellerPayoutScheduleWorkflow(CancelSellerPayoutScheduleWorkflowRequest) returns (CancelSellerPayoutScheduleWorkflowResponse);

  // Retrys a seller payout schedule.
  rpc RetrySellerPayoutScheduleWorkflow(RetrySellerPayoutScheduleWorkflowRequest) returns (RetrySellerPayoutScheduleWorkflowResponse);

  // Pauses a seller payout schedule.
  rpc PauseSellerPayoutScheduleWorkflow(PauseSellerPayoutScheduleWorkflowRequest) returns (PauseSellerPayoutScheduleWorkflowResponse);

  // Resumes a seller payout schedule.
  rpc ResumeSellerPayoutScheduleWorkflow(ResumeSellerPayoutScheduleWorkflowRequest) returns (ResumeSellerPayoutScheduleWorkflowResponse);

  // Returns a seller payout schedule.
  rpc InspectSellerPayoutScheduleWorkflow(InspectSellerPayoutScheduleWorkflowRequest) returns (InspectSellerPayoutScheduleWorkflowResponse);

  // Lists seller payout schedules a page at a time.
  rpc ListSellerPayoutScheduleWorkflows(ListSellerPayoutScheduleWorkflowsRequest) returns (ListSellerPayoutScheduleWorkflowsResponse);

  // Signals a seller payout schedule.
  rpc SignalSellerPayoutScheduleWorkflow(SignalSellerPayoutScheduleWorkflowRequest) returns (SignalSellerPayoutScheduleWorkflowResponse);
}

// The request of `StartSellerPayoutScheduleWorkflow`.
message StartSellerPayoutScheduleWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  SellerPayoutSchedule seller_payout_schedule = 3;
  StartSellerPayoutScheduleWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSellerPayoutScheduleWorkflow`.
message StartSellerPayoutScheduleWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerPayoutSchedule seller_payout_schedule = 1;
  StartSellerPayoutScheduleWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

