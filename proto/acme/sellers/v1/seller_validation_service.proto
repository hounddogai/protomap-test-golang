syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerValidationServiceProto";
option java_package = "com.acme.sellers.v1";

// Checks sellers against the rules before anything acts on them.
service SellerValidationService {
  // Validates a seller.
  rpc ValidateSeller(ValidateSellerRequest) returns (ValidateSellerResponse);

  // Previews a seller.
  rpc PreviewSeller(PreviewSellerRequest) returns (PreviewSellerResponse);

  // Checks a seller.
  rpc CheckSellerEligibility(CheckSellerEligibilityRequest) returns (CheckSellerEligibilityResponse);

  // Normalizes a seller.
  rpc NormalizeSeller(NormalizeSellerRequest) returns (NormalizeSellerResponse);

  // Explains a seller.
  rpc ExplainSellerDecision(ExplainSellerDecisionRequest) returns (ExplainSellerDecisionResponse);

  // Scores a seller.
  rpc ScoreSeller(ScoreSellerRequest) returns (ScoreSellerResponse);

  // Lints a seller.
  rpc LintSellers(LintSellersRequest) returns (LintSellersResponse);

  // Returns a seller.
  rpc GetSellerRules(GetSellerRulesRequest) returns (GetSellerRulesResponse);
}

// The request of `ValidateSeller`.
message ValidateSellerRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_id = 2;
  Seller seller = 3;
  ValidateSellerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSeller`.
message ValidateSellerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Seller seller = 1;
  ValidateSellerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

