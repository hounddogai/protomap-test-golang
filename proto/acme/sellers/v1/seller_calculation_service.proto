    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_id = 2;
  Seller seller = 3;
  ExplainSellerCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainSellerCalculation`.
message ExplainSellerCalculationResponse {
