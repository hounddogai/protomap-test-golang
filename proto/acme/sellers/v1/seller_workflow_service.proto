syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerWorkflowServiceProto";
option java_package = "com.acme.sellers.v1";

// Runs the long-lived workflow that takes a seller from start to finish.
service SellerWorkflowService {
  // Starts a seller.
  rpc StartSellerWorkflow(StartSellerWorkflowRequest) returns (StartSellerWorkflowResponse);

  // Advances a seller.
  rpc AdvanceSellerWorkflow(AdvanceSellerWorkflowRequest) returns (AdvanceSellerWorkflowResponse);

  // Cancels a seller.
  rpc CancelSellerWorkflow(CancelSellerWorkflowRequest) returns (CancelSellerWorkflowResponse);

  // Retrys a seller.
  rpc RetrySellerWorkflow(RetrySellerWorkflowRequest) returns (RetrySellerWorkflowResponse);

  // Pauses a seller.
  rpc PauseSellerWorkflow(PauseSellerWorkflowRequest) returns (PauseSellerWorkflowResponse);

  // Resumes a seller.
  rpc ResumeSellerWorkflow(ResumeSellerWorkflowRequest) returns (ResumeSellerWorkflowResponse);

  // Returns a seller.
  rpc InspectSellerWorkflow(InspectSellerWorkflowRequest) returns (InspectSellerWorkflowResponse);

  // Lists sellers a page at a time.
  rpc ListSellerWorkflows(ListSellerWorkflowsRequest) returns (ListSellerWorkflowsResponse);

  // Signals a seller.
  rpc SignalSellerWorkflow(SignalSellerWorkflowRequest) returns (SignalSellerWorkflowResponse);
}

// The request of `StartSellerWorkflow`.
message StartSellerWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_id = 2;
  Seller seller = 3;
  StartSellerWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSellerWorkflow`.
message StartSellerWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Seller seller = 1;
  StartSellerWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

