option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerPayoutScheduleLifecycleServiceProto";
option java_package = "com.acme.sellers.v1";

// Moves a seller payout schedule between the states of its lifecycle.
service SellerPayoutScheduleLifecycleService {
  // Activates a seller payout schedule.
  rpc ActivateSellerPayoutSchedule(ActivateSellerPayoutScheduleRequest) returns (ActivateSellerPayoutScheduleResponse);

  // Suspends a seller payout schedule.
  rpc SuspendSellerPayoutSchedule(SuspendSellerPayoutScheduleRequest) returns (SuspendSellerPayoutScheduleResponse);

  // Terminates a seller payout schedule.
  rpc TerminateSellerPayoutSchedule(TerminateSellerPayoutScheduleRequest) returns (TerminateSellerPayoutScheduleResponse);

  // Renews a seller payout schedule.
  rpc RenewSellerPayoutSchedule(RenewSellerPayoutScheduleRequest) returns (RenewSellerPayoutScheduleResponse);

  // Expires a seller payout schedule.
  rpc ExpireSellerPayoutSchedule(ExpireSellerPayoutScheduleRequest) returns (ExpireSellerPayoutScheduleResponse);

  // Returns a seller payout schedule.
  rpc GetSellerPayoutScheduleLifecycle(GetSellerPayoutScheduleLifecycleRequest) returns (GetSellerPayoutScheduleLifecycleResponse);

  // Schedules a seller payout schedule.
  rpc ScheduleSellerPayoutScheduleExpiry(ScheduleSellerPayoutScheduleExpiryRequest) returns (ScheduleSellerPayoutScheduleExpiryResponse);
}

// The request of `ActivateSellerPayoutSchedule`.
message ActivateSellerPayoutScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  ActivateSellerPayoutScheduleRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSellerPayoutSchedule`.
message ActivateSellerPayoutScheduleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerPayoutSchedule seller_payout_schedule = 1;
  ActivateSellerPayoutScheduleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

