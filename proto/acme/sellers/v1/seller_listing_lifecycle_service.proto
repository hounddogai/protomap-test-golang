option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerListingLifecycleServiceProto";
option java_package = "com.acme.sellers.v1";

// Moves a seller listing between the states of its lifecycle.
service SellerListingLifecycleService {
  // Activates a seller listing.
  rpc ActivateSellerListing(ActivateSellerListingRequest) returns (ActivateSellerListingResponse);

  // Suspends a seller listing.
  rpc SuspendSellerListing(SuspendSellerListingRequest) returns (SuspendSellerListingResponse);

  // Reinstates a seller listing.
  rpc ReinstateSellerListing(ReinstateSellerListingRequest) returns (ReinstateSellerListingResponse);

  // Terminates a seller listing.
  rpc TerminateSellerListing(TerminateSellerListingRequest) returns (TerminateSellerListingResponse);

  // Renews a seller listing.
  rpc RenewSellerListing(RenewSellerListingRequest) returns (RenewSellerListingResponse);

  // Expires a seller listing.
  rpc ExpireSellerListing(ExpireSellerListingRequest) returns (ExpireSellerListingResponse);

  // Returns a seller listing.
  rpc GetSellerListingLifecycle(GetSellerListingLifecycleRequest) returns (GetSellerListingLifecycleResponse);

  // Schedules a seller listing.
  rpc ScheduleSellerListingExpiry(ScheduleSellerListingExpiryRequest) returns (ScheduleSellerListingExpiryResponse);
}

// The request of `ActivateSellerListing`.
message ActivateSellerListingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  ActivateSellerListingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSellerListing`.
message ActivateSellerListingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerListing seller_listing = 1;
  ActivateSellerListingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

