syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerScorecardReportingServiceProto";
option java_package = "com.acme.sellers.v1";

// Builds and schedules reports about seller scorecards.
service SellerScorecardReportingService {
  // Generates a seller scorecard.
  rpc GenerateSellerScorecardReport(GenerateSellerScorecardReportRequest) returns (GenerateSellerScorecardReportResponse);

  // Returns a seller scorecard.
  rpc FetchSellerScorecardReport(FetchSellerScorecardReportRequest) returns (FetchSellerScorecardReportResponse);

  // Schedules a seller scorecard.
  rpc ScheduleSellerScorecardReport(ScheduleSellerScorecardReportRequest) returns (ScheduleSellerScorecardReportResponse);

  // Streams the changes of seller scorecards as they happen.
  rpc StreamSellerScorecardMetrics(StreamSellerScorecardMetricsRequest) returns (stream StreamSellerScorecardMetricsResponse);

  // Lists seller scorecards a page at a time.
  rpc ListSellerScorecardReports(ListSellerScorecardReportsRequest) returns (ListSellerScorecardReportsResponse);

  // Shares a seller scorecard.
  rpc ShareSellerScorecardReport(ShareSellerScorecardReportRequest) returns (ShareSellerScorecardReportResponse);

  // Counts seller scorecards by status.
  rpc CountSellerScorecardTotals(CountSellerScorecardTotalsRequest) returns (CountSellerScorecardTotalsResponse);

  // Deletes a seller scorecard.
  rpc DeleteSellerScorecardReport(DeleteSellerScorecardReportRequest) returns (DeleteSellerScorecardReportResponse);
}

// The request of `GenerateSellerScorecardReport`.
message GenerateSellerScorecardReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  GenerateSellerScorecardReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateSellerScorecardReport`.
message GenerateSellerScorecardReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchSellerScorecardReport`.
message FetchSellerScorecardReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchSellerScorecardReport`.
message FetchSellerScorecardReportResponse {
  SellerScorecard seller_scorecard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleSellerScorecardReport`.
message ScheduleSellerScorecardReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  ScheduleSellerScorecardReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSellerScorecardReport`.
message ScheduleSellerScorecardReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamSellerScorecardMetrics`.
message StreamSellerScorecardMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerScorecardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSellerScorecardMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSellerScorecardMetrics`.
message StreamSellerScorecardMetricsResponse {
  SellerScorecard seller_scorecard = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListSellerScorecardReports`.
message ListSellerScorecardReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerScorecardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSellerScorecardReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSellerScorecardReports`.
message ListSellerScorecardReportsResponse {
  repeated SellerScorecard seller_scorecards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareSellerScorecardReport`.
message ShareSellerScorecardReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  ShareSellerScorecardReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSellerScorecardReport`.
message ShareSellerScorecardReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerScorecard seller_scorecard = 1;
  ShareSellerScorecardReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSellerScorecardTotals`.
message CountSellerScorecardTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerScorecardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSellerScorecardTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSellerScorecardTotals`.
message CountSellerScorecardTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteSellerScorecardReport`.
message DeleteSellerScorecardReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSellerScorecardReport`.
message DeleteSellerScorecardReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
