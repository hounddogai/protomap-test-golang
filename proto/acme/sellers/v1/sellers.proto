syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellersProto";
option java_package = "com.acme.sellers.v1";

// Where a seller is in its lifecycle.
enum SellerStatus {
  SELLER_STATUS_UNSPECIFIED = 0;
  SELLER_STATUS_PROSPECT = 1;
  SELLER_STATUS_ACTIVE = 2;
  SELLER_STATUS_SUSPENDED = 3;
  SELLER_STATUS_CLOSED = 4;
}

// Where a seller listing is in its lifecycle.
enum SellerListingStatus {
  SELLER_LISTING_STATUS_UNSPECIFIED = 0;
  SELLER_LISTING_STATUS_PLANNED = 1;
  SELLER_LISTING_STATUS_AVAILABLE = 2;
  SELLER_LISTING_STATUS_RESERVED = 3;
  SELLER_LISTING_STATUS_RETIRED = 4;
}

// Where a seller payout schedule is in its lifecycle.
enum SellerPayoutScheduleStatus {
  SELLER_PAYOUT_SCHEDULE_STATUS_UNSPECIFIED = 0;
  SELLER_PAYOUT_SCHEDULE_STATUS_TENTATIVE = 1;
  SELLER_PAYOUT_SCHEDULE_STATUS_CONFIRMED = 2;
  SELLER_PAYOUT_SCHEDULE_STATUS_CANCELLED = 3;
  SELLER_PAYOUT_SCHEDULE_STATUS_COMPLETED = 4;
}

// Where a seller scorecard is in its lifecycle.
enum SellerScorecardStatus {
  SELLER_SCORECARD_STATUS_UNSPECIFIED = 0;
  SELLER_SCORECARD_STATUS_DRAFT = 1;
  SELLER_SCORECARD_STATUS_ISSUED = 2;
  SELLER_SCORECARD_STATUS_APPROVED = 3;
  SELLER_SCORECARD_STATUS_PAID = 4;
  SELLER_SCORECARD_STATUS_VOID = 5;
}

// The preferences of a seller.
message SellerPreferences {
  string language = 1;
  bool marketing_opt_in = 2;
  repeated string channels = 3;
  acme.common.v1.TimeWindow quiet_hours = 4;
}

// The passport of a seller.
message SellerPassport {
  string number = 1;
  string issuing_country = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// The national id of a seller.
message SellerNationalId {
  string number = 1;
  string issuing_country = 2;
}

// A seller of the sellers domain.
message Seller {
  string seller_id = 1;
  acme.common.v1.PersonName name = 2;
  acme.common.v1.ContactInfo contact = 3;
  acme.common.v1.PostalAddress primary_address = 4;
  SellerStatus status = 5;
  repeated string segments = 6;
  map<string, string> attributes = 7;
  SellerPreferences preferences = 8;
  oneof identity_document {
    SellerPassport passport = 9;
    SellerNationalId national_id = 10;
    string tax_number = 11;
  }
  acme.identity.v1.UserRef relationship_manager = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The dimensions of a seller listing.
message SellerListingDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a seller listing.
message SellerListingComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A seller listing of the sellers domain.
message SellerListing {
  string seller_listing_id = 1;
  string code = 2;
  string name = 3;
  SellerListingStatus status = 4;
  repeated string category_path = 5;
  SellerListingDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, SellerListingComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The participant of a seller payout schedule.
message SellerPayoutScheduleParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a seller payout schedule.
message SellerPayoutScheduleDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a seller payout schedule.
message SellerPayoutScheduleWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A seller payout schedule of the sellers domain.
message SellerPayoutSchedule {
  string seller_payout_schedule_id = 1;
  string title = 2;
  SellerPayoutScheduleStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated SellerPayoutScheduleParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    SellerPayoutScheduleDailyRule daily = 7;
    SellerPayoutScheduleWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a seller scorecard.
message SellerScorecardLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  SellerScorecardLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a seller scorecard line.
message SellerScorecardLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a seller scorecard.
message SellerScorecardCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a seller scorecard.
message SellerScorecardBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a seller scorecard.
message SellerScorecardAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A seller scorecard of the sellers domain.
message SellerScorecard {
  string seller_scorecard_id = 1;
  string number = 2;
  SellerScorecardStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated SellerScorecardLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    SellerScorecardCardSettlement card = 8;
    SellerScorecardBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated SellerScorecardAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
