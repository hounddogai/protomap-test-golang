syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerLifecycleServiceProto";
option java_package = "com.acme.sellers.v1";

// Moves a seller between the states of its lifecycle.
service SellerLifecycleService {
  // Activates a seller.
  rpc ActivateSeller(ActivateSellerRequest) returns (ActivateSellerResponse);

  // Suspends a seller.
  rpc SuspendSeller(SuspendSellerRequest) returns (SuspendSellerResponse);

  // Reinstates a seller.
  rpc ReinstateSeller(ReinstateSellerRequest) returns (ReinstateSellerResponse);

  // Terminates a seller.
  rpc TerminateSeller(TerminateSellerRequest) returns (TerminateSellerResponse);

  // Renews a seller.
  rpc RenewSeller(RenewSellerRequest) returns (RenewSellerResponse);

  // Expires a seller.
  rpc ExpireSeller(ExpireSellerRequest) returns (ExpireSellerResponse);

  // Returns a seller.
  rpc GetSellerLifecycle(GetSellerLifecycleRequest) returns (GetSellerLifecycleResponse);

  // Schedules a seller.
  rpc ScheduleSellerExpiry(ScheduleSellerExpiryRequest) returns (ScheduleSellerExpiryResponse);
}

// The request of `ActivateSeller`.
message ActivateSellerRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_id = 2;
  ActivateSellerRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSeller`.
message ActivateSellerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Seller seller = 1;
  ActivateSellerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

