syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerPayoutScheduleReportingServiceProto";
option java_package = "com.acme.sellers.v1";

// Builds and schedules reports about seller payout schedules.
service SellerPayoutScheduleReportingService {
  // Generates a seller payout schedule.
  rpc GenerateSellerPayoutScheduleReport(GenerateSellerPayoutScheduleReportRequest) returns (GenerateSellerPayoutScheduleReportResponse);

  // Returns a seller payout schedule.
  rpc FetchSellerPayoutScheduleReport(FetchSellerPayoutScheduleReportRequest) returns (FetchSellerPayoutScheduleReportResponse);

  // Schedules a seller payout schedule.
  rpc ScheduleSellerPayoutScheduleReport(ScheduleSellerPayoutScheduleReportRequest) returns (ScheduleSellerPayoutScheduleReportResponse);

  // Streams the changes of seller payout schedules as they happen.
  rpc StreamSellerPayoutScheduleMetrics(StreamSellerPayoutScheduleMetricsRequest) returns (stream StreamSellerPayoutScheduleMetricsResponse);

  // Shares a seller payout schedule.
  rpc ShareSellerPayoutScheduleReport(ShareSellerPayoutScheduleReportRequest) returns (ShareSellerPayoutScheduleReportResponse);

  // Counts seller payout schedules by status.
  rpc CountSellerPayoutScheduleTotals(CountSellerPayoutScheduleTotalsRequest) returns (CountSellerPayoutScheduleTotalsResponse);

  // Deletes a seller payout schedule.
  rpc DeleteSellerPayoutScheduleReport(DeleteSellerPayoutScheduleReportRequest) returns (DeleteSellerPayoutScheduleReportResponse);
}

// The request of `GenerateSellerPayoutScheduleReport`.
message GenerateSellerPayoutScheduleReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  GenerateSellerPayoutScheduleReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateSellerPayoutScheduleReport`.
message GenerateSellerPayoutScheduleReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchSellerPayoutScheduleReport`.
message FetchSellerPayoutScheduleReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchSellerPayoutScheduleReport`.
message FetchSellerPayoutScheduleReportResponse {
  SellerPayoutSchedule seller_payout_schedule = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleSellerPayoutScheduleReport`.
message ScheduleSellerPayoutScheduleReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  ScheduleSellerPayoutScheduleReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSellerPayoutScheduleReport`.
message ScheduleSellerPayoutScheduleReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamSellerPayoutScheduleMetrics`.
message StreamSellerPayoutScheduleMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerPayoutScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSellerPayoutScheduleMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSellerPayoutScheduleMetrics`.
message StreamSellerPayoutScheduleMetricsResponse {
  SellerPayoutSchedule seller_payout_schedule = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareSellerPayoutScheduleReport`.
message ShareSellerPayoutScheduleReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  ShareSellerPayoutScheduleReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSellerPayoutScheduleReport`.
message ShareSellerPayoutScheduleReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerPayoutSchedule seller_payout_schedule = 1;
  ShareSellerPayoutScheduleReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSellerPayoutScheduleTotals`.
message CountSellerPayoutScheduleTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerPayoutScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSellerPayoutScheduleTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSellerPayoutScheduleTotals`.
message CountSellerPayoutScheduleTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteSellerPayoutScheduleReport`.
message DeleteSellerPayoutScheduleReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSellerPayoutScheduleReport`.
message DeleteSellerPayoutScheduleReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
