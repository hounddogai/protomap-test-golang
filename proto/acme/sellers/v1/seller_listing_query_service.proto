syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerListingQueryServiceProto";
option java_package = "com.acme.sellers.v1";

// Answers read-only questions about seller listings, for screens and reports.
service SellerListingQueryService {
  // Returns a seller listing.
  rpc LookupSellerListing(LookupSellerListingRequest) returns (LookupSellerListingResponse);

  // Lists seller listings a page at a time.
  rpc BrowseSellerListings(BrowseSellerListingsRequest) returns (BrowseSellerListingsResponse);

  // Lists seller listings a page at a time.
  rpc FindSellerListings(FindSellerListingsRequest) returns (FindSellerListingsResponse);

  // Returns several seller listings at once.
  rpc ResolveSellerListings(ResolveSellerListingsRequest) returns (ResolveSellerListingsResponse);

  // Streams every matching seller listing.
  rpc ExportSellerListings(ExportSellerListingsRequest) returns (stream ExportSellerListingsResponse);

  // Summarizes a seller listing.
  rpc SummarizeSellerListings(SummarizeSellerListingsRequest) returns (SummarizeSellerListingsResponse);

  // Returns a seller listing.
  rpc PeekSellerListing(PeekSellerListingRequest) returns (PeekSellerListingResponse);
}

// The request of `LookupSellerListing`.
message LookupSellerListingRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSellerListing`.
message LookupSellerListingResponse {
  SellerListing seller_listing = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSellerListings`.
message BrowseSellerListingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerListingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSellerListingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSellerListings`.
message BrowseSellerListingsResponse {
  repeated SellerListing seller_listings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSellerListings`.
message FindSellerListingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerListingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSellerListingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSellerListings`.
message FindSellerListingsResponse {
  repeated SellerListing seller_listings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSellerListings`.
message ResolveSellerListingsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string seller_listing_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSellerListings`.
message ResolveSellerListingsResponse {
  repeated SellerListing seller_listings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSellerListings`.
message ExportSellerListingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SellerListingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSellerListingsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSellerListings`.
message ExportSellerListingsResponse {
  SellerListing seller_listing = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSellerListings`.
message SummarizeSellerListingsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  SummarizeSellerListingsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSellerListings`.
message SummarizeSellerListingsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekSellerListing`.
message PeekSellerListingRequest {
  acme.common.v1.RequestContext context = 1;
  string seller_listing_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSellerListing`.
message PeekSellerListingResponse {
  SellerListing seller_listing = 1;
  acme.common.v1.OperationResult result = 2;
}
