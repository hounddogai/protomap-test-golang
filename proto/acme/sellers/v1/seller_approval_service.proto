syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerApprovalServiceProto";
option java_package = "com.acme.sellers.v1";

// Routes sellers through approval, with escalation and delegation.
service SellerApprovalService {
  // Submits a seller.
  rpc SubmitSeller(SubmitSellerRequest) returns (SubmitSellerResponse);

  // Approves a seller.
  rpc ApproveSeller(ApproveSellerRequest) returns (ApproveSellerResponse);

  // Escalates a seller.
  rpc EscalateSeller(EscalateSellerRequest) returns (EscalateSellerResponse);

  // Lists sellers a page at a time.
  rpc ListPendingSellers(ListPendingSellersRequest) returns (ListPendingSellersResponse);

  // Delegates a seller.
  rpc DelegateSellerApproval(DelegateSellerApprovalRequest) returns (DelegateSellerApprovalResponse);

  // Recalls a seller.
  rpc RecallSeller(RecallSellerRequest) returns (RecallSellerResponse);

  // Returns a seller.
  rpc GetSellerApprovalStatus(GetSellerApprovalStatusRequest) returns (GetSellerApprovalStatusResponse);

  // Comments a seller.
  rpc CommentSellerApproval(CommentSellerApprovalRequest) returns (CommentSellerApprovalResponse);
}

// The request of `SubmitSeller`.
message SubmitSellerRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_id = 2;
  Seller seller = 3;
  SubmitSellerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSeller`.
message SubmitSellerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Seller seller = 1;
  SubmitSellerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

