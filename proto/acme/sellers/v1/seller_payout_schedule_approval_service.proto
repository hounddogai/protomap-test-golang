syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerPayoutScheduleApprovalServiceProto";
option java_package = "com.acme.sellers.v1";

// Routes seller payout schedules through approval, with escalation and delegation.
service SellerPayoutScheduleApprovalService {
  // Submits a seller payout schedule.
  rpc SubmitSellerPayoutSchedule(SubmitSellerPayoutScheduleRequest) returns (SubmitSellerPayoutScheduleResponse);

  // Approves a seller payout schedule.
  rpc ApproveSellerPayoutSchedule(ApproveSellerPayoutScheduleRequest) returns (ApproveSellerPayoutScheduleResponse);

  // Escalates a seller payout schedule.
  rpc EscalateSellerPayoutSchedule(EscalateSellerPayoutScheduleRequest) returns (EscalateSellerPayoutScheduleResponse);

  // Lists seller payout schedules a page at a time.
  rpc ListPendingSellerPayoutSchedules(ListPendingSellerPayoutSchedulesRequest) returns (ListPendingSellerPayoutSchedulesResponse);

  // Delegates a seller payout schedule.
  rpc DelegateSellerPayoutScheduleApproval(DelegateSellerPayoutScheduleApprovalRequest) returns (DelegateSellerPayoutScheduleApprovalResponse);

  // Recalls a seller payout schedule.
  rpc RecallSellerPayoutSchedule(RecallSellerPayoutScheduleRequest) returns (RecallSellerPayoutScheduleResponse);

  // Returns a seller payout schedule.
  rpc GetSellerPayoutScheduleApprovalStatus(GetSellerPayoutScheduleApprovalStatusRequest) returns (GetSellerPayoutScheduleApprovalStatusResponse);

  // Comments a seller payout schedule.
  rpc CommentSellerPayoutScheduleApproval(CommentSellerPayoutScheduleApprovalRequest) returns (CommentSellerPayoutScheduleApprovalResponse);
}

// The request of `SubmitSellerPayoutSchedule`.
message SubmitSellerPayoutScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_payout_schedule_id = 2;
  SellerPayoutSchedule seller_payout_schedule = 3;
  SubmitSellerPayoutScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSellerPayoutSchedule`.
message SubmitSellerPayoutScheduleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerPayoutSchedule seller_payout_schedule = 1;
  SubmitSellerPayoutScheduleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

