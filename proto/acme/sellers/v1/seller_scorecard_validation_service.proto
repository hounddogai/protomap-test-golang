syntax = "proto3";

package acme.sellers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/sellers/v1/sellers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerScorecardValidationServiceProto";
option java_package = "com.acme.sellers.v1";

// Checks seller scorecards against the rules before anything acts on them.
service SellerScorecardValidationService {
  // Validates a seller scorecard.
  rpc ValidateSellerScorecard(ValidateSellerScorecardRequest) returns (ValidateSellerScorecardResponse);

  // Previews a seller scorecard.
  rpc PreviewSellerScorecard(PreviewSellerScorecardRequest) returns (PreviewSellerScorecardResponse);

  // Normalizes a seller scorecard.
  rpc NormalizeSellerScorecard(NormalizeSellerScorecardRequest) returns (NormalizeSellerScorecardResponse);

  // Explains a seller scorecard.
  rpc ExplainSellerScorecardDecision(ExplainSellerScorecardDecisionRequest) returns (ExplainSellerScorecardDecisionResponse);

  // Scores a seller scorecard.
  rpc ScoreSellerScorecard(ScoreSellerScorecardRequest) returns (ScoreSellerScorecardResponse);

  // Lints a seller scorecard.
  rpc LintSellerScorecards(LintSellerScorecardsRequest) returns (LintSellerScorecardsResponse);

  // Returns a seller scorecard.
  rpc GetSellerScorecardRules(GetSellerScorecardRulesRequest) returns (GetSellerScorecardRulesResponse);
}

// The request of `ValidateSellerScorecard`.
message ValidateSellerScorecardRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  SellerScorecard seller_scorecard = 3;
  ValidateSellerScorecardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSellerScorecard`.
message ValidateSellerScorecardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerScorecard seller_scorecard = 1;
  ValidateSellerScorecardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

