option csharp_namespace = "Acme.Sellers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sellers/v1;sellersv1";
option java_multiple_files = true;
option java_outer_classname = "SellerScorecardLifecycleServiceProto";
option java_package = "com.acme.sellers.v1";

// Moves a seller scorecard between the states of its lifecycle.
service SellerScorecardLifecycleService {
  // Activates a seller scorecard.
  rpc ActivateSellerScorecard(ActivateSellerScorecardRequest) returns (ActivateSellerScorecardResponse);

  // Suspends a seller scorecard.
  rpc SuspendSellerScorecard(SuspendSellerScorecardRequest) returns (SuspendSellerScorecardResponse);

  // Reinstates a seller scorecard.
  rpc ReinstateSellerScorecard(ReinstateSellerScorecardRequest) returns (ReinstateSellerScorecardResponse);

  // Terminates a seller scorecard.
  rpc TerminateSellerScorecard(TerminateSellerScorecardRequest) returns (TerminateSellerScorecardResponse);

  // Renews a seller scorecard.
  rpc RenewSellerScorecard(RenewSellerScorecardRequest) returns (RenewSellerScorecardResponse);

  // Expires a seller scorecard.
  rpc ExpireSellerScorecard(ExpireSellerScorecardRequest) returns (ExpireSellerScorecardResponse);

  // Returns a seller scorecard.
  rpc GetSellerScorecardLifecycle(GetSellerScorecardLifecycleRequest) returns (GetSellerScorecardLifecycleResponse);

  // Schedules a seller scorecard.
  rpc ScheduleSellerScorecardExpiry(ScheduleSellerScorecardExpiryRequest) returns (ScheduleSellerScorecardExpiryResponse);
}

// The request of `ActivateSellerScorecard`.
message ActivateSellerScorecardRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seller_scorecard_id = 2;
  ActivateSellerScorecardRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSellerScorecard`.
message ActivateSellerScorecardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SellerScorecard seller_scorecard = 1;
  ActivateSellerScorecardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

