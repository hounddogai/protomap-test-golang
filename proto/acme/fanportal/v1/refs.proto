syntax = "proto3";

package acme.fanportal.v1;

option csharp_namespace = "Acme.Fanportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fanportal/v1;fanportalv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.fanportal.v1";

// A reference to a fan session of the fanportal domain.
message FanSessionRef {
  string fan_session_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to an event page of the fanportal domain.
message EventPageRef {
  string event_page_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a wishlist of the fanportal domain.
message WishlistRef {
  string wishlist_id = 1;
  string display_name = 2;
  string number = 3;
}
