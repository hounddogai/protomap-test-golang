syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "BuildingCalculationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Computes the figures of a building, such as totals, taxes, and estimates.
service BuildingCalculationService {
  // Calculates a building.
  rpc CalculateBuilding(CalculateBuildingRequest) returns (CalculateBuildingResponse);

  // Estimates a building.
  rpc EstimateBuilding(EstimateBuildingRequest) returns (EstimateBuildingResponse);

  // Quotes a building.
  rpc QuoteBuilding(QuoteBuildingRequest) returns (QuoteBuildingResponse);

  // Compares a building.
  rpc CompareBuildingOptions(CompareBuildingOptionsRequest) returns (CompareBuildingOptionsResponse);

  // Recalculates a building.
  rpc RecalculateBuildings(RecalculateBuildingsRequest) returns (RecalculateBuildingsResponse);

  // Simulates a building.
  rpc SimulateBuilding(SimulateBuildingRequest) returns (SimulateBuildingResponse);

  // Returns a building.
  rpc GetBuildingRates(GetBuildingRatesRequest) returns (GetBuildingRatesResponse);
}

// The request of `CalculateBuilding`.
message CalculateBuildingRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  CalculateBuildingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateBuilding`.
message CalculateBuildingResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateBuildingResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Building building = 1;
  CalculateBuildingResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

