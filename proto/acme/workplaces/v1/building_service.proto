syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "BuildingServiceProto";
option java_package = "com.acme.workplaces.v1";

// Manages buildings: creates, reads, changes, and lists them.
service BuildingService {
  // Creates a building.
  rpc CreateBuilding(CreateBuildingRequest) returns (CreateBuildingResponse);

  // Returns a building.
  rpc GetBuilding(GetBuildingRequest) returns (GetBuildingResponse);

  // Changes a building.
  rpc UpdateBuilding(UpdateBuildingRequest) returns (UpdateBuildingResponse);

  // Deletes a building.
  rpc DeleteBuilding(DeleteBuildingRequest) returns (DeleteBuildingResponse);

  // Lists buildings a page at a time.
  rpc ListBuildings(ListBuildingsRequest) returns (ListBuildingsResponse);

  // Returns several buildings at once.
  rpc BatchGetBuildings(BatchGetBuildingsRequest) returns (BatchGetBuildingsResponse);

  // Lists buildings a page at a time.
  rpc SearchBuildings(SearchBuildingsRequest) returns (SearchBuildingsResponse);

  // Streams the changes of buildings as they happen.
  rpc WatchBuildings(WatchBuildingsRequest) returns (stream WatchBuildingsResponse);

  // Takes a stream of buildings and answers once at the end.
  rpc BatchCreateBuildings(stream BatchCreateBuildingsRequest) returns (BatchCreateBuildingsResponse);

  // Creates a building.
  rpc CloneBuilding(CloneBuildingRequest) returns (CloneBuildingResponse);
}

// The request of `CreateBuilding`.
message CreateBuildingRequest {
  acme.common.v1.RequestContext context = 1;
  Building building = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateBuilding`.
message CreateBuildingResponse {
  Building building = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetBuilding`.
message GetBuildingRequest {
  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetBuilding`.
message GetBuildingResponse {
  Building building = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateBuilding`.
message UpdateBuildingRequest {
  acme.common.v1.RequestContext context = 1;
  Building building = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateBuilding`.
message UpdateBuildingResponse {
  Building building = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteBuilding`.
message DeleteBuildingRequest {
  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteBuilding`.
message DeleteBuildingResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListBuildings`.
message ListBuildingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BuildingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListBuildingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListBuildings`.
message ListBuildingsResponse {
  repeated Building buildings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetBuildings`.
message BatchGetBuildingsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string building_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetBuildings`.
message BatchGetBuildingsResponse {
  repeated Building buildings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchBuildings`.
message SearchBuildingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BuildingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchBuildingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchBuildings`.
message SearchBuildingsResponse {
  repeated Building buildings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchBuildings`.
message WatchBuildingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BuildingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchBuildingsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchBuildings`.
message WatchBuildingsResponse {
  Building building = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateBuildings`.
message BatchCreateBuildingsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateBuildingsRequest.StreamHeader header = 2;
    Building record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateBuildings`.
message BatchCreateBuildingsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string building_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateBuildingsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneBuilding`.
message CloneBuildingRequest {
  acme.common.v1.RequestContext context = 1;
  Building building = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneBuilding`.
message CloneBuildingResponse {
  Building building = 1;
  acme.common.v1.OperationResult result = 2;
}
