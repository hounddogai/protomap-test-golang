syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PolicyQueryServiceProto";
option java_package = "com.acme.insurance.v1";

// Answers read-only questions about policies, for screens and reports.
service PolicyQueryService {
  // Returns a policy.
  rpc LookupPolicy(LookupPolicyRequest) returns (LookupPolicyResponse);

  // Lists policies a page at a time.
  rpc BrowsePolicies(BrowsePoliciesRequest) returns (BrowsePoliciesResponse);

  // Lists policies a page at a time.
  rpc FindPolicies(FindPoliciesRequest) returns (FindPoliciesResponse);

  // Counts policies by status.
  rpc CountPolicies(CountPoliciesRequest) returns (CountPoliciesResponse);

  // Returns several policies at once.
  rpc ResolvePolicies(ResolvePoliciesRequest) returns (ResolvePoliciesResponse);

  // Streams every matching policy.
  rpc ExportPolicies(ExportPoliciesRequest) returns (stream ExportPoliciesResponse);

  // Summarizes a policy.
  rpc SummarizePolicies(SummarizePoliciesRequest) returns (SummarizePoliciesResponse);

  // Lists policies a page at a time.
  rpc SuggestPolicies(SuggestPoliciesRequest) returns (SuggestPoliciesResponse);

  // Returns a policy.
  rpc PeekPolicy(PeekPolicyRequest) returns (PeekPolicyResponse);
}

// The request of `LookupPolicy`.
message LookupPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPolicy`.
message LookupPolicyResponse {
  Policy policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePolicies`.
message BrowsePoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePolicies`.
message BrowsePoliciesResponse {
  repeated Policy policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPolicies`.
message FindPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPolicies`.
message FindPoliciesResponse {
  repeated Policy policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPolicies`.
message CountPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPolicies`.
message CountPoliciesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePolicies`.
message ResolvePoliciesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string policy_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePolicies`.
message ResolvePoliciesResponse {
  repeated Policy policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPolicies`.
message ExportPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPoliciesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPolicies`.
message ExportPoliciesResponse {
  Policy policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePolicies`.
message SummarizePoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string policy_id = 2;
  SummarizePoliciesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePolicies`.
message SummarizePoliciesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPolicies`.
message SuggestPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPolicies`.
message SuggestPoliciesResponse {
  repeated Policy policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPolicy`.
message PeekPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPolicy`.
message PeekPolicyResponse {
  Policy policy = 1;
  acme.common.v1.OperationResult result = 2;
}
