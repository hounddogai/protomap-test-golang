syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PolicyCalculationServiceProto";
option java_package = "com.acme.insurance.v1";

// Computes the figures of a policy, such as totals, taxes, and estimates.
service PolicyCalculationService {
  // Calculates a policy.
  rpc CalculatePolicy(CalculatePolicyRequest) returns (CalculatePolicyResponse);

  // Estimates a policy.
  rpc EstimatePolicy(EstimatePolicyRequest) returns (EstimatePolicyResponse);

  // Quotes a policy.
  rpc QuotePolicy(QuotePolicyRequest) returns (QuotePolicyResponse);

  // Compares a policy.
  rpc ComparePolicyOptions(ComparePolicyOptionsRequest) returns (ComparePolicyOptionsResponse);

  // Recalculates a policy.
  rpc RecalculatePolicies(RecalculatePoliciesRequest) returns (RecalculatePoliciesResponse);

  // Simulates a policy.
  rpc SimulatePolicy(SimulatePolicyRequest) returns (SimulatePolicyResponse);

  // Explains a policy.
  rpc ExplainPolicyCalculation(ExplainPolicyCalculationRequest) returns (ExplainPolicyCalculationResponse);

  // Returns a policy.
  rpc GetPolicyRates(GetPolicyRatesRequest) returns (GetPolicyRatesResponse);
}

// The request of `CalculatePolicy`.
message CalculatePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string policy_id = 2;
  Policy policy = 3;
  CalculatePolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePolicy`.
message CalculatePolicyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePolicyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Policy policy = 1;
  CalculatePolicyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

