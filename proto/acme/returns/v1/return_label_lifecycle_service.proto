syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnLabelLifecycleServiceProto";
option java_package = "com.acme.returns.v1";

// Moves a return label between the states of its lifecycle.
service ReturnLabelLifecycleService {
  // Activates a return label.
  rpc ActivateReturnLabel(ActivateReturnLabelRequest) returns (ActivateReturnLabelResponse);

  // Suspends a return label.
  rpc SuspendReturnLabel(SuspendReturnLabelRequest) returns (SuspendReturnLabelResponse);

  // Terminates a return label.
  rpc TerminateReturnLabel(TerminateReturnLabelRequest) returns (TerminateReturnLabelResponse);

  // Renews a return label.
  rpc RenewReturnLabel(RenewReturnLabelRequest) returns (RenewReturnLabelResponse);

  // Expires a return label.
  rpc ExpireReturnLabel(ExpireReturnLabelRequest) returns (ExpireReturnLabelResponse);

  // Returns a return label.
  rpc GetReturnLabelLifecycle(GetReturnLabelLifecycleRequest) returns (GetReturnLabelLifecycleResponse);
}

// The request of `ActivateReturnLabel`.
message ActivateReturnLabelRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  ActivateReturnLabelRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateReturnLabel`.
message ActivateReturnLabelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReturnLabel return_label = 1;
  ActivateReturnLabelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

