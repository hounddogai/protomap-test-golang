syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "RestockDecisionReportingServiceProto";
option java_package = "com.acme.returns.v1";

// Builds and schedules reports about restock decisions.
service RestockDecisionReportingService {
  // Generates a restock decision.
  rpc GenerateRestockDecisionReport(GenerateRestockDecisionReportRequest) returns (GenerateRestockDecisionReportResponse);

  // Returns a restock decision.
  rpc FetchRestockDecisionReport(FetchRestockDecisionReportRequest) returns (FetchRestockDecisionReportResponse);

  // Streams the changes of restock decisions as they happen.
  rpc StreamRestockDecisionMetrics(StreamRestockDecisionMetricsRequest) returns (stream StreamRestockDecisionMetricsResponse);

  // Lists restock decisions a page at a time.
  rpc ListRestockDecisionReports(ListRestockDecisionReportsRequest) returns (ListRestockDecisionReportsResponse);

  // Shares a restock decision.
  rpc ShareRestockDecisionReport(ShareRestockDecisionReportRequest) returns (ShareRestockDecisionReportResponse);

  // Deletes a restock decision.
  rpc DeleteRestockDecisionReport(DeleteRestockDecisionReportRequest) returns (DeleteRestockDecisionReportResponse);
}

// The request of `GenerateRestockDecisionReport`.
message GenerateRestockDecisionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string restock_decision_id = 2;
  GenerateRestockDecisionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRestockDecisionReport`.
message GenerateRestockDecisionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRestockDecisionReport`.
message FetchRestockDecisionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string restock_decision_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRestockDecisionReport`.
message FetchRestockDecisionReportResponse {
  RestockDecision restock_decision = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamRestockDecisionMetrics`.
message StreamRestockDecisionMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RestockDecisionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRestockDecisionMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRestockDecisionMetrics`.
message StreamRestockDecisionMetricsResponse {
  RestockDecision restock_decision = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRestockDecisionReports`.
message ListRestockDecisionReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RestockDecisionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRestockDecisionReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRestockDecisionReports`.
message ListRestockDecisionReportsResponse {
  repeated RestockDecision restock_decisions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRestockDecisionReport`.
message ShareRestockDecisionReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string restock_decision_id = 2;
  ShareRestockDecisionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRestockDecisionReport`.
message ShareRestockDecisionReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RestockDecision restock_decision = 1;
  ShareRestockDecisionReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteRestockDecisionReport`.
message DeleteRestockDecisionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string restock_decision_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRestockDecisionReport`.
message DeleteRestockDecisionReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
