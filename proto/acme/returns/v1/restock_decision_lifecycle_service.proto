syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "RestockDecisionLifecycleServiceProto";
option java_package = "com.acme.returns.v1";

// Moves a restock decision between the states of its lifecycle.
service RestockDecisionLifecycleService {
  // Activates a restock decision.
  rpc ActivateRestockDecision(ActivateRestockDecisionRequest) returns (ActivateRestockDecisionResponse);

  // Suspends a restock decision.
  rpc SuspendRestockDecision(SuspendRestockDecisionRequest) returns (SuspendRestockDecisionResponse);

  // Terminates a restock decision.
  rpc TerminateRestockDecision(TerminateRestockDecisionRequest) returns (TerminateRestockDecisionResponse);

  // Renews a restock decision.
  rpc RenewRestockDecision(RenewRestockDecisionRequest) returns (RenewRestockDecisionResponse);

  // Returns a restock decision.
  rpc GetRestockDecisionLifecycle(GetRestockDecisionLifecycleRequest) returns (GetRestockDecisionLifecycleResponse);

  // Schedules a restock decision.
  rpc ScheduleRestockDecisionExpiry(ScheduleRestockDecisionExpiryRequest) returns (ScheduleRestockDecisionExpiryResponse);
}

// The request of `ActivateRestockDecision`.
message ActivateRestockDecisionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string restock_decision_id = 2;
  ActivateRestockDecisionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRestockDecision`.
message ActivateRestockDecisionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RestockDecision restock_decision = 1;
  ActivateRestockDecisionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

