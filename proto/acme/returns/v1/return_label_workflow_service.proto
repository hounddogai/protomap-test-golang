syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnLabelWorkflowServiceProto";
option java_package = "com.acme.returns.v1";

// Runs the long-lived workflow that takes a return label from start to finish.
service ReturnLabelWorkflowService {
  // Starts a return label.
  rpc StartReturnLabelWorkflow(StartReturnLabelWorkflowRequest) returns (StartReturnLabelWorkflowResponse);

  // Advances a return label.
  rpc AdvanceReturnLabelWorkflow(AdvanceReturnLabelWorkflowRequest) returns (AdvanceReturnLabelWorkflowResponse);

  // Cancels a return label.
  rpc CancelReturnLabelWorkflow(CancelReturnLabelWorkflowRequest) returns (CancelReturnLabelWorkflowResponse);

  // Pauses a return label.
  rpc PauseReturnLabelWorkflow(PauseReturnLabelWorkflowRequest) returns (PauseReturnLabelWorkflowResponse);

  // Returns a return label.
  rpc InspectReturnLabelWorkflow(InspectReturnLabelWorkflowRequest) returns (InspectReturnLabelWorkflowResponse);

  // Lists return labels a page at a time.
  rpc ListReturnLabelWorkflows(ListReturnLabelWorkflowsRequest) returns (ListReturnLabelWorkflowsResponse);

  // Signals a return label.
  rpc SignalReturnLabelWorkflow(SignalReturnLabelWorkflowRequest) returns (SignalReturnLabelWorkflowResponse);
}

// The request of `StartReturnLabelWorkflow`.
message StartReturnLabelWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  ReturnLabel return_label = 3;
  StartReturnLabelWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartReturnLabelWorkflow`.
message StartReturnLabelWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReturnLabel return_label = 1;
  StartReturnLabelWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

