syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnLabelCalculationServiceProto";
option java_package = "com.acme.returns.v1";

// Computes the figures of a return label, such as totals, taxes, and estimates.
service ReturnLabelCalculationService {
  // Calculates a return label.
  rpc CalculateReturnLabel(CalculateReturnLabelRequest) returns (CalculateReturnLabelResponse);

  // Estimates a return label.
  rpc EstimateReturnLabel(EstimateReturnLabelRequest) returns (EstimateReturnLabelResponse);

  // Quotes a return label.
  rpc QuoteReturnLabel(QuoteReturnLabelRequest) returns (QuoteReturnLabelResponse);

  // Compares a return label.
  rpc CompareReturnLabelOptions(CompareReturnLabelOptionsRequest) returns (CompareReturnLabelOptionsResponse);

  // Recalculates a return label.
  rpc RecalculateReturnLabels(RecalculateReturnLabelsRequest) returns (RecalculateReturnLabelsResponse);

  // Simulates a return label.
  rpc SimulateReturnLabel(SimulateReturnLabelRequest) returns (SimulateReturnLabelResponse);

  // Explains a return label.
  rpc ExplainReturnLabelCalculation(ExplainReturnLabelCalculationRequest) returns (ExplainReturnLabelCalculationResponse);

  // Returns a return label.
  rpc GetReturnLabelRates(GetReturnLabelRatesRequest) returns (GetReturnLabelRatesResponse);
}

// The request of `CalculateReturnLabel`.
message CalculateReturnLabelRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  ReturnLabel return_label = 3;
  CalculateReturnLabelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReturnLabel`.
message CalculateReturnLabelResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReturnLabelResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReturnLabel return_label = 1;
  CalculateReturnLabelResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

