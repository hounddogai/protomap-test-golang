syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "InspectionApprovalServiceProto";
option java_package = "com.acme.returns.v1";

// Routes inspections through approval, with escalation and delegation.
service InspectionApprovalService {
  // Submits an inspection.
  rpc SubmitInspection(SubmitInspectionRequest) returns (SubmitInspectionResponse);

  // Approves an inspection.
  rpc ApproveInspection(ApproveInspectionRequest) returns (ApproveInspectionResponse);

  // Escalates an inspection.
  rpc EscalateInspection(EscalateInspectionRequest) returns (EscalateInspectionResponse);

  // Lists inspections a page at a time.
  rpc ListPendingInspections(ListPendingInspectionsRequest) returns (ListPendingInspectionsResponse);

  // Delegates an inspection.
  rpc DelegateInspectionApproval(DelegateInspectionApprovalRequest) returns (DelegateInspectionApprovalResponse);

  // Recalls an inspection.
  rpc RecallInspection(RecallInspectionRequest) returns (RecallInspectionResponse);

  // Returns an inspection.
  rpc GetInspectionApprovalStatus(GetInspectionApprovalStatusRequest) returns (GetInspectionApprovalStatusResponse);

  // Comments an inspection.
  rpc CommentInspectionApproval(CommentInspectionApprovalRequest) returns (CommentInspectionApprovalResponse);
}

// The request of `SubmitInspection`.
message SubmitInspectionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  SubmitInspectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitInspection`.
message SubmitInspectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Inspection inspection = 1;
  SubmitInspectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

