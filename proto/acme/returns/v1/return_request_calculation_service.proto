syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnRequestCalculationServiceProto";
option java_package = "com.acme.returns.v1";

// Computes the figures of a return request, such as totals, taxes, and estimates.
service ReturnRequestCalculationService {
  // Calculates a return request.
  rpc CalculateReturnRequest(CalculateReturnRequestRequest) returns (CalculateReturnRequestResponse);

  // Estimates a return request.
  rpc EstimateReturnRequest(EstimateReturnRequestRequest) returns (EstimateReturnRequestResponse);

  // Quotes a return request.
  rpc QuoteReturnRequest(QuoteReturnRequestRequest) returns (QuoteReturnRequestResponse);

  // Compares a return request.
  rpc CompareReturnRequestOptions(CompareReturnRequestOptionsRequest) returns (CompareReturnRequestOptionsResponse);

  // Recalculates a return request.
  rpc RecalculateReturnRequests(RecalculateReturnRequestsRequest) returns (RecalculateReturnRequestsResponse);

  // Simulates a return request.
  rpc SimulateReturnRequest(SimulateReturnRequestRequest) returns (SimulateReturnRequestResponse);

  // Explains a return request.
  rpc ExplainReturnRequestCalculation(ExplainReturnRequestCalculationRequest) returns (ExplainReturnRequestCalculationResponse);

  // Returns a return request.
  rpc GetReturnRequestRates(GetReturnRequestRatesRequest) returns (GetReturnRequestRatesResponse);
}

// The request of `CalculateReturnRequest`.
message CalculateReturnRequestRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  ReturnRequest return_request = 3;
  CalculateReturnRequestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReturnRequest`.
message CalculateReturnRequestResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReturnRequestResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReturnRequest return_request = 1;
  CalculateReturnRequestResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

