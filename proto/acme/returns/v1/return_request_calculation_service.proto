  }

  ReturnRequest return_request = 1;
  ExplainReturnRequestCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetReturnRequestRates`.
message GetReturnRequestRatesRequest {
