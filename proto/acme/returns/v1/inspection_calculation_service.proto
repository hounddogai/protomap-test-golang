message ExplainInspectionCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Inspection inspection = 1;
  ExplainInspectionCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetInspectionRates`.
message GetInspectionRatesRequest {
  acme.common.v1.RequestContext context = 1;
