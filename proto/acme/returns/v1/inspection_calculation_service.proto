syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "InspectionCalculationServiceProto";
option java_package = "com.acme.returns.v1";

// Computes the figures of an inspection, such as totals, taxes, and estimates.
service InspectionCalculationService {
  // Calculates an inspection.
  rpc CalculateInspection(CalculateInspectionRequest) returns (CalculateInspectionResponse);

  // Estimates an inspection.
  rpc EstimateInspection(EstimateInspectionRequest) returns (EstimateInspectionResponse);

  // Compares an inspection.
  rpc CompareInspectionOptions(CompareInspectionOptionsRequest) returns (CompareInspectionOptionsResponse);

  // Simulates an inspection.
  rpc SimulateInspection(SimulateInspectionRequest) returns (SimulateInspectionResponse);

  // Explains an inspection.
  rpc ExplainInspectionCalculation(ExplainInspectionCalculationRequest) returns (ExplainInspectionCalculationResponse);

  // Returns an inspection.
  rpc GetInspectionRates(GetInspectionRatesRequest) returns (GetInspectionRatesResponse);
}

// The request of `CalculateInspection`.
message CalculateInspectionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  CalculateInspectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateInspection`.
message CalculateInspectionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateInspectionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Inspection inspection = 1;
  CalculateInspectionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

