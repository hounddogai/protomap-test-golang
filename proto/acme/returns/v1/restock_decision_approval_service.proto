syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "RestockDecisionApprovalServiceProto";
option java_package = "com.acme.returns.v1";

// Routes restock decisions through approval, with escalation and delegation.
service RestockDecisionApprovalService {
  // Submits a restock decision.
  rpc SubmitRestockDecision(SubmitRestockDecisionRequest) returns (SubmitRestockDecisionResponse);

  // Approves a restock decision.
  rpc ApproveRestockDecision(ApproveRestockDecisionRequest) returns (ApproveRestockDecisionResponse);

  // Lists restock decisions a page at a time.
  rpc ListPendingRestockDecisions(ListPendingRestockDecisionsRequest) returns (ListPendingRestockDecisionsResponse);

  // Delegates a restock decision.
  rpc DelegateRestockDecisionApproval(DelegateRestockDecisionApprovalRequest) returns (DelegateRestockDecisionApprovalResponse);

  // Recalls a restock decision.
  rpc RecallRestockDecision(RecallRestockDecisionRequest) returns (RecallRestockDecisionResponse);

  // Returns a restock decision.
  rpc GetRestockDecisionApprovalStatus(GetRestockDecisionApprovalStatusRequest) returns (GetRestockDecisionApprovalStatusResponse);

  // Comments a restock decision.
  rpc CommentRestockDecisionApproval(CommentRestockDecisionApprovalRequest) returns (CommentRestockDecisionApprovalResponse);
}

// The request of `SubmitRestockDecision`.
message SubmitRestockDecisionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string restock_decision_id = 2;
  RestockDecision restock_decision = 3;
  SubmitRestockDecisionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRestockDecision`.
message SubmitRestockDecisionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RestockDecision restock_decision = 1;
  SubmitRestockDecisionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveRestockDecision`.
message ApproveRestockDecisionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
