syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnRequestApprovalServiceProto";
option java_package = "com.acme.returns.v1";

// Routes return requests through approval, with escalation and delegation.
service ReturnRequestApprovalService {
  // Submits a return request.
  rpc SubmitReturnRequest(SubmitReturnRequestRequest) returns (SubmitReturnRequestResponse);

  // Approves a return request.
  rpc ApproveReturnRequest(ApproveReturnRequestRequest) returns (ApproveReturnRequestResponse);

  // Rejects a return request.
  rpc RejectReturnRequest(RejectReturnRequestRequest) returns (RejectReturnRequestResponse);

  // Escalates a return request.
  rpc EscalateReturnRequest(EscalateReturnRequestRequest) returns (EscalateReturnRequestResponse);

  // Lists return requests a page at a time.
  rpc ListPendingReturnRequests(ListPendingReturnRequestsRequest) returns (ListPendingReturnRequestsResponse);

  // Delegates a return request.
  rpc DelegateReturnRequestApproval(DelegateReturnRequestApprovalRequest) returns (DelegateReturnRequestApprovalResponse);

  // Recalls a return request.
  rpc RecallReturnRequest(RecallReturnRequestRequest) returns (RecallReturnRequestResponse);

  // Returns a return request.
  rpc GetReturnRequestApprovalStatus(GetReturnRequestApprovalStatusRequest) returns (GetReturnRequestApprovalStatusResponse);

  // Comments a return request.
  rpc CommentReturnRequestApproval(CommentReturnRequestApprovalRequest) returns (CommentReturnRequestApprovalResponse);
}

// The request of `SubmitReturnRequest`.
message SubmitReturnRequestRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  ReturnRequest return_request = 3;
  SubmitReturnRequestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitReturnRequest`.
message SubmitReturnRequestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReturnRequest return_request = 1;
  SubmitReturnRequestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

