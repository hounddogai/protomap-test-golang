syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnRequestValidationServiceProto";
option java_package = "com.acme.returns.v1";

// Checks return requests against the rules before anything acts on them.
service ReturnRequestValidationService {
  // Validates a return request.
  rpc ValidateReturnRequest(ValidateReturnRequestRequest) returns (ValidateReturnRequestResponse);

  // Previews a return request.
  rpc PreviewReturnRequest(PreviewReturnRequestRequest) returns (PreviewReturnRequestResponse);

  // Checks a return request.
  rpc CheckReturnRequestEligibility(CheckReturnRequestEligibilityRequest) returns (CheckReturnRequestEligibilityResponse);

  // Normalizes a return request.
  rpc NormalizeReturnRequest(NormalizeReturnRequestRequest) returns (NormalizeReturnRequestResponse);

  // Explains a return request.
  rpc ExplainReturnRequestDecision(ExplainReturnRequestDecisionRequest) returns (ExplainReturnRequestDecisionResponse);

  // Scores a return request.
  rpc ScoreReturnRequest(ScoreReturnRequestRequest) returns (ScoreReturnRequestResponse);

  // Returns a return request.
  rpc GetReturnRequestRules(GetReturnRequestRulesRequest) returns (GetReturnRequestRulesResponse);
}

// The request of `ValidateReturnRequest`.
message ValidateReturnRequestRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  ReturnRequest return_request = 3;
  ValidateReturnRequestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateReturnRequest`.
message ValidateReturnRequestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReturnRequest return_request = 1;
  ValidateReturnRequestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

