// The request of `ScoreReturnRequest`.
message ScoreReturnRequestRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  ReturnRequest return_request = 3;
  ScoreReturnRequestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreReturnRequest`.
message ScoreReturnRequestResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreReturnRequestResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReturnRequest return_request = 1;
  ScoreReturnRequestResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetReturnRequestRules`.
message GetReturnRequestRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetReturnRequestRules`.
message GetReturnRequestRulesResponse {
  ReturnRequest return_request = 1;
  acme.common.v1.OperationResult result = 2;
}
