syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnRequestQueryServiceProto";
option java_package = "com.acme.returns.v1";

// Answers read-only questions about return requests, for screens and reports.
service ReturnRequestQueryService {
  // Returns a return request.
  rpc LookupReturnRequest(LookupReturnRequestRequest) returns (LookupReturnRequestResponse);

  // Lists return requests a page at a time.
  rpc BrowseReturnRequests(BrowseReturnRequestsRequest) returns (BrowseReturnRequestsResponse);

  // Lists return requests a page at a time.
  rpc FindReturnRequests(FindReturnRequestsRequest) returns (FindReturnRequestsResponse);

  // Returns several return requests at once.
  rpc ResolveReturnRequests(ResolveReturnRequestsRequest) returns (ResolveReturnRequestsResponse);

  // Streams every matching return request.
  rpc ExportReturnRequests(ExportReturnRequestsRequest) returns (stream ExportReturnRequestsResponse);

  // Summarizes a return request.
  rpc SummarizeReturnRequests(SummarizeReturnRequestsRequest) returns (SummarizeReturnRequestsResponse);

  // Lists return requests a page at a time.
  rpc SuggestReturnRequests(SuggestReturnRequestsRequest) returns (SuggestReturnRequestsResponse);

  // Returns a return request.
  rpc PeekReturnRequest(PeekReturnRequestRequest) returns (PeekReturnRequestResponse);
}

// The request of `LookupReturnRequest`.
message LookupReturnRequestRequest {
  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupReturnRequest`.
message LookupReturnRequestResponse {
  ReturnRequest return_request = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseReturnRequests`.
message BrowseReturnRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseReturnRequestsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseReturnRequests`.
message BrowseReturnRequestsResponse {
  repeated ReturnRequest return_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindReturnRequests`.
message FindReturnRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindReturnRequestsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindReturnRequests`.
message FindReturnRequestsResponse {
  repeated ReturnRequest return_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveReturnRequests`.
message ResolveReturnRequestsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string return_request_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveReturnRequests`.
message ResolveReturnRequestsResponse {
  repeated ReturnRequest return_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportReturnRequests`.
message ExportReturnRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportReturnRequestsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportReturnRequests`.
message ExportReturnRequestsResponse {
  ReturnRequest return_request = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeReturnRequests`.
message SummarizeReturnRequestsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  SummarizeReturnRequestsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeReturnRequests`.
message SummarizeReturnRequestsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestReturnRequests`.
message SuggestReturnRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestReturnRequestsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestReturnRequests`.
message SuggestReturnRequestsResponse {
  repeated ReturnRequest return_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekReturnRequest`.
message PeekReturnRequestRequest {
  acme.common.v1.RequestContext context = 1;
  string return_request_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekReturnRequest`.
message PeekReturnRequestResponse {
  ReturnRequest return_request = 1;
  acme.common.v1.OperationResult result = 2;
}
