syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnLabelValidationServiceProto";
option java_package = "com.acme.returns.v1";

// Checks return labels against the rules before anything acts on them.
service ReturnLabelValidationService {
  // Validates a return label.
  rpc ValidateReturnLabel(ValidateReturnLabelRequest) returns (ValidateReturnLabelResponse);

  // Previews a return label.
  rpc PreviewReturnLabel(PreviewReturnLabelRequest) returns (PreviewReturnLabelResponse);

  // Normalizes a return label.
  rpc NormalizeReturnLabel(NormalizeReturnLabelRequest) returns (NormalizeReturnLabelResponse);

  // Explains a return label.
  rpc ExplainReturnLabelDecision(ExplainReturnLabelDecisionRequest) returns (ExplainReturnLabelDecisionResponse);

  // Scores a return label.
  rpc ScoreReturnLabel(ScoreReturnLabelRequest) returns (ScoreReturnLabelResponse);

  // Lints a return label.
  rpc LintReturnLabels(LintReturnLabelsRequest) returns (LintReturnLabelsResponse);

  // Returns a return label.
  rpc GetReturnLabelRules(GetReturnLabelRulesRequest) returns (GetReturnLabelRulesResponse);
}

// The request of `ValidateReturnLabel`.
message ValidateReturnLabelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  ReturnLabel return_label = 3;
  ValidateReturnLabelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateReturnLabel`.
message ValidateReturnLabelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReturnLabel return_label = 1;
  ValidateReturnLabelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

