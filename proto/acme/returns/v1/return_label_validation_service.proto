// The request of `GetReturnLabelRules`.
message GetReturnLabelRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetReturnLabelRules`.
message GetReturnLabelRulesResponse {
  ReturnLabel return_label = 1;
  acme.common.v1.OperationResult result = 2;
}
