syntax = "proto3";

package acme.returns.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/returns/v1/returns.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Returns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/returns/v1;returnsv1";
option java_multiple_files = true;
option java_outer_classname = "ReturnLabelQueryServiceProto";
option java_package = "com.acme.returns.v1";

// Answers read-only questions about return labels, for screens and reports.
service ReturnLabelQueryService {
  // Returns a return label.
  rpc LookupReturnLabel(LookupReturnLabelRequest) returns (LookupReturnLabelResponse);

  // Lists return labels a page at a time.
  rpc BrowseReturnLabels(BrowseReturnLabelsRequest) returns (BrowseReturnLabelsResponse);

  // Lists return labels a page at a time.
  rpc FindReturnLabels(FindReturnLabelsRequest) returns (FindReturnLabelsResponse);

  // Counts return labels by status.
  rpc CountReturnLabels(CountReturnLabelsRequest) returns (CountReturnLabelsResponse);

  // Streams every matching return label.
  rpc ExportReturnLabels(ExportReturnLabelsRequest) returns (stream ExportReturnLabelsResponse);

  // Summarizes a return label.
  rpc SummarizeReturnLabels(SummarizeReturnLabelsRequest) returns (SummarizeReturnLabelsResponse);

  // Lists return labels a page at a time.
  rpc SuggestReturnLabels(SuggestReturnLabelsRequest) returns (SuggestReturnLabelsResponse);

  // Returns a return label.
  rpc PeekReturnLabel(PeekReturnLabelRequest) returns (PeekReturnLabelResponse);
}

// The request of `LookupReturnLabel`.
message LookupReturnLabelRequest {
  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupReturnLabel`.
message LookupReturnLabelResponse {
  ReturnLabel return_label = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseReturnLabels`.
message BrowseReturnLabelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnLabelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseReturnLabelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseReturnLabels`.
message BrowseReturnLabelsResponse {
  repeated ReturnLabel return_labels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindReturnLabels`.
message FindReturnLabelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnLabelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindReturnLabelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindReturnLabels`.
message FindReturnLabelsResponse {
  repeated ReturnLabel return_labels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountReturnLabels`.
message CountReturnLabelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnLabelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountReturnLabelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountReturnLabels`.
message CountReturnLabelsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportReturnLabels`.
message ExportReturnLabelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnLabelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportReturnLabelsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportReturnLabels`.
message ExportReturnLabelsResponse {
  ReturnLabel return_label = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeReturnLabels`.
message SummarizeReturnLabelsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  SummarizeReturnLabelsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeReturnLabels`.
message SummarizeReturnLabelsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestReturnLabels`.
message SuggestReturnLabelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReturnLabelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestReturnLabelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestReturnLabels`.
message SuggestReturnLabelsResponse {
  repeated ReturnLabel return_labels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekReturnLabel`.
message PeekReturnLabelRequest {
  acme.common.v1.RequestContext context = 1;
  string return_label_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekReturnLabel`.
message PeekReturnLabelResponse {
  ReturnLabel return_label = 1;
  acme.common.v1.OperationResult result = 2;
}
