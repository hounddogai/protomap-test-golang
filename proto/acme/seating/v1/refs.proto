syntax = "proto3";

package acme.seating.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.seating.v1";

// A reference to a seat map of the seating domain.
message SeatMapRef {
  string seat_map_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a seat hold of the seating domain.
message SeatHoldRef {
  string seat_hold_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a seat assignment of the seating domain.
message SeatAssignmentRef {
  string seat_assignment_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
