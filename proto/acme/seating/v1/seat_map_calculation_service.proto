  }

  SeatMap seat_map = 1;
  ExplainSeatMapCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetSeatMapRates`.
message GetSeatMapRatesRequest {
