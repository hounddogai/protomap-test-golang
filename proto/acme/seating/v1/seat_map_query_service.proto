syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatMapQueryServiceProto";
option java_package = "com.acme.seating.v1";

// Answers read-only questions about seat maps, for screens and reports.
service SeatMapQueryService {
  // Returns a seat map.
  rpc LookupSeatMap(LookupSeatMapRequest) returns (LookupSeatMapResponse);

  // Lists seat maps a page at a time.
  rpc BrowseSeatMaps(BrowseSeatMapsRequest) returns (BrowseSeatMapsResponse);

  // Lists seat maps a page at a time.
  rpc FindSeatMaps(FindSeatMapsRequest) returns (FindSeatMapsResponse);

  // Counts seat maps by status.
  rpc CountSeatMaps(CountSeatMapsRequest) returns (CountSeatMapsResponse);

  // Returns several seat maps at once.
  rpc ResolveSeatMaps(ResolveSeatMapsRequest) returns (ResolveSeatMapsResponse);

  // Streams every matching seat map.
  rpc ExportSeatMaps(ExportSeatMapsRequest) returns (stream ExportSeatMapsResponse);

  // Summarizes a seat map.
  rpc SummarizeSeatMaps(SummarizeSeatMapsRequest) returns (SummarizeSeatMapsResponse);

  // Lists seat maps a page at a time.
  rpc SuggestSeatMaps(SuggestSeatMapsRequest) returns (SuggestSeatMapsResponse);

  // Returns a seat map.
  rpc PeekSeatMap(PeekSeatMapRequest) returns (PeekSeatMapResponse);
}

// The request of `LookupSeatMap`.
message LookupSeatMapRequest {
  acme.common.v1.RequestContext context = 1;
  string seat_map_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSeatMap`.
message LookupSeatMapResponse {
  SeatMap seat_map = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSeatMaps`.
message BrowseSeatMapsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatMapStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSeatMapsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSeatMaps`.
message BrowseSeatMapsResponse {
  repeated SeatMap seat_maps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSeatMaps`.
message FindSeatMapsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatMapStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSeatMapsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSeatMaps`.
message FindSeatMapsResponse {
  repeated SeatMap seat_maps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSeatMaps`.
message CountSeatMapsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatMapStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSeatMapsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSeatMaps`.
message CountSeatMapsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSeatMaps`.
message ResolveSeatMapsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string seat_map_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSeatMaps`.
message ResolveSeatMapsResponse {
  repeated SeatMap seat_maps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSeatMaps`.
message ExportSeatMapsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatMapStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSeatMapsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSeatMaps`.
message ExportSeatMapsResponse {
  SeatMap seat_map = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSeatMaps`.
message SummarizeSeatMapsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_map_id = 2;
  SummarizeSeatMapsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSeatMaps`.
message SummarizeSeatMapsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSeatMaps`.
message SuggestSeatMapsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatMapStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSeatMapsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSeatMaps`.
message SuggestSeatMapsResponse {
  repeated SeatMap seat_maps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSeatMap`.
message PeekSeatMapRequest {
  acme.common.v1.RequestContext context = 1;
  string seat_map_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSeatMap`.
message PeekSeatMapResponse {
  SeatMap seat_map = 1;
  acme.common.v1.OperationResult result = 2;
}
