syntax = "proto3";

package acme.ticketing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/ticketing/v1/refs.proto";
import "acme/venues/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "TicketingProto";
option java_package = "com.acme.ticketing.v1";

// Where a ticket is in its lifecycle.
enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_STATUS_DRAFT = 1;
  TICKET_STATUS_ISSUED = 2;
  TICKET_STATUS_APPROVED = 3;
  TICKET_STATUS_PAID = 4;
  TICKET_STATUS_VOID = 5;
}

// Where a ticket tier is in its lifecycle.
enum TicketTierStatus {
  TICKET_TIER_STATUS_UNSPECIFIED = 0;
  TICKET_TIER_STATUS_DRAFT = 1;
  TICKET_TIER_STATUS_ENABLED = 2;
  TICKET_TIER_STATUS_DISABLED = 3;
  TICKET_TIER_STATUS_RETIRED = 4;
}

// Where a ticket transfer is in its lifecycle.
enum TicketTransferStatus {
  TICKET_TRANSFER_STATUS_UNSPECIFIED = 0;
  TICKET_TRANSFER_STATUS_NEW = 1;
  TICKET_TRANSFER_STATUS_OPEN = 2;
  TICKET_TRANSFER_STATUS_WAITING = 3;
  TICKET_TRANSFER_STATUS_RESOLVED = 4;
  TICKET_TRANSFER_STATUS_CLOSED = 5;
}

// The line of a ticket.
message TicketLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  TicketLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a ticket line.
message TicketLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a ticket.
message TicketCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a ticket.
message TicketBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a ticket.
message TicketAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A ticket of the ticketing domain.
message Ticket {
  string ticket_id = 1;
  string number = 2;
  TicketStatus status = 3;
  acme.venues.v1.VenueRef counterparty = 4;
  repeated TicketLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    TicketCardSettlement card = 8;
    TicketBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated TicketAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The condition of a ticket tier.
message TicketTierCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a ticket tier.
message TicketTierDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a ticket tier.
message TicketTierRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a ticket tier.
message TicketTierBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A ticket tier of the ticketing domain.
message TicketTier {
  string ticket_tier_id = 1;
  string name = 2;
  string description = 3;
  TicketTierStatus status = 4;
  int32 priority = 5;
  repeated TicketTierCondition conditions = 6;
  oneof action {
    TicketTierDiscountAction discount = 7;
    TicketTierRouteAction route = 8;
    TicketTierBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The comment of a ticket transfer.
message TicketTransferComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a ticket transfer.
message TicketTransferSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a ticket transfer.
message TicketTransferChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a ticket transfer.
message TicketTransferStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A ticket transfer of the ticketing domain.
message TicketTransfer {
  string ticket_transfer_id = 1;
  string subject = 2;
  TicketTransferStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated TicketTransferComment comments = 7;
  TicketTransferSla sla = 8;
  oneof origin {
    TicketTierRef customer = 9;
    string external_reference = 10;
    TicketTransferChannelOrigin channel = 11;
  }
  repeated TicketTransferStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
