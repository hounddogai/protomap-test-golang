syntax = "proto3";

package acme.ticketing.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ticketing/v1/ticketing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "TicketServiceProto";
option java_package = "com.acme.ticketing.v1";

// Manages tickets: creates, reads, changes, and lists them.
service TicketService {
  // Creates a ticket.
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);

  // Returns a ticket.
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);

  // Changes a ticket.
  rpc UpdateTicket(UpdateTicketRequest) returns (UpdateTicketResponse);

  // Deletes a ticket.
  rpc DeleteTicket(DeleteTicketRequest) returns (DeleteTicketResponse);

  // Lists tickets a page at a time.
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);

  // Returns several tickets at once.
  rpc BatchGetTickets(BatchGetTicketsRequest) returns (BatchGetTicketsResponse);

  // Lists tickets a page at a time.
  rpc SearchTickets(SearchTicketsRequest) returns (SearchTicketsResponse);

  // Streams the changes of tickets as they happen.
  rpc WatchTickets(WatchTicketsRequest) returns (stream WatchTicketsResponse);

  // Takes a stream of tickets and answers once at the end.
  rpc BatchCreateTickets(stream BatchCreateTicketsRequest) returns (BatchCreateTicketsResponse);

  // Creates a ticket.
  rpc CloneTicket(CloneTicketRequest) returns (CloneTicketResponse);
}

// The request of `CreateTicket`.
message CreateTicketRequest {
  acme.common.v1.RequestContext context = 1;
  Ticket ticket = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateTicket`.
message CreateTicketResponse {
  Ticket ticket = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetTicket`.
message GetTicketRequest {
  acme.common.v1.RequestContext context = 1;
  string ticket_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTicket`.
message GetTicketResponse {
  Ticket ticket = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateTicket`.
message UpdateTicketRequest {
  acme.common.v1.RequestContext context = 1;
  Ticket ticket = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateTicket`.
message UpdateTicketResponse {
  Ticket ticket = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteTicket`.
message DeleteTicketRequest {
  acme.common.v1.RequestContext context = 1;
  string ticket_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTicket`.
message DeleteTicketResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListTickets`.
message ListTicketsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTicketsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTickets`.
message ListTicketsResponse {
  repeated Ticket tickets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetTickets`.
message BatchGetTicketsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string ticket_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetTickets`.
message BatchGetTicketsResponse {
  repeated Ticket tickets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchTickets`.
message SearchTicketsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchTicketsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchTickets`.
message SearchTicketsResponse {
  repeated Ticket tickets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchTickets`.
message WatchTicketsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchTicketsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchTickets`.
message WatchTicketsResponse {
  Ticket ticket = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateTickets`.
message BatchCreateTicketsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateTicketsRequest.StreamHeader header = 2;
    Ticket record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateTickets`.
message BatchCreateTicketsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string ticket_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateTicketsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneTicket`.
message CloneTicketRequest {
  acme.common.v1.RequestContext context = 1;
  Ticket ticket = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneTicket`.
message CloneTicketResponse {
  Ticket ticket = 1;
  acme.common.v1.OperationResult result = 2;
}
