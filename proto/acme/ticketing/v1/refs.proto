syntax = "proto3";

package acme.ticketing.v1;

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.ticketing.v1";

// A reference to a ticket of the ticketing domain.
message TicketRef {
  string ticket_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a ticket tier of the ticketing domain.
message TicketTierRef {
  string ticket_tier_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a ticket transfer of the ticketing domain.
message TicketTransferRef {
  string ticket_transfer_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
