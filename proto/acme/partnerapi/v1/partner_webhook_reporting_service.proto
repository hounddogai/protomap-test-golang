syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerWebhookReportingServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Builds and schedules reports about partner webhooks.
service PartnerWebhookReportingService {
  // Generates a partner webhook.
  rpc GeneratePartnerWebhookReport(GeneratePartnerWebhookReportRequest) returns (GeneratePartnerWebhookReportResponse);

  // Returns a partner webhook.
  rpc FetchPartnerWebhookReport(FetchPartnerWebhookReportRequest) returns (FetchPartnerWebhookReportResponse);

  // Schedules a partner webhook.
  rpc SchedulePartnerWebhookReport(SchedulePartnerWebhookReportRequest) returns (SchedulePartnerWebhookReportResponse);

  // Streams the changes of partner webhooks as they happen.
  rpc StreamPartnerWebhookMetrics(StreamPartnerWebhookMetricsRequest) returns (stream StreamPartnerWebhookMetricsResponse);

  // Lists partner webhooks a page at a time.
  rpc ListPartnerWebhookReports(ListPartnerWebhookReportsRequest) returns (ListPartnerWebhookReportsResponse);

  // Shares a partner webhook.
  rpc SharePartnerWebhookReport(SharePartnerWebhookReportRequest) returns (SharePartnerWebhookReportResponse);

  // Counts partner webhooks by status.
  rpc CountPartnerWebhookTotals(CountPartnerWebhookTotalsRequest) returns (CountPartnerWebhookTotalsResponse);
}

// The request of `GeneratePartnerWebhookReport`.
message GeneratePartnerWebhookReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  GeneratePartnerWebhookReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePartnerWebhookReport`.
message GeneratePartnerWebhookReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPartnerWebhookReport`.
message FetchPartnerWebhookReportRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPartnerWebhookReport`.
message FetchPartnerWebhookReportResponse {
  PartnerWebhook partner_webhook = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePartnerWebhookReport`.
message SchedulePartnerWebhookReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  SchedulePartnerWebhookReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePartnerWebhookReport`.
message SchedulePartnerWebhookReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPartnerWebhookMetrics`.
message StreamPartnerWebhookMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerWebhookStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPartnerWebhookMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPartnerWebhookMetrics`.
message StreamPartnerWebhookMetricsResponse {
  PartnerWebhook partner_webhook = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPartnerWebhookReports`.
message ListPartnerWebhookReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerWebhookStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartnerWebhookReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartnerWebhookReports`.
message ListPartnerWebhookReportsResponse {
  repeated PartnerWebhook partner_webhooks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePartnerWebhookReport`.
message SharePartnerWebhookReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  SharePartnerWebhookReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePartnerWebhookReport`.
message SharePartnerWebhookReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerWebhook partner_webhook = 1;
  SharePartnerWebhookReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPartnerWebhookTotals`.
message CountPartnerWebhookTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerWebhookStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPartnerWebhookTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPartnerWebhookTotals`.
message CountPartnerWebhookTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
