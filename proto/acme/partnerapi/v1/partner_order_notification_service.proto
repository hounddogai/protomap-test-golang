syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerOrderNotificationServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Tells the people who follow a partner order what changed.
service PartnerOrderNotificationService {
  // Subscribes a partner order.
  rpc SubscribePartnerOrderUpdates(SubscribePartnerOrderUpdatesRequest) returns (SubscribePartnerOrderUpdatesResponse);

  // Unsubscribes a partner order.
  rpc UnsubscribePartnerOrderUpdates(UnsubscribePartnerOrderUpdatesRequest) returns (UnsubscribePartnerOrderUpdatesResponse);

  // Notifys a partner order.
  rpc NotifyPartnerOrderWatchers(NotifyPartnerOrderWatchersRequest) returns (NotifyPartnerOrderWatchersResponse);

  // Lists partner orders a page at a time.
  rpc ListPartnerOrderSubscriptions(ListPartnerOrderSubscriptionsRequest) returns (ListPartnerOrderSubscriptionsResponse);

  // Returns a partner order.
  rpc GetPartnerOrderPreferences(GetPartnerOrderPreferencesRequest) returns (GetPartnerOrderPreferencesResponse);

  // Streams the changes of partner orders as they happen.
  rpc StreamPartnerOrderNotices(StreamPartnerOrderNoticesRequest) returns (stream StreamPartnerOrderNoticesResponse);
}

// The request of `SubscribePartnerOrderUpdates`.
message SubscribePartnerOrderUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  SubscribePartnerOrderUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribePartnerOrderUpdates`.
message SubscribePartnerOrderUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  SubscribePartnerOrderUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribePartnerOrderUpdates`.
message UnsubscribePartnerOrderUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  UnsubscribePartnerOrderUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribePartnerOrderUpdates`.
message UnsubscribePartnerOrderUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  UnsubscribePartnerOrderUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyPartnerOrderWatchers`.
message NotifyPartnerOrderWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  NotifyPartnerOrderWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyPartnerOrderWatchers`.
message NotifyPartnerOrderWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  NotifyPartnerOrderWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPartnerOrderSubscriptions`.
message ListPartnerOrderSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartnerOrderSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartnerOrderSubscriptions`.
message ListPartnerOrderSubscriptionsResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPartnerOrderPreferences`.
message GetPartnerOrderPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPartnerOrderPreferences`.
message GetPartnerOrderPreferencesResponse {
  PartnerOrder partner_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamPartnerOrderNotices`.
message StreamPartnerOrderNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPartnerOrderNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPartnerOrderNotices`.
message StreamPartnerOrderNoticesResponse {
  PartnerOrder partner_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
