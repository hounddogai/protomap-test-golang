option java_multiple_files = true;
option java_outer_classname = "PartnerWebhookWorkflowServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Runs the long-lived workflow that takes a partner webhook from start to finish.
service PartnerWebhookWorkflowService {
  // Starts a partner webhook.
  rpc StartPartnerWebhookWorkflow(StartPartnerWebhookWorkflowRequest) returns (StartPartnerWebhookWorkflowResponse);

  // Advances a partner webhook.
  rpc AdvancePartnerWebhookWorkflow(AdvancePartnerWebhookWorkflowRequest) returns (AdvancePartnerWebhookWorkflowResponse);

  // Cancels a partner webhook.
  rpc CancelPartnerWebhookWorkflow(CancelPartnerWebhookWorkflowRequest) returns (CancelPartnerWebhookWorkflowResponse);

  // Retrys a partner webhook.
  rpc RetryPartnerWebhookWorkflow(RetryPartnerWebhookWorkflowRequest) returns (RetryPartnerWebhookWorkflowResponse);

  // Pauses a partner webhook.
  rpc PausePartnerWebhookWorkflow(PausePartnerWebhookWorkflowRequest) returns (PausePartnerWebhookWorkflowResponse);

  // Resumes a partner webhook.
  rpc ResumePartnerWebhookWorkflow(ResumePartnerWebhookWorkflowRequest) returns (ResumePartnerWebhookWorkflowResponse);

  // Returns a partner webhook.
  rpc InspectPartnerWebhookWorkflow(InspectPartnerWebhookWorkflowRequest) returns (InspectPartnerWebhookWorkflowResponse);

  // Lists partner webhooks a page at a time.
  rpc ListPartnerWebhookWorkflows(ListPartnerWebhookWorkflowsRequest) returns (ListPartnerWebhookWorkflowsResponse);
}

// The request of `StartPartnerWebhookWorkflow`.
message StartPartnerWebhookWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  PartnerWebhook partner_webhook = 3;
  StartPartnerWebhookWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPartnerWebhookWorkflow`.
message StartPartnerWebhookWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerWebhook partner_webhook = 1;
  StartPartnerWebhookWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

