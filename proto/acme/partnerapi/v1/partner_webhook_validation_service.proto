syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerWebhookValidationServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Checks partner webhooks against the rules before anything acts on them.
service PartnerWebhookValidationService {
  // Validates a partner webhook.
  rpc ValidatePartnerWebhook(ValidatePartnerWebhookRequest) returns (ValidatePartnerWebhookResponse);

  // Previews a partner webhook.
  rpc PreviewPartnerWebhook(PreviewPartnerWebhookRequest) returns (PreviewPartnerWebhookResponse);

  // Normalizes a partner webhook.
  rpc NormalizePartnerWebhook(NormalizePartnerWebhookRequest) returns (NormalizePartnerWebhookResponse);

  // Explains a partner webhook.
  rpc ExplainPartnerWebhookDecision(ExplainPartnerWebhookDecisionRequest) returns (ExplainPartnerWebhookDecisionResponse);

  // Scores a partner webhook.
  rpc ScorePartnerWebhook(ScorePartnerWebhookRequest) returns (ScorePartnerWebhookResponse);

  // Lints a partner webhook.
  rpc LintPartnerWebhooks(LintPartnerWebhooksRequest) returns (LintPartnerWebhooksResponse);

  // Returns a partner webhook.
  rpc GetPartnerWebhookRules(GetPartnerWebhookRulesRequest) returns (GetPartnerWebhookRulesResponse);
}

// The request of `ValidatePartnerWebhook`.
message ValidatePartnerWebhookRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  PartnerWebhook partner_webhook = 3;
  ValidatePartnerWebhookRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePartnerWebhook`.
message ValidatePartnerWebhookResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerWebhook partner_webhook = 1;
  ValidatePartnerWebhookResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

