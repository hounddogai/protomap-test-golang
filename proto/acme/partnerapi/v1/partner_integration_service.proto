syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerIntegrationServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Manages partner integrations: creates, reads, changes, and lists them.
service PartnerIntegrationService {
  // Creates a partner integration.
  rpc CreatePartnerIntegration(CreatePartnerIntegrationRequest) returns (CreatePartnerIntegrationResponse);

  // Returns a partner integration.
  rpc GetPartnerIntegration(GetPartnerIntegrationRequest) returns (GetPartnerIntegrationResponse);

  // Changes a partner integration.
  rpc UpdatePartnerIntegration(UpdatePartnerIntegrationRequest) returns (UpdatePartnerIntegrationResponse);

  // Deletes a partner integration.
  rpc DeletePartnerIntegration(DeletePartnerIntegrationRequest) returns (DeletePartnerIntegrationResponse);

  // Lists partner integrations a page at a time.
  rpc ListPartnerIntegrations(ListPartnerIntegrationsRequest) returns (ListPartnerIntegrationsResponse);

  // Returns several partner integrations at once.
  rpc BatchGetPartnerIntegrations(BatchGetPartnerIntegrationsRequest) returns (BatchGetPartnerIntegrationsResponse);

  // Takes a stream of partner integrations and answers once at the end.
  rpc BatchCreatePartnerIntegrations(stream BatchCreatePartnerIntegrationsRequest) returns (BatchCreatePartnerIntegrationsResponse);
}

// The request of `CreatePartnerIntegration`.
message CreatePartnerIntegrationRequest {
  acme.common.v1.RequestContext context = 1;
  PartnerIntegration partner_integration = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreatePartnerIntegration`.
message CreatePartnerIntegrationResponse {
  PartnerIntegration partner_integration = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetPartnerIntegration`.
message GetPartnerIntegrationRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPartnerIntegration`.
message GetPartnerIntegrationResponse {
  PartnerIntegration partner_integration = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdatePartnerIntegration`.
message UpdatePartnerIntegrationRequest {
  acme.common.v1.RequestContext context = 1;
  PartnerIntegration partner_integration = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdatePartnerIntegration`.
message UpdatePartnerIntegrationResponse {
  PartnerIntegration partner_integration = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeletePartnerIntegration`.
message DeletePartnerIntegrationRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePartnerIntegration`.
message DeletePartnerIntegrationResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListPartnerIntegrations`.
message ListPartnerIntegrationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerIntegrationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartnerIntegrationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartnerIntegrations`.
message ListPartnerIntegrationsResponse {
  repeated PartnerIntegration partner_integrations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetPartnerIntegrations`.
message BatchGetPartnerIntegrationsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string partner_integration_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetPartnerIntegrations`.
message BatchGetPartnerIntegrationsResponse {
  repeated PartnerIntegration partner_integrations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchCreatePartnerIntegrations`.
message BatchCreatePartnerIntegrationsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreatePartnerIntegrationsRequest.StreamHeader header = 2;
    PartnerIntegration record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreatePartnerIntegrations`.
message BatchCreatePartnerIntegrationsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string partner_integration_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreatePartnerIntegrationsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}
