syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerWebhookNotificationServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Tells the people who follow a partner webhook what changed.
service PartnerWebhookNotificationService {
  // Subscribes a partner webhook.
  rpc SubscribePartnerWebhookUpdates(SubscribePartnerWebhookUpdatesRequest) returns (SubscribePartnerWebhookUpdatesResponse);

  // Unsubscribes a partner webhook.
  rpc UnsubscribePartnerWebhookUpdates(UnsubscribePartnerWebhookUpdatesRequest) returns (UnsubscribePartnerWebhookUpdatesResponse);

  // Notifys a partner webhook.
  rpc NotifyPartnerWebhookWatchers(NotifyPartnerWebhookWatchersRequest) returns (NotifyPartnerWebhookWatchersResponse);

  // Lists partner webhooks a page at a time.
  rpc ListPartnerWebhookSubscriptions(ListPartnerWebhookSubscriptionsRequest) returns (ListPartnerWebhookSubscriptionsResponse);

  // Sends a partner webhook.
  rpc SendPartnerWebhookTestNotice(SendPartnerWebhookTestNoticeRequest) returns (SendPartnerWebhookTestNoticeResponse);

  // Returns a partner webhook.
  rpc GetPartnerWebhookPreferences(GetPartnerWebhookPreferencesRequest) returns (GetPartnerWebhookPreferencesResponse);

  // Streams the changes of partner webhooks as they happen.
  rpc StreamPartnerWebhookNotices(StreamPartnerWebhookNoticesRequest) returns (stream StreamPartnerWebhookNoticesResponse);
}

// The request of `SubscribePartnerWebhookUpdates`.
message SubscribePartnerWebhookUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  SubscribePartnerWebhookUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribePartnerWebhookUpdates`.
message SubscribePartnerWebhookUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerWebhook partner_webhook = 1;
  SubscribePartnerWebhookUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribePartnerWebhookUpdates`.
message UnsubscribePartnerWebhookUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  UnsubscribePartnerWebhookUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribePartnerWebhookUpdates`.
message UnsubscribePartnerWebhookUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerWebhook partner_webhook = 1;
  UnsubscribePartnerWebhookUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

