syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerIntegrationReportingServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Builds and schedules reports about partner integrations.
service PartnerIntegrationReportingService {
  // Generates a partner integration.
  rpc GeneratePartnerIntegrationReport(GeneratePartnerIntegrationReportRequest) returns (GeneratePartnerIntegrationReportResponse);

  // Returns a partner integration.
  rpc FetchPartnerIntegrationReport(FetchPartnerIntegrationReportRequest) returns (FetchPartnerIntegrationReportResponse);

  // Schedules a partner integration.
  rpc SchedulePartnerIntegrationReport(SchedulePartnerIntegrationReportRequest) returns (SchedulePartnerIntegrationReportResponse);

  // Lists partner integrations a page at a time.
  rpc ListPartnerIntegrationReports(ListPartnerIntegrationReportsRequest) returns (ListPartnerIntegrationReportsResponse);

  // Shares a partner integration.
  rpc SharePartnerIntegrationReport(SharePartnerIntegrationReportRequest) returns (SharePartnerIntegrationReportResponse);

  // Counts partner integrations by status.
  rpc CountPartnerIntegrationTotals(CountPartnerIntegrationTotalsRequest) returns (CountPartnerIntegrationTotalsResponse);

  // Deletes a partner integration.
  rpc DeletePartnerIntegrationReport(DeletePartnerIntegrationReportRequest) returns (DeletePartnerIntegrationReportResponse);
}

// The request of `GeneratePartnerIntegrationReport`.
message GeneratePartnerIntegrationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  GeneratePartnerIntegrationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePartnerIntegrationReport`.
message GeneratePartnerIntegrationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPartnerIntegrationReport`.
message FetchPartnerIntegrationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPartnerIntegrationReport`.
message FetchPartnerIntegrationReportResponse {
  PartnerIntegration partner_integration = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePartnerIntegrationReport`.
message SchedulePartnerIntegrationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  SchedulePartnerIntegrationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePartnerIntegrationReport`.
message SchedulePartnerIntegrationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPartnerIntegrationReports`.
message ListPartnerIntegrationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerIntegrationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartnerIntegrationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartnerIntegrationReports`.
message ListPartnerIntegrationReportsResponse {
  repeated PartnerIntegration partner_integrations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePartnerIntegrationReport`.
message SharePartnerIntegrationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  SharePartnerIntegrationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePartnerIntegrationReport`.
message SharePartnerIntegrationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerIntegration partner_integration = 1;
  SharePartnerIntegrationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPartnerIntegrationTotals`.
message CountPartnerIntegrationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerIntegrationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPartnerIntegrationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPartnerIntegrationTotals`.
message CountPartnerIntegrationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePartnerIntegrationReport`.
message DeletePartnerIntegrationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePartnerIntegrationReport`.
message DeletePartnerIntegrationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
