syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerOrderQueryServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Answers read-only questions about partner orders, for screens and reports.
service PartnerOrderQueryService {
  // Returns a partner order.
  rpc LookupPartnerOrder(LookupPartnerOrderRequest) returns (LookupPartnerOrderResponse);

  // Lists partner orders a page at a time.
  rpc BrowsePartnerOrders(BrowsePartnerOrdersRequest) returns (BrowsePartnerOrdersResponse);

  // Lists partner orders a page at a time.
  rpc FindPartnerOrders(FindPartnerOrdersRequest) returns (FindPartnerOrdersResponse);

  // Counts partner orders by status.
  rpc CountPartnerOrders(CountPartnerOrdersRequest) returns (CountPartnerOrdersResponse);

  // Returns several partner orders at once.
  rpc ResolvePartnerOrders(ResolvePartnerOrdersRequest) returns (ResolvePartnerOrdersResponse);

  // Streams every matching partner order.
  rpc ExportPartnerOrders(ExportPartnerOrdersRequest) returns (stream ExportPartnerOrdersResponse);

  // Summarizes a partner order.
  rpc SummarizePartnerOrders(SummarizePartnerOrdersRequest) returns (SummarizePartnerOrdersResponse);

  // Lists partner orders a page at a time.
  rpc SuggestPartnerOrders(SuggestPartnerOrdersRequest) returns (SuggestPartnerOrdersResponse);

  // Returns a partner order.
  rpc PeekPartnerOrder(PeekPartnerOrderRequest) returns (PeekPartnerOrderResponse);
}

// The request of `LookupPartnerOrder`.
message LookupPartnerOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPartnerOrder`.
message LookupPartnerOrderResponse {
  PartnerOrder partner_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePartnerOrders`.
message BrowsePartnerOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePartnerOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePartnerOrders`.
message BrowsePartnerOrdersResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPartnerOrders`.
message FindPartnerOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPartnerOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPartnerOrders`.
message FindPartnerOrdersResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPartnerOrders`.
message CountPartnerOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPartnerOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPartnerOrders`.
message CountPartnerOrdersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePartnerOrders`.
message ResolvePartnerOrdersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string partner_order_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePartnerOrders`.
message ResolvePartnerOrdersResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPartnerOrders`.
message ExportPartnerOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPartnerOrdersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPartnerOrders`.
message ExportPartnerOrdersResponse {
  PartnerOrder partner_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePartnerOrders`.
message SummarizePartnerOrdersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  SummarizePartnerOrdersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePartnerOrders`.
message SummarizePartnerOrdersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPartnerOrders`.
message SuggestPartnerOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPartnerOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPartnerOrders`.
message SuggestPartnerOrdersResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPartnerOrder`.
message PeekPartnerOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPartnerOrder`.
message PeekPartnerOrderResponse {
  PartnerOrder partner_order = 1;
  acme.common.v1.OperationResult result = 2;
}
