option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerOrderWorkflowServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Runs the long-lived workflow that takes a partner order from start to finish.
service PartnerOrderWorkflowService {
  // Starts a partner order.
  rpc StartPartnerOrderWorkflow(StartPartnerOrderWorkflowRequest) returns (StartPartnerOrderWorkflowResponse);

  // Advances a partner order.
  rpc AdvancePartnerOrderWorkflow(AdvancePartnerOrderWorkflowRequest) returns (AdvancePartnerOrderWorkflowResponse);

  // Cancels a partner order.
  rpc CancelPartnerOrderWorkflow(CancelPartnerOrderWorkflowRequest) returns (CancelPartnerOrderWorkflowResponse);

  // Retrys a partner order.
  rpc RetryPartnerOrderWorkflow(RetryPartnerOrderWorkflowRequest) returns (RetryPartnerOrderWorkflowResponse);

  // Pauses a partner order.
  rpc PausePartnerOrderWorkflow(PausePartnerOrderWorkflowRequest) returns (PausePartnerOrderWorkflowResponse);

  // Resumes a partner order.
  rpc ResumePartnerOrderWorkflow(ResumePartnerOrderWorkflowRequest) returns (ResumePartnerOrderWorkflowResponse);

  // Returns a partner order.
  rpc InspectPartnerOrderWorkflow(InspectPartnerOrderWorkflowRequest) returns (InspectPartnerOrderWorkflowResponse);

  // Lists partner orders a page at a time.
  rpc ListPartnerOrderWorkflows(ListPartnerOrderWorkflowsRequest) returns (ListPartnerOrderWorkflowsResponse);

  // Signals a partner order.
  rpc SignalPartnerOrderWorkflow(SignalPartnerOrderWorkflowRequest) returns (SignalPartnerOrderWorkflowResponse);
}

// The request of `StartPartnerOrderWorkflow`.
message StartPartnerOrderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  PartnerOrder partner_order = 3;
  StartPartnerOrderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPartnerOrderWorkflow`.
message StartPartnerOrderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  StartPartnerOrderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

