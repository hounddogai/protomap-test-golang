syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerOrderReportingServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Builds and schedules reports about partner orders.
service PartnerOrderReportingService {
  // Generates a partner order.
  rpc GeneratePartnerOrderReport(GeneratePartnerOrderReportRequest) returns (GeneratePartnerOrderReportResponse);

  // Returns a partner order.
  rpc FetchPartnerOrderReport(FetchPartnerOrderReportRequest) returns (FetchPartnerOrderReportResponse);

  // Schedules a partner order.
  rpc SchedulePartnerOrderReport(SchedulePartnerOrderReportRequest) returns (SchedulePartnerOrderReportResponse);

  // Streams the changes of partner orders as they happen.
  rpc StreamPartnerOrderMetrics(StreamPartnerOrderMetricsRequest) returns (stream StreamPartnerOrderMetricsResponse);

  // Lists partner orders a page at a time.
  rpc ListPartnerOrderReports(ListPartnerOrderReportsRequest) returns (ListPartnerOrderReportsResponse);

  // Shares a partner order.
  rpc SharePartnerOrderReport(SharePartnerOrderReportRequest) returns (SharePartnerOrderReportResponse);

  // Counts partner orders by status.
  rpc CountPartnerOrderTotals(CountPartnerOrderTotalsRequest) returns (CountPartnerOrderTotalsResponse);

  // Deletes a partner order.
  rpc DeletePartnerOrderReport(DeletePartnerOrderReportRequest) returns (DeletePartnerOrderReportResponse);
}

// The request of `GeneratePartnerOrderReport`.
message GeneratePartnerOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  GeneratePartnerOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePartnerOrderReport`.
message GeneratePartnerOrderReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPartnerOrderReport`.
message FetchPartnerOrderReportRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPartnerOrderReport`.
message FetchPartnerOrderReportResponse {
  PartnerOrder partner_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePartnerOrderReport`.
message SchedulePartnerOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  SchedulePartnerOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePartnerOrderReport`.
message SchedulePartnerOrderReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPartnerOrderMetrics`.
message StreamPartnerOrderMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPartnerOrderMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPartnerOrderMetrics`.
message StreamPartnerOrderMetricsResponse {
  PartnerOrder partner_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPartnerOrderReports`.
message ListPartnerOrderReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartnerOrderReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartnerOrderReports`.
message ListPartnerOrderReportsResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePartnerOrderReport`.
message SharePartnerOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  SharePartnerOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePartnerOrderReport`.
message SharePartnerOrderReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  SharePartnerOrderReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPartnerOrderTotals`.
message CountPartnerOrderTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPartnerOrderTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPartnerOrderTotals`.
message CountPartnerOrderTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePartnerOrderReport`.
message DeletePartnerOrderReportRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePartnerOrderReport`.
message DeletePartnerOrderReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
