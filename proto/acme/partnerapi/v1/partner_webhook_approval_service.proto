syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerWebhookApprovalServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Routes partner webhooks through approval, with escalation and delegation.
service PartnerWebhookApprovalService {
  // Submits a partner webhook.
  rpc SubmitPartnerWebhook(SubmitPartnerWebhookRequest) returns (SubmitPartnerWebhookResponse);

  // Approves a partner webhook.
  rpc ApprovePartnerWebhook(ApprovePartnerWebhookRequest) returns (ApprovePartnerWebhookResponse);

  // Rejects a partner webhook.
  rpc RejectPartnerWebhook(RejectPartnerWebhookRequest) returns (RejectPartnerWebhookResponse);

  // Escalates a partner webhook.
  rpc EscalatePartnerWebhook(EscalatePartnerWebhookRequest) returns (EscalatePartnerWebhookResponse);

  // Lists partner webhooks a page at a time.
  rpc ListPendingPartnerWebhooks(ListPendingPartnerWebhooksRequest) returns (ListPendingPartnerWebhooksResponse);

  // Delegates a partner webhook.
  rpc DelegatePartnerWebhookApproval(DelegatePartnerWebhookApprovalRequest) returns (DelegatePartnerWebhookApprovalResponse);

  // Recalls a partner webhook.
  rpc RecallPartnerWebhook(RecallPartnerWebhookRequest) returns (RecallPartnerWebhookResponse);

  // Returns a partner webhook.
  rpc GetPartnerWebhookApprovalStatus(GetPartnerWebhookApprovalStatusRequest) returns (GetPartnerWebhookApprovalStatusResponse);

  // Comments a partner webhook.
  rpc CommentPartnerWebhookApproval(CommentPartnerWebhookApprovalRequest) returns (CommentPartnerWebhookApprovalResponse);
}

// The request of `SubmitPartnerWebhook`.
message SubmitPartnerWebhookRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_webhook_id = 2;
  PartnerWebhook partner_webhook = 3;
  SubmitPartnerWebhookRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPartnerWebhook`.
message SubmitPartnerWebhookResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerWebhook partner_webhook = 1;
  SubmitPartnerWebhookResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

