syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerOrderIntegrationServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Connects external systems that send partner order events.
service PartnerOrderIntegrationService {
  // Connects a partner order.
  rpc ConnectPartnerOrderSource(ConnectPartnerOrderSourceRequest) returns (ConnectPartnerOrderSourceResponse);

  // Disconnects a partner order.
  rpc DisconnectPartnerOrderSource(DisconnectPartnerOrderSourceRequest) returns (DisconnectPartnerOrderSourceResponse);

  // Takes a stream of partner orders and answers once at the end.
  rpc IngestPartnerOrderEvents(stream IngestPartnerOrderEventsRequest) returns (IngestPartnerOrderEventsResponse);

  // Replays a partner order.
  rpc ReplayPartnerOrderEvents(ReplayPartnerOrderEventsRequest) returns (ReplayPartnerOrderEventsResponse);

  // Acknowledges a partner order.
  rpc AcknowledgePartnerOrderEvent(AcknowledgePartnerOrderEventRequest) returns (AcknowledgePartnerOrderEventResponse);

  // Exchanges changes of partner orders with a peer.
  rpc RelayPartnerOrderMessages(stream RelayPartnerOrderMessagesRequest) returns (stream RelayPartnerOrderMessagesResponse);

  // Lists partner orders a page at a time.
  rpc ListPartnerOrderSources(ListPartnerOrderSourcesRequest) returns (ListPartnerOrderSourcesResponse);

  // Tests a partner order.
  rpc TestPartnerOrderConnection(TestPartnerOrderConnectionRequest) returns (TestPartnerOrderConnectionResponse);
}

// The request of `ConnectPartnerOrderSource`.
message ConnectPartnerOrderSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  ConnectPartnerOrderSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ConnectPartnerOrderSource`.
message ConnectPartnerOrderSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  ConnectPartnerOrderSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DisconnectPartnerOrderSource`.
message DisconnectPartnerOrderSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  DisconnectPartnerOrderSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `DisconnectPartnerOrderSource`.
message DisconnectPartnerOrderSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  DisconnectPartnerOrderSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `IngestPartnerOrderEvents`.
message IngestPartnerOrderEventsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    IngestPartnerOrderEventsRequest.StreamHeader header = 2;
    PartnerOrder record = 3;
  }
  int64 sequence = 4;
}

// The response of `IngestPartnerOrderEvents`.
message IngestPartnerOrderEventsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string partner_order_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated IngestPartnerOrderEventsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ReplayPartnerOrderEvents`.
message ReplayPartnerOrderEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  ReplayPartnerOrderEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReplayPartnerOrderEvents`.
message ReplayPartnerOrderEventsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  ReplayPartnerOrderEventsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AcknowledgePartnerOrderEvent`.
message AcknowledgePartnerOrderEventRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  AcknowledgePartnerOrderEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `AcknowledgePartnerOrderEvent`.
message AcknowledgePartnerOrderEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  AcknowledgePartnerOrderEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RelayPartnerOrderMessages`.
message RelayPartnerOrderMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    PartnerOrder change = 2;
    RelayPartnerOrderMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayPartnerOrderMessages`.
message RelayPartnerOrderMessagesResponse {
  PartnerOrder partner_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPartnerOrderSources`.
message ListPartnerOrderSourcesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartnerOrderSourcesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartnerOrderSources`.
message ListPartnerOrderSourcesResponse {
  repeated PartnerOrder partner_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `TestPartnerOrderConnection`.
message TestPartnerOrderConnectionRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  TestPartnerOrderConnectionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `TestPartnerOrderConnection`.
message TestPartnerOrderConnectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  TestPartnerOrderConnectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
