syntax = "proto3";

package acme.partnerapi.v1;

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.partnerapi.v1";

// A reference to a partner integration of the partnerapi domain.
message PartnerIntegrationRef {
  string partner_integration_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a partner order of the partnerapi domain.
message PartnerOrderRef {
  string partner_order_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a partner webhook of the partnerapi domain.
message PartnerWebhookRef {
  string partner_webhook_id = 1;
  string display_name = 2;
  string kind = 3;
}
