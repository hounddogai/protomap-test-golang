option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerIntegrationWorkflowServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Runs the long-lived workflow that takes a partner integration from start to finish.
service PartnerIntegrationWorkflowService {
  // Starts a partner integration.
  rpc StartPartnerIntegrationWorkflow(StartPartnerIntegrationWorkflowRequest) returns (StartPartnerIntegrationWorkflowResponse);

  // Advances a partner integration.
  rpc AdvancePartnerIntegrationWorkflow(AdvancePartnerIntegrationWorkflowRequest) returns (AdvancePartnerIntegrationWorkflowResponse);

  // Cancels a partner integration.
  rpc CancelPartnerIntegrationWorkflow(CancelPartnerIntegrationWorkflowRequest) returns (CancelPartnerIntegrationWorkflowResponse);

  // Retrys a partner integration.
  rpc RetryPartnerIntegrationWorkflow(RetryPartnerIntegrationWorkflowRequest) returns (RetryPartnerIntegrationWorkflowResponse);

  // Pauses a partner integration.
  rpc PausePartnerIntegrationWorkflow(PausePartnerIntegrationWorkflowRequest) returns (PausePartnerIntegrationWorkflowResponse);

  // Resumes a partner integration.
  rpc ResumePartnerIntegrationWorkflow(ResumePartnerIntegrationWorkflowRequest) returns (ResumePartnerIntegrationWorkflowResponse);

  // Returns a partner integration.
  rpc InspectPartnerIntegrationWorkflow(InspectPartnerIntegrationWorkflowRequest) returns (InspectPartnerIntegrationWorkflowResponse);

  // Lists partner integrations a page at a time.
  rpc ListPartnerIntegrationWorkflows(ListPartnerIntegrationWorkflowsRequest) returns (ListPartnerIntegrationWorkflowsResponse);

  // Signals a partner integration.
  rpc SignalPartnerIntegrationWorkflow(SignalPartnerIntegrationWorkflowRequest) returns (SignalPartnerIntegrationWorkflowResponse);
}

// The request of `StartPartnerIntegrationWorkflow`.
message StartPartnerIntegrationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  PartnerIntegration partner_integration = 3;
  StartPartnerIntegrationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPartnerIntegrationWorkflow`.
message StartPartnerIntegrationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerIntegration partner_integration = 1;
  StartPartnerIntegrationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

