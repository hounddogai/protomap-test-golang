syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerIntegrationNotificationServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Tells the people who follow a partner integration what changed.
service PartnerIntegrationNotificationService {
  // Subscribes a partner integration.
  rpc SubscribePartnerIntegrationUpdates(SubscribePartnerIntegrationUpdatesRequest) returns (SubscribePartnerIntegrationUpdatesResponse);

  // Unsubscribes a partner integration.
  rpc UnsubscribePartnerIntegrationUpdates(UnsubscribePartnerIntegrationUpdatesRequest) returns (UnsubscribePartnerIntegrationUpdatesResponse);

  // Notifys a partner integration.
  rpc NotifyPartnerIntegrationWatchers(NotifyPartnerIntegrationWatchersRequest) returns (NotifyPartnerIntegrationWatchersResponse);

  // Lists partner integrations a page at a time.
  rpc ListPartnerIntegrationSubscriptions(ListPartnerIntegrationSubscriptionsRequest) returns (ListPartnerIntegrationSubscriptionsResponse);

  // Sends a partner integration.
  rpc SendPartnerIntegrationTestNotice(SendPartnerIntegrationTestNoticeRequest) returns (SendPartnerIntegrationTestNoticeResponse);

  // Returns a partner integration.
  rpc GetPartnerIntegrationPreferences(GetPartnerIntegrationPreferencesRequest) returns (GetPartnerIntegrationPreferencesResponse);

  // Streams the changes of partner integrations as they happen.
  rpc StreamPartnerIntegrationNotices(StreamPartnerIntegrationNoticesRequest) returns (stream StreamPartnerIntegrationNoticesResponse);
}

// The request of `SubscribePartnerIntegrationUpdates`.
message SubscribePartnerIntegrationUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  SubscribePartnerIntegrationUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribePartnerIntegrationUpdates`.
message SubscribePartnerIntegrationUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerIntegration partner_integration = 1;
  SubscribePartnerIntegrationUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribePartnerIntegrationUpdates`.
message UnsubscribePartnerIntegrationUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  UnsubscribePartnerIntegrationUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribePartnerIntegrationUpdates`.
message UnsubscribePartnerIntegrationUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerIntegration partner_integration = 1;
  UnsubscribePartnerIntegrationUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyPartnerIntegrationWatchers`.
message NotifyPartnerIntegrationWatchersRequest {
  // What the operation needs besides the record.
  message Details {
