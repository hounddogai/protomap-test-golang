message SendPartnerIntegrationTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerIntegration partner_integration = 1;
  SendPartnerIntegrationTestNoticeResponse.Outcome outcome = 2;
