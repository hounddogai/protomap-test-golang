syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerIntegrationQueryServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Answers read-only questions about partner integrations, for screens and reports.
service PartnerIntegrationQueryService {
  // Returns a partner integration.
  rpc LookupPartnerIntegration(LookupPartnerIntegrationRequest) returns (LookupPartnerIntegrationResponse);

  // Lists partner integrations a page at a time.
  rpc BrowsePartnerIntegrations(BrowsePartnerIntegrationsRequest) returns (BrowsePartnerIntegrationsResponse);

  // Lists partner integrations a page at a time.
  rpc FindPartnerIntegrations(FindPartnerIntegrationsRequest) returns (FindPartnerIntegrationsResponse);

  // Returns several partner integrations at once.
  rpc ResolvePartnerIntegrations(ResolvePartnerIntegrationsRequest) returns (ResolvePartnerIntegrationsResponse);

  // Streams every matching partner integration.
  rpc ExportPartnerIntegrations(ExportPartnerIntegrationsRequest) returns (stream ExportPartnerIntegrationsResponse);

  // Summarizes a partner integration.
  rpc SummarizePartnerIntegrations(SummarizePartnerIntegrationsRequest) returns (SummarizePartnerIntegrationsResponse);
}

// The request of `LookupPartnerIntegration`.
message LookupPartnerIntegrationRequest {
  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPartnerIntegration`.
message LookupPartnerIntegrationResponse {
  PartnerIntegration partner_integration = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePartnerIntegrations`.
message BrowsePartnerIntegrationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerIntegrationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePartnerIntegrationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePartnerIntegrations`.
message BrowsePartnerIntegrationsResponse {
  repeated PartnerIntegration partner_integrations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPartnerIntegrations`.
message FindPartnerIntegrationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerIntegrationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPartnerIntegrationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPartnerIntegrations`.
message FindPartnerIntegrationsResponse {
  repeated PartnerIntegration partner_integrations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePartnerIntegrations`.
message ResolvePartnerIntegrationsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string partner_integration_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePartnerIntegrations`.
message ResolvePartnerIntegrationsResponse {
  repeated PartnerIntegration partner_integrations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPartnerIntegrations`.
message ExportPartnerIntegrationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartnerIntegrationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPartnerIntegrationsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPartnerIntegrations`.
message ExportPartnerIntegrationsResponse {
  PartnerIntegration partner_integration = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePartnerIntegrations`.
message SummarizePartnerIntegrationsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_integration_id = 2;
  SummarizePartnerIntegrationsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePartnerIntegrations`.
message SummarizePartnerIntegrationsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}
