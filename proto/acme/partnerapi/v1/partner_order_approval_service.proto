syntax = "proto3";

package acme.partnerapi.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/partnerapi/v1/partnerapi.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Partnerapi.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/partnerapi/v1;partnerapiv1";
option java_multiple_files = true;
option java_outer_classname = "PartnerOrderApprovalServiceProto";
option java_package = "com.acme.partnerapi.v1";

// Routes partner orders through approval, with escalation and delegation.
service PartnerOrderApprovalService {
  // Submits a partner order.
  rpc SubmitPartnerOrder(SubmitPartnerOrderRequest) returns (SubmitPartnerOrderResponse);

  // Approves a partner order.
  rpc ApprovePartnerOrder(ApprovePartnerOrderRequest) returns (ApprovePartnerOrderResponse);

  // Rejects a partner order.
  rpc RejectPartnerOrder(RejectPartnerOrderRequest) returns (RejectPartnerOrderResponse);

  // Escalates a partner order.
  rpc EscalatePartnerOrder(EscalatePartnerOrderRequest) returns (EscalatePartnerOrderResponse);

  // Lists partner orders a page at a time.
  rpc ListPendingPartnerOrders(ListPendingPartnerOrdersRequest) returns (ListPendingPartnerOrdersResponse);

  // Delegates a partner order.
  rpc DelegatePartnerOrderApproval(DelegatePartnerOrderApprovalRequest) returns (DelegatePartnerOrderApprovalResponse);

  // Recalls a partner order.
  rpc RecallPartnerOrder(RecallPartnerOrderRequest) returns (RecallPartnerOrderResponse);

  // Returns a partner order.
  rpc GetPartnerOrderApprovalStatus(GetPartnerOrderApprovalStatusRequest) returns (GetPartnerOrderApprovalStatusResponse);

  // Comments a partner order.
  rpc CommentPartnerOrderApproval(CommentPartnerOrderApprovalRequest) returns (CommentPartnerOrderApprovalResponse);
}

// The request of `SubmitPartnerOrder`.
message SubmitPartnerOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string partner_order_id = 2;
  PartnerOrder partner_order = 3;
  SubmitPartnerOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPartnerOrder`.
message SubmitPartnerOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PartnerOrder partner_order = 1;
  SubmitPartnerOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

