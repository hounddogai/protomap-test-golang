syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureViewCalculationServiceProto";
option java_package = "com.acme.featurestore.v1";

// Computes the figures of a feature view, such as totals, taxes, and estimates.
service FeatureViewCalculationService {
  // Calculates a feature view.
  rpc CalculateFeatureView(CalculateFeatureViewRequest) returns (CalculateFeatureViewResponse);

  // Estimates a feature view.
  rpc EstimateFeatureView(EstimateFeatureViewRequest) returns (EstimateFeatureViewResponse);

  // Quotes a feature view.
  rpc QuoteFeatureView(QuoteFeatureViewRequest) returns (QuoteFeatureViewResponse);

  // Compares a feature view.
  rpc CompareFeatureViewOptions(CompareFeatureViewOptionsRequest) returns (CompareFeatureViewOptionsResponse);

  // Recalculates a feature view.
  rpc RecalculateFeatureViews(RecalculateFeatureViewsRequest) returns (RecalculateFeatureViewsResponse);

  // Simulates a feature view.
  rpc SimulateFeatureView(SimulateFeatureViewRequest) returns (SimulateFeatureViewResponse);

  // Explains a feature view.
  rpc ExplainFeatureViewCalculation(ExplainFeatureViewCalculationRequest) returns (ExplainFeatureViewCalculationResponse);

  // Returns a feature view.
  rpc GetFeatureViewRates(GetFeatureViewRatesRequest) returns (GetFeatureViewRatesResponse);
}

// The request of `CalculateFeatureView`.
message CalculateFeatureViewRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  FeatureView feature_view = 3;
  CalculateFeatureViewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFeatureView`.
message CalculateFeatureViewResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFeatureViewResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FeatureView feature_view = 1;
  CalculateFeatureViewResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

