syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/employees/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/itsm/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ItsmProto";
option java_package = "com.acme.itsm.v1";

// Where an incident is in its lifecycle.
enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_NEW = 1;
  INCIDENT_STATUS_OPEN = 2;
  INCIDENT_STATUS_WAITING = 3;
  INCIDENT_STATUS_RESOLVED = 4;
  INCIDENT_STATUS_CLOSED = 5;
}

// Where a change request is in its lifecycle.
enum ChangeRequestStatus {
  CHANGE_REQUEST_STATUS_UNSPECIFIED = 0;
  CHANGE_REQUEST_STATUS_NEW = 1;
  CHANGE_REQUEST_STATUS_OPEN = 2;
  CHANGE_REQUEST_STATUS_WAITING = 3;
  CHANGE_REQUEST_STATUS_RESOLVED = 4;
  CHANGE_REQUEST_STATUS_CLOSED = 5;
}

// Where a service asset is in its lifecycle.
enum ServiceAssetStatus {
  SERVICE_ASSET_STATUS_UNSPECIFIED = 0;
  SERVICE_ASSET_STATUS_PLANNED = 1;
  SERVICE_ASSET_STATUS_AVAILABLE = 2;
  SERVICE_ASSET_STATUS_RESERVED = 3;
  SERVICE_ASSET_STATUS_RETIRED = 4;
}

// Where a problem is in its lifecycle.
enum ProblemStatus {
  PROBLEM_STATUS_UNSPECIFIED = 0;
  PROBLEM_STATUS_NEW = 1;
  PROBLEM_STATUS_OPEN = 2;
  PROBLEM_STATUS_WAITING = 3;
  PROBLEM_STATUS_RESOLVED = 4;
  PROBLEM_STATUS_CLOSED = 5;
}

// The comment of an incident.
message IncidentComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of an incident.
message IncidentSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of an incident.
message IncidentChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of an incident.
message IncidentStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// An incident of the itsm domain.
message Incident {
  string incident_id = 1;
  string subject = 2;
  IncidentStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated IncidentComment comments = 7;
  IncidentSla sla = 8;
  oneof origin {
    acme.employees.v1.EmployeeRef customer = 9;
    string external_reference = 10;
    IncidentChannelOrigin channel = 11;
  }
  repeated IncidentStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The comment of a change request.
message ChangeRequestComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a change request.
message ChangeRequestSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a change request.
message ChangeRequestChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a change request.
message ChangeRequestStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A change request of the itsm domain.
message ChangeRequest {
  string change_request_id = 1;
  string subject = 2;
  ChangeRequestStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ChangeRequestComment comments = 7;
  ChangeRequestSla sla = 8;
  oneof origin {
    IncidentRef customer = 9;
    string external_reference = 10;
    ChangeRequestChannelOrigin channel = 11;
  }
  repeated ChangeRequestStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The dimensions of a service asset.
message ServiceAssetDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a service asset.
message ServiceAssetComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A service asset of the itsm domain.
message ServiceAsset {
  string service_asset_id = 1;
  string code = 2;
  string name = 3;
  ServiceAssetStatus status = 4;
  repeated string category_path = 5;
  ServiceAssetDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, ServiceAssetComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The comment of a problem.
message ProblemComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a problem.
message ProblemSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a problem.
message ProblemChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a problem.
message ProblemStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A problem of the itsm domain.
message Problem {
  string problem_id = 1;
  string subject = 2;
  ProblemStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ProblemComment comments = 7;
  ProblemSla sla = 8;
  oneof origin {
    acme.employees.v1.EmployeeRef customer = 9;
    string external_reference = 10;
    ProblemChannelOrigin channel = 11;
  }
  repeated ProblemStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
