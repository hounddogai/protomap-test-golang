syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "IncidentQueryServiceProto";
option java_package = "com.acme.itsm.v1";

// Answers read-only questions about incidents, for screens and reports.
service IncidentQueryService {
  // Returns an incident.
  rpc LookupIncident(LookupIncidentRequest) returns (LookupIncidentResponse);

  // Lists incidents a page at a time.
  rpc BrowseIncidents(BrowseIncidentsRequest) returns (BrowseIncidentsResponse);

  // Lists incidents a page at a time.
  rpc FindIncidents(FindIncidentsRequest) returns (FindIncidentsResponse);

  // Returns several incidents at once.
  rpc ResolveIncidents(ResolveIncidentsRequest) returns (ResolveIncidentsResponse);

  // Streams every matching incident.
  rpc ExportIncidents(ExportIncidentsRequest) returns (stream ExportIncidentsResponse);

  // Lists incidents a page at a time.
  rpc SuggestIncidents(SuggestIncidentsRequest) returns (SuggestIncidentsResponse);

  // Returns an incident.
  rpc PeekIncident(PeekIncidentRequest) returns (PeekIncidentResponse);
}

// The request of `LookupIncident`.
message LookupIncidentRequest {
  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupIncident`.
message LookupIncidentResponse {
  Incident incident = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseIncidents`.
message BrowseIncidentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated IncidentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseIncidentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseIncidents`.
message BrowseIncidentsResponse {
  repeated Incident incidents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindIncidents`.
message FindIncidentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated IncidentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindIncidentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindIncidents`.
message FindIncidentsResponse {
  repeated Incident incidents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveIncidents`.
message ResolveIncidentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string incident_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveIncidents`.
message ResolveIncidentsResponse {
  repeated Incident incidents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportIncidents`.
message ExportIncidentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated IncidentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportIncidentsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportIncidents`.
message ExportIncidentsResponse {
  Incident incident = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestIncidents`.
message SuggestIncidentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated IncidentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestIncidentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestIncidents`.
message SuggestIncidentsResponse {
  repeated Incident incidents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekIncident`.
message PeekIncidentRequest {
  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekIncident`.
message PeekIncidentResponse {
  Incident incident = 1;
  acme.common.v1.OperationResult result = 2;
}
