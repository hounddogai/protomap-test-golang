syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "IncidentCalculationServiceProto";
option java_package = "com.acme.itsm.v1";

// Computes the figures of an incident, such as totals, taxes, and estimates.
service IncidentCalculationService {
  // Calculates an incident.
  rpc CalculateIncident(CalculateIncidentRequest) returns (CalculateIncidentResponse);

  // Estimates an incident.
  rpc EstimateIncident(EstimateIncidentRequest) returns (EstimateIncidentResponse);

  // Compares an incident.
  rpc CompareIncidentOptions(CompareIncidentOptionsRequest) returns (CompareIncidentOptionsResponse);

  // Recalculates an incident.
  rpc RecalculateIncidents(RecalculateIncidentsRequest) returns (RecalculateIncidentsResponse);

  // Simulates an incident.
  rpc SimulateIncident(SimulateIncidentRequest) returns (SimulateIncidentResponse);

  // Explains an incident.
  rpc ExplainIncidentCalculation(ExplainIncidentCalculationRequest) returns (ExplainIncidentCalculationResponse);

  // Returns an incident.
  rpc GetIncidentRates(GetIncidentRatesRequest) returns (GetIncidentRatesResponse);
}

// The request of `CalculateIncident`.
message CalculateIncidentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  Incident incident = 3;
  CalculateIncidentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateIncident`.
message CalculateIncidentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateIncidentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Incident incident = 1;
  CalculateIncidentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

