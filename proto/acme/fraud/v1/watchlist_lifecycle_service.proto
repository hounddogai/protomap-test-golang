syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "WatchlistLifecycleServiceProto";
option java_package = "com.acme.fraud.v1";

// Moves a watchlist between the states of its lifecycle.
service WatchlistLifecycleService {
  // Activates a watchlist.
  rpc ActivateWatchlist(ActivateWatchlistRequest) returns (ActivateWatchlistResponse);

  // Suspends a watchlist.
  rpc SuspendWatchlist(SuspendWatchlistRequest) returns (SuspendWatchlistResponse);

  // Reinstates a watchlist.
  rpc ReinstateWatchlist(ReinstateWatchlistRequest) returns (ReinstateWatchlistResponse);

  // Terminates a watchlist.
  rpc TerminateWatchlist(TerminateWatchlistRequest) returns (TerminateWatchlistResponse);

  // Renews a watchlist.
  rpc RenewWatchlist(RenewWatchlistRequest) returns (RenewWatchlistResponse);

  // Expires a watchlist.
  rpc ExpireWatchlist(ExpireWatchlistRequest) returns (ExpireWatchlistResponse);

  // Returns a watchlist.
  rpc GetWatchlistLifecycle(GetWatchlistLifecycleRequest) returns (GetWatchlistLifecycleResponse);

  // Schedules a watchlist.
  rpc ScheduleWatchlistExpiry(ScheduleWatchlistExpiryRequest) returns (ScheduleWatchlistExpiryResponse);
}

// The request of `ActivateWatchlist`.
message ActivateWatchlistRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  ActivateWatchlistRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateWatchlist`.
message ActivateWatchlistResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Watchlist watchlist = 1;
  ActivateWatchlistResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

