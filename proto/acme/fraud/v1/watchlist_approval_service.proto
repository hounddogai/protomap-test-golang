syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "WatchlistApprovalServiceProto";
option java_package = "com.acme.fraud.v1";

// Routes watchlists through approval, with escalation and delegation.
service WatchlistApprovalService {
  // Submits a watchlist.
  rpc SubmitWatchlist(SubmitWatchlistRequest) returns (SubmitWatchlistResponse);

  // Approves a watchlist.
  rpc ApproveWatchlist(ApproveWatchlistRequest) returns (ApproveWatchlistResponse);

  // Rejects a watchlist.
  rpc RejectWatchlist(RejectWatchlistRequest) returns (RejectWatchlistResponse);

  // Lists watchlists a page at a time.
  rpc ListPendingWatchlists(ListPendingWatchlistsRequest) returns (ListPendingWatchlistsResponse);

  // Delegates a watchlist.
  rpc DelegateWatchlistApproval(DelegateWatchlistApprovalRequest) returns (DelegateWatchlistApprovalResponse);

  // Recalls a watchlist.
  rpc RecallWatchlist(RecallWatchlistRequest) returns (RecallWatchlistResponse);

  // Returns a watchlist.
  rpc GetWatchlistApprovalStatus(GetWatchlistApprovalStatusRequest) returns (GetWatchlistApprovalStatusResponse);

  // Comments a watchlist.
  rpc CommentWatchlistApproval(CommentWatchlistApprovalRequest) returns (CommentWatchlistApprovalResponse);
}

// The request of `SubmitWatchlist`.
message SubmitWatchlistRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  Watchlist watchlist = 3;
  SubmitWatchlistRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWatchlist`.
message SubmitWatchlistResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Watchlist watchlist = 1;
  SubmitWatchlistResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

