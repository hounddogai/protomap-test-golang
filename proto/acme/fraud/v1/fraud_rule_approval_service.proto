syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudRuleApprovalServiceProto";
option java_package = "com.acme.fraud.v1";

// Routes fraud rules through approval, with escalation and delegation.
service FraudRuleApprovalService {
  // Submits a fraud rule.
  rpc SubmitFraudRule(SubmitFraudRuleRequest) returns (SubmitFraudRuleResponse);

  // Approves a fraud rule.
  rpc ApproveFraudRule(ApproveFraudRuleRequest) returns (ApproveFraudRuleResponse);

  // Escalates a fraud rule.
  rpc EscalateFraudRule(EscalateFraudRuleRequest) returns (EscalateFraudRuleResponse);

  // Lists fraud rules a page at a time.
  rpc ListPendingFraudRules(ListPendingFraudRulesRequest) returns (ListPendingFraudRulesResponse);

  // Delegates a fraud rule.
  rpc DelegateFraudRuleApproval(DelegateFraudRuleApprovalRequest) returns (DelegateFraudRuleApprovalResponse);

  // Returns a fraud rule.
  rpc GetFraudRuleApprovalStatus(GetFraudRuleApprovalStatusRequest) returns (GetFraudRuleApprovalStatusResponse);

  // Comments a fraud rule.
  rpc CommentFraudRuleApproval(CommentFraudRuleApprovalRequest) returns (CommentFraudRuleApprovalResponse);
}

// The request of `SubmitFraudRule`.
message SubmitFraudRuleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_rule_id = 2;
  FraudRule fraud_rule = 3;
  SubmitFraudRuleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFraudRule`.
message SubmitFraudRuleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudRule fraud_rule = 1;
  SubmitFraudRuleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveFraudRule`.
message ApproveFraudRuleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
