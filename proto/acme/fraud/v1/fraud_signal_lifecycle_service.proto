syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudSignalLifecycleServiceProto";
option java_package = "com.acme.fraud.v1";

// Moves a fraud signal between the states of its lifecycle.
service FraudSignalLifecycleService {
  // Activates a fraud signal.
  rpc ActivateFraudSignal(ActivateFraudSignalRequest) returns (ActivateFraudSignalResponse);

  // Suspends a fraud signal.
  rpc SuspendFraudSignal(SuspendFraudSignalRequest) returns (SuspendFraudSignalResponse);

  // Terminates a fraud signal.
  rpc TerminateFraudSignal(TerminateFraudSignalRequest) returns (TerminateFraudSignalResponse);

  // Renews a fraud signal.
  rpc RenewFraudSignal(RenewFraudSignalRequest) returns (RenewFraudSignalResponse);

  // Expires a fraud signal.
  rpc ExpireFraudSignal(ExpireFraudSignalRequest) returns (ExpireFraudSignalResponse);

  // Returns a fraud signal.
  rpc GetFraudSignalLifecycle(GetFraudSignalLifecycleRequest) returns (GetFraudSignalLifecycleResponse);

  // Schedules a fraud signal.
  rpc ScheduleFraudSignalExpiry(ScheduleFraudSignalExpiryRequest) returns (ScheduleFraudSignalExpiryResponse);
}

// The request of `ActivateFraudSignal`.
message ActivateFraudSignalRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_signal_id = 2;
  ActivateFraudSignalRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFraudSignal`.
message ActivateFraudSignalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudSignal fraud_signal = 1;
  ActivateFraudSignalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

