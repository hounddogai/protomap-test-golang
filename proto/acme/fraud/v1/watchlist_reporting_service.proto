syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "WatchlistReportingServiceProto";
option java_package = "com.acme.fraud.v1";

// Builds and schedules reports about watchlists.
service WatchlistReportingService {
  // Generates a watchlist.
  rpc GenerateWatchlistReport(GenerateWatchlistReportRequest) returns (GenerateWatchlistReportResponse);

  // Returns a watchlist.
  rpc FetchWatchlistReport(FetchWatchlistReportRequest) returns (FetchWatchlistReportResponse);

  // Schedules a watchlist.
  rpc ScheduleWatchlistReport(ScheduleWatchlistReportRequest) returns (ScheduleWatchlistReportResponse);

  // Streams the changes of watchlists as they happen.
  rpc StreamWatchlistMetrics(StreamWatchlistMetricsRequest) returns (stream StreamWatchlistMetricsResponse);

  // Lists watchlists a page at a time.
  rpc ListWatchlistReports(ListWatchlistReportsRequest) returns (ListWatchlistReportsResponse);

  // Counts watchlists by status.
  rpc CountWatchlistTotals(CountWatchlistTotalsRequest) returns (CountWatchlistTotalsResponse);

  // Deletes a watchlist.
  rpc DeleteWatchlistReport(DeleteWatchlistReportRequest) returns (DeleteWatchlistReportResponse);
}

// The request of `GenerateWatchlistReport`.
message GenerateWatchlistReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  GenerateWatchlistReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateWatchlistReport`.
message GenerateWatchlistReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchWatchlistReport`.
message FetchWatchlistReportRequest {
  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchWatchlistReport`.
message FetchWatchlistReportResponse {
  Watchlist watchlist = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleWatchlistReport`.
message ScheduleWatchlistReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  ScheduleWatchlistReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleWatchlistReport`.
message ScheduleWatchlistReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamWatchlistMetrics`.
message StreamWatchlistMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WatchlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamWatchlistMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamWatchlistMetrics`.
message StreamWatchlistMetricsResponse {
  Watchlist watchlist = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListWatchlistReports`.
message ListWatchlistReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WatchlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWatchlistReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWatchlistReports`.
message ListWatchlistReportsResponse {
  repeated Watchlist watchlists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountWatchlistTotals`.
message CountWatchlistTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WatchlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountWatchlistTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountWatchlistTotals`.
message CountWatchlistTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteWatchlistReport`.
message DeleteWatchlistReportRequest {
  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteWatchlistReport`.
message DeleteWatchlistReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
