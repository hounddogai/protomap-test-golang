syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/fraud/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudProto";
option java_package = "com.acme.fraud.v1";

// Where a risk assessment is in its lifecycle.
enum RiskAssessmentStatus {
  RISK_ASSESSMENT_STATUS_UNSPECIFIED = 0;
  RISK_ASSESSMENT_STATUS_NEW = 1;
  RISK_ASSESSMENT_STATUS_OPEN = 2;
  RISK_ASSESSMENT_STATUS_WAITING = 3;
  RISK_ASSESSMENT_STATUS_RESOLVED = 4;
  RISK_ASSESSMENT_STATUS_CLOSED = 5;
}

// Where a fraud signal is in its lifecycle.
enum FraudSignalStatus {
  FRAUD_SIGNAL_STATUS_UNSPECIFIED = 0;
  FRAUD_SIGNAL_STATUS_RECEIVED = 1;
  FRAUD_SIGNAL_STATUS_PROCESSED = 2;
  FRAUD_SIGNAL_STATUS_DISCARDED = 3;
}

// Where a fraud rule is in its lifecycle.
enum FraudRuleStatus {
  FRAUD_RULE_STATUS_UNSPECIFIED = 0;
  FRAUD_RULE_STATUS_DRAFT = 1;
  FRAUD_RULE_STATUS_ENABLED = 2;
  FRAUD_RULE_STATUS_DISABLED = 3;
  FRAUD_RULE_STATUS_RETIRED = 4;
}

// Where a watchlist is in its lifecycle.
enum WatchlistStatus {
  WATCHLIST_STATUS_UNSPECIFIED = 0;
  WATCHLIST_STATUS_ACTIVE = 1;
  WATCHLIST_STATUS_INACTIVE = 2;
}

// The comment of a risk assessment.
message RiskAssessmentComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a risk assessment.
message RiskAssessmentSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a risk assessment.
message RiskAssessmentChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a risk assessment.
message RiskAssessmentStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A risk assessment of the fraud domain.
message RiskAssessment {
  string risk_assessment_id = 1;
  string subject = 2;
  RiskAssessmentStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated RiskAssessmentComment comments = 7;
  RiskAssessmentSla sla = 8;
  oneof origin {
    acme.customers.v1.CustomerRef customer = 9;
    string external_reference = 10;
    RiskAssessmentChannelOrigin channel = 11;
  }
  repeated RiskAssessmentStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The measurement of a fraud signal.
message FraudSignalMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A fraud signal of the fraud domain.
message FraudSignal {
  string fraud_signal_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  FraudRuleRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated FraudSignalMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of a fraud rule.
message FraudRuleCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a fraud rule.
message FraudRuleDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a fraud rule.
message FraudRuleRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a fraud rule.
message FraudRuleBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A fraud rule of the fraud domain.
message FraudRule {
  string fraud_rule_id = 1;
  string name = 2;
  string description = 3;
  FraudRuleStatus status = 4;
  int32 priority = 5;
  repeated FraudRuleCondition conditions = 6;
  oneof action {
    FraudRuleDiscountAction discount = 7;
    FraudRuleRouteAction route = 8;
    FraudRuleBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// A watchlist of the fraud domain.
message Watchlist {
  string watchlist_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated Watchlist children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  WatchlistStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}
