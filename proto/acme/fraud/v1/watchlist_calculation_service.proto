syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "WatchlistCalculationServiceProto";
option java_package = "com.acme.fraud.v1";

// Computes the figures of a watchlist, such as totals, taxes, and estimates.
service WatchlistCalculationService {
  // Calculates a watchlist.
  rpc CalculateWatchlist(CalculateWatchlistRequest) returns (CalculateWatchlistResponse);

  // Estimates a watchlist.
  rpc EstimateWatchlist(EstimateWatchlistRequest) returns (EstimateWatchlistResponse);

  // Quotes a watchlist.
  rpc QuoteWatchlist(QuoteWatchlistRequest) returns (QuoteWatchlistResponse);

  // Compares a watchlist.
  rpc CompareWatchlistOptions(CompareWatchlistOptionsRequest) returns (CompareWatchlistOptionsResponse);

  // Recalculates a watchlist.
  rpc RecalculateWatchlists(RecalculateWatchlistsRequest) returns (RecalculateWatchlistsResponse);

  // Simulates a watchlist.
  rpc SimulateWatchlist(SimulateWatchlistRequest) returns (SimulateWatchlistResponse);

  // Explains a watchlist.
  rpc ExplainWatchlistCalculation(ExplainWatchlistCalculationRequest) returns (ExplainWatchlistCalculationResponse);

  // Returns a watchlist.
  rpc GetWatchlistRates(GetWatchlistRatesRequest) returns (GetWatchlistRatesResponse);
}

// The request of `CalculateWatchlist`.
message CalculateWatchlistRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  Watchlist watchlist = 3;
  CalculateWatchlistRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateWatchlist`.
message CalculateWatchlistResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateWatchlistResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Watchlist watchlist = 1;
  CalculateWatchlistResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

