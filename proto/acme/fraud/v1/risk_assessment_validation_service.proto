syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "RiskAssessmentValidationServiceProto";
option java_package = "com.acme.fraud.v1";

// Checks risk assessments against the rules before anything acts on them.
service RiskAssessmentValidationService {
  // Validates a risk assessment.
  rpc ValidateRiskAssessment(ValidateRiskAssessmentRequest) returns (ValidateRiskAssessmentResponse);

  // Previews a risk assessment.
  rpc PreviewRiskAssessment(PreviewRiskAssessmentRequest) returns (PreviewRiskAssessmentResponse);

  // Checks a risk assessment.
  rpc CheckRiskAssessmentEligibility(CheckRiskAssessmentEligibilityRequest) returns (CheckRiskAssessmentEligibilityResponse);

  // Normalizes a risk assessment.
  rpc NormalizeRiskAssessment(NormalizeRiskAssessmentRequest) returns (NormalizeRiskAssessmentResponse);

  // Explains a risk assessment.
  rpc ExplainRiskAssessmentDecision(ExplainRiskAssessmentDecisionRequest) returns (ExplainRiskAssessmentDecisionResponse);

  // Scores a risk assessment.
  rpc ScoreRiskAssessment(ScoreRiskAssessmentRequest) returns (ScoreRiskAssessmentResponse);

  // Lints a risk assessment.
  rpc LintRiskAssessments(LintRiskAssessmentsRequest) returns (LintRiskAssessmentsResponse);
}

// The request of `ValidateRiskAssessment`.
message ValidateRiskAssessmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  RiskAssessment risk_assessment = 3;
  ValidateRiskAssessmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRiskAssessment`.
message ValidateRiskAssessmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskAssessment risk_assessment = 1;
  ValidateRiskAssessmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

