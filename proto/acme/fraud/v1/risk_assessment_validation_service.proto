// The request of `ScoreRiskAssessment`.
message ScoreRiskAssessmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  RiskAssessment risk_assessment = 3;
  ScoreRiskAssessmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreRiskAssessment`.
message ScoreRiskAssessmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreRiskAssessmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  RiskAssessment risk_assessment = 1;
  ScoreRiskAssessmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

