    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFraudSignalWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFraudSignalWorkflows`.
message ListFraudSignalWorkflowsResponse {
  repeated FraudSignal fraud_signals = 1;
