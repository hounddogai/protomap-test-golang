syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudSignalCalculationServiceProto";
option java_package = "com.acme.fraud.v1";

// Computes the figures of a fraud signal, such as totals, taxes, and estimates.
service FraudSignalCalculationService {
  // Calculates a fraud signal.
  rpc CalculateFraudSignal(CalculateFraudSignalRequest) returns (CalculateFraudSignalResponse);

  // Estimates a fraud signal.
  rpc EstimateFraudSignal(EstimateFraudSignalRequest) returns (EstimateFraudSignalResponse);

  // Quotes a fraud signal.
  rpc QuoteFraudSignal(QuoteFraudSignalRequest) returns (QuoteFraudSignalResponse);

  // Compares a fraud signal.
  rpc CompareFraudSignalOptions(CompareFraudSignalOptionsRequest) returns (CompareFraudSignalOptionsResponse);

  // Recalculates a fraud signal.
  rpc RecalculateFraudSignals(RecalculateFraudSignalsRequest) returns (RecalculateFraudSignalsResponse);

  // Simulates a fraud signal.
  rpc SimulateFraudSignal(SimulateFraudSignalRequest) returns (SimulateFraudSignalResponse);

  // Explains a fraud signal.
  rpc ExplainFraudSignalCalculation(ExplainFraudSignalCalculationRequest) returns (ExplainFraudSignalCalculationResponse);

  // Returns a fraud signal.
  rpc GetFraudSignalRates(GetFraudSignalRatesRequest) returns (GetFraudSignalRatesResponse);
}

// The request of `CalculateFraudSignal`.
message CalculateFraudSignalRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_signal_id = 2;
  FraudSignal fraud_signal = 3;
  CalculateFraudSignalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFraudSignal`.
message CalculateFraudSignalResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFraudSignalResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FraudSignal fraud_signal = 1;
  CalculateFraudSignalResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

