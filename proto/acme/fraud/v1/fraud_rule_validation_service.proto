syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudRuleValidationServiceProto";
option java_package = "com.acme.fraud.v1";

// Checks fraud rules against the rules before anything acts on them.
service FraudRuleValidationService {
  // Validates a fraud rule.
  rpc ValidateFraudRule(ValidateFraudRuleRequest) returns (ValidateFraudRuleResponse);

  // Previews a fraud rule.
  rpc PreviewFraudRule(PreviewFraudRuleRequest) returns (PreviewFraudRuleResponse);

  // Normalizes a fraud rule.
  rpc NormalizeFraudRule(NormalizeFraudRuleRequest) returns (NormalizeFraudRuleResponse);

  // Explains a fraud rule.
  rpc ExplainFraudRuleDecision(ExplainFraudRuleDecisionRequest) returns (ExplainFraudRuleDecisionResponse);

  // Scores a fraud rule.
  rpc ScoreFraudRule(ScoreFraudRuleRequest) returns (ScoreFraudRuleResponse);

  // Lints a fraud rule.
  rpc LintFraudRules(LintFraudRulesRequest) returns (LintFraudRulesResponse);

  // Returns a fraud rule.
  rpc GetFraudRuleRules(GetFraudRuleRulesRequest) returns (GetFraudRuleRulesResponse);
}

// The request of `ValidateFraudRule`.
message ValidateFraudRuleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_rule_id = 2;
  FraudRule fraud_rule = 3;
  ValidateFraudRuleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFraudRule`.
message ValidateFraudRuleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudRule fraud_rule = 1;
  ValidateFraudRuleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

