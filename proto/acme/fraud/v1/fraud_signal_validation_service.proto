syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudSignalValidationServiceProto";
option java_package = "com.acme.fraud.v1";

// Checks fraud signals against the rules before anything acts on them.
service FraudSignalValidationService {
  // Validates a fraud signal.
  rpc ValidateFraudSignal(ValidateFraudSignalRequest) returns (ValidateFraudSignalResponse);

  // Previews a fraud signal.
  rpc PreviewFraudSignal(PreviewFraudSignalRequest) returns (PreviewFraudSignalResponse);

  // Checks a fraud signal.
  rpc CheckFraudSignalEligibility(CheckFraudSignalEligibilityRequest) returns (CheckFraudSignalEligibilityResponse);

  // Normalizes a fraud signal.
  rpc NormalizeFraudSignal(NormalizeFraudSignalRequest) returns (NormalizeFraudSignalResponse);

  // Lints a fraud signal.
  rpc LintFraudSignals(LintFraudSignalsRequest) returns (LintFraudSignalsResponse);

  // Returns a fraud signal.
  rpc GetFraudSignalRules(GetFraudSignalRulesRequest) returns (GetFraudSignalRulesResponse);
}

// The request of `ValidateFraudSignal`.
message ValidateFraudSignalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_signal_id = 2;
  FraudSignal fraud_signal = 3;
  ValidateFraudSignalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFraudSignal`.
message ValidateFraudSignalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudSignal fraud_signal = 1;
  ValidateFraudSignalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

