syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "WatchlistValidationServiceProto";
option java_package = "com.acme.fraud.v1";

// Checks watchlists against the rules before anything acts on them.
service WatchlistValidationService {
  // Validates a watchlist.
  rpc ValidateWatchlist(ValidateWatchlistRequest) returns (ValidateWatchlistResponse);

  // Previews a watchlist.
  rpc PreviewWatchlist(PreviewWatchlistRequest) returns (PreviewWatchlistResponse);

  // Checks a watchlist.
  rpc CheckWatchlistEligibility(CheckWatchlistEligibilityRequest) returns (CheckWatchlistEligibilityResponse);

  // Normalizes a watchlist.
  rpc NormalizeWatchlist(NormalizeWatchlistRequest) returns (NormalizeWatchlistResponse);

  // Explains a watchlist.
  rpc ExplainWatchlistDecision(ExplainWatchlistDecisionRequest) returns (ExplainWatchlistDecisionResponse);

  // Scores a watchlist.
  rpc ScoreWatchlist(ScoreWatchlistRequest) returns (ScoreWatchlistResponse);

  // Lints a watchlist.
  rpc LintWatchlists(LintWatchlistsRequest) returns (LintWatchlistsResponse);

  // Returns a watchlist.
  rpc GetWatchlistRules(GetWatchlistRulesRequest) returns (GetWatchlistRulesResponse);
}

// The request of `ValidateWatchlist`.
message ValidateWatchlistRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string watchlist_id = 2;
  Watchlist watchlist = 3;
  ValidateWatchlistRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateWatchlist`.
message ValidateWatchlistResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Watchlist watchlist = 1;
  ValidateWatchlistResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

