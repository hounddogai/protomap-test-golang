syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "RiskAssessmentServiceProto";
option java_package = "com.acme.fraud.v1";

// Manages risk assessments: creates, reads, changes, and lists them.
service RiskAssessmentService {
  // Creates a risk assessment.
  rpc CreateRiskAssessment(CreateRiskAssessmentRequest) returns (CreateRiskAssessmentResponse);

  // Returns a risk assessment.
  rpc GetRiskAssessment(GetRiskAssessmentRequest) returns (GetRiskAssessmentResponse);

  // Changes a risk assessment.
  rpc UpdateRiskAssessment(UpdateRiskAssessmentRequest) returns (UpdateRiskAssessmentResponse);

  // Returns several risk assessments at once.
  rpc BatchGetRiskAssessments(BatchGetRiskAssessmentsRequest) returns (BatchGetRiskAssessmentsResponse);

  // Lists risk assessments a page at a time.
  rpc SearchRiskAssessments(SearchRiskAssessmentsRequest) returns (SearchRiskAssessmentsResponse);

  // Takes a stream of risk assessments and answers once at the end.
  rpc BatchCreateRiskAssessments(stream BatchCreateRiskAssessmentsRequest) returns (BatchCreateRiskAssessmentsResponse);
}

// The request of `CreateRiskAssessment`.
message CreateRiskAssessmentRequest {
  acme.common.v1.RequestContext context = 1;
  RiskAssessment risk_assessment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateRiskAssessment`.
message CreateRiskAssessmentResponse {
  RiskAssessment risk_assessment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetRiskAssessment`.
message GetRiskAssessmentRequest {
  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRiskAssessment`.
message GetRiskAssessmentResponse {
  RiskAssessment risk_assessment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateRiskAssessment`.
message UpdateRiskAssessmentRequest {
  acme.common.v1.RequestContext context = 1;
  RiskAssessment risk_assessment = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateRiskAssessment`.
message UpdateRiskAssessmentResponse {
  RiskAssessment risk_assessment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BatchGetRiskAssessments`.
message BatchGetRiskAssessmentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string risk_assessment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetRiskAssessments`.
message BatchGetRiskAssessmentsResponse {
  repeated RiskAssessment risk_assessments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchRiskAssessments`.
message SearchRiskAssessmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RiskAssessmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchRiskAssessmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchRiskAssessments`.
message SearchRiskAssessmentsResponse {
  repeated RiskAssessment risk_assessments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchCreateRiskAssessments`.
message BatchCreateRiskAssessmentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateRiskAssessmentsRequest.StreamHeader header = 2;
    RiskAssessment record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateRiskAssessments`.
message BatchCreateRiskAssessmentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string risk_assessment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateRiskAssessmentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}
