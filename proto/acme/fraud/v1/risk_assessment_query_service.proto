syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "RiskAssessmentQueryServiceProto";
option java_package = "com.acme.fraud.v1";

// Answers read-only questions about risk assessments, for screens and reports.
service RiskAssessmentQueryService {
  // Returns a risk assessment.
  rpc LookupRiskAssessment(LookupRiskAssessmentRequest) returns (LookupRiskAssessmentResponse);

  // Lists risk assessments a page at a time.
  rpc BrowseRiskAssessments(BrowseRiskAssessmentsRequest) returns (BrowseRiskAssessmentsResponse);

  // Lists risk assessments a page at a time.
  rpc FindRiskAssessments(FindRiskAssessmentsRequest) returns (FindRiskAssessmentsResponse);

  // Returns several risk assessments at once.
  rpc ResolveRiskAssessments(ResolveRiskAssessmentsRequest) returns (ResolveRiskAssessmentsResponse);

  // Summarizes a risk assessment.
  rpc SummarizeRiskAssessments(SummarizeRiskAssessmentsRequest) returns (SummarizeRiskAssessmentsResponse);

  // Lists risk assessments a page at a time.
  rpc SuggestRiskAssessments(SuggestRiskAssessmentsRequest) returns (SuggestRiskAssessmentsResponse);

  // Returns a risk assessment.
  rpc PeekRiskAssessment(PeekRiskAssessmentRequest) returns (PeekRiskAssessmentResponse);
}

// The request of `LookupRiskAssessment`.
message LookupRiskAssessmentRequest {
  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRiskAssessment`.
message LookupRiskAssessmentResponse {
  RiskAssessment risk_assessment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRiskAssessments`.
message BrowseRiskAssessmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RiskAssessmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRiskAssessmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRiskAssessments`.
message BrowseRiskAssessmentsResponse {
  repeated RiskAssessment risk_assessments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindRiskAssessments`.
message FindRiskAssessmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RiskAssessmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindRiskAssessmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindRiskAssessments`.
message FindRiskAssessmentsResponse {
  repeated RiskAssessment risk_assessments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveRiskAssessments`.
message ResolveRiskAssessmentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string risk_assessment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveRiskAssessments`.
message ResolveRiskAssessmentsResponse {
  repeated RiskAssessment risk_assessments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeRiskAssessments`.
message SummarizeRiskAssessmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  SummarizeRiskAssessmentsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeRiskAssessments`.
message SummarizeRiskAssessmentsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestRiskAssessments`.
message SuggestRiskAssessmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RiskAssessmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestRiskAssessmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestRiskAssessments`.
message SuggestRiskAssessmentsResponse {
  repeated RiskAssessment risk_assessments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekRiskAssessment`.
message PeekRiskAssessmentRequest {
  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekRiskAssessment`.
message PeekRiskAssessmentResponse {
  RiskAssessment risk_assessment = 1;
  acme.common.v1.OperationResult result = 2;
}
