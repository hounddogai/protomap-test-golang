syntax = "proto3";

package acme.fraud.v1;

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.fraud.v1";

// A reference to a risk assessment of the fraud domain.
message RiskAssessmentRef {
  string risk_assessment_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a fraud signal of the fraud domain.
message FraudSignalRef {
  string fraud_signal_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a fraud rule of the fraud domain.
message FraudRuleRef {
  string fraud_rule_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a watchlist of the fraud domain.
message WatchlistRef {
  string watchlist_id = 1;
  string display_name = 2;
  string path = 3;
}
