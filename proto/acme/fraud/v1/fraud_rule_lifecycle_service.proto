syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fraud/v1/fraud.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudRuleLifecycleServiceProto";
option java_package = "com.acme.fraud.v1";

// Moves a fraud rule between the states of its lifecycle.
service FraudRuleLifecycleService {
  // Activates a fraud rule.
  rpc ActivateFraudRule(ActivateFraudRuleRequest) returns (ActivateFraudRuleResponse);

  // Suspends a fraud rule.
  rpc SuspendFraudRule(SuspendFraudRuleRequest) returns (SuspendFraudRuleResponse);

  // Reinstates a fraud rule.
  rpc ReinstateFraudRule(ReinstateFraudRuleRequest) returns (ReinstateFraudRuleResponse);

  // Terminates a fraud rule.
  rpc TerminateFraudRule(TerminateFraudRuleRequest) returns (TerminateFraudRuleResponse);

  // Expires a fraud rule.
  rpc ExpireFraudRule(ExpireFraudRuleRequest) returns (ExpireFraudRuleResponse);

  // Schedules a fraud rule.
  rpc ScheduleFraudRuleExpiry(ScheduleFraudRuleExpiryRequest) returns (ScheduleFraudRuleExpiryResponse);
}

// The request of `ActivateFraudRule`.
message ActivateFraudRuleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_rule_id = 2;
  ActivateFraudRuleRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFraudRule`.
message ActivateFraudRuleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudRule fraud_rule = 1;
  ActivateFraudRuleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

