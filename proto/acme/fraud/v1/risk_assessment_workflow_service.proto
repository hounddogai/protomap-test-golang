syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "RiskAssessmentWorkflowServiceProto";
option java_package = "com.acme.fraud.v1";

// Runs the long-lived workflow that takes a risk assessment from start to finish.
service RiskAssessmentWorkflowService {
  // Starts a risk assessment.
  rpc StartRiskAssessmentWorkflow(StartRiskAssessmentWorkflowRequest) returns (StartRiskAssessmentWorkflowResponse);

  // Advances a risk assessment.
  rpc AdvanceRiskAssessmentWorkflow(AdvanceRiskAssessmentWorkflowRequest) returns (AdvanceRiskAssessmentWorkflowResponse);

  // Cancels a risk assessment.
  rpc CancelRiskAssessmentWorkflow(CancelRiskAssessmentWorkflowRequest) returns (CancelRiskAssessmentWorkflowResponse);

  // Retrys a risk assessment.
  rpc RetryRiskAssessmentWorkflow(RetryRiskAssessmentWorkflowRequest) returns (RetryRiskAssessmentWorkflowResponse);

  // Pauses a risk assessment.
  rpc PauseRiskAssessmentWorkflow(PauseRiskAssessmentWorkflowRequest) returns (PauseRiskAssessmentWorkflowResponse);

  // Resumes a risk assessment.
  rpc ResumeRiskAssessmentWorkflow(ResumeRiskAssessmentWorkflowRequest) returns (ResumeRiskAssessmentWorkflowResponse);

  // Returns a risk assessment.
  rpc InspectRiskAssessmentWorkflow(InspectRiskAssessmentWorkflowRequest) returns (InspectRiskAssessmentWorkflowResponse);

  // Lists risk assessments a page at a time.
  rpc ListRiskAssessmentWorkflows(ListRiskAssessmentWorkflowsRequest) returns (ListRiskAssessmentWorkflowsResponse);

  // Signals a risk assessment.
  rpc SignalRiskAssessmentWorkflow(SignalRiskAssessmentWorkflowRequest) returns (SignalRiskAssessmentWorkflowResponse);
}

// The request of `StartRiskAssessmentWorkflow`.
message StartRiskAssessmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_assessment_id = 2;
  RiskAssessment risk_assessment = 3;
  StartRiskAssessmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRiskAssessmentWorkflow`.
message StartRiskAssessmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskAssessment risk_assessment = 1;
  StartRiskAssessmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

