syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudSignalApprovalServiceProto";
option java_package = "com.acme.fraud.v1";

// Routes fraud signals through approval, with escalation and delegation.
service FraudSignalApprovalService {
  // Submits a fraud signal.
  rpc SubmitFraudSignal(SubmitFraudSignalRequest) returns (SubmitFraudSignalResponse);

  // Approves a fraud signal.
  rpc ApproveFraudSignal(ApproveFraudSignalRequest) returns (ApproveFraudSignalResponse);

  // Rejects a fraud signal.
  rpc RejectFraudSignal(RejectFraudSignalRequest) returns (RejectFraudSignalResponse);

  // Escalates a fraud signal.
  rpc EscalateFraudSignal(EscalateFraudSignalRequest) returns (EscalateFraudSignalResponse);

  // Lists fraud signals a page at a time.
  rpc ListPendingFraudSignals(ListPendingFraudSignalsRequest) returns (ListPendingFraudSignalsResponse);

  // Recalls a fraud signal.
  rpc RecallFraudSignal(RecallFraudSignalRequest) returns (RecallFraudSignalResponse);

  // Returns a fraud signal.
  rpc GetFraudSignalApprovalStatus(GetFraudSignalApprovalStatusRequest) returns (GetFraudSignalApprovalStatusResponse);

  // Comments a fraud signal.
  rpc CommentFraudSignalApproval(CommentFraudSignalApprovalRequest) returns (CommentFraudSignalApprovalResponse);
}

// The request of `SubmitFraudSignal`.
message SubmitFraudSignalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_signal_id = 2;
  FraudSignal fraud_signal = 3;
  SubmitFraudSignalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFraudSignal`.
message SubmitFraudSignalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudSignal fraud_signal = 1;
  SubmitFraudSignalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

