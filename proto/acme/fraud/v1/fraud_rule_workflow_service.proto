syntax = "proto3";

package acme.fraud.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fraud/v1/fraud.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fraud.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fraud/v1;fraudv1";
option java_multiple_files = true;
option java_outer_classname = "FraudRuleWorkflowServiceProto";
option java_package = "com.acme.fraud.v1";

// Runs the long-lived workflow that takes a fraud rule from start to finish.
service FraudRuleWorkflowService {
  // Starts a fraud rule.
  rpc StartFraudRuleWorkflow(StartFraudRuleWorkflowRequest) returns (StartFraudRuleWorkflowResponse);

  // Advances a fraud rule.
  rpc AdvanceFraudRuleWorkflow(AdvanceFraudRuleWorkflowRequest) returns (AdvanceFraudRuleWorkflowResponse);

  // Cancels a fraud rule.
  rpc CancelFraudRuleWorkflow(CancelFraudRuleWorkflowRequest) returns (CancelFraudRuleWorkflowResponse);

  // Retrys a fraud rule.
  rpc RetryFraudRuleWorkflow(RetryFraudRuleWorkflowRequest) returns (RetryFraudRuleWorkflowResponse);

  // Pauses a fraud rule.
  rpc PauseFraudRuleWorkflow(PauseFraudRuleWorkflowRequest) returns (PauseFraudRuleWorkflowResponse);

  // Resumes a fraud rule.
  rpc ResumeFraudRuleWorkflow(ResumeFraudRuleWorkflowRequest) returns (ResumeFraudRuleWorkflowResponse);

  // Returns a fraud rule.
  rpc InspectFraudRuleWorkflow(InspectFraudRuleWorkflowRequest) returns (InspectFraudRuleWorkflowResponse);

  // Lists fraud rules a page at a time.
  rpc ListFraudRuleWorkflows(ListFraudRuleWorkflowsRequest) returns (ListFraudRuleWorkflowsResponse);

  // Signals a fraud rule.
  rpc SignalFraudRuleWorkflow(SignalFraudRuleWorkflowRequest) returns (SignalFraudRuleWorkflowResponse);
}

// The request of `StartFraudRuleWorkflow`.
message StartFraudRuleWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fraud_rule_id = 2;
  FraudRule fraud_rule = 3;
  StartFraudRuleWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFraudRuleWorkflow`.
message StartFraudRuleWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FraudRule fraud_rule = 1;
  StartFraudRuleWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

