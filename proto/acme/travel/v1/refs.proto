syntax = "proto3";

package acme.travel.v1;

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.travel.v1";

// A reference to a trip of the travel domain.
message TripRef {
  string trip_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a travel booking of the travel domain.
message TravelBookingRef {
  string travel_booking_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a travel policy of the travel domain.
message TravelPolicyRef {
  string travel_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an itinerary of the travel domain.
message ItineraryRef {
  string itinerary_id = 1;
  string display_name = 2;
  string number = 3;
}
