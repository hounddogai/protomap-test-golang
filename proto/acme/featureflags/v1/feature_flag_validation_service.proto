syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FeatureFlagValidationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Checks feature flags against the rules before anything acts on them.
service FeatureFlagValidationService {
  // Validates a feature flag.
  rpc ValidateFeatureFlag(ValidateFeatureFlagRequest) returns (ValidateFeatureFlagResponse);

  // Previews a feature flag.
  rpc PreviewFeatureFlag(PreviewFeatureFlagRequest) returns (PreviewFeatureFlagResponse);

  // Checks a feature flag.
  rpc CheckFeatureFlagEligibility(CheckFeatureFlagEligibilityRequest) returns (CheckFeatureFlagEligibilityResponse);

  // Normalizes a feature flag.
  rpc NormalizeFeatureFlag(NormalizeFeatureFlagRequest) returns (NormalizeFeatureFlagResponse);

  // Explains a feature flag.
  rpc ExplainFeatureFlagDecision(ExplainFeatureFlagDecisionRequest) returns (ExplainFeatureFlagDecisionResponse);

  // Scores a feature flag.
  rpc ScoreFeatureFlag(ScoreFeatureFlagRequest) returns (ScoreFeatureFlagResponse);

  // Lints a feature flag.
  rpc LintFeatureFlags(LintFeatureFlagsRequest) returns (LintFeatureFlagsResponse);

  // Returns a feature flag.
  rpc GetFeatureFlagRules(GetFeatureFlagRulesRequest) returns (GetFeatureFlagRulesResponse);
}

// The request of `ValidateFeatureFlag`.
message ValidateFeatureFlagRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  FeatureFlag feature_flag = 3;
  ValidateFeatureFlagRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFeatureFlag`.
message ValidateFeatureFlagResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  ValidateFeatureFlagResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

