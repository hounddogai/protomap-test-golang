syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FeatureFlagQueryServiceProto";
option java_package = "com.acme.featureflags.v1";

// Answers read-only questions about feature flags, for screens and reports.
service FeatureFlagQueryService {
  // Returns a feature flag.
  rpc LookupFeatureFlag(LookupFeatureFlagRequest) returns (LookupFeatureFlagResponse);

  // Lists feature flags a page at a time.
  rpc BrowseFeatureFlags(BrowseFeatureFlagsRequest) returns (BrowseFeatureFlagsResponse);

  // Counts feature flags by status.
  rpc CountFeatureFlags(CountFeatureFlagsRequest) returns (CountFeatureFlagsResponse);

  // Streams every matching feature flag.
  rpc ExportFeatureFlags(ExportFeatureFlagsRequest) returns (stream ExportFeatureFlagsResponse);

  // Summarizes a feature flag.
  rpc SummarizeFeatureFlags(SummarizeFeatureFlagsRequest) returns (SummarizeFeatureFlagsResponse);

  // Lists feature flags a page at a time.
  rpc SuggestFeatureFlags(SuggestFeatureFlagsRequest) returns (SuggestFeatureFlagsResponse);

  // Returns a feature flag.
  rpc PeekFeatureFlag(PeekFeatureFlagRequest) returns (PeekFeatureFlagResponse);
}

// The request of `LookupFeatureFlag`.
message LookupFeatureFlagRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFeatureFlag`.
message LookupFeatureFlagResponse {
  FeatureFlag feature_flag = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFeatureFlags`.
message BrowseFeatureFlagsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureFlagStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFeatureFlagsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFeatureFlags`.
message BrowseFeatureFlagsResponse {
  repeated FeatureFlag feature_flags = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFeatureFlags`.
message CountFeatureFlagsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureFlagStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFeatureFlagsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFeatureFlags`.
message CountFeatureFlagsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFeatureFlags`.
message ExportFeatureFlagsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureFlagStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFeatureFlagsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFeatureFlags`.
message ExportFeatureFlagsResponse {
  FeatureFlag feature_flag = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFeatureFlags`.
message SummarizeFeatureFlagsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  SummarizeFeatureFlagsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFeatureFlags`.
message SummarizeFeatureFlagsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestFeatureFlags`.
message SuggestFeatureFlagsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureFlagStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestFeatureFlagsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestFeatureFlags`.
message SuggestFeatureFlagsResponse {
  repeated FeatureFlag feature_flags = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekFeatureFlag`.
message PeekFeatureFlagRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFeatureFlag`.
message PeekFeatureFlagResponse {
  FeatureFlag feature_flag = 1;
  acme.common.v1.OperationResult result = 2;
}
