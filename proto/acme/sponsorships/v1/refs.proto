syntax = "proto3";

package acme.sponsorships.v1;

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.sponsorships.v1";

// A reference to a sponsor of the sponsorships domain.
message SponsorRef {
  string sponsor_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to a sponsorship deal of the sponsorships domain.
message SponsorshipDealRef {
  string sponsorship_deal_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an activation of the sponsorships domain.
message ActivationRef {
  string activation_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
