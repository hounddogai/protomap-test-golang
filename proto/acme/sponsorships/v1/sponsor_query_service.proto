syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "SponsorQueryServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Answers read-only questions about sponsors, for screens and reports.
service SponsorQueryService {
  // Returns a sponsor.
  rpc LookupSponsor(LookupSponsorRequest) returns (LookupSponsorResponse);

  // Lists sponsors a page at a time.
  rpc BrowseSponsors(BrowseSponsorsRequest) returns (BrowseSponsorsResponse);

  // Lists sponsors a page at a time.
  rpc FindSponsors(FindSponsorsRequest) returns (FindSponsorsResponse);

  // Counts sponsors by status.
  rpc CountSponsors(CountSponsorsRequest) returns (CountSponsorsResponse);

  // Returns several sponsors at once.
  rpc ResolveSponsors(ResolveSponsorsRequest) returns (ResolveSponsorsResponse);

  // Streams every matching sponsor.
  rpc ExportSponsors(ExportSponsorsRequest) returns (stream ExportSponsorsResponse);

  // Summarizes a sponsor.
  rpc SummarizeSponsors(SummarizeSponsorsRequest) returns (SummarizeSponsorsResponse);

  // Lists sponsors a page at a time.
  rpc SuggestSponsors(SuggestSponsorsRequest) returns (SuggestSponsorsResponse);
}

// The request of `LookupSponsor`.
message LookupSponsorRequest {
  acme.common.v1.RequestContext context = 1;
  string sponsor_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSponsor`.
message LookupSponsorResponse {
  Sponsor sponsor = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSponsors`.
message BrowseSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSponsorsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSponsors`.
message BrowseSponsorsResponse {
  repeated Sponsor sponsors = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSponsors`.
message FindSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSponsorsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSponsors`.
message FindSponsorsResponse {
  repeated Sponsor sponsors = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSponsors`.
message CountSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSponsorsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSponsors`.
message CountSponsorsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSponsors`.
message ResolveSponsorsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string sponsor_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSponsors`.
message ResolveSponsorsResponse {
  repeated Sponsor sponsors = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSponsors`.
message ExportSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSponsorsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSponsors`.
message ExportSponsorsResponse {
  Sponsor sponsor = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSponsors`.
message SummarizeSponsorsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sponsor_id = 2;
  SummarizeSponsorsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSponsors`.
message SummarizeSponsorsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSponsors`.
message SuggestSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSponsorsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSponsors`.
message SuggestSponsorsResponse {
  repeated Sponsor sponsors = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
