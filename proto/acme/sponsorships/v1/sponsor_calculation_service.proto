}

// The response of `ExplainSponsorCalculation`.
message ExplainSponsorCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Sponsor sponsor = 1;
  ExplainSponsorCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetSponsorRates`.
message GetSponsorRatesRequest {
