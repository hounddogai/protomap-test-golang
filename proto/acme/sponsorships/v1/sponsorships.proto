syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/sponsorships/v1/refs.proto";
import "acme/venues/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "SponsorshipsProto";
option java_package = "com.acme.sponsorships.v1";

// Where a sponsor is in its lifecycle.
enum SponsorStatus {
  SPONSOR_STATUS_UNSPECIFIED = 0;
  SPONSOR_STATUS_PROSPECT = 1;
  SPONSOR_STATUS_ACTIVE = 2;
  SPONSOR_STATUS_SUSPENDED = 3;
  SPONSOR_STATUS_CLOSED = 4;
}

// Where a sponsorship deal is in its lifecycle.
enum SponsorshipDealStatus {
  SPONSORSHIP_DEAL_STATUS_UNSPECIFIED = 0;
  SPONSORSHIP_DEAL_STATUS_DRAFT = 1;
  SPONSORSHIP_DEAL_STATUS_ISSUED = 2;
  SPONSORSHIP_DEAL_STATUS_APPROVED = 3;
  SPONSORSHIP_DEAL_STATUS_PAID = 4;
  SPONSORSHIP_DEAL_STATUS_VOID = 5;
}

// Where an activation is in its lifecycle.
enum ActivationStatus {
  ACTIVATION_STATUS_UNSPECIFIED = 0;
  ACTIVATION_STATUS_NEW = 1;
  ACTIVATION_STATUS_OPEN = 2;
  ACTIVATION_STATUS_WAITING = 3;
  ACTIVATION_STATUS_RESOLVED = 4;
  ACTIVATION_STATUS_CLOSED = 5;
}

// The preferences of a sponsor.
message SponsorPreferences {
  string language = 1;
  bool marketing_opt_in = 2;
  repeated string channels = 3;
  acme.common.v1.TimeWindow quiet_hours = 4;
}

// The passport of a sponsor.
message SponsorPassport {
  string number = 1;
  string issuing_country = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// The national id of a sponsor.
message SponsorNationalId {
  string number = 1;
  string issuing_country = 2;
}

// A sponsor of the sponsorships domain.
message Sponsor {
  string sponsor_id = 1;
  acme.common.v1.PersonName name = 2;
  acme.common.v1.ContactInfo contact = 3;
  acme.common.v1.PostalAddress primary_address = 4;
  SponsorStatus status = 5;
  repeated string segments = 6;
  map<string, string> attributes = 7;
  SponsorPreferences preferences = 8;
  oneof identity_document {
    SponsorPassport passport = 9;
    SponsorNationalId national_id = 10;
    string tax_number = 11;
  }
  acme.identity.v1.UserRef relationship_manager = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a sponsorship deal.
message SponsorshipDealLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  SponsorshipDealLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a sponsorship deal line.
message SponsorshipDealLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a sponsorship deal.
message SponsorshipDealCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a sponsorship deal.
message SponsorshipDealBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a sponsorship deal.
message SponsorshipDealAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A sponsorship deal of the sponsorships domain.
message SponsorshipDeal {
  string sponsorship_deal_id = 1;
  string number = 2;
  SponsorshipDealStatus status = 3;
  SponsorRef counterparty = 4;
  repeated SponsorshipDealLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    SponsorshipDealCardSettlement card = 8;
    SponsorshipDealBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated SponsorshipDealAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of an activation.
message ActivationComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of an activation.
message ActivationSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of an activation.
message ActivationChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of an activation.
message ActivationStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// An activation of the sponsorships domain.
message Activation {
  string activation_id = 1;
  string subject = 2;
  ActivationStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ActivationComment comments = 7;
  ActivationSla sla = 8;
  oneof origin {
    acme.venues.v1.VenueRef customer = 9;
    string external_reference = 10;
    ActivationChannelOrigin channel = 11;
  }
  repeated ActivationStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
