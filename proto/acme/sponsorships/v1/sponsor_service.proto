syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "SponsorServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Manages sponsors: creates, reads, changes, and lists them.
service SponsorService {
  // Creates a sponsor.
  rpc CreateSponsor(CreateSponsorRequest) returns (CreateSponsorResponse);

  // Returns a sponsor.
  rpc GetSponsor(GetSponsorRequest) returns (GetSponsorResponse);

  // Changes a sponsor.
  rpc UpdateSponsor(UpdateSponsorRequest) returns (UpdateSponsorResponse);

  // Deletes a sponsor.
  rpc DeleteSponsor(DeleteSponsorRequest) returns (DeleteSponsorResponse);

  // Lists sponsors a page at a time.
  rpc ListSponsors(ListSponsorsRequest) returns (ListSponsorsResponse);

  // Streams the changes of sponsors as they happen.
  rpc WatchSponsors(WatchSponsorsRequest) returns (stream WatchSponsorsResponse);

  // Takes a stream of sponsors and answers once at the end.
  rpc BatchCreateSponsors(stream BatchCreateSponsorsRequest) returns (BatchCreateSponsorsResponse);

  // Creates a sponsor.
  rpc CloneSponsor(CloneSponsorRequest) returns (CloneSponsorResponse);
}

// The request of `CreateSponsor`.
message CreateSponsorRequest {
  acme.common.v1.RequestContext context = 1;
  Sponsor sponsor = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateSponsor`.
message CreateSponsorResponse {
  Sponsor sponsor = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetSponsor`.
message GetSponsorRequest {
  acme.common.v1.RequestContext context = 1;
  string sponsor_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSponsor`.
message GetSponsorResponse {
  Sponsor sponsor = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateSponsor`.
message UpdateSponsorRequest {
  acme.common.v1.RequestContext context = 1;
  Sponsor sponsor = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateSponsor`.
message UpdateSponsorResponse {
  Sponsor sponsor = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteSponsor`.
message DeleteSponsorRequest {
  acme.common.v1.RequestContext context = 1;
  string sponsor_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSponsor`.
message DeleteSponsorResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListSponsors`.
message ListSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSponsorsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSponsors`.
message ListSponsorsResponse {
  repeated Sponsor sponsors = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchSponsors`.
message WatchSponsorsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SponsorStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchSponsorsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchSponsors`.
message WatchSponsorsResponse {
  Sponsor sponsor = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateSponsors`.
message BatchCreateSponsorsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateSponsorsRequest.StreamHeader header = 2;
    Sponsor record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateSponsors`.
message BatchCreateSponsorsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string sponsor_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateSponsorsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneSponsor`.
message CloneSponsorRequest {
  acme.common.v1.RequestContext context = 1;
  Sponsor sponsor = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneSponsor`.
message CloneSponsorResponse {
  Sponsor sponsor = 1;
  acme.common.v1.OperationResult result = 2;
}
