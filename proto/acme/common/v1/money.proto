syntax = "proto3";

package acme.common.v1;

option csharp_namespace = "Acme.Common.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/common/v1;commonv1";
option java_multiple_files = true;
option java_outer_classname = "MoneyProto";
option java_package = "com.acme.common.v1";

// An amount of money in a currency, as `google.type.Money` has it.
message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}
