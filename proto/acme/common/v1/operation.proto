syntax = "proto3";

package acme.common.v1;

option csharp_namespace = "Acme.Common.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/common/v1;commonv1";
option java_multiple_files = true;
option java_outer_classname = "OperationProto";
option java_package = "com.acme.common.v1";

// What an operation did, for the caller to show or log.
message OperationResult {
  string status = 1;
  string message = 2;
  repeated string reference_ids = 3;
  map<string, string> details = 4;
  string correlation_id = 5;
}
