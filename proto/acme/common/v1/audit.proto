syntax = "proto3";

package acme.common.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Common.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/common/v1;commonv1";
option java_multiple_files = true;
option java_outer_classname = "AuditProto";
option java_package = "com.acme.common.v1";

// Who created and last changed a record, and when.
message AuditInfo {
  string created_by = 1;
  google.protobuf.Timestamp created_at = 2;
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
  string etag = 5;
}

// A span of time.
message TimeWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  string timezone = 3;
}
