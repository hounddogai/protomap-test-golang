syntax = "proto3";

package acme.anomalies.v1;

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.anomalies.v1";

// A reference to an anomaly of the anomalies domain.
message AnomalyRef {
  string anomaly_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a detector of the anomalies domain.
message DetectorRef {
  string detector_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an anomaly feedback of the anomalies domain.
message AnomalyFeedbackRef {
  string anomaly_feedback_id = 1;
  string display_name = 2;
  string kind = 3;
}
