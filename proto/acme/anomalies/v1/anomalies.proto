syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/refs.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/datasets/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "AnomaliesProto";
option java_package = "com.acme.anomalies.v1";

// Where an anomaly is in its lifecycle.
enum AnomalyStatus {
  ANOMALY_STATUS_UNSPECIFIED = 0;
  ANOMALY_STATUS_NEW = 1;
  ANOMALY_STATUS_OPEN = 2;
  ANOMALY_STATUS_WAITING = 3;
  ANOMALY_STATUS_RESOLVED = 4;
  ANOMALY_STATUS_CLOSED = 5;
}

// Where a detector is in its lifecycle.
enum DetectorStatus {
  DETECTOR_STATUS_UNSPECIFIED = 0;
  DETECTOR_STATUS_DRAFT = 1;
  DETECTOR_STATUS_ENABLED = 2;
  DETECTOR_STATUS_DISABLED = 3;
  DETECTOR_STATUS_RETIRED = 4;
}

// Where an anomaly feedback is in its lifecycle.
enum AnomalyFeedbackStatus {
  ANOMALY_FEEDBACK_STATUS_UNSPECIFIED = 0;
  ANOMALY_FEEDBACK_STATUS_RECEIVED = 1;
  ANOMALY_FEEDBACK_STATUS_PROCESSED = 2;
  ANOMALY_FEEDBACK_STATUS_DISCARDED = 3;
}

// The comment of an anomaly.
message AnomalyComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of an anomaly.
message AnomalySla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of an anomaly.
message AnomalyChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of an anomaly.
message AnomalyStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// An anomaly of the anomalies domain.
message Anomaly {
  string anomaly_id = 1;
  string subject = 2;
  AnomalyStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated AnomalyComment comments = 7;
  AnomalySla sla = 8;
  oneof origin {
    DetectorRef customer = 9;
    string external_reference = 10;
    AnomalyChannelOrigin channel = 11;
  }
  repeated AnomalyStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The condition of a detector.
message DetectorCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a detector.
message DetectorDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a detector.
message DetectorRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a detector.
message DetectorBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A detector of the anomalies domain.
message Detector {
  string detector_id = 1;
  string name = 2;
  string description = 3;
  DetectorStatus status = 4;
  int32 priority = 5;
  repeated DetectorCondition conditions = 6;
  oneof action {
    DetectorDiscountAction discount = 7;
    DetectorRouteAction route = 8;
    DetectorBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The measurement of an anomaly feedback.
message AnomalyFeedbackMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// An anomaly feedback of the anomalies domain.
message AnomalyFeedback {
  string anomaly_feedback_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  acme.datasets.v1.DatasetRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated AnomalyFeedbackMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
