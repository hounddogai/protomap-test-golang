syntax = "proto3";

package acme.onboarding.v1;

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.onboarding.v1";

// A reference to an onboarding plan of the onboarding domain.
message OnboardingPlanRef {
  string onboarding_plan_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an onboarding task of the onboarding domain.
message OnboardingTaskRef {
  string onboarding_task_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to an equipment of the onboarding domain.
message EquipmentRef {
  string equipment_id = 1;
  string display_name = 2;
  string code = 3;
}
