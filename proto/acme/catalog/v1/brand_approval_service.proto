syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "BrandApprovalServiceProto";
option java_package = "com.acme.catalog.v1";

// Routes brands through approval, with escalation and delegation.
service BrandApprovalService {
  // Submits a brand.
  rpc SubmitBrand(SubmitBrandRequest) returns (SubmitBrandResponse);

  // Approves a brand.
  rpc ApproveBrand(ApproveBrandRequest) returns (ApproveBrandResponse);

  // Escalates a brand.
  rpc EscalateBrand(EscalateBrandRequest) returns (EscalateBrandResponse);

  // Lists brands a page at a time.
  rpc ListPendingBrands(ListPendingBrandsRequest) returns (ListPendingBrandsResponse);

  // Delegates a brand.
  rpc DelegateBrandApproval(DelegateBrandApprovalRequest) returns (DelegateBrandApprovalResponse);

  // Recalls a brand.
  rpc RecallBrand(RecallBrandRequest) returns (RecallBrandResponse);

  // Returns a brand.
  rpc GetBrandApprovalStatus(GetBrandApprovalStatusRequest) returns (GetBrandApprovalStatusResponse);

  // Comments a brand.
  rpc CommentBrandApproval(CommentBrandApprovalRequest) returns (CommentBrandApprovalResponse);
}

// The request of `SubmitBrand`.
message SubmitBrandRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string brand_id = 2;
  Brand brand = 3;
  SubmitBrandRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBrand`.
message SubmitBrandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Brand brand = 1;
  SubmitBrandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

