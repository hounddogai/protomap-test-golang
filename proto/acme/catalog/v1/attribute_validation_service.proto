syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "AttributeValidationServiceProto";
option java_package = "com.acme.catalog.v1";

// Checks attributes against the rules before anything acts on them.
service AttributeValidationService {
  // Validates an attribute.
  rpc ValidateAttribute(ValidateAttributeRequest) returns (ValidateAttributeResponse);

  // Previews an attribute.
  rpc PreviewAttribute(PreviewAttributeRequest) returns (PreviewAttributeResponse);

  // Checks an attribute.
  rpc CheckAttributeEligibility(CheckAttributeEligibilityRequest) returns (CheckAttributeEligibilityResponse);

  // Normalizes an attribute.
  rpc NormalizeAttribute(NormalizeAttributeRequest) returns (NormalizeAttributeResponse);

  // Explains an attribute.
  rpc ExplainAttributeDecision(ExplainAttributeDecisionRequest) returns (ExplainAttributeDecisionResponse);

  // Scores an attribute.
  rpc ScoreAttribute(ScoreAttributeRequest) returns (ScoreAttributeResponse);

  // Lints an attribute.
  rpc LintAttributes(LintAttributesRequest) returns (LintAttributesResponse);

  // Returns an attribute.
  rpc GetAttributeRules(GetAttributeRulesRequest) returns (GetAttributeRulesResponse);
}

// The request of `ValidateAttribute`.
message ValidateAttributeRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  Attribute attribute = 3;
  ValidateAttributeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAttribute`.
message ValidateAttributeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Attribute attribute = 1;
  ValidateAttributeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

