syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "BrandValidationServiceProto";
option java_package = "com.acme.catalog.v1";

// Checks brands against the rules before anything acts on them.
service BrandValidationService {
  // Validates a brand.
  rpc ValidateBrand(ValidateBrandRequest) returns (ValidateBrandResponse);

  // Previews a brand.
  rpc PreviewBrand(PreviewBrandRequest) returns (PreviewBrandResponse);

  // Checks a brand.
  rpc CheckBrandEligibility(CheckBrandEligibilityRequest) returns (CheckBrandEligibilityResponse);

  // Normalizes a brand.
  rpc NormalizeBrand(NormalizeBrandRequest) returns (NormalizeBrandResponse);

  // Explains a brand.
  rpc ExplainBrandDecision(ExplainBrandDecisionRequest) returns (ExplainBrandDecisionResponse);

  // Scores a brand.
  rpc ScoreBrand(ScoreBrandRequest) returns (ScoreBrandResponse);

  // Lints a brand.
  rpc LintBrands(LintBrandsRequest) returns (LintBrandsResponse);

  // Returns a brand.
  rpc GetBrandRules(GetBrandRulesRequest) returns (GetBrandRulesResponse);
}

// The request of `ValidateBrand`.
message ValidateBrandRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string brand_id = 2;
  Brand brand = 3;
  ValidateBrandRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBrand`.
message ValidateBrandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Brand brand = 1;
  ValidateBrandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

