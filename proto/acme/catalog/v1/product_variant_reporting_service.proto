syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "ProductVariantReportingServiceProto";
option java_package = "com.acme.catalog.v1";

// Builds and schedules reports about product variants.
service ProductVariantReportingService {
  // Generates a product variant.
  rpc GenerateProductVariantReport(GenerateProductVariantReportRequest) returns (GenerateProductVariantReportResponse);

  // Returns a product variant.
  rpc FetchProductVariantReport(FetchProductVariantReportRequest) returns (FetchProductVariantReportResponse);

  // Schedules a product variant.
  rpc ScheduleProductVariantReport(ScheduleProductVariantReportRequest) returns (ScheduleProductVariantReportResponse);

  // Streams the changes of product variants as they happen.
  rpc StreamProductVariantMetrics(StreamProductVariantMetricsRequest) returns (stream StreamProductVariantMetricsResponse);

  // Lists product variants a page at a time.
  rpc ListProductVariantReports(ListProductVariantReportsRequest) returns (ListProductVariantReportsResponse);

  // Shares a product variant.
  rpc ShareProductVariantReport(ShareProductVariantReportRequest) returns (ShareProductVariantReportResponse);

  // Counts product variants by status.
  rpc CountProductVariantTotals(CountProductVariantTotalsRequest) returns (CountProductVariantTotalsResponse);

  // Deletes a product variant.
  rpc DeleteProductVariantReport(DeleteProductVariantReportRequest) returns (DeleteProductVariantReportResponse);
}

// The request of `GenerateProductVariantReport`.
message GenerateProductVariantReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  GenerateProductVariantReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateProductVariantReport`.
message GenerateProductVariantReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchProductVariantReport`.
message FetchProductVariantReportRequest {
  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchProductVariantReport`.
message FetchProductVariantReportResponse {
  ProductVariant product_variant = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleProductVariantReport`.
message ScheduleProductVariantReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  ScheduleProductVariantReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleProductVariantReport`.
message ScheduleProductVariantReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamProductVariantMetrics`.
message StreamProductVariantMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ProductVariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamProductVariantMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamProductVariantMetrics`.
message StreamProductVariantMetricsResponse {
  ProductVariant product_variant = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListProductVariantReports`.
message ListProductVariantReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ProductVariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListProductVariantReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListProductVariantReports`.
message ListProductVariantReportsResponse {
  repeated ProductVariant product_variants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareProductVariantReport`.
message ShareProductVariantReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  ShareProductVariantReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareProductVariantReport`.
message ShareProductVariantReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductVariant product_variant = 1;
  ShareProductVariantReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountProductVariantTotals`.
message CountProductVariantTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ProductVariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountProductVariantTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountProductVariantTotals`.
message CountProductVariantTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteProductVariantReport`.
message DeleteProductVariantReportRequest {
  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteProductVariantReport`.
message DeleteProductVariantReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
