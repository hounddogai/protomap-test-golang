syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "AttributeCalculationServiceProto";
option java_package = "com.acme.catalog.v1";

// Computes the figures of an attribute, such as totals, taxes, and estimates.
service AttributeCalculationService {
  // Calculates an attribute.
  rpc CalculateAttribute(CalculateAttributeRequest) returns (CalculateAttributeResponse);

  // Estimates an attribute.
  rpc EstimateAttribute(EstimateAttributeRequest) returns (EstimateAttributeResponse);

  // Quotes an attribute.
  rpc QuoteAttribute(QuoteAttributeRequest) returns (QuoteAttributeResponse);

  // Compares an attribute.
  rpc CompareAttributeOptions(CompareAttributeOptionsRequest) returns (CompareAttributeOptionsResponse);

  // Recalculates an attribute.
  rpc RecalculateAttributes(RecalculateAttributesRequest) returns (RecalculateAttributesResponse);

  // Explains an attribute.
  rpc ExplainAttributeCalculation(ExplainAttributeCalculationRequest) returns (ExplainAttributeCalculationResponse);

  // Returns an attribute.
  rpc GetAttributeRates(GetAttributeRatesRequest) returns (GetAttributeRatesResponse);
}

// The request of `CalculateAttribute`.
message CalculateAttributeRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  Attribute attribute = 3;
  CalculateAttributeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAttribute`.
message CalculateAttributeResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAttributeResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Attribute attribute = 1;
  CalculateAttributeResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

