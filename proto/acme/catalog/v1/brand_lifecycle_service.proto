syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "BrandLifecycleServiceProto";
option java_package = "com.acme.catalog.v1";

// Moves a brand between the states of its lifecycle.
service BrandLifecycleService {
  // Activates a brand.
  rpc ActivateBrand(ActivateBrandRequest) returns (ActivateBrandResponse);

  // Suspends a brand.
  rpc SuspendBrand(SuspendBrandRequest) returns (SuspendBrandResponse);

  // Reinstates a brand.
  rpc ReinstateBrand(ReinstateBrandRequest) returns (ReinstateBrandResponse);

  // Terminates a brand.
  rpc TerminateBrand(TerminateBrandRequest) returns (TerminateBrandResponse);

  // Renews a brand.
  rpc RenewBrand(RenewBrandRequest) returns (RenewBrandResponse);

  // Expires a brand.
  rpc ExpireBrand(ExpireBrandRequest) returns (ExpireBrandResponse);

  // Returns a brand.
  rpc GetBrandLifecycle(GetBrandLifecycleRequest) returns (GetBrandLifecycleResponse);

  // Schedules a brand.
  rpc ScheduleBrandExpiry(ScheduleBrandExpiryRequest) returns (ScheduleBrandExpiryResponse);
}

// The request of `ActivateBrand`.
message ActivateBrandRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string brand_id = 2;
  ActivateBrandRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateBrand`.
message ActivateBrandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Brand brand = 1;
  ActivateBrandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

