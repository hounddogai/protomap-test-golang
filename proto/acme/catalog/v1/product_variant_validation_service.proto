    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductVariant product_variant = 1;
  LintProductVariantsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetProductVariantRules`.
message GetProductVariantRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetProductVariantRules`.
message GetProductVariantRulesResponse {
  ProductVariant product_variant = 1;
  acme.common.v1.OperationResult result = 2;
}
