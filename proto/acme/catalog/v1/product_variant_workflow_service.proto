option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "ProductVariantWorkflowServiceProto";
option java_package = "com.acme.catalog.v1";

// Runs the long-lived workflow that takes a product variant from start to finish.
service ProductVariantWorkflowService {
  // Starts a product variant.
  rpc StartProductVariantWorkflow(StartProductVariantWorkflowRequest) returns (StartProductVariantWorkflowResponse);

  // Advances a product variant.
  rpc AdvanceProductVariantWorkflow(AdvanceProductVariantWorkflowRequest) returns (AdvanceProductVariantWorkflowResponse);

  // Cancels a product variant.
  rpc CancelProductVariantWorkflow(CancelProductVariantWorkflowRequest) returns (CancelProductVariantWorkflowResponse);

  // Retrys a product variant.
  rpc RetryProductVariantWorkflow(RetryProductVariantWorkflowRequest) returns (RetryProductVariantWorkflowResponse);

  // Pauses a product variant.
  rpc PauseProductVariantWorkflow(PauseProductVariantWorkflowRequest) returns (PauseProductVariantWorkflowResponse);

  // Resumes a product variant.
  rpc ResumeProductVariantWorkflow(ResumeProductVariantWorkflowRequest) returns (ResumeProductVariantWorkflowResponse);

  // Returns a product variant.
  rpc InspectProductVariantWorkflow(InspectProductVariantWorkflowRequest) returns (InspectProductVariantWorkflowResponse);

  // Lists product variants a page at a time.
  rpc ListProductVariantWorkflows(ListProductVariantWorkflowsRequest) returns (ListProductVariantWorkflowsResponse);

  // Signals a product variant.
  rpc SignalProductVariantWorkflow(SignalProductVariantWorkflowRequest) returns (SignalProductVariantWorkflowResponse);
}

// The request of `StartProductVariantWorkflow`.
message StartProductVariantWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  ProductVariant product_variant = 3;
  StartProductVariantWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartProductVariantWorkflow`.
message StartProductVariantWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductVariant product_variant = 1;
  StartProductVariantWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

