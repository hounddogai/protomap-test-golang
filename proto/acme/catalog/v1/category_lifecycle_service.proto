syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "CategoryLifecycleServiceProto";
option java_package = "com.acme.catalog.v1";

// Moves a category between the states of its lifecycle.
service CategoryLifecycleService {
  // Activates a category.
  rpc ActivateCategory(ActivateCategoryRequest) returns (ActivateCategoryResponse);

  // Suspends a category.
  rpc SuspendCategory(SuspendCategoryRequest) returns (SuspendCategoryResponse);

  // Reinstates a category.
  rpc ReinstateCategory(ReinstateCategoryRequest) returns (ReinstateCategoryResponse);

  // Terminates a category.
  rpc TerminateCategory(TerminateCategoryRequest) returns (TerminateCategoryResponse);

  // Renews a category.
  rpc RenewCategory(RenewCategoryRequest) returns (RenewCategoryResponse);

  // Expires a category.
  rpc ExpireCategory(ExpireCategoryRequest) returns (ExpireCategoryResponse);

  // Schedules a category.
  rpc ScheduleCategoryExpiry(ScheduleCategoryExpiryRequest) returns (ScheduleCategoryExpiryResponse);
}

// The request of `ActivateCategory`.
message ActivateCategoryRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string category_id = 2;
  ActivateCategoryRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCategory`.
message ActivateCategoryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Category category = 1;
  ActivateCategoryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

