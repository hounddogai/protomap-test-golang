syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "ProductValidationServiceProto";
option java_package = "com.acme.catalog.v1";

// Checks products against the rules before anything acts on them.
service ProductValidationService {
  // Validates a product.
  rpc ValidateProduct(ValidateProductRequest) returns (ValidateProductResponse);

  // Previews a product.
  rpc PreviewProduct(PreviewProductRequest) returns (PreviewProductResponse);

  // Checks a product.
  rpc CheckProductEligibility(CheckProductEligibilityRequest) returns (CheckProductEligibilityResponse);

  // Explains a product.
  rpc ExplainProductDecision(ExplainProductDecisionRequest) returns (ExplainProductDecisionResponse);

  // Scores a product.
  rpc ScoreProduct(ScoreProductRequest) returns (ScoreProductResponse);

  // Lints a product.
  rpc LintProducts(LintProductsRequest) returns (LintProductsResponse);

  // Returns a product.
  rpc GetProductRules(GetProductRulesRequest) returns (GetProductRulesResponse);
}

// The request of `ValidateProduct`.
message ValidateProductRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string product_id = 2;
  Product product = 3;
  ValidateProductRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateProduct`.
message ValidateProductResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Product product = 1;
  ValidateProductResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

