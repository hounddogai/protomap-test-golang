// The request of `GetProductRules`.
message GetProductRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string product_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetProductRules`.
message GetProductRulesResponse {
