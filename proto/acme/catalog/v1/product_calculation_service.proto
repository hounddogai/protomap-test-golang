syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "ProductCalculationServiceProto";
option java_package = "com.acme.catalog.v1";

// Computes the figures of a product, such as totals, taxes, and estimates.
service ProductCalculationService {
  // Calculates a product.
  rpc CalculateProduct(CalculateProductRequest) returns (CalculateProductResponse);

  // Estimates a product.
  rpc EstimateProduct(EstimateProductRequest) returns (EstimateProductResponse);

  // Quotes a product.
  rpc QuoteProduct(QuoteProductRequest) returns (QuoteProductResponse);

  // Compares a product.
  rpc CompareProductOptions(CompareProductOptionsRequest) returns (CompareProductOptionsResponse);

  // Recalculates a product.
  rpc RecalculateProducts(RecalculateProductsRequest) returns (RecalculateProductsResponse);

  // Simulates a product.
  rpc SimulateProduct(SimulateProductRequest) returns (SimulateProductResponse);

  // Explains a product.
  rpc ExplainProductCalculation(ExplainProductCalculationRequest) returns (ExplainProductCalculationResponse);

  // Returns a product.
  rpc GetProductRates(GetProductRatesRequest) returns (GetProductRatesResponse);
}

// The request of `CalculateProduct`.
message CalculateProductRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string product_id = 2;
  Product product = 3;
  CalculateProductRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateProduct`.
message CalculateProductResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateProductResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Product product = 1;
  CalculateProductResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

