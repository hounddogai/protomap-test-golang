syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "CategoryValidationServiceProto";
option java_package = "com.acme.catalog.v1";

// Checks categories against the rules before anything acts on them.
service CategoryValidationService {
  // Validates a category.
  rpc ValidateCategory(ValidateCategoryRequest) returns (ValidateCategoryResponse);

  // Previews a category.
  rpc PreviewCategory(PreviewCategoryRequest) returns (PreviewCategoryResponse);

  // Checks a category.
  rpc CheckCategoryEligibility(CheckCategoryEligibilityRequest) returns (CheckCategoryEligibilityResponse);

  // Normalizes a category.
  rpc NormalizeCategory(NormalizeCategoryRequest) returns (NormalizeCategoryResponse);

  // Explains a category.
  rpc ExplainCategoryDecision(ExplainCategoryDecisionRequest) returns (ExplainCategoryDecisionResponse);

  // Scores a category.
  rpc ScoreCategory(ScoreCategoryRequest) returns (ScoreCategoryResponse);

  // Lints a category.
  rpc LintCategories(LintCategoriesRequest) returns (LintCategoriesResponse);

  // Returns a category.
  rpc GetCategoryRules(GetCategoryRulesRequest) returns (GetCategoryRulesResponse);
}

// The request of `ValidateCategory`.
message ValidateCategoryRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string category_id = 2;
  Category category = 3;
  ValidateCategoryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCategory`.
message ValidateCategoryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Category category = 1;
  ValidateCategoryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

