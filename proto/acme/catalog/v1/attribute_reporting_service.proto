syntax = "proto3";

package acme.catalog.v1;

import "acme/catalog/v1/catalog.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "AttributeReportingServiceProto";
option java_package = "com.acme.catalog.v1";

// Builds and schedules reports about attributes.
service AttributeReportingService {
  // Generates an attribute.
  rpc GenerateAttributeReport(GenerateAttributeReportRequest) returns (GenerateAttributeReportResponse);

  // Returns an attribute.
  rpc FetchAttributeReport(FetchAttributeReportRequest) returns (FetchAttributeReportResponse);

  // Schedules an attribute.
  rpc ScheduleAttributeReport(ScheduleAttributeReportRequest) returns (ScheduleAttributeReportResponse);

  // Streams the changes of attributes as they happen.
  rpc StreamAttributeMetrics(StreamAttributeMetricsRequest) returns (stream StreamAttributeMetricsResponse);

  // Lists attributes a page at a time.
  rpc ListAttributeReports(ListAttributeReportsRequest) returns (ListAttributeReportsResponse);

  // Shares an attribute.
  rpc ShareAttributeReport(ShareAttributeReportRequest) returns (ShareAttributeReportResponse);

  // Deletes an attribute.
  rpc DeleteAttributeReport(DeleteAttributeReportRequest) returns (DeleteAttributeReportResponse);
}

// The request of `GenerateAttributeReport`.
message GenerateAttributeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  GenerateAttributeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateAttributeReport`.
message GenerateAttributeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchAttributeReport`.
message FetchAttributeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchAttributeReport`.
message FetchAttributeReportResponse {
  Attribute attribute = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleAttributeReport`.
message ScheduleAttributeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  ScheduleAttributeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleAttributeReport`.
message ScheduleAttributeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamAttributeMetrics`.
message StreamAttributeMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AttributeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAttributeMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAttributeMetrics`.
message StreamAttributeMetricsResponse {
  Attribute attribute = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListAttributeReports`.
message ListAttributeReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AttributeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAttributeReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAttributeReports`.
message ListAttributeReportsResponse {
  repeated Attribute attributes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareAttributeReport`.
message ShareAttributeReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  ShareAttributeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareAttributeReport`.
message ShareAttributeReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Attribute attribute = 1;
  ShareAttributeReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteAttributeReport`.
message DeleteAttributeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string attribute_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteAttributeReport`.
message DeleteAttributeReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
