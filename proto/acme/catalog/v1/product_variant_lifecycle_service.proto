option csharp_namespace = "Acme.Catalog.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "ProductVariantLifecycleServiceProto";
option java_package = "com.acme.catalog.v1";

// Moves a product variant between the states of its lifecycle.
service ProductVariantLifecycleService {
  // Activates a product variant.
  rpc ActivateProductVariant(ActivateProductVariantRequest) returns (ActivateProductVariantResponse);

  // Suspends a product variant.
  rpc SuspendProductVariant(SuspendProductVariantRequest) returns (SuspendProductVariantResponse);

  // Reinstates a product variant.
  rpc ReinstateProductVariant(ReinstateProductVariantRequest) returns (ReinstateProductVariantResponse);

  // Terminates a product variant.
  rpc TerminateProductVariant(TerminateProductVariantRequest) returns (TerminateProductVariantResponse);

  // Renews a product variant.
  rpc RenewProductVariant(RenewProductVariantRequest) returns (RenewProductVariantResponse);

  // Expires a product variant.
  rpc ExpireProductVariant(ExpireProductVariantRequest) returns (ExpireProductVariantResponse);

  // Returns a product variant.
  rpc GetProductVariantLifecycle(GetProductVariantLifecycleRequest) returns (GetProductVariantLifecycleResponse);

  // Schedules a product variant.
  rpc ScheduleProductVariantExpiry(ScheduleProductVariantExpiryRequest) returns (ScheduleProductVariantExpiryResponse);
}

// The request of `ActivateProductVariant`.
message ActivateProductVariantRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string product_variant_id = 2;
  ActivateProductVariantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateProductVariant`.
message ActivateProductVariantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProductVariant product_variant = 1;
  ActivateProductVariantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

