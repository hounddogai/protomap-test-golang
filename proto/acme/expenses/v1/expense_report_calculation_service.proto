syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpenseReportCalculationServiceProto";
option java_package = "com.acme.expenses.v1";

// Computes the figures of an expense report, such as totals, taxes, and estimates.
service ExpenseReportCalculationService {
  // Calculates an expense report.
  rpc CalculateExpenseReport(CalculateExpenseReportRequest) returns (CalculateExpenseReportResponse);

  // Estimates an expense report.
  rpc EstimateExpenseReport(EstimateExpenseReportRequest) returns (EstimateExpenseReportResponse);

  // Quotes an expense report.
  rpc QuoteExpenseReport(QuoteExpenseReportRequest) returns (QuoteExpenseReportResponse);

  // Compares an expense report.
  rpc CompareExpenseReportOptions(CompareExpenseReportOptionsRequest) returns (CompareExpenseReportOptionsResponse);

  // Recalculates an expense report.
  rpc RecalculateExpenseReports(RecalculateExpenseReportsRequest) returns (RecalculateExpenseReportsResponse);

  // Simulates an expense report.
  rpc SimulateExpenseReport(SimulateExpenseReportRequest) returns (SimulateExpenseReportResponse);

  // Explains an expense report.
  rpc ExplainExpenseReportCalculation(ExplainExpenseReportCalculationRequest) returns (ExplainExpenseReportCalculationResponse);

  // Returns an expense report.
  rpc GetExpenseReportRates(GetExpenseReportRatesRequest) returns (GetExpenseReportRatesResponse);
}

// The request of `CalculateExpenseReport`.
message CalculateExpenseReportRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_report_id = 2;
  ExpenseReport expense_report = 3;
  CalculateExpenseReportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateExpenseReport`.
message CalculateExpenseReportResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateExpenseReportResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ExpenseReport expense_report = 1;
  CalculateExpenseReportResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

