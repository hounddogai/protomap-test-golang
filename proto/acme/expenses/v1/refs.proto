syntax = "proto3";

package acme.expenses.v1;

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.expenses.v1";

// A reference to an expense report of the expenses domain.
message ExpenseReportRef {
  string expense_report_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a receipt of the expenses domain.
message ReceiptRef {
  string receipt_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a mileage claim of the expenses domain.
message MileageClaimRef {
  string mileage_claim_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an expense policy of the expenses domain.
message ExpensePolicyRef {
  string expense_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}
