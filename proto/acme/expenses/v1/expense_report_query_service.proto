syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpenseReportQueryServiceProto";
option java_package = "com.acme.expenses.v1";

// Answers read-only questions about expense reports, for screens and reports.
service ExpenseReportQueryService {
  // Returns an expense report.
  rpc LookupExpenseReport(LookupExpenseReportRequest) returns (LookupExpenseReportResponse);

  // Lists expense reports a page at a time.
  rpc BrowseExpenseReports(BrowseExpenseReportsRequest) returns (BrowseExpenseReportsResponse);

  // Lists expense reports a page at a time.
  rpc FindExpenseReports(FindExpenseReportsRequest) returns (FindExpenseReportsResponse);

  // Counts expense reports by status.
  rpc CountExpenseReports(CountExpenseReportsRequest) returns (CountExpenseReportsResponse);

  // Returns several expense reports at once.
  rpc ResolveExpenseReports(ResolveExpenseReportsRequest) returns (ResolveExpenseReportsResponse);

  // Streams every matching expense report.
  rpc ExportExpenseReports(ExportExpenseReportsRequest) returns (stream ExportExpenseReportsResponse);
}

// The request of `LookupExpenseReport`.
message LookupExpenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  string expense_report_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupExpenseReport`.
message LookupExpenseReportResponse {
  ExpenseReport expense_report = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseExpenseReports`.
message BrowseExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseExpenseReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseExpenseReports`.
message BrowseExpenseReportsResponse {
  repeated ExpenseReport expense_reports = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindExpenseReports`.
message FindExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindExpenseReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindExpenseReports`.
message FindExpenseReportsResponse {
  repeated ExpenseReport expense_reports = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountExpenseReports`.
message CountExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountExpenseReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountExpenseReports`.
message CountExpenseReportsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveExpenseReports`.
message ResolveExpenseReportsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string expense_report_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveExpenseReports`.
message ResolveExpenseReportsResponse {
  repeated ExpenseReport expense_reports = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportExpenseReports`.
message ExportExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportExpenseReportsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportExpenseReports`.
message ExportExpenseReportsResponse {
  ExpenseReport expense_report = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
