syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpenseReportServiceProto";
option java_package = "com.acme.expenses.v1";

// Manages expense reports: creates, reads, changes, and lists them.
service ExpenseReportService {
  // Creates an expense report.
  rpc CreateExpenseReport(CreateExpenseReportRequest) returns (CreateExpenseReportResponse);

  // Returns an expense report.
  rpc GetExpenseReport(GetExpenseReportRequest) returns (GetExpenseReportResponse);

  // Changes an expense report.
  rpc UpdateExpenseReport(UpdateExpenseReportRequest) returns (UpdateExpenseReportResponse);

  // Deletes an expense report.
  rpc DeleteExpenseReport(DeleteExpenseReportRequest) returns (DeleteExpenseReportResponse);

  // Lists expense reports a page at a time.
  rpc ListExpenseReports(ListExpenseReportsRequest) returns (ListExpenseReportsResponse);

  // Returns several expense reports at once.
  rpc BatchGetExpenseReports(BatchGetExpenseReportsRequest) returns (BatchGetExpenseReportsResponse);

  // Lists expense reports a page at a time.
  rpc SearchExpenseReports(SearchExpenseReportsRequest) returns (SearchExpenseReportsResponse);

  // Streams the changes of expense reports as they happen.
  rpc WatchExpenseReports(WatchExpenseReportsRequest) returns (stream WatchExpenseReportsResponse);

  // Takes a stream of expense reports and answers once at the end.
  rpc BatchCreateExpenseReports(stream BatchCreateExpenseReportsRequest) returns (BatchCreateExpenseReportsResponse);

  // Creates an expense report.
  rpc CloneExpenseReport(CloneExpenseReportRequest) returns (CloneExpenseReportResponse);
}

// The request of `CreateExpenseReport`.
message CreateExpenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  ExpenseReport expense_report = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateExpenseReport`.
message CreateExpenseReportResponse {
  ExpenseReport expense_report = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetExpenseReport`.
message GetExpenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  string expense_report_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetExpenseReport`.
message GetExpenseReportResponse {
  ExpenseReport expense_report = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateExpenseReport`.
message UpdateExpenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  ExpenseReport expense_report = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateExpenseReport`.
message UpdateExpenseReportResponse {
  ExpenseReport expense_report = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteExpenseReport`.
message DeleteExpenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  string expense_report_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteExpenseReport`.
message DeleteExpenseReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListExpenseReports`.
message ListExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListExpenseReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListExpenseReports`.
message ListExpenseReportsResponse {
  repeated ExpenseReport expense_reports = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetExpenseReports`.
message BatchGetExpenseReportsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string expense_report_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetExpenseReports`.
message BatchGetExpenseReportsResponse {
  repeated ExpenseReport expense_reports = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchExpenseReports`.
message SearchExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchExpenseReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchExpenseReports`.
message SearchExpenseReportsResponse {
  repeated ExpenseReport expense_reports = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchExpenseReports`.
message WatchExpenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpenseReportStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchExpenseReportsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchExpenseReports`.
message WatchExpenseReportsResponse {
  ExpenseReport expense_report = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateExpenseReports`.
message BatchCreateExpenseReportsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateExpenseReportsRequest.StreamHeader header = 2;
    ExpenseReport record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateExpenseReports`.
message BatchCreateExpenseReportsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string expense_report_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateExpenseReportsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneExpenseReport`.
message CloneExpenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  ExpenseReport expense_report = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneExpenseReport`.
message CloneExpenseReportResponse {
  ExpenseReport expense_report = 1;
  acme.common.v1.OperationResult result = 2;
}
