syntax = "proto3";

package acme.checkout.v1;

import "acme/checkout/v1/checkout.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Checkout.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/checkout/v1;checkoutv1";
option java_multiple_files = true;
option java_outer_classname = "CheckoutSessionApprovalServiceProto";
option java_package = "com.acme.checkout.v1";

// Routes checkout sessions through approval, with escalation and delegation.
service CheckoutSessionApprovalService {
  // Submits a checkout session.
  rpc SubmitCheckoutSession(SubmitCheckoutSessionRequest) returns (SubmitCheckoutSessionResponse);

  // Approves a checkout session.
  rpc ApproveCheckoutSession(ApproveCheckoutSessionRequest) returns (ApproveCheckoutSessionResponse);

  // Rejects a checkout session.
  rpc RejectCheckoutSession(RejectCheckoutSessionRequest) returns (RejectCheckoutSessionResponse);

  // Escalates a checkout session.
  rpc EscalateCheckoutSession(EscalateCheckoutSessionRequest) returns (EscalateCheckoutSessionResponse);

  // Lists checkout sessions a page at a time.
  rpc ListPendingCheckoutSessions(ListPendingCheckoutSessionsRequest) returns (ListPendingCheckoutSessionsResponse);

  // Recalls a checkout session.
  rpc RecallCheckoutSession(RecallCheckoutSessionRequest) returns (RecallCheckoutSessionResponse);

  // Comments a checkout session.
  rpc CommentCheckoutSessionApproval(CommentCheckoutSessionApprovalRequest) returns (CommentCheckoutSessionApprovalResponse);
}

// The request of `SubmitCheckoutSession`.
message SubmitCheckoutSessionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string checkout_session_id = 2;
  CheckoutSession checkout_session = 3;
  SubmitCheckoutSessionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCheckoutSession`.
message SubmitCheckoutSessionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CheckoutSession checkout_session = 1;
  SubmitCheckoutSessionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

