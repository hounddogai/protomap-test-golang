syntax = "proto3";

package acme.checkout.v1;

import "acme/checkout/v1/checkout.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Checkout.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/checkout/v1;checkoutv1";
option java_multiple_files = true;
option java_outer_classname = "CheckoutSessionWorkflowServiceProto";
option java_package = "com.acme.checkout.v1";

// Runs the long-lived workflow that takes a checkout session from start to finish.
service CheckoutSessionWorkflowService {
  // Starts a checkout session.
  rpc StartCheckoutSessionWorkflow(StartCheckoutSessionWorkflowRequest) returns (StartCheckoutSessionWorkflowResponse);

  // Advances a checkout session.
  rpc AdvanceCheckoutSessionWorkflow(AdvanceCheckoutSessionWorkflowRequest) returns (AdvanceCheckoutSessionWorkflowResponse);

  // Cancels a checkout session.
  rpc CancelCheckoutSessionWorkflow(CancelCheckoutSessionWorkflowRequest) returns (CancelCheckoutSessionWorkflowResponse);

  // Resumes a checkout session.
  rpc ResumeCheckoutSessionWorkflow(ResumeCheckoutSessionWorkflowRequest) returns (ResumeCheckoutSessionWorkflowResponse);

  // Returns a checkout session.
  rpc InspectCheckoutSessionWorkflow(InspectCheckoutSessionWorkflowRequest) returns (InspectCheckoutSessionWorkflowResponse);

  // Lists checkout sessions a page at a time.
  rpc ListCheckoutSessionWorkflows(ListCheckoutSessionWorkflowsRequest) returns (ListCheckoutSessionWorkflowsResponse);

  // Signals a checkout session.
  rpc SignalCheckoutSessionWorkflow(SignalCheckoutSessionWorkflowRequest) returns (SignalCheckoutSessionWorkflowResponse);
}

// The request of `StartCheckoutSessionWorkflow`.
message StartCheckoutSessionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string checkout_session_id = 2;
  CheckoutSession checkout_session = 3;
  StartCheckoutSessionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCheckoutSessionWorkflow`.
message StartCheckoutSessionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CheckoutSession checkout_session = 1;
  StartCheckoutSessionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

