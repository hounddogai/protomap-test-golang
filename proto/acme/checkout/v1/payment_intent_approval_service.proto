syntax = "proto3";

package acme.checkout.v1;

import "acme/checkout/v1/checkout.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Checkout.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/checkout/v1;checkoutv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentIntentApprovalServiceProto";
option java_package = "com.acme.checkout.v1";

// Routes payment intents through approval, with escalation and delegation.
service PaymentIntentApprovalService {
  // Submits a payment intent.
  rpc SubmitPaymentIntent(SubmitPaymentIntentRequest) returns (SubmitPaymentIntentResponse);

  // Approves a payment intent.
  rpc ApprovePaymentIntent(ApprovePaymentIntentRequest) returns (ApprovePaymentIntentResponse);

  // Rejects a payment intent.
  rpc RejectPaymentIntent(RejectPaymentIntentRequest) returns (RejectPaymentIntentResponse);

  // Escalates a payment intent.
  rpc EscalatePaymentIntent(EscalatePaymentIntentRequest) returns (EscalatePaymentIntentResponse);

  // Lists payment intents a page at a time.
  rpc ListPendingPaymentIntents(ListPendingPaymentIntentsRequest) returns (ListPendingPaymentIntentsResponse);

  // Delegates a payment intent.
  rpc DelegatePaymentIntentApproval(DelegatePaymentIntentApprovalRequest) returns (DelegatePaymentIntentApprovalResponse);

  // Recalls a payment intent.
  rpc RecallPaymentIntent(RecallPaymentIntentRequest) returns (RecallPaymentIntentResponse);

  // Returns a payment intent.
  rpc GetPaymentIntentApprovalStatus(GetPaymentIntentApprovalStatusRequest) returns (GetPaymentIntentApprovalStatusResponse);

  // Comments a payment intent.
  rpc CommentPaymentIntentApproval(CommentPaymentIntentApprovalRequest) returns (CommentPaymentIntentApprovalResponse);
}

// The request of `SubmitPaymentIntent`.
message SubmitPaymentIntentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_intent_id = 2;
  PaymentIntent payment_intent = 3;
  SubmitPaymentIntentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPaymentIntent`.
message SubmitPaymentIntentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentIntent payment_intent = 1;
  SubmitPaymentIntentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

