syntax = "proto3";

package acme.checkout.v1;

import "acme/checkout/v1/checkout.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Checkout.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/checkout/v1;checkoutv1";
option java_multiple_files = true;
option java_outer_classname = "CheckoutSessionServiceProto";
option java_package = "com.acme.checkout.v1";

// Manages checkout sessions: creates, reads, changes, and lists them.
service CheckoutSessionService {
  // Creates a checkout session.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);

  // Returns a checkout session.
  rpc GetCheckoutSession(GetCheckoutSessionRequest) returns (GetCheckoutSessionResponse);

  // Changes a checkout session.
  rpc UpdateCheckoutSession(UpdateCheckoutSessionRequest) returns (UpdateCheckoutSessionResponse);

  // Lists checkout sessions a page at a time.
  rpc ListCheckoutSessions(ListCheckoutSessionsRequest) returns (ListCheckoutSessionsResponse);

  // Returns several checkout sessions at once.
  rpc BatchGetCheckoutSessions(BatchGetCheckoutSessionsRequest) returns (BatchGetCheckoutSessionsResponse);

  // Lists checkout sessions a page at a time.
  rpc SearchCheckoutSessions(SearchCheckoutSessionsRequest) returns (SearchCheckoutSessionsResponse);

  // Streams the changes of checkout sessions as they happen.
  rpc WatchCheckoutSessions(WatchCheckoutSessionsRequest) returns (stream WatchCheckoutSessionsResponse);

  // Takes a stream of checkout sessions and answers once at the end.
  rpc BatchCreateCheckoutSessions(stream BatchCreateCheckoutSessionsRequest) returns (BatchCreateCheckoutSessionsResponse);

  // Creates a checkout session.
  rpc CloneCheckoutSession(CloneCheckoutSessionRequest) returns (CloneCheckoutSessionResponse);
}

// The request of `CreateCheckoutSession`.
message CreateCheckoutSessionRequest {
  acme.common.v1.RequestContext context = 1;
  CheckoutSession checkout_session = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateCheckoutSession`.
message CreateCheckoutSessionResponse {
  CheckoutSession checkout_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetCheckoutSession`.
message GetCheckoutSessionRequest {
  acme.common.v1.RequestContext context = 1;
  string checkout_session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCheckoutSession`.
message GetCheckoutSessionResponse {
  CheckoutSession checkout_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateCheckoutSession`.
message UpdateCheckoutSessionRequest {
  acme.common.v1.RequestContext context = 1;
  CheckoutSession checkout_session = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateCheckoutSession`.
message UpdateCheckoutSessionResponse {
  CheckoutSession checkout_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListCheckoutSessions`.
message ListCheckoutSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CheckoutSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCheckoutSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCheckoutSessions`.
message ListCheckoutSessionsResponse {
  repeated CheckoutSession checkout_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetCheckoutSessions`.
message BatchGetCheckoutSessionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string checkout_session_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetCheckoutSessions`.
message BatchGetCheckoutSessionsResponse {
  repeated CheckoutSession checkout_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchCheckoutSessions`.
message SearchCheckoutSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CheckoutSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchCheckoutSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchCheckoutSessions`.
message SearchCheckoutSessionsResponse {
  repeated CheckoutSession checkout_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchCheckoutSessions`.
message WatchCheckoutSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CheckoutSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchCheckoutSessionsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchCheckoutSessions`.
message WatchCheckoutSessionsResponse {
  CheckoutSession checkout_session = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateCheckoutSessions`.
message BatchCreateCheckoutSessionsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateCheckoutSessionsRequest.StreamHeader header = 2;
    CheckoutSession record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateCheckoutSessions`.
message BatchCreateCheckoutSessionsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string checkout_session_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateCheckoutSessionsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneCheckoutSession`.
message CloneCheckoutSessionRequest {
  acme.common.v1.RequestContext context = 1;
  CheckoutSession checkout_session = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneCheckoutSession`.
message CloneCheckoutSessionResponse {
  CheckoutSession checkout_session = 1;
  acme.common.v1.OperationResult result = 2;
}
