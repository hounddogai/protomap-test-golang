syntax = "proto3";

package acme.checkout.v1;

import "acme/checkout/v1/checkout.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Checkout.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/checkout/v1;checkoutv1";
option java_multiple_files = true;
option java_outer_classname = "ShippingQuoteApprovalServiceProto";
option java_package = "com.acme.checkout.v1";

// Routes shipping quotes through approval, with escalation and delegation.
service ShippingQuoteApprovalService {
  // Submits a shipping quote.
  rpc SubmitShippingQuote(SubmitShippingQuoteRequest) returns (SubmitShippingQuoteResponse);

  // Approves a shipping quote.
  rpc ApproveShippingQuote(ApproveShippingQuoteRequest) returns (ApproveShippingQuoteResponse);

  // Rejects a shipping quote.
  rpc RejectShippingQuote(RejectShippingQuoteRequest) returns (RejectShippingQuoteResponse);

  // Escalates a shipping quote.
  rpc EscalateShippingQuote(EscalateShippingQuoteRequest) returns (EscalateShippingQuoteResponse);

  // Lists shipping quotes a page at a time.
  rpc ListPendingShippingQuotes(ListPendingShippingQuotesRequest) returns (ListPendingShippingQuotesResponse);

  // Delegates a shipping quote.
  rpc DelegateShippingQuoteApproval(DelegateShippingQuoteApprovalRequest) returns (DelegateShippingQuoteApprovalResponse);

  // Recalls a shipping quote.
  rpc RecallShippingQuote(RecallShippingQuoteRequest) returns (RecallShippingQuoteResponse);

  // Returns a shipping quote.
  rpc GetShippingQuoteApprovalStatus(GetShippingQuoteApprovalStatusRequest) returns (GetShippingQuoteApprovalStatusResponse);
}

// The request of `SubmitShippingQuote`.
message SubmitShippingQuoteRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shipping_quote_id = 2;
  ShippingQuote shipping_quote = 3;
  SubmitShippingQuoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitShippingQuote`.
message SubmitShippingQuoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ShippingQuote shipping_quote = 1;
  SubmitShippingQuoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

