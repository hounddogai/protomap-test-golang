syntax = "proto3";

package acme.checkout.v1;

import "acme/checkout/v1/checkout.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Checkout.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/checkout/v1;checkoutv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentIntentValidationServiceProto";
option java_package = "com.acme.checkout.v1";

// Checks payment intents against the rules before anything acts on them.
service PaymentIntentValidationService {
  // Validates a payment intent.
  rpc ValidatePaymentIntent(ValidatePaymentIntentRequest) returns (ValidatePaymentIntentResponse);

  // Previews a payment intent.
  rpc PreviewPaymentIntent(PreviewPaymentIntentRequest) returns (PreviewPaymentIntentResponse);

  // Checks a payment intent.
  rpc CheckPaymentIntentEligibility(CheckPaymentIntentEligibilityRequest) returns (CheckPaymentIntentEligibilityResponse);

  // Normalizes a payment intent.
  rpc NormalizePaymentIntent(NormalizePaymentIntentRequest) returns (NormalizePaymentIntentResponse);

  // Explains a payment intent.
  rpc ExplainPaymentIntentDecision(ExplainPaymentIntentDecisionRequest) returns (ExplainPaymentIntentDecisionResponse);

  // Scores a payment intent.
  rpc ScorePaymentIntent(ScorePaymentIntentRequest) returns (ScorePaymentIntentResponse);

  // Lints a payment intent.
  rpc LintPaymentIntents(LintPaymentIntentsRequest) returns (LintPaymentIntentsResponse);

  // Returns a payment intent.
  rpc GetPaymentIntentRules(GetPaymentIntentRulesRequest) returns (GetPaymentIntentRulesResponse);
}

// The request of `ValidatePaymentIntent`.
message ValidatePaymentIntentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_intent_id = 2;
  PaymentIntent payment_intent = 3;
  ValidatePaymentIntentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePaymentIntent`.
message ValidatePaymentIntentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentIntent payment_intent = 1;
  ValidatePaymentIntentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

