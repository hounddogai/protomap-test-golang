// The request of `InspectPaymentIntentWorkflow`.
message InspectPaymentIntentWorkflowRequest {
  acme.common.v1.RequestContext context = 1;
  string payment_intent_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectPaymentIntentWorkflow`.
message InspectPaymentIntentWorkflowResponse {
  PaymentIntent payment_intent = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListPaymentIntentWorkflows`.
message ListPaymentIntentWorkflowsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PaymentIntentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPaymentIntentWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPaymentIntentWorkflows`.
message ListPaymentIntentWorkflowsResponse {
  repeated PaymentIntent payment_intents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
