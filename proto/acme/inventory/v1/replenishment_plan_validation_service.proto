// The request of `ScoreReplenishmentPlan`.
message ScoreReplenishmentPlanRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string replenishment_plan_id = 2;
  ReplenishmentPlan replenishment_plan = 3;
  ScoreReplenishmentPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreReplenishmentPlan`.
message ScoreReplenishmentPlanResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreReplenishmentPlanResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReplenishmentPlan replenishment_plan = 1;
  ScoreReplenishmentPlanResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

