syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "ReplenishmentPlanValidationServiceProto";
option java_package = "com.acme.inventory.v1";

// Checks replenishment plans against the rules before anything acts on them.
service ReplenishmentPlanValidationService {
  // Validates a replenishment plan.
  rpc ValidateReplenishmentPlan(ValidateReplenishmentPlanRequest) returns (ValidateReplenishmentPlanResponse);

  // Previews a replenishment plan.
  rpc PreviewReplenishmentPlan(PreviewReplenishmentPlanRequest) returns (PreviewReplenishmentPlanResponse);

  // Checks a replenishment plan.
  rpc CheckReplenishmentPlanEligibility(CheckReplenishmentPlanEligibilityRequest) returns (CheckReplenishmentPlanEligibilityResponse);

  // Normalizes a replenishment plan.
  rpc NormalizeReplenishmentPlan(NormalizeReplenishmentPlanRequest) returns (NormalizeReplenishmentPlanResponse);

  // Explains a replenishment plan.
  rpc ExplainReplenishmentPlanDecision(ExplainReplenishmentPlanDecisionRequest) returns (ExplainReplenishmentPlanDecisionResponse);

  // Scores a replenishment plan.
  rpc ScoreReplenishmentPlan(ScoreReplenishmentPlanRequest) returns (ScoreReplenishmentPlanResponse);

  // Lints a replenishment plan.
  rpc LintReplenishmentPlans(LintReplenishmentPlansRequest) returns (LintReplenishmentPlansResponse);

  // Returns a replenishment plan.
  rpc GetReplenishmentPlanRules(GetReplenishmentPlanRulesRequest) returns (GetReplenishmentPlanRulesResponse);
}

// The request of `ValidateReplenishmentPlan`.
message ValidateReplenishmentPlanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string replenishment_plan_id = 2;
  ReplenishmentPlan replenishment_plan = 3;
  ValidateReplenishmentPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateReplenishmentPlan`.
message ValidateReplenishmentPlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReplenishmentPlan replenishment_plan = 1;
  ValidateReplenishmentPlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

