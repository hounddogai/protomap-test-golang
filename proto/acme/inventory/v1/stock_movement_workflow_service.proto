syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "StockMovementWorkflowServiceProto";
option java_package = "com.acme.inventory.v1";

// Runs the long-lived workflow that takes a stock movement from start to finish.
service StockMovementWorkflowService {
  // Starts a stock movement.
  rpc StartStockMovementWorkflow(StartStockMovementWorkflowRequest) returns (StartStockMovementWorkflowResponse);

  // Advances a stock movement.
  rpc AdvanceStockMovementWorkflow(AdvanceStockMovementWorkflowRequest) returns (AdvanceStockMovementWorkflowResponse);

  // Cancels a stock movement.
  rpc CancelStockMovementWorkflow(CancelStockMovementWorkflowRequest) returns (CancelStockMovementWorkflowResponse);

  // Retrys a stock movement.
  rpc RetryStockMovementWorkflow(RetryStockMovementWorkflowRequest) returns (RetryStockMovementWorkflowResponse);

  // Resumes a stock movement.
  rpc ResumeStockMovementWorkflow(ResumeStockMovementWorkflowRequest) returns (ResumeStockMovementWorkflowResponse);

  // Returns a stock movement.
  rpc InspectStockMovementWorkflow(InspectStockMovementWorkflowRequest) returns (InspectStockMovementWorkflowResponse);

  // Lists stock movements a page at a time.
  rpc ListStockMovementWorkflows(ListStockMovementWorkflowsRequest) returns (ListStockMovementWorkflowsResponse);
}

// The request of `StartStockMovementWorkflow`.
message StartStockMovementWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stock_movement_id = 2;
  StockMovement stock_movement = 3;
  StartStockMovementWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartStockMovementWorkflow`.
message StartStockMovementWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StockMovement stock_movement = 1;
  StartStockMovementWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

