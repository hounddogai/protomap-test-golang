syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "ReplenishmentPlanApprovalServiceProto";
option java_package = "com.acme.inventory.v1";

// Routes replenishment plans through approval, with escalation and delegation.
service ReplenishmentPlanApprovalService {
  // Submits a replenishment plan.
  rpc SubmitReplenishmentPlan(SubmitReplenishmentPlanRequest) returns (SubmitReplenishmentPlanResponse);

  // Approves a replenishment plan.
  rpc ApproveReplenishmentPlan(ApproveReplenishmentPlanRequest) returns (ApproveReplenishmentPlanResponse);

  // Rejects a replenishment plan.
  rpc RejectReplenishmentPlan(RejectReplenishmentPlanRequest) returns (RejectReplenishmentPlanResponse);

  // Escalates a replenishment plan.
  rpc EscalateReplenishmentPlan(EscalateReplenishmentPlanRequest) returns (EscalateReplenishmentPlanResponse);

  // Lists replenishment plans a page at a time.
  rpc ListPendingReplenishmentPlans(ListPendingReplenishmentPlansRequest) returns (ListPendingReplenishmentPlansResponse);

  // Delegates a replenishment plan.
  rpc DelegateReplenishmentPlanApproval(DelegateReplenishmentPlanApprovalRequest) returns (DelegateReplenishmentPlanApprovalResponse);

  // Recalls a replenishment plan.
  rpc RecallReplenishmentPlan(RecallReplenishmentPlanRequest) returns (RecallReplenishmentPlanResponse);

  // Comments a replenishment plan.
  rpc CommentReplenishmentPlanApproval(CommentReplenishmentPlanApprovalRequest) returns (CommentReplenishmentPlanApprovalResponse);
}

// The request of `SubmitReplenishmentPlan`.
message SubmitReplenishmentPlanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string replenishment_plan_id = 2;
  ReplenishmentPlan replenishment_plan = 3;
  SubmitReplenishmentPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitReplenishmentPlan`.
message SubmitReplenishmentPlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReplenishmentPlan replenishment_plan = 1;
  SubmitReplenishmentPlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

