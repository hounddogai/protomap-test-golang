syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "StockItemWorkflowServiceProto";
option java_package = "com.acme.inventory.v1";

// Runs the long-lived workflow that takes a stock item from start to finish.
service StockItemWorkflowService {
  // Starts a stock item.
  rpc StartStockItemWorkflow(StartStockItemWorkflowRequest) returns (StartStockItemWorkflowResponse);

  // Advances a stock item.
  rpc AdvanceStockItemWorkflow(AdvanceStockItemWorkflowRequest) returns (AdvanceStockItemWorkflowResponse);

  // Cancels a stock item.
  rpc CancelStockItemWorkflow(CancelStockItemWorkflowRequest) returns (CancelStockItemWorkflowResponse);

  // Pauses a stock item.
  rpc PauseStockItemWorkflow(PauseStockItemWorkflowRequest) returns (PauseStockItemWorkflowResponse);

  // Resumes a stock item.
  rpc ResumeStockItemWorkflow(ResumeStockItemWorkflowRequest) returns (ResumeStockItemWorkflowResponse);

  // Returns a stock item.
  rpc InspectStockItemWorkflow(InspectStockItemWorkflowRequest) returns (InspectStockItemWorkflowResponse);

  // Lists stock items a page at a time.
  rpc ListStockItemWorkflows(ListStockItemWorkflowsRequest) returns (ListStockItemWorkflowsResponse);

  // Signals a stock item.
  rpc SignalStockItemWorkflow(SignalStockItemWorkflowRequest) returns (SignalStockItemWorkflowResponse);
}

// The request of `StartStockItemWorkflow`.
message StartStockItemWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stock_item_id = 2;
  StockItem stock_item = 3;
  StartStockItemWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartStockItemWorkflow`.
message StartStockItemWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StockItem stock_item = 1;
  StartStockItemWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

