syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "ReplenishmentPlanCalculationServiceProto";
option java_package = "com.acme.inventory.v1";

// Computes the figures of a replenishment plan, such as totals, taxes, and estimates.
service ReplenishmentPlanCalculationService {
  // Calculates a replenishment plan.
  rpc CalculateReplenishmentPlan(CalculateReplenishmentPlanRequest) returns (CalculateReplenishmentPlanResponse);

  // Estimates a replenishment plan.
  rpc EstimateReplenishmentPlan(EstimateReplenishmentPlanRequest) returns (EstimateReplenishmentPlanResponse);

  // Quotes a replenishment plan.
  rpc QuoteReplenishmentPlan(QuoteReplenishmentPlanRequest) returns (QuoteReplenishmentPlanResponse);

  // Compares a replenishment plan.
  rpc CompareReplenishmentPlanOptions(CompareReplenishmentPlanOptionsRequest) returns (CompareReplenishmentPlanOptionsResponse);

  // Recalculates a replenishment plan.
  rpc RecalculateReplenishmentPlans(RecalculateReplenishmentPlansRequest) returns (RecalculateReplenishmentPlansResponse);

  // Simulates a replenishment plan.
  rpc SimulateReplenishmentPlan(SimulateReplenishmentPlanRequest) returns (SimulateReplenishmentPlanResponse);

  // Explains a replenishment plan.
  rpc ExplainReplenishmentPlanCalculation(ExplainReplenishmentPlanCalculationRequest) returns (ExplainReplenishmentPlanCalculationResponse);

  // Returns a replenishment plan.
  rpc GetReplenishmentPlanRates(GetReplenishmentPlanRatesRequest) returns (GetReplenishmentPlanRatesResponse);
}

// The request of `CalculateReplenishmentPlan`.
message CalculateReplenishmentPlanRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string replenishment_plan_id = 2;
  ReplenishmentPlan replenishment_plan = 3;
  CalculateReplenishmentPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReplenishmentPlan`.
message CalculateReplenishmentPlanResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReplenishmentPlanResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReplenishmentPlan replenishment_plan = 1;
  CalculateReplenishmentPlanResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

