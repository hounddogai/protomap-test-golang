syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "StockReservationApprovalServiceProto";
option java_package = "com.acme.inventory.v1";

// Routes stock reservations through approval, with escalation and delegation.
service StockReservationApprovalService {
  // Submits a stock reservation.
  rpc SubmitStockReservation(SubmitStockReservationRequest) returns (SubmitStockReservationResponse);

  // Approves a stock reservation.
  rpc ApproveStockReservation(ApproveStockReservationRequest) returns (ApproveStockReservationResponse);

  // Escalates a stock reservation.
  rpc EscalateStockReservation(EscalateStockReservationRequest) returns (EscalateStockReservationResponse);

  // Delegates a stock reservation.
  rpc DelegateStockReservationApproval(DelegateStockReservationApprovalRequest) returns (DelegateStockReservationApprovalResponse);

  // Recalls a stock reservation.
  rpc RecallStockReservation(RecallStockReservationRequest) returns (RecallStockReservationResponse);

  // Returns a stock reservation.
  rpc GetStockReservationApprovalStatus(GetStockReservationApprovalStatusRequest) returns (GetStockReservationApprovalStatusResponse);

  // Comments a stock reservation.
  rpc CommentStockReservationApproval(CommentStockReservationApprovalRequest) returns (CommentStockReservationApprovalResponse);
}

// The request of `SubmitStockReservation`.
message SubmitStockReservationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stock_reservation_id = 2;
  StockReservation stock_reservation = 3;
  SubmitStockReservationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStockReservation`.
message SubmitStockReservationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StockReservation stock_reservation = 1;
  SubmitStockReservationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

