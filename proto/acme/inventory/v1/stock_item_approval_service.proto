syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "StockItemApprovalServiceProto";
option java_package = "com.acme.inventory.v1";

// Routes stock items through approval, with escalation and delegation.
service StockItemApprovalService {
  // Submits a stock item.
  rpc SubmitStockItem(SubmitStockItemRequest) returns (SubmitStockItemResponse);

  // Approves a stock item.
  rpc ApproveStockItem(ApproveStockItemRequest) returns (ApproveStockItemResponse);

  // Rejects a stock item.
  rpc RejectStockItem(RejectStockItemRequest) returns (RejectStockItemResponse);

  // Escalates a stock item.
  rpc EscalateStockItem(EscalateStockItemRequest) returns (EscalateStockItemResponse);

  // Lists stock items a page at a time.
  rpc ListPendingStockItems(ListPendingStockItemsRequest) returns (ListPendingStockItemsResponse);

  // Delegates a stock item.
  rpc DelegateStockItemApproval(DelegateStockItemApprovalRequest) returns (DelegateStockItemApprovalResponse);

  // Recalls a stock item.
  rpc RecallStockItem(RecallStockItemRequest) returns (RecallStockItemResponse);

  // Returns a stock item.
  rpc GetStockItemApprovalStatus(GetStockItemApprovalStatusRequest) returns (GetStockItemApprovalStatusResponse);

  // Comments a stock item.
  rpc CommentStockItemApproval(CommentStockItemApprovalRequest) returns (CommentStockItemApprovalResponse);
}

// The request of `SubmitStockItem`.
message SubmitStockItemRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stock_item_id = 2;
  StockItem stock_item = 3;
  SubmitStockItemRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStockItem`.
message SubmitStockItemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StockItem stock_item = 1;
  SubmitStockItemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

