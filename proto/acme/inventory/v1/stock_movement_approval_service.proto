  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stock_movement_id = 2;
  StockMovement stock_movement = 3;
  CommentStockMovementApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CommentStockMovementApproval`.
message CommentStockMovementApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StockMovement stock_movement = 1;
  CommentStockMovementApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
