syntax = "proto3";

package acme.inventory.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.inventory.v1";

// A reference to a stock item of the inventory domain.
message StockItemRef {
  string stock_item_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a stock reservation of the inventory domain.
message StockReservationRef {
  string stock_reservation_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a stock movement of the inventory domain.
message StockMovementRef {
  string stock_movement_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a replenishment plan of the inventory domain.
message ReplenishmentPlanRef {
  string replenishment_plan_id = 1;
  string display_name = 2;
  string number = 3;
}
