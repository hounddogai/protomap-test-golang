syntax = "proto3";

package acme.inventory.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/inventory/v1/inventory.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Inventory.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/inventory/v1;inventoryv1";
option java_multiple_files = true;
option java_outer_classname = "StockMovementValidationServiceProto";
option java_package = "com.acme.inventory.v1";

// Checks stock movements against the rules before anything acts on them.
service StockMovementValidationService {
  // Validates a stock movement.
  rpc ValidateStockMovement(ValidateStockMovementRequest) returns (ValidateStockMovementResponse);

  // Previews a stock movement.
  rpc PreviewStockMovement(PreviewStockMovementRequest) returns (PreviewStockMovementResponse);

  // Checks a stock movement.
  rpc CheckStockMovementEligibility(CheckStockMovementEligibilityRequest) returns (CheckStockMovementEligibilityResponse);

  // Normalizes a stock movement.
  rpc NormalizeStockMovement(NormalizeStockMovementRequest) returns (NormalizeStockMovementResponse);

  // Explains a stock movement.
  rpc ExplainStockMovementDecision(ExplainStockMovementDecisionRequest) returns (ExplainStockMovementDecisionResponse);

  // Scores a stock movement.
  rpc ScoreStockMovement(ScoreStockMovementRequest) returns (ScoreStockMovementResponse);

  // Lints a stock movement.
  rpc LintStockMovements(LintStockMovementsRequest) returns (LintStockMovementsResponse);

  // Returns a stock movement.
  rpc GetStockMovementRules(GetStockMovementRulesRequest) returns (GetStockMovementRulesResponse);
}

// The request of `ValidateStockMovement`.
message ValidateStockMovementRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string stock_movement_id = 2;
  StockMovement stock_movement = 3;
  ValidateStockMovementRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateStockMovement`.
message ValidateStockMovementResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StockMovement stock_movement = 1;
  ValidateStockMovementResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

