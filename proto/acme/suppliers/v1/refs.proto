syntax = "proto3";

package acme.suppliers.v1;

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.suppliers.v1";

// A reference to a supplier of the suppliers domain.
message SupplierRef {
  string supplier_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to a supplier contract of the suppliers domain.
message SupplierContractRef {
  string supplier_contract_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a supplier rating of the suppliers domain.
message SupplierRatingRef {
  string supplier_rating_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a supplier risk of the suppliers domain.
message SupplierRiskRef {
  string supplier_risk_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
