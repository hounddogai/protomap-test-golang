syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierQueryServiceProto";
option java_package = "com.acme.suppliers.v1";

// Answers read-only questions about suppliers, for screens and reports.
service SupplierQueryService {
  // Returns a supplier.
  rpc LookupSupplier(LookupSupplierRequest) returns (LookupSupplierResponse);

  // Lists suppliers a page at a time.
  rpc BrowseSuppliers(BrowseSuppliersRequest) returns (BrowseSuppliersResponse);

  // Lists suppliers a page at a time.
  rpc FindSuppliers(FindSuppliersRequest) returns (FindSuppliersResponse);

  // Counts suppliers by status.
  rpc CountSuppliers(CountSuppliersRequest) returns (CountSuppliersResponse);

  // Returns several suppliers at once.
  rpc ResolveSuppliers(ResolveSuppliersRequest) returns (ResolveSuppliersResponse);

  // Streams every matching supplier.
  rpc ExportSuppliers(ExportSuppliersRequest) returns (stream ExportSuppliersResponse);

  // Summarizes a supplier.
  rpc SummarizeSuppliers(SummarizeSuppliersRequest) returns (SummarizeSuppliersResponse);

  // Lists suppliers a page at a time.
  rpc SuggestSuppliers(SuggestSuppliersRequest) returns (SuggestSuppliersResponse);

  // Returns a supplier.
  rpc PeekSupplier(PeekSupplierRequest) returns (PeekSupplierResponse);
}

// The request of `LookupSupplier`.
message LookupSupplierRequest {
  acme.common.v1.RequestContext context = 1;
  string supplier_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSupplier`.
message LookupSupplierResponse {
  Supplier supplier = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSuppliers`.
message BrowseSuppliersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SupplierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSuppliersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSuppliers`.
message BrowseSuppliersResponse {
  repeated Supplier suppliers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSuppliers`.
message FindSuppliersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SupplierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSuppliersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSuppliers`.
message FindSuppliersResponse {
  repeated Supplier suppliers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSuppliers`.
message CountSuppliersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SupplierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSuppliersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSuppliers`.
message CountSuppliersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSuppliers`.
message ResolveSuppliersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string supplier_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSuppliers`.
message ResolveSuppliersResponse {
  repeated Supplier suppliers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSuppliers`.
message ExportSuppliersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SupplierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSuppliersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSuppliers`.
message ExportSuppliersResponse {
  Supplier supplier = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSuppliers`.
message SummarizeSuppliersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_id = 2;
  SummarizeSuppliersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSuppliers`.
message SummarizeSuppliersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSuppliers`.
message SuggestSuppliersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SupplierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSuppliersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSuppliers`.
message SuggestSuppliersResponse {
  repeated Supplier suppliers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSupplier`.
message PeekSupplierRequest {
  acme.common.v1.RequestContext context = 1;
  string supplier_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSupplier`.
message PeekSupplierResponse {
  Supplier supplier = 1;
  acme.common.v1.OperationResult result = 2;
}
