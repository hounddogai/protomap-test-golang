syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/suppliers/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SuppliersProto";
option java_package = "com.acme.suppliers.v1";

// Where a supplier is in its lifecycle.
enum SupplierStatus {
  SUPPLIER_STATUS_UNSPECIFIED = 0;
  SUPPLIER_STATUS_PROSPECT = 1;
  SUPPLIER_STATUS_ACTIVE = 2;
  SUPPLIER_STATUS_SUSPENDED = 3;
  SUPPLIER_STATUS_CLOSED = 4;
}

// Where a supplier contract is in its lifecycle.
enum SupplierContractStatus {
  SUPPLIER_CONTRACT_STATUS_UNSPECIFIED = 0;
  SUPPLIER_CONTRACT_STATUS_DRAFT = 1;
  SUPPLIER_CONTRACT_STATUS_ISSUED = 2;
  SUPPLIER_CONTRACT_STATUS_APPROVED = 3;
  SUPPLIER_CONTRACT_STATUS_PAID = 4;
  SUPPLIER_CONTRACT_STATUS_VOID = 5;
}

// Where a supplier rating is in its lifecycle.
enum SupplierRatingStatus {
  SUPPLIER_RATING_STATUS_UNSPECIFIED = 0;
  SUPPLIER_RATING_STATUS_DRAFT = 1;
  SUPPLIER_RATING_STATUS_ISSUED = 2;
  SUPPLIER_RATING_STATUS_APPROVED = 3;
  SUPPLIER_RATING_STATUS_PAID = 4;
  SUPPLIER_RATING_STATUS_VOID = 5;
}

// Where a supplier risk is in its lifecycle.
enum SupplierRiskStatus {
  SUPPLIER_RISK_STATUS_UNSPECIFIED = 0;
  SUPPLIER_RISK_STATUS_NEW = 1;
  SUPPLIER_RISK_STATUS_OPEN = 2;
  SUPPLIER_RISK_STATUS_WAITING = 3;
  SUPPLIER_RISK_STATUS_RESOLVED = 4;
  SUPPLIER_RISK_STATUS_CLOSED = 5;
}

// The preferences of a supplier.
message SupplierPreferences {
  string language = 1;
  bool marketing_opt_in = 2;
  repeated string channels = 3;
  acme.common.v1.TimeWindow quiet_hours = 4;
}

// The passport of a supplier.
message SupplierPassport {
  string number = 1;
  string issuing_country = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// The national id of a supplier.
message SupplierNationalId {
  string number = 1;
  string issuing_country = 2;
}

// A supplier of the suppliers domain.
message Supplier {
  string supplier_id = 1;
  acme.common.v1.PersonName name = 2;
  acme.common.v1.ContactInfo contact = 3;
  acme.common.v1.PostalAddress primary_address = 4;
  SupplierStatus status = 5;
  repeated string segments = 6;
  map<string, string> attributes = 7;
  SupplierPreferences preferences = 8;
  oneof identity_document {
    SupplierPassport passport = 9;
    SupplierNationalId national_id = 10;
    string tax_number = 11;
  }
  acme.identity.v1.UserRef relationship_manager = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a supplier contract.
message SupplierContractLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  SupplierContractLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a supplier contract line.
message SupplierContractLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a supplier contract.
message SupplierContractCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a supplier contract.
message SupplierContractBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a supplier contract.
message SupplierContractAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A supplier contract of the suppliers domain.
message SupplierContract {
  string supplier_contract_id = 1;
  string number = 2;
  SupplierContractStatus status = 3;
  SupplierRef counterparty = 4;
  repeated SupplierContractLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    SupplierContractCardSettlement card = 8;
    SupplierContractBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated SupplierContractAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a supplier rating.
message SupplierRatingLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  SupplierRatingLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a supplier rating line.
message SupplierRatingLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a supplier rating.
message SupplierRatingCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a supplier rating.
message SupplierRatingBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a supplier rating.
message SupplierRatingAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A supplier rating of the suppliers domain.
message SupplierRating {
  string supplier_rating_id = 1;
  string number = 2;
  SupplierRatingStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated SupplierRatingLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    SupplierRatingCardSettlement card = 8;
    SupplierRatingBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated SupplierRatingAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of a supplier risk.
message SupplierRiskComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a supplier risk.
message SupplierRiskSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a supplier risk.
message SupplierRiskChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a supplier risk.
message SupplierRiskStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A supplier risk of the suppliers domain.
message SupplierRisk {
  string supplier_risk_id = 1;
  string subject = 2;
  SupplierRiskStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated SupplierRiskComment comments = 7;
  SupplierRiskSla sla = 8;
  oneof origin {
    SupplierContractRef customer = 9;
    string external_reference = 10;
    SupplierRiskChannelOrigin channel = 11;
  }
  repeated SupplierRiskStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
