syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretServiceProto";
option java_package = "com.acme.secrets.v1";

// Manages secrets: creates, reads, changes, and lists them.
service SecretService {
  // Creates a secret.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);

  // Returns a secret.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);

  // Changes a secret.
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);

  // Deletes a secret.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // Lists secrets a page at a time.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Lists secrets a page at a time.
  rpc SearchSecrets(SearchSecretsRequest) returns (SearchSecretsResponse);

  // Streams the changes of secrets as they happen.
  rpc WatchSecrets(WatchSecretsRequest) returns (stream WatchSecretsResponse);

  // Takes a stream of secrets and answers once at the end.
  rpc BatchCreateSecrets(stream BatchCreateSecretsRequest) returns (BatchCreateSecretsResponse);

  // Creates a secret.
  rpc CloneSecret(CloneSecretRequest) returns (CloneSecretResponse);
}

// The request of `CreateSecret`.
message CreateSecretRequest {
  acme.common.v1.RequestContext context = 1;
  Secret secret = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateSecret`.
message CreateSecretResponse {
  Secret secret = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetSecret`.
message GetSecretRequest {
  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSecret`.
message GetSecretResponse {
  Secret secret = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateSecret`.
message UpdateSecretRequest {
  acme.common.v1.RequestContext context = 1;
  Secret secret = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateSecret`.
message UpdateSecretResponse {
  Secret secret = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteSecret`.
message DeleteSecretRequest {
  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSecret`.
message DeleteSecretResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListSecrets`.
message ListSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSecretsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSecrets`.
message ListSecretsResponse {
  repeated Secret secrets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchSecrets`.
message SearchSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchSecretsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchSecrets`.
message SearchSecretsResponse {
  repeated Secret secrets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchSecrets`.
message WatchSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchSecretsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchSecrets`.
message WatchSecretsResponse {
  Secret secret = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateSecrets`.
message BatchCreateSecretsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateSecretsRequest.StreamHeader header = 2;
    Secret record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateSecrets`.
message BatchCreateSecretsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string secret_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateSecretsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneSecret`.
message CloneSecretRequest {
  acme.common.v1.RequestContext context = 1;
  Secret secret = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneSecret`.
message CloneSecretResponse {
  Secret secret = 1;
  acme.common.v1.OperationResult result = 2;
}
