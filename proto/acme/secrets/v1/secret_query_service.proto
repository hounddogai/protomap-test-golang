syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretQueryServiceProto";
option java_package = "com.acme.secrets.v1";

// Answers read-only questions about secrets, for screens and reports.
service SecretQueryService {
  // Returns a secret.
  rpc LookupSecret(LookupSecretRequest) returns (LookupSecretResponse);

  // Lists secrets a page at a time.
  rpc BrowseSecrets(BrowseSecretsRequest) returns (BrowseSecretsResponse);

  // Lists secrets a page at a time.
  rpc FindSecrets(FindSecretsRequest) returns (FindSecretsResponse);

  // Counts secrets by status.
  rpc CountSecrets(CountSecretsRequest) returns (CountSecretsResponse);

  // Streams every matching secret.
  rpc ExportSecrets(ExportSecretsRequest) returns (stream ExportSecretsResponse);

  // Summarizes a secret.
  rpc SummarizeSecrets(SummarizeSecretsRequest) returns (SummarizeSecretsResponse);

  // Returns a secret.
  rpc PeekSecret(PeekSecretRequest) returns (PeekSecretResponse);
}

// The request of `LookupSecret`.
message LookupSecretRequest {
  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSecret`.
message LookupSecretResponse {
  Secret secret = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSecrets`.
message BrowseSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSecretsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSecrets`.
message BrowseSecretsResponse {
  repeated Secret secrets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSecrets`.
message FindSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSecretsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSecrets`.
message FindSecretsResponse {
  repeated Secret secrets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSecrets`.
message CountSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSecretsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSecrets`.
message CountSecretsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSecrets`.
message ExportSecretsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSecretsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSecrets`.
message ExportSecretsResponse {
  Secret secret = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSecrets`.
message SummarizeSecretsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  SummarizeSecretsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSecrets`.
message SummarizeSecretsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekSecret`.
message PeekSecretRequest {
  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSecret`.
message PeekSecretResponse {
  Secret secret = 1;
  acme.common.v1.OperationResult result = 2;
}
