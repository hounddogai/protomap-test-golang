syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/secrets/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretsProto";
option java_package = "com.acme.secrets.v1";

// Where a secret is in its lifecycle.
enum SecretStatus {
  SECRET_STATUS_UNSPECIFIED = 0;
  SECRET_STATUS_PENDING = 1;
  SECRET_STATUS_OPEN = 2;
  SECRET_STATUS_FROZEN = 3;
  SECRET_STATUS_CLOSED = 4;
}

// Where a secret version is in its lifecycle.
enum SecretVersionStatus {
  SECRET_VERSION_STATUS_UNSPECIFIED = 0;
  SECRET_VERSION_STATUS_RECEIVED = 1;
  SECRET_VERSION_STATUS_PROCESSED = 2;
  SECRET_VERSION_STATUS_DISCARDED = 3;
}

// Where an access grant is in its lifecycle.
enum AccessGrantStatus {
  ACCESS_GRANT_STATUS_UNSPECIFIED = 0;
  ACCESS_GRANT_STATUS_DRAFT = 1;
  ACCESS_GRANT_STATUS_ENABLED = 2;
  ACCESS_GRANT_STATUS_DISABLED = 3;
  ACCESS_GRANT_STATUS_RETIRED = 4;
}

// The limit of a secret.
message SecretLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a secret.
message SecretCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a secret.
message SecretBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A secret of the secrets domain.
message Secret {
  string secret_id = 1;
  acme.identity.v1.UserRef holder = 2;
  SecretStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated SecretLimit limits = 7;
  oneof funding {
    SecretCardFunding card = 8;
    SecretBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The measurement of a secret version.
message SecretVersionMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A secret version of the secrets domain.
message SecretVersion {
  string secret_version_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  AccessGrantRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated SecretVersionMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of an access grant.
message AccessGrantCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of an access grant.
message AccessGrantDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of an access grant.
message AccessGrantRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of an access grant.
message AccessGrantBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// An access grant of the secrets domain.
message AccessGrant {
  string access_grant_id = 1;
  string name = 2;
  string description = 3;
  AccessGrantStatus status = 4;
  int32 priority = 5;
  repeated AccessGrantCondition conditions = 6;
  oneof action {
    AccessGrantDiscountAction discount = 7;
    AccessGrantRouteAction route = 8;
    AccessGrantBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
