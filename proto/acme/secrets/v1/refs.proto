syntax = "proto3";

package acme.secrets.v1;

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.secrets.v1";

// A reference to a secret of the secrets domain.
message SecretRef {
  string secret_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a secret version of the secrets domain.
message SecretVersionRef {
  string secret_version_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to an access grant of the secrets domain.
message AccessGrantRef {
  string access_grant_id = 1;
  string display_name = 2;
  int64 version = 3;
}
