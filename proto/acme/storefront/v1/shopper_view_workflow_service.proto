option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "ShopperViewWorkflowServiceProto";
option java_package = "com.acme.storefront.v1";

// Runs the long-lived workflow that takes a shopper view from start to finish.
service ShopperViewWorkflowService {
  // Starts a shopper view.
  rpc StartShopperViewWorkflow(StartShopperViewWorkflowRequest) returns (StartShopperViewWorkflowResponse);

  // Advances a shopper view.
  rpc AdvanceShopperViewWorkflow(AdvanceShopperViewWorkflowRequest) returns (AdvanceShopperViewWorkflowResponse);

  // Cancels a shopper view.
  rpc CancelShopperViewWorkflow(CancelShopperViewWorkflowRequest) returns (CancelShopperViewWorkflowResponse);

  // Retrys a shopper view.
  rpc RetryShopperViewWorkflow(RetryShopperViewWorkflowRequest) returns (RetryShopperViewWorkflowResponse);

  // Pauses a shopper view.
  rpc PauseShopperViewWorkflow(PauseShopperViewWorkflowRequest) returns (PauseShopperViewWorkflowResponse);

  // Resumes a shopper view.
  rpc ResumeShopperViewWorkflow(ResumeShopperViewWorkflowRequest) returns (ResumeShopperViewWorkflowResponse);

  // Returns a shopper view.
  rpc InspectShopperViewWorkflow(InspectShopperViewWorkflowRequest) returns (InspectShopperViewWorkflowResponse);

  // Lists shopper views a page at a time.
  rpc ListShopperViewWorkflows(ListShopperViewWorkflowsRequest) returns (ListShopperViewWorkflowsResponse);

  // Signals a shopper view.
  rpc SignalShopperViewWorkflow(SignalShopperViewWorkflowRequest) returns (SignalShopperViewWorkflowResponse);
}

// The request of `StartShopperViewWorkflow`.
message StartShopperViewWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  ShopperView shopper_view = 3;
  StartShopperViewWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartShopperViewWorkflow`.
message StartShopperViewWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ShopperView shopper_view = 1;
  StartShopperViewWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

