syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "StorefrontSessionNotificationServiceProto";
option java_package = "com.acme.storefront.v1";

// Tells the people who follow a storefront session what changed.
service StorefrontSessionNotificationService {
  // Subscribes a storefront session.
  rpc SubscribeStorefrontSessionUpdates(SubscribeStorefrontSessionUpdatesRequest) returns (SubscribeStorefrontSessionUpdatesResponse);

  // Unsubscribes a storefront session.
  rpc UnsubscribeStorefrontSessionUpdates(UnsubscribeStorefrontSessionUpdatesRequest) returns (UnsubscribeStorefrontSessionUpdatesResponse);

  // Notifys a storefront session.
  rpc NotifyStorefrontSessionWatchers(NotifyStorefrontSessionWatchersRequest) returns (NotifyStorefrontSessionWatchersResponse);

  // Lists storefront sessions a page at a time.
  rpc ListStorefrontSessionSubscriptions(ListStorefrontSessionSubscriptionsRequest) returns (ListStorefrontSessionSubscriptionsResponse);

  // Sends a storefront session.
  rpc SendStorefrontSessionTestNotice(SendStorefrontSessionTestNoticeRequest) returns (SendStorefrontSessionTestNoticeResponse);

  // Returns a storefront session.
  rpc GetStorefrontSessionPreferences(GetStorefrontSessionPreferencesRequest) returns (GetStorefrontSessionPreferencesResponse);

  // Streams the changes of storefront sessions as they happen.
  rpc StreamStorefrontSessionNotices(StreamStorefrontSessionNoticesRequest) returns (stream StreamStorefrontSessionNoticesResponse);
}

// The request of `SubscribeStorefrontSessionUpdates`.
message SubscribeStorefrontSessionUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  SubscribeStorefrontSessionUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeStorefrontSessionUpdates`.
message SubscribeStorefrontSessionUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StorefrontSession storefront_session = 1;
  SubscribeStorefrontSessionUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeStorefrontSessionUpdates`.
message UnsubscribeStorefrontSessionUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  UnsubscribeStorefrontSessionUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeStorefrontSessionUpdates`.
message UnsubscribeStorefrontSessionUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StorefrontSession storefront_session = 1;
  UnsubscribeStorefrontSessionUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

