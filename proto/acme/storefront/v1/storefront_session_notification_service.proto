  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StorefrontSession storefront_session = 1;
  NotifyStorefrontSessionWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListStorefrontSessionSubscriptions`.
message ListStorefrontSessionSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListStorefrontSessionSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListStorefrontSessionSubscriptions`.
message ListStorefrontSessionSubscriptionsResponse {
  repeated StorefrontSession storefront_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

