syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "LandingPageQueryServiceProto";
option java_package = "com.acme.storefront.v1";

// Answers read-only questions about landing pages, for screens and reports.
service LandingPageQueryService {
  // Returns a landing page.
  rpc LookupLandingPage(LookupLandingPageRequest) returns (LookupLandingPageResponse);

  // Lists landing pages a page at a time.
  rpc BrowseLandingPages(BrowseLandingPagesRequest) returns (BrowseLandingPagesResponse);

  // Counts landing pages by status.
  rpc CountLandingPages(CountLandingPagesRequest) returns (CountLandingPagesResponse);

  // Returns several landing pages at once.
  rpc ResolveLandingPages(ResolveLandingPagesRequest) returns (ResolveLandingPagesResponse);

  // Summarizes a landing page.
  rpc SummarizeLandingPages(SummarizeLandingPagesRequest) returns (SummarizeLandingPagesResponse);

  // Lists landing pages a page at a time.
  rpc SuggestLandingPages(SuggestLandingPagesRequest) returns (SuggestLandingPagesResponse);

  // Returns a landing page.
  rpc PeekLandingPage(PeekLandingPageRequest) returns (PeekLandingPageResponse);
}

// The request of `LookupLandingPage`.
message LookupLandingPageRequest {
  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupLandingPage`.
message LookupLandingPageResponse {
  LandingPage landing_page = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseLandingPages`.
message BrowseLandingPagesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LandingPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseLandingPagesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseLandingPages`.
message BrowseLandingPagesResponse {
  repeated LandingPage landing_pages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLandingPages`.
message CountLandingPagesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LandingPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLandingPagesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLandingPages`.
message CountLandingPagesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveLandingPages`.
message ResolveLandingPagesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string landing_page_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveLandingPages`.
message ResolveLandingPagesResponse {
  repeated LandingPage landing_pages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeLandingPages`.
message SummarizeLandingPagesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  SummarizeLandingPagesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeLandingPages`.
message SummarizeLandingPagesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestLandingPages`.
message SuggestLandingPagesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LandingPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestLandingPagesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestLandingPages`.
message SuggestLandingPagesResponse {
  repeated LandingPage landing_pages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekLandingPage`.
message PeekLandingPageRequest {
  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekLandingPage`.
message PeekLandingPageResponse {
  LandingPage landing_page = 1;
  acme.common.v1.OperationResult result = 2;
}
