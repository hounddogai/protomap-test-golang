option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "StorefrontSessionWorkflowServiceProto";
option java_package = "com.acme.storefront.v1";

// Runs the long-lived workflow that takes a storefront session from start to finish.
service StorefrontSessionWorkflowService {
  // Starts a storefront session.
  rpc StartStorefrontSessionWorkflow(StartStorefrontSessionWorkflowRequest) returns (StartStorefrontSessionWorkflowResponse);

  // Advances a storefront session.
  rpc AdvanceStorefrontSessionWorkflow(AdvanceStorefrontSessionWorkflowRequest) returns (AdvanceStorefrontSessionWorkflowResponse);

  // Cancels a storefront session.
  rpc CancelStorefrontSessionWorkflow(CancelStorefrontSessionWorkflowRequest) returns (CancelStorefrontSessionWorkflowResponse);

  // Retrys a storefront session.
  rpc RetryStorefrontSessionWorkflow(RetryStorefrontSessionWorkflowRequest) returns (RetryStorefrontSessionWorkflowResponse);

  // Pauses a storefront session.
  rpc PauseStorefrontSessionWorkflow(PauseStorefrontSessionWorkflowRequest) returns (PauseStorefrontSessionWorkflowResponse);

  // Resumes a storefront session.
  rpc ResumeStorefrontSessionWorkflow(ResumeStorefrontSessionWorkflowRequest) returns (ResumeStorefrontSessionWorkflowResponse);

  // Lists storefront sessions a page at a time.
  rpc ListStorefrontSessionWorkflows(ListStorefrontSessionWorkflowsRequest) returns (ListStorefrontSessionWorkflowsResponse);

  // Signals a storefront session.
  rpc SignalStorefrontSessionWorkflow(SignalStorefrontSessionWorkflowRequest) returns (SignalStorefrontSessionWorkflowResponse);
}

// The request of `StartStorefrontSessionWorkflow`.
message StartStorefrontSessionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  StorefrontSession storefront_session = 3;
  StartStorefrontSessionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartStorefrontSessionWorkflow`.
message StartStorefrontSessionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StorefrontSession storefront_session = 1;
  StartStorefrontSessionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

