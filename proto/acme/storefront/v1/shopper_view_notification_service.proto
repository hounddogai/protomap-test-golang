syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "ShopperViewNotificationServiceProto";
option java_package = "com.acme.storefront.v1";

// Tells the people who follow a shopper view what changed.
service ShopperViewNotificationService {
  // Subscribes a shopper view.
  rpc SubscribeShopperViewUpdates(SubscribeShopperViewUpdatesRequest) returns (SubscribeShopperViewUpdatesResponse);

  // Unsubscribes a shopper view.
  rpc UnsubscribeShopperViewUpdates(UnsubscribeShopperViewUpdatesRequest) returns (UnsubscribeShopperViewUpdatesResponse);

  // Notifys a shopper view.
  rpc NotifyShopperViewWatchers(NotifyShopperViewWatchersRequest) returns (NotifyShopperViewWatchersResponse);

  // Lists shopper views a page at a time.
  rpc ListShopperViewSubscriptions(ListShopperViewSubscriptionsRequest) returns (ListShopperViewSubscriptionsResponse);

  // Sends a shopper view.
  rpc SendShopperViewTestNotice(SendShopperViewTestNoticeRequest) returns (SendShopperViewTestNoticeResponse);

  // Returns a shopper view.
  rpc GetShopperViewPreferences(GetShopperViewPreferencesRequest) returns (GetShopperViewPreferencesResponse);

  // Streams the changes of shopper views as they happen.
  rpc StreamShopperViewNotices(StreamShopperViewNoticesRequest) returns (stream StreamShopperViewNoticesResponse);
}

// The request of `SubscribeShopperViewUpdates`.
message SubscribeShopperViewUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  SubscribeShopperViewUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeShopperViewUpdates`.
message SubscribeShopperViewUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ShopperView shopper_view = 1;
  SubscribeShopperViewUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeShopperViewUpdates`.
message UnsubscribeShopperViewUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  UnsubscribeShopperViewUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeShopperViewUpdates`.
message UnsubscribeShopperViewUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ShopperView shopper_view = 1;
  UnsubscribeShopperViewUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyShopperViewWatchers`.
message NotifyShopperViewWatchersRequest {
  // What the operation needs besides the record.
