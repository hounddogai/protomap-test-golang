syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/storefront/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "StorefrontProto";
option java_package = "com.acme.storefront.v1";

// Where a storefront session is in its lifecycle.
enum StorefrontSessionStatus {
  STOREFRONT_SESSION_STATUS_UNSPECIFIED = 0;
  STOREFRONT_SESSION_STATUS_NEW = 1;
  STOREFRONT_SESSION_STATUS_OPEN = 2;
  STOREFRONT_SESSION_STATUS_WAITING = 3;
  STOREFRONT_SESSION_STATUS_RESOLVED = 4;
  STOREFRONT_SESSION_STATUS_CLOSED = 5;
}

// Where a shopper view is in its lifecycle.
enum ShopperViewStatus {
  SHOPPER_VIEW_STATUS_UNSPECIFIED = 0;
  SHOPPER_VIEW_STATUS_PLANNED = 1;
  SHOPPER_VIEW_STATUS_AVAILABLE = 2;
  SHOPPER_VIEW_STATUS_RESERVED = 3;
  SHOPPER_VIEW_STATUS_RETIRED = 4;
}

// Where a landing page is in its lifecycle.
enum LandingPageStatus {
  LANDING_PAGE_STATUS_UNSPECIFIED = 0;
  LANDING_PAGE_STATUS_DRAFT = 1;
  LANDING_PAGE_STATUS_ISSUED = 2;
  LANDING_PAGE_STATUS_APPROVED = 3;
  LANDING_PAGE_STATUS_PAID = 4;
  LANDING_PAGE_STATUS_VOID = 5;
}

// The comment of a storefront session.
message StorefrontSessionComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a storefront session.
message StorefrontSessionSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a storefront session.
message StorefrontSessionChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a storefront session.
message StorefrontSessionStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A storefront session of the storefront domain.
message StorefrontSession {
  string storefront_session_id = 1;
  string subject = 2;
  StorefrontSessionStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated StorefrontSessionComment comments = 7;
  StorefrontSessionSla sla = 8;
  oneof origin {
    ShopperViewRef customer = 9;
    string external_reference = 10;
    StorefrontSessionChannelOrigin channel = 11;
  }
  repeated StorefrontSessionStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The dimensions of a shopper view.
message ShopperViewDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of a shopper view.
message ShopperViewComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// A shopper view of the storefront domain.
message ShopperView {
  string shopper_view_id = 1;
  string code = 2;
  string name = 3;
  ShopperViewStatus status = 4;
  repeated string category_path = 5;
  ShopperViewDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, ShopperViewComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of a landing page.
message LandingPageLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  LandingPageLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a landing page line.
message LandingPageLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a landing page.
message LandingPageCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a landing page.
message LandingPageBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a landing page.
message LandingPageAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A landing page of the storefront domain.
message LandingPage {
  string landing_page_id = 1;
  string number = 2;
  LandingPageStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated LandingPageLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    LandingPageCardSettlement card = 8;
    LandingPageBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated LandingPageAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
