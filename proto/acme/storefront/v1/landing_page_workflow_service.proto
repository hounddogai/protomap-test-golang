option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "LandingPageWorkflowServiceProto";
option java_package = "com.acme.storefront.v1";

// Runs the long-lived workflow that takes a landing page from start to finish.
service LandingPageWorkflowService {
  // Starts a landing page.
  rpc StartLandingPageWorkflow(StartLandingPageWorkflowRequest) returns (StartLandingPageWorkflowResponse);

  // Advances a landing page.
  rpc AdvanceLandingPageWorkflow(AdvanceLandingPageWorkflowRequest) returns (AdvanceLandingPageWorkflowResponse);

  // Cancels a landing page.
  rpc CancelLandingPageWorkflow(CancelLandingPageWorkflowRequest) returns (CancelLandingPageWorkflowResponse);

  // Retrys a landing page.
  rpc RetryLandingPageWorkflow(RetryLandingPageWorkflowRequest) returns (RetryLandingPageWorkflowResponse);

  // Pauses a landing page.
  rpc PauseLandingPageWorkflow(PauseLandingPageWorkflowRequest) returns (PauseLandingPageWorkflowResponse);

  // Resumes a landing page.
  rpc ResumeLandingPageWorkflow(ResumeLandingPageWorkflowRequest) returns (ResumeLandingPageWorkflowResponse);

  // Lists landing pages a page at a time.
  rpc ListLandingPageWorkflows(ListLandingPageWorkflowsRequest) returns (ListLandingPageWorkflowsResponse);

  // Signals a landing page.
  rpc SignalLandingPageWorkflow(SignalLandingPageWorkflowRequest) returns (SignalLandingPageWorkflowResponse);
}

// The request of `StartLandingPageWorkflow`.
message StartLandingPageWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  LandingPage landing_page = 3;
  StartLandingPageWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLandingPageWorkflow`.
message StartLandingPageWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LandingPage landing_page = 1;
  StartLandingPageWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

