syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "LandingPageReportingServiceProto";
option java_package = "com.acme.storefront.v1";

// Builds and schedules reports about landing pages.
service LandingPageReportingService {
  // Generates a landing page.
  rpc GenerateLandingPageReport(GenerateLandingPageReportRequest) returns (GenerateLandingPageReportResponse);

  // Returns a landing page.
  rpc FetchLandingPageReport(FetchLandingPageReportRequest) returns (FetchLandingPageReportResponse);

  // Schedules a landing page.
  rpc ScheduleLandingPageReport(ScheduleLandingPageReportRequest) returns (ScheduleLandingPageReportResponse);

  // Streams the changes of landing pages as they happen.
  rpc StreamLandingPageMetrics(StreamLandingPageMetricsRequest) returns (stream StreamLandingPageMetricsResponse);

  // Lists landing pages a page at a time.
  rpc ListLandingPageReports(ListLandingPageReportsRequest) returns (ListLandingPageReportsResponse);

  // Shares a landing page.
  rpc ShareLandingPageReport(ShareLandingPageReportRequest) returns (ShareLandingPageReportResponse);

  // Counts landing pages by status.
  rpc CountLandingPageTotals(CountLandingPageTotalsRequest) returns (CountLandingPageTotalsResponse);

  // Deletes a landing page.
  rpc DeleteLandingPageReport(DeleteLandingPageReportRequest) returns (DeleteLandingPageReportResponse);
}

// The request of `GenerateLandingPageReport`.
message GenerateLandingPageReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  GenerateLandingPageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateLandingPageReport`.
message GenerateLandingPageReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchLandingPageReport`.
message FetchLandingPageReportRequest {
  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchLandingPageReport`.
message FetchLandingPageReportResponse {
  LandingPage landing_page = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleLandingPageReport`.
message ScheduleLandingPageReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  ScheduleLandingPageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleLandingPageReport`.
message ScheduleLandingPageReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamLandingPageMetrics`.
message StreamLandingPageMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LandingPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamLandingPageMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamLandingPageMetrics`.
message StreamLandingPageMetricsResponse {
  LandingPage landing_page = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListLandingPageReports`.
message ListLandingPageReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LandingPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLandingPageReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLandingPageReports`.
message ListLandingPageReportsResponse {
  repeated LandingPage landing_pages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareLandingPageReport`.
message ShareLandingPageReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  ShareLandingPageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareLandingPageReport`.
message ShareLandingPageReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LandingPage landing_page = 1;
  ShareLandingPageReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLandingPageTotals`.
message CountLandingPageTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LandingPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLandingPageTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLandingPageTotals`.
message CountLandingPageTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteLandingPageReport`.
message DeleteLandingPageReportRequest {
  acme.common.v1.RequestContext context = 1;
  string landing_page_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteLandingPageReport`.
message DeleteLandingPageReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
