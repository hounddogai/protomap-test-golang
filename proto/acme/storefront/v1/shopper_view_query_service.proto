syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "ShopperViewQueryServiceProto";
option java_package = "com.acme.storefront.v1";

// Answers read-only questions about shopper views, for screens and reports.
service ShopperViewQueryService {
  // Returns a shopper view.
  rpc LookupShopperView(LookupShopperViewRequest) returns (LookupShopperViewResponse);

  // Lists shopper views a page at a time.
  rpc BrowseShopperViews(BrowseShopperViewsRequest) returns (BrowseShopperViewsResponse);

  // Lists shopper views a page at a time.
  rpc FindShopperViews(FindShopperViewsRequest) returns (FindShopperViewsResponse);

  // Counts shopper views by status.
  rpc CountShopperViews(CountShopperViewsRequest) returns (CountShopperViewsResponse);

  // Returns several shopper views at once.
  rpc ResolveShopperViews(ResolveShopperViewsRequest) returns (ResolveShopperViewsResponse);

  // Streams every matching shopper view.
  rpc ExportShopperViews(ExportShopperViewsRequest) returns (stream ExportShopperViewsResponse);

  // Summarizes a shopper view.
  rpc SummarizeShopperViews(SummarizeShopperViewsRequest) returns (SummarizeShopperViewsResponse);

  // Lists shopper views a page at a time.
  rpc SuggestShopperViews(SuggestShopperViewsRequest) returns (SuggestShopperViewsResponse);

  // Returns a shopper view.
  rpc PeekShopperView(PeekShopperViewRequest) returns (PeekShopperViewResponse);
}

// The request of `LookupShopperView`.
message LookupShopperViewRequest {
  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupShopperView`.
message LookupShopperViewResponse {
  ShopperView shopper_view = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseShopperViews`.
message BrowseShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseShopperViewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseShopperViews`.
message BrowseShopperViewsResponse {
  repeated ShopperView shopper_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindShopperViews`.
message FindShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindShopperViewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindShopperViews`.
message FindShopperViewsResponse {
  repeated ShopperView shopper_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountShopperViews`.
message CountShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountShopperViewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountShopperViews`.
message CountShopperViewsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveShopperViews`.
message ResolveShopperViewsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string shopper_view_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveShopperViews`.
message ResolveShopperViewsResponse {
  repeated ShopperView shopper_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportShopperViews`.
message ExportShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportShopperViewsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportShopperViews`.
message ExportShopperViewsResponse {
  ShopperView shopper_view = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeShopperViews`.
message SummarizeShopperViewsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  SummarizeShopperViewsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeShopperViews`.
message SummarizeShopperViewsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestShopperViews`.
message SuggestShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestShopperViewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestShopperViews`.
message SuggestShopperViewsResponse {
  repeated ShopperView shopper_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekShopperView`.
message PeekShopperViewRequest {
  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekShopperView`.
message PeekShopperViewResponse {
  ShopperView shopper_view = 1;
  acme.common.v1.OperationResult result = 2;
}
