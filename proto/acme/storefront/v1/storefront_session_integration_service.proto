// The request of `RelayStorefrontSessionMessages`.
message RelayStorefrontSessionMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    StorefrontSession change = 2;
    RelayStorefrontSessionMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayStorefrontSessionMessages`.
message RelayStorefrontSessionMessagesResponse {
  StorefrontSession storefront_session = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListStorefrontSessionSources`.
message ListStorefrontSessionSourcesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListStorefrontSessionSourcesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListStorefrontSessionSources`.
message ListStorefrontSessionSourcesResponse {
  repeated StorefrontSession storefront_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

