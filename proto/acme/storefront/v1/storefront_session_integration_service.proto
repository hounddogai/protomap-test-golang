syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "StorefrontSessionIntegrationServiceProto";
option java_package = "com.acme.storefront.v1";

// Connects external systems that send storefront session events.
service StorefrontSessionIntegrationService {
  // Connects a storefront session.
  rpc ConnectStorefrontSessionSource(ConnectStorefrontSessionSourceRequest) returns (ConnectStorefrontSessionSourceResponse);

  // Disconnects a storefront session.
  rpc DisconnectStorefrontSessionSource(DisconnectStorefrontSessionSourceRequest) returns (DisconnectStorefrontSessionSourceResponse);

  // Replays a storefront session.
  rpc ReplayStorefrontSessionEvents(ReplayStorefrontSessionEventsRequest) returns (ReplayStorefrontSessionEventsResponse);

  // Acknowledges a storefront session.
  rpc AcknowledgeStorefrontSessionEvent(AcknowledgeStorefrontSessionEventRequest) returns (AcknowledgeStorefrontSessionEventResponse);

  // Exchanges changes of storefront sessions with a peer.
  rpc RelayStorefrontSessionMessages(stream RelayStorefrontSessionMessagesRequest) returns (stream RelayStorefrontSessionMessagesResponse);

  // Lists storefront sessions a page at a time.
  rpc ListStorefrontSessionSources(ListStorefrontSessionSourcesRequest) returns (ListStorefrontSessionSourcesResponse);

  // Tests a storefront session.
  rpc TestStorefrontSessionConnection(TestStorefrontSessionConnectionRequest) returns (TestStorefrontSessionConnectionResponse);
}

// The request of `ConnectStorefrontSessionSource`.
message ConnectStorefrontSessionSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  ConnectStorefrontSessionSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ConnectStorefrontSessionSource`.
message ConnectStorefrontSessionSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StorefrontSession storefront_session = 1;
  ConnectStorefrontSessionSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DisconnectStorefrontSessionSource`.
message DisconnectStorefrontSessionSourceRequest {
  // What the operation needs besides the record.
  message Details {
