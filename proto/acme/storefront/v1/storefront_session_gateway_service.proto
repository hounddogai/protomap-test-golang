// The request of `StreamStorefrontSessionUpdates`.
message StreamStorefrontSessionUpdatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamStorefrontSessionUpdatesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamStorefrontSessionUpdates`.
message StreamStorefrontSessionUpdatesResponse {
  StorefrontSession storefront_session = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SearchStorefrontSessionCatalog`.
message SearchStorefrontSessionCatalogRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchStorefrontSessionCatalogRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchStorefrontSessionCatalog`.
message SearchStorefrontSessionCatalogResponse {
  repeated StorefrontSession storefront_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetStorefrontSessionSummary`.
message GetStorefrontSessionSummaryRequest {
  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetStorefrontSessionSummary`.
message GetStorefrontSessionSummaryResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}
