syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "StorefrontSessionGatewayServiceProto";
option java_package = "com.acme.storefront.v1";

// The edge API that apps call for storefront sessions.
service StorefrontSessionGatewayService {
  // Fetchs a storefront session.
  rpc FetchStorefrontSessionView(FetchStorefrontSessionViewRequest) returns (FetchStorefrontSessionViewResponse);

  // Composes a storefront session.
  rpc ComposeStorefrontSessionPage(ComposeStorefrontSessionPageRequest) returns (ComposeStorefrontSessionPageResponse);

  // Refreshs a storefront session.
  rpc RefreshStorefrontSession(RefreshStorefrontSessionRequest) returns (RefreshStorefrontSessionResponse);

  // Submits a storefront session.
  rpc SubmitStorefrontSessionForm(SubmitStorefrontSessionFormRequest) returns (SubmitStorefrontSessionFormResponse);

  // Tracks a storefront session.
  rpc TrackStorefrontSession(TrackStorefrontSessionRequest) returns (TrackStorefrontSessionResponse);

  // Streams the changes of storefront sessions as they happen.
  rpc StreamStorefrontSessionUpdates(StreamStorefrontSessionUpdatesRequest) returns (stream StreamStorefrontSessionUpdatesResponse);

  // Lists storefront sessions a page at a time.
  rpc SearchStorefrontSessionCatalog(SearchStorefrontSessionCatalogRequest) returns (SearchStorefrontSessionCatalogResponse);

  // Returns a storefront session.
  rpc GetStorefrontSessionSummary(GetStorefrontSessionSummaryRequest) returns (GetStorefrontSessionSummaryResponse);
}

// The request of `FetchStorefrontSessionView`.
message FetchStorefrontSessionViewRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  StorefrontSession storefront_session = 3;
  FetchStorefrontSessionViewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `FetchStorefrontSessionView`.
message FetchStorefrontSessionViewResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ComposeStorefrontSessionPage`.
message ComposeStorefrontSessionPageRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  StorefrontSession storefront_session = 3;
  ComposeStorefrontSessionPageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ComposeStorefrontSessionPage`.
message ComposeStorefrontSessionPageResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `RefreshStorefrontSession`.
message RefreshStorefrontSessionRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  StorefrontSession storefront_session = 3;
  RefreshStorefrontSessionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RefreshStorefrontSession`.
message RefreshStorefrontSessionResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SubmitStorefrontSessionForm`.
message SubmitStorefrontSessionFormRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  StorefrontSession storefront_session = 3;
  SubmitStorefrontSessionFormRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStorefrontSessionForm`.
message SubmitStorefrontSessionFormResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `TrackStorefrontSession`.
message TrackStorefrontSessionRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  StorefrontSession storefront_session = 3;
  TrackStorefrontSessionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
