syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "StorefrontSessionQueryServiceProto";
option java_package = "com.acme.storefront.v1";

// Answers read-only questions about storefront sessions, for screens and reports.
service StorefrontSessionQueryService {
  // Returns a storefront session.
  rpc LookupStorefrontSession(LookupStorefrontSessionRequest) returns (LookupStorefrontSessionResponse);

  // Lists storefront sessions a page at a time.
  rpc BrowseStorefrontSessions(BrowseStorefrontSessionsRequest) returns (BrowseStorefrontSessionsResponse);

  // Counts storefront sessions by status.
  rpc CountStorefrontSessions(CountStorefrontSessionsRequest) returns (CountStorefrontSessionsResponse);

  // Returns several storefront sessions at once.
  rpc ResolveStorefrontSessions(ResolveStorefrontSessionsRequest) returns (ResolveStorefrontSessionsResponse);

  // Streams every matching storefront session.
  rpc ExportStorefrontSessions(ExportStorefrontSessionsRequest) returns (stream ExportStorefrontSessionsResponse);

  // Summarizes a storefront session.
  rpc SummarizeStorefrontSessions(SummarizeStorefrontSessionsRequest) returns (SummarizeStorefrontSessionsResponse);

  // Lists storefront sessions a page at a time.
  rpc SuggestStorefrontSessions(SuggestStorefrontSessionsRequest) returns (SuggestStorefrontSessionsResponse);

  // Returns a storefront session.
  rpc PeekStorefrontSession(PeekStorefrontSessionRequest) returns (PeekStorefrontSessionResponse);
}

// The request of `LookupStorefrontSession`.
message LookupStorefrontSessionRequest {
  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupStorefrontSession`.
message LookupStorefrontSessionResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseStorefrontSessions`.
message BrowseStorefrontSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseStorefrontSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseStorefrontSessions`.
message BrowseStorefrontSessionsResponse {
  repeated StorefrontSession storefront_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountStorefrontSessions`.
message CountStorefrontSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountStorefrontSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountStorefrontSessions`.
message CountStorefrontSessionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveStorefrontSessions`.
message ResolveStorefrontSessionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string storefront_session_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveStorefrontSessions`.
message ResolveStorefrontSessionsResponse {
  repeated StorefrontSession storefront_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportStorefrontSessions`.
message ExportStorefrontSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportStorefrontSessionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportStorefrontSessions`.
message ExportStorefrontSessionsResponse {
  StorefrontSession storefront_session = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeStorefrontSessions`.
message SummarizeStorefrontSessionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  SummarizeStorefrontSessionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeStorefrontSessions`.
message SummarizeStorefrontSessionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestStorefrontSessions`.
message SuggestStorefrontSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorefrontSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestStorefrontSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestStorefrontSessions`.
message SuggestStorefrontSessionsResponse {
  repeated StorefrontSession storefront_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekStorefrontSession`.
message PeekStorefrontSessionRequest {
  acme.common.v1.RequestContext context = 1;
  string storefront_session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekStorefrontSession`.
message PeekStorefrontSessionResponse {
  StorefrontSession storefront_session = 1;
  acme.common.v1.OperationResult result = 2;
}
