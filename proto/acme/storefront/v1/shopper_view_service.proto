syntax = "proto3";

package acme.storefront.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/storefront/v1/storefront.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Storefront.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/storefront/v1;storefrontv1";
option java_multiple_files = true;
option java_outer_classname = "ShopperViewServiceProto";
option java_package = "com.acme.storefront.v1";

// Manages shopper views: creates, reads, changes, and lists them.
service ShopperViewService {
  // Creates a shopper view.
  rpc CreateShopperView(CreateShopperViewRequest) returns (CreateShopperViewResponse);

  // Returns a shopper view.
  rpc GetShopperView(GetShopperViewRequest) returns (GetShopperViewResponse);

  // Lists shopper views a page at a time.
  rpc ListShopperViews(ListShopperViewsRequest) returns (ListShopperViewsResponse);

  // Lists shopper views a page at a time.
  rpc SearchShopperViews(SearchShopperViewsRequest) returns (SearchShopperViewsResponse);

  // Streams the changes of shopper views as they happen.
  rpc WatchShopperViews(WatchShopperViewsRequest) returns (stream WatchShopperViewsResponse);

  // Creates a shopper view.
  rpc CloneShopperView(CloneShopperViewRequest) returns (CloneShopperViewResponse);
}

// The request of `CreateShopperView`.
message CreateShopperViewRequest {
  acme.common.v1.RequestContext context = 1;
  ShopperView shopper_view = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateShopperView`.
message CreateShopperViewResponse {
  ShopperView shopper_view = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetShopperView`.
message GetShopperViewRequest {
  acme.common.v1.RequestContext context = 1;
  string shopper_view_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetShopperView`.
message GetShopperViewResponse {
  ShopperView shopper_view = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListShopperViews`.
message ListShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListShopperViewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListShopperViews`.
message ListShopperViewsResponse {
  repeated ShopperView shopper_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchShopperViews`.
message SearchShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchShopperViewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchShopperViews`.
message SearchShopperViewsResponse {
  repeated ShopperView shopper_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchShopperViews`.
message WatchShopperViewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShopperViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchShopperViewsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchShopperViews`.
message WatchShopperViewsResponse {
  ShopperView shopper_view = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `CloneShopperView`.
message CloneShopperViewRequest {
  acme.common.v1.RequestContext context = 1;
  ShopperView shopper_view = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneShopperView`.
message CloneShopperViewResponse {
  ShopperView shopper_view = 1;
  acme.common.v1.OperationResult result = 2;
}
