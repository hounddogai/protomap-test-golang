syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/contracts/v1/contracts.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "ContractQueryServiceProto";
option java_package = "com.acme.contracts.v1";

// Answers read-only questions about contracts, for screens and reports.
service ContractQueryService {
  // Returns a contract.
  rpc LookupContract(LookupContractRequest) returns (LookupContractResponse);

  // Lists contracts a page at a time.
  rpc BrowseContracts(BrowseContractsRequest) returns (BrowseContractsResponse);

  // Lists contracts a page at a time.
  rpc FindContracts(FindContractsRequest) returns (FindContractsResponse);

  // Counts contracts by status.
  rpc CountContracts(CountContractsRequest) returns (CountContractsResponse);

  // Returns several contracts at once.
  rpc ResolveContracts(ResolveContractsRequest) returns (ResolveContractsResponse);

  // Streams every matching contract.
  rpc ExportContracts(ExportContractsRequest) returns (stream ExportContractsResponse);

  // Summarizes a contract.
  rpc SummarizeContracts(SummarizeContractsRequest) returns (SummarizeContractsResponse);

  // Lists contracts a page at a time.
  rpc SuggestContracts(SuggestContractsRequest) returns (SuggestContractsResponse);

  // Returns a contract.
  rpc PeekContract(PeekContractRequest) returns (PeekContractResponse);
}

// The request of `LookupContract`.
message LookupContractRequest {
  acme.common.v1.RequestContext context = 1;
  string contract_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupContract`.
message LookupContractResponse {
  Contract contract = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseContracts`.
message BrowseContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseContractsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseContracts`.
message BrowseContractsResponse {
  repeated Contract contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindContracts`.
message FindContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindContractsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindContracts`.
message FindContractsResponse {
  repeated Contract contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountContracts`.
message CountContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountContractsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountContracts`.
message CountContractsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveContracts`.
message ResolveContractsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string contract_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveContracts`.
message ResolveContractsResponse {
  repeated Contract contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportContracts`.
message ExportContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportContractsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportContracts`.
message ExportContractsResponse {
  Contract contract = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeContracts`.
message SummarizeContractsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string contract_id = 2;
  SummarizeContractsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeContracts`.
message SummarizeContractsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestContracts`.
message SuggestContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestContractsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestContracts`.
message SuggestContractsResponse {
  repeated Contract contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekContract`.
message PeekContractRequest {
  acme.common.v1.RequestContext context = 1;
  string contract_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekContract`.
message PeekContractResponse {
  Contract contract = 1;
  acme.common.v1.OperationResult result = 2;
}
