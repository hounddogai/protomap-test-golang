syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CarePlanCalculationServiceProto";
option java_package = "com.acme.careplans.v1";

// Computes the figures of a care plan, such as totals, taxes, and estimates.
service CarePlanCalculationService {
  // Calculates a care plan.
  rpc CalculateCarePlan(CalculateCarePlanRequest) returns (CalculateCarePlanResponse);

  // Estimates a care plan.
  rpc EstimateCarePlan(EstimateCarePlanRequest) returns (EstimateCarePlanResponse);

  // Quotes a care plan.
  rpc QuoteCarePlan(QuoteCarePlanRequest) returns (QuoteCarePlanResponse);

  // Compares a care plan.
  rpc CompareCarePlanOptions(CompareCarePlanOptionsRequest) returns (CompareCarePlanOptionsResponse);

  // Recalculates a care plan.
  rpc RecalculateCarePlans(RecalculateCarePlansRequest) returns (RecalculateCarePlansResponse);

  // Simulates a care plan.
  rpc SimulateCarePlan(SimulateCarePlanRequest) returns (SimulateCarePlanResponse);

  // Explains a care plan.
  rpc ExplainCarePlanCalculation(ExplainCarePlanCalculationRequest) returns (ExplainCarePlanCalculationResponse);

  // Returns a care plan.
  rpc GetCarePlanRates(GetCarePlanRatesRequest) returns (GetCarePlanRatesResponse);
}

// The request of `CalculateCarePlan`.
message CalculateCarePlanRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  CarePlan care_plan = 3;
  CalculateCarePlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCarePlan`.
message CalculateCarePlanResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCarePlanResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CarePlan care_plan = 1;
  CalculateCarePlanResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

