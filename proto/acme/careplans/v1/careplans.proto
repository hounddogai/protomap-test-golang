syntax = "proto3";

package acme.careplans.v1;

import "acme/appointments/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CareplansProto";
option java_package = "com.acme.careplans.v1";

// Where a care plan is in its lifecycle.
enum CarePlanStatus {
  CARE_PLAN_STATUS_UNSPECIFIED = 0;
  CARE_PLAN_STATUS_DRAFT = 1;
  CARE_PLAN_STATUS_ISSUED = 2;
  CARE_PLAN_STATUS_APPROVED = 3;
  CARE_PLAN_STATUS_PAID = 4;
  CARE_PLAN_STATUS_VOID = 5;
}

// Where a care goal is in its lifecycle.
enum CareGoalStatus {
  CARE_GOAL_STATUS_UNSPECIFIED = 0;
  CARE_GOAL_STATUS_NEW = 1;
  CARE_GOAL_STATUS_OPEN = 2;
  CARE_GOAL_STATUS_WAITING = 3;
  CARE_GOAL_STATUS_RESOLVED = 4;
  CARE_GOAL_STATUS_CLOSED = 5;
}

// Where a vital is in its lifecycle.
enum VitalStatus {
  VITAL_STATUS_UNSPECIFIED = 0;
  VITAL_STATUS_RECEIVED = 1;
  VITAL_STATUS_PROCESSED = 2;
  VITAL_STATUS_DISCARDED = 3;
}

// The line of a care plan.
message CarePlanLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  CarePlanLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a care plan line.
message CarePlanLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a care plan.
message CarePlanCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a care plan.
message CarePlanBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a care plan.
message CarePlanAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A care plan of the careplans domain.
message CarePlan {
  string care_plan_id = 1;
  string number = 2;
  CarePlanStatus status = 3;
  acme.appointments.v1.AppointmentRef counterparty = 4;
  repeated CarePlanLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    CarePlanCardSettlement card = 8;
    CarePlanBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated CarePlanAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of a care goal.
message CareGoalComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a care goal.
message CareGoalSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a care goal.
message CareGoalChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a care goal.
message CareGoalStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A care goal of the careplans domain.
message CareGoal {
  string care_goal_id = 1;
  string subject = 2;
  CareGoalStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated CareGoalComment comments = 7;
  CareGoalSla sla = 8;
  oneof origin {
    acme.patients.v1.PatientRef customer = 9;
    string external_reference = 10;
    CareGoalChannelOrigin channel = 11;
  }
  repeated CareGoalStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The measurement of a vital.
message VitalMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A vital of the careplans domain.
message Vital {
  string vital_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  acme.appointments.v1.AppointmentRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated VitalMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
