syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CarePlanServiceProto";
option java_package = "com.acme.careplans.v1";

// Manages care plans: creates, reads, changes, and lists them.
service CarePlanService {
  // Creates a care plan.
  rpc CreateCarePlan(CreateCarePlanRequest) returns (CreateCarePlanResponse);

  // Returns a care plan.
  rpc GetCarePlan(GetCarePlanRequest) returns (GetCarePlanResponse);

  // Changes a care plan.
  rpc UpdateCarePlan(UpdateCarePlanRequest) returns (UpdateCarePlanResponse);

  // Deletes a care plan.
  rpc DeleteCarePlan(DeleteCarePlanRequest) returns (DeleteCarePlanResponse);

  // Lists care plans a page at a time.
  rpc ListCarePlans(ListCarePlansRequest) returns (ListCarePlansResponse);

  // Returns several care plans at once.
  rpc BatchGetCarePlans(BatchGetCarePlansRequest) returns (BatchGetCarePlansResponse);

  // Streams the changes of care plans as they happen.
  rpc WatchCarePlans(WatchCarePlansRequest) returns (stream WatchCarePlansResponse);

  // Takes a stream of care plans and answers once at the end.
  rpc BatchCreateCarePlans(stream BatchCreateCarePlansRequest) returns (BatchCreateCarePlansResponse);

  // Creates a care plan.
  rpc CloneCarePlan(CloneCarePlanRequest) returns (CloneCarePlanResponse);
}

// The request of `CreateCarePlan`.
message CreateCarePlanRequest {
  acme.common.v1.RequestContext context = 1;
  CarePlan care_plan = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateCarePlan`.
message CreateCarePlanResponse {
  CarePlan care_plan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetCarePlan`.
message GetCarePlanRequest {
  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCarePlan`.
message GetCarePlanResponse {
  CarePlan care_plan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateCarePlan`.
message UpdateCarePlanRequest {
  acme.common.v1.RequestContext context = 1;
  CarePlan care_plan = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateCarePlan`.
message UpdateCarePlanResponse {
  CarePlan care_plan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteCarePlan`.
message DeleteCarePlanRequest {
  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCarePlan`.
message DeleteCarePlanResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListCarePlans`.
message ListCarePlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CarePlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCarePlansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCarePlans`.
message ListCarePlansResponse {
  repeated CarePlan care_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetCarePlans`.
message BatchGetCarePlansRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string care_plan_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetCarePlans`.
message BatchGetCarePlansResponse {
  repeated CarePlan care_plans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchCarePlans`.
message WatchCarePlansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CarePlanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchCarePlansRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchCarePlans`.
message WatchCarePlansResponse {
  CarePlan care_plan = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateCarePlans`.
message BatchCreateCarePlansRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateCarePlansRequest.StreamHeader header = 2;
    CarePlan record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateCarePlans`.
message BatchCreateCarePlansResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string care_plan_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateCarePlansResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneCarePlan`.
message CloneCarePlanRequest {
  acme.common.v1.RequestContext context = 1;
  CarePlan care_plan = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneCarePlan`.
message CloneCarePlanResponse {
  CarePlan care_plan = 1;
  acme.common.v1.OperationResult result = 2;
}
