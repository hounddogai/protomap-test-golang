syntax = "proto3";

package acme.prescriptions.v1;

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.prescriptions.v1";

// A reference to a prescription of the prescriptions domain.
message PrescriptionRef {
  string prescription_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a medication of the prescriptions domain.
message MedicationRef {
  string medication_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a refill of the prescriptions domain.
message RefillRef {
  string refill_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
