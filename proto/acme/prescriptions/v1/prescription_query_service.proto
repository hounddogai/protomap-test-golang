syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "PrescriptionQueryServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Answers read-only questions about prescriptions, for screens and reports.
service PrescriptionQueryService {
  // Returns a prescription.
  rpc LookupPrescription(LookupPrescriptionRequest) returns (LookupPrescriptionResponse);

  // Lists prescriptions a page at a time.
  rpc BrowsePrescriptions(BrowsePrescriptionsRequest) returns (BrowsePrescriptionsResponse);

  // Lists prescriptions a page at a time.
  rpc FindPrescriptions(FindPrescriptionsRequest) returns (FindPrescriptionsResponse);

  // Counts prescriptions by status.
  rpc CountPrescriptions(CountPrescriptionsRequest) returns (CountPrescriptionsResponse);

  // Returns several prescriptions at once.
  rpc ResolvePrescriptions(ResolvePrescriptionsRequest) returns (ResolvePrescriptionsResponse);

  // Streams every matching prescription.
  rpc ExportPrescriptions(ExportPrescriptionsRequest) returns (stream ExportPrescriptionsResponse);

  // Summarizes a prescription.
  rpc SummarizePrescriptions(SummarizePrescriptionsRequest) returns (SummarizePrescriptionsResponse);

  // Lists prescriptions a page at a time.
  rpc SuggestPrescriptions(SuggestPrescriptionsRequest) returns (SuggestPrescriptionsResponse);

  // Returns a prescription.
  rpc PeekPrescription(PeekPrescriptionRequest) returns (PeekPrescriptionResponse);
}

// The request of `LookupPrescription`.
message LookupPrescriptionRequest {
  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPrescription`.
message LookupPrescriptionResponse {
  Prescription prescription = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePrescriptions`.
message BrowsePrescriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePrescriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePrescriptions`.
message BrowsePrescriptionsResponse {
  repeated Prescription prescriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPrescriptions`.
message FindPrescriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPrescriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPrescriptions`.
message FindPrescriptionsResponse {
  repeated Prescription prescriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPrescriptions`.
message CountPrescriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPrescriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPrescriptions`.
message CountPrescriptionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePrescriptions`.
message ResolvePrescriptionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string prescription_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePrescriptions`.
message ResolvePrescriptionsResponse {
  repeated Prescription prescriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPrescriptions`.
message ExportPrescriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPrescriptionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPrescriptions`.
message ExportPrescriptionsResponse {
  Prescription prescription = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePrescriptions`.
message SummarizePrescriptionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  SummarizePrescriptionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePrescriptions`.
message SummarizePrescriptionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPrescriptions`.
message SuggestPrescriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPrescriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPrescriptions`.
message SuggestPrescriptionsResponse {
  repeated Prescription prescriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPrescription`.
message PeekPrescriptionRequest {
  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPrescription`.
message PeekPrescriptionResponse {
  Prescription prescription = 1;
  acme.common.v1.OperationResult result = 2;
}
