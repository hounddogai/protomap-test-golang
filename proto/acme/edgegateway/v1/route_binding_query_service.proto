syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "RouteBindingQueryServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Answers read-only questions about route bindings, for screens and reports.
service RouteBindingQueryService {
  // Returns a route binding.
  rpc LookupRouteBinding(LookupRouteBindingRequest) returns (LookupRouteBindingResponse);

  // Lists route bindings a page at a time.
  rpc BrowseRouteBindings(BrowseRouteBindingsRequest) returns (BrowseRouteBindingsResponse);

  // Returns several route bindings at once.
  rpc ResolveRouteBindings(ResolveRouteBindingsRequest) returns (ResolveRouteBindingsResponse);

  // Streams every matching route binding.
  rpc ExportRouteBindings(ExportRouteBindingsRequest) returns (stream ExportRouteBindingsResponse);

  // Summarizes a route binding.
  rpc SummarizeRouteBindings(SummarizeRouteBindingsRequest) returns (SummarizeRouteBindingsResponse);

  // Returns a route binding.
  rpc PeekRouteBinding(PeekRouteBindingRequest) returns (PeekRouteBindingResponse);
}

// The request of `LookupRouteBinding`.
message LookupRouteBindingRequest {
  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRouteBinding`.
message LookupRouteBindingResponse {
  RouteBinding route_binding = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRouteBindings`.
message BrowseRouteBindingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRouteBindingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRouteBindings`.
message BrowseRouteBindingsResponse {
  repeated RouteBinding route_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveRouteBindings`.
message ResolveRouteBindingsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string route_binding_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveRouteBindings`.
message ResolveRouteBindingsResponse {
  repeated RouteBinding route_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportRouteBindings`.
message ExportRouteBindingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportRouteBindingsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportRouteBindings`.
message ExportRouteBindingsResponse {
  RouteBinding route_binding = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeRouteBindings`.
message SummarizeRouteBindingsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  SummarizeRouteBindingsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeRouteBindings`.
message SummarizeRouteBindingsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekRouteBinding`.
message PeekRouteBindingRequest {
  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekRouteBinding`.
message PeekRouteBindingResponse {
  RouteBinding route_binding = 1;
  acme.common.v1.OperationResult result = 2;
}
