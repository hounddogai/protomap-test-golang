syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/edgegateway/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "EdgegatewayProto";
option java_package = "com.acme.edgegateway.v1";

// Where a route binding is in its lifecycle.
enum RouteBindingStatus {
  ROUTE_BINDING_STATUS_UNSPECIFIED = 0;
  ROUTE_BINDING_STATUS_DRAFT = 1;
  ROUTE_BINDING_STATUS_ENABLED = 2;
  ROUTE_BINDING_STATUS_DISABLED = 3;
  ROUTE_BINDING_STATUS_RETIRED = 4;
}

// Where an api key is in its lifecycle.
enum ApiKeyStatus {
  API_KEY_STATUS_UNSPECIFIED = 0;
  API_KEY_STATUS_PENDING = 1;
  API_KEY_STATUS_OPEN = 2;
  API_KEY_STATUS_FROZEN = 3;
  API_KEY_STATUS_CLOSED = 4;
}

// Where a gateway policy is in its lifecycle.
enum GatewayPolicyStatus {
  GATEWAY_POLICY_STATUS_UNSPECIFIED = 0;
  GATEWAY_POLICY_STATUS_DRAFT = 1;
  GATEWAY_POLICY_STATUS_ENABLED = 2;
  GATEWAY_POLICY_STATUS_DISABLED = 3;
  GATEWAY_POLICY_STATUS_RETIRED = 4;
}

// The condition of a route binding.
message RouteBindingCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a route binding.
message RouteBindingDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a route binding.
message RouteBindingRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a route binding.
message RouteBindingBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A route binding of the edgegateway domain.
message RouteBinding {
  string route_binding_id = 1;
  string name = 2;
  string description = 3;
  RouteBindingStatus status = 4;
  int32 priority = 5;
  repeated RouteBindingCondition conditions = 6;
  oneof action {
    RouteBindingDiscountAction discount = 7;
    RouteBindingRouteAction route = 8;
    RouteBindingBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The limit of an api key.
message ApiKeyLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of an api key.
message ApiKeyCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of an api key.
message ApiKeyBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// An api key of the edgegateway domain.
message ApiKey {
  string api_key_id = 1;
  GatewayPolicyRef holder = 2;
  ApiKeyStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated ApiKeyLimit limits = 7;
  oneof funding {
    ApiKeyCardFunding card = 8;
    ApiKeyBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The condition of a gateway policy.
message GatewayPolicyCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a gateway policy.
message GatewayPolicyDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a gateway policy.
message GatewayPolicyRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a gateway policy.
message GatewayPolicyBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A gateway policy of the edgegateway domain.
message GatewayPolicy {
  string gateway_policy_id = 1;
  string name = 2;
  string description = 3;
  GatewayPolicyStatus status = 4;
  int32 priority = 5;
  repeated GatewayPolicyCondition conditions = 6;
  oneof action {
    GatewayPolicyDiscountAction discount = 7;
    GatewayPolicyRouteAction route = 8;
    GatewayPolicyBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
