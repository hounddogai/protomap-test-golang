syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "PersonalizationProto";
option java_package = "com.acme.personalization.v1";

// Where a profile is in its lifecycle.
enum ProfileStatus {
  PROFILE_STATUS_UNSPECIFIED = 0;
  PROFILE_STATUS_PROSPECT = 1;
  PROFILE_STATUS_ACTIVE = 2;
  PROFILE_STATUS_SUSPENDED = 3;
  PROFILE_STATUS_CLOSED = 4;
}

// Where a recommendation is in its lifecycle.
enum RecommendationStatus {
  RECOMMENDATION_STATUS_UNSPECIFIED = 0;
  RECOMMENDATION_STATUS_DRAFT = 1;
  RECOMMENDATION_STATUS_ISSUED = 2;
  RECOMMENDATION_STATUS_APPROVED = 3;
  RECOMMENDATION_STATUS_PAID = 4;
  RECOMMENDATION_STATUS_VOID = 5;
}

// Where an affinity is in its lifecycle.
enum AffinityStatus {
  AFFINITY_STATUS_UNSPECIFIED = 0;
  AFFINITY_STATUS_RECEIVED = 1;
  AFFINITY_STATUS_PROCESSED = 2;
  AFFINITY_STATUS_DISCARDED = 3;
}

// The preferences of a profile.
message ProfilePreferences {
  string language = 1;
  bool marketing_opt_in = 2;
  repeated string channels = 3;
  acme.common.v1.TimeWindow quiet_hours = 4;
}

// The passport of a profile.
message ProfilePassport {
  string number = 1;
  string issuing_country = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// The national id of a profile.
message ProfileNationalId {
  string number = 1;
  string issuing_country = 2;
}

// A profile of the personalization domain.
message Profile {
  string profile_id = 1;
  acme.common.v1.PersonName name = 2;
  acme.common.v1.ContactInfo contact = 3;
  acme.common.v1.PostalAddress primary_address = 4;
  ProfileStatus status = 5;
  repeated string segments = 6;
  map<string, string> attributes = 7;
  ProfilePreferences preferences = 8;
  oneof identity_document {
    ProfilePassport passport = 9;
    ProfileNationalId national_id = 10;
    string tax_number = 11;
  }
  acme.identity.v1.UserRef relationship_manager = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a recommendation.
message RecommendationLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  RecommendationLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a recommendation line.
message RecommendationLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a recommendation.
message RecommendationCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a recommendation.
message RecommendationBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a recommendation.
message RecommendationAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A recommendation of the personalization domain.
message Recommendation {
  string recommendation_id = 1;
  string number = 2;
  RecommendationStatus status = 3;
  ProfileRef counterparty = 4;
  repeated RecommendationLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    RecommendationCardSettlement card = 8;
    RecommendationBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated RecommendationAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The measurement of an affinity.
message AffinityMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// An affinity of the personalization domain.
message Affinity {
  string affinity_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  RecommendationRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated AffinityMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}
