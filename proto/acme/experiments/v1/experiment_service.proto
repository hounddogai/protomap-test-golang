syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExperimentServiceProto";
option java_package = "com.acme.experiments.v1";

// Manages experiments: creates, reads, changes, and lists them.
service ExperimentService {
  // Creates an experiment.
  rpc CreateExperiment(CreateExperimentRequest) returns (CreateExperimentResponse);

  // Returns an experiment.
  rpc GetExperiment(GetExperimentRequest) returns (GetExperimentResponse);

  // Changes an experiment.
  rpc UpdateExperiment(UpdateExperimentRequest) returns (UpdateExperimentResponse);

  // Lists experiments a page at a time.
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsResponse);

  // Returns several experiments at once.
  rpc BatchGetExperiments(BatchGetExperimentsRequest) returns (BatchGetExperimentsResponse);

  // Lists experiments a page at a time.
  rpc SearchExperiments(SearchExperimentsRequest) returns (SearchExperimentsResponse);

  // Streams the changes of experiments as they happen.
  rpc WatchExperiments(WatchExperimentsRequest) returns (stream WatchExperimentsResponse);

  // Takes a stream of experiments and answers once at the end.
  rpc BatchCreateExperiments(stream BatchCreateExperimentsRequest) returns (BatchCreateExperimentsResponse);

  // Creates an experiment.
  rpc CloneExperiment(CloneExperimentRequest) returns (CloneExperimentResponse);
}

// The request of `CreateExperiment`.
message CreateExperimentRequest {
  acme.common.v1.RequestContext context = 1;
  Experiment experiment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateExperiment`.
message CreateExperimentResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetExperiment`.
message GetExperimentRequest {
  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetExperiment`.
message GetExperimentResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateExperiment`.
message UpdateExperimentRequest {
  acme.common.v1.RequestContext context = 1;
  Experiment experiment = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateExperiment`.
message UpdateExperimentResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListExperiments`.
message ListExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListExperimentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListExperiments`.
message ListExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetExperiments`.
message BatchGetExperimentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string experiment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetExperiments`.
message BatchGetExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchExperiments`.
message SearchExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchExperimentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchExperiments`.
message SearchExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchExperiments`.
message WatchExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchExperimentsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchExperiments`.
message WatchExperimentsResponse {
  Experiment experiment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateExperiments`.
message BatchCreateExperimentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateExperimentsRequest.StreamHeader header = 2;
    Experiment record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateExperiments`.
message BatchCreateExperimentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string experiment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateExperimentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneExperiment`.
message CloneExperimentRequest {
  acme.common.v1.RequestContext context = 1;
  Experiment experiment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneExperiment`.
message CloneExperimentResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}
