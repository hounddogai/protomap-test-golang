syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExperimentQueryServiceProto";
option java_package = "com.acme.experiments.v1";

// Answers read-only questions about experiments, for screens and reports.
service ExperimentQueryService {
  // Returns an experiment.
  rpc LookupExperiment(LookupExperimentRequest) returns (LookupExperimentResponse);

  // Lists experiments a page at a time.
  rpc BrowseExperiments(BrowseExperimentsRequest) returns (BrowseExperimentsResponse);

  // Lists experiments a page at a time.
  rpc FindExperiments(FindExperimentsRequest) returns (FindExperimentsResponse);

  // Counts experiments by status.
  rpc CountExperiments(CountExperimentsRequest) returns (CountExperimentsResponse);

  // Returns several experiments at once.
  rpc ResolveExperiments(ResolveExperimentsRequest) returns (ResolveExperimentsResponse);

  // Streams every matching experiment.
  rpc ExportExperiments(ExportExperimentsRequest) returns (stream ExportExperimentsResponse);

  // Summarizes an experiment.
  rpc SummarizeExperiments(SummarizeExperimentsRequest) returns (SummarizeExperimentsResponse);

  // Lists experiments a page at a time.
  rpc SuggestExperiments(SuggestExperimentsRequest) returns (SuggestExperimentsResponse);

  // Returns an experiment.
  rpc PeekExperiment(PeekExperimentRequest) returns (PeekExperimentResponse);
}

// The request of `LookupExperiment`.
message LookupExperimentRequest {
  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupExperiment`.
message LookupExperimentResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseExperiments`.
message BrowseExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseExperimentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseExperiments`.
message BrowseExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindExperiments`.
message FindExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindExperimentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindExperiments`.
message FindExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountExperiments`.
message CountExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountExperimentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountExperiments`.
message CountExperimentsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveExperiments`.
message ResolveExperimentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string experiment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveExperiments`.
message ResolveExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportExperiments`.
message ExportExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportExperimentsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportExperiments`.
message ExportExperimentsResponse {
  Experiment experiment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeExperiments`.
message SummarizeExperimentsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  SummarizeExperimentsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeExperiments`.
message SummarizeExperimentsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestExperiments`.
message SuggestExperimentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestExperimentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestExperiments`.
message SuggestExperimentsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekExperiment`.
message PeekExperimentRequest {
  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekExperiment`.
message PeekExperimentResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}
