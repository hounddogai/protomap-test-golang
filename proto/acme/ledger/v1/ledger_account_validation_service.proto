syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/ledger/v1/ledger.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "LedgerAccountValidationServiceProto";
option java_package = "com.acme.ledger.v1";

// Checks ledger accounts against the rules before anything acts on them.
service LedgerAccountValidationService {
  // Validates a ledger account.
  rpc ValidateLedgerAccount(ValidateLedgerAccountRequest) returns (ValidateLedgerAccountResponse);

  // Previews a ledger account.
  rpc PreviewLedgerAccount(PreviewLedgerAccountRequest) returns (PreviewLedgerAccountResponse);

  // Checks a ledger account.
  rpc CheckLedgerAccountEligibility(CheckLedgerAccountEligibilityRequest) returns (CheckLedgerAccountEligibilityResponse);

  // Normalizes a ledger account.
  rpc NormalizeLedgerAccount(NormalizeLedgerAccountRequest) returns (NormalizeLedgerAccountResponse);

  // Explains a ledger account.
  rpc ExplainLedgerAccountDecision(ExplainLedgerAccountDecisionRequest) returns (ExplainLedgerAccountDecisionResponse);

  // Scores a ledger account.
  rpc ScoreLedgerAccount(ScoreLedgerAccountRequest) returns (ScoreLedgerAccountResponse);

  // Lints a ledger account.
  rpc LintLedgerAccounts(LintLedgerAccountsRequest) returns (LintLedgerAccountsResponse);

  // Returns a ledger account.
  rpc GetLedgerAccountRules(GetLedgerAccountRulesRequest) returns (GetLedgerAccountRulesResponse);
}

// The request of `ValidateLedgerAccount`.
message ValidateLedgerAccountRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  LedgerAccount ledger_account = 3;
  ValidateLedgerAccountRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLedgerAccount`.
message ValidateLedgerAccountResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LedgerAccount ledger_account = 1;
  ValidateLedgerAccountResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

