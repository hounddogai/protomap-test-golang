syntax = "proto3";

package acme.ledger.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.ledger.v1";

// A reference to a ledger account of the ledger domain.
message LedgerAccountRef {
  string ledger_account_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a journal entry of the ledger domain.
message JournalEntryRef {
  string journal_entry_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a posting batch of the ledger domain.
message PostingBatchRef {
  string posting_batch_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a fiscal period of the ledger domain.
message FiscalPeriodRef {
  string fiscal_period_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}
