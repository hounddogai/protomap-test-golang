syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ledger/v1/ledger.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "LedgerAccountServiceProto";
option java_package = "com.acme.ledger.v1";

// Manages ledger accounts: creates, reads, changes, and lists them.
service LedgerAccountService {
  // Creates a ledger account.
  rpc CreateLedgerAccount(CreateLedgerAccountRequest) returns (CreateLedgerAccountResponse);

  // Returns a ledger account.
  rpc GetLedgerAccount(GetLedgerAccountRequest) returns (GetLedgerAccountResponse);

  // Lists ledger accounts a page at a time.
  rpc ListLedgerAccounts(ListLedgerAccountsRequest) returns (ListLedgerAccountsResponse);

  // Lists ledger accounts a page at a time.
  rpc SearchLedgerAccounts(SearchLedgerAccountsRequest) returns (SearchLedgerAccountsResponse);

  // Streams the changes of ledger accounts as they happen.
  rpc WatchLedgerAccounts(WatchLedgerAccountsRequest) returns (stream WatchLedgerAccountsResponse);

  // Creates a ledger account.
  rpc CloneLedgerAccount(CloneLedgerAccountRequest) returns (CloneLedgerAccountResponse);
}

// The request of `CreateLedgerAccount`.
message CreateLedgerAccountRequest {
  acme.common.v1.RequestContext context = 1;
  LedgerAccount ledger_account = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateLedgerAccount`.
message CreateLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetLedgerAccount`.
message GetLedgerAccountRequest {
  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetLedgerAccount`.
message GetLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListLedgerAccounts`.
message ListLedgerAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LedgerAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLedgerAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLedgerAccounts`.
message ListLedgerAccountsResponse {
  repeated LedgerAccount ledger_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchLedgerAccounts`.
message SearchLedgerAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LedgerAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchLedgerAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchLedgerAccounts`.
message SearchLedgerAccountsResponse {
  repeated LedgerAccount ledger_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchLedgerAccounts`.
message WatchLedgerAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LedgerAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchLedgerAccountsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchLedgerAccounts`.
message WatchLedgerAccountsResponse {
  LedgerAccount ledger_account = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `CloneLedgerAccount`.
message CloneLedgerAccountRequest {
  acme.common.v1.RequestContext context = 1;
  LedgerAccount ledger_account = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneLedgerAccount`.
message CloneLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
  acme.common.v1.OperationResult result = 2;
}
