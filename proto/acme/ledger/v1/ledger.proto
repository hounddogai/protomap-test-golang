syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/ledger/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "LedgerProto";
option java_package = "com.acme.ledger.v1";

// Where a ledger account is in its lifecycle.
enum LedgerAccountStatus {
  LEDGER_ACCOUNT_STATUS_UNSPECIFIED = 0;
  LEDGER_ACCOUNT_STATUS_PENDING = 1;
  LEDGER_ACCOUNT_STATUS_OPEN = 2;
  LEDGER_ACCOUNT_STATUS_FROZEN = 3;
  LEDGER_ACCOUNT_STATUS_CLOSED = 4;
}

// Where a journal entry is in its lifecycle.
enum JournalEntryStatus {
  JOURNAL_ENTRY_STATUS_UNSPECIFIED = 0;
  JOURNAL_ENTRY_STATUS_DRAFT = 1;
  JOURNAL_ENTRY_STATUS_ISSUED = 2;
  JOURNAL_ENTRY_STATUS_APPROVED = 3;
  JOURNAL_ENTRY_STATUS_PAID = 4;
  JOURNAL_ENTRY_STATUS_VOID = 5;
}

// Where a posting batch is in its lifecycle.
enum PostingBatchStatus {
  POSTING_BATCH_STATUS_UNSPECIFIED = 0;
  POSTING_BATCH_STATUS_DRAFT = 1;
  POSTING_BATCH_STATUS_ISSUED = 2;
  POSTING_BATCH_STATUS_APPROVED = 3;
  POSTING_BATCH_STATUS_PAID = 4;
  POSTING_BATCH_STATUS_VOID = 5;
}

// Where a fiscal period is in its lifecycle.
enum FiscalPeriodStatus {
  FISCAL_PERIOD_STATUS_UNSPECIFIED = 0;
  FISCAL_PERIOD_STATUS_TENTATIVE = 1;
  FISCAL_PERIOD_STATUS_CONFIRMED = 2;
  FISCAL_PERIOD_STATUS_CANCELLED = 3;
  FISCAL_PERIOD_STATUS_COMPLETED = 4;
}

// The limit of a ledger account.
message LedgerAccountLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a ledger account.
message LedgerAccountCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a ledger account.
message LedgerAccountBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A ledger account of the ledger domain.
message LedgerAccount {
  string ledger_account_id = 1;
  PostingBatchRef holder = 2;
  LedgerAccountStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated LedgerAccountLimit limits = 7;
  oneof funding {
    LedgerAccountCardFunding card = 8;
    LedgerAccountBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The line of a journal entry.
message JournalEntryLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  JournalEntryLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a journal entry line.
message JournalEntryLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a journal entry.
message JournalEntryCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a journal entry.
message JournalEntryBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a journal entry.
message JournalEntryAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A journal entry of the ledger domain.
message JournalEntry {
  string journal_entry_id = 1;
  string number = 2;
  JournalEntryStatus status = 3;
  LedgerAccountRef counterparty = 4;
  repeated JournalEntryLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    JournalEntryCardSettlement card = 8;
    JournalEntryBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated JournalEntryAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a posting batch.
message PostingBatchLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  PostingBatchLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a posting batch line.
message PostingBatchLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a posting batch.
message PostingBatchCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a posting batch.
message PostingBatchBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a posting batch.
message PostingBatchAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A posting batch of the ledger domain.
message PostingBatch {
  string posting_batch_id = 1;
  string number = 2;
  PostingBatchStatus status = 3;
  LedgerAccountRef counterparty = 4;
  repeated PostingBatchLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    PostingBatchCardSettlement card = 8;
    PostingBatchBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated PostingBatchAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The participant of a fiscal period.
message FiscalPeriodParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a fiscal period.
message FiscalPeriodDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a fiscal period.
message FiscalPeriodWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A fiscal period of the ledger domain.
message FiscalPeriod {
  string fiscal_period_id = 1;
  string title = 2;
  FiscalPeriodStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated FiscalPeriodParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    FiscalPeriodDailyRule daily = 7;
    FiscalPeriodWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}
