syntax = "proto3";

package acme.budgeting.v1;

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.budgeting.v1";

// A reference to a budget of the budgeting domain.
message BudgetRef {
  string budget_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a budget line of the budgeting domain.
message BudgetLineRef {
  string budget_line_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a forecast of the budgeting domain.
message ForecastRef {
  string forecast_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a variance of the budgeting domain.
message VarianceRef {
  string variance_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
