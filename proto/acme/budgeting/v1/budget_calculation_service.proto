    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  Budget budget = 3;
  ExplainBudgetCalculationRequest.Details details = 4;
  string reason = 5;
