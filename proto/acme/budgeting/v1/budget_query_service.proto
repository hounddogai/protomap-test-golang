syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetQueryServiceProto";
option java_package = "com.acme.budgeting.v1";

// Answers read-only questions about budgets, for screens and reports.
service BudgetQueryService {
  // Returns a budget.
  rpc LookupBudget(LookupBudgetRequest) returns (LookupBudgetResponse);

  // Lists budgets a page at a time.
  rpc BrowseBudgets(BrowseBudgetsRequest) returns (BrowseBudgetsResponse);

  // Lists budgets a page at a time.
  rpc FindBudgets(FindBudgetsRequest) returns (FindBudgetsResponse);

  // Counts budgets by status.
  rpc CountBudgets(CountBudgetsRequest) returns (CountBudgetsResponse);

  // Returns several budgets at once.
  rpc ResolveBudgets(ResolveBudgetsRequest) returns (ResolveBudgetsResponse);

  // Streams every matching budget.
  rpc ExportBudgets(ExportBudgetsRequest) returns (stream ExportBudgetsResponse);

  // Summarizes a budget.
  rpc SummarizeBudgets(SummarizeBudgetsRequest) returns (SummarizeBudgetsResponse);

  // Lists budgets a page at a time.
  rpc SuggestBudgets(SuggestBudgetsRequest) returns (SuggestBudgetsResponse);

  // Returns a budget.
  rpc PeekBudget(PeekBudgetRequest) returns (PeekBudgetResponse);
}

// The request of `LookupBudget`.
message LookupBudgetRequest {
  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupBudget`.
message LookupBudgetResponse {
  Budget budget = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseBudgets`.
message BrowseBudgetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseBudgetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseBudgets`.
message BrowseBudgetsResponse {
  repeated Budget budgets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindBudgets`.
message FindBudgetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindBudgetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindBudgets`.
message FindBudgetsResponse {
  repeated Budget budgets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBudgets`.
message CountBudgetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBudgetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBudgets`.
message CountBudgetsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveBudgets`.
message ResolveBudgetsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string budget_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveBudgets`.
message ResolveBudgetsResponse {
  repeated Budget budgets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportBudgets`.
message ExportBudgetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportBudgetsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportBudgets`.
message ExportBudgetsResponse {
  Budget budget = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeBudgets`.
message SummarizeBudgetsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  SummarizeBudgetsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeBudgets`.
message SummarizeBudgetsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestBudgets`.
message SuggestBudgetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestBudgetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestBudgets`.
message SuggestBudgetsResponse {
  repeated Budget budgets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekBudget`.
message PeekBudgetRequest {
  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekBudget`.
message PeekBudgetResponse {
  Budget budget = 1;
  acme.common.v1.OperationResult result = 2;
}
