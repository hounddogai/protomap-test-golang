syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "TrackingEventApprovalServiceProto";
option java_package = "com.acme.shipping.v1";

// Routes tracking events through approval, with escalation and delegation.
service TrackingEventApprovalService {
  // Submits a tracking event.
  rpc SubmitTrackingEvent(SubmitTrackingEventRequest) returns (SubmitTrackingEventResponse);

  // Approves a tracking event.
  rpc ApproveTrackingEvent(ApproveTrackingEventRequest) returns (ApproveTrackingEventResponse);

  // Rejects a tracking event.
  rpc RejectTrackingEvent(RejectTrackingEventRequest) returns (RejectTrackingEventResponse);

  // Escalates a tracking event.
  rpc EscalateTrackingEvent(EscalateTrackingEventRequest) returns (EscalateTrackingEventResponse);

  // Delegates a tracking event.
  rpc DelegateTrackingEventApproval(DelegateTrackingEventApprovalRequest) returns (DelegateTrackingEventApprovalResponse);

  // Recalls a tracking event.
  rpc RecallTrackingEvent(RecallTrackingEventRequest) returns (RecallTrackingEventResponse);

  // Returns a tracking event.
  rpc GetTrackingEventApprovalStatus(GetTrackingEventApprovalStatusRequest) returns (GetTrackingEventApprovalStatusResponse);

  // Comments a tracking event.
  rpc CommentTrackingEventApproval(CommentTrackingEventApprovalRequest) returns (CommentTrackingEventApprovalResponse);
}

// The request of `SubmitTrackingEvent`.
message SubmitTrackingEventRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  TrackingEvent tracking_event = 3;
  SubmitTrackingEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTrackingEvent`.
message SubmitTrackingEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TrackingEvent tracking_event = 1;
  SubmitTrackingEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

