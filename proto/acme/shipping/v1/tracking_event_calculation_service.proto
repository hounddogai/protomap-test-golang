  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  TrackingEvent tracking_event = 3;
  ExplainTrackingEventCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainTrackingEventCalculation`.
message ExplainTrackingEventCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TrackingEvent tracking_event = 1;
  ExplainTrackingEventCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTrackingEventRates`.
message GetTrackingEventRatesRequest {
