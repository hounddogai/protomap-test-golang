syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "TrackingEventCalculationServiceProto";
option java_package = "com.acme.shipping.v1";

// Computes the figures of a tracking event, such as totals, taxes, and estimates.
service TrackingEventCalculationService {
  // Calculates a tracking event.
  rpc CalculateTrackingEvent(CalculateTrackingEventRequest) returns (CalculateTrackingEventResponse);

  // Estimates a tracking event.
  rpc EstimateTrackingEvent(EstimateTrackingEventRequest) returns (EstimateTrackingEventResponse);

  // Compares a tracking event.
  rpc CompareTrackingEventOptions(CompareTrackingEventOptionsRequest) returns (CompareTrackingEventOptionsResponse);

  // Recalculates a tracking event.
  rpc RecalculateTrackingEvents(RecalculateTrackingEventsRequest) returns (RecalculateTrackingEventsResponse);

  // Explains a tracking event.
  rpc ExplainTrackingEventCalculation(ExplainTrackingEventCalculationRequest) returns (ExplainTrackingEventCalculationResponse);

  // Returns a tracking event.
  rpc GetTrackingEventRates(GetTrackingEventRatesRequest) returns (GetTrackingEventRatesResponse);
}

// The request of `CalculateTrackingEvent`.
message CalculateTrackingEventRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  TrackingEvent tracking_event = 3;
  CalculateTrackingEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTrackingEvent`.
message CalculateTrackingEventResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTrackingEventResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TrackingEvent tracking_event = 1;
  CalculateTrackingEventResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

