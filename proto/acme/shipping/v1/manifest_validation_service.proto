syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ManifestValidationServiceProto";
option java_package = "com.acme.shipping.v1";

// Checks manifests against the rules before anything acts on them.
service ManifestValidationService {
  // Validates a manifest.
  rpc ValidateManifest(ValidateManifestRequest) returns (ValidateManifestResponse);

  // Previews a manifest.
  rpc PreviewManifest(PreviewManifestRequest) returns (PreviewManifestResponse);

  // Checks a manifest.
  rpc CheckManifestEligibility(CheckManifestEligibilityRequest) returns (CheckManifestEligibilityResponse);

  // Normalizes a manifest.
  rpc NormalizeManifest(NormalizeManifestRequest) returns (NormalizeManifestResponse);

  // Scores a manifest.
  rpc ScoreManifest(ScoreManifestRequest) returns (ScoreManifestResponse);

  // Lints a manifest.
  rpc LintManifests(LintManifestsRequest) returns (LintManifestsResponse);

  // Returns a manifest.
  rpc GetManifestRules(GetManifestRulesRequest) returns (GetManifestRulesResponse);
}

// The request of `ValidateManifest`.
message ValidateManifestRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string manifest_id = 2;
  Manifest manifest = 3;
  ValidateManifestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateManifest`.
message ValidateManifestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Manifest manifest = 1;
  ValidateManifestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

