syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "CarrierRateLifecycleServiceProto";
option java_package = "com.acme.shipping.v1";

// Moves a carrier rate between the states of its lifecycle.
service CarrierRateLifecycleService {
  // Activates a carrier rate.
  rpc ActivateCarrierRate(ActivateCarrierRateRequest) returns (ActivateCarrierRateResponse);

  // Suspends a carrier rate.
  rpc SuspendCarrierRate(SuspendCarrierRateRequest) returns (SuspendCarrierRateResponse);

  // Reinstates a carrier rate.
  rpc ReinstateCarrierRate(ReinstateCarrierRateRequest) returns (ReinstateCarrierRateResponse);

  // Terminates a carrier rate.
  rpc TerminateCarrierRate(TerminateCarrierRateRequest) returns (TerminateCarrierRateResponse);

  // Renews a carrier rate.
  rpc RenewCarrierRate(RenewCarrierRateRequest) returns (RenewCarrierRateResponse);

  // Expires a carrier rate.
  rpc ExpireCarrierRate(ExpireCarrierRateRequest) returns (ExpireCarrierRateResponse);

  // Returns a carrier rate.
  rpc GetCarrierRateLifecycle(GetCarrierRateLifecycleRequest) returns (GetCarrierRateLifecycleResponse);

  // Schedules a carrier rate.
  rpc ScheduleCarrierRateExpiry(ScheduleCarrierRateExpiryRequest) returns (ScheduleCarrierRateExpiryResponse);
}

// The request of `ActivateCarrierRate`.
message ActivateCarrierRateRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  ActivateCarrierRateRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCarrierRate`.
message ActivateCarrierRateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarrierRate carrier_rate = 1;
  ActivateCarrierRateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

