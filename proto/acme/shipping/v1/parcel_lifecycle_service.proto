syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ParcelLifecycleServiceProto";
option java_package = "com.acme.shipping.v1";

// Moves a parcel between the states of its lifecycle.
service ParcelLifecycleService {
  // Activates a parcel.
  rpc ActivateParcel(ActivateParcelRequest) returns (ActivateParcelResponse);

  // Suspends a parcel.
  rpc SuspendParcel(SuspendParcelRequest) returns (SuspendParcelResponse);

  // Reinstates a parcel.
  rpc ReinstateParcel(ReinstateParcelRequest) returns (ReinstateParcelResponse);

  // Terminates a parcel.
  rpc TerminateParcel(TerminateParcelRequest) returns (TerminateParcelResponse);

  // Renews a parcel.
  rpc RenewParcel(RenewParcelRequest) returns (RenewParcelResponse);

  // Expires a parcel.
  rpc ExpireParcel(ExpireParcelRequest) returns (ExpireParcelResponse);
}

// The request of `ActivateParcel`.
message ActivateParcelRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string parcel_id = 2;
  ActivateParcelRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateParcel`.
message ActivateParcelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Parcel parcel = 1;
  ActivateParcelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

