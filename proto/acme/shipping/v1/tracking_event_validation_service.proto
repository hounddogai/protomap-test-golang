syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "TrackingEventValidationServiceProto";
option java_package = "com.acme.shipping.v1";

// Checks tracking events against the rules before anything acts on them.
service TrackingEventValidationService {
  // Validates a tracking event.
  rpc ValidateTrackingEvent(ValidateTrackingEventRequest) returns (ValidateTrackingEventResponse);

  // Previews a tracking event.
  rpc PreviewTrackingEvent(PreviewTrackingEventRequest) returns (PreviewTrackingEventResponse);

  // Checks a tracking event.
  rpc CheckTrackingEventEligibility(CheckTrackingEventEligibilityRequest) returns (CheckTrackingEventEligibilityResponse);

  // Normalizes a tracking event.
  rpc NormalizeTrackingEvent(NormalizeTrackingEventRequest) returns (NormalizeTrackingEventResponse);

  // Explains a tracking event.
  rpc ExplainTrackingEventDecision(ExplainTrackingEventDecisionRequest) returns (ExplainTrackingEventDecisionResponse);

  // Scores a tracking event.
  rpc ScoreTrackingEvent(ScoreTrackingEventRequest) returns (ScoreTrackingEventResponse);

  // Lints a tracking event.
  rpc LintTrackingEvents(LintTrackingEventsRequest) returns (LintTrackingEventsResponse);

  // Returns a tracking event.
  rpc GetTrackingEventRules(GetTrackingEventRulesRequest) returns (GetTrackingEventRulesResponse);
}

// The request of `ValidateTrackingEvent`.
message ValidateTrackingEventRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  TrackingEvent tracking_event = 3;
  ValidateTrackingEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTrackingEvent`.
message ValidateTrackingEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TrackingEvent tracking_event = 1;
  ValidateTrackingEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

