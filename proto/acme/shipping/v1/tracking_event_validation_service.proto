// The request of `ScoreTrackingEvent`.
message ScoreTrackingEventRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  TrackingEvent tracking_event = 3;
  ScoreTrackingEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreTrackingEvent`.
message ScoreTrackingEventResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreTrackingEventResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TrackingEvent tracking_event = 1;
  ScoreTrackingEventResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

