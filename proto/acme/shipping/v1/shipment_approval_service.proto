syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ShipmentApprovalServiceProto";
option java_package = "com.acme.shipping.v1";

// Routes shipments through approval, with escalation and delegation.
service ShipmentApprovalService {
  // Submits a shipment.
  rpc SubmitShipment(SubmitShipmentRequest) returns (SubmitShipmentResponse);

  // Approves a shipment.
  rpc ApproveShipment(ApproveShipmentRequest) returns (ApproveShipmentResponse);

  // Rejects a shipment.
  rpc RejectShipment(RejectShipmentRequest) returns (RejectShipmentResponse);

  // Escalates a shipment.
  rpc EscalateShipment(EscalateShipmentRequest) returns (EscalateShipmentResponse);

  // Lists shipments a page at a time.
  rpc ListPendingShipments(ListPendingShipmentsRequest) returns (ListPendingShipmentsResponse);

  // Delegates a shipment.
  rpc DelegateShipmentApproval(DelegateShipmentApprovalRequest) returns (DelegateShipmentApprovalResponse);

  // Recalls a shipment.
  rpc RecallShipment(RecallShipmentRequest) returns (RecallShipmentResponse);

  // Returns a shipment.
  rpc GetShipmentApprovalStatus(GetShipmentApprovalStatusRequest) returns (GetShipmentApprovalStatusResponse);

  // Comments a shipment.
  rpc CommentShipmentApproval(CommentShipmentApprovalRequest) returns (CommentShipmentApprovalResponse);
}

// The request of `SubmitShipment`.
message SubmitShipmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shipment_id = 2;
  Shipment shipment = 3;
  SubmitShipmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitShipment`.
message SubmitShipmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Shipment shipment = 1;
  SubmitShipmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

