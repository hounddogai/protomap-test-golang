syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "TrackingEventReportingServiceProto";
option java_package = "com.acme.shipping.v1";

// Builds and schedules reports about tracking events.
service TrackingEventReportingService {
  // Generates a tracking event.
  rpc GenerateTrackingEventReport(GenerateTrackingEventReportRequest) returns (GenerateTrackingEventReportResponse);

  // Returns a tracking event.
  rpc FetchTrackingEventReport(FetchTrackingEventReportRequest) returns (FetchTrackingEventReportResponse);

  // Schedules a tracking event.
  rpc ScheduleTrackingEventReport(ScheduleTrackingEventReportRequest) returns (ScheduleTrackingEventReportResponse);

  // Streams the changes of tracking events as they happen.
  rpc StreamTrackingEventMetrics(StreamTrackingEventMetricsRequest) returns (stream StreamTrackingEventMetricsResponse);

  // Lists tracking events a page at a time.
  rpc ListTrackingEventReports(ListTrackingEventReportsRequest) returns (ListTrackingEventReportsResponse);

  // Shares a tracking event.
  rpc ShareTrackingEventReport(ShareTrackingEventReportRequest) returns (ShareTrackingEventReportResponse);

  // Counts tracking events by status.
  rpc CountTrackingEventTotals(CountTrackingEventTotalsRequest) returns (CountTrackingEventTotalsResponse);

  // Deletes a tracking event.
  rpc DeleteTrackingEventReport(DeleteTrackingEventReportRequest) returns (DeleteTrackingEventReportResponse);
}

// The request of `GenerateTrackingEventReport`.
message GenerateTrackingEventReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  GenerateTrackingEventReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTrackingEventReport`.
message GenerateTrackingEventReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTrackingEventReport`.
message FetchTrackingEventReportRequest {
  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTrackingEventReport`.
message FetchTrackingEventReportResponse {
  TrackingEvent tracking_event = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTrackingEventReport`.
message ScheduleTrackingEventReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  ScheduleTrackingEventReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTrackingEventReport`.
message ScheduleTrackingEventReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTrackingEventMetrics`.
message StreamTrackingEventMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TrackingEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTrackingEventMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTrackingEventMetrics`.
message StreamTrackingEventMetricsResponse {
  TrackingEvent tracking_event = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListTrackingEventReports`.
message ListTrackingEventReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TrackingEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTrackingEventReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTrackingEventReports`.
message ListTrackingEventReportsResponse {
  repeated TrackingEvent tracking_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareTrackingEventReport`.
message ShareTrackingEventReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  ShareTrackingEventReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTrackingEventReport`.
message ShareTrackingEventReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TrackingEvent tracking_event = 1;
  ShareTrackingEventReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTrackingEventTotals`.
message CountTrackingEventTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TrackingEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTrackingEventTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTrackingEventTotals`.
message CountTrackingEventTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteTrackingEventReport`.
message DeleteTrackingEventReportRequest {
  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTrackingEventReport`.
message DeleteTrackingEventReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
