syntax = "proto3";

package acme.shipping.v1;

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.shipping.v1";

// A reference to a shipment of the shipping domain.
message ShipmentRef {
  string shipment_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a parcel of the shipping domain.
message ParcelRef {
  string parcel_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a carrier rate of the shipping domain.
message CarrierRateRef {
  string carrier_rate_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a tracking event of the shipping domain.
message TrackingEventRef {
  string tracking_event_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a manifest of the shipping domain.
message ManifestRef {
  string manifest_id = 1;
  string display_name = 2;
  string number = 3;
}
