syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ManifestReportingServiceProto";
option java_package = "com.acme.shipping.v1";

// Builds and schedules reports about manifests.
service ManifestReportingService {
  // Generates a manifest.
  rpc GenerateManifestReport(GenerateManifestReportRequest) returns (GenerateManifestReportResponse);

  // Returns a manifest.
  rpc FetchManifestReport(FetchManifestReportRequest) returns (FetchManifestReportResponse);

  // Schedules a manifest.
  rpc ScheduleManifestReport(ScheduleManifestReportRequest) returns (ScheduleManifestReportResponse);

  // Lists manifests a page at a time.
  rpc ListManifestReports(ListManifestReportsRequest) returns (ListManifestReportsResponse);

  // Shares a manifest.
  rpc ShareManifestReport(ShareManifestReportRequest) returns (ShareManifestReportResponse);

  // Counts manifests by status.
  rpc CountManifestTotals(CountManifestTotalsRequest) returns (CountManifestTotalsResponse);

  // Deletes a manifest.
  rpc DeleteManifestReport(DeleteManifestReportRequest) returns (DeleteManifestReportResponse);
}

// The request of `GenerateManifestReport`.
message GenerateManifestReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string manifest_id = 2;
  GenerateManifestReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateManifestReport`.
message GenerateManifestReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchManifestReport`.
message FetchManifestReportRequest {
  acme.common.v1.RequestContext context = 1;
  string manifest_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchManifestReport`.
message FetchManifestReportResponse {
  Manifest manifest = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleManifestReport`.
message ScheduleManifestReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string manifest_id = 2;
  ScheduleManifestReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleManifestReport`.
message ScheduleManifestReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListManifestReports`.
message ListManifestReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ManifestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListManifestReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListManifestReports`.
message ListManifestReportsResponse {
  repeated Manifest manifests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareManifestReport`.
message ShareManifestReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string manifest_id = 2;
  ShareManifestReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareManifestReport`.
message ShareManifestReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Manifest manifest = 1;
  ShareManifestReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountManifestTotals`.
message CountManifestTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ManifestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountManifestTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountManifestTotals`.
message CountManifestTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteManifestReport`.
message DeleteManifestReportRequest {
  acme.common.v1.RequestContext context = 1;
  string manifest_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteManifestReport`.
message DeleteManifestReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
