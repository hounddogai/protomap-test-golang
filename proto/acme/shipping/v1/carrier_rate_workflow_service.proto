  acme.common.v1.OperationResult result = 2;
}

// The request of `ListCarrierRateWorkflows`.
message ListCarrierRateWorkflowsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CarrierRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCarrierRateWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCarrierRateWorkflows`.
message ListCarrierRateWorkflowsResponse {
  repeated CarrierRate carrier_rates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

