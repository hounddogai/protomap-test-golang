syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "CarrierRateWorkflowServiceProto";
option java_package = "com.acme.shipping.v1";

// Runs the long-lived workflow that takes a carrier rate from start to finish.
service CarrierRateWorkflowService {
  // Starts a carrier rate.
  rpc StartCarrierRateWorkflow(StartCarrierRateWorkflowRequest) returns (StartCarrierRateWorkflowResponse);

  // Advances a carrier rate.
  rpc AdvanceCarrierRateWorkflow(AdvanceCarrierRateWorkflowRequest) returns (AdvanceCarrierRateWorkflowResponse);

  // Retrys a carrier rate.
  rpc RetryCarrierRateWorkflow(RetryCarrierRateWorkflowRequest) returns (RetryCarrierRateWorkflowResponse);

  // Resumes a carrier rate.
  rpc ResumeCarrierRateWorkflow(ResumeCarrierRateWorkflowRequest) returns (ResumeCarrierRateWorkflowResponse);

  // Returns a carrier rate.
  rpc InspectCarrierRateWorkflow(InspectCarrierRateWorkflowRequest) returns (InspectCarrierRateWorkflowResponse);

  // Lists carrier rates a page at a time.
  rpc ListCarrierRateWorkflows(ListCarrierRateWorkflowsRequest) returns (ListCarrierRateWorkflowsResponse);

  // Signals a carrier rate.
  rpc SignalCarrierRateWorkflow(SignalCarrierRateWorkflowRequest) returns (SignalCarrierRateWorkflowResponse);
}

// The request of `StartCarrierRateWorkflow`.
message StartCarrierRateWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  CarrierRate carrier_rate = 3;
  StartCarrierRateWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCarrierRateWorkflow`.
message StartCarrierRateWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarrierRate carrier_rate = 1;
  StartCarrierRateWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

