syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ShipmentValidationServiceProto";
option java_package = "com.acme.shipping.v1";

// Checks shipments against the rules before anything acts on them.
service ShipmentValidationService {
  // Validates a shipment.
  rpc ValidateShipment(ValidateShipmentRequest) returns (ValidateShipmentResponse);

  // Previews a shipment.
  rpc PreviewShipment(PreviewShipmentRequest) returns (PreviewShipmentResponse);

  // Checks a shipment.
  rpc CheckShipmentEligibility(CheckShipmentEligibilityRequest) returns (CheckShipmentEligibilityResponse);

  // Normalizes a shipment.
  rpc NormalizeShipment(NormalizeShipmentRequest) returns (NormalizeShipmentResponse);

  // Explains a shipment.
  rpc ExplainShipmentDecision(ExplainShipmentDecisionRequest) returns (ExplainShipmentDecisionResponse);

  // Scores a shipment.
  rpc ScoreShipment(ScoreShipmentRequest) returns (ScoreShipmentResponse);

  // Lints a shipment.
  rpc LintShipments(LintShipmentsRequest) returns (LintShipmentsResponse);

  // Returns a shipment.
  rpc GetShipmentRules(GetShipmentRulesRequest) returns (GetShipmentRulesResponse);
}

// The request of `ValidateShipment`.
message ValidateShipmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string shipment_id = 2;
  Shipment shipment = 3;
  ValidateShipmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateShipment`.
message ValidateShipmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Shipment shipment = 1;
  ValidateShipmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

