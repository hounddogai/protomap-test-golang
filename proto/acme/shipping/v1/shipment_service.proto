syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ShipmentServiceProto";
option java_package = "com.acme.shipping.v1";

// Manages shipments: creates, reads, changes, and lists them.
service ShipmentService {
  // Creates a shipment.
  rpc CreateShipment(CreateShipmentRequest) returns (CreateShipmentResponse);

  // Returns a shipment.
  rpc GetShipment(GetShipmentRequest) returns (GetShipmentResponse);

  // Changes a shipment.
  rpc UpdateShipment(UpdateShipmentRequest) returns (UpdateShipmentResponse);

  // Deletes a shipment.
  rpc DeleteShipment(DeleteShipmentRequest) returns (DeleteShipmentResponse);

  // Lists shipments a page at a time.
  rpc ListShipments(ListShipmentsRequest) returns (ListShipmentsResponse);

  // Returns several shipments at once.
  rpc BatchGetShipments(BatchGetShipmentsRequest) returns (BatchGetShipmentsResponse);

  // Lists shipments a page at a time.
  rpc SearchShipments(SearchShipmentsRequest) returns (SearchShipmentsResponse);

  // Streams the changes of shipments as they happen.
  rpc WatchShipments(WatchShipmentsRequest) returns (stream WatchShipmentsResponse);

  // Takes a stream of shipments and answers once at the end.
  rpc BatchCreateShipments(stream BatchCreateShipmentsRequest) returns (BatchCreateShipmentsResponse);

  // Creates a shipment.
  rpc CloneShipment(CloneShipmentRequest) returns (CloneShipmentResponse);
}

// The request of `CreateShipment`.
message CreateShipmentRequest {
  acme.common.v1.RequestContext context = 1;
  Shipment shipment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateShipment`.
message CreateShipmentResponse {
  Shipment shipment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetShipment`.
message GetShipmentRequest {
  acme.common.v1.RequestContext context = 1;
  string shipment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetShipment`.
message GetShipmentResponse {
  Shipment shipment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateShipment`.
message UpdateShipmentRequest {
  acme.common.v1.RequestContext context = 1;
  Shipment shipment = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateShipment`.
message UpdateShipmentResponse {
  Shipment shipment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteShipment`.
message DeleteShipmentRequest {
  acme.common.v1.RequestContext context = 1;
  string shipment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteShipment`.
message DeleteShipmentResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListShipments`.
message ListShipmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShipmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListShipmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListShipments`.
message ListShipmentsResponse {
  repeated Shipment shipments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetShipments`.
message BatchGetShipmentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string shipment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetShipments`.
message BatchGetShipmentsResponse {
  repeated Shipment shipments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchShipments`.
message SearchShipmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShipmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchShipmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchShipments`.
message SearchShipmentsResponse {
  repeated Shipment shipments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchShipments`.
message WatchShipmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShipmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchShipmentsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchShipments`.
message WatchShipmentsResponse {
  Shipment shipment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateShipments`.
message BatchCreateShipmentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateShipmentsRequest.StreamHeader header = 2;
    Shipment record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateShipments`.
message BatchCreateShipmentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string shipment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateShipmentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneShipment`.
message CloneShipmentRequest {
  acme.common.v1.RequestContext context = 1;
  Shipment shipment = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneShipment`.
message CloneShipmentResponse {
  Shipment shipment = 1;
  acme.common.v1.OperationResult result = 2;
}
