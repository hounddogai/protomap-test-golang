syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "TrackingEventLifecycleServiceProto";
option java_package = "com.acme.shipping.v1";

// Moves a tracking event between the states of its lifecycle.
service TrackingEventLifecycleService {
  // Activates a tracking event.
  rpc ActivateTrackingEvent(ActivateTrackingEventRequest) returns (ActivateTrackingEventResponse);

  // Suspends a tracking event.
  rpc SuspendTrackingEvent(SuspendTrackingEventRequest) returns (SuspendTrackingEventResponse);

  // Reinstates a tracking event.
  rpc ReinstateTrackingEvent(ReinstateTrackingEventRequest) returns (ReinstateTrackingEventResponse);

  // Terminates a tracking event.
  rpc TerminateTrackingEvent(TerminateTrackingEventRequest) returns (TerminateTrackingEventResponse);

  // Renews a tracking event.
  rpc RenewTrackingEvent(RenewTrackingEventRequest) returns (RenewTrackingEventResponse);

  // Schedules a tracking event.
  rpc ScheduleTrackingEventExpiry(ScheduleTrackingEventExpiryRequest) returns (ScheduleTrackingEventExpiryResponse);
}

// The request of `ActivateTrackingEvent`.
message ActivateTrackingEventRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tracking_event_id = 2;
  ActivateTrackingEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTrackingEvent`.
message ActivateTrackingEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TrackingEvent tracking_event = 1;
  ActivateTrackingEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

