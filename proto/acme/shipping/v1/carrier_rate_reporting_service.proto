syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "CarrierRateReportingServiceProto";
option java_package = "com.acme.shipping.v1";

// Builds and schedules reports about carrier rates.
service CarrierRateReportingService {
  // Generates a carrier rate.
  rpc GenerateCarrierRateReport(GenerateCarrierRateReportRequest) returns (GenerateCarrierRateReportResponse);

  // Returns a carrier rate.
  rpc FetchCarrierRateReport(FetchCarrierRateReportRequest) returns (FetchCarrierRateReportResponse);

  // Streams the changes of carrier rates as they happen.
  rpc StreamCarrierRateMetrics(StreamCarrierRateMetricsRequest) returns (stream StreamCarrierRateMetricsResponse);

  // Lists carrier rates a page at a time.
  rpc ListCarrierRateReports(ListCarrierRateReportsRequest) returns (ListCarrierRateReportsResponse);

  // Shares a carrier rate.
  rpc ShareCarrierRateReport(ShareCarrierRateReportRequest) returns (ShareCarrierRateReportResponse);

  // Counts carrier rates by status.
  rpc CountCarrierRateTotals(CountCarrierRateTotalsRequest) returns (CountCarrierRateTotalsResponse);

  // Deletes a carrier rate.
  rpc DeleteCarrierRateReport(DeleteCarrierRateReportRequest) returns (DeleteCarrierRateReportResponse);
}

// The request of `GenerateCarrierRateReport`.
message GenerateCarrierRateReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  GenerateCarrierRateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateCarrierRateReport`.
message GenerateCarrierRateReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchCarrierRateReport`.
message FetchCarrierRateReportRequest {
  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchCarrierRateReport`.
message FetchCarrierRateReportResponse {
  CarrierRate carrier_rate = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamCarrierRateMetrics`.
message StreamCarrierRateMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CarrierRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamCarrierRateMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamCarrierRateMetrics`.
message StreamCarrierRateMetricsResponse {
  CarrierRate carrier_rate = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCarrierRateReports`.
message ListCarrierRateReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CarrierRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCarrierRateReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCarrierRateReports`.
message ListCarrierRateReportsResponse {
  repeated CarrierRate carrier_rates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareCarrierRateReport`.
message ShareCarrierRateReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  ShareCarrierRateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareCarrierRateReport`.
message ShareCarrierRateReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarrierRate carrier_rate = 1;
  ShareCarrierRateReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCarrierRateTotals`.
message CountCarrierRateTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CarrierRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCarrierRateTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCarrierRateTotals`.
message CountCarrierRateTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteCarrierRateReport`.
message DeleteCarrierRateReportRequest {
  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCarrierRateReport`.
message DeleteCarrierRateReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
