syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ParcelApprovalServiceProto";
option java_package = "com.acme.shipping.v1";

// Routes parcels through approval, with escalation and delegation.
service ParcelApprovalService {
  // Submits a parcel.
  rpc SubmitParcel(SubmitParcelRequest) returns (SubmitParcelResponse);

  // Approves a parcel.
  rpc ApproveParcel(ApproveParcelRequest) returns (ApproveParcelResponse);

  // Rejects a parcel.
  rpc RejectParcel(RejectParcelRequest) returns (RejectParcelResponse);

  // Escalates a parcel.
  rpc EscalateParcel(EscalateParcelRequest) returns (EscalateParcelResponse);

  // Lists parcels a page at a time.
  rpc ListPendingParcels(ListPendingParcelsRequest) returns (ListPendingParcelsResponse);

  // Delegates a parcel.
  rpc DelegateParcelApproval(DelegateParcelApprovalRequest) returns (DelegateParcelApprovalResponse);

  // Recalls a parcel.
  rpc RecallParcel(RecallParcelRequest) returns (RecallParcelResponse);

  // Returns a parcel.
  rpc GetParcelApprovalStatus(GetParcelApprovalStatusRequest) returns (GetParcelApprovalStatusResponse);

  // Comments a parcel.
  rpc CommentParcelApproval(CommentParcelApprovalRequest) returns (CommentParcelApprovalResponse);
}

// The request of `SubmitParcel`.
message SubmitParcelRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string parcel_id = 2;
  Parcel parcel = 3;
  SubmitParcelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitParcel`.
message SubmitParcelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Parcel parcel = 1;
  SubmitParcelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveParcel`.
message ApproveParcelRequest {
