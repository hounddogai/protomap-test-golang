syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ParcelQueryServiceProto";
option java_package = "com.acme.shipping.v1";

// Answers read-only questions about parcels, for screens and reports.
service ParcelQueryService {
  // Returns a parcel.
  rpc LookupParcel(LookupParcelRequest) returns (LookupParcelResponse);

  // Lists parcels a page at a time.
  rpc BrowseParcels(BrowseParcelsRequest) returns (BrowseParcelsResponse);

  // Counts parcels by status.
  rpc CountParcels(CountParcelsRequest) returns (CountParcelsResponse);

  // Returns several parcels at once.
  rpc ResolveParcels(ResolveParcelsRequest) returns (ResolveParcelsResponse);

  // Summarizes a parcel.
  rpc SummarizeParcels(SummarizeParcelsRequest) returns (SummarizeParcelsResponse);

  // Returns a parcel.
  rpc PeekParcel(PeekParcelRequest) returns (PeekParcelResponse);
}

// The request of `LookupParcel`.
message LookupParcelRequest {
  acme.common.v1.RequestContext context = 1;
  string parcel_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupParcel`.
message LookupParcelResponse {
  Parcel parcel = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseParcels`.
message BrowseParcelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ParcelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseParcelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseParcels`.
message BrowseParcelsResponse {
  repeated Parcel parcels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountParcels`.
message CountParcelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ParcelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountParcelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountParcels`.
message CountParcelsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveParcels`.
message ResolveParcelsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string parcel_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveParcels`.
message ResolveParcelsResponse {
  repeated Parcel parcels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeParcels`.
message SummarizeParcelsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string parcel_id = 2;
  SummarizeParcelsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeParcels`.
message SummarizeParcelsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekParcel`.
message PeekParcelRequest {
  acme.common.v1.RequestContext context = 1;
  string parcel_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekParcel`.
message PeekParcelResponse {
  Parcel parcel = 1;
  acme.common.v1.OperationResult result = 2;
}
