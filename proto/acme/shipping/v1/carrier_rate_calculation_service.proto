    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarrierRate carrier_rate = 1;
  ExplainCarrierRateCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetCarrierRateRates`.
message GetCarrierRateRatesRequest {
