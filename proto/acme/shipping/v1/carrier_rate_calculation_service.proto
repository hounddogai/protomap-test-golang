syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "CarrierRateCalculationServiceProto";
option java_package = "com.acme.shipping.v1";

// Computes the figures of a carrier rate, such as totals, taxes, and estimates.
service CarrierRateCalculationService {
  // Calculates a carrier rate.
  rpc CalculateCarrierRate(CalculateCarrierRateRequest) returns (CalculateCarrierRateResponse);

  // Estimates a carrier rate.
  rpc EstimateCarrierRate(EstimateCarrierRateRequest) returns (EstimateCarrierRateResponse);

  // Quotes a carrier rate.
  rpc QuoteCarrierRate(QuoteCarrierRateRequest) returns (QuoteCarrierRateResponse);

  // Compares a carrier rate.
  rpc CompareCarrierRateOptions(CompareCarrierRateOptionsRequest) returns (CompareCarrierRateOptionsResponse);

  // Recalculates a carrier rate.
  rpc RecalculateCarrierRates(RecalculateCarrierRatesRequest) returns (RecalculateCarrierRatesResponse);

  // Simulates a carrier rate.
  rpc SimulateCarrierRate(SimulateCarrierRateRequest) returns (SimulateCarrierRateResponse);

  // Explains a carrier rate.
  rpc ExplainCarrierRateCalculation(ExplainCarrierRateCalculationRequest) returns (ExplainCarrierRateCalculationResponse);

  // Returns a carrier rate.
  rpc GetCarrierRateRates(GetCarrierRateRatesRequest) returns (GetCarrierRateRatesResponse);
}

// The request of `CalculateCarrierRate`.
message CalculateCarrierRateRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  CarrierRate carrier_rate = 3;
  CalculateCarrierRateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCarrierRate`.
message CalculateCarrierRateResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCarrierRateResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CarrierRate carrier_rate = 1;
  CalculateCarrierRateResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

