syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "ParcelValidationServiceProto";
option java_package = "com.acme.shipping.v1";

// Checks parcels against the rules before anything acts on them.
service ParcelValidationService {
  // Validates a parcel.
  rpc ValidateParcel(ValidateParcelRequest) returns (ValidateParcelResponse);

  // Previews a parcel.
  rpc PreviewParcel(PreviewParcelRequest) returns (PreviewParcelResponse);

  // Checks a parcel.
  rpc CheckParcelEligibility(CheckParcelEligibilityRequest) returns (CheckParcelEligibilityResponse);

  // Normalizes a parcel.
  rpc NormalizeParcel(NormalizeParcelRequest) returns (NormalizeParcelResponse);

  // Explains a parcel.
  rpc ExplainParcelDecision(ExplainParcelDecisionRequest) returns (ExplainParcelDecisionResponse);

  // Scores a parcel.
  rpc ScoreParcel(ScoreParcelRequest) returns (ScoreParcelResponse);

  // Lints a parcel.
  rpc LintParcels(LintParcelsRequest) returns (LintParcelsResponse);

  // Returns a parcel.
  rpc GetParcelRules(GetParcelRulesRequest) returns (GetParcelRulesResponse);
}

// The request of `ValidateParcel`.
message ValidateParcelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string parcel_id = 2;
  Parcel parcel = 3;
  ValidateParcelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateParcel`.
message ValidateParcelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Parcel parcel = 1;
  ValidateParcelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

