syntax = "proto3";

package acme.shipping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shipping/v1/shipping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shipping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shipping/v1;shippingv1";
option java_multiple_files = true;
option java_outer_classname = "CarrierRateValidationServiceProto";
option java_package = "com.acme.shipping.v1";

// Checks carrier rates against the rules before anything acts on them.
service CarrierRateValidationService {
  // Validates a carrier rate.
  rpc ValidateCarrierRate(ValidateCarrierRateRequest) returns (ValidateCarrierRateResponse);

  // Previews a carrier rate.
  rpc PreviewCarrierRate(PreviewCarrierRateRequest) returns (PreviewCarrierRateResponse);

  // Checks a carrier rate.
  rpc CheckCarrierRateEligibility(CheckCarrierRateEligibilityRequest) returns (CheckCarrierRateEligibilityResponse);

  // Normalizes a carrier rate.
  rpc NormalizeCarrierRate(NormalizeCarrierRateRequest) returns (NormalizeCarrierRateResponse);

  // Explains a carrier rate.
  rpc ExplainCarrierRateDecision(ExplainCarrierRateDecisionRequest) returns (ExplainCarrierRateDecisionResponse);

  // Scores a carrier rate.
  rpc ScoreCarrierRate(ScoreCarrierRateRequest) returns (ScoreCarrierRateResponse);

  // Lints a carrier rate.
  rpc LintCarrierRates(LintCarrierRatesRequest) returns (LintCarrierRatesResponse);

  // Returns a carrier rate.
  rpc GetCarrierRateRules(GetCarrierRateRulesRequest) returns (GetCarrierRateRulesResponse);
}

// The request of `ValidateCarrierRate`.
message ValidateCarrierRateRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string carrier_rate_id = 2;
  CarrierRate carrier_rate = 3;
  ValidateCarrierRateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCarrierRate`.
message ValidateCarrierRateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarrierRate carrier_rate = 1;
  ValidateCarrierRateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

