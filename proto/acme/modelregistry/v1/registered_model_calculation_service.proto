  }

  RegisteredModel registered_model = 1;
  ExplainRegisteredModelCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRegisteredModelRates`.
message GetRegisteredModelRatesRequest {
