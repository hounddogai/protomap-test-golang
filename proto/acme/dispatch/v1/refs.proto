syntax = "proto3";

package acme.dispatch.v1;

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.dispatch.v1";

// A reference to a dispatch order of the dispatch domain.
message DispatchOrderRef {
  string dispatch_order_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a dispatch assignment of the dispatch domain.
message DispatchAssignmentRef {
  string dispatch_assignment_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a zone of the dispatch domain.
message ZoneRef {
  string zone_id = 1;
  string display_name = 2;
  string path = 3;
}
