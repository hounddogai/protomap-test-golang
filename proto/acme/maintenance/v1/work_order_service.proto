syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "WorkOrderServiceProto";
option java_package = "com.acme.maintenance.v1";

// Manages work orders: creates, reads, changes, and lists them.
service WorkOrderService {
  // Creates a work order.
  rpc CreateWorkOrder(CreateWorkOrderRequest) returns (CreateWorkOrderResponse);

  // Returns a work order.
  rpc GetWorkOrder(GetWorkOrderRequest) returns (GetWorkOrderResponse);

  // Deletes a work order.
  rpc DeleteWorkOrder(DeleteWorkOrderRequest) returns (DeleteWorkOrderResponse);

  // Lists work orders a page at a time.
  rpc ListWorkOrders(ListWorkOrdersRequest) returns (ListWorkOrdersResponse);

  // Returns several work orders at once.
  rpc BatchGetWorkOrders(BatchGetWorkOrdersRequest) returns (BatchGetWorkOrdersResponse);

  // Streams the changes of work orders as they happen.
  rpc WatchWorkOrders(WatchWorkOrdersRequest) returns (stream WatchWorkOrdersResponse);

  // Takes a stream of work orders and answers once at the end.
  rpc BatchCreateWorkOrders(stream BatchCreateWorkOrdersRequest) returns (BatchCreateWorkOrdersResponse);
}

// The request of `CreateWorkOrder`.
message CreateWorkOrderRequest {
  acme.common.v1.RequestContext context = 1;
  WorkOrder work_order = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateWorkOrder`.
message CreateWorkOrderResponse {
  WorkOrder work_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetWorkOrder`.
message GetWorkOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string work_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetWorkOrder`.
message GetWorkOrderResponse {
  WorkOrder work_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteWorkOrder`.
message DeleteWorkOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string work_order_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteWorkOrder`.
message DeleteWorkOrderResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListWorkOrders`.
message ListWorkOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWorkOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWorkOrders`.
message ListWorkOrdersResponse {
  repeated WorkOrder work_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetWorkOrders`.
message BatchGetWorkOrdersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string work_order_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetWorkOrders`.
message BatchGetWorkOrdersResponse {
  repeated WorkOrder work_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchWorkOrders`.
message WatchWorkOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchWorkOrdersRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchWorkOrders`.
message WatchWorkOrdersResponse {
  WorkOrder work_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateWorkOrders`.
message BatchCreateWorkOrdersRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateWorkOrdersRequest.StreamHeader header = 2;
    WorkOrder record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateWorkOrders`.
message BatchCreateWorkOrdersResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string work_order_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateWorkOrdersResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}
