syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "WorkOrderCalculationServiceProto";
option java_package = "com.acme.maintenance.v1";

// Computes the figures of a work order, such as totals, taxes, and estimates.
service WorkOrderCalculationService {
  // Calculates a work order.
  rpc CalculateWorkOrder(CalculateWorkOrderRequest) returns (CalculateWorkOrderResponse);

  // Estimates a work order.
  rpc EstimateWorkOrder(EstimateWorkOrderRequest) returns (EstimateWorkOrderResponse);

  // Quotes a work order.
  rpc QuoteWorkOrder(QuoteWorkOrderRequest) returns (QuoteWorkOrderResponse);

  // Compares a work order.
  rpc CompareWorkOrderOptions(CompareWorkOrderOptionsRequest) returns (CompareWorkOrderOptionsResponse);

  // Recalculates a work order.
  rpc RecalculateWorkOrders(RecalculateWorkOrdersRequest) returns (RecalculateWorkOrdersResponse);

  // Simulates a work order.
  rpc SimulateWorkOrder(SimulateWorkOrderRequest) returns (SimulateWorkOrderResponse);

  // Explains a work order.
  rpc ExplainWorkOrderCalculation(ExplainWorkOrderCalculationRequest) returns (ExplainWorkOrderCalculationResponse);

  // Returns a work order.
  rpc GetWorkOrderRates(GetWorkOrderRatesRequest) returns (GetWorkOrderRatesResponse);
}

// The request of `CalculateWorkOrder`.
message CalculateWorkOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string work_order_id = 2;
  WorkOrder work_order = 3;
  CalculateWorkOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateWorkOrder`.
message CalculateWorkOrderResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateWorkOrderResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  WorkOrder work_order = 1;
  CalculateWorkOrderResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

