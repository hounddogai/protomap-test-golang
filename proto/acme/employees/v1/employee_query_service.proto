syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employees/v1/employees.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "EmployeeQueryServiceProto";
option java_package = "com.acme.employees.v1";

// Answers read-only questions about employees, for screens and reports.
service EmployeeQueryService {
  // Returns an employee.
  rpc LookupEmployee(LookupEmployeeRequest) returns (LookupEmployeeResponse);

  // Lists employees a page at a time.
  rpc BrowseEmployees(BrowseEmployeesRequest) returns (BrowseEmployeesResponse);

  // Lists employees a page at a time.
  rpc FindEmployees(FindEmployeesRequest) returns (FindEmployeesResponse);

  // Counts employees by status.
  rpc CountEmployees(CountEmployeesRequest) returns (CountEmployeesResponse);

  // Returns several employees at once.
  rpc ResolveEmployees(ResolveEmployeesRequest) returns (ResolveEmployeesResponse);

  // Streams every matching employee.
  rpc ExportEmployees(ExportEmployeesRequest) returns (stream ExportEmployeesResponse);

  // Summarizes an employee.
  rpc SummarizeEmployees(SummarizeEmployeesRequest) returns (SummarizeEmployeesResponse);

  // Lists employees a page at a time.
  rpc SuggestEmployees(SuggestEmployeesRequest) returns (SuggestEmployeesResponse);

  // Returns an employee.
  rpc PeekEmployee(PeekEmployeeRequest) returns (PeekEmployeeResponse);
}

// The request of `LookupEmployee`.
message LookupEmployeeRequest {
  acme.common.v1.RequestContext context = 1;
  string employee_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupEmployee`.
message LookupEmployeeResponse {
  Employee employee = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseEmployees`.
message BrowseEmployeesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EmployeeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseEmployeesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseEmployees`.
message BrowseEmployeesResponse {
  repeated Employee employees = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindEmployees`.
message FindEmployeesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EmployeeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindEmployeesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindEmployees`.
message FindEmployeesResponse {
  repeated Employee employees = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountEmployees`.
message CountEmployeesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EmployeeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountEmployeesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountEmployees`.
message CountEmployeesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveEmployees`.
message ResolveEmployeesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string employee_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveEmployees`.
message ResolveEmployeesResponse {
  repeated Employee employees = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportEmployees`.
message ExportEmployeesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EmployeeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportEmployeesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportEmployees`.
message ExportEmployeesResponse {
  Employee employee = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeEmployees`.
message SummarizeEmployeesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string employee_id = 2;
  SummarizeEmployeesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeEmployees`.
message SummarizeEmployeesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestEmployees`.
message SuggestEmployeesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EmployeeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestEmployeesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestEmployees`.
message SuggestEmployeesResponse {
  repeated Employee employees = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekEmployee`.
message PeekEmployeeRequest {
  acme.common.v1.RequestContext context = 1;
  string employee_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekEmployee`.
message PeekEmployeeResponse {
  Employee employee = 1;
  acme.common.v1.OperationResult result = 2;
}
