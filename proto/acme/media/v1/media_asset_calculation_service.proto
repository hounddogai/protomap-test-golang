syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "MediaAssetCalculationServiceProto";
option java_package = "com.acme.media.v1";

// Computes the figures of a media asset, such as totals, taxes, and estimates.
service MediaAssetCalculationService {
  // Calculates a media asset.
  rpc CalculateMediaAsset(CalculateMediaAssetRequest) returns (CalculateMediaAssetResponse);

  // Estimates a media asset.
  rpc EstimateMediaAsset(EstimateMediaAssetRequest) returns (EstimateMediaAssetResponse);

  // Quotes a media asset.
  rpc QuoteMediaAsset(QuoteMediaAssetRequest) returns (QuoteMediaAssetResponse);

  // Compares a media asset.
  rpc CompareMediaAssetOptions(CompareMediaAssetOptionsRequest) returns (CompareMediaAssetOptionsResponse);

  // Recalculates a media asset.
  rpc RecalculateMediaAssets(RecalculateMediaAssetsRequest) returns (RecalculateMediaAssetsResponse);

  // Simulates a media asset.
  rpc SimulateMediaAsset(SimulateMediaAssetRequest) returns (SimulateMediaAssetResponse);

  // Explains a media asset.
  rpc ExplainMediaAssetCalculation(ExplainMediaAssetCalculationRequest) returns (ExplainMediaAssetCalculationResponse);

  // Returns a media asset.
  rpc GetMediaAssetRates(GetMediaAssetRatesRequest) returns (GetMediaAssetRatesResponse);
}

// The request of `CalculateMediaAsset`.
message CalculateMediaAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  MediaAsset media_asset = 3;
  CalculateMediaAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateMediaAsset`.
message CalculateMediaAssetResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateMediaAssetResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  MediaAsset media_asset = 1;
  CalculateMediaAssetResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

