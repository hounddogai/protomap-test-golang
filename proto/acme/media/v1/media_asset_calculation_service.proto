    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MediaAsset media_asset = 1;
  ExplainMediaAssetCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetMediaAssetRates`.
message GetMediaAssetRatesRequest {
