syntax = "proto3";

package acme.boxoffice.v1;

option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.boxoffice.v1";

// A reference to a box office sale of the boxoffice domain.
message BoxOfficeSaleRef {
  string box_office_sale_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a cash drawer of the boxoffice domain.
message CashDrawerRef {
  string cash_drawer_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a guest list of the boxoffice domain.
message GuestListRef {
  string guest_list_id = 1;
  string display_name = 2;
  string number = 3;
}
