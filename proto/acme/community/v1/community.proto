syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "CommunityProto";
option java_package = "com.acme.community.v1";

// Where a forum is in its lifecycle.
enum ForumStatus {
  FORUM_STATUS_UNSPECIFIED = 0;
  FORUM_STATUS_ACTIVE = 1;
  FORUM_STATUS_INACTIVE = 2;
}

// Where a post is in its lifecycle.
enum PostStatus {
  POST_STATUS_UNSPECIFIED = 0;
  POST_STATUS_DRAFT = 1;
  POST_STATUS_ISSUED = 2;
  POST_STATUS_APPROVED = 3;
  POST_STATUS_PAID = 4;
  POST_STATUS_VOID = 5;
}

// Where a badge is in its lifecycle.
enum BadgeStatus {
  BADGE_STATUS_UNSPECIFIED = 0;
  BADGE_STATUS_DRAFT = 1;
  BADGE_STATUS_ENABLED = 2;
  BADGE_STATUS_DISABLED = 3;
  BADGE_STATUS_RETIRED = 4;
}

// Where a moderation is in its lifecycle.
enum ModerationStatus {
  MODERATION_STATUS_UNSPECIFIED = 0;
  MODERATION_STATUS_NEW = 1;
  MODERATION_STATUS_OPEN = 2;
  MODERATION_STATUS_WAITING = 3;
  MODERATION_STATUS_RESOLVED = 4;
  MODERATION_STATUS_CLOSED = 5;
}

// A forum of the community domain.
message Forum {
  string forum_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated Forum children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  ForumStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The line of a post.
message PostLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  PostLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a post line.
message PostLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a post.
message PostCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a post.
message PostBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a post.
message PostAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A post of the community domain.
message Post {
  string post_id = 1;
  string number = 2;
  PostStatus status = 3;
  acme.personalization.v1.ProfileRef counterparty = 4;
  repeated PostLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    PostCardSettlement card = 8;
    PostBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated PostAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The condition of a badge.
message BadgeCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a badge.
message BadgeDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a badge.
message BadgeRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a badge.
message BadgeBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A badge of the community domain.
message Badge {
  string badge_id = 1;
  string name = 2;
  string description = 3;
  BadgeStatus status = 4;
  int32 priority = 5;
  repeated BadgeCondition conditions = 6;
  oneof action {
    BadgeDiscountAction discount = 7;
    BadgeRouteAction route = 8;
    BadgeBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The comment of a moderation.
message ModerationComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a moderation.
message ModerationSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a moderation.
message ModerationChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a moderation.
message ModerationStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A moderation of the community domain.
message Moderation {
  string moderation_id = 1;
  string subject = 2;
  ModerationStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ModerationComment comments = 7;
  ModerationSla sla = 8;
  oneof origin {
    acme.customers.v1.CustomerRef customer = 9;
    string external_reference = 10;
    ModerationChannelOrigin channel = 11;
  }
  repeated ModerationStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
