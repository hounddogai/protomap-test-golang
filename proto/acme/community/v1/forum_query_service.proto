syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ForumQueryServiceProto";
option java_package = "com.acme.community.v1";

// Answers read-only questions about forums, for screens and reports.
service ForumQueryService {
  // Returns a forum.
  rpc LookupForum(LookupForumRequest) returns (LookupForumResponse);

  // Lists forums a page at a time.
  rpc BrowseForums(BrowseForumsRequest) returns (BrowseForumsResponse);

  // Lists forums a page at a time.
  rpc FindForums(FindForumsRequest) returns (FindForumsResponse);

  // Streams every matching forum.
  rpc ExportForums(ExportForumsRequest) returns (stream ExportForumsResponse);

  // Summarizes a forum.
  rpc SummarizeForums(SummarizeForumsRequest) returns (SummarizeForumsResponse);

  // Returns a forum.
  rpc PeekForum(PeekForumRequest) returns (PeekForumResponse);
}

// The request of `LookupForum`.
message LookupForumRequest {
  acme.common.v1.RequestContext context = 1;
  string forum_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupForum`.
message LookupForumResponse {
  Forum forum = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseForums`.
message BrowseForumsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForumStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseForumsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseForums`.
message BrowseForumsResponse {
  repeated Forum forums = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindForums`.
message FindForumsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForumStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindForumsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindForums`.
message FindForumsResponse {
  repeated Forum forums = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportForums`.
message ExportForumsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForumStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportForumsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportForums`.
message ExportForumsResponse {
  Forum forum = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeForums`.
message SummarizeForumsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forum_id = 2;
  SummarizeForumsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeForums`.
message SummarizeForumsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekForum`.
message PeekForumRequest {
  acme.common.v1.RequestContext context = 1;
  string forum_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekForum`.
message PeekForumResponse {
  Forum forum = 1;
  acme.common.v1.OperationResult result = 2;
}
