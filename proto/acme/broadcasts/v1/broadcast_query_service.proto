syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "BroadcastQueryServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Answers read-only questions about broadcasts, for screens and reports.
service BroadcastQueryService {
  // Returns a broadcast.
  rpc LookupBroadcast(LookupBroadcastRequest) returns (LookupBroadcastResponse);

  // Lists broadcasts a page at a time.
  rpc BrowseBroadcasts(BrowseBroadcastsRequest) returns (BrowseBroadcastsResponse);

  // Counts broadcasts by status.
  rpc CountBroadcasts(CountBroadcastsRequest) returns (CountBroadcastsResponse);

  // Returns several broadcasts at once.
  rpc ResolveBroadcasts(ResolveBroadcastsRequest) returns (ResolveBroadcastsResponse);

  // Streams every matching broadcast.
  rpc ExportBroadcasts(ExportBroadcastsRequest) returns (stream ExportBroadcastsResponse);

  // Summarizes a broadcast.
  rpc SummarizeBroadcasts(SummarizeBroadcastsRequest) returns (SummarizeBroadcastsResponse);

  // Lists broadcasts a page at a time.
  rpc SuggestBroadcasts(SuggestBroadcastsRequest) returns (SuggestBroadcastsResponse);

  // Returns a broadcast.
  rpc PeekBroadcast(PeekBroadcastRequest) returns (PeekBroadcastResponse);
}

// The request of `LookupBroadcast`.
message LookupBroadcastRequest {
  acme.common.v1.RequestContext context = 1;
  string broadcast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupBroadcast`.
message LookupBroadcastResponse {
  Broadcast broadcast = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseBroadcasts`.
message BrowseBroadcastsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BroadcastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseBroadcastsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseBroadcasts`.
message BrowseBroadcastsResponse {
  repeated Broadcast broadcasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBroadcasts`.
message CountBroadcastsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BroadcastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBroadcastsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBroadcasts`.
message CountBroadcastsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveBroadcasts`.
message ResolveBroadcastsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string broadcast_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveBroadcasts`.
message ResolveBroadcastsResponse {
  repeated Broadcast broadcasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportBroadcasts`.
message ExportBroadcastsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BroadcastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportBroadcastsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportBroadcasts`.
message ExportBroadcastsResponse {
  Broadcast broadcast = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeBroadcasts`.
message SummarizeBroadcastsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string broadcast_id = 2;
  SummarizeBroadcastsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeBroadcasts`.
message SummarizeBroadcastsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestBroadcasts`.
message SuggestBroadcastsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BroadcastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestBroadcastsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestBroadcasts`.
message SuggestBroadcastsResponse {
  repeated Broadcast broadcasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekBroadcast`.
message PeekBroadcastRequest {
  acme.common.v1.RequestContext context = 1;
  string broadcast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekBroadcast`.
message PeekBroadcastResponse {
  Broadcast broadcast = 1;
  acme.common.v1.OperationResult result = 2;
}
