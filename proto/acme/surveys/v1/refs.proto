syntax = "proto3";

package acme.surveys.v1;

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.surveys.v1";

// A reference to a survey of the surveys domain.
message SurveyRef {
  string survey_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a survey response of the surveys domain.
message SurveyResponseRef {
  string survey_response_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a question of the surveys domain.
message QuestionRef {
  string question_id = 1;
  string display_name = 2;
  int64 version = 3;
}
