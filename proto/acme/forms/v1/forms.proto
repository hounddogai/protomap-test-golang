syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/forms/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormsProto";
option java_package = "com.acme.forms.v1";

// Where a form is in its lifecycle.
enum FormStatus {
  FORM_STATUS_UNSPECIFIED = 0;
  FORM_STATUS_DRAFT = 1;
  FORM_STATUS_ISSUED = 2;
  FORM_STATUS_APPROVED = 3;
  FORM_STATUS_PAID = 4;
  FORM_STATUS_VOID = 5;
}

// Where a form submission is in its lifecycle.
enum FormSubmissionStatus {
  FORM_SUBMISSION_STATUS_UNSPECIFIED = 0;
  FORM_SUBMISSION_STATUS_RECEIVED = 1;
  FORM_SUBMISSION_STATUS_PROCESSED = 2;
  FORM_SUBMISSION_STATUS_DISCARDED = 3;
}

// Where a form field is in its lifecycle.
enum FormFieldStatus {
  FORM_FIELD_STATUS_UNSPECIFIED = 0;
  FORM_FIELD_STATUS_DRAFT = 1;
  FORM_FIELD_STATUS_ENABLED = 2;
  FORM_FIELD_STATUS_DISABLED = 3;
  FORM_FIELD_STATUS_RETIRED = 4;
}

// The line of a form.
message FormLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  FormLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a form line.
message FormLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a form.
message FormCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a form.
message FormBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a form.
message FormAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A form of the forms domain.
message Form {
  string form_id = 1;
  string number = 2;
  FormStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated FormLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    FormCardSettlement card = 8;
    FormBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated FormAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The measurement of a form submission.
message FormSubmissionMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A form submission of the forms domain.
message FormSubmission {
  string form_submission_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  FormFieldRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated FormSubmissionMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of a form field.
message FormFieldCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a form field.
message FormFieldDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a form field.
message FormFieldRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a form field.
message FormFieldBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A form field of the forms domain.
message FormField {
  string form_field_id = 1;
  string name = 2;
  string description = 3;
  FormFieldStatus status = 4;
  int32 priority = 5;
  repeated FormFieldCondition conditions = 6;
  oneof action {
    FormFieldDiscountAction discount = 7;
    FormFieldRouteAction route = 8;
    FormFieldBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
