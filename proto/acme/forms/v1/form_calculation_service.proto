syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/forms/v1/forms.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormCalculationServiceProto";
option java_package = "com.acme.forms.v1";

// Computes the figures of a form, such as totals, taxes, and estimates.
service FormCalculationService {
  // Calculates a form.
  rpc CalculateForm(CalculateFormRequest) returns (CalculateFormResponse);

  // Estimates a form.
  rpc EstimateForm(EstimateFormRequest) returns (EstimateFormResponse);

  // Quotes a form.
  rpc QuoteForm(QuoteFormRequest) returns (QuoteFormResponse);

  // Compares a form.
  rpc CompareFormOptions(CompareFormOptionsRequest) returns (CompareFormOptionsResponse);

  // Recalculates a form.
  rpc RecalculateForms(RecalculateFormsRequest) returns (RecalculateFormsResponse);

  // Simulates a form.
  rpc SimulateForm(SimulateFormRequest) returns (SimulateFormResponse);

  // Explains a form.
  rpc ExplainFormCalculation(ExplainFormCalculationRequest) returns (ExplainFormCalculationResponse);

  // Returns a form.
  rpc GetFormRates(GetFormRatesRequest) returns (GetFormRatesResponse);
}

// The request of `CalculateForm`.
message CalculateFormRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string form_id = 2;
  Form form = 3;
  CalculateFormRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateForm`.
message CalculateFormResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFormResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Form form = 1;
  CalculateFormResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

