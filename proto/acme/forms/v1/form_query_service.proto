syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forms/v1/forms.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormQueryServiceProto";
option java_package = "com.acme.forms.v1";

// Answers read-only questions about forms, for screens and reports.
service FormQueryService {
  // Returns a form.
  rpc LookupForm(LookupFormRequest) returns (LookupFormResponse);

  // Lists forms a page at a time.
  rpc BrowseForms(BrowseFormsRequest) returns (BrowseFormsResponse);

  // Returns several forms at once.
  rpc ResolveForms(ResolveFormsRequest) returns (ResolveFormsResponse);

  // Streams every matching form.
  rpc ExportForms(ExportFormsRequest) returns (stream ExportFormsResponse);

  // Summarizes a form.
  rpc SummarizeForms(SummarizeFormsRequest) returns (SummarizeFormsResponse);

  // Lists forms a page at a time.
  rpc SuggestForms(SuggestFormsRequest) returns (SuggestFormsResponse);
}

// The request of `LookupForm`.
message LookupFormRequest {
  acme.common.v1.RequestContext context = 1;
  string form_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupForm`.
message LookupFormResponse {
  Form form = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseForms`.
message BrowseFormsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FormStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFormsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseForms`.
message BrowseFormsResponse {
  repeated Form forms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveForms`.
message ResolveFormsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string form_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveForms`.
message ResolveFormsResponse {
  repeated Form forms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportForms`.
message ExportFormsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FormStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFormsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportForms`.
message ExportFormsResponse {
  Form form = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeForms`.
message SummarizeFormsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string form_id = 2;
  SummarizeFormsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeForms`.
message SummarizeFormsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestForms`.
message SuggestFormsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FormStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestFormsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestForms`.
message SuggestFormsResponse {
  repeated Form forms = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
