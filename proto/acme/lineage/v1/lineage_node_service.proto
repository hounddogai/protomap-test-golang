syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeServiceProto";
option java_package = "com.acme.lineage.v1";

// Manages lineage nodes: creates, reads, changes, and lists them.
service LineageNodeService {
  // Creates a lineage node.
  rpc CreateLineageNode(CreateLineageNodeRequest) returns (CreateLineageNodeResponse);

  // Returns a lineage node.
  rpc GetLineageNode(GetLineageNodeRequest) returns (GetLineageNodeResponse);

  // Changes a lineage node.
  rpc UpdateLineageNode(UpdateLineageNodeRequest) returns (UpdateLineageNodeResponse);

  // Deletes a lineage node.
  rpc DeleteLineageNode(DeleteLineageNodeRequest) returns (DeleteLineageNodeResponse);

  // Lists lineage nodes a page at a time.
  rpc ListLineageNodes(ListLineageNodesRequest) returns (ListLineageNodesResponse);

  // Returns several lineage nodes at once.
  rpc BatchGetLineageNodes(BatchGetLineageNodesRequest) returns (BatchGetLineageNodesResponse);

  // Lists lineage nodes a page at a time.
  rpc SearchLineageNodes(SearchLineageNodesRequest) returns (SearchLineageNodesResponse);

  // Streams the changes of lineage nodes as they happen.
  rpc WatchLineageNodes(WatchLineageNodesRequest) returns (stream WatchLineageNodesResponse);

  // Takes a stream of lineage nodes and answers once at the end.
  rpc BatchCreateLineageNodes(stream BatchCreateLineageNodesRequest) returns (BatchCreateLineageNodesResponse);

  // Creates a lineage node.
  rpc CloneLineageNode(CloneLineageNodeRequest) returns (CloneLineageNodeResponse);
}

// The request of `CreateLineageNode`.
message CreateLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  LineageNode lineage_node = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateLineageNode`.
message CreateLineageNodeResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetLineageNode`.
message GetLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetLineageNode`.
message GetLineageNodeResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateLineageNode`.
message UpdateLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  LineageNode lineage_node = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateLineageNode`.
message UpdateLineageNodeResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteLineageNode`.
message DeleteLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteLineageNode`.
message DeleteLineageNodeResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListLineageNodes`.
message ListLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLineageNodesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLineageNodes`.
message ListLineageNodesResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetLineageNodes`.
message BatchGetLineageNodesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string lineage_node_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetLineageNodes`.
message BatchGetLineageNodesResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchLineageNodes`.
message SearchLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchLineageNodesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchLineageNodes`.
message SearchLineageNodesResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchLineageNodes`.
message WatchLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchLineageNodesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchLineageNodes`.
message WatchLineageNodesResponse {
  LineageNode lineage_node = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateLineageNodes`.
message BatchCreateLineageNodesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateLineageNodesRequest.StreamHeader header = 2;
    LineageNode record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateLineageNodes`.
message BatchCreateLineageNodesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string lineage_node_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateLineageNodesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneLineageNode`.
message CloneLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  LineageNode lineage_node = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneLineageNode`.
message CloneLineageNodeResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}
