syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/lineage/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageProto";
option java_package = "com.acme.lineage.v1";

// Where a lineage node is in its lifecycle.
enum LineageNodeStatus {
  LINEAGE_NODE_STATUS_UNSPECIFIED = 0;
  LINEAGE_NODE_STATUS_ACTIVE = 1;
  LINEAGE_NODE_STATUS_INACTIVE = 2;
}

// Where a lineage edge is in its lifecycle.
enum LineageEdgeStatus {
  LINEAGE_EDGE_STATUS_UNSPECIFIED = 0;
  LINEAGE_EDGE_STATUS_RECEIVED = 1;
  LINEAGE_EDGE_STATUS_PROCESSED = 2;
  LINEAGE_EDGE_STATUS_DISCARDED = 3;
}

// Where an impact is in its lifecycle.
enum ImpactStatus {
  IMPACT_STATUS_UNSPECIFIED = 0;
  IMPACT_STATUS_NEW = 1;
  IMPACT_STATUS_OPEN = 2;
  IMPACT_STATUS_WAITING = 3;
  IMPACT_STATUS_RESOLVED = 4;
  IMPACT_STATUS_CLOSED = 5;
}

// A lineage node of the lineage domain.
message LineageNode {
  string lineage_node_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated LineageNode children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  LineageNodeStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The measurement of a lineage edge.
message LineageEdgeMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A lineage edge of the lineage domain.
message LineageEdge {
  string lineage_edge_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  ImpactRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated LineageEdgeMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The comment of an impact.
message ImpactComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of an impact.
message ImpactSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of an impact.
message ImpactChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of an impact.
message ImpactStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// An impact of the lineage domain.
message Impact {
  string impact_id = 1;
  string subject = 2;
  ImpactStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ImpactComment comments = 7;
  ImpactSla sla = 8;
  oneof origin {
    acme.customers.v1.CustomerRef customer = 9;
    string external_reference = 10;
    ImpactChannelOrigin channel = 11;
  }
  repeated ImpactStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
