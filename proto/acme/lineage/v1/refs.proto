syntax = "proto3";

package acme.lineage.v1;

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.lineage.v1";

// A reference to a lineage node of the lineage domain.
message LineageNodeRef {
  string lineage_node_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a lineage edge of the lineage domain.
message LineageEdgeRef {
  string lineage_edge_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to an impact of the lineage domain.
message ImpactRef {
  string impact_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
