syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeQueryServiceProto";
option java_package = "com.acme.lineage.v1";

// Answers read-only questions about lineage nodes, for screens and reports.
service LineageNodeQueryService {
  // Returns a lineage node.
  rpc LookupLineageNode(LookupLineageNodeRequest) returns (LookupLineageNodeResponse);

  // Lists lineage nodes a page at a time.
  rpc BrowseLineageNodes(BrowseLineageNodesRequest) returns (BrowseLineageNodesResponse);

  // Counts lineage nodes by status.
  rpc CountLineageNodes(CountLineageNodesRequest) returns (CountLineageNodesResponse);

  // Returns several lineage nodes at once.
  rpc ResolveLineageNodes(ResolveLineageNodesRequest) returns (ResolveLineageNodesResponse);

  // Streams every matching lineage node.
  rpc ExportLineageNodes(ExportLineageNodesRequest) returns (stream ExportLineageNodesResponse);

  // Summarizes a lineage node.
  rpc SummarizeLineageNodes(SummarizeLineageNodesRequest) returns (SummarizeLineageNodesResponse);

  // Lists lineage nodes a page at a time.
  rpc SuggestLineageNodes(SuggestLineageNodesRequest) returns (SuggestLineageNodesResponse);

  // Returns a lineage node.
  rpc PeekLineageNode(PeekLineageNodeRequest) returns (PeekLineageNodeResponse);
}

// The request of `LookupLineageNode`.
message LookupLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupLineageNode`.
message LookupLineageNodeResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseLineageNodes`.
message BrowseLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseLineageNodesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseLineageNodes`.
message BrowseLineageNodesResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLineageNodes`.
message CountLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLineageNodesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLineageNodes`.
message CountLineageNodesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveLineageNodes`.
message ResolveLineageNodesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string lineage_node_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveLineageNodes`.
message ResolveLineageNodesResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportLineageNodes`.
message ExportLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportLineageNodesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportLineageNodes`.
message ExportLineageNodesResponse {
  LineageNode lineage_node = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeLineageNodes`.
message SummarizeLineageNodesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  SummarizeLineageNodesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeLineageNodes`.
message SummarizeLineageNodesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestLineageNodes`.
message SuggestLineageNodesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestLineageNodesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestLineageNodes`.
message SuggestLineageNodesResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekLineageNode`.
message PeekLineageNodeRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekLineageNode`.
message PeekLineageNodeResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}
