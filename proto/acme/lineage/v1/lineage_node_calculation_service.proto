syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeCalculationServiceProto";
option java_package = "com.acme.lineage.v1";

// Computes the figures of a lineage node, such as totals, taxes, and estimates.
service LineageNodeCalculationService {
  // Calculates a lineage node.
  rpc CalculateLineageNode(CalculateLineageNodeRequest) returns (CalculateLineageNodeResponse);

  // Estimates a lineage node.
  rpc EstimateLineageNode(EstimateLineageNodeRequest) returns (EstimateLineageNodeResponse);

  // Quotes a lineage node.
  rpc QuoteLineageNode(QuoteLineageNodeRequest) returns (QuoteLineageNodeResponse);

  // Recalculates a lineage node.
  rpc RecalculateLineageNodes(RecalculateLineageNodesRequest) returns (RecalculateLineageNodesResponse);

  // Simulates a lineage node.
  rpc SimulateLineageNode(SimulateLineageNodeRequest) returns (SimulateLineageNodeResponse);

  // Explains a lineage node.
  rpc ExplainLineageNodeCalculation(ExplainLineageNodeCalculationRequest) returns (ExplainLineageNodeCalculationResponse);

  // Returns a lineage node.
  rpc GetLineageNodeRates(GetLineageNodeRatesRequest) returns (GetLineageNodeRatesResponse);
}

// The request of `CalculateLineageNode`.
message CalculateLineageNodeRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  LineageNode lineage_node = 3;
  CalculateLineageNodeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLineageNode`.
message CalculateLineageNodeResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLineageNodeResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LineageNode lineage_node = 1;
  CalculateLineageNodeResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

