option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VideoVisitCalculationServiceProto";
option java_package = "com.acme.telehealth.v1";

// Computes the figures of a video visit, such as totals, taxes, and estimates.
service VideoVisitCalculationService {
  // Calculates a video visit.
  rpc CalculateVideoVisit(CalculateVideoVisitRequest) returns (CalculateVideoVisitResponse);

  // Estimates a video visit.
  rpc EstimateVideoVisit(EstimateVideoVisitRequest) returns (EstimateVideoVisitResponse);

  // Quotes a video visit.
  rpc QuoteVideoVisit(QuoteVideoVisitRequest) returns (QuoteVideoVisitResponse);

  // Compares a video visit.
  rpc CompareVideoVisitOptions(CompareVideoVisitOptionsRequest) returns (CompareVideoVisitOptionsResponse);

  // Recalculates a video visit.
  rpc RecalculateVideoVisits(RecalculateVideoVisitsRequest) returns (RecalculateVideoVisitsResponse);

  // Simulates a video visit.
  rpc SimulateVideoVisit(SimulateVideoVisitRequest) returns (SimulateVideoVisitResponse);

  // Explains a video visit.
  rpc ExplainVideoVisitCalculation(ExplainVideoVisitCalculationRequest) returns (ExplainVideoVisitCalculationResponse);

  // Returns a video visit.
  rpc GetVideoVisitRates(GetVideoVisitRatesRequest) returns (GetVideoVisitRatesResponse);
}

// The request of `CalculateVideoVisit`.
message CalculateVideoVisitRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string video_visit_id = 2;
  VideoVisit video_visit = 3;
  CalculateVideoVisitRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateVideoVisit`.
message CalculateVideoVisitResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateVideoVisitResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  VideoVisit video_visit = 1;
  CalculateVideoVisitResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

