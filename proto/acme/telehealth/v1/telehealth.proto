syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/refs.proto";
import "acme/telehealth/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "TelehealthProto";
option java_package = "com.acme.telehealth.v1";

// Where a video visit is in its lifecycle.
enum VideoVisitStatus {
  VIDEO_VISIT_STATUS_UNSPECIFIED = 0;
  VIDEO_VISIT_STATUS_TENTATIVE = 1;
  VIDEO_VISIT_STATUS_CONFIRMED = 2;
  VIDEO_VISIT_STATUS_CANCELLED = 3;
  VIDEO_VISIT_STATUS_COMPLETED = 4;
}

// Where a visit note is in its lifecycle.
enum VisitNoteStatus {
  VISIT_NOTE_STATUS_UNSPECIFIED = 0;
  VISIT_NOTE_STATUS_DRAFT = 1;
  VISIT_NOTE_STATUS_ISSUED = 2;
  VISIT_NOTE_STATUS_APPROVED = 3;
  VISIT_NOTE_STATUS_PAID = 4;
  VISIT_NOTE_STATUS_VOID = 5;
}

// Where a triage is in its lifecycle.
enum TriageStatus {
  TRIAGE_STATUS_UNSPECIFIED = 0;
  TRIAGE_STATUS_NEW = 1;
  TRIAGE_STATUS_OPEN = 2;
  TRIAGE_STATUS_WAITING = 3;
  TRIAGE_STATUS_RESOLVED = 4;
  TRIAGE_STATUS_CLOSED = 5;
}

// The participant of a video visit.
message VideoVisitParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a video visit.
message VideoVisitDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a video visit.
message VideoVisitWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A video visit of the telehealth domain.
message VideoVisit {
  string video_visit_id = 1;
  string title = 2;
  VideoVisitStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated VideoVisitParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    VideoVisitDailyRule daily = 7;
    VideoVisitWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a visit note.
message VisitNoteLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  VisitNoteLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a visit note line.
message VisitNoteLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a visit note.
message VisitNoteCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a visit note.
message VisitNoteBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a visit note.
message VisitNoteAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A visit note of the telehealth domain.
message VisitNote {
  string visit_note_id = 1;
  string number = 2;
  VisitNoteStatus status = 3;
  acme.patients.v1.PatientRef counterparty = 4;
  repeated VisitNoteLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    VisitNoteCardSettlement card = 8;
    VisitNoteBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated VisitNoteAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The comment of a triage.
message TriageComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a triage.
message TriageSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a triage.
message TriageChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a triage.
message TriageStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A triage of the telehealth domain.
message Triage {
  string triage_id = 1;
  string subject = 2;
  TriageStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated TriageComment comments = 7;
  TriageSla sla = 8;
  oneof origin {
    VideoVisitRef customer = 9;
    string external_reference = 10;
    TriageChannelOrigin channel = 11;
  }
  repeated TriageStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}
