syntax = "proto3";

package acme.configuration.v1;

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.configuration.v1";

// A reference to a config set of the configuration domain.
message ConfigSetRef {
  string config_set_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a config change of the configuration domain.
message ConfigChangeRef {
  string config_change_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to an environment of the configuration domain.
message EnvironmentRef {
  string environment_id = 1;
  string display_name = 2;
  string code = 3;
}
