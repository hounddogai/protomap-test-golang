syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigSetQueryServiceProto";
option java_package = "com.acme.configuration.v1";

// Answers read-only questions about config sets, for screens and reports.
service ConfigSetQueryService {
  // Returns a config set.
  rpc LookupConfigSet(LookupConfigSetRequest) returns (LookupConfigSetResponse);

  // Lists config sets a page at a time.
  rpc BrowseConfigSets(BrowseConfigSetsRequest) returns (BrowseConfigSetsResponse);

  // Counts config sets by status.
  rpc CountConfigSets(CountConfigSetsRequest) returns (CountConfigSetsResponse);

  // Returns several config sets at once.
  rpc ResolveConfigSets(ResolveConfigSetsRequest) returns (ResolveConfigSetsResponse);

  // Streams every matching config set.
  rpc ExportConfigSets(ExportConfigSetsRequest) returns (stream ExportConfigSetsResponse);

  // Summarizes a config set.
  rpc SummarizeConfigSets(SummarizeConfigSetsRequest) returns (SummarizeConfigSetsResponse);

  // Returns a config set.
  rpc PeekConfigSet(PeekConfigSetRequest) returns (PeekConfigSetResponse);
}

// The request of `LookupConfigSet`.
message LookupConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupConfigSet`.
message LookupConfigSetResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseConfigSets`.
message BrowseConfigSetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseConfigSetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseConfigSets`.
message BrowseConfigSetsResponse {
  repeated ConfigSet config_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConfigSets`.
message CountConfigSetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConfigSetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConfigSets`.
message CountConfigSetsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveConfigSets`.
message ResolveConfigSetsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string config_set_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveConfigSets`.
message ResolveConfigSetsResponse {
  repeated ConfigSet config_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportConfigSets`.
message ExportConfigSetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportConfigSetsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportConfigSets`.
message ExportConfigSetsResponse {
  ConfigSet config_set = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeConfigSets`.
message SummarizeConfigSetsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  SummarizeConfigSetsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeConfigSets`.
message SummarizeConfigSetsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekConfigSet`.
message PeekConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekConfigSet`.
message PeekConfigSetResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}
