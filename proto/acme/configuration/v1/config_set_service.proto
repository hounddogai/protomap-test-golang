syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigSetServiceProto";
option java_package = "com.acme.configuration.v1";

// Manages config sets: creates, reads, changes, and lists them.
service ConfigSetService {
  // Creates a config set.
  rpc CreateConfigSet(CreateConfigSetRequest) returns (CreateConfigSetResponse);

  // Returns a config set.
  rpc GetConfigSet(GetConfigSetRequest) returns (GetConfigSetResponse);

  // Changes a config set.
  rpc UpdateConfigSet(UpdateConfigSetRequest) returns (UpdateConfigSetResponse);

  // Deletes a config set.
  rpc DeleteConfigSet(DeleteConfigSetRequest) returns (DeleteConfigSetResponse);

  // Returns several config sets at once.
  rpc BatchGetConfigSets(BatchGetConfigSetsRequest) returns (BatchGetConfigSetsResponse);

  // Lists config sets a page at a time.
  rpc SearchConfigSets(SearchConfigSetsRequest) returns (SearchConfigSetsResponse);

  // Streams the changes of config sets as they happen.
  rpc WatchConfigSets(WatchConfigSetsRequest) returns (stream WatchConfigSetsResponse);

  // Takes a stream of config sets and answers once at the end.
  rpc BatchCreateConfigSets(stream BatchCreateConfigSetsRequest) returns (BatchCreateConfigSetsResponse);

  // Creates a config set.
  rpc CloneConfigSet(CloneConfigSetRequest) returns (CloneConfigSetResponse);
}

// The request of `CreateConfigSet`.
message CreateConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  ConfigSet config_set = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateConfigSet`.
message CreateConfigSetResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetConfigSet`.
message GetConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetConfigSet`.
message GetConfigSetResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateConfigSet`.
message UpdateConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  ConfigSet config_set = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateConfigSet`.
message UpdateConfigSetResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteConfigSet`.
message DeleteConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteConfigSet`.
message DeleteConfigSetResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `BatchGetConfigSets`.
message BatchGetConfigSetsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string config_set_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetConfigSets`.
message BatchGetConfigSetsResponse {
  repeated ConfigSet config_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchConfigSets`.
message SearchConfigSetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchConfigSetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchConfigSets`.
message SearchConfigSetsResponse {
  repeated ConfigSet config_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchConfigSets`.
message WatchConfigSetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchConfigSetsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchConfigSets`.
message WatchConfigSetsResponse {
  ConfigSet config_set = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateConfigSets`.
message BatchCreateConfigSetsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateConfigSetsRequest.StreamHeader header = 2;
    ConfigSet record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateConfigSets`.
message BatchCreateConfigSetsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string config_set_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateConfigSetsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneConfigSet`.
message CloneConfigSetRequest {
  acme.common.v1.RequestContext context = 1;
  ConfigSet config_set = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneConfigSet`.
message CloneConfigSetResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}
