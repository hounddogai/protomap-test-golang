syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/configuration/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigurationProto";
option java_package = "com.acme.configuration.v1";

// Where a config set is in its lifecycle.
enum ConfigSetStatus {
  CONFIG_SET_STATUS_UNSPECIFIED = 0;
  CONFIG_SET_STATUS_ACTIVE = 1;
  CONFIG_SET_STATUS_INACTIVE = 2;
}

// Where a config change is in its lifecycle.
enum ConfigChangeStatus {
  CONFIG_CHANGE_STATUS_UNSPECIFIED = 0;
  CONFIG_CHANGE_STATUS_RECEIVED = 1;
  CONFIG_CHANGE_STATUS_PROCESSED = 2;
  CONFIG_CHANGE_STATUS_DISCARDED = 3;
}

// Where an environment is in its lifecycle.
enum EnvironmentStatus {
  ENVIRONMENT_STATUS_UNSPECIFIED = 0;
  ENVIRONMENT_STATUS_PLANNED = 1;
  ENVIRONMENT_STATUS_AVAILABLE = 2;
  ENVIRONMENT_STATUS_RESERVED = 3;
  ENVIRONMENT_STATUS_RETIRED = 4;
}

// A config set of the configuration domain.
message ConfigSet {
  string config_set_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated ConfigSet children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  ConfigSetStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The measurement of a config change.
message ConfigChangeMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A config change of the configuration domain.
message ConfigChange {
  string config_change_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  ConfigSetRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated ConfigChangeMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The dimensions of an environment.
message EnvironmentDimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
  string unit = 5;
}

// The component of an environment.
message EnvironmentComponent {
  string component_id = 1;
  int64 quantity = 2;
  string description = 3;
}

// An environment of the configuration domain.
message Environment {
  string environment_id = 1;
  string code = 2;
  string name = 3;
  EnvironmentStatus status = 4;
  repeated string category_path = 5;
  EnvironmentDimensions dimensions = 6;
  oneof locator {
    acme.common.v1.GeoPoint geo = 7;
    acme.common.v1.PostalAddress address = 8;
    string facility_code = 9;
  }
  map<string, string> specs = 10;
  map<string, EnvironmentComponent> components = 11;
  acme.identity.v1.UserRef owner = 12;
  repeated string tags = 13;
  int64 capacity = 14;
  acme.common.v1.AuditInfo audit = 15;
}
