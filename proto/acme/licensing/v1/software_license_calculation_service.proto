syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "SoftwareLicenseCalculationServiceProto";
option java_package = "com.acme.licensing.v1";

// Computes the figures of a software license, such as totals, taxes, and estimates.
service SoftwareLicenseCalculationService {
  // Calculates a software license.
  rpc CalculateSoftwareLicense(CalculateSoftwareLicenseRequest) returns (CalculateSoftwareLicenseResponse);

  // Estimates a software license.
  rpc EstimateSoftwareLicense(EstimateSoftwareLicenseRequest) returns (EstimateSoftwareLicenseResponse);

  // Quotes a software license.
  rpc QuoteSoftwareLicense(QuoteSoftwareLicenseRequest) returns (QuoteSoftwareLicenseResponse);

  // Compares a software license.
  rpc CompareSoftwareLicenseOptions(CompareSoftwareLicenseOptionsRequest) returns (CompareSoftwareLicenseOptionsResponse);

  // Recalculates a software license.
  rpc RecalculateSoftwareLicenses(RecalculateSoftwareLicensesRequest) returns (RecalculateSoftwareLicensesResponse);

  // Simulates a software license.
  rpc SimulateSoftwareLicense(SimulateSoftwareLicenseRequest) returns (SimulateSoftwareLicenseResponse);

  // Explains a software license.
  rpc ExplainSoftwareLicenseCalculation(ExplainSoftwareLicenseCalculationRequest) returns (ExplainSoftwareLicenseCalculationResponse);

  // Returns a software license.
  rpc GetSoftwareLicenseRates(GetSoftwareLicenseRatesRequest) returns (GetSoftwareLicenseRatesResponse);
}

// The request of `CalculateSoftwareLicense`.
message CalculateSoftwareLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string software_license_id = 2;
  SoftwareLicense software_license = 3;
  CalculateSoftwareLicenseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSoftwareLicense`.
message CalculateSoftwareLicenseResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSoftwareLicenseResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SoftwareLicense software_license = 1;
  CalculateSoftwareLicenseResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

