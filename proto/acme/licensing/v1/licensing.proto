syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/licensing/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "LicensingProto";
option java_package = "com.acme.licensing.v1";

// Where a software license is in its lifecycle.
enum SoftwareLicenseStatus {
  SOFTWARE_LICENSE_STATUS_UNSPECIFIED = 0;
  SOFTWARE_LICENSE_STATUS_PENDING = 1;
  SOFTWARE_LICENSE_STATUS_OPEN = 2;
  SOFTWARE_LICENSE_STATUS_FROZEN = 3;
  SOFTWARE_LICENSE_STATUS_CLOSED = 4;
}

// Where an entitlement is in its lifecycle.
enum EntitlementStatus {
  ENTITLEMENT_STATUS_UNSPECIFIED = 0;
  ENTITLEMENT_STATUS_DRAFT = 1;
  ENTITLEMENT_STATUS_ENABLED = 2;
  ENTITLEMENT_STATUS_DISABLED = 3;
  ENTITLEMENT_STATUS_RETIRED = 4;
}

// Where a license assignment is in its lifecycle.
enum LicenseAssignmentStatus {
  LICENSE_ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  LICENSE_ASSIGNMENT_STATUS_DRAFT = 1;
  LICENSE_ASSIGNMENT_STATUS_ISSUED = 2;
  LICENSE_ASSIGNMENT_STATUS_APPROVED = 3;
  LICENSE_ASSIGNMENT_STATUS_PAID = 4;
  LICENSE_ASSIGNMENT_STATUS_VOID = 5;
}

// The limit of a software license.
message SoftwareLicenseLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a software license.
message SoftwareLicenseCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a software license.
message SoftwareLicenseBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A software license of the licensing domain.
message SoftwareLicense {
  string software_license_id = 1;
  LicenseAssignmentRef holder = 2;
  SoftwareLicenseStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated SoftwareLicenseLimit limits = 7;
  oneof funding {
    SoftwareLicenseCardFunding card = 8;
    SoftwareLicenseBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The condition of an entitlement.
message EntitlementCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of an entitlement.
message EntitlementDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of an entitlement.
message EntitlementRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of an entitlement.
message EntitlementBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// An entitlement of the licensing domain.
message Entitlement {
  string entitlement_id = 1;
  string name = 2;
  string description = 3;
  EntitlementStatus status = 4;
  int32 priority = 5;
  repeated EntitlementCondition conditions = 6;
  oneof action {
    EntitlementDiscountAction discount = 7;
    EntitlementRouteAction route = 8;
    EntitlementBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of a license assignment.
message LicenseAssignmentLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  LicenseAssignmentLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a license assignment line.
message LicenseAssignmentLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a license assignment.
message LicenseAssignmentCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a license assignment.
message LicenseAssignmentBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a license assignment.
message LicenseAssignmentAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A license assignment of the licensing domain.
message LicenseAssignment {
  string license_assignment_id = 1;
  string number = 2;
  LicenseAssignmentStatus status = 3;
  EntitlementRef counterparty = 4;
  repeated LicenseAssignmentLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    LicenseAssignmentCardSettlement card = 8;
    LicenseAssignmentBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated LicenseAssignmentAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
