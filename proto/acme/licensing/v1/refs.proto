syntax = "proto3";

package acme.licensing.v1;

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.licensing.v1";

// A reference to a software license of the licensing domain.
message SoftwareLicenseRef {
  string software_license_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to an entitlement of the licensing domain.
message EntitlementRef {
  string entitlement_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a license assignment of the licensing domain.
message LicenseAssignmentRef {
  string license_assignment_id = 1;
  string display_name = 2;
  string number = 3;
}
