syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceOverrideApprovalServiceProto";
option java_package = "com.acme.pricing.v1";

// Routes price overrides through approval, with escalation and delegation.
service PriceOverrideApprovalService {
  // Submits a price override.
  rpc SubmitPriceOverride(SubmitPriceOverrideRequest) returns (SubmitPriceOverrideResponse);

  // Approves a price override.
  rpc ApprovePriceOverride(ApprovePriceOverrideRequest) returns (ApprovePriceOverrideResponse);

  // Rejects a price override.
  rpc RejectPriceOverride(RejectPriceOverrideRequest) returns (RejectPriceOverrideResponse);

  // Escalates a price override.
  rpc EscalatePriceOverride(EscalatePriceOverrideRequest) returns (EscalatePriceOverrideResponse);

  // Delegates a price override.
  rpc DelegatePriceOverrideApproval(DelegatePriceOverrideApprovalRequest) returns (DelegatePriceOverrideApprovalResponse);

  // Returns a price override.
  rpc GetPriceOverrideApprovalStatus(GetPriceOverrideApprovalStatusRequest) returns (GetPriceOverrideApprovalStatusResponse);

  // Comments a price override.
  rpc CommentPriceOverrideApproval(CommentPriceOverrideApprovalRequest) returns (CommentPriceOverrideApprovalResponse);
}

// The request of `SubmitPriceOverride`.
message SubmitPriceOverrideRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_override_id = 2;
  PriceOverride price_override = 3;
  SubmitPriceOverrideRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPriceOverride`.
message SubmitPriceOverrideResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceOverride price_override = 1;
  SubmitPriceOverrideResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

