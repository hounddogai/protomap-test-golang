syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceQuoteWorkflowServiceProto";
option java_package = "com.acme.pricing.v1";

// Runs the long-lived workflow that takes a price quote from start to finish.
service PriceQuoteWorkflowService {
  // Starts a price quote.
  rpc StartPriceQuoteWorkflow(StartPriceQuoteWorkflowRequest) returns (StartPriceQuoteWorkflowResponse);

  // Advances a price quote.
  rpc AdvancePriceQuoteWorkflow(AdvancePriceQuoteWorkflowRequest) returns (AdvancePriceQuoteWorkflowResponse);

  // Cancels a price quote.
  rpc CancelPriceQuoteWorkflow(CancelPriceQuoteWorkflowRequest) returns (CancelPriceQuoteWorkflowResponse);

  // Retrys a price quote.
  rpc RetryPriceQuoteWorkflow(RetryPriceQuoteWorkflowRequest) returns (RetryPriceQuoteWorkflowResponse);

  // Pauses a price quote.
  rpc PausePriceQuoteWorkflow(PausePriceQuoteWorkflowRequest) returns (PausePriceQuoteWorkflowResponse);

  // Lists price quotes a page at a time.
  rpc ListPriceQuoteWorkflows(ListPriceQuoteWorkflowsRequest) returns (ListPriceQuoteWorkflowsResponse);

  // Signals a price quote.
  rpc SignalPriceQuoteWorkflow(SignalPriceQuoteWorkflowRequest) returns (SignalPriceQuoteWorkflowResponse);
}

// The request of `StartPriceQuoteWorkflow`.
message StartPriceQuoteWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_quote_id = 2;
  PriceQuote price_quote = 3;
  StartPriceQuoteWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPriceQuoteWorkflow`.
message StartPriceQuoteWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceQuote price_quote = 1;
  StartPriceQuoteWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

