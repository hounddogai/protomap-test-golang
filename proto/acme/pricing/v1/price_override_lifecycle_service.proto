    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_override_id = 2;
  PriceOverride price_override = 3;
  SchedulePriceOverrideExpiryRequest.Details details = 4;
  string reason = 5;
