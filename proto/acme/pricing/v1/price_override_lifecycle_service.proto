syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceOverrideLifecycleServiceProto";
option java_package = "com.acme.pricing.v1";

// Moves a price override between the states of its lifecycle.
service PriceOverrideLifecycleService {
  // Activates a price override.
  rpc ActivatePriceOverride(ActivatePriceOverrideRequest) returns (ActivatePriceOverrideResponse);

  // Suspends a price override.
  rpc SuspendPriceOverride(SuspendPriceOverrideRequest) returns (SuspendPriceOverrideResponse);

  // Renews a price override.
  rpc RenewPriceOverride(RenewPriceOverrideRequest) returns (RenewPriceOverrideResponse);

  // Expires a price override.
  rpc ExpirePriceOverride(ExpirePriceOverrideRequest) returns (ExpirePriceOverrideResponse);

  // Returns a price override.
  rpc GetPriceOverrideLifecycle(GetPriceOverrideLifecycleRequest) returns (GetPriceOverrideLifecycleResponse);

  // Schedules a price override.
  rpc SchedulePriceOverrideExpiry(SchedulePriceOverrideExpiryRequest) returns (SchedulePriceOverrideExpiryResponse);
}

// The request of `ActivatePriceOverride`.
message ActivatePriceOverrideRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string price_override_id = 2;
  ActivatePriceOverrideRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePriceOverride`.
message ActivatePriceOverrideResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceOverride price_override = 1;
  ActivatePriceOverrideResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

