option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceOverrideWorkflowServiceProto";
option java_package = "com.acme.pricing.v1";

// Runs the long-lived workflow that takes a price override from start to finish.
service PriceOverrideWorkflowService {
  // Starts a price override.
  rpc StartPriceOverrideWorkflow(StartPriceOverrideWorkflowRequest) returns (StartPriceOverrideWorkflowResponse);

  // Advances a price override.
  rpc AdvancePriceOverrideWorkflow(AdvancePriceOverrideWorkflowRequest) returns (AdvancePriceOverrideWorkflowResponse);

  // Cancels a price override.
  rpc CancelPriceOverrideWorkflow(CancelPriceOverrideWorkflowRequest) returns (CancelPriceOverrideWorkflowResponse);

  // Retrys a price override.
  rpc RetryPriceOverrideWorkflow(RetryPriceOverrideWorkflowRequest) returns (RetryPriceOverrideWorkflowResponse);

  // Pauses a price override.
  rpc PausePriceOverrideWorkflow(PausePriceOverrideWorkflowRequest) returns (PausePriceOverrideWorkflowResponse);

  // Resumes a price override.
  rpc ResumePriceOverrideWorkflow(ResumePriceOverrideWorkflowRequest) returns (ResumePriceOverrideWorkflowResponse);

  // Returns a price override.
  rpc InspectPriceOverrideWorkflow(InspectPriceOverrideWorkflowRequest) returns (InspectPriceOverrideWorkflowResponse);

  // Lists price overrides a page at a time.
  rpc ListPriceOverrideWorkflows(ListPriceOverrideWorkflowsRequest) returns (ListPriceOverrideWorkflowsResponse);

  // Signals a price override.
  rpc SignalPriceOverrideWorkflow(SignalPriceOverrideWorkflowRequest) returns (SignalPriceOverrideWorkflowResponse);
}

// The request of `StartPriceOverrideWorkflow`.
message StartPriceOverrideWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_override_id = 2;
  PriceOverride price_override = 3;
  StartPriceOverrideWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPriceOverrideWorkflow`.
message StartPriceOverrideWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceOverride price_override = 1;
  StartPriceOverrideWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

