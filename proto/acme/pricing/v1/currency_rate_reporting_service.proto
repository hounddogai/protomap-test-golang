syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "CurrencyRateReportingServiceProto";
option java_package = "com.acme.pricing.v1";

// Builds and schedules reports about currency rates.
service CurrencyRateReportingService {
  // Generates a currency rate.
  rpc GenerateCurrencyRateReport(GenerateCurrencyRateReportRequest) returns (GenerateCurrencyRateReportResponse);

  // Returns a currency rate.
  rpc FetchCurrencyRateReport(FetchCurrencyRateReportRequest) returns (FetchCurrencyRateReportResponse);

  // Schedules a currency rate.
  rpc ScheduleCurrencyRateReport(ScheduleCurrencyRateReportRequest) returns (ScheduleCurrencyRateReportResponse);

  // Streams the changes of currency rates as they happen.
  rpc StreamCurrencyRateMetrics(StreamCurrencyRateMetricsRequest) returns (stream StreamCurrencyRateMetricsResponse);

  // Lists currency rates a page at a time.
  rpc ListCurrencyRateReports(ListCurrencyRateReportsRequest) returns (ListCurrencyRateReportsResponse);

  // Shares a currency rate.
  rpc ShareCurrencyRateReport(ShareCurrencyRateReportRequest) returns (ShareCurrencyRateReportResponse);

  // Counts currency rates by status.
  rpc CountCurrencyRateTotals(CountCurrencyRateTotalsRequest) returns (CountCurrencyRateTotalsResponse);

  // Deletes a currency rate.
  rpc DeleteCurrencyRateReport(DeleteCurrencyRateReportRequest) returns (DeleteCurrencyRateReportResponse);
}

// The request of `GenerateCurrencyRateReport`.
message GenerateCurrencyRateReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  GenerateCurrencyRateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateCurrencyRateReport`.
message GenerateCurrencyRateReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchCurrencyRateReport`.
message FetchCurrencyRateReportRequest {
  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchCurrencyRateReport`.
message FetchCurrencyRateReportResponse {
  CurrencyRate currency_rate = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleCurrencyRateReport`.
message ScheduleCurrencyRateReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  ScheduleCurrencyRateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleCurrencyRateReport`.
message ScheduleCurrencyRateReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamCurrencyRateMetrics`.
message StreamCurrencyRateMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CurrencyRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamCurrencyRateMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamCurrencyRateMetrics`.
message StreamCurrencyRateMetricsResponse {
  CurrencyRate currency_rate = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCurrencyRateReports`.
message ListCurrencyRateReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CurrencyRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCurrencyRateReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCurrencyRateReports`.
message ListCurrencyRateReportsResponse {
  repeated CurrencyRate currency_rates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareCurrencyRateReport`.
message ShareCurrencyRateReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  ShareCurrencyRateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareCurrencyRateReport`.
message ShareCurrencyRateReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CurrencyRate currency_rate = 1;
  ShareCurrencyRateReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCurrencyRateTotals`.
message CountCurrencyRateTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CurrencyRateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCurrencyRateTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCurrencyRateTotals`.
message CountCurrencyRateTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteCurrencyRateReport`.
message DeleteCurrencyRateReportRequest {
  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCurrencyRateReport`.
message DeleteCurrencyRateReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
