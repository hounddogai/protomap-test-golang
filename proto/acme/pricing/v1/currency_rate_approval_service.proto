syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "CurrencyRateApprovalServiceProto";
option java_package = "com.acme.pricing.v1";

// Routes currency rates through approval, with escalation and delegation.
service CurrencyRateApprovalService {
  // Submits a currency rate.
  rpc SubmitCurrencyRate(SubmitCurrencyRateRequest) returns (SubmitCurrencyRateResponse);

  // Approves a currency rate.
  rpc ApproveCurrencyRate(ApproveCurrencyRateRequest) returns (ApproveCurrencyRateResponse);

  // Rejects a currency rate.
  rpc RejectCurrencyRate(RejectCurrencyRateRequest) returns (RejectCurrencyRateResponse);

  // Escalates a currency rate.
  rpc EscalateCurrencyRate(EscalateCurrencyRateRequest) returns (EscalateCurrencyRateResponse);

  // Recalls a currency rate.
  rpc RecallCurrencyRate(RecallCurrencyRateRequest) returns (RecallCurrencyRateResponse);

  // Returns a currency rate.
  rpc GetCurrencyRateApprovalStatus(GetCurrencyRateApprovalStatusRequest) returns (GetCurrencyRateApprovalStatusResponse);

  // Comments a currency rate.
  rpc CommentCurrencyRateApproval(CommentCurrencyRateApprovalRequest) returns (CommentCurrencyRateApprovalResponse);
}

// The request of `SubmitCurrencyRate`.
message SubmitCurrencyRateRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  CurrencyRate currency_rate = 3;
  SubmitCurrencyRateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCurrencyRate`.
message SubmitCurrencyRateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CurrencyRate currency_rate = 1;
  SubmitCurrencyRateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

