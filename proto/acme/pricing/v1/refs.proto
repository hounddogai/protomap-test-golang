syntax = "proto3";

package acme.pricing.v1;

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.pricing.v1";

// A reference to a price list of the pricing domain.
message PriceListRef {
  string price_list_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a price quote of the pricing domain.
message PriceQuoteRef {
  string price_quote_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a price override of the pricing domain.
message PriceOverrideRef {
  string price_override_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a currency rate of the pricing domain.
message CurrencyRateRef {
  string currency_rate_id = 1;
  string display_name = 2;
  string kind = 3;
}
