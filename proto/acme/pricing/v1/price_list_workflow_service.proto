// The request of `InspectPriceListWorkflow`.
message InspectPriceListWorkflowRequest {
  acme.common.v1.RequestContext context = 1;
  string price_list_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectPriceListWorkflow`.
message InspectPriceListWorkflowResponse {
  PriceList price_list = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListPriceListWorkflows`.
message ListPriceListWorkflowsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PriceListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPriceListWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPriceListWorkflows`.
message ListPriceListWorkflowsResponse {
  repeated PriceList price_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
