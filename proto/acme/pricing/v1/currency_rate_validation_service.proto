syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "CurrencyRateValidationServiceProto";
option java_package = "com.acme.pricing.v1";

// Checks currency rates against the rules before anything acts on them.
service CurrencyRateValidationService {
  // Validates a currency rate.
  rpc ValidateCurrencyRate(ValidateCurrencyRateRequest) returns (ValidateCurrencyRateResponse);

  // Previews a currency rate.
  rpc PreviewCurrencyRate(PreviewCurrencyRateRequest) returns (PreviewCurrencyRateResponse);

  // Checks a currency rate.
  rpc CheckCurrencyRateEligibility(CheckCurrencyRateEligibilityRequest) returns (CheckCurrencyRateEligibilityResponse);

  // Normalizes a currency rate.
  rpc NormalizeCurrencyRate(NormalizeCurrencyRateRequest) returns (NormalizeCurrencyRateResponse);

  // Explains a currency rate.
  rpc ExplainCurrencyRateDecision(ExplainCurrencyRateDecisionRequest) returns (ExplainCurrencyRateDecisionResponse);

  // Scores a currency rate.
  rpc ScoreCurrencyRate(ScoreCurrencyRateRequest) returns (ScoreCurrencyRateResponse);

  // Lints a currency rate.
  rpc LintCurrencyRates(LintCurrencyRatesRequest) returns (LintCurrencyRatesResponse);
}

// The request of `ValidateCurrencyRate`.
message ValidateCurrencyRateRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string currency_rate_id = 2;
  CurrencyRate currency_rate = 3;
  ValidateCurrencyRateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCurrencyRate`.
message ValidateCurrencyRateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CurrencyRate currency_rate = 1;
  ValidateCurrencyRateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

