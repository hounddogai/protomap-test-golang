syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceListApprovalServiceProto";
option java_package = "com.acme.pricing.v1";

// Routes price lists through approval, with escalation and delegation.
service PriceListApprovalService {
  // Submits a price list.
  rpc SubmitPriceList(SubmitPriceListRequest) returns (SubmitPriceListResponse);

  // Approves a price list.
  rpc ApprovePriceList(ApprovePriceListRequest) returns (ApprovePriceListResponse);

  // Escalates a price list.
  rpc EscalatePriceList(EscalatePriceListRequest) returns (EscalatePriceListResponse);

  // Lists price lists a page at a time.
  rpc ListPendingPriceLists(ListPendingPriceListsRequest) returns (ListPendingPriceListsResponse);

  // Delegates a price list.
  rpc DelegatePriceListApproval(DelegatePriceListApprovalRequest) returns (DelegatePriceListApprovalResponse);

  // Recalls a price list.
  rpc RecallPriceList(RecallPriceListRequest) returns (RecallPriceListResponse);

  // Returns a price list.
  rpc GetPriceListApprovalStatus(GetPriceListApprovalStatusRequest) returns (GetPriceListApprovalStatusResponse);

  // Comments a price list.
  rpc CommentPriceListApproval(CommentPriceListApprovalRequest) returns (CommentPriceListApprovalResponse);
}

// The request of `SubmitPriceList`.
message SubmitPriceListRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_list_id = 2;
  PriceList price_list = 3;
  SubmitPriceListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPriceList`.
message SubmitPriceListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceList price_list = 1;
  SubmitPriceListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApprovePriceList`.
message ApprovePriceListRequest {
