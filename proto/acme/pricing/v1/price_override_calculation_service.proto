syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceOverrideCalculationServiceProto";
option java_package = "com.acme.pricing.v1";

// Computes the figures of a price override, such as totals, taxes, and estimates.
service PriceOverrideCalculationService {
  // Calculates a price override.
  rpc CalculatePriceOverride(CalculatePriceOverrideRequest) returns (CalculatePriceOverrideResponse);

  // Estimates a price override.
  rpc EstimatePriceOverride(EstimatePriceOverrideRequest) returns (EstimatePriceOverrideResponse);

  // Quotes a price override.
  rpc QuotePriceOverride(QuotePriceOverrideRequest) returns (QuotePriceOverrideResponse);

  // Compares a price override.
  rpc ComparePriceOverrideOptions(ComparePriceOverrideOptionsRequest) returns (ComparePriceOverrideOptionsResponse);

  // Recalculates a price override.
  rpc RecalculatePriceOverrides(RecalculatePriceOverridesRequest) returns (RecalculatePriceOverridesResponse);

  // Simulates a price override.
  rpc SimulatePriceOverride(SimulatePriceOverrideRequest) returns (SimulatePriceOverrideResponse);

  // Explains a price override.
  rpc ExplainPriceOverrideCalculation(ExplainPriceOverrideCalculationRequest) returns (ExplainPriceOverrideCalculationResponse);

  // Returns a price override.
  rpc GetPriceOverrideRates(GetPriceOverrideRatesRequest) returns (GetPriceOverrideRatesResponse);
}

// The request of `CalculatePriceOverride`.
message CalculatePriceOverrideRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_override_id = 2;
  PriceOverride price_override = 3;
  CalculatePriceOverrideRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePriceOverride`.
message CalculatePriceOverrideResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePriceOverrideResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  PriceOverride price_override = 1;
  CalculatePriceOverrideResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

