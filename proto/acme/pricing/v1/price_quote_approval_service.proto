syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceQuoteApprovalServiceProto";
option java_package = "com.acme.pricing.v1";

// Routes price quotes through approval, with escalation and delegation.
service PriceQuoteApprovalService {
  // Submits a price quote.
  rpc SubmitPriceQuote(SubmitPriceQuoteRequest) returns (SubmitPriceQuoteResponse);

  // Approves a price quote.
  rpc ApprovePriceQuote(ApprovePriceQuoteRequest) returns (ApprovePriceQuoteResponse);

  // Rejects a price quote.
  rpc RejectPriceQuote(RejectPriceQuoteRequest) returns (RejectPriceQuoteResponse);

  // Escalates a price quote.
  rpc EscalatePriceQuote(EscalatePriceQuoteRequest) returns (EscalatePriceQuoteResponse);

  // Lists price quotes a page at a time.
  rpc ListPendingPriceQuotes(ListPendingPriceQuotesRequest) returns (ListPendingPriceQuotesResponse);

  // Delegates a price quote.
  rpc DelegatePriceQuoteApproval(DelegatePriceQuoteApprovalRequest) returns (DelegatePriceQuoteApprovalResponse);

  // Recalls a price quote.
  rpc RecallPriceQuote(RecallPriceQuoteRequest) returns (RecallPriceQuoteResponse);

  // Returns a price quote.
  rpc GetPriceQuoteApprovalStatus(GetPriceQuoteApprovalStatusRequest) returns (GetPriceQuoteApprovalStatusResponse);

  // Comments a price quote.
  rpc CommentPriceQuoteApproval(CommentPriceQuoteApprovalRequest) returns (CommentPriceQuoteApprovalResponse);
}

// The request of `SubmitPriceQuote`.
message SubmitPriceQuoteRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_quote_id = 2;
  PriceQuote price_quote = 3;
  SubmitPriceQuoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPriceQuote`.
message SubmitPriceQuoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceQuote price_quote = 1;
  SubmitPriceQuoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

