syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceQuoteCalculationServiceProto";
option java_package = "com.acme.pricing.v1";

// Computes the figures of a price quote, such as totals, taxes, and estimates.
service PriceQuoteCalculationService {
  // Calculates a price quote.
  rpc CalculatePriceQuote(CalculatePriceQuoteRequest) returns (CalculatePriceQuoteResponse);

  // Estimates a price quote.
  rpc EstimatePriceQuote(EstimatePriceQuoteRequest) returns (EstimatePriceQuoteResponse);

  // Quotes a price quote.
  rpc QuotePriceQuote(QuotePriceQuoteRequest) returns (QuotePriceQuoteResponse);

  // Compares a price quote.
  rpc ComparePriceQuoteOptions(ComparePriceQuoteOptionsRequest) returns (ComparePriceQuoteOptionsResponse);

  // Recalculates a price quote.
  rpc RecalculatePriceQuotes(RecalculatePriceQuotesRequest) returns (RecalculatePriceQuotesResponse);

  // Simulates a price quote.
  rpc SimulatePriceQuote(SimulatePriceQuoteRequest) returns (SimulatePriceQuoteResponse);

  // Explains a price quote.
  rpc ExplainPriceQuoteCalculation(ExplainPriceQuoteCalculationRequest) returns (ExplainPriceQuoteCalculationResponse);
}

// The request of `CalculatePriceQuote`.
message CalculatePriceQuoteRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_quote_id = 2;
  PriceQuote price_quote = 3;
  CalculatePriceQuoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePriceQuote`.
message CalculatePriceQuoteResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePriceQuoteResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  PriceQuote price_quote = 1;
  CalculatePriceQuoteResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

