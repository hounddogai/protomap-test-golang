syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceListValidationServiceProto";
option java_package = "com.acme.pricing.v1";

// Checks price lists against the rules before anything acts on them.
service PriceListValidationService {
  // Validates a price list.
  rpc ValidatePriceList(ValidatePriceListRequest) returns (ValidatePriceListResponse);

  // Previews a price list.
  rpc PreviewPriceList(PreviewPriceListRequest) returns (PreviewPriceListResponse);

  // Checks a price list.
  rpc CheckPriceListEligibility(CheckPriceListEligibilityRequest) returns (CheckPriceListEligibilityResponse);

  // Normalizes a price list.
  rpc NormalizePriceList(NormalizePriceListRequest) returns (NormalizePriceListResponse);

  // Explains a price list.
  rpc ExplainPriceListDecision(ExplainPriceListDecisionRequest) returns (ExplainPriceListDecisionResponse);

  // Scores a price list.
  rpc ScorePriceList(ScorePriceListRequest) returns (ScorePriceListResponse);

  // Lints a price list.
  rpc LintPriceLists(LintPriceListsRequest) returns (LintPriceListsResponse);

  // Returns a price list.
  rpc GetPriceListRules(GetPriceListRulesRequest) returns (GetPriceListRulesResponse);
}

// The request of `ValidatePriceList`.
message ValidatePriceListRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string price_list_id = 2;
  PriceList price_list = 3;
  ValidatePriceListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePriceList`.
message ValidatePriceListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PriceList price_list = 1;
  ValidatePriceListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

