syntax = "proto3";

package acme.pricing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pricing/v1/pricing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pricing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pricing/v1;pricingv1";
option java_multiple_files = true;
option java_outer_classname = "PriceListQueryServiceProto";
option java_package = "com.acme.pricing.v1";

// Answers read-only questions about price lists, for screens and reports.
service PriceListQueryService {
  // Returns a price list.
  rpc LookupPriceList(LookupPriceListRequest) returns (LookupPriceListResponse);

  // Lists price lists a page at a time.
  rpc BrowsePriceLists(BrowsePriceListsRequest) returns (BrowsePriceListsResponse);

  // Lists price lists a page at a time.
  rpc FindPriceLists(FindPriceListsRequest) returns (FindPriceListsResponse);

  // Counts price lists by status.
  rpc CountPriceLists(CountPriceListsRequest) returns (CountPriceListsResponse);

  // Returns several price lists at once.
  rpc ResolvePriceLists(ResolvePriceListsRequest) returns (ResolvePriceListsResponse);

  // Summarizes a price list.
  rpc SummarizePriceLists(SummarizePriceListsRequest) returns (SummarizePriceListsResponse);

  // Lists price lists a page at a time.
  rpc SuggestPriceLists(SuggestPriceListsRequest) returns (SuggestPriceListsResponse);

  // Returns a price list.
  rpc PeekPriceList(PeekPriceListRequest) returns (PeekPriceListResponse);
}

// The request of `LookupPriceList`.
message LookupPriceListRequest {
  acme.common.v1.RequestContext context = 1;
  string price_list_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPriceList`.
message LookupPriceListResponse {
  PriceList price_list = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePriceLists`.
message BrowsePriceListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PriceListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePriceListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePriceLists`.
message BrowsePriceListsResponse {
  repeated PriceList price_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPriceLists`.
message FindPriceListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PriceListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPriceListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPriceLists`.
message FindPriceListsResponse {
  repeated PriceList price_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPriceLists`.
message CountPriceListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PriceListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPriceListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPriceLists`.
message CountPriceListsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePriceLists`.
message ResolvePriceListsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string price_list_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePriceLists`.
message ResolvePriceListsResponse {
  repeated PriceList price_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizePriceLists`.
message SummarizePriceListsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string price_list_id = 2;
  SummarizePriceListsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePriceLists`.
message SummarizePriceListsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPriceLists`.
message SuggestPriceListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PriceListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPriceListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPriceLists`.
message SuggestPriceListsResponse {
  repeated PriceList price_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPriceList`.
message PeekPriceListRequest {
  acme.common.v1.RequestContext context = 1;
  string price_list_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPriceList`.
message PeekPriceListResponse {
  PriceList price_list = 1;
  acme.common.v1.OperationResult result = 2;
}
