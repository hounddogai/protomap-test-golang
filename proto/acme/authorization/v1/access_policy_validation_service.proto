syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "AccessPolicyValidationServiceProto";
option java_package = "com.acme.authorization.v1";

// Checks access policies against the rules before anything acts on them.
service AccessPolicyValidationService {
  // Validates an access policy.
  rpc ValidateAccessPolicy(ValidateAccessPolicyRequest) returns (ValidateAccessPolicyResponse);

  // Previews an access policy.
  rpc PreviewAccessPolicy(PreviewAccessPolicyRequest) returns (PreviewAccessPolicyResponse);

  // Checks an access policy.
  rpc CheckAccessPolicyEligibility(CheckAccessPolicyEligibilityRequest) returns (CheckAccessPolicyEligibilityResponse);

  // Normalizes an access policy.
  rpc NormalizeAccessPolicy(NormalizeAccessPolicyRequest) returns (NormalizeAccessPolicyResponse);

  // Explains an access policy.
  rpc ExplainAccessPolicyDecision(ExplainAccessPolicyDecisionRequest) returns (ExplainAccessPolicyDecisionResponse);

  // Scores an access policy.
  rpc ScoreAccessPolicy(ScoreAccessPolicyRequest) returns (ScoreAccessPolicyResponse);

  // Lints an access policy.
  rpc LintAccessPolicies(LintAccessPoliciesRequest) returns (LintAccessPoliciesResponse);

  // Returns an access policy.
  rpc GetAccessPolicyRules(GetAccessPolicyRulesRequest) returns (GetAccessPolicyRulesResponse);
}

// The request of `ValidateAccessPolicy`.
message ValidateAccessPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  AccessPolicy access_policy = 3;
  ValidateAccessPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAccessPolicy`.
message ValidateAccessPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessPolicy access_policy = 1;
  ValidateAccessPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

