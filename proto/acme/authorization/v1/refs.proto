syntax = "proto3";

package acme.authorization.v1;

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.authorization.v1";

// A reference to an access policy of the authorization domain.
message AccessPolicyRef {
  string access_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a role binding of the authorization domain.
message RoleBindingRef {
  string role_binding_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a permission check of the authorization domain.
message PermissionCheckRef {
  string permission_check_id = 1;
  string display_name = 2;
  string kind = 3;
}
