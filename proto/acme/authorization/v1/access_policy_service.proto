syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "AccessPolicyServiceProto";
option java_package = "com.acme.authorization.v1";

// Manages access policies: creates, reads, changes, and lists them.
service AccessPolicyService {
  // Creates an access policy.
  rpc CreateAccessPolicy(CreateAccessPolicyRequest) returns (CreateAccessPolicyResponse);

  // Returns an access policy.
  rpc GetAccessPolicy(GetAccessPolicyRequest) returns (GetAccessPolicyResponse);

  // Changes an access policy.
  rpc UpdateAccessPolicy(UpdateAccessPolicyRequest) returns (UpdateAccessPolicyResponse);

  // Deletes an access policy.
  rpc DeleteAccessPolicy(DeleteAccessPolicyRequest) returns (DeleteAccessPolicyResponse);

  // Lists access policies a page at a time.
  rpc ListAccessPolicies(ListAccessPoliciesRequest) returns (ListAccessPoliciesResponse);

  // Returns several access policies at once.
  rpc BatchGetAccessPolicies(BatchGetAccessPoliciesRequest) returns (BatchGetAccessPoliciesResponse);

  // Streams the changes of access policies as they happen.
  rpc WatchAccessPolicies(WatchAccessPoliciesRequest) returns (stream WatchAccessPoliciesResponse);

  // Takes a stream of access policies and answers once at the end.
  rpc BatchCreateAccessPolicies(stream BatchCreateAccessPoliciesRequest) returns (BatchCreateAccessPoliciesResponse);

  // Creates an access policy.
  rpc CloneAccessPolicy(CloneAccessPolicyRequest) returns (CloneAccessPolicyResponse);
}

// The request of `CreateAccessPolicy`.
message CreateAccessPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  AccessPolicy access_policy = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateAccessPolicy`.
message CreateAccessPolicyResponse {
  AccessPolicy access_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetAccessPolicy`.
message GetAccessPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAccessPolicy`.
message GetAccessPolicyResponse {
  AccessPolicy access_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateAccessPolicy`.
message UpdateAccessPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  AccessPolicy access_policy = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateAccessPolicy`.
message UpdateAccessPolicyResponse {
  AccessPolicy access_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteAccessPolicy`.
message DeleteAccessPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteAccessPolicy`.
message DeleteAccessPolicyResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListAccessPolicies`.
message ListAccessPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AccessPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAccessPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAccessPolicies`.
message ListAccessPoliciesResponse {
  repeated AccessPolicy access_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetAccessPolicies`.
message BatchGetAccessPoliciesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string access_policy_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetAccessPolicies`.
message BatchGetAccessPoliciesResponse {
  repeated AccessPolicy access_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchAccessPolicies`.
message WatchAccessPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AccessPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchAccessPoliciesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchAccessPolicies`.
message WatchAccessPoliciesResponse {
  AccessPolicy access_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateAccessPolicies`.
message BatchCreateAccessPoliciesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateAccessPoliciesRequest.StreamHeader header = 2;
    AccessPolicy record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateAccessPolicies`.
message BatchCreateAccessPoliciesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string access_policy_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateAccessPoliciesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneAccessPolicy`.
message CloneAccessPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  AccessPolicy access_policy = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneAccessPolicy`.
message CloneAccessPolicyResponse {
  AccessPolicy access_policy = 1;
  acme.common.v1.OperationResult result = 2;
}
