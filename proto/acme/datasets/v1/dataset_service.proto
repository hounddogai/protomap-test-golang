syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DatasetServiceProto";
option java_package = "com.acme.datasets.v1";

// Manages datasets: creates, reads, changes, and lists them.
service DatasetService {
  // Creates a dataset.
  rpc CreateDataset(CreateDatasetRequest) returns (CreateDatasetResponse);

  // Returns a dataset.
  rpc GetDataset(GetDatasetRequest) returns (GetDatasetResponse);

  // Changes a dataset.
  rpc UpdateDataset(UpdateDatasetRequest) returns (UpdateDatasetResponse);

  // Deletes a dataset.
  rpc DeleteDataset(DeleteDatasetRequest) returns (DeleteDatasetResponse);

  // Lists datasets a page at a time.
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);

  // Returns several datasets at once.
  rpc BatchGetDatasets(BatchGetDatasetsRequest) returns (BatchGetDatasetsResponse);

  // Lists datasets a page at a time.
  rpc SearchDatasets(SearchDatasetsRequest) returns (SearchDatasetsResponse);

  // Streams the changes of datasets as they happen.
  rpc WatchDatasets(WatchDatasetsRequest) returns (stream WatchDatasetsResponse);

  // Takes a stream of datasets and answers once at the end.
  rpc BatchCreateDatasets(stream BatchCreateDatasetsRequest) returns (BatchCreateDatasetsResponse);

  // Creates a dataset.
  rpc CloneDataset(CloneDatasetRequest) returns (CloneDatasetResponse);
}

// The request of `CreateDataset`.
message CreateDatasetRequest {
  acme.common.v1.RequestContext context = 1;
  Dataset dataset = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateDataset`.
message CreateDatasetResponse {
  Dataset dataset = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetDataset`.
message GetDatasetRequest {
  acme.common.v1.RequestContext context = 1;
  string dataset_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDataset`.
message GetDatasetResponse {
  Dataset dataset = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateDataset`.
message UpdateDatasetRequest {
  acme.common.v1.RequestContext context = 1;
  Dataset dataset = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateDataset`.
message UpdateDatasetResponse {
  Dataset dataset = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteDataset`.
message DeleteDatasetRequest {
  acme.common.v1.RequestContext context = 1;
  string dataset_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDataset`.
message DeleteDatasetResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListDatasets`.
message ListDatasetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DatasetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDatasetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDatasets`.
message ListDatasetsResponse {
  repeated Dataset datasets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetDatasets`.
message BatchGetDatasetsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string dataset_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetDatasets`.
message BatchGetDatasetsResponse {
  repeated Dataset datasets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchDatasets`.
message SearchDatasetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DatasetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchDatasetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchDatasets`.
message SearchDatasetsResponse {
  repeated Dataset datasets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchDatasets`.
message WatchDatasetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DatasetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchDatasetsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchDatasets`.
message WatchDatasetsResponse {
  Dataset dataset = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateDatasets`.
message BatchCreateDatasetsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateDatasetsRequest.StreamHeader header = 2;
    Dataset record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateDatasets`.
message BatchCreateDatasetsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string dataset_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateDatasetsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneDataset`.
message CloneDatasetRequest {
  acme.common.v1.RequestContext context = 1;
  Dataset dataset = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneDataset`.
message CloneDatasetResponse {
  Dataset dataset = 1;
  acme.common.v1.OperationResult result = 2;
}
