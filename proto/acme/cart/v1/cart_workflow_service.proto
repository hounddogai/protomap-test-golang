syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartWorkflowServiceProto";
option java_package = "com.acme.cart.v1";

// Runs the long-lived workflow that takes a cart from start to finish.
service CartWorkflowService {
  // Starts a cart.
  rpc StartCartWorkflow(StartCartWorkflowRequest) returns (StartCartWorkflowResponse);

  // Advances a cart.
  rpc AdvanceCartWorkflow(AdvanceCartWorkflowRequest) returns (AdvanceCartWorkflowResponse);

  // Retrys a cart.
  rpc RetryCartWorkflow(RetryCartWorkflowRequest) returns (RetryCartWorkflowResponse);

  // Pauses a cart.
  rpc PauseCartWorkflow(PauseCartWorkflowRequest) returns (PauseCartWorkflowResponse);

  // Resumes a cart.
  rpc ResumeCartWorkflow(ResumeCartWorkflowRequest) returns (ResumeCartWorkflowResponse);

  // Lists carts a page at a time.
  rpc ListCartWorkflows(ListCartWorkflowsRequest) returns (ListCartWorkflowsResponse);

  // Signals a cart.
  rpc SignalCartWorkflow(SignalCartWorkflowRequest) returns (SignalCartWorkflowResponse);
}

// The request of `StartCartWorkflow`.
message StartCartWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cart_id = 2;
  Cart cart = 3;
  StartCartWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCartWorkflow`.
message StartCartWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cart cart = 1;
  StartCartWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

