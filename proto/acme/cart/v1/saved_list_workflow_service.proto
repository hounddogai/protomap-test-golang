syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "SavedListWorkflowServiceProto";
option java_package = "com.acme.cart.v1";

// Runs the long-lived workflow that takes a saved list from start to finish.
service SavedListWorkflowService {
  // Starts a saved list.
  rpc StartSavedListWorkflow(StartSavedListWorkflowRequest) returns (StartSavedListWorkflowResponse);

  // Advances a saved list.
  rpc AdvanceSavedListWorkflow(AdvanceSavedListWorkflowRequest) returns (AdvanceSavedListWorkflowResponse);

  // Cancels a saved list.
  rpc CancelSavedListWorkflow(CancelSavedListWorkflowRequest) returns (CancelSavedListWorkflowResponse);

  // Retrys a saved list.
  rpc RetrySavedListWorkflow(RetrySavedListWorkflowRequest) returns (RetrySavedListWorkflowResponse);

  // Pauses a saved list.
  rpc PauseSavedListWorkflow(PauseSavedListWorkflowRequest) returns (PauseSavedListWorkflowResponse);

  // Resumes a saved list.
  rpc ResumeSavedListWorkflow(ResumeSavedListWorkflowRequest) returns (ResumeSavedListWorkflowResponse);

  // Returns a saved list.
  rpc InspectSavedListWorkflow(InspectSavedListWorkflowRequest) returns (InspectSavedListWorkflowResponse);

  // Lists saved lists a page at a time.
  rpc ListSavedListWorkflows(ListSavedListWorkflowsRequest) returns (ListSavedListWorkflowsResponse);

  // Signals a saved list.
  rpc SignalSavedListWorkflow(SignalSavedListWorkflowRequest) returns (SignalSavedListWorkflowResponse);
}

// The request of `StartSavedListWorkflow`.
message StartSavedListWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  SavedList saved_list = 3;
  StartSavedListWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSavedListWorkflow`.
message StartSavedListWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SavedList saved_list = 1;
  StartSavedListWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

