syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartRuleLifecycleServiceProto";
option java_package = "com.acme.cart.v1";

// Moves a cart rule between the states of its lifecycle.
service CartRuleLifecycleService {
  // Activates a cart rule.
  rpc ActivateCartRule(ActivateCartRuleRequest) returns (ActivateCartRuleResponse);

  // Suspends a cart rule.
  rpc SuspendCartRule(SuspendCartRuleRequest) returns (SuspendCartRuleResponse);

  // Terminates a cart rule.
  rpc TerminateCartRule(TerminateCartRuleRequest) returns (TerminateCartRuleResponse);

  // Renews a cart rule.
  rpc RenewCartRule(RenewCartRuleRequest) returns (RenewCartRuleResponse);

  // Expires a cart rule.
  rpc ExpireCartRule(ExpireCartRuleRequest) returns (ExpireCartRuleResponse);

  // Returns a cart rule.
  rpc GetCartRuleLifecycle(GetCartRuleLifecycleRequest) returns (GetCartRuleLifecycleResponse);
}

// The request of `ActivateCartRule`.
message ActivateCartRuleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cart_rule_id = 2;
  ActivateCartRuleRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCartRule`.
message ActivateCartRuleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CartRule cart_rule = 1;
  ActivateCartRuleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

