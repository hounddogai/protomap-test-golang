syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "SavedListCalculationServiceProto";
option java_package = "com.acme.cart.v1";

// Computes the figures of a saved list, such as totals, taxes, and estimates.
service SavedListCalculationService {
  // Calculates a saved list.
  rpc CalculateSavedList(CalculateSavedListRequest) returns (CalculateSavedListResponse);

  // Estimates a saved list.
  rpc EstimateSavedList(EstimateSavedListRequest) returns (EstimateSavedListResponse);

  // Quotes a saved list.
  rpc QuoteSavedList(QuoteSavedListRequest) returns (QuoteSavedListResponse);

  // Compares a saved list.
  rpc CompareSavedListOptions(CompareSavedListOptionsRequest) returns (CompareSavedListOptionsResponse);

  // Recalculates a saved list.
  rpc RecalculateSavedLists(RecalculateSavedListsRequest) returns (RecalculateSavedListsResponse);

  // Simulates a saved list.
  rpc SimulateSavedList(SimulateSavedListRequest) returns (SimulateSavedListResponse);

  // Explains a saved list.
  rpc ExplainSavedListCalculation(ExplainSavedListCalculationRequest) returns (ExplainSavedListCalculationResponse);

  // Returns a saved list.
  rpc GetSavedListRates(GetSavedListRatesRequest) returns (GetSavedListRatesResponse);
}

// The request of `CalculateSavedList`.
message CalculateSavedListRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  SavedList saved_list = 3;
  CalculateSavedListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSavedList`.
message CalculateSavedListResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSavedListResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SavedList saved_list = 1;
  CalculateSavedListResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

