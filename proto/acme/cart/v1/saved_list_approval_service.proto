syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "SavedListApprovalServiceProto";
option java_package = "com.acme.cart.v1";

// Routes saved lists through approval, with escalation and delegation.
service SavedListApprovalService {
  // Submits a saved list.
  rpc SubmitSavedList(SubmitSavedListRequest) returns (SubmitSavedListResponse);

  // Approves a saved list.
  rpc ApproveSavedList(ApproveSavedListRequest) returns (ApproveSavedListResponse);

  // Rejects a saved list.
  rpc RejectSavedList(RejectSavedListRequest) returns (RejectSavedListResponse);

  // Escalates a saved list.
  rpc EscalateSavedList(EscalateSavedListRequest) returns (EscalateSavedListResponse);

  // Lists saved lists a page at a time.
  rpc ListPendingSavedLists(ListPendingSavedListsRequest) returns (ListPendingSavedListsResponse);

  // Delegates a saved list.
  rpc DelegateSavedListApproval(DelegateSavedListApprovalRequest) returns (DelegateSavedListApprovalResponse);

  // Recalls a saved list.
  rpc RecallSavedList(RecallSavedListRequest) returns (RecallSavedListResponse);

  // Returns a saved list.
  rpc GetSavedListApprovalStatus(GetSavedListApprovalStatusRequest) returns (GetSavedListApprovalStatusResponse);

  // Comments a saved list.
  rpc CommentSavedListApproval(CommentSavedListApprovalRequest) returns (CommentSavedListApprovalResponse);
}

// The request of `SubmitSavedList`.
message SubmitSavedListRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  SavedList saved_list = 3;
  SubmitSavedListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSavedList`.
message SubmitSavedListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SavedList saved_list = 1;
  SubmitSavedListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

