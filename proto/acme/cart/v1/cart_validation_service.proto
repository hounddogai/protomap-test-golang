syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartValidationServiceProto";
option java_package = "com.acme.cart.v1";

// Checks carts against the rules before anything acts on them.
service CartValidationService {
  // Validates a cart.
  rpc ValidateCart(ValidateCartRequest) returns (ValidateCartResponse);

  // Previews a cart.
  rpc PreviewCart(PreviewCartRequest) returns (PreviewCartResponse);

  // Checks a cart.
  rpc CheckCartEligibility(CheckCartEligibilityRequest) returns (CheckCartEligibilityResponse);

  // Normalizes a cart.
  rpc NormalizeCart(NormalizeCartRequest) returns (NormalizeCartResponse);

  // Scores a cart.
  rpc ScoreCart(ScoreCartRequest) returns (ScoreCartResponse);

  // Lints a cart.
  rpc LintCarts(LintCartsRequest) returns (LintCartsResponse);
}

// The request of `ValidateCart`.
message ValidateCartRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cart_id = 2;
  Cart cart = 3;
  ValidateCartRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCart`.
message ValidateCartResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cart cart = 1;
  ValidateCartResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

