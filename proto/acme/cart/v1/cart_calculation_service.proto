syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartCalculationServiceProto";
option java_package = "com.acme.cart.v1";

// Computes the figures of a cart, such as totals, taxes, and estimates.
service CartCalculationService {
  // Calculates a cart.
  rpc CalculateCart(CalculateCartRequest) returns (CalculateCartResponse);

  // Estimates a cart.
  rpc EstimateCart(EstimateCartRequest) returns (EstimateCartResponse);

  // Quotes a cart.
  rpc QuoteCart(QuoteCartRequest) returns (QuoteCartResponse);

  // Compares a cart.
  rpc CompareCartOptions(CompareCartOptionsRequest) returns (CompareCartOptionsResponse);

  // Recalculates a cart.
  rpc RecalculateCarts(RecalculateCartsRequest) returns (RecalculateCartsResponse);

  // Simulates a cart.
  rpc SimulateCart(SimulateCartRequest) returns (SimulateCartResponse);

  // Explains a cart.
  rpc ExplainCartCalculation(ExplainCartCalculationRequest) returns (ExplainCartCalculationResponse);

  // Returns a cart.
  rpc GetCartRates(GetCartRatesRequest) returns (GetCartRatesResponse);
}

// The request of `CalculateCart`.
message CalculateCartRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cart_id = 2;
  Cart cart = 3;
  CalculateCartRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCart`.
message CalculateCartResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCartResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Cart cart = 1;
  CalculateCartResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

