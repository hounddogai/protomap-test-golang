syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartServiceProto";
option java_package = "com.acme.cart.v1";

// Manages carts: creates, reads, changes, and lists them.
service CartService {
  // Creates a cart.
  rpc CreateCart(CreateCartRequest) returns (CreateCartResponse);

  // Returns a cart.
  rpc GetCart(GetCartRequest) returns (GetCartResponse);

  // Deletes a cart.
  rpc DeleteCart(DeleteCartRequest) returns (DeleteCartResponse);

  // Lists carts a page at a time.
  rpc ListCarts(ListCartsRequest) returns (ListCartsResponse);

  // Returns several carts at once.
  rpc BatchGetCarts(BatchGetCartsRequest) returns (BatchGetCartsResponse);

  // Lists carts a page at a time.
  rpc SearchCarts(SearchCartsRequest) returns (SearchCartsResponse);

  // Streams the changes of carts as they happen.
  rpc WatchCarts(WatchCartsRequest) returns (stream WatchCartsResponse);

  // Takes a stream of carts and answers once at the end.
  rpc BatchCreateCarts(stream BatchCreateCartsRequest) returns (BatchCreateCartsResponse);

  // Creates a cart.
  rpc CloneCart(CloneCartRequest) returns (CloneCartResponse);
}

// The request of `CreateCart`.
message CreateCartRequest {
  acme.common.v1.RequestContext context = 1;
  Cart cart = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateCart`.
message CreateCartResponse {
  Cart cart = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetCart`.
message GetCartRequest {
  acme.common.v1.RequestContext context = 1;
  string cart_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCart`.
message GetCartResponse {
  Cart cart = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteCart`.
message DeleteCartRequest {
  acme.common.v1.RequestContext context = 1;
  string cart_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCart`.
message DeleteCartResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListCarts`.
message ListCartsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CartStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCartsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCarts`.
message ListCartsResponse {
  repeated Cart carts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetCarts`.
message BatchGetCartsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string cart_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetCarts`.
message BatchGetCartsResponse {
  repeated Cart carts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchCarts`.
message SearchCartsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CartStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchCartsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchCarts`.
message SearchCartsResponse {
  repeated Cart carts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchCarts`.
message WatchCartsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CartStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchCartsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchCarts`.
message WatchCartsResponse {
  Cart cart = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateCarts`.
message BatchCreateCartsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateCartsRequest.StreamHeader header = 2;
    Cart record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateCarts`.
message BatchCreateCartsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string cart_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateCartsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneCart`.
message CloneCartRequest {
  acme.common.v1.RequestContext context = 1;
  Cart cart = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneCart`.
message CloneCartResponse {
  Cart cart = 1;
  acme.common.v1.OperationResult result = 2;
}
