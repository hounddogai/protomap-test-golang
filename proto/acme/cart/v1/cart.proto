syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartProto";
option java_package = "com.acme.cart.v1";

// Where a cart is in its lifecycle.
enum CartStatus {
  CART_STATUS_UNSPECIFIED = 0;
  CART_STATUS_DRAFT = 1;
  CART_STATUS_ISSUED = 2;
  CART_STATUS_APPROVED = 3;
  CART_STATUS_PAID = 4;
  CART_STATUS_VOID = 5;
}

// Where a saved list is in its lifecycle.
enum SavedListStatus {
  SAVED_LIST_STATUS_UNSPECIFIED = 0;
  SAVED_LIST_STATUS_DRAFT = 1;
  SAVED_LIST_STATUS_ISSUED = 2;
  SAVED_LIST_STATUS_APPROVED = 3;
  SAVED_LIST_STATUS_PAID = 4;
  SAVED_LIST_STATUS_VOID = 5;
}

// Where a cart rule is in its lifecycle.
enum CartRuleStatus {
  CART_RULE_STATUS_UNSPECIFIED = 0;
  CART_RULE_STATUS_DRAFT = 1;
  CART_RULE_STATUS_ENABLED = 2;
  CART_RULE_STATUS_DISABLED = 3;
  CART_RULE_STATUS_RETIRED = 4;
}

// The line of a cart.
message CartLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  CartLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a cart line.
message CartLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a cart.
message CartCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a cart.
message CartBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a cart.
message CartAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A cart of the cart domain.
message Cart {
  string cart_id = 1;
  string number = 2;
  CartStatus status = 3;
  SavedListRef counterparty = 4;
  repeated CartLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    CartCardSettlement card = 8;
    CartBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated CartAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The line of a saved list.
message SavedListLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  SavedListLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a saved list line.
message SavedListLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a saved list.
message SavedListCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a saved list.
message SavedListBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a saved list.
message SavedListAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A saved list of the cart domain.
message SavedList {
  string saved_list_id = 1;
  string number = 2;
  SavedListStatus status = 3;
  CartRuleRef counterparty = 4;
  repeated SavedListLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    SavedListCardSettlement card = 8;
    SavedListBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated SavedListAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The condition of a cart rule.
message CartRuleCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a cart rule.
message CartRuleDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a cart rule.
message CartRuleRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a cart rule.
message CartRuleBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A cart rule of the cart domain.
message CartRule {
  string cart_rule_id = 1;
  string name = 2;
  string description = 3;
  CartRuleStatus status = 4;
  int32 priority = 5;
  repeated CartRuleCondition conditions = 6;
  oneof action {
    CartRuleDiscountAction discount = 7;
    CartRuleRouteAction route = 8;
    CartRuleBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
