// The request of `GetSavedListRules`.
message GetSavedListRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSavedListRules`.
message GetSavedListRulesResponse {
  SavedList saved_list = 1;
  acme.common.v1.OperationResult result = 2;
}
