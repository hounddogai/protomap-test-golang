syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "SavedListValidationServiceProto";
option java_package = "com.acme.cart.v1";

// Checks saved lists against the rules before anything acts on them.
service SavedListValidationService {
  // Validates a saved list.
  rpc ValidateSavedList(ValidateSavedListRequest) returns (ValidateSavedListResponse);

  // Previews a saved list.
  rpc PreviewSavedList(PreviewSavedListRequest) returns (PreviewSavedListResponse);

  // Normalizes a saved list.
  rpc NormalizeSavedList(NormalizeSavedListRequest) returns (NormalizeSavedListResponse);

  // Explains a saved list.
  rpc ExplainSavedListDecision(ExplainSavedListDecisionRequest) returns (ExplainSavedListDecisionResponse);

  // Scores a saved list.
  rpc ScoreSavedList(ScoreSavedListRequest) returns (ScoreSavedListResponse);

  // Lints a saved list.
  rpc LintSavedLists(LintSavedListsRequest) returns (LintSavedListsResponse);

  // Returns a saved list.
  rpc GetSavedListRules(GetSavedListRulesRequest) returns (GetSavedListRulesResponse);
}

// The request of `ValidateSavedList`.
message ValidateSavedListRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  SavedList saved_list = 3;
  ValidateSavedListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSavedList`.
message ValidateSavedListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SavedList saved_list = 1;
  ValidateSavedListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

