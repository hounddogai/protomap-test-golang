syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "CartRuleCalculationServiceProto";
option java_package = "com.acme.cart.v1";

// Computes the figures of a cart rule, such as totals, taxes, and estimates.
service CartRuleCalculationService {
  // Calculates a cart rule.
  rpc CalculateCartRule(CalculateCartRuleRequest) returns (CalculateCartRuleResponse);

  // Estimates a cart rule.
  rpc EstimateCartRule(EstimateCartRuleRequest) returns (EstimateCartRuleResponse);

  // Quotes a cart rule.
  rpc QuoteCartRule(QuoteCartRuleRequest) returns (QuoteCartRuleResponse);

  // Compares a cart rule.
  rpc CompareCartRuleOptions(CompareCartRuleOptionsRequest) returns (CompareCartRuleOptionsResponse);

  // Simulates a cart rule.
  rpc SimulateCartRule(SimulateCartRuleRequest) returns (SimulateCartRuleResponse);

  // Explains a cart rule.
  rpc ExplainCartRuleCalculation(ExplainCartRuleCalculationRequest) returns (ExplainCartRuleCalculationResponse);
}

// The request of `CalculateCartRule`.
message CalculateCartRuleRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cart_rule_id = 2;
  CartRule cart_rule = 3;
  CalculateCartRuleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCartRule`.
message CalculateCartRuleResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCartRuleResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CartRule cart_rule = 1;
  CalculateCartRuleResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

