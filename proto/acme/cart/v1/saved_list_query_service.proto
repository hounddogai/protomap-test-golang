syntax = "proto3";

package acme.cart.v1;

import "acme/cart/v1/cart.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Cart.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/cart/v1;cartv1";
option java_multiple_files = true;
option java_outer_classname = "SavedListQueryServiceProto";
option java_package = "com.acme.cart.v1";

// Answers read-only questions about saved lists, for screens and reports.
service SavedListQueryService {
  // Returns a saved list.
  rpc LookupSavedList(LookupSavedListRequest) returns (LookupSavedListResponse);

  // Lists saved lists a page at a time.
  rpc BrowseSavedLists(BrowseSavedListsRequest) returns (BrowseSavedListsResponse);

  // Lists saved lists a page at a time.
  rpc FindSavedLists(FindSavedListsRequest) returns (FindSavedListsResponse);

  // Counts saved lists by status.
  rpc CountSavedLists(CountSavedListsRequest) returns (CountSavedListsResponse);

  // Returns several saved lists at once.
  rpc ResolveSavedLists(ResolveSavedListsRequest) returns (ResolveSavedListsResponse);

  // Summarizes a saved list.
  rpc SummarizeSavedLists(SummarizeSavedListsRequest) returns (SummarizeSavedListsResponse);

  // Lists saved lists a page at a time.
  rpc SuggestSavedLists(SuggestSavedListsRequest) returns (SuggestSavedListsResponse);

  // Returns a saved list.
  rpc PeekSavedList(PeekSavedListRequest) returns (PeekSavedListResponse);
}

// The request of `LookupSavedList`.
message LookupSavedListRequest {
  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSavedList`.
message LookupSavedListResponse {
  SavedList saved_list = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSavedLists`.
message BrowseSavedListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SavedListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSavedListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSavedLists`.
message BrowseSavedListsResponse {
  repeated SavedList saved_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSavedLists`.
message FindSavedListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SavedListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSavedListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSavedLists`.
message FindSavedListsResponse {
  repeated SavedList saved_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSavedLists`.
message CountSavedListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SavedListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSavedListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSavedLists`.
message CountSavedListsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSavedLists`.
message ResolveSavedListsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string saved_list_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSavedLists`.
message ResolveSavedListsResponse {
  repeated SavedList saved_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeSavedLists`.
message SummarizeSavedListsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  SummarizeSavedListsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSavedLists`.
message SummarizeSavedListsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSavedLists`.
message SuggestSavedListsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SavedListStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSavedListsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSavedLists`.
message SuggestSavedListsResponse {
  repeated SavedList saved_lists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSavedList`.
message PeekSavedListRequest {
  acme.common.v1.RequestContext context = 1;
  string saved_list_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSavedList`.
message PeekSavedListResponse {
  SavedList saved_list = 1;
  acme.common.v1.OperationResult result = 2;
}
