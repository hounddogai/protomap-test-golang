syntax = "proto3";

package acme.compliance.v1;

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.compliance.v1";

// A reference to a compliance case of the compliance domain.
message ComplianceCaseRef {
  string compliance_case_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a control of the compliance domain.
message ControlRef {
  string control_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an attestation of the compliance domain.
message AttestationRef {
  string attestation_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a sanction of the compliance domain.
message SanctionRef {
  string sanction_id = 1;
  string display_name = 2;
  string path = 3;
}
