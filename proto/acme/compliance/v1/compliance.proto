syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/compliance/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceProto";
option java_package = "com.acme.compliance.v1";

// Where a compliance case is in its lifecycle.
enum ComplianceCaseStatus {
  COMPLIANCE_CASE_STATUS_UNSPECIFIED = 0;
  COMPLIANCE_CASE_STATUS_NEW = 1;
  COMPLIANCE_CASE_STATUS_OPEN = 2;
  COMPLIANCE_CASE_STATUS_WAITING = 3;
  COMPLIANCE_CASE_STATUS_RESOLVED = 4;
  COMPLIANCE_CASE_STATUS_CLOSED = 5;
}

// Where a control is in its lifecycle.
enum ControlStatus {
  CONTROL_STATUS_UNSPECIFIED = 0;
  CONTROL_STATUS_DRAFT = 1;
  CONTROL_STATUS_ENABLED = 2;
  CONTROL_STATUS_DISABLED = 3;
  CONTROL_STATUS_RETIRED = 4;
}

// Where an attestation is in its lifecycle.
enum AttestationStatus {
  ATTESTATION_STATUS_UNSPECIFIED = 0;
  ATTESTATION_STATUS_DRAFT = 1;
  ATTESTATION_STATUS_ISSUED = 2;
  ATTESTATION_STATUS_APPROVED = 3;
  ATTESTATION_STATUS_PAID = 4;
  ATTESTATION_STATUS_VOID = 5;
}

// Where a sanction is in its lifecycle.
enum SanctionStatus {
  SANCTION_STATUS_UNSPECIFIED = 0;
  SANCTION_STATUS_ACTIVE = 1;
  SANCTION_STATUS_INACTIVE = 2;
}

// The comment of a compliance case.
message ComplianceCaseComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a compliance case.
message ComplianceCaseSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a compliance case.
message ComplianceCaseChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a compliance case.
message ComplianceCaseStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A compliance case of the compliance domain.
message ComplianceCase {
  string compliance_case_id = 1;
  string subject = 2;
  ComplianceCaseStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated ComplianceCaseComment comments = 7;
  ComplianceCaseSla sla = 8;
  oneof origin {
    AttestationRef customer = 9;
    string external_reference = 10;
    ComplianceCaseChannelOrigin channel = 11;
  }
  repeated ComplianceCaseStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The condition of a control.
message ControlCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a control.
message ControlDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a control.
message ControlRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a control.
message ControlBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A control of the compliance domain.
message Control {
  string control_id = 1;
  string name = 2;
  string description = 3;
  ControlStatus status = 4;
  int32 priority = 5;
  repeated ControlCondition conditions = 6;
  oneof action {
    ControlDiscountAction discount = 7;
    ControlRouteAction route = 8;
    ControlBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The line of an attestation.
message AttestationLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  AttestationLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an attestation line.
message AttestationLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an attestation.
message AttestationCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an attestation.
message AttestationBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an attestation.
message AttestationAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An attestation of the compliance domain.
message Attestation {
  string attestation_id = 1;
  string number = 2;
  AttestationStatus status = 3;
  ComplianceCaseRef counterparty = 4;
  repeated AttestationLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    AttestationCardSettlement card = 8;
    AttestationBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated AttestationAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// A sanction of the compliance domain.
message Sanction {
  string sanction_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated Sanction children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  SanctionStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}
