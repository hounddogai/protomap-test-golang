syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceCaseQueryServiceProto";
option java_package = "com.acme.compliance.v1";

// Answers read-only questions about compliance cases, for screens and reports.
service ComplianceCaseQueryService {
  // Returns a compliance case.
  rpc LookupComplianceCase(LookupComplianceCaseRequest) returns (LookupComplianceCaseResponse);

  // Lists compliance cases a page at a time.
  rpc BrowseComplianceCases(BrowseComplianceCasesRequest) returns (BrowseComplianceCasesResponse);

  // Lists compliance cases a page at a time.
  rpc FindComplianceCases(FindComplianceCasesRequest) returns (FindComplianceCasesResponse);

  // Counts compliance cases by status.
  rpc CountComplianceCases(CountComplianceCasesRequest) returns (CountComplianceCasesResponse);

  // Returns several compliance cases at once.
  rpc ResolveComplianceCases(ResolveComplianceCasesRequest) returns (ResolveComplianceCasesResponse);

  // Streams every matching compliance case.
  rpc ExportComplianceCases(ExportComplianceCasesRequest) returns (stream ExportComplianceCasesResponse);

  // Summarizes a compliance case.
  rpc SummarizeComplianceCases(SummarizeComplianceCasesRequest) returns (SummarizeComplianceCasesResponse);

  // Lists compliance cases a page at a time.
  rpc SuggestComplianceCases(SuggestComplianceCasesRequest) returns (SuggestComplianceCasesResponse);

  // Returns a compliance case.
  rpc PeekComplianceCase(PeekComplianceCaseRequest) returns (PeekComplianceCaseResponse);
}

// The request of `LookupComplianceCase`.
message LookupComplianceCaseRequest {
  acme.common.v1.RequestContext context = 1;
  string compliance_case_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupComplianceCase`.
message LookupComplianceCaseResponse {
  ComplianceCase compliance_case = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseComplianceCases`.
message BrowseComplianceCasesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ComplianceCaseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseComplianceCasesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseComplianceCases`.
message BrowseComplianceCasesResponse {
  repeated ComplianceCase compliance_cases = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindComplianceCases`.
message FindComplianceCasesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ComplianceCaseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindComplianceCasesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindComplianceCases`.
message FindComplianceCasesResponse {
  repeated ComplianceCase compliance_cases = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountComplianceCases`.
message CountComplianceCasesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ComplianceCaseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountComplianceCasesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountComplianceCases`.
message CountComplianceCasesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveComplianceCases`.
message ResolveComplianceCasesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string compliance_case_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveComplianceCases`.
message ResolveComplianceCasesResponse {
  repeated ComplianceCase compliance_cases = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportComplianceCases`.
message ExportComplianceCasesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ComplianceCaseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportComplianceCasesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportComplianceCases`.
message ExportComplianceCasesResponse {
  ComplianceCase compliance_case = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeComplianceCases`.
message SummarizeComplianceCasesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_case_id = 2;
  SummarizeComplianceCasesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeComplianceCases`.
message SummarizeComplianceCasesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestComplianceCases`.
message SuggestComplianceCasesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ComplianceCaseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestComplianceCasesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestComplianceCases`.
message SuggestComplianceCasesResponse {
  repeated ComplianceCase compliance_cases = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekComplianceCase`.
message PeekComplianceCaseRequest {
  acme.common.v1.RequestContext context = 1;
  string compliance_case_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekComplianceCase`.
message PeekComplianceCaseResponse {
  ComplianceCase compliance_case = 1;
  acme.common.v1.OperationResult result = 2;
}
