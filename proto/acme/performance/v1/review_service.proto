syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "ReviewServiceProto";
option java_package = "com.acme.performance.v1";

// Manages reviews: creates, reads, changes, and lists them.
service ReviewService {
  // Creates a review.
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);

  // Returns a review.
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse);

  // Changes a review.
  rpc UpdateReview(UpdateReviewRequest) returns (UpdateReviewResponse);

  // Deletes a review.
  rpc DeleteReview(DeleteReviewRequest) returns (DeleteReviewResponse);

  // Lists reviews a page at a time.
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);

  // Lists reviews a page at a time.
  rpc SearchReviews(SearchReviewsRequest) returns (SearchReviewsResponse);

  // Streams the changes of reviews as they happen.
  rpc WatchReviews(WatchReviewsRequest) returns (stream WatchReviewsResponse);

  // Creates a review.
  rpc CloneReview(CloneReviewRequest) returns (CloneReviewResponse);
}

// The request of `CreateReview`.
message CreateReviewRequest {
  acme.common.v1.RequestContext context = 1;
  Review review = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateReview`.
message CreateReviewResponse {
  Review review = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetReview`.
message GetReviewRequest {
  acme.common.v1.RequestContext context = 1;
  string review_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetReview`.
message GetReviewResponse {
  Review review = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateReview`.
message UpdateReviewRequest {
  acme.common.v1.RequestContext context = 1;
  Review review = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateReview`.
message UpdateReviewResponse {
  Review review = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteReview`.
message DeleteReviewRequest {
  acme.common.v1.RequestContext context = 1;
  string review_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteReview`.
message DeleteReviewResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListReviews`.
message ListReviewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReviewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListReviewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListReviews`.
message ListReviewsResponse {
  repeated Review reviews = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchReviews`.
message SearchReviewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReviewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchReviewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchReviews`.
message SearchReviewsResponse {
  repeated Review reviews = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchReviews`.
message WatchReviewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReviewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchReviewsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchReviews`.
message WatchReviewsResponse {
  Review review = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `CloneReview`.
message CloneReviewRequest {
  acme.common.v1.RequestContext context = 1;
  Review review = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneReview`.
message CloneReviewResponse {
  Review review = 1;
  acme.common.v1.OperationResult result = 2;
}
