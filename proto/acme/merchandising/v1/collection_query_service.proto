syntax = "proto3";

package acme.merchandising.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/merchandising/v1/merchandising.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Merchandising.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/merchandising/v1;merchandisingv1";
option java_multiple_files = true;
option java_outer_classname = "CollectionQueryServiceProto";
option java_package = "com.acme.merchandising.v1";

// Answers read-only questions about collections, for screens and reports.
service CollectionQueryService {
  // Returns a collection.
  rpc LookupCollection(LookupCollectionRequest) returns (LookupCollectionResponse);

  // Lists collections a page at a time.
  rpc BrowseCollections(BrowseCollectionsRequest) returns (BrowseCollectionsResponse);

  // Lists collections a page at a time.
  rpc FindCollections(FindCollectionsRequest) returns (FindCollectionsResponse);

  // Counts collections by status.
  rpc CountCollections(CountCollectionsRequest) returns (CountCollectionsResponse);

  // Returns several collections at once.
  rpc ResolveCollections(ResolveCollectionsRequest) returns (ResolveCollectionsResponse);

  // Summarizes a collection.
  rpc SummarizeCollections(SummarizeCollectionsRequest) returns (SummarizeCollectionsResponse);

  // Lists collections a page at a time.
  rpc SuggestCollections(SuggestCollectionsRequest) returns (SuggestCollectionsResponse);

  // Returns a collection.
  rpc PeekCollection(PeekCollectionRequest) returns (PeekCollectionResponse);
}

// The request of `LookupCollection`.
message LookupCollectionRequest {
  acme.common.v1.RequestContext context = 1;
  string collection_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupCollection`.
message LookupCollectionResponse {
  Collection collection = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseCollections`.
message BrowseCollectionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CollectionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseCollectionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseCollections`.
message BrowseCollectionsResponse {
  repeated Collection collections = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindCollections`.
message FindCollectionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CollectionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindCollectionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindCollections`.
message FindCollectionsResponse {
  repeated Collection collections = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCollections`.
message CountCollectionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CollectionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCollectionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCollections`.
message CountCollectionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveCollections`.
message ResolveCollectionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string collection_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveCollections`.
message ResolveCollectionsResponse {
  repeated Collection collections = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeCollections`.
message SummarizeCollectionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string collection_id = 2;
  SummarizeCollectionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeCollections`.
message SummarizeCollectionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestCollections`.
message SuggestCollectionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CollectionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestCollectionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestCollections`.
message SuggestCollectionsResponse {
  repeated Collection collections = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekCollection`.
message PeekCollectionRequest {
  acme.common.v1.RequestContext context = 1;
  string collection_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekCollection`.
message PeekCollectionResponse {
  Collection collection = 1;
  acme.common.v1.OperationResult result = 2;
}
