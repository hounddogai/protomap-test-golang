syntax = "proto3";

package acme.merchandising.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/merchandising/v1/merchandising.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Merchandising.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/merchandising/v1;merchandisingv1";
option java_multiple_files = true;
option java_outer_classname = "MerchandisingRuleWorkflowServiceProto";
option java_package = "com.acme.merchandising.v1";

// Runs the long-lived workflow that takes a merchandising rule from start to finish.
service MerchandisingRuleWorkflowService {
  // Starts a merchandising rule.
  rpc StartMerchandisingRuleWorkflow(StartMerchandisingRuleWorkflowRequest) returns (StartMerchandisingRuleWorkflowResponse);

  // Advances a merchandising rule.
  rpc AdvanceMerchandisingRuleWorkflow(AdvanceMerchandisingRuleWorkflowRequest) returns (AdvanceMerchandisingRuleWorkflowResponse);

  // Cancels a merchandising rule.
  rpc CancelMerchandisingRuleWorkflow(CancelMerchandisingRuleWorkflowRequest) returns (CancelMerchandisingRuleWorkflowResponse);

  // Retrys a merchandising rule.
  rpc RetryMerchandisingRuleWorkflow(RetryMerchandisingRuleWorkflowRequest) returns (RetryMerchandisingRuleWorkflowResponse);

  // Pauses a merchandising rule.
  rpc PauseMerchandisingRuleWorkflow(PauseMerchandisingRuleWorkflowRequest) returns (PauseMerchandisingRuleWorkflowResponse);

  // Resumes a merchandising rule.
  rpc ResumeMerchandisingRuleWorkflow(ResumeMerchandisingRuleWorkflowRequest) returns (ResumeMerchandisingRuleWorkflowResponse);

  // Returns a merchandising rule.
  rpc InspectMerchandisingRuleWorkflow(InspectMerchandisingRuleWorkflowRequest) returns (InspectMerchandisingRuleWorkflowResponse);

  // Lists merchandising rules a page at a time.
  rpc ListMerchandisingRuleWorkflows(ListMerchandisingRuleWorkflowsRequest) returns (ListMerchandisingRuleWorkflowsResponse);

  // Signals a merchandising rule.
  rpc SignalMerchandisingRuleWorkflow(SignalMerchandisingRuleWorkflowRequest) returns (SignalMerchandisingRuleWorkflowResponse);
}

// The request of `StartMerchandisingRuleWorkflow`.
message StartMerchandisingRuleWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string merchandising_rule_id = 2;
  MerchandisingRule merchandising_rule = 3;
  StartMerchandisingRuleWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartMerchandisingRuleWorkflow`.
message StartMerchandisingRuleWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MerchandisingRule merchandising_rule = 1;
  StartMerchandisingRuleWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

