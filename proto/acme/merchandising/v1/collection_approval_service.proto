syntax = "proto3";

package acme.merchandising.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/merchandising/v1/merchandising.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Merchandising.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/merchandising/v1;merchandisingv1";
option java_multiple_files = true;
option java_outer_classname = "CollectionApprovalServiceProto";
option java_package = "com.acme.merchandising.v1";

// Routes collections through approval, with escalation and delegation.
service CollectionApprovalService {
  // Submits a collection.
  rpc SubmitCollection(SubmitCollectionRequest) returns (SubmitCollectionResponse);

  // Approves a collection.
  rpc ApproveCollection(ApproveCollectionRequest) returns (ApproveCollectionResponse);

  // Rejects a collection.
  rpc RejectCollection(RejectCollectionRequest) returns (RejectCollectionResponse);

  // Escalates a collection.
  rpc EscalateCollection(EscalateCollectionRequest) returns (EscalateCollectionResponse);

  // Lists collections a page at a time.
  rpc ListPendingCollections(ListPendingCollectionsRequest) returns (ListPendingCollectionsResponse);

  // Delegates a collection.
  rpc DelegateCollectionApproval(DelegateCollectionApprovalRequest) returns (DelegateCollectionApprovalResponse);

  // Recalls a collection.
  rpc RecallCollection(RecallCollectionRequest) returns (RecallCollectionResponse);

  // Returns a collection.
  rpc GetCollectionApprovalStatus(GetCollectionApprovalStatusRequest) returns (GetCollectionApprovalStatusResponse);

  // Comments a collection.
  rpc CommentCollectionApproval(CommentCollectionApprovalRequest) returns (CommentCollectionApprovalResponse);
}

// The request of `SubmitCollection`.
message SubmitCollectionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string collection_id = 2;
  Collection collection = 3;
  SubmitCollectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCollection`.
message SubmitCollectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Collection collection = 1;
  SubmitCollectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

