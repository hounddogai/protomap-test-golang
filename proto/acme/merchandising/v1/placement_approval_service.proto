syntax = "proto3";

package acme.merchandising.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/merchandising/v1/merchandising.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Merchandising.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/merchandising/v1;merchandisingv1";
option java_multiple_files = true;
option java_outer_classname = "PlacementApprovalServiceProto";
option java_package = "com.acme.merchandising.v1";

// Routes placements through approval, with escalation and delegation.
service PlacementApprovalService {
  // Submits a placement.
  rpc SubmitPlacement(SubmitPlacementRequest) returns (SubmitPlacementResponse);

  // Approves a placement.
  rpc ApprovePlacement(ApprovePlacementRequest) returns (ApprovePlacementResponse);

  // Rejects a placement.
  rpc RejectPlacement(RejectPlacementRequest) returns (RejectPlacementResponse);

  // Lists placements a page at a time.
  rpc ListPendingPlacements(ListPendingPlacementsRequest) returns (ListPendingPlacementsResponse);

  // Delegates a placement.
  rpc DelegatePlacementApproval(DelegatePlacementApprovalRequest) returns (DelegatePlacementApprovalResponse);

  // Recalls a placement.
  rpc RecallPlacement(RecallPlacementRequest) returns (RecallPlacementResponse);

  // Returns a placement.
  rpc GetPlacementApprovalStatus(GetPlacementApprovalStatusRequest) returns (GetPlacementApprovalStatusResponse);
}

// The request of `SubmitPlacement`.
message SubmitPlacementRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string placement_id = 2;
  Placement placement = 3;
  SubmitPlacementRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPlacement`.
message SubmitPlacementResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Placement placement = 1;
  SubmitPlacementResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

