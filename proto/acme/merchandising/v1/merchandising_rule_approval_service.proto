syntax = "proto3";

package acme.merchandising.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/merchandising/v1/merchandising.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Merchandising.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/merchandising/v1;merchandisingv1";
option java_multiple_files = true;
option java_outer_classname = "MerchandisingRuleApprovalServiceProto";
option java_package = "com.acme.merchandising.v1";

// Routes merchandising rules through approval, with escalation and delegation.
service MerchandisingRuleApprovalService {
  // Submits a merchandising rule.
  rpc SubmitMerchandisingRule(SubmitMerchandisingRuleRequest) returns (SubmitMerchandisingRuleResponse);

  // Approves a merchandising rule.
  rpc ApproveMerchandisingRule(ApproveMerchandisingRuleRequest) returns (ApproveMerchandisingRuleResponse);

  // Escalates a merchandising rule.
  rpc EscalateMerchandisingRule(EscalateMerchandisingRuleRequest) returns (EscalateMerchandisingRuleResponse);

  // Lists merchandising rules a page at a time.
  rpc ListPendingMerchandisingRules(ListPendingMerchandisingRulesRequest) returns (ListPendingMerchandisingRulesResponse);

  // Delegates a merchandising rule.
  rpc DelegateMerchandisingRuleApproval(DelegateMerchandisingRuleApprovalRequest) returns (DelegateMerchandisingRuleApprovalResponse);

  // Recalls a merchandising rule.
  rpc RecallMerchandisingRule(RecallMerchandisingRuleRequest) returns (RecallMerchandisingRuleResponse);

  // Returns a merchandising rule.
  rpc GetMerchandisingRuleApprovalStatus(GetMerchandisingRuleApprovalStatusRequest) returns (GetMerchandisingRuleApprovalStatusResponse);

  // Comments a merchandising rule.
  rpc CommentMerchandisingRuleApproval(CommentMerchandisingRuleApprovalRequest) returns (CommentMerchandisingRuleApprovalResponse);
}

// The request of `SubmitMerchandisingRule`.
message SubmitMerchandisingRuleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string merchandising_rule_id = 2;
  MerchandisingRule merchandising_rule = 3;
  SubmitMerchandisingRuleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitMerchandisingRule`.
message SubmitMerchandisingRuleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MerchandisingRule merchandising_rule = 1;
  SubmitMerchandisingRuleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

