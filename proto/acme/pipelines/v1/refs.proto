syntax = "proto3";

package acme.pipelines.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.pipelines.v1";

// A reference to a pipeline of the pipelines domain.
message PipelineRef {
  string pipeline_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a pipeline run of the pipelines domain.
message PipelineRunRef {
  string pipeline_run_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a pipeline step of the pipelines domain.
message PipelineStepRef {
  string pipeline_step_id = 1;
  string display_name = 2;
  int64 version = 3;
}
