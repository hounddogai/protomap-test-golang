syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineCalculationServiceProto";
option java_package = "com.acme.pipelines.v1";

// Computes the figures of a pipeline, such as totals, taxes, and estimates.
service PipelineCalculationService {
  // Calculates a pipeline.
  rpc CalculatePipeline(CalculatePipelineRequest) returns (CalculatePipelineResponse);

  // Estimates a pipeline.
  rpc EstimatePipeline(EstimatePipelineRequest) returns (EstimatePipelineResponse);

  // Compares a pipeline.
  rpc ComparePipelineOptions(ComparePipelineOptionsRequest) returns (ComparePipelineOptionsResponse);

  // Recalculates a pipeline.
  rpc RecalculatePipelines(RecalculatePipelinesRequest) returns (RecalculatePipelinesResponse);

  // Simulates a pipeline.
  rpc SimulatePipeline(SimulatePipelineRequest) returns (SimulatePipelineResponse);

  // Explains a pipeline.
  rpc ExplainPipelineCalculation(ExplainPipelineCalculationRequest) returns (ExplainPipelineCalculationResponse);

  // Returns a pipeline.
  rpc GetPipelineRates(GetPipelineRatesRequest) returns (GetPipelineRatesResponse);
}

// The request of `CalculatePipeline`.
message CalculatePipelineRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  Pipeline pipeline = 3;
  CalculatePipelineRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePipeline`.
message CalculatePipelineResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePipelineResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Pipeline pipeline = 1;
  CalculatePipelineResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

