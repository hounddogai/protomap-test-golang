syntax = "proto3";

package acme.certificates.v1;

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.certificates.v1";

// A reference to a certificate of the certificates domain.
message CertificateRef {
  string certificate_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a certificate authority of the certificates domain.
message CertificateAuthorityRef {
  string certificate_authority_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a csr of the certificates domain.
message CsrRef {
  string csr_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
