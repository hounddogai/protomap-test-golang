syntax = "proto3";

package acme.warehousing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/warehousing/v1/warehousing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Warehousing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/warehousing/v1;warehousingv1";
option java_multiple_files = true;
option java_outer_classname = "PutawayTaskApprovalServiceProto";
option java_package = "com.acme.warehousing.v1";

// Routes putaway tasks through approval, with escalation and delegation.
service PutawayTaskApprovalService {
  // Submits a putaway task.
  rpc SubmitPutawayTask(SubmitPutawayTaskRequest) returns (SubmitPutawayTaskResponse);

  // Approves a putaway task.
  rpc ApprovePutawayTask(ApprovePutawayTaskRequest) returns (ApprovePutawayTaskResponse);

  // Lists putaway tasks a page at a time.
  rpc ListPendingPutawayTasks(ListPendingPutawayTasksRequest) returns (ListPendingPutawayTasksResponse);

  // Delegates a putaway task.
  rpc DelegatePutawayTaskApproval(DelegatePutawayTaskApprovalRequest) returns (DelegatePutawayTaskApprovalResponse);

  // Recalls a putaway task.
  rpc RecallPutawayTask(RecallPutawayTaskRequest) returns (RecallPutawayTaskResponse);

  // Returns a putaway task.
  rpc GetPutawayTaskApprovalStatus(GetPutawayTaskApprovalStatusRequest) returns (GetPutawayTaskApprovalStatusResponse);
}

// The request of `SubmitPutawayTask`.
message SubmitPutawayTaskRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string putaway_task_id = 2;
  PutawayTask putaway_task = 3;
  SubmitPutawayTaskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPutawayTask`.
message SubmitPutawayTaskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PutawayTask putaway_task = 1;
  SubmitPutawayTaskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApprovePutawayTask`.
message ApprovePutawayTaskRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string putaway_task_id = 2;
  PutawayTask putaway_task = 3;
  ApprovePutawayTaskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApprovePutawayTask`.
message ApprovePutawayTaskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PutawayTask putaway_task = 1;
  ApprovePutawayTaskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingPutawayTasks`.
message ListPendingPutawayTasksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PutawayTaskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingPutawayTasksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingPutawayTasks`.
message ListPendingPutawayTasksResponse {
  repeated PutawayTask putaway_tasks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DelegatePutawayTaskApproval`.
message DelegatePutawayTaskApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string putaway_task_id = 2;
  PutawayTask putaway_task = 3;
  DelegatePutawayTaskApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `DelegatePutawayTaskApproval`.
message DelegatePutawayTaskApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PutawayTask putaway_task = 1;
  DelegatePutawayTaskApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RecallPutawayTask`.
message RecallPutawayTaskRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string putaway_task_id = 2;
  PutawayTask putaway_task = 3;
  RecallPutawayTaskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecallPutawayTask`.
message RecallPutawayTaskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PutawayTask putaway_task = 1;
  RecallPutawayTaskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPutawayTaskApprovalStatus`.
message GetPutawayTaskApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string putaway_task_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPutawayTaskApprovalStatus`.
message GetPutawayTaskApprovalStatusResponse {
  PutawayTask putaway_task = 1;
  acme.common.v1.OperationResult result = 2;
}
