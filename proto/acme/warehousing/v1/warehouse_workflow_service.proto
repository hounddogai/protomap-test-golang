syntax = "proto3";

package acme.warehousing.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/warehousing/v1/warehousing.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Warehousing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/warehousing/v1;warehousingv1";
option java_multiple_files = true;
option java_outer_classname = "WarehouseWorkflowServiceProto";
option java_package = "com.acme.warehousing.v1";

// Runs the long-lived workflow that takes a warehouse from start to finish.
service WarehouseWorkflowService {
  // Starts a warehouse.
  rpc StartWarehouseWorkflow(StartWarehouseWorkflowRequest) returns (StartWarehouseWorkflowResponse);

  // Advances a warehouse.
  rpc AdvanceWarehouseWorkflow(AdvanceWarehouseWorkflowRequest) returns (AdvanceWarehouseWorkflowResponse);

  // Cancels a warehouse.
  rpc CancelWarehouseWorkflow(CancelWarehouseWorkflowRequest) returns (CancelWarehouseWorkflowResponse);

  // Retrys a warehouse.
  rpc RetryWarehouseWorkflow(RetryWarehouseWorkflowRequest) returns (RetryWarehouseWorkflowResponse);

  // Resumes a warehouse.
  rpc ResumeWarehouseWorkflow(ResumeWarehouseWorkflowRequest) returns (ResumeWarehouseWorkflowResponse);

  // Returns a warehouse.
  rpc InspectWarehouseWorkflow(InspectWarehouseWorkflowRequest) returns (InspectWarehouseWorkflowResponse);

  // Lists warehouses a page at a time.
  rpc ListWarehouseWorkflows(ListWarehouseWorkflowsRequest) returns (ListWarehouseWorkflowsResponse);

  // Signals a warehouse.
  rpc SignalWarehouseWorkflow(SignalWarehouseWorkflowRequest) returns (SignalWarehouseWorkflowResponse);
}

// The request of `StartWarehouseWorkflow`.
message StartWarehouseWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string warehouse_id = 2;
  Warehouse warehouse = 3;
  StartWarehouseWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWarehouseWorkflow`.
message StartWarehouseWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Warehouse warehouse = 1;
  StartWarehouseWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

