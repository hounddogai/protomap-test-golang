syntax = "proto3";

package acme.warehousing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/warehousing/v1/warehousing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Warehousing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/warehousing/v1;warehousingv1";
option java_multiple_files = true;
option java_outer_classname = "StorageBinApprovalServiceProto";
option java_package = "com.acme.warehousing.v1";

// Routes storage bins through approval, with escalation and delegation.
service StorageBinApprovalService {
  // Submits a storage bin.
  rpc SubmitStorageBin(SubmitStorageBinRequest) returns (SubmitStorageBinResponse);

  // Approves a storage bin.
  rpc ApproveStorageBin(ApproveStorageBinRequest) returns (ApproveStorageBinResponse);

  // Rejects a storage bin.
  rpc RejectStorageBin(RejectStorageBinRequest) returns (RejectStorageBinResponse);

  // Escalates a storage bin.
  rpc EscalateStorageBin(EscalateStorageBinRequest) returns (EscalateStorageBinResponse);

  // Lists storage bins a page at a time.
  rpc ListPendingStorageBins(ListPendingStorageBinsRequest) returns (ListPendingStorageBinsResponse);

  // Delegates a storage bin.
  rpc DelegateStorageBinApproval(DelegateStorageBinApprovalRequest) returns (DelegateStorageBinApprovalResponse);

  // Recalls a storage bin.
  rpc RecallStorageBin(RecallStorageBinRequest) returns (RecallStorageBinResponse);

  // Returns a storage bin.
  rpc GetStorageBinApprovalStatus(GetStorageBinApprovalStatusRequest) returns (GetStorageBinApprovalStatusResponse);

  // Comments a storage bin.
  rpc CommentStorageBinApproval(CommentStorageBinApprovalRequest) returns (CommentStorageBinApprovalResponse);
}

// The request of `SubmitStorageBin`.
message SubmitStorageBinRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storage_bin_id = 2;
  StorageBin storage_bin = 3;
  SubmitStorageBinRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStorageBin`.
message SubmitStorageBinResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StorageBin storage_bin = 1;
  SubmitStorageBinResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

