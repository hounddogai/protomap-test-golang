syntax = "proto3";

package acme.warehousing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/warehousing/v1/warehousing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Warehousing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/warehousing/v1;warehousingv1";
option java_multiple_files = true;
option java_outer_classname = "PutawayTaskValidationServiceProto";
option java_package = "com.acme.warehousing.v1";

// Checks putaway tasks against the rules before anything acts on them.
service PutawayTaskValidationService {
  // Validates a putaway task.
  rpc ValidatePutawayTask(ValidatePutawayTaskRequest) returns (ValidatePutawayTaskResponse);

  // Previews a putaway task.
  rpc PreviewPutawayTask(PreviewPutawayTaskRequest) returns (PreviewPutawayTaskResponse);

  // Checks a putaway task.
  rpc CheckPutawayTaskEligibility(CheckPutawayTaskEligibilityRequest) returns (CheckPutawayTaskEligibilityResponse);

  // Normalizes a putaway task.
  rpc NormalizePutawayTask(NormalizePutawayTaskRequest) returns (NormalizePutawayTaskResponse);

  // Explains a putaway task.
  rpc ExplainPutawayTaskDecision(ExplainPutawayTaskDecisionRequest) returns (ExplainPutawayTaskDecisionResponse);

  // Scores a putaway task.
  rpc ScorePutawayTask(ScorePutawayTaskRequest) returns (ScorePutawayTaskResponse);

  // Returns a putaway task.
  rpc GetPutawayTaskRules(GetPutawayTaskRulesRequest) returns (GetPutawayTaskRulesResponse);
}

// The request of `ValidatePutawayTask`.
message ValidatePutawayTaskRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string putaway_task_id = 2;
  PutawayTask putaway_task = 3;
  ValidatePutawayTaskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePutawayTask`.
message ValidatePutawayTaskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PutawayTask putaway_task = 1;
  ValidatePutawayTaskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

