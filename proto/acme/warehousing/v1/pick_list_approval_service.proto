syntax = "proto3";

package acme.warehousing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/warehousing/v1/warehousing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Warehousing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/warehousing/v1;warehousingv1";
option java_multiple_files = true;
option java_outer_classname = "PickListApprovalServiceProto";
option java_package = "com.acme.warehousing.v1";

// Routes pick lists through approval, with escalation and delegation.
service PickListApprovalService {
  // Submits a pick list.
  rpc SubmitPickList(SubmitPickListRequest) returns (SubmitPickListResponse);

  // Approves a pick list.
  rpc ApprovePickList(ApprovePickListRequest) returns (ApprovePickListResponse);

  // Rejects a pick list.
  rpc RejectPickList(RejectPickListRequest) returns (RejectPickListResponse);

  // Escalates a pick list.
  rpc EscalatePickList(EscalatePickListRequest) returns (EscalatePickListResponse);

  // Lists pick lists a page at a time.
  rpc ListPendingPickLists(ListPendingPickListsRequest) returns (ListPendingPickListsResponse);

  // Delegates a pick list.
  rpc DelegatePickListApproval(DelegatePickListApprovalRequest) returns (DelegatePickListApprovalResponse);

  // Recalls a pick list.
  rpc RecallPickList(RecallPickListRequest) returns (RecallPickListResponse);

  // Returns a pick list.
  rpc GetPickListApprovalStatus(GetPickListApprovalStatusRequest) returns (GetPickListApprovalStatusResponse);

  // Comments a pick list.
  rpc CommentPickListApproval(CommentPickListApprovalRequest) returns (CommentPickListApprovalResponse);
}

// The request of `SubmitPickList`.
message SubmitPickListRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pick_list_id = 2;
  PickList pick_list = 3;
  SubmitPickListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPickList`.
message SubmitPickListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PickList pick_list = 1;
  SubmitPickListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

