syntax = "proto3";

package acme.warehousing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/warehousing/v1/warehousing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Warehousing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/warehousing/v1;warehousingv1";
option java_multiple_files = true;
option java_outer_classname = "StorageBinQueryServiceProto";
option java_package = "com.acme.warehousing.v1";

// Answers read-only questions about storage bins, for screens and reports.
service StorageBinQueryService {
  // Returns a storage bin.
  rpc LookupStorageBin(LookupStorageBinRequest) returns (LookupStorageBinResponse);

  // Lists storage bins a page at a time.
  rpc BrowseStorageBins(BrowseStorageBinsRequest) returns (BrowseStorageBinsResponse);

  // Lists storage bins a page at a time.
  rpc FindStorageBins(FindStorageBinsRequest) returns (FindStorageBinsResponse);

  // Returns several storage bins at once.
  rpc ResolveStorageBins(ResolveStorageBinsRequest) returns (ResolveStorageBinsResponse);

  // Streams every matching storage bin.
  rpc ExportStorageBins(ExportStorageBinsRequest) returns (stream ExportStorageBinsResponse);

  // Summarizes a storage bin.
  rpc SummarizeStorageBins(SummarizeStorageBinsRequest) returns (SummarizeStorageBinsResponse);

  // Lists storage bins a page at a time.
  rpc SuggestStorageBins(SuggestStorageBinsRequest) returns (SuggestStorageBinsResponse);

  // Returns a storage bin.
  rpc PeekStorageBin(PeekStorageBinRequest) returns (PeekStorageBinResponse);
}

// The request of `LookupStorageBin`.
message LookupStorageBinRequest {
  acme.common.v1.RequestContext context = 1;
  string storage_bin_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupStorageBin`.
message LookupStorageBinResponse {
  StorageBin storage_bin = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseStorageBins`.
message BrowseStorageBinsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorageBinStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseStorageBinsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseStorageBins`.
message BrowseStorageBinsResponse {
  repeated StorageBin storage_bins = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindStorageBins`.
message FindStorageBinsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorageBinStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindStorageBinsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindStorageBins`.
message FindStorageBinsResponse {
  repeated StorageBin storage_bins = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveStorageBins`.
message ResolveStorageBinsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string storage_bin_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveStorageBins`.
message ResolveStorageBinsResponse {
  repeated StorageBin storage_bins = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportStorageBins`.
message ExportStorageBinsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorageBinStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportStorageBinsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportStorageBins`.
message ExportStorageBinsResponse {
  StorageBin storage_bin = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeStorageBins`.
message SummarizeStorageBinsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string storage_bin_id = 2;
  SummarizeStorageBinsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeStorageBins`.
message SummarizeStorageBinsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestStorageBins`.
message SuggestStorageBinsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StorageBinStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestStorageBinsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestStorageBins`.
message SuggestStorageBinsResponse {
  repeated StorageBin storage_bins = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekStorageBin`.
message PeekStorageBinRequest {
  acme.common.v1.RequestContext context = 1;
  string storage_bin_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekStorageBin`.
message PeekStorageBinResponse {
  StorageBin storage_bin = 1;
  acme.common.v1.OperationResult result = 2;
}
