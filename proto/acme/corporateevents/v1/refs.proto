syntax = "proto3";

package acme.corporateevents.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.corporateevents.v1";

// A reference to a corporate event of the corporateevents domain.
message CorporateEventRef {
  string corporate_event_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a registration of the corporateevents domain.
message RegistrationRef {
  string registration_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a venue of the corporateevents domain.
message VenueRef {
  string venue_id = 1;
  string display_name = 2;
  string code = 3;
}
