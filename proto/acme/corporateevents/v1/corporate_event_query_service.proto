syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "CorporateEventQueryServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Answers read-only questions about corporate events, for screens and reports.
service CorporateEventQueryService {
  // Returns a corporate event.
  rpc LookupCorporateEvent(LookupCorporateEventRequest) returns (LookupCorporateEventResponse);

  // Lists corporate events a page at a time.
  rpc BrowseCorporateEvents(BrowseCorporateEventsRequest) returns (BrowseCorporateEventsResponse);

  // Lists corporate events a page at a time.
  rpc FindCorporateEvents(FindCorporateEventsRequest) returns (FindCorporateEventsResponse);

  // Counts corporate events by status.
  rpc CountCorporateEvents(CountCorporateEventsRequest) returns (CountCorporateEventsResponse);

  // Returns several corporate events at once.
  rpc ResolveCorporateEvents(ResolveCorporateEventsRequest) returns (ResolveCorporateEventsResponse);

  // Streams every matching corporate event.
  rpc ExportCorporateEvents(ExportCorporateEventsRequest) returns (stream ExportCorporateEventsResponse);

  // Summarizes a corporate event.
  rpc SummarizeCorporateEvents(SummarizeCorporateEventsRequest) returns (SummarizeCorporateEventsResponse);

  // Lists corporate events a page at a time.
  rpc SuggestCorporateEvents(SuggestCorporateEventsRequest) returns (SuggestCorporateEventsResponse);

  // Returns a corporate event.
  rpc PeekCorporateEvent(PeekCorporateEventRequest) returns (PeekCorporateEventResponse);
}

// The request of `LookupCorporateEvent`.
message LookupCorporateEventRequest {
  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupCorporateEvent`.
message LookupCorporateEventResponse {
  CorporateEvent corporate_event = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseCorporateEvents`.
message BrowseCorporateEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseCorporateEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseCorporateEvents`.
message BrowseCorporateEventsResponse {
  repeated CorporateEvent corporate_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindCorporateEvents`.
message FindCorporateEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindCorporateEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindCorporateEvents`.
message FindCorporateEventsResponse {
  repeated CorporateEvent corporate_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCorporateEvents`.
message CountCorporateEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCorporateEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCorporateEvents`.
message CountCorporateEventsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveCorporateEvents`.
message ResolveCorporateEventsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string corporate_event_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveCorporateEvents`.
message ResolveCorporateEventsResponse {
  repeated CorporateEvent corporate_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportCorporateEvents`.
message ExportCorporateEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportCorporateEventsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportCorporateEvents`.
message ExportCorporateEventsResponse {
  CorporateEvent corporate_event = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeCorporateEvents`.
message SummarizeCorporateEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  SummarizeCorporateEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeCorporateEvents`.
message SummarizeCorporateEventsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestCorporateEvents`.
message SuggestCorporateEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestCorporateEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestCorporateEvents`.
message SuggestCorporateEventsResponse {
  repeated CorporateEvent corporate_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekCorporateEvent`.
message PeekCorporateEventRequest {
  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekCorporateEvent`.
message PeekCorporateEventResponse {
  CorporateEvent corporate_event = 1;
  acme.common.v1.OperationResult result = 2;
}
