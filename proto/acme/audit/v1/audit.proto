syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/refs.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditProto";
option java_package = "com.acme.audit.v1";

// Where an audit event is in its lifecycle.
enum AuditEventStatus {
  AUDIT_EVENT_STATUS_UNSPECIFIED = 0;
  AUDIT_EVENT_STATUS_RECEIVED = 1;
  AUDIT_EVENT_STATUS_PROCESSED = 2;
  AUDIT_EVENT_STATUS_DISCARDED = 3;
}

// Where an audit trail is in its lifecycle.
enum AuditTrailStatus {
  AUDIT_TRAIL_STATUS_UNSPECIFIED = 0;
  AUDIT_TRAIL_STATUS_DRAFT = 1;
  AUDIT_TRAIL_STATUS_ISSUED = 2;
  AUDIT_TRAIL_STATUS_APPROVED = 3;
  AUDIT_TRAIL_STATUS_PAID = 4;
  AUDIT_TRAIL_STATUS_VOID = 5;
}

// Where a retention policy is in its lifecycle.
enum RetentionPolicyStatus {
  RETENTION_POLICY_STATUS_UNSPECIFIED = 0;
  RETENTION_POLICY_STATUS_DRAFT = 1;
  RETENTION_POLICY_STATUS_ENABLED = 2;
  RETENTION_POLICY_STATUS_DISABLED = 3;
  RETENTION_POLICY_STATUS_RETIRED = 4;
}

// The measurement of an audit event.
message AuditEventMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// An audit event of the audit domain.
message AuditEvent {
  string audit_event_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  AuditTrailRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated AuditEventMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The line of an audit trail.
message AuditTrailLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  AuditTrailLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of an audit trail line.
message AuditTrailLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of an audit trail.
message AuditTrailCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of an audit trail.
message AuditTrailBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of an audit trail.
message AuditTrailAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// An audit trail of the audit domain.
message AuditTrail {
  string audit_trail_id = 1;
  string number = 2;
  AuditTrailStatus status = 3;
  RetentionPolicyRef counterparty = 4;
  repeated AuditTrailLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    AuditTrailCardSettlement card = 8;
    AuditTrailBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated AuditTrailAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}

// The condition of a retention policy.
message RetentionPolicyCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a retention policy.
message RetentionPolicyDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a retention policy.
message RetentionPolicyRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a retention policy.
message RetentionPolicyBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A retention policy of the audit domain.
message RetentionPolicy {
  string retention_policy_id = 1;
  string name = 2;
  string description = 3;
  RetentionPolicyStatus status = 4;
  int32 priority = 5;
  repeated RetentionPolicyCondition conditions = 6;
  oneof action {
    RetentionPolicyDiscountAction discount = 7;
    RetentionPolicyRouteAction route = 8;
    RetentionPolicyBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
