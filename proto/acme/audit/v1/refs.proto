syntax = "proto3";

package acme.audit.v1;

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.audit.v1";

// A reference to an audit event of the audit domain.
message AuditEventRef {
  string audit_event_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to an audit trail of the audit domain.
message AuditTrailRef {
  string audit_trail_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a retention policy of the audit domain.
message RetentionPolicyRef {
  string retention_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}
