syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditEventValidationServiceProto";
option java_package = "com.acme.audit.v1";

// Checks audit events against the rules before anything acts on them.
service AuditEventValidationService {
  // Validates an audit event.
  rpc ValidateAuditEvent(ValidateAuditEventRequest) returns (ValidateAuditEventResponse);

  // Previews an audit event.
  rpc PreviewAuditEvent(PreviewAuditEventRequest) returns (PreviewAuditEventResponse);

  // Checks an audit event.
  rpc CheckAuditEventEligibility(CheckAuditEventEligibilityRequest) returns (CheckAuditEventEligibilityResponse);

  // Normalizes an audit event.
  rpc NormalizeAuditEvent(NormalizeAuditEventRequest) returns (NormalizeAuditEventResponse);

  // Explains an audit event.
  rpc ExplainAuditEventDecision(ExplainAuditEventDecisionRequest) returns (ExplainAuditEventDecisionResponse);

  // Scores an audit event.
  rpc ScoreAuditEvent(ScoreAuditEventRequest) returns (ScoreAuditEventResponse);

  // Lints an audit event.
  rpc LintAuditEvents(LintAuditEventsRequest) returns (LintAuditEventsResponse);

  // Returns an audit event.
  rpc GetAuditEventRules(GetAuditEventRulesRequest) returns (GetAuditEventRulesResponse);
}

// The request of `ValidateAuditEvent`.
message ValidateAuditEventRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  AuditEvent audit_event = 3;
  ValidateAuditEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAuditEvent`.
message ValidateAuditEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  ValidateAuditEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

