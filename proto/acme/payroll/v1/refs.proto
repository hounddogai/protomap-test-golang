syntax = "proto3";

package acme.payroll.v1;

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.payroll.v1";

// A reference to a pay run of the payroll domain.
message PayRunRef {
  string pay_run_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a pay stub of the payroll domain.
message PayStubRef {
  string pay_stub_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a deduction of the payroll domain.
message DeductionRef {
  string deduction_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a tax withholding of the payroll domain.
message TaxWithholdingRef {
  string tax_withholding_id = 1;
  string display_name = 2;
  int64 version = 3;
}
