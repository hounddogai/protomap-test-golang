syntax = "proto3";

package acme.treasury.v1;

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.treasury.v1";

// A reference to a cash position of the treasury domain.
message CashPositionRef {
  string cash_position_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a bank transfer of the treasury domain.
message BankTransferRef {
  string bank_transfer_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a fx hedge of the treasury domain.
message FxHedgeRef {
  string fx_hedge_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a liquidity forecast of the treasury domain.
message LiquidityForecastRef {
  string liquidity_forecast_id = 1;
  string display_name = 2;
  string number = 3;
}
