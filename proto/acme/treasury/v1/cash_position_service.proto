syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "CashPositionServiceProto";
option java_package = "com.acme.treasury.v1";

// Manages cash positions: creates, reads, changes, and lists them.
service CashPositionService {
  // Creates a cash position.
  rpc CreateCashPosition(CreateCashPositionRequest) returns (CreateCashPositionResponse);

  // Returns a cash position.
  rpc GetCashPosition(GetCashPositionRequest) returns (GetCashPositionResponse);

  // Changes a cash position.
  rpc UpdateCashPosition(UpdateCashPositionRequest) returns (UpdateCashPositionResponse);

  // Deletes a cash position.
  rpc DeleteCashPosition(DeleteCashPositionRequest) returns (DeleteCashPositionResponse);

  // Lists cash positions a page at a time.
  rpc SearchCashPositions(SearchCashPositionsRequest) returns (SearchCashPositionsResponse);

  // Takes a stream of cash positions and answers once at the end.
  rpc BatchCreateCashPositions(stream BatchCreateCashPositionsRequest) returns (BatchCreateCashPositionsResponse);

  // Creates a cash position.
  rpc CloneCashPosition(CloneCashPositionRequest) returns (CloneCashPositionResponse);
}

// The request of `CreateCashPosition`.
message CreateCashPositionRequest {
  acme.common.v1.RequestContext context = 1;
  CashPosition cash_position = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateCashPosition`.
message CreateCashPositionResponse {
  CashPosition cash_position = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetCashPosition`.
message GetCashPositionRequest {
  acme.common.v1.RequestContext context = 1;
  string cash_position_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCashPosition`.
message GetCashPositionResponse {
  CashPosition cash_position = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateCashPosition`.
message UpdateCashPositionRequest {
  acme.common.v1.RequestContext context = 1;
  CashPosition cash_position = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateCashPosition`.
message UpdateCashPositionResponse {
  CashPosition cash_position = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteCashPosition`.
message DeleteCashPositionRequest {
  acme.common.v1.RequestContext context = 1;
  string cash_position_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCashPosition`.
message DeleteCashPositionResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `SearchCashPositions`.
message SearchCashPositionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CashPositionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchCashPositionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchCashPositions`.
message SearchCashPositionsResponse {
  repeated CashPosition cash_positions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchCreateCashPositions`.
message BatchCreateCashPositionsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateCashPositionsRequest.StreamHeader header = 2;
    CashPosition record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateCashPositions`.
message BatchCreateCashPositionsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string cash_position_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateCashPositionsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneCashPosition`.
message CloneCashPositionRequest {
  acme.common.v1.RequestContext context = 1;
  CashPosition cash_position = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneCashPosition`.
message CloneCashPositionResponse {
  CashPosition cash_position = 1;
  acme.common.v1.OperationResult result = 2;
}
