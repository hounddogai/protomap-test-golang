syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "CashPositionCalculationServiceProto";
option java_package = "com.acme.treasury.v1";

// Computes the figures of a cash position, such as totals, taxes, and estimates.
service CashPositionCalculationService {
  // Calculates a cash position.
  rpc CalculateCashPosition(CalculateCashPositionRequest) returns (CalculateCashPositionResponse);

  // Estimates a cash position.
  rpc EstimateCashPosition(EstimateCashPositionRequest) returns (EstimateCashPositionResponse);

  // Quotes a cash position.
  rpc QuoteCashPosition(QuoteCashPositionRequest) returns (QuoteCashPositionResponse);

  // Compares a cash position.
  rpc CompareCashPositionOptions(CompareCashPositionOptionsRequest) returns (CompareCashPositionOptionsResponse);

  // Simulates a cash position.
  rpc SimulateCashPosition(SimulateCashPositionRequest) returns (SimulateCashPositionResponse);

  // Explains a cash position.
  rpc ExplainCashPositionCalculation(ExplainCashPositionCalculationRequest) returns (ExplainCashPositionCalculationResponse);

  // Returns a cash position.
  rpc GetCashPositionRates(GetCashPositionRatesRequest) returns (GetCashPositionRatesResponse);
}

// The request of `CalculateCashPosition`.
message CalculateCashPositionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_position_id = 2;
  CashPosition cash_position = 3;
  CalculateCashPositionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCashPosition`.
message CalculateCashPositionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCashPositionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CashPosition cash_position = 1;
  CalculateCashPositionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

