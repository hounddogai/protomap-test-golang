syntax = "proto3";

package acme.collections.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.collections.v1";

// A reference to a collection case of the collections domain.
message CollectionCaseRef {
  string collection_case_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a payment promise of the collections domain.
message PaymentPromiseRef {
  string payment_promise_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a write off of the collections domain.
message WriteOffRef {
  string write_off_id = 1;
  string display_name = 2;
  string number = 3;
}
