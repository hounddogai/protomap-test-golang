syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentValidationServiceProto";
option java_package = "com.acme.documents.v1";

// Checks documents against the rules before anything acts on them.
service DocumentValidationService {
  // Validates a document.
  rpc ValidateDocument(ValidateDocumentRequest) returns (ValidateDocumentResponse);

  // Previews a document.
  rpc PreviewDocument(PreviewDocumentRequest) returns (PreviewDocumentResponse);

  // Checks a document.
  rpc CheckDocumentEligibility(CheckDocumentEligibilityRequest) returns (CheckDocumentEligibilityResponse);

  // Normalizes a document.
  rpc NormalizeDocument(NormalizeDocumentRequest) returns (NormalizeDocumentResponse);

  // Lints a document.
  rpc LintDocuments(LintDocumentsRequest) returns (LintDocumentsResponse);

  // Returns a document.
  rpc GetDocumentRules(GetDocumentRulesRequest) returns (GetDocumentRulesResponse);
}

// The request of `ValidateDocument`.
message ValidateDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  ValidateDocumentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDocument`.
message ValidateDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  ValidateDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

