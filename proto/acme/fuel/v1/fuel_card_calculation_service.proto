  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  ExplainFuelCardCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

