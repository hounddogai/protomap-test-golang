syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/drivers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelProto";
option java_package = "com.acme.fuel.v1";

// Where a fuel card is in its lifecycle.
enum FuelCardStatus {
  FUEL_CARD_STATUS_UNSPECIFIED = 0;
  FUEL_CARD_STATUS_PENDING = 1;
  FUEL_CARD_STATUS_OPEN = 2;
  FUEL_CARD_STATUS_FROZEN = 3;
  FUEL_CARD_STATUS_CLOSED = 4;
}

// Where a fuel transaction is in its lifecycle.
enum FuelTransactionStatus {
  FUEL_TRANSACTION_STATUS_UNSPECIFIED = 0;
  FUEL_TRANSACTION_STATUS_RECEIVED = 1;
  FUEL_TRANSACTION_STATUS_PROCESSED = 2;
  FUEL_TRANSACTION_STATUS_DISCARDED = 3;
}

// Where a fuel policy is in its lifecycle.
enum FuelPolicyStatus {
  FUEL_POLICY_STATUS_UNSPECIFIED = 0;
  FUEL_POLICY_STATUS_DRAFT = 1;
  FUEL_POLICY_STATUS_ENABLED = 2;
  FUEL_POLICY_STATUS_DISABLED = 3;
  FUEL_POLICY_STATUS_RETIRED = 4;
}

// The limit of a fuel card.
message FuelCardLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of a fuel card.
message FuelCardCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of a fuel card.
message FuelCardBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// A fuel card of the fuel domain.
message FuelCard {
  string fuel_card_id = 1;
  acme.drivers.v1.DriverRef holder = 2;
  FuelCardStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated FuelCardLimit limits = 7;
  oneof funding {
    FuelCardCardFunding card = 8;
    FuelCardBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The measurement of a fuel transaction.
message FuelTransactionMeasurement {
  string metric = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// A fuel transaction of the fuel domain.
message FuelTransaction {
  string fuel_transaction_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string source = 4;
  acme.customers.v1.CustomerRef subject = 5;
  map<string, string> attributes = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Any detail = 8;
  repeated FuelTransactionMeasurement measurements = 9;
  string correlation_id = 10;
  int64 sequence = 11;
}

// The condition of a fuel policy.
message FuelPolicyCondition {
  string attribute = 1;
  string operator = 2;
  string value = 3;
  bool negate = 4;
}

// The discount action of a fuel policy.
message FuelPolicyDiscountAction {
  double percent = 1;
  acme.common.v1.Money amount = 2;
}

// The route action of a fuel policy.
message FuelPolicyRouteAction {
  string target = 1;
  int32 weight = 2;
}

// The block action of a fuel policy.
message FuelPolicyBlockAction {
  string reason = 1;
  string notify_email = 2;
}

// A fuel policy of the fuel domain.
message FuelPolicy {
  string fuel_policy_id = 1;
  string name = 2;
  string description = 3;
  FuelPolicyStatus status = 4;
  int32 priority = 5;
  repeated FuelPolicyCondition conditions = 6;
  oneof action {
    FuelPolicyDiscountAction discount = 7;
    FuelPolicyRouteAction route = 8;
    FuelPolicyBlockAction block = 9;
  }
  acme.common.v1.TimeWindow effective = 10;
  repeated string scopes = 11;
  map<string, string> parameters = 12;
  int64 version = 13;
  acme.identity.v1.UserRef owner = 14;
  acme.common.v1.AuditInfo audit = 15;
}
