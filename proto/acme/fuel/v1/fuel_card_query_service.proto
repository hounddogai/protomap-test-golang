syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardQueryServiceProto";
option java_package = "com.acme.fuel.v1";

// Answers read-only questions about fuel cards, for screens and reports.
service FuelCardQueryService {
  // Returns a fuel card.
  rpc LookupFuelCard(LookupFuelCardRequest) returns (LookupFuelCardResponse);

  // Lists fuel cards a page at a time.
  rpc BrowseFuelCards(BrowseFuelCardsRequest) returns (BrowseFuelCardsResponse);

  // Lists fuel cards a page at a time.
  rpc FindFuelCards(FindFuelCardsRequest) returns (FindFuelCardsResponse);

  // Counts fuel cards by status.
  rpc CountFuelCards(CountFuelCardsRequest) returns (CountFuelCardsResponse);

  // Returns several fuel cards at once.
  rpc ResolveFuelCards(ResolveFuelCardsRequest) returns (ResolveFuelCardsResponse);

  // Streams every matching fuel card.
  rpc ExportFuelCards(ExportFuelCardsRequest) returns (stream ExportFuelCardsResponse);

  // Summarizes a fuel card.
  rpc SummarizeFuelCards(SummarizeFuelCardsRequest) returns (SummarizeFuelCardsResponse);

  // Lists fuel cards a page at a time.
  rpc SuggestFuelCards(SuggestFuelCardsRequest) returns (SuggestFuelCardsResponse);

  // Returns a fuel card.
  rpc PeekFuelCard(PeekFuelCardRequest) returns (PeekFuelCardResponse);
}

// The request of `LookupFuelCard`.
message LookupFuelCardRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFuelCard`.
message LookupFuelCardResponse {
  FuelCard fuel_card = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFuelCards`.
message BrowseFuelCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFuelCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFuelCards`.
message BrowseFuelCardsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindFuelCards`.
message FindFuelCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindFuelCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindFuelCards`.
message FindFuelCardsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFuelCards`.
message CountFuelCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFuelCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFuelCards`.
message CountFuelCardsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveFuelCards`.
message ResolveFuelCardsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string fuel_card_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveFuelCards`.
message ResolveFuelCardsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFuelCards`.
message ExportFuelCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFuelCardsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFuelCards`.
message ExportFuelCardsResponse {
  FuelCard fuel_card = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFuelCards`.
message SummarizeFuelCardsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  SummarizeFuelCardsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFuelCards`.
message SummarizeFuelCardsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestFuelCards`.
message SuggestFuelCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestFuelCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestFuelCards`.
message SuggestFuelCardsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekFuelCard`.
message PeekFuelCardRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFuelCard`.
message PeekFuelCardResponse {
  FuelCard fuel_card = 1;
  acme.common.v1.OperationResult result = 2;
}
