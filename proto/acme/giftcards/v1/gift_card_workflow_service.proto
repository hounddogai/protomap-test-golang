syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardWorkflowServiceProto";
option java_package = "com.acme.giftcards.v1";

// Runs the long-lived workflow that takes a gift card from start to finish.
service GiftCardWorkflowService {
  // Starts a gift card.
  rpc StartGiftCardWorkflow(StartGiftCardWorkflowRequest) returns (StartGiftCardWorkflowResponse);

  // Advances a gift card.
  rpc AdvanceGiftCardWorkflow(AdvanceGiftCardWorkflowRequest) returns (AdvanceGiftCardWorkflowResponse);

  // Cancels a gift card.
  rpc CancelGiftCardWorkflow(CancelGiftCardWorkflowRequest) returns (CancelGiftCardWorkflowResponse);

  // Retrys a gift card.
  rpc RetryGiftCardWorkflow(RetryGiftCardWorkflowRequest) returns (RetryGiftCardWorkflowResponse);

  // Pauses a gift card.
  rpc PauseGiftCardWorkflow(PauseGiftCardWorkflowRequest) returns (PauseGiftCardWorkflowResponse);

  // Returns a gift card.
  rpc InspectGiftCardWorkflow(InspectGiftCardWorkflowRequest) returns (InspectGiftCardWorkflowResponse);

  // Signals a gift card.
  rpc SignalGiftCardWorkflow(SignalGiftCardWorkflowRequest) returns (SignalGiftCardWorkflowResponse);
}

// The request of `StartGiftCardWorkflow`.
message StartGiftCardWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_id = 2;
  GiftCard gift_card = 3;
  StartGiftCardWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartGiftCardWorkflow`.
message StartGiftCardWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCard gift_card = 1;
  StartGiftCardWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

