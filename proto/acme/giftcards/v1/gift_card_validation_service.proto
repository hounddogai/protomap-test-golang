syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardValidationServiceProto";
option java_package = "com.acme.giftcards.v1";

// Checks gift cards against the rules before anything acts on them.
service GiftCardValidationService {
  // Validates a gift card.
  rpc ValidateGiftCard(ValidateGiftCardRequest) returns (ValidateGiftCardResponse);

  // Previews a gift card.
  rpc PreviewGiftCard(PreviewGiftCardRequest) returns (PreviewGiftCardResponse);

  // Checks a gift card.
  rpc CheckGiftCardEligibility(CheckGiftCardEligibilityRequest) returns (CheckGiftCardEligibilityResponse);

  // Normalizes a gift card.
  rpc NormalizeGiftCard(NormalizeGiftCardRequest) returns (NormalizeGiftCardResponse);

  // Explains a gift card.
  rpc ExplainGiftCardDecision(ExplainGiftCardDecisionRequest) returns (ExplainGiftCardDecisionResponse);

  // Scores a gift card.
  rpc ScoreGiftCard(ScoreGiftCardRequest) returns (ScoreGiftCardResponse);

  // Returns a gift card.
  rpc GetGiftCardRules(GetGiftCardRulesRequest) returns (GetGiftCardRulesResponse);
}

// The request of `ValidateGiftCard`.
message ValidateGiftCardRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_id = 2;
  GiftCard gift_card = 3;
  ValidateGiftCardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGiftCard`.
message ValidateGiftCardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCard gift_card = 1;
  ValidateGiftCardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

