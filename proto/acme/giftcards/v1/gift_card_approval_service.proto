syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/giftcards/v1/giftcards.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardApprovalServiceProto";
option java_package = "com.acme.giftcards.v1";

// Routes gift cards through approval, with escalation and delegation.
service GiftCardApprovalService {
  // Submits a gift card.
  rpc SubmitGiftCard(SubmitGiftCardRequest) returns (SubmitGiftCardResponse);

  // Approves a gift card.
  rpc ApproveGiftCard(ApproveGiftCardRequest) returns (ApproveGiftCardResponse);

  // Rejects a gift card.
  rpc RejectGiftCard(RejectGiftCardRequest) returns (RejectGiftCardResponse);

  // Lists gift cards a page at a time.
  rpc ListPendingGiftCards(ListPendingGiftCardsRequest) returns (ListPendingGiftCardsResponse);

  // Delegates a gift card.
  rpc DelegateGiftCardApproval(DelegateGiftCardApprovalRequest) returns (DelegateGiftCardApprovalResponse);

  // Recalls a gift card.
  rpc RecallGiftCard(RecallGiftCardRequest) returns (RecallGiftCardResponse);
}

// The request of `SubmitGiftCard`.
message SubmitGiftCardRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_id = 2;
  GiftCard gift_card = 3;
  SubmitGiftCardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitGiftCard`.
message SubmitGiftCardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCard gift_card = 1;
  SubmitGiftCardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

