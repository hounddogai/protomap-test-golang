syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardTransactionValidationServiceProto";
option java_package = "com.acme.giftcards.v1";

// Checks gift card transactions against the rules before anything acts on them.
service GiftCardTransactionValidationService {
  // Validates a gift card transaction.
  rpc ValidateGiftCardTransaction(ValidateGiftCardTransactionRequest) returns (ValidateGiftCardTransactionResponse);

  // Previews a gift card transaction.
  rpc PreviewGiftCardTransaction(PreviewGiftCardTransactionRequest) returns (PreviewGiftCardTransactionResponse);

  // Checks a gift card transaction.
  rpc CheckGiftCardTransactionEligibility(CheckGiftCardTransactionEligibilityRequest) returns (CheckGiftCardTransactionEligibilityResponse);

  // Normalizes a gift card transaction.
  rpc NormalizeGiftCardTransaction(NormalizeGiftCardTransactionRequest) returns (NormalizeGiftCardTransactionResponse);

  // Scores a gift card transaction.
  rpc ScoreGiftCardTransaction(ScoreGiftCardTransactionRequest) returns (ScoreGiftCardTransactionResponse);

  // Lints a gift card transaction.
  rpc LintGiftCardTransactions(LintGiftCardTransactionsRequest) returns (LintGiftCardTransactionsResponse);
}

// The request of `ValidateGiftCardTransaction`.
message ValidateGiftCardTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_transaction_id = 2;
  GiftCardTransaction gift_card_transaction = 3;
  ValidateGiftCardTransactionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGiftCardTransaction`.
message ValidateGiftCardTransactionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardTransaction gift_card_transaction = 1;
  ValidateGiftCardTransactionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

