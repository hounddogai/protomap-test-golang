syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardBatchWorkflowServiceProto";
option java_package = "com.acme.giftcards.v1";

// Runs the long-lived workflow that takes a gift card batch from start to finish.
service GiftCardBatchWorkflowService {
  // Starts a gift card batch.
  rpc StartGiftCardBatchWorkflow(StartGiftCardBatchWorkflowRequest) returns (StartGiftCardBatchWorkflowResponse);

  // Advances a gift card batch.
  rpc AdvanceGiftCardBatchWorkflow(AdvanceGiftCardBatchWorkflowRequest) returns (AdvanceGiftCardBatchWorkflowResponse);

  // Cancels a gift card batch.
  rpc CancelGiftCardBatchWorkflow(CancelGiftCardBatchWorkflowRequest) returns (CancelGiftCardBatchWorkflowResponse);

  // Retrys a gift card batch.
  rpc RetryGiftCardBatchWorkflow(RetryGiftCardBatchWorkflowRequest) returns (RetryGiftCardBatchWorkflowResponse);

  // Pauses a gift card batch.
  rpc PauseGiftCardBatchWorkflow(PauseGiftCardBatchWorkflowRequest) returns (PauseGiftCardBatchWorkflowResponse);

  // Resumes a gift card batch.
  rpc ResumeGiftCardBatchWorkflow(ResumeGiftCardBatchWorkflowRequest) returns (ResumeGiftCardBatchWorkflowResponse);

  // Returns a gift card batch.
  rpc InspectGiftCardBatchWorkflow(InspectGiftCardBatchWorkflowRequest) returns (InspectGiftCardBatchWorkflowResponse);

  // Lists gift card batches a page at a time.
  rpc ListGiftCardBatchWorkflows(ListGiftCardBatchWorkflowsRequest) returns (ListGiftCardBatchWorkflowsResponse);

  // Signals a gift card batch.
  rpc SignalGiftCardBatchWorkflow(SignalGiftCardBatchWorkflowRequest) returns (SignalGiftCardBatchWorkflowResponse);
}

// The request of `StartGiftCardBatchWorkflow`.
message StartGiftCardBatchWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_batch_id = 2;
  GiftCardBatch gift_card_batch = 3;
  StartGiftCardBatchWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartGiftCardBatchWorkflow`.
message StartGiftCardBatchWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardBatch gift_card_batch = 1;
  StartGiftCardBatchWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

