syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardTransactionCalculationServiceProto";
option java_package = "com.acme.giftcards.v1";

// Computes the figures of a gift card transaction, such as totals, taxes, and estimates.
service GiftCardTransactionCalculationService {
  // Calculates a gift card transaction.
  rpc CalculateGiftCardTransaction(CalculateGiftCardTransactionRequest) returns (CalculateGiftCardTransactionResponse);

  // Estimates a gift card transaction.
  rpc EstimateGiftCardTransaction(EstimateGiftCardTransactionRequest) returns (EstimateGiftCardTransactionResponse);

  // Quotes a gift card transaction.
  rpc QuoteGiftCardTransaction(QuoteGiftCardTransactionRequest) returns (QuoteGiftCardTransactionResponse);

  // Compares a gift card transaction.
  rpc CompareGiftCardTransactionOptions(CompareGiftCardTransactionOptionsRequest) returns (CompareGiftCardTransactionOptionsResponse);

  // Recalculates a gift card transaction.
  rpc RecalculateGiftCardTransactions(RecalculateGiftCardTransactionsRequest) returns (RecalculateGiftCardTransactionsResponse);

  // Simulates a gift card transaction.
  rpc SimulateGiftCardTransaction(SimulateGiftCardTransactionRequest) returns (SimulateGiftCardTransactionResponse);

  // Explains a gift card transaction.
  rpc ExplainGiftCardTransactionCalculation(ExplainGiftCardTransactionCalculationRequest) returns (ExplainGiftCardTransactionCalculationResponse);

  // Returns a gift card transaction.
  rpc GetGiftCardTransactionRates(GetGiftCardTransactionRatesRequest) returns (GetGiftCardTransactionRatesResponse);
}

// The request of `CalculateGiftCardTransaction`.
message CalculateGiftCardTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_transaction_id = 2;
  GiftCardTransaction gift_card_transaction = 3;
  CalculateGiftCardTransactionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateGiftCardTransaction`.
message CalculateGiftCardTransactionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateGiftCardTransactionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  GiftCardTransaction gift_card_transaction = 1;
  CalculateGiftCardTransactionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

