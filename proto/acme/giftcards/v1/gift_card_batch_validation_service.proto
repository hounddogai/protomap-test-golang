syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardBatchValidationServiceProto";
option java_package = "com.acme.giftcards.v1";

// Checks gift card batches against the rules before anything acts on them.
service GiftCardBatchValidationService {
  // Validates a gift card batch.
  rpc ValidateGiftCardBatch(ValidateGiftCardBatchRequest) returns (ValidateGiftCardBatchResponse);

  // Previews a gift card batch.
  rpc PreviewGiftCardBatch(PreviewGiftCardBatchRequest) returns (PreviewGiftCardBatchResponse);

  // Checks a gift card batch.
  rpc CheckGiftCardBatchEligibility(CheckGiftCardBatchEligibilityRequest) returns (CheckGiftCardBatchEligibilityResponse);

  // Normalizes a gift card batch.
  rpc NormalizeGiftCardBatch(NormalizeGiftCardBatchRequest) returns (NormalizeGiftCardBatchResponse);

  // Explains a gift card batch.
  rpc ExplainGiftCardBatchDecision(ExplainGiftCardBatchDecisionRequest) returns (ExplainGiftCardBatchDecisionResponse);

  // Scores a gift card batch.
  rpc ScoreGiftCardBatch(ScoreGiftCardBatchRequest) returns (ScoreGiftCardBatchResponse);

  // Lints a gift card batch.
  rpc LintGiftCardBatches(LintGiftCardBatchesRequest) returns (LintGiftCardBatchesResponse);

  // Returns a gift card batch.
  rpc GetGiftCardBatchRules(GetGiftCardBatchRulesRequest) returns (GetGiftCardBatchRulesResponse);
}

// The request of `ValidateGiftCardBatch`.
message ValidateGiftCardBatchRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_batch_id = 2;
  GiftCardBatch gift_card_batch = 3;
  ValidateGiftCardBatchRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGiftCardBatch`.
message ValidateGiftCardBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardBatch gift_card_batch = 1;
  ValidateGiftCardBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

