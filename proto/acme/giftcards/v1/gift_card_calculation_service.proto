  }

  GiftCard gift_card = 1;
  ExplainGiftCardCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetGiftCardRates`.
message GetGiftCardRatesRequest {
  acme.common.v1.RequestContext context = 1;
