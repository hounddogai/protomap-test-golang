  acme.common.v1.RequestContext context = 1;
  string gift_card_batch_id = 2;
  GiftCardBatch gift_card_batch = 3;
  ExplainGiftCardBatchCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

