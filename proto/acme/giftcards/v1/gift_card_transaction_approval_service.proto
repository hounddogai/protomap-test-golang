syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/giftcards/v1/giftcards.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardTransactionApprovalServiceProto";
option java_package = "com.acme.giftcards.v1";

// Routes gift card transactions through approval, with escalation and delegation.
service GiftCardTransactionApprovalService {
  // Submits a gift card transaction.
  rpc SubmitGiftCardTransaction(SubmitGiftCardTransactionRequest) returns (SubmitGiftCardTransactionResponse);

  // Approves a gift card transaction.
  rpc ApproveGiftCardTransaction(ApproveGiftCardTransactionRequest) returns (ApproveGiftCardTransactionResponse);

  // Escalates a gift card transaction.
  rpc EscalateGiftCardTransaction(EscalateGiftCardTransactionRequest) returns (EscalateGiftCardTransactionResponse);

  // Delegates a gift card transaction.
  rpc DelegateGiftCardTransactionApproval(DelegateGiftCardTransactionApprovalRequest) returns (DelegateGiftCardTransactionApprovalResponse);

  // Returns a gift card transaction.
  rpc GetGiftCardTransactionApprovalStatus(GetGiftCardTransactionApprovalStatusRequest) returns (GetGiftCardTransactionApprovalStatusResponse);

  // Comments a gift card transaction.
  rpc CommentGiftCardTransactionApproval(CommentGiftCardTransactionApprovalRequest) returns (CommentGiftCardTransactionApprovalResponse);
}

// The request of `SubmitGiftCardTransaction`.
message SubmitGiftCardTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_transaction_id = 2;
  GiftCardTransaction gift_card_transaction = 3;
  SubmitGiftCardTransactionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitGiftCardTransaction`.
message SubmitGiftCardTransactionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardTransaction gift_card_transaction = 1;
  SubmitGiftCardTransactionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveGiftCardTransaction`.
message ApproveGiftCardTransactionRequest {
  // What the operation needs besides the record.
