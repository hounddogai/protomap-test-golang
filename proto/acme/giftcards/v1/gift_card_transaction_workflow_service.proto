syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardTransactionWorkflowServiceProto";
option java_package = "com.acme.giftcards.v1";

// Runs the long-lived workflow that takes a gift card transaction from start to finish.
service GiftCardTransactionWorkflowService {
  // Starts a gift card transaction.
  rpc StartGiftCardTransactionWorkflow(StartGiftCardTransactionWorkflowRequest) returns (StartGiftCardTransactionWorkflowResponse);

  // Advances a gift card transaction.
  rpc AdvanceGiftCardTransactionWorkflow(AdvanceGiftCardTransactionWorkflowRequest) returns (AdvanceGiftCardTransactionWorkflowResponse);

  // Cancels a gift card transaction.
  rpc CancelGiftCardTransactionWorkflow(CancelGiftCardTransactionWorkflowRequest) returns (CancelGiftCardTransactionWorkflowResponse);

  // Pauses a gift card transaction.
  rpc PauseGiftCardTransactionWorkflow(PauseGiftCardTransactionWorkflowRequest) returns (PauseGiftCardTransactionWorkflowResponse);

  // Resumes a gift card transaction.
  rpc ResumeGiftCardTransactionWorkflow(ResumeGiftCardTransactionWorkflowRequest) returns (ResumeGiftCardTransactionWorkflowResponse);

  // Returns a gift card transaction.
  rpc InspectGiftCardTransactionWorkflow(InspectGiftCardTransactionWorkflowRequest) returns (InspectGiftCardTransactionWorkflowResponse);

  // Lists gift card transactions a page at a time.
  rpc ListGiftCardTransactionWorkflows(ListGiftCardTransactionWorkflowsRequest) returns (ListGiftCardTransactionWorkflowsResponse);

  // Signals a gift card transaction.
  rpc SignalGiftCardTransactionWorkflow(SignalGiftCardTransactionWorkflowRequest) returns (SignalGiftCardTransactionWorkflowResponse);
}

// The request of `StartGiftCardTransactionWorkflow`.
message StartGiftCardTransactionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_transaction_id = 2;
  GiftCardTransaction gift_card_transaction = 3;
  StartGiftCardTransactionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartGiftCardTransactionWorkflow`.
message StartGiftCardTransactionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardTransaction gift_card_transaction = 1;
  StartGiftCardTransactionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

