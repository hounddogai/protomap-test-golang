option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardTransactionLifecycleServiceProto";
option java_package = "com.acme.giftcards.v1";

// Moves a gift card transaction between the states of its lifecycle.
service GiftCardTransactionLifecycleService {
  // Activates a gift card transaction.
  rpc ActivateGiftCardTransaction(ActivateGiftCardTransactionRequest) returns (ActivateGiftCardTransactionResponse);

  // Suspends a gift card transaction.
  rpc SuspendGiftCardTransaction(SuspendGiftCardTransactionRequest) returns (SuspendGiftCardTransactionResponse);

  // Reinstates a gift card transaction.
  rpc ReinstateGiftCardTransaction(ReinstateGiftCardTransactionRequest) returns (ReinstateGiftCardTransactionResponse);

  // Terminates a gift card transaction.
  rpc TerminateGiftCardTransaction(TerminateGiftCardTransactionRequest) returns (TerminateGiftCardTransactionResponse);

  // Renews a gift card transaction.
  rpc RenewGiftCardTransaction(RenewGiftCardTransactionRequest) returns (RenewGiftCardTransactionResponse);

  // Expires a gift card transaction.
  rpc ExpireGiftCardTransaction(ExpireGiftCardTransactionRequest) returns (ExpireGiftCardTransactionResponse);

  // Returns a gift card transaction.
  rpc GetGiftCardTransactionLifecycle(GetGiftCardTransactionLifecycleRequest) returns (GetGiftCardTransactionLifecycleResponse);

  // Schedules a gift card transaction.
  rpc ScheduleGiftCardTransactionExpiry(ScheduleGiftCardTransactionExpiryRequest) returns (ScheduleGiftCardTransactionExpiryResponse);
}

// The request of `ActivateGiftCardTransaction`.
message ActivateGiftCardTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_transaction_id = 2;
  ActivateGiftCardTransactionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateGiftCardTransaction`.
message ActivateGiftCardTransactionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardTransaction gift_card_transaction = 1;
  ActivateGiftCardTransactionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

