syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/giftcards/v1/giftcards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardQueryServiceProto";
option java_package = "com.acme.giftcards.v1";

// Answers read-only questions about gift cards, for screens and reports.
service GiftCardQueryService {
  // Returns a gift card.
  rpc LookupGiftCard(LookupGiftCardRequest) returns (LookupGiftCardResponse);

  // Lists gift cards a page at a time.
  rpc BrowseGiftCards(BrowseGiftCardsRequest) returns (BrowseGiftCardsResponse);

  // Lists gift cards a page at a time.
  rpc FindGiftCards(FindGiftCardsRequest) returns (FindGiftCardsResponse);

  // Counts gift cards by status.
  rpc CountGiftCards(CountGiftCardsRequest) returns (CountGiftCardsResponse);

  // Returns several gift cards at once.
  rpc ResolveGiftCards(ResolveGiftCardsRequest) returns (ResolveGiftCardsResponse);

  // Streams every matching gift card.
  rpc ExportGiftCards(ExportGiftCardsRequest) returns (stream ExportGiftCardsResponse);

  // Summarizes a gift card.
  rpc SummarizeGiftCards(SummarizeGiftCardsRequest) returns (SummarizeGiftCardsResponse);

  // Lists gift cards a page at a time.
  rpc SuggestGiftCards(SuggestGiftCardsRequest) returns (SuggestGiftCardsResponse);

  // Returns a gift card.
  rpc PeekGiftCard(PeekGiftCardRequest) returns (PeekGiftCardResponse);
}

// The request of `LookupGiftCard`.
message LookupGiftCardRequest {
  acme.common.v1.RequestContext context = 1;
  string gift_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupGiftCard`.
message LookupGiftCardResponse {
  GiftCard gift_card = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseGiftCards`.
message BrowseGiftCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GiftCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseGiftCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseGiftCards`.
message BrowseGiftCardsResponse {
  repeated GiftCard gift_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindGiftCards`.
message FindGiftCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GiftCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindGiftCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindGiftCards`.
message FindGiftCardsResponse {
  repeated GiftCard gift_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountGiftCards`.
message CountGiftCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GiftCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountGiftCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountGiftCards`.
message CountGiftCardsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveGiftCards`.
message ResolveGiftCardsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string gift_card_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveGiftCards`.
message ResolveGiftCardsResponse {
  repeated GiftCard gift_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportGiftCards`.
message ExportGiftCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GiftCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportGiftCardsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportGiftCards`.
message ExportGiftCardsResponse {
  GiftCard gift_card = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeGiftCards`.
message SummarizeGiftCardsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_id = 2;
  SummarizeGiftCardsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeGiftCards`.
message SummarizeGiftCardsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestGiftCards`.
message SuggestGiftCardsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GiftCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestGiftCardsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestGiftCards`.
message SuggestGiftCardsResponse {
  repeated GiftCard gift_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekGiftCard`.
message PeekGiftCardRequest {
  acme.common.v1.RequestContext context = 1;
  string gift_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekGiftCard`.
message PeekGiftCardResponse {
  GiftCard gift_card = 1;
  acme.common.v1.OperationResult result = 2;
}
