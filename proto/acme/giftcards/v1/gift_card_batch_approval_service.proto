syntax = "proto3";

package acme.giftcards.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/giftcards/v1/giftcards.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Giftcards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/giftcards/v1;giftcardsv1";
option java_multiple_files = true;
option java_outer_classname = "GiftCardBatchApprovalServiceProto";
option java_package = "com.acme.giftcards.v1";

// Routes gift card batches through approval, with escalation and delegation.
service GiftCardBatchApprovalService {
  // Submits a gift card batch.
  rpc SubmitGiftCardBatch(SubmitGiftCardBatchRequest) returns (SubmitGiftCardBatchResponse);

  // Approves a gift card batch.
  rpc ApproveGiftCardBatch(ApproveGiftCardBatchRequest) returns (ApproveGiftCardBatchResponse);

  // Escalates a gift card batch.
  rpc EscalateGiftCardBatch(EscalateGiftCardBatchRequest) returns (EscalateGiftCardBatchResponse);

  // Lists gift card batches a page at a time.
  rpc ListPendingGiftCardBatches(ListPendingGiftCardBatchesRequest) returns (ListPendingGiftCardBatchesResponse);

  // Delegates a gift card batch.
  rpc DelegateGiftCardBatchApproval(DelegateGiftCardBatchApprovalRequest) returns (DelegateGiftCardBatchApprovalResponse);

  // Recalls a gift card batch.
  rpc RecallGiftCardBatch(RecallGiftCardBatchRequest) returns (RecallGiftCardBatchResponse);

  // Returns a gift card batch.
  rpc GetGiftCardBatchApprovalStatus(GetGiftCardBatchApprovalStatusRequest) returns (GetGiftCardBatchApprovalStatusResponse);
}

// The request of `SubmitGiftCardBatch`.
message SubmitGiftCardBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gift_card_batch_id = 2;
  GiftCardBatch gift_card_batch = 3;
  SubmitGiftCardBatchRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitGiftCardBatch`.
message SubmitGiftCardBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardBatch gift_card_batch = 1;
  SubmitGiftCardBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveGiftCardBatch`.
message ApproveGiftCardBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
