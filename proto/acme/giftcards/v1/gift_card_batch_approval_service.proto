// The response of `ApproveGiftCardBatch`.
message ApproveGiftCardBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GiftCardBatch gift_card_batch = 1;
  ApproveGiftCardBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

