syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "TierCalculationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Computes the figures of a tier, such as totals, taxes, and estimates.
service TierCalculationService {
  // Calculates a tier.
  rpc CalculateTier(CalculateTierRequest) returns (CalculateTierResponse);

  // Estimates a tier.
  rpc EstimateTier(EstimateTierRequest) returns (EstimateTierResponse);

  // Quotes a tier.
  rpc QuoteTier(QuoteTierRequest) returns (QuoteTierResponse);

  // Compares a tier.
  rpc CompareTierOptions(CompareTierOptionsRequest) returns (CompareTierOptionsResponse);

  // Recalculates a tier.
  rpc RecalculateTiers(RecalculateTiersRequest) returns (RecalculateTiersResponse);

  // Simulates a tier.
  rpc SimulateTier(SimulateTierRequest) returns (SimulateTierResponse);

  // Returns a tier.
  rpc GetTierRates(GetTierRatesRequest) returns (GetTierRatesResponse);
}

// The request of `CalculateTier`.
message CalculateTierRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  Tier tier = 3;
  CalculateTierRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTier`.
message CalculateTierResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTierResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Tier tier = 1;
  CalculateTierResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

