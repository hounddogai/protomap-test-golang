syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "RewardCalculationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Computes the figures of a reward, such as totals, taxes, and estimates.
service RewardCalculationService {
  // Calculates a reward.
  rpc CalculateReward(CalculateRewardRequest) returns (CalculateRewardResponse);

  // Estimates a reward.
  rpc EstimateReward(EstimateRewardRequest) returns (EstimateRewardResponse);

  // Quotes a reward.
  rpc QuoteReward(QuoteRewardRequest) returns (QuoteRewardResponse);

  // Compares a reward.
  rpc CompareRewardOptions(CompareRewardOptionsRequest) returns (CompareRewardOptionsResponse);

  // Recalculates a reward.
  rpc RecalculateRewards(RecalculateRewardsRequest) returns (RecalculateRewardsResponse);

  // Simulates a reward.
  rpc SimulateReward(SimulateRewardRequest) returns (SimulateRewardResponse);

  // Returns a reward.
  rpc GetRewardRates(GetRewardRatesRequest) returns (GetRewardRatesResponse);
}

// The request of `CalculateReward`.
message CalculateRewardRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string reward_id = 2;
  Reward reward = 3;
  CalculateRewardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReward`.
message CalculateRewardResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRewardResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Reward reward = 1;
  CalculateRewardResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

