option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "PointsLedgerWorkflowServiceProto";
option java_package = "com.acme.loyalty.v1";

// Runs the long-lived workflow that takes a points ledger from start to finish.
service PointsLedgerWorkflowService {
  // Starts a points ledger.
  rpc StartPointsLedgerWorkflow(StartPointsLedgerWorkflowRequest) returns (StartPointsLedgerWorkflowResponse);

  // Advances a points ledger.
  rpc AdvancePointsLedgerWorkflow(AdvancePointsLedgerWorkflowRequest) returns (AdvancePointsLedgerWorkflowResponse);

  // Cancels a points ledger.
  rpc CancelPointsLedgerWorkflow(CancelPointsLedgerWorkflowRequest) returns (CancelPointsLedgerWorkflowResponse);

  // Retrys a points ledger.
  rpc RetryPointsLedgerWorkflow(RetryPointsLedgerWorkflowRequest) returns (RetryPointsLedgerWorkflowResponse);

  // Pauses a points ledger.
  rpc PausePointsLedgerWorkflow(PausePointsLedgerWorkflowRequest) returns (PausePointsLedgerWorkflowResponse);

  // Returns a points ledger.
  rpc InspectPointsLedgerWorkflow(InspectPointsLedgerWorkflowRequest) returns (InspectPointsLedgerWorkflowResponse);

  // Lists points ledgers a page at a time.
  rpc ListPointsLedgerWorkflows(ListPointsLedgerWorkflowsRequest) returns (ListPointsLedgerWorkflowsResponse);

  // Signals a points ledger.
  rpc SignalPointsLedgerWorkflow(SignalPointsLedgerWorkflowRequest) returns (SignalPointsLedgerWorkflowResponse);
}

// The request of `StartPointsLedgerWorkflow`.
message StartPointsLedgerWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  PointsLedger points_ledger = 3;
  StartPointsLedgerWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPointsLedgerWorkflow`.
message StartPointsLedgerWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PointsLedger points_ledger = 1;
  StartPointsLedgerWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

