syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "LoyaltyMemberValidationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Checks loyalty members against the rules before anything acts on them.
service LoyaltyMemberValidationService {
  // Validates a loyalty member.
  rpc ValidateLoyaltyMember(ValidateLoyaltyMemberRequest) returns (ValidateLoyaltyMemberResponse);

  // Previews a loyalty member.
  rpc PreviewLoyaltyMember(PreviewLoyaltyMemberRequest) returns (PreviewLoyaltyMemberResponse);

  // Checks a loyalty member.
  rpc CheckLoyaltyMemberEligibility(CheckLoyaltyMemberEligibilityRequest) returns (CheckLoyaltyMemberEligibilityResponse);

  // Normalizes a loyalty member.
  rpc NormalizeLoyaltyMember(NormalizeLoyaltyMemberRequest) returns (NormalizeLoyaltyMemberResponse);

  // Explains a loyalty member.
  rpc ExplainLoyaltyMemberDecision(ExplainLoyaltyMemberDecisionRequest) returns (ExplainLoyaltyMemberDecisionResponse);

  // Scores a loyalty member.
  rpc ScoreLoyaltyMember(ScoreLoyaltyMemberRequest) returns (ScoreLoyaltyMemberResponse);

  // Lints a loyalty member.
  rpc LintLoyaltyMembers(LintLoyaltyMembersRequest) returns (LintLoyaltyMembersResponse);

  // Returns a loyalty member.
  rpc GetLoyaltyMemberRules(GetLoyaltyMemberRulesRequest) returns (GetLoyaltyMemberRulesResponse);
}

// The request of `ValidateLoyaltyMember`.
message ValidateLoyaltyMemberRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string loyalty_member_id = 2;
  LoyaltyMember loyalty_member = 3;
  ValidateLoyaltyMemberRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLoyaltyMember`.
message ValidateLoyaltyMemberResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LoyaltyMember loyalty_member = 1;
  ValidateLoyaltyMemberResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

