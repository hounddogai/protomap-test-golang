syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "PointsLedgerCalculationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Computes the figures of a points ledger, such as totals, taxes, and estimates.
service PointsLedgerCalculationService {
  // Calculates a points ledger.
  rpc CalculatePointsLedger(CalculatePointsLedgerRequest) returns (CalculatePointsLedgerResponse);

  // Estimates a points ledger.
  rpc EstimatePointsLedger(EstimatePointsLedgerRequest) returns (EstimatePointsLedgerResponse);

  // Quotes a points ledger.
  rpc QuotePointsLedger(QuotePointsLedgerRequest) returns (QuotePointsLedgerResponse);

  // Compares a points ledger.
  rpc ComparePointsLedgerOptions(ComparePointsLedgerOptionsRequest) returns (ComparePointsLedgerOptionsResponse);

  // Recalculates a points ledger.
  rpc RecalculatePointsLedgers(RecalculatePointsLedgersRequest) returns (RecalculatePointsLedgersResponse);

  // Simulates a points ledger.
  rpc SimulatePointsLedger(SimulatePointsLedgerRequest) returns (SimulatePointsLedgerResponse);

  // Explains a points ledger.
  rpc ExplainPointsLedgerCalculation(ExplainPointsLedgerCalculationRequest) returns (ExplainPointsLedgerCalculationResponse);

  // Returns a points ledger.
  rpc GetPointsLedgerRates(GetPointsLedgerRatesRequest) returns (GetPointsLedgerRatesResponse);
}

// The request of `CalculatePointsLedger`.
message CalculatePointsLedgerRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  PointsLedger points_ledger = 3;
  CalculatePointsLedgerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePointsLedger`.
message CalculatePointsLedgerResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePointsLedgerResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  PointsLedger points_ledger = 1;
  CalculatePointsLedgerResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

