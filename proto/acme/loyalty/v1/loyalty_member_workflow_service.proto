syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "LoyaltyMemberWorkflowServiceProto";
option java_package = "com.acme.loyalty.v1";

// Runs the long-lived workflow that takes a loyalty member from start to finish.
service LoyaltyMemberWorkflowService {
  // Starts a loyalty member.
  rpc StartLoyaltyMemberWorkflow(StartLoyaltyMemberWorkflowRequest) returns (StartLoyaltyMemberWorkflowResponse);

  // Advances a loyalty member.
  rpc AdvanceLoyaltyMemberWorkflow(AdvanceLoyaltyMemberWorkflowRequest) returns (AdvanceLoyaltyMemberWorkflowResponse);

  // Cancels a loyalty member.
  rpc CancelLoyaltyMemberWorkflow(CancelLoyaltyMemberWorkflowRequest) returns (CancelLoyaltyMemberWorkflowResponse);

  // Retrys a loyalty member.
  rpc RetryLoyaltyMemberWorkflow(RetryLoyaltyMemberWorkflowRequest) returns (RetryLoyaltyMemberWorkflowResponse);

  // Pauses a loyalty member.
  rpc PauseLoyaltyMemberWorkflow(PauseLoyaltyMemberWorkflowRequest) returns (PauseLoyaltyMemberWorkflowResponse);

  // Resumes a loyalty member.
  rpc ResumeLoyaltyMemberWorkflow(ResumeLoyaltyMemberWorkflowRequest) returns (ResumeLoyaltyMemberWorkflowResponse);
}

// The request of `StartLoyaltyMemberWorkflow`.
message StartLoyaltyMemberWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string loyalty_member_id = 2;
  LoyaltyMember loyalty_member = 3;
  StartLoyaltyMemberWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLoyaltyMemberWorkflow`.
message StartLoyaltyMemberWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LoyaltyMember loyalty_member = 1;
  StartLoyaltyMemberWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

