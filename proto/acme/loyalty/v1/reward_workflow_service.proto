syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "RewardWorkflowServiceProto";
option java_package = "com.acme.loyalty.v1";

// Runs the long-lived workflow that takes a reward from start to finish.
service RewardWorkflowService {
  // Starts a reward.
  rpc StartRewardWorkflow(StartRewardWorkflowRequest) returns (StartRewardWorkflowResponse);

  // Advances a reward.
  rpc AdvanceRewardWorkflow(AdvanceRewardWorkflowRequest) returns (AdvanceRewardWorkflowResponse);

  // Cancels a reward.
  rpc CancelRewardWorkflow(CancelRewardWorkflowRequest) returns (CancelRewardWorkflowResponse);

  // Pauses a reward.
  rpc PauseRewardWorkflow(PauseRewardWorkflowRequest) returns (PauseRewardWorkflowResponse);

  // Resumes a reward.
  rpc ResumeRewardWorkflow(ResumeRewardWorkflowRequest) returns (ResumeRewardWorkflowResponse);

  // Returns a reward.
  rpc InspectRewardWorkflow(InspectRewardWorkflowRequest) returns (InspectRewardWorkflowResponse);

  // Lists rewards a page at a time.
  rpc ListRewardWorkflows(ListRewardWorkflowsRequest) returns (ListRewardWorkflowsResponse);

  // Signals a reward.
  rpc SignalRewardWorkflow(SignalRewardWorkflowRequest) returns (SignalRewardWorkflowResponse);
}

// The request of `StartRewardWorkflow`.
message StartRewardWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string reward_id = 2;
  Reward reward = 3;
  StartRewardWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRewardWorkflow`.
message StartRewardWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Reward reward = 1;
  StartRewardWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

