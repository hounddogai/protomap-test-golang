syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "PointsLedgerValidationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Checks points ledgers against the rules before anything acts on them.
service PointsLedgerValidationService {
  // Validates a points ledger.
  rpc ValidatePointsLedger(ValidatePointsLedgerRequest) returns (ValidatePointsLedgerResponse);

  // Previews a points ledger.
  rpc PreviewPointsLedger(PreviewPointsLedgerRequest) returns (PreviewPointsLedgerResponse);

  // Checks a points ledger.
  rpc CheckPointsLedgerEligibility(CheckPointsLedgerEligibilityRequest) returns (CheckPointsLedgerEligibilityResponse);

  // Explains a points ledger.
  rpc ExplainPointsLedgerDecision(ExplainPointsLedgerDecisionRequest) returns (ExplainPointsLedgerDecisionResponse);

  // Scores a points ledger.
  rpc ScorePointsLedger(ScorePointsLedgerRequest) returns (ScorePointsLedgerResponse);

  // Returns a points ledger.
  rpc GetPointsLedgerRules(GetPointsLedgerRulesRequest) returns (GetPointsLedgerRulesResponse);
}

// The request of `ValidatePointsLedger`.
message ValidatePointsLedgerRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  PointsLedger points_ledger = 3;
  ValidatePointsLedgerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePointsLedger`.
message ValidatePointsLedgerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PointsLedger points_ledger = 1;
  ValidatePointsLedgerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewPointsLedger`.
message PreviewPointsLedgerRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
