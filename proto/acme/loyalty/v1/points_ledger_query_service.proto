syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "PointsLedgerQueryServiceProto";
option java_package = "com.acme.loyalty.v1";

// Answers read-only questions about points ledgers, for screens and reports.
service PointsLedgerQueryService {
  // Returns a points ledger.
  rpc LookupPointsLedger(LookupPointsLedgerRequest) returns (LookupPointsLedgerResponse);

  // Lists points ledgers a page at a time.
  rpc BrowsePointsLedgers(BrowsePointsLedgersRequest) returns (BrowsePointsLedgersResponse);

  // Lists points ledgers a page at a time.
  rpc FindPointsLedgers(FindPointsLedgersRequest) returns (FindPointsLedgersResponse);

  // Counts points ledgers by status.
  rpc CountPointsLedgers(CountPointsLedgersRequest) returns (CountPointsLedgersResponse);

  // Streams every matching points ledger.
  rpc ExportPointsLedgers(ExportPointsLedgersRequest) returns (stream ExportPointsLedgersResponse);

  // Summarizes a points ledger.
  rpc SummarizePointsLedgers(SummarizePointsLedgersRequest) returns (SummarizePointsLedgersResponse);

  // Lists points ledgers a page at a time.
  rpc SuggestPointsLedgers(SuggestPointsLedgersRequest) returns (SuggestPointsLedgersResponse);

  // Returns a points ledger.
  rpc PeekPointsLedger(PeekPointsLedgerRequest) returns (PeekPointsLedgerResponse);
}

// The request of `LookupPointsLedger`.
message LookupPointsLedgerRequest {
  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPointsLedger`.
message LookupPointsLedgerResponse {
  PointsLedger points_ledger = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePointsLedgers`.
message BrowsePointsLedgersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PointsLedgerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePointsLedgersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePointsLedgers`.
message BrowsePointsLedgersResponse {
  repeated PointsLedger points_ledgers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPointsLedgers`.
message FindPointsLedgersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PointsLedgerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPointsLedgersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPointsLedgers`.
message FindPointsLedgersResponse {
  repeated PointsLedger points_ledgers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPointsLedgers`.
message CountPointsLedgersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PointsLedgerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPointsLedgersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPointsLedgers`.
message CountPointsLedgersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPointsLedgers`.
message ExportPointsLedgersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PointsLedgerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPointsLedgersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPointsLedgers`.
message ExportPointsLedgersResponse {
  PointsLedger points_ledger = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePointsLedgers`.
message SummarizePointsLedgersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  SummarizePointsLedgersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePointsLedgers`.
message SummarizePointsLedgersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPointsLedgers`.
message SuggestPointsLedgersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PointsLedgerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPointsLedgersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPointsLedgers`.
message SuggestPointsLedgersResponse {
  repeated PointsLedger points_ledgers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPointsLedger`.
message PeekPointsLedgerRequest {
  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPointsLedger`.
message PeekPointsLedgerResponse {
  PointsLedger points_ledger = 1;
  acme.common.v1.OperationResult result = 2;
}
