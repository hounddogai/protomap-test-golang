syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "TierLifecycleServiceProto";
option java_package = "com.acme.loyalty.v1";

// Moves a tier between the states of its lifecycle.
service TierLifecycleService {
  // Activates a tier.
  rpc ActivateTier(ActivateTierRequest) returns (ActivateTierResponse);

  // Suspends a tier.
  rpc SuspendTier(SuspendTierRequest) returns (SuspendTierResponse);

  // Reinstates a tier.
  rpc ReinstateTier(ReinstateTierRequest) returns (ReinstateTierResponse);

  // Terminates a tier.
  rpc TerminateTier(TerminateTierRequest) returns (TerminateTierResponse);

  // Renews a tier.
  rpc RenewTier(RenewTierRequest) returns (RenewTierResponse);

  // Expires a tier.
  rpc ExpireTier(ExpireTierRequest) returns (ExpireTierResponse);

  // Returns a tier.
  rpc GetTierLifecycle(GetTierLifecycleRequest) returns (GetTierLifecycleResponse);
}

// The request of `ActivateTier`.
message ActivateTierRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  ActivateTierRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTier`.
message ActivateTierResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tier tier = 1;
  ActivateTierResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

