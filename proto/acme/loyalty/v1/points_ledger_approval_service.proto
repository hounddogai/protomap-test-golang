syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "PointsLedgerApprovalServiceProto";
option java_package = "com.acme.loyalty.v1";

// Routes points ledgers through approval, with escalation and delegation.
service PointsLedgerApprovalService {
  // Submits a points ledger.
  rpc SubmitPointsLedger(SubmitPointsLedgerRequest) returns (SubmitPointsLedgerResponse);

  // Approves a points ledger.
  rpc ApprovePointsLedger(ApprovePointsLedgerRequest) returns (ApprovePointsLedgerResponse);

  // Rejects a points ledger.
  rpc RejectPointsLedger(RejectPointsLedgerRequest) returns (RejectPointsLedgerResponse);

  // Lists points ledgers a page at a time.
  rpc ListPendingPointsLedgers(ListPendingPointsLedgersRequest) returns (ListPendingPointsLedgersResponse);

  // Delegates a points ledger.
  rpc DelegatePointsLedgerApproval(DelegatePointsLedgerApprovalRequest) returns (DelegatePointsLedgerApprovalResponse);

  // Comments a points ledger.
  rpc CommentPointsLedgerApproval(CommentPointsLedgerApprovalRequest) returns (CommentPointsLedgerApprovalResponse);
}

// The request of `SubmitPointsLedger`.
message SubmitPointsLedgerRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string points_ledger_id = 2;
  PointsLedger points_ledger = 3;
  SubmitPointsLedgerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPointsLedger`.
message SubmitPointsLedgerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PointsLedger points_ledger = 1;
  SubmitPointsLedgerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

