syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "TierApprovalServiceProto";
option java_package = "com.acme.loyalty.v1";

// Routes tiers through approval, with escalation and delegation.
service TierApprovalService {
  // Submits a tier.
  rpc SubmitTier(SubmitTierRequest) returns (SubmitTierResponse);

  // Approves a tier.
  rpc ApproveTier(ApproveTierRequest) returns (ApproveTierResponse);

  // Rejects a tier.
  rpc RejectTier(RejectTierRequest) returns (RejectTierResponse);

  // Escalates a tier.
  rpc EscalateTier(EscalateTierRequest) returns (EscalateTierResponse);

  // Lists tiers a page at a time.
  rpc ListPendingTiers(ListPendingTiersRequest) returns (ListPendingTiersResponse);

  // Delegates a tier.
  rpc DelegateTierApproval(DelegateTierApprovalRequest) returns (DelegateTierApprovalResponse);

  // Recalls a tier.
  rpc RecallTier(RecallTierRequest) returns (RecallTierResponse);

  // Returns a tier.
  rpc GetTierApprovalStatus(GetTierApprovalStatusRequest) returns (GetTierApprovalStatusResponse);

  // Comments a tier.
  rpc CommentTierApproval(CommentTierApprovalRequest) returns (CommentTierApprovalResponse);
}

// The request of `SubmitTier`.
message SubmitTierRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  Tier tier = 3;
  SubmitTierRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTier`.
message SubmitTierResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tier tier = 1;
  SubmitTierResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

