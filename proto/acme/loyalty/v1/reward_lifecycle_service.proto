syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "RewardLifecycleServiceProto";
option java_package = "com.acme.loyalty.v1";

// Moves a reward between the states of its lifecycle.
service RewardLifecycleService {
  // Activates a reward.
  rpc ActivateReward(ActivateRewardRequest) returns (ActivateRewardResponse);

  // Suspends a reward.
  rpc SuspendReward(SuspendRewardRequest) returns (SuspendRewardResponse);

  // Reinstates a reward.
  rpc ReinstateReward(ReinstateRewardRequest) returns (ReinstateRewardResponse);

  // Terminates a reward.
  rpc TerminateReward(TerminateRewardRequest) returns (TerminateRewardResponse);

  // Renews a reward.
  rpc RenewReward(RenewRewardRequest) returns (RenewRewardResponse);

  // Expires a reward.
  rpc ExpireReward(ExpireRewardRequest) returns (ExpireRewardResponse);

  // Returns a reward.
  rpc GetRewardLifecycle(GetRewardLifecycleRequest) returns (GetRewardLifecycleResponse);

  // Schedules a reward.
  rpc ScheduleRewardExpiry(ScheduleRewardExpiryRequest) returns (ScheduleRewardExpiryResponse);
}

// The request of `ActivateReward`.
message ActivateRewardRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string reward_id = 2;
  ActivateRewardRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateReward`.
message ActivateRewardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Reward reward = 1;
  ActivateRewardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

