syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "LoyaltyMemberCalculationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Computes the figures of a loyalty member, such as totals, taxes, and estimates.
service LoyaltyMemberCalculationService {
  // Calculates a loyalty member.
  rpc CalculateLoyaltyMember(CalculateLoyaltyMemberRequest) returns (CalculateLoyaltyMemberResponse);

  // Estimates a loyalty member.
  rpc EstimateLoyaltyMember(EstimateLoyaltyMemberRequest) returns (EstimateLoyaltyMemberResponse);

  // Quotes a loyalty member.
  rpc QuoteLoyaltyMember(QuoteLoyaltyMemberRequest) returns (QuoteLoyaltyMemberResponse);

  // Compares a loyalty member.
  rpc CompareLoyaltyMemberOptions(CompareLoyaltyMemberOptionsRequest) returns (CompareLoyaltyMemberOptionsResponse);

  // Recalculates a loyalty member.
  rpc RecalculateLoyaltyMembers(RecalculateLoyaltyMembersRequest) returns (RecalculateLoyaltyMembersResponse);

  // Simulates a loyalty member.
  rpc SimulateLoyaltyMember(SimulateLoyaltyMemberRequest) returns (SimulateLoyaltyMemberResponse);

  // Explains a loyalty member.
  rpc ExplainLoyaltyMemberCalculation(ExplainLoyaltyMemberCalculationRequest) returns (ExplainLoyaltyMemberCalculationResponse);

  // Returns a loyalty member.
  rpc GetLoyaltyMemberRates(GetLoyaltyMemberRatesRequest) returns (GetLoyaltyMemberRatesResponse);
}

// The request of `CalculateLoyaltyMember`.
message CalculateLoyaltyMemberRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string loyalty_member_id = 2;
  LoyaltyMember loyalty_member = 3;
  CalculateLoyaltyMemberRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLoyaltyMember`.
message CalculateLoyaltyMemberResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLoyaltyMemberResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LoyaltyMember loyalty_member = 1;
  CalculateLoyaltyMemberResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

