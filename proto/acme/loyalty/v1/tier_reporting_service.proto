syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "TierReportingServiceProto";
option java_package = "com.acme.loyalty.v1";

// Builds and schedules reports about tiers.
service TierReportingService {
  // Generates a tier.
  rpc GenerateTierReport(GenerateTierReportRequest) returns (GenerateTierReportResponse);

  // Returns a tier.
  rpc FetchTierReport(FetchTierReportRequest) returns (FetchTierReportResponse);

  // Schedules a tier.
  rpc ScheduleTierReport(ScheduleTierReportRequest) returns (ScheduleTierReportResponse);

  // Streams the changes of tiers as they happen.
  rpc StreamTierMetrics(StreamTierMetricsRequest) returns (stream StreamTierMetricsResponse);

  // Shares a tier.
  rpc ShareTierReport(ShareTierReportRequest) returns (ShareTierReportResponse);

  // Counts tiers by status.
  rpc CountTierTotals(CountTierTotalsRequest) returns (CountTierTotalsResponse);

  // Deletes a tier.
  rpc DeleteTierReport(DeleteTierReportRequest) returns (DeleteTierReportResponse);
}

// The request of `GenerateTierReport`.
message GenerateTierReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  GenerateTierReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTierReport`.
message GenerateTierReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTierReport`.
message FetchTierReportRequest {
  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTierReport`.
message FetchTierReportResponse {
  Tier tier = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTierReport`.
message ScheduleTierReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  ScheduleTierReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTierReport`.
message ScheduleTierReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTierMetrics`.
message StreamTierMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTierMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTierMetrics`.
message StreamTierMetricsResponse {
  Tier tier = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareTierReport`.
message ShareTierReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  ShareTierReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTierReport`.
message ShareTierReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tier tier = 1;
  ShareTierReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTierTotals`.
message CountTierTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTierTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTierTotals`.
message CountTierTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteTierReport`.
message DeleteTierReportRequest {
  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTierReport`.
message DeleteTierReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
