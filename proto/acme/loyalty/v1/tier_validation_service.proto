syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "TierValidationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Checks tiers against the rules before anything acts on them.
service TierValidationService {
  // Validates a tier.
  rpc ValidateTier(ValidateTierRequest) returns (ValidateTierResponse);

  // Previews a tier.
  rpc PreviewTier(PreviewTierRequest) returns (PreviewTierResponse);

  // Checks a tier.
  rpc CheckTierEligibility(CheckTierEligibilityRequest) returns (CheckTierEligibilityResponse);

  // Normalizes a tier.
  rpc NormalizeTier(NormalizeTierRequest) returns (NormalizeTierResponse);

  // Explains a tier.
  rpc ExplainTierDecision(ExplainTierDecisionRequest) returns (ExplainTierDecisionResponse);

  // Returns a tier.
  rpc GetTierRules(GetTierRulesRequest) returns (GetTierRulesResponse);
}

// The request of `ValidateTier`.
message ValidateTierRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tier_id = 2;
  Tier tier = 3;
  ValidateTierRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTier`.
message ValidateTierResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Tier tier = 1;
  ValidateTierResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

