syntax = "proto3";

package acme.loyalty.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/loyalty/v1/loyalty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Loyalty.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/loyalty/v1;loyaltyv1";
option java_multiple_files = true;
option java_outer_classname = "RewardValidationServiceProto";
option java_package = "com.acme.loyalty.v1";

// Checks rewards against the rules before anything acts on them.
service RewardValidationService {
  // Validates a reward.
  rpc ValidateReward(ValidateRewardRequest) returns (ValidateRewardResponse);

  // Previews a reward.
  rpc PreviewReward(PreviewRewardRequest) returns (PreviewRewardResponse);

  // Checks a reward.
  rpc CheckRewardEligibility(CheckRewardEligibilityRequest) returns (CheckRewardEligibilityResponse);

  // Normalizes a reward.
  rpc NormalizeReward(NormalizeRewardRequest) returns (NormalizeRewardResponse);

  // Explains a reward.
  rpc ExplainRewardDecision(ExplainRewardDecisionRequest) returns (ExplainRewardDecisionResponse);

  // Scores a reward.
  rpc ScoreReward(ScoreRewardRequest) returns (ScoreRewardResponse);

  // Returns a reward.
  rpc GetRewardRules(GetRewardRulesRequest) returns (GetRewardRulesResponse);
}

// The request of `ValidateReward`.
message ValidateRewardRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string reward_id = 2;
  Reward reward = 3;
  ValidateRewardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateReward`.
message ValidateRewardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Reward reward = 1;
  ValidateRewardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

