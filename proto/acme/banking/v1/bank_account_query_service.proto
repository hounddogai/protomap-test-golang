syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "BankAccountQueryServiceProto";
option java_package = "com.acme.banking.v1";

// Answers read-only questions about bank accounts, for screens and reports.
service BankAccountQueryService {
  // Returns a bank account.
  rpc LookupBankAccount(LookupBankAccountRequest) returns (LookupBankAccountResponse);

  // Lists bank accounts a page at a time.
  rpc BrowseBankAccounts(BrowseBankAccountsRequest) returns (BrowseBankAccountsResponse);

  // Lists bank accounts a page at a time.
  rpc FindBankAccounts(FindBankAccountsRequest) returns (FindBankAccountsResponse);

  // Counts bank accounts by status.
  rpc CountBankAccounts(CountBankAccountsRequest) returns (CountBankAccountsResponse);

  // Returns several bank accounts at once.
  rpc ResolveBankAccounts(ResolveBankAccountsRequest) returns (ResolveBankAccountsResponse);

  // Streams every matching bank account.
  rpc ExportBankAccounts(ExportBankAccountsRequest) returns (stream ExportBankAccountsResponse);

  // Summarizes a bank account.
  rpc SummarizeBankAccounts(SummarizeBankAccountsRequest) returns (SummarizeBankAccountsResponse);

  // Lists bank accounts a page at a time.
  rpc SuggestBankAccounts(SuggestBankAccountsRequest) returns (SuggestBankAccountsResponse);

  // Returns a bank account.
  rpc PeekBankAccount(PeekBankAccountRequest) returns (PeekBankAccountResponse);
}

// The request of `LookupBankAccount`.
message LookupBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_account_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupBankAccount`.
message LookupBankAccountResponse {
  BankAccount bank_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseBankAccounts`.
message BrowseBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseBankAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseBankAccounts`.
message BrowseBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindBankAccounts`.
message FindBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindBankAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindBankAccounts`.
message FindBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBankAccounts`.
message CountBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBankAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBankAccounts`.
message CountBankAccountsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveBankAccounts`.
message ResolveBankAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string bank_account_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveBankAccounts`.
message ResolveBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportBankAccounts`.
message ExportBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportBankAccountsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportBankAccounts`.
message ExportBankAccountsResponse {
  BankAccount bank_account = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeBankAccounts`.
message SummarizeBankAccountsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_account_id = 2;
  SummarizeBankAccountsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeBankAccounts`.
message SummarizeBankAccountsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestBankAccounts`.
message SuggestBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestBankAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestBankAccounts`.
message SuggestBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekBankAccount`.
message PeekBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_account_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekBankAccount`.
message PeekBankAccountResponse {
  BankAccount bank_account = 1;
  acme.common.v1.OperationResult result = 2;
}
