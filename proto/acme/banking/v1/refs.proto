syntax = "proto3";

package acme.banking.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.banking.v1";

// A reference to a bank account of the banking domain.
message BankAccountRef {
  string bank_account_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a statement of the banking domain.
message StatementRef {
  string statement_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a standing order of the banking domain.
message StandingOrderRef {
  string standing_order_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a mandate of the banking domain.
message MandateRef {
  string mandate_id = 1;
  string display_name = 2;
  string number = 3;
}
