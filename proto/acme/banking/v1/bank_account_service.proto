syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "BankAccountServiceProto";
option java_package = "com.acme.banking.v1";

// Manages bank accounts: creates, reads, changes, and lists them.
service BankAccountService {
  // Creates a bank account.
  rpc CreateBankAccount(CreateBankAccountRequest) returns (CreateBankAccountResponse);

  // Returns a bank account.
  rpc GetBankAccount(GetBankAccountRequest) returns (GetBankAccountResponse);

  // Changes a bank account.
  rpc UpdateBankAccount(UpdateBankAccountRequest) returns (UpdateBankAccountResponse);

  // Deletes a bank account.
  rpc DeleteBankAccount(DeleteBankAccountRequest) returns (DeleteBankAccountResponse);

  // Lists bank accounts a page at a time.
  rpc ListBankAccounts(ListBankAccountsRequest) returns (ListBankAccountsResponse);

  // Returns several bank accounts at once.
  rpc BatchGetBankAccounts(BatchGetBankAccountsRequest) returns (BatchGetBankAccountsResponse);

  // Lists bank accounts a page at a time.
  rpc SearchBankAccounts(SearchBankAccountsRequest) returns (SearchBankAccountsResponse);

  // Streams the changes of bank accounts as they happen.
  rpc WatchBankAccounts(WatchBankAccountsRequest) returns (stream WatchBankAccountsResponse);

  // Takes a stream of bank accounts and answers once at the end.
  rpc BatchCreateBankAccounts(stream BatchCreateBankAccountsRequest) returns (BatchCreateBankAccountsResponse);

  // Creates a bank account.
  rpc CloneBankAccount(CloneBankAccountRequest) returns (CloneBankAccountResponse);
}

// The request of `CreateBankAccount`.
message CreateBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  BankAccount bank_account = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateBankAccount`.
message CreateBankAccountResponse {
  BankAccount bank_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetBankAccount`.
message GetBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_account_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetBankAccount`.
message GetBankAccountResponse {
  BankAccount bank_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateBankAccount`.
message UpdateBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  BankAccount bank_account = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateBankAccount`.
message UpdateBankAccountResponse {
  BankAccount bank_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteBankAccount`.
message DeleteBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_account_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteBankAccount`.
message DeleteBankAccountResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListBankAccounts`.
message ListBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListBankAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListBankAccounts`.
message ListBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetBankAccounts`.
message BatchGetBankAccountsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string bank_account_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetBankAccounts`.
message BatchGetBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SearchBankAccounts`.
message SearchBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchBankAccountsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchBankAccounts`.
message SearchBankAccountsResponse {
  repeated BankAccount bank_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchBankAccounts`.
message WatchBankAccountsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchBankAccountsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchBankAccounts`.
message WatchBankAccountsResponse {
  BankAccount bank_account = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateBankAccounts`.
message BatchCreateBankAccountsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateBankAccountsRequest.StreamHeader header = 2;
    BankAccount record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateBankAccounts`.
message BatchCreateBankAccountsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string bank_account_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateBankAccountsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneBankAccount`.
message CloneBankAccountRequest {
  acme.common.v1.RequestContext context = 1;
  BankAccount bank_account = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneBankAccount`.
message CloneBankAccountResponse {
  BankAccount bank_account = 1;
  acme.common.v1.OperationResult result = 2;
}
