syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "ShiftQueryServiceProto";
option java_package = "com.acme.scheduling.v1";

// Answers read-only questions about shifts, for screens and reports.
service ShiftQueryService {
  // Returns a shift.
  rpc LookupShift(LookupShiftRequest) returns (LookupShiftResponse);

  // Lists shifts a page at a time.
  rpc BrowseShifts(BrowseShiftsRequest) returns (BrowseShiftsResponse);

  // Lists shifts a page at a time.
  rpc FindShifts(FindShiftsRequest) returns (FindShiftsResponse);

  // Counts shifts by status.
  rpc CountShifts(CountShiftsRequest) returns (CountShiftsResponse);

  // Returns several shifts at once.
  rpc ResolveShifts(ResolveShiftsRequest) returns (ResolveShiftsResponse);

  // Streams every matching shift.
  rpc ExportShifts(ExportShiftsRequest) returns (stream ExportShiftsResponse);

  // Summarizes a shift.
  rpc SummarizeShifts(SummarizeShiftsRequest) returns (SummarizeShiftsResponse);

  // Lists shifts a page at a time.
  rpc SuggestShifts(SuggestShiftsRequest) returns (SuggestShiftsResponse);

  // Returns a shift.
  rpc PeekShift(PeekShiftRequest) returns (PeekShiftResponse);
}

// The request of `LookupShift`.
message LookupShiftRequest {
  acme.common.v1.RequestContext context = 1;
  string shift_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupShift`.
message LookupShiftResponse {
  Shift shift = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseShifts`.
message BrowseShiftsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShiftStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseShiftsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseShifts`.
message BrowseShiftsResponse {
  repeated Shift shifts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindShifts`.
message FindShiftsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShiftStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindShiftsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindShifts`.
message FindShiftsResponse {
  repeated Shift shifts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountShifts`.
message CountShiftsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShiftStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountShiftsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountShifts`.
message CountShiftsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveShifts`.
message ResolveShiftsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string shift_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveShifts`.
message ResolveShiftsResponse {
  repeated Shift shifts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportShifts`.
message ExportShiftsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShiftStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportShiftsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportShifts`.
message ExportShiftsResponse {
  Shift shift = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeShifts`.
message SummarizeShiftsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shift_id = 2;
  SummarizeShiftsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeShifts`.
message SummarizeShiftsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestShifts`.
message SuggestShiftsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ShiftStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestShiftsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestShifts`.
message SuggestShiftsResponse {
  repeated Shift shifts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekShift`.
message PeekShiftRequest {
  acme.common.v1.RequestContext context = 1;
  string shift_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekShift`.
message PeekShiftResponse {
  Shift shift = 1;
  acme.common.v1.OperationResult result = 2;
}
