syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "PerformerQueryServiceProto";
option java_package = "com.acme.performers.v1";

// Answers read-only questions about performers, for screens and reports.
service PerformerQueryService {
  // Returns a performer.
  rpc LookupPerformer(LookupPerformerRequest) returns (LookupPerformerResponse);

  // Lists performers a page at a time.
  rpc BrowsePerformers(BrowsePerformersRequest) returns (BrowsePerformersResponse);

  // Lists performers a page at a time.
  rpc FindPerformers(FindPerformersRequest) returns (FindPerformersResponse);

  // Counts performers by status.
  rpc CountPerformers(CountPerformersRequest) returns (CountPerformersResponse);

  // Streams every matching performer.
  rpc ExportPerformers(ExportPerformersRequest) returns (stream ExportPerformersResponse);

  // Summarizes a performer.
  rpc SummarizePerformers(SummarizePerformersRequest) returns (SummarizePerformersResponse);

  // Lists performers a page at a time.
  rpc SuggestPerformers(SuggestPerformersRequest) returns (SuggestPerformersResponse);

  // Returns a performer.
  rpc PeekPerformer(PeekPerformerRequest) returns (PeekPerformerResponse);
}

// The request of `LookupPerformer`.
message LookupPerformerRequest {
  acme.common.v1.RequestContext context = 1;
  string performer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPerformer`.
message LookupPerformerResponse {
  Performer performer = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePerformers`.
message BrowsePerformersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePerformersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePerformers`.
message BrowsePerformersResponse {
  repeated Performer performers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPerformers`.
message FindPerformersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPerformersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPerformers`.
message FindPerformersResponse {
  repeated Performer performers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPerformers`.
message CountPerformersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPerformersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPerformers`.
message CountPerformersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPerformers`.
message ExportPerformersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPerformersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPerformers`.
message ExportPerformersResponse {
  Performer performer = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePerformers`.
message SummarizePerformersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performer_id = 2;
  SummarizePerformersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePerformers`.
message SummarizePerformersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPerformers`.
message SuggestPerformersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPerformersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPerformers`.
message SuggestPerformersResponse {
  repeated Performer performers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPerformer`.
message PeekPerformerRequest {
  acme.common.v1.RequestContext context = 1;
  string performer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPerformer`.
message PeekPerformerResponse {
  Performer performer = 1;
  acme.common.v1.OperationResult result = 2;
}
