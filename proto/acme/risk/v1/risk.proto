syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/customers/v1/refs.proto";
import "acme/identity/v1/refs.proto";
import "acme/suppliers/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskProto";
option java_package = "com.acme.risk.v1";

// Where a risk register is in its lifecycle.
enum RiskRegisterStatus {
  RISK_REGISTER_STATUS_UNSPECIFIED = 0;
  RISK_REGISTER_STATUS_ACTIVE = 1;
  RISK_REGISTER_STATUS_INACTIVE = 2;
}

// Where a risk scenario is in its lifecycle.
enum RiskScenarioStatus {
  RISK_SCENARIO_STATUS_UNSPECIFIED = 0;
  RISK_SCENARIO_STATUS_NEW = 1;
  RISK_SCENARIO_STATUS_OPEN = 2;
  RISK_SCENARIO_STATUS_WAITING = 3;
  RISK_SCENARIO_STATUS_RESOLVED = 4;
  RISK_SCENARIO_STATUS_CLOSED = 5;
}

// Where an exposure is in its lifecycle.
enum ExposureStatus {
  EXPOSURE_STATUS_UNSPECIFIED = 0;
  EXPOSURE_STATUS_PENDING = 1;
  EXPOSURE_STATUS_OPEN = 2;
  EXPOSURE_STATUS_FROZEN = 3;
  EXPOSURE_STATUS_CLOSED = 4;
}

// Where a stress test is in its lifecycle.
enum StressTestStatus {
  STRESS_TEST_STATUS_UNSPECIFIED = 0;
  STRESS_TEST_STATUS_DRAFT = 1;
  STRESS_TEST_STATUS_ISSUED = 2;
  STRESS_TEST_STATUS_APPROVED = 3;
  STRESS_TEST_STATUS_PAID = 4;
  STRESS_TEST_STATUS_VOID = 5;
}

// A risk register of the risk domain.
message RiskRegister {
  string risk_register_id = 1;
  string name = 2;
  string parent_id = 3;
  repeated string path = 4;
  repeated RiskRegister children = 5;
  int32 depth = 6;
  map<string, string> attributes = 7;
  acme.identity.v1.UserRef manager = 8;
  RiskRegisterStatus status = 9;
  acme.common.v1.PostalAddress location = 10;
  acme.common.v1.AuditInfo audit = 11;
}

// The comment of a risk scenario.
message RiskScenarioComment {
  string comment_id = 1;
  string author_email = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string visibility = 5;
}

// The sla of a risk scenario.
message RiskScenarioSla {
  string policy_id = 1;
  google.protobuf.Timestamp due_at = 2;
  bool breached = 3;
  google.protobuf.Duration paused_for = 4;
}

// The channel origin of a risk scenario.
message RiskScenarioChannelOrigin {
  string channel = 1;
  string address = 2;
}

// The status change of a risk scenario.
message RiskScenarioStatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// A risk scenario of the risk domain.
message RiskScenario {
  string risk_scenario_id = 1;
  string subject = 2;
  RiskScenarioStatus status = 3;
  int32 priority = 4;
  acme.identity.v1.UserRef assignee = 5;
  acme.common.v1.ContactInfo requester = 6;
  repeated RiskScenarioComment comments = 7;
  RiskScenarioSla sla = 8;
  oneof origin {
    acme.customers.v1.CustomerRef customer = 9;
    string external_reference = 10;
    RiskScenarioChannelOrigin channel = 11;
  }
  repeated RiskScenarioStatusChange history = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
  acme.common.v1.AuditInfo audit = 15;
}

// The limit of an exposure.
message ExposureLimit {
  string name = 1;
  acme.common.v1.Money amount = 2;
  google.protobuf.Duration period = 3;
}

// The card funding of an exposure.
message ExposureCardFunding {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank funding of an exposure.
message ExposureBankFunding {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// An exposure of the risk domain.
message Exposure {
  string exposure_id = 1;
  acme.suppliers.v1.SupplierRef holder = 2;
  ExposureStatus status = 3;
  string currency_code = 4;
  acme.common.v1.Money balance = 5;
  acme.common.v1.Money available = 6;
  repeated ExposureLimit limits = 7;
  oneof funding {
    ExposureCardFunding card = 8;
    ExposureBankFunding bank = 9;
    string external_account_id = 10;
  }
  google.protobuf.Timestamp opened_at = 11;
  acme.common.v1.ContactInfo contact = 12;
  map<string, string> labels = 13;
  acme.common.v1.AuditInfo audit = 14;
}

// The line of a stress test.
message StressTestLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  StressTestLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a stress test line.
message StressTestLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a stress test.
message StressTestCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a stress test.
message StressTestBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a stress test.
message StressTestAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A stress test of the risk domain.
message StressTest {
  string stress_test_id = 1;
  string number = 2;
  StressTestStatus status = 3;
  acme.customers.v1.CustomerRef counterparty = 4;
  repeated StressTestLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    StressTestCardSettlement card = 8;
    StressTestBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated StressTestAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
