syntax = "proto3";

package acme.employeeportal.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employeeportal/v1/employeeportal.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employeeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employeeportal/v1;employeeportalv1";
option java_multiple_files = true;
option java_outer_classname = "PortalHomeQueryServiceProto";
option java_package = "com.acme.employeeportal.v1";

// Answers read-only questions about portal homes, for screens and reports.
service PortalHomeQueryService {
  // Returns a portal home.
  rpc LookupPortalHome(LookupPortalHomeRequest) returns (LookupPortalHomeResponse);

  // Lists portal homes a page at a time.
  rpc BrowsePortalHomes(BrowsePortalHomesRequest) returns (BrowsePortalHomesResponse);

  // Lists portal homes a page at a time.
  rpc FindPortalHomes(FindPortalHomesRequest) returns (FindPortalHomesResponse);

  // Streams every matching portal home.
  rpc ExportPortalHomes(ExportPortalHomesRequest) returns (stream ExportPortalHomesResponse);

  // Summarizes a portal home.
  rpc SummarizePortalHomes(SummarizePortalHomesRequest) returns (SummarizePortalHomesResponse);

  // Lists portal homes a page at a time.
  rpc SuggestPortalHomes(SuggestPortalHomesRequest) returns (SuggestPortalHomesResponse);

  // Returns a portal home.
  rpc PeekPortalHome(PeekPortalHomeRequest) returns (PeekPortalHomeResponse);
}

// The request of `LookupPortalHome`.
message LookupPortalHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string portal_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPortalHome`.
message LookupPortalHomeResponse {
  PortalHome portal_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePortalHomes`.
message BrowsePortalHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PortalHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePortalHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePortalHomes`.
message BrowsePortalHomesResponse {
  repeated PortalHome portal_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPortalHomes`.
message FindPortalHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PortalHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPortalHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPortalHomes`.
message FindPortalHomesResponse {
  repeated PortalHome portal_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPortalHomes`.
message ExportPortalHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PortalHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPortalHomesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPortalHomes`.
message ExportPortalHomesResponse {
  PortalHome portal_home = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePortalHomes`.
message SummarizePortalHomesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string portal_home_id = 2;
  SummarizePortalHomesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePortalHomes`.
message SummarizePortalHomesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPortalHomes`.
message SuggestPortalHomesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PortalHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPortalHomesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPortalHomes`.
message SuggestPortalHomesResponse {
  repeated PortalHome portal_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPortalHome`.
message PeekPortalHomeRequest {
  acme.common.v1.RequestContext context = 1;
  string portal_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPortalHome`.
message PeekPortalHomeResponse {
  PortalHome portal_home = 1;
  acme.common.v1.OperationResult result = 2;
}
