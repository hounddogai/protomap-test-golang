syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderNoteImportServiceProto";
option java_package = "com.acme.orders.v1";

// Takes order notes in bulk from partners and legacy systems.
service OrderNoteImportService {
  // Takes a stream of order notes and answers once at the end.
  rpc ImportOrderNotes(stream ImportOrderNotesRequest) returns (ImportOrderNotesResponse);

  // Returns an order note.
  rpc GetOrderNoteImportStatus(GetOrderNoteImportStatusRequest) returns (GetOrderNoteImportStatusResponse);

  // Cancels an order note.
  rpc CancelOrderNoteImport(CancelOrderNoteImportRequest) returns (CancelOrderNoteImportResponse);

  // Validates an order note.
  rpc ValidateOrderNoteImport(ValidateOrderNoteImportRequest) returns (ValidateOrderNoteImportResponse);

  // Lists order notes a page at a time.
  rpc ListOrderNoteImports(ListOrderNoteImportsRequest) returns (ListOrderNoteImportsResponse);

  // Retrys an order note.
  rpc RetryOrderNoteImport(RetryOrderNoteImportRequest) returns (RetryOrderNoteImportResponse);

  // Maps an order note.
  rpc MapOrderNoteImportColumns(MapOrderNoteImportColumnsRequest) returns (MapOrderNoteImportColumnsResponse);
}

// The request of `ImportOrderNotes`.
message ImportOrderNotesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportOrderNotesRequest.StreamHeader header = 2;
    OrderNote record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportOrderNotes`.
message ImportOrderNotesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string order_note_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportOrderNotesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetOrderNoteImportStatus`.
message GetOrderNoteImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetOrderNoteImportStatus`.
message GetOrderNoteImportStatusResponse {
  OrderNote order_note = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelOrderNoteImport`.
message CancelOrderNoteImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  CancelOrderNoteImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelOrderNoteImport`.
message CancelOrderNoteImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderNote order_note = 1;
  CancelOrderNoteImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateOrderNoteImport`.
message ValidateOrderNoteImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  OrderNote order_note = 3;
  ValidateOrderNoteImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateOrderNoteImport`.
message ValidateOrderNoteImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderNote order_note = 1;
  ValidateOrderNoteImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListOrderNoteImports`.
message ListOrderNoteImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderNoteStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListOrderNoteImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListOrderNoteImports`.
message ListOrderNoteImportsResponse {
  repeated OrderNote order_notes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryOrderNoteImport`.
message RetryOrderNoteImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  OrderNote order_note = 3;
  RetryOrderNoteImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryOrderNoteImport`.
message RetryOrderNoteImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderNote order_note = 1;
  RetryOrderNoteImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapOrderNoteImportColumns`.
message MapOrderNoteImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  OrderNote order_note = 3;
  MapOrderNoteImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapOrderNoteImportColumns`.
message MapOrderNoteImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderNote order_note = 1;
  MapOrderNoteImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
