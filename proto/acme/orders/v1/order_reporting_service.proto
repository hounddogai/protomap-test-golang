syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderReportingServiceProto";
option java_package = "com.acme.orders.v1";

// Builds and schedules reports about orders.
service OrderReportingService {
  // Generates an order.
  rpc GenerateOrderReport(GenerateOrderReportRequest) returns (GenerateOrderReportResponse);

  // Returns an order.
  rpc FetchOrderReport(FetchOrderReportRequest) returns (FetchOrderReportResponse);

  // Schedules an order.
  rpc ScheduleOrderReport(ScheduleOrderReportRequest) returns (ScheduleOrderReportResponse);

  // Streams the changes of orders as they happen.
  rpc StreamOrderMetrics(StreamOrderMetricsRequest) returns (stream StreamOrderMetricsResponse);

  // Shares an order.
  rpc ShareOrderReport(ShareOrderReportRequest) returns (ShareOrderReportResponse);

  // Counts orders by status.
  rpc CountOrderTotals(CountOrderTotalsRequest) returns (CountOrderTotalsResponse);

  // Deletes an order.
  rpc DeleteOrderReport(DeleteOrderReportRequest) returns (DeleteOrderReportResponse);
}

// The request of `GenerateOrderReport`.
message GenerateOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  GenerateOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateOrderReport`.
message GenerateOrderReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchOrderReport`.
message FetchOrderReportRequest {
  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchOrderReport`.
message FetchOrderReportResponse {
  Order order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleOrderReport`.
message ScheduleOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  ScheduleOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleOrderReport`.
message ScheduleOrderReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamOrderMetrics`.
message StreamOrderMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamOrderMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamOrderMetrics`.
message StreamOrderMetricsResponse {
  Order order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareOrderReport`.
message ShareOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  ShareOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareOrderReport`.
message ShareOrderReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Order order = 1;
  ShareOrderReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountOrderTotals`.
message CountOrderTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountOrderTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountOrderTotals`.
message CountOrderTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteOrderReport`.
message DeleteOrderReportRequest {
  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteOrderReport`.
message DeleteOrderReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
