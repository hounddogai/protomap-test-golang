syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderAmendmentCalculationServiceProto";
option java_package = "com.acme.orders.v1";

// Computes the figures of an order amendment, such as totals, taxes, and estimates.
service OrderAmendmentCalculationService {
  // Calculates an order amendment.
  rpc CalculateOrderAmendment(CalculateOrderAmendmentRequest) returns (CalculateOrderAmendmentResponse);

  // Estimates an order amendment.
  rpc EstimateOrderAmendment(EstimateOrderAmendmentRequest) returns (EstimateOrderAmendmentResponse);

  // Quotes an order amendment.
  rpc QuoteOrderAmendment(QuoteOrderAmendmentRequest) returns (QuoteOrderAmendmentResponse);

  // Compares an order amendment.
  rpc CompareOrderAmendmentOptions(CompareOrderAmendmentOptionsRequest) returns (CompareOrderAmendmentOptionsResponse);

  // Recalculates an order amendment.
  rpc RecalculateOrderAmendments(RecalculateOrderAmendmentsRequest) returns (RecalculateOrderAmendmentsResponse);

  // Simulates an order amendment.
  rpc SimulateOrderAmendment(SimulateOrderAmendmentRequest) returns (SimulateOrderAmendmentResponse);

  // Explains an order amendment.
  rpc ExplainOrderAmendmentCalculation(ExplainOrderAmendmentCalculationRequest) returns (ExplainOrderAmendmentCalculationResponse);

  // Returns an order amendment.
  rpc GetOrderAmendmentRates(GetOrderAmendmentRatesRequest) returns (GetOrderAmendmentRatesResponse);
}

// The request of `CalculateOrderAmendment`.
message CalculateOrderAmendmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  OrderAmendment order_amendment = 3;
  CalculateOrderAmendmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateOrderAmendment`.
message CalculateOrderAmendmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateOrderAmendmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  OrderAmendment order_amendment = 1;
  CalculateOrderAmendmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

