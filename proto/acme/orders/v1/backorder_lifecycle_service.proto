syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "BackorderLifecycleServiceProto";
option java_package = "com.acme.orders.v1";

// Moves a backorder between the states of its lifecycle.
service BackorderLifecycleService {
  // Activates a backorder.
  rpc ActivateBackorder(ActivateBackorderRequest) returns (ActivateBackorderResponse);

  // Suspends a backorder.
  rpc SuspendBackorder(SuspendBackorderRequest) returns (SuspendBackorderResponse);

  // Reinstates a backorder.
  rpc ReinstateBackorder(ReinstateBackorderRequest) returns (ReinstateBackorderResponse);

  // Terminates a backorder.
  rpc TerminateBackorder(TerminateBackorderRequest) returns (TerminateBackorderResponse);

  // Renews a backorder.
  rpc RenewBackorder(RenewBackorderRequest) returns (RenewBackorderResponse);

  // Expires a backorder.
  rpc ExpireBackorder(ExpireBackorderRequest) returns (ExpireBackorderResponse);

  // Returns a backorder.
  rpc GetBackorderLifecycle(GetBackorderLifecycleRequest) returns (GetBackorderLifecycleResponse);

  // Schedules a backorder.
  rpc ScheduleBackorderExpiry(ScheduleBackorderExpiryRequest) returns (ScheduleBackorderExpiryResponse);
}

// The request of `ActivateBackorder`.
message ActivateBackorderRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string backorder_id = 2;
  ActivateBackorderRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateBackorder`.
message ActivateBackorderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Backorder backorder = 1;
  ActivateBackorderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

