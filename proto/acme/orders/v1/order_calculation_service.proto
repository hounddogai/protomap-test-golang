syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderCalculationServiceProto";
option java_package = "com.acme.orders.v1";

// Computes the figures of an order, such as totals, taxes, and estimates.
service OrderCalculationService {
  // Calculates an order.
  rpc CalculateOrder(CalculateOrderRequest) returns (CalculateOrderResponse);

  // Estimates an order.
  rpc EstimateOrder(EstimateOrderRequest) returns (EstimateOrderResponse);

  // Quotes an order.
  rpc QuoteOrder(QuoteOrderRequest) returns (QuoteOrderResponse);

  // Simulates an order.
  rpc SimulateOrder(SimulateOrderRequest) returns (SimulateOrderResponse);

  // Explains an order.
  rpc ExplainOrderCalculation(ExplainOrderCalculationRequest) returns (ExplainOrderCalculationResponse);

  // Returns an order.
  rpc GetOrderRates(GetOrderRatesRequest) returns (GetOrderRatesResponse);
}

// The request of `CalculateOrder`.
message CalculateOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  Order order = 3;
  CalculateOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateOrder`.
message CalculateOrderResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateOrderResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Order order = 1;
  CalculateOrderResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

