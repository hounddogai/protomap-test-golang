option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderAmendmentWorkflowServiceProto";
option java_package = "com.acme.orders.v1";

// Runs the long-lived workflow that takes an order amendment from start to finish.
service OrderAmendmentWorkflowService {
  // Starts an order amendment.
  rpc StartOrderAmendmentWorkflow(StartOrderAmendmentWorkflowRequest) returns (StartOrderAmendmentWorkflowResponse);

  // Advances an order amendment.
  rpc AdvanceOrderAmendmentWorkflow(AdvanceOrderAmendmentWorkflowRequest) returns (AdvanceOrderAmendmentWorkflowResponse);

  // Cancels an order amendment.
  rpc CancelOrderAmendmentWorkflow(CancelOrderAmendmentWorkflowRequest) returns (CancelOrderAmendmentWorkflowResponse);

  // Pauses an order amendment.
  rpc PauseOrderAmendmentWorkflow(PauseOrderAmendmentWorkflowRequest) returns (PauseOrderAmendmentWorkflowResponse);

  // Resumes an order amendment.
  rpc ResumeOrderAmendmentWorkflow(ResumeOrderAmendmentWorkflowRequest) returns (ResumeOrderAmendmentWorkflowResponse);

  // Returns an order amendment.
  rpc InspectOrderAmendmentWorkflow(InspectOrderAmendmentWorkflowRequest) returns (InspectOrderAmendmentWorkflowResponse);

  // Lists order amendments a page at a time.
  rpc ListOrderAmendmentWorkflows(ListOrderAmendmentWorkflowsRequest) returns (ListOrderAmendmentWorkflowsResponse);

  // Signals an order amendment.
  rpc SignalOrderAmendmentWorkflow(SignalOrderAmendmentWorkflowRequest) returns (SignalOrderAmendmentWorkflowResponse);
}

// The request of `StartOrderAmendmentWorkflow`.
message StartOrderAmendmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  OrderAmendment order_amendment = 3;
  StartOrderAmendmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartOrderAmendmentWorkflow`.
message StartOrderAmendmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderAmendment order_amendment = 1;
  StartOrderAmendmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

