syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderNoteCalculationServiceProto";
option java_package = "com.acme.orders.v1";

// Computes the figures of an order note, such as totals, taxes, and estimates.
service OrderNoteCalculationService {
  // Calculates an order note.
  rpc CalculateOrderNote(CalculateOrderNoteRequest) returns (CalculateOrderNoteResponse);

  // Estimates an order note.
  rpc EstimateOrderNote(EstimateOrderNoteRequest) returns (EstimateOrderNoteResponse);

  // Compares an order note.
  rpc CompareOrderNoteOptions(CompareOrderNoteOptionsRequest) returns (CompareOrderNoteOptionsResponse);

  // Recalculates an order note.
  rpc RecalculateOrderNotes(RecalculateOrderNotesRequest) returns (RecalculateOrderNotesResponse);

  // Simulates an order note.
  rpc SimulateOrderNote(SimulateOrderNoteRequest) returns (SimulateOrderNoteResponse);

  // Explains an order note.
  rpc ExplainOrderNoteCalculation(ExplainOrderNoteCalculationRequest) returns (ExplainOrderNoteCalculationResponse);
}

// The request of `CalculateOrderNote`.
message CalculateOrderNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  OrderNote order_note = 3;
  CalculateOrderNoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateOrderNote`.
message CalculateOrderNoteResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateOrderNoteResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  OrderNote order_note = 1;
  CalculateOrderNoteResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

