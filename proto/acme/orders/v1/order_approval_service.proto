syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderApprovalServiceProto";
option java_package = "com.acme.orders.v1";

// Routes orders through approval, with escalation and delegation.
service OrderApprovalService {
  // Submits an order.
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);

  // Approves an order.
  rpc ApproveOrder(ApproveOrderRequest) returns (ApproveOrderResponse);

  // Rejects an order.
  rpc RejectOrder(RejectOrderRequest) returns (RejectOrderResponse);

  // Escalates an order.
  rpc EscalateOrder(EscalateOrderRequest) returns (EscalateOrderResponse);

  // Lists orders a page at a time.
  rpc ListPendingOrders(ListPendingOrdersRequest) returns (ListPendingOrdersResponse);

  // Delegates an order.
  rpc DelegateOrderApproval(DelegateOrderApprovalRequest) returns (DelegateOrderApprovalResponse);

  // Returns an order.
  rpc GetOrderApprovalStatus(GetOrderApprovalStatusRequest) returns (GetOrderApprovalStatusResponse);
}

// The request of `SubmitOrder`.
message SubmitOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  Order order = 3;
  SubmitOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitOrder`.
message SubmitOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Order order = 1;
  SubmitOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveOrder`.
message ApproveOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
