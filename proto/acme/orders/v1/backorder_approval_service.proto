syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "BackorderApprovalServiceProto";
option java_package = "com.acme.orders.v1";

// Routes backorders through approval, with escalation and delegation.
service BackorderApprovalService {
  // Submits a backorder.
  rpc SubmitBackorder(SubmitBackorderRequest) returns (SubmitBackorderResponse);

  // Approves a backorder.
  rpc ApproveBackorder(ApproveBackorderRequest) returns (ApproveBackorderResponse);

  // Rejects a backorder.
  rpc RejectBackorder(RejectBackorderRequest) returns (RejectBackorderResponse);

  // Escalates a backorder.
  rpc EscalateBackorder(EscalateBackorderRequest) returns (EscalateBackorderResponse);

  // Lists backorders a page at a time.
  rpc ListPendingBackorders(ListPendingBackordersRequest) returns (ListPendingBackordersResponse);

  // Delegates a backorder.
  rpc DelegateBackorderApproval(DelegateBackorderApprovalRequest) returns (DelegateBackorderApprovalResponse);

  // Returns a backorder.
  rpc GetBackorderApprovalStatus(GetBackorderApprovalStatusRequest) returns (GetBackorderApprovalStatusResponse);

  // Comments a backorder.
  rpc CommentBackorderApproval(CommentBackorderApprovalRequest) returns (CommentBackorderApprovalResponse);
}

// The request of `SubmitBackorder`.
message SubmitBackorderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string backorder_id = 2;
  Backorder backorder = 3;
  SubmitBackorderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBackorder`.
message SubmitBackorderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Backorder backorder = 1;
  SubmitBackorderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

