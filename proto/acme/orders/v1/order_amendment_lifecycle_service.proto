import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderAmendmentLifecycleServiceProto";
option java_package = "com.acme.orders.v1";

// Moves an order amendment between the states of its lifecycle.
service OrderAmendmentLifecycleService {
  // Activates an order amendment.
  rpc ActivateOrderAmendment(ActivateOrderAmendmentRequest) returns (ActivateOrderAmendmentResponse);

  // Suspends an order amendment.
  rpc SuspendOrderAmendment(SuspendOrderAmendmentRequest) returns (SuspendOrderAmendmentResponse);

  // Reinstates an order amendment.
  rpc ReinstateOrderAmendment(ReinstateOrderAmendmentRequest) returns (ReinstateOrderAmendmentResponse);

  // Terminates an order amendment.
  rpc TerminateOrderAmendment(TerminateOrderAmendmentRequest) returns (TerminateOrderAmendmentResponse);

  // Renews an order amendment.
  rpc RenewOrderAmendment(RenewOrderAmendmentRequest) returns (RenewOrderAmendmentResponse);

  // Expires an order amendment.
  rpc ExpireOrderAmendment(ExpireOrderAmendmentRequest) returns (ExpireOrderAmendmentResponse);

  // Returns an order amendment.
  rpc GetOrderAmendmentLifecycle(GetOrderAmendmentLifecycleRequest) returns (GetOrderAmendmentLifecycleResponse);

  // Schedules an order amendment.
  rpc ScheduleOrderAmendmentExpiry(ScheduleOrderAmendmentExpiryRequest) returns (ScheduleOrderAmendmentExpiryResponse);
}

// The request of `ActivateOrderAmendment`.
message ActivateOrderAmendmentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  ActivateOrderAmendmentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateOrderAmendment`.
message ActivateOrderAmendmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderAmendment order_amendment = 1;
  ActivateOrderAmendmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

