// The request of `GetOrderNoteRules`.
message GetOrderNoteRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetOrderNoteRules`.
message GetOrderNoteRulesResponse {
  OrderNote order_note = 1;
  acme.common.v1.OperationResult result = 2;
}
