syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderQueryServiceProto";
option java_package = "com.acme.orders.v1";

// Answers read-only questions about orders, for screens and reports.
service OrderQueryService {
  // Returns an order.
  rpc LookupOrder(LookupOrderRequest) returns (LookupOrderResponse);

  // Lists orders a page at a time.
  rpc BrowseOrders(BrowseOrdersRequest) returns (BrowseOrdersResponse);

  // Counts orders by status.
  rpc CountOrders(CountOrdersRequest) returns (CountOrdersResponse);

  // Returns several orders at once.
  rpc ResolveOrders(ResolveOrdersRequest) returns (ResolveOrdersResponse);

  // Streams every matching order.
  rpc ExportOrders(ExportOrdersRequest) returns (stream ExportOrdersResponse);

  // Lists orders a page at a time.
  rpc SuggestOrders(SuggestOrdersRequest) returns (SuggestOrdersResponse);

  // Returns an order.
  rpc PeekOrder(PeekOrderRequest) returns (PeekOrderResponse);
}

// The request of `LookupOrder`.
message LookupOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupOrder`.
message LookupOrderResponse {
  Order order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseOrders`.
message BrowseOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseOrders`.
message BrowseOrdersResponse {
  repeated Order orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountOrders`.
message CountOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountOrders`.
message CountOrdersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveOrders`.
message ResolveOrdersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string order_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveOrders`.
message ResolveOrdersResponse {
  repeated Order orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportOrders`.
message ExportOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportOrdersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportOrders`.
message ExportOrdersResponse {
  Order order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestOrders`.
message SuggestOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestOrders`.
message SuggestOrdersResponse {
  repeated Order orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekOrder`.
message PeekOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekOrder`.
message PeekOrderResponse {
  Order order = 1;
  acme.common.v1.OperationResult result = 2;
}
