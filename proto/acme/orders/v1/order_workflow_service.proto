option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderWorkflowServiceProto";
option java_package = "com.acme.orders.v1";

// Runs the long-lived workflow that takes an order from start to finish.
service OrderWorkflowService {
  // Starts an order.
  rpc StartOrderWorkflow(StartOrderWorkflowRequest) returns (StartOrderWorkflowResponse);

  // Advances an order.
  rpc AdvanceOrderWorkflow(AdvanceOrderWorkflowRequest) returns (AdvanceOrderWorkflowResponse);

  // Cancels an order.
  rpc CancelOrderWorkflow(CancelOrderWorkflowRequest) returns (CancelOrderWorkflowResponse);

  // Retrys an order.
  rpc RetryOrderWorkflow(RetryOrderWorkflowRequest) returns (RetryOrderWorkflowResponse);

  // Pauses an order.
  rpc PauseOrderWorkflow(PauseOrderWorkflowRequest) returns (PauseOrderWorkflowResponse);

  // Resumes an order.
  rpc ResumeOrderWorkflow(ResumeOrderWorkflowRequest) returns (ResumeOrderWorkflowResponse);

  // Returns an order.
  rpc InspectOrderWorkflow(InspectOrderWorkflowRequest) returns (InspectOrderWorkflowResponse);

  // Lists orders a page at a time.
  rpc ListOrderWorkflows(ListOrderWorkflowsRequest) returns (ListOrderWorkflowsResponse);

  // Signals an order.
  rpc SignalOrderWorkflow(SignalOrderWorkflowRequest) returns (SignalOrderWorkflowResponse);
}

// The request of `StartOrderWorkflow`.
message StartOrderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  Order order = 3;
  StartOrderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartOrderWorkflow`.
message StartOrderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Order order = 1;
  StartOrderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

