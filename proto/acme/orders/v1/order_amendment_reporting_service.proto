syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderAmendmentReportingServiceProto";
option java_package = "com.acme.orders.v1";

// Builds and schedules reports about order amendments.
service OrderAmendmentReportingService {
  // Generates an order amendment.
  rpc GenerateOrderAmendmentReport(GenerateOrderAmendmentReportRequest) returns (GenerateOrderAmendmentReportResponse);

  // Returns an order amendment.
  rpc FetchOrderAmendmentReport(FetchOrderAmendmentReportRequest) returns (FetchOrderAmendmentReportResponse);

  // Schedules an order amendment.
  rpc ScheduleOrderAmendmentReport(ScheduleOrderAmendmentReportRequest) returns (ScheduleOrderAmendmentReportResponse);

  // Streams the changes of order amendments as they happen.
  rpc StreamOrderAmendmentMetrics(StreamOrderAmendmentMetricsRequest) returns (stream StreamOrderAmendmentMetricsResponse);

  // Lists order amendments a page at a time.
  rpc ListOrderAmendmentReports(ListOrderAmendmentReportsRequest) returns (ListOrderAmendmentReportsResponse);

  // Shares an order amendment.
  rpc ShareOrderAmendmentReport(ShareOrderAmendmentReportRequest) returns (ShareOrderAmendmentReportResponse);

  // Counts order amendments by status.
  rpc CountOrderAmendmentTotals(CountOrderAmendmentTotalsRequest) returns (CountOrderAmendmentTotalsResponse);

  // Deletes an order amendment.
  rpc DeleteOrderAmendmentReport(DeleteOrderAmendmentReportRequest) returns (DeleteOrderAmendmentReportResponse);
}

// The request of `GenerateOrderAmendmentReport`.
message GenerateOrderAmendmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  GenerateOrderAmendmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateOrderAmendmentReport`.
message GenerateOrderAmendmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchOrderAmendmentReport`.
message FetchOrderAmendmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchOrderAmendmentReport`.
message FetchOrderAmendmentReportResponse {
  OrderAmendment order_amendment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleOrderAmendmentReport`.
message ScheduleOrderAmendmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  ScheduleOrderAmendmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleOrderAmendmentReport`.
message ScheduleOrderAmendmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamOrderAmendmentMetrics`.
message StreamOrderAmendmentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderAmendmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamOrderAmendmentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamOrderAmendmentMetrics`.
message StreamOrderAmendmentMetricsResponse {
  OrderAmendment order_amendment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListOrderAmendmentReports`.
message ListOrderAmendmentReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderAmendmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListOrderAmendmentReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListOrderAmendmentReports`.
message ListOrderAmendmentReportsResponse {
  repeated OrderAmendment order_amendments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareOrderAmendmentReport`.
message ShareOrderAmendmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  ShareOrderAmendmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareOrderAmendmentReport`.
message ShareOrderAmendmentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderAmendment order_amendment = 1;
  ShareOrderAmendmentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountOrderAmendmentTotals`.
message CountOrderAmendmentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OrderAmendmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountOrderAmendmentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountOrderAmendmentTotals`.
message CountOrderAmendmentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteOrderAmendmentReport`.
message DeleteOrderAmendmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteOrderAmendmentReport`.
message DeleteOrderAmendmentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
