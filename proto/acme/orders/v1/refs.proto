syntax = "proto3";

package acme.orders.v1;

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.orders.v1";

// A reference to an order of the orders domain.
message OrderRef {
  string order_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an order amendment of the orders domain.
message OrderAmendmentRef {
  string order_amendment_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a backorder of the orders domain.
message BackorderRef {
  string backorder_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to an order note of the orders domain.
message OrderNoteRef {
  string order_note_id = 1;
  string display_name = 2;
  string kind = 3;
}
