import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "BackorderWorkflowServiceProto";
option java_package = "com.acme.orders.v1";

// Runs the long-lived workflow that takes a backorder from start to finish.
service BackorderWorkflowService {
  // Starts a backorder.
  rpc StartBackorderWorkflow(StartBackorderWorkflowRequest) returns (StartBackorderWorkflowResponse);

  // Advances a backorder.
  rpc AdvanceBackorderWorkflow(AdvanceBackorderWorkflowRequest) returns (AdvanceBackorderWorkflowResponse);

  // Cancels a backorder.
  rpc CancelBackorderWorkflow(CancelBackorderWorkflowRequest) returns (CancelBackorderWorkflowResponse);

  // Retrys a backorder.
  rpc RetryBackorderWorkflow(RetryBackorderWorkflowRequest) returns (RetryBackorderWorkflowResponse);

  // Pauses a backorder.
  rpc PauseBackorderWorkflow(PauseBackorderWorkflowRequest) returns (PauseBackorderWorkflowResponse);

  // Resumes a backorder.
  rpc ResumeBackorderWorkflow(ResumeBackorderWorkflowRequest) returns (ResumeBackorderWorkflowResponse);

  // Returns a backorder.
  rpc InspectBackorderWorkflow(InspectBackorderWorkflowRequest) returns (InspectBackorderWorkflowResponse);

  // Signals a backorder.
  rpc SignalBackorderWorkflow(SignalBackorderWorkflowRequest) returns (SignalBackorderWorkflowResponse);
}

// The request of `StartBackorderWorkflow`.
message StartBackorderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string backorder_id = 2;
  Backorder backorder = 3;
  StartBackorderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBackorderWorkflow`.
message StartBackorderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Backorder backorder = 1;
  StartBackorderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

