syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderNoteApprovalServiceProto";
option java_package = "com.acme.orders.v1";

// Routes order notes through approval, with escalation and delegation.
service OrderNoteApprovalService {
  // Submits an order note.
  rpc SubmitOrderNote(SubmitOrderNoteRequest) returns (SubmitOrderNoteResponse);

  // Approves an order note.
  rpc ApproveOrderNote(ApproveOrderNoteRequest) returns (ApproveOrderNoteResponse);

  // Rejects an order note.
  rpc RejectOrderNote(RejectOrderNoteRequest) returns (RejectOrderNoteResponse);

  // Escalates an order note.
  rpc EscalateOrderNote(EscalateOrderNoteRequest) returns (EscalateOrderNoteResponse);

  // Lists order notes a page at a time.
  rpc ListPendingOrderNotes(ListPendingOrderNotesRequest) returns (ListPendingOrderNotesResponse);

  // Delegates an order note.
  rpc DelegateOrderNoteApproval(DelegateOrderNoteApprovalRequest) returns (DelegateOrderNoteApprovalResponse);

  // Recalls an order note.
  rpc RecallOrderNote(RecallOrderNoteRequest) returns (RecallOrderNoteResponse);

  // Returns an order note.
  rpc GetOrderNoteApprovalStatus(GetOrderNoteApprovalStatusRequest) returns (GetOrderNoteApprovalStatusResponse);
}

// The request of `SubmitOrderNote`.
message SubmitOrderNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  OrderNote order_note = 3;
  SubmitOrderNoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitOrderNote`.
message SubmitOrderNoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderNote order_note = 1;
  SubmitOrderNoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveOrderNote`.
message ApproveOrderNoteRequest {
