import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderNoteLifecycleServiceProto";
option java_package = "com.acme.orders.v1";

// Moves an order note between the states of its lifecycle.
service OrderNoteLifecycleService {
  // Activates an order note.
  rpc ActivateOrderNote(ActivateOrderNoteRequest) returns (ActivateOrderNoteResponse);

  // Suspends an order note.
  rpc SuspendOrderNote(SuspendOrderNoteRequest) returns (SuspendOrderNoteResponse);

  // Reinstates an order note.
  rpc ReinstateOrderNote(ReinstateOrderNoteRequest) returns (ReinstateOrderNoteResponse);

  // Terminates an order note.
  rpc TerminateOrderNote(TerminateOrderNoteRequest) returns (TerminateOrderNoteResponse);

  // Renews an order note.
  rpc RenewOrderNote(RenewOrderNoteRequest) returns (RenewOrderNoteResponse);

  // Expires an order note.
  rpc ExpireOrderNote(ExpireOrderNoteRequest) returns (ExpireOrderNoteResponse);

  // Returns an order note.
  rpc GetOrderNoteLifecycle(GetOrderNoteLifecycleRequest) returns (GetOrderNoteLifecycleResponse);

  // Schedules an order note.
  rpc ScheduleOrderNoteExpiry(ScheduleOrderNoteExpiryRequest) returns (ScheduleOrderNoteExpiryResponse);
}

// The request of `ActivateOrderNote`.
message ActivateOrderNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_note_id = 2;
  ActivateOrderNoteRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateOrderNote`.
message ActivateOrderNoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderNote order_note = 1;
  ActivateOrderNoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

