syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderValidationServiceProto";
option java_package = "com.acme.orders.v1";

// Checks orders against the rules before anything acts on them.
service OrderValidationService {
  // Validates an order.
  rpc ValidateOrder(ValidateOrderRequest) returns (ValidateOrderResponse);

  // Previews an order.
  rpc PreviewOrder(PreviewOrderRequest) returns (PreviewOrderResponse);

  // Checks an order.
  rpc CheckOrderEligibility(CheckOrderEligibilityRequest) returns (CheckOrderEligibilityResponse);

  // Normalizes an order.
  rpc NormalizeOrder(NormalizeOrderRequest) returns (NormalizeOrderResponse);

  // Explains an order.
  rpc ExplainOrderDecision(ExplainOrderDecisionRequest) returns (ExplainOrderDecisionResponse);

  // Scores an order.
  rpc ScoreOrder(ScoreOrderRequest) returns (ScoreOrderResponse);

  // Lints an order.
  rpc LintOrders(LintOrdersRequest) returns (LintOrdersResponse);

  // Returns an order.
  rpc GetOrderRules(GetOrderRulesRequest) returns (GetOrderRulesResponse);
}

// The request of `ValidateOrder`.
message ValidateOrderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_id = 2;
  Order order = 3;
  ValidateOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateOrder`.
message ValidateOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Order order = 1;
  ValidateOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

