syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "BackorderCalculationServiceProto";
option java_package = "com.acme.orders.v1";

// Computes the figures of a backorder, such as totals, taxes, and estimates.
service BackorderCalculationService {
  // Calculates a backorder.
  rpc CalculateBackorder(CalculateBackorderRequest) returns (CalculateBackorderResponse);

  // Estimates a backorder.
  rpc EstimateBackorder(EstimateBackorderRequest) returns (EstimateBackorderResponse);

  // Quotes a backorder.
  rpc QuoteBackorder(QuoteBackorderRequest) returns (QuoteBackorderResponse);

  // Compares a backorder.
  rpc CompareBackorderOptions(CompareBackorderOptionsRequest) returns (CompareBackorderOptionsResponse);

  // Recalculates a backorder.
  rpc RecalculateBackorders(RecalculateBackordersRequest) returns (RecalculateBackordersResponse);

  // Simulates a backorder.
  rpc SimulateBackorder(SimulateBackorderRequest) returns (SimulateBackorderResponse);

  // Explains a backorder.
  rpc ExplainBackorderCalculation(ExplainBackorderCalculationRequest) returns (ExplainBackorderCalculationResponse);

  // Returns a backorder.
  rpc GetBackorderRates(GetBackorderRatesRequest) returns (GetBackorderRatesResponse);
}

// The request of `CalculateBackorder`.
message CalculateBackorderRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string backorder_id = 2;
  Backorder backorder = 3;
  CalculateBackorderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateBackorder`.
message CalculateBackorderResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateBackorderResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Backorder backorder = 1;
  CalculateBackorderResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

