syntax = "proto3";

package acme.orders.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/orders/v1/orders.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Orders.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/orders/v1;ordersv1";
option java_multiple_files = true;
option java_outer_classname = "OrderAmendmentValidationServiceProto";
option java_package = "com.acme.orders.v1";

// Checks order amendments against the rules before anything acts on them.
service OrderAmendmentValidationService {
  // Validates an order amendment.
  rpc ValidateOrderAmendment(ValidateOrderAmendmentRequest) returns (ValidateOrderAmendmentResponse);

  // Previews an order amendment.
  rpc PreviewOrderAmendment(PreviewOrderAmendmentRequest) returns (PreviewOrderAmendmentResponse);

  // Normalizes an order amendment.
  rpc NormalizeOrderAmendment(NormalizeOrderAmendmentRequest) returns (NormalizeOrderAmendmentResponse);

  // Explains an order amendment.
  rpc ExplainOrderAmendmentDecision(ExplainOrderAmendmentDecisionRequest) returns (ExplainOrderAmendmentDecisionResponse);

  // Scores an order amendment.
  rpc ScoreOrderAmendment(ScoreOrderAmendmentRequest) returns (ScoreOrderAmendmentResponse);

  // Lints an order amendment.
  rpc LintOrderAmendments(LintOrderAmendmentsRequest) returns (LintOrderAmendmentsResponse);

  // Returns an order amendment.
  rpc GetOrderAmendmentRules(GetOrderAmendmentRulesRequest) returns (GetOrderAmendmentRulesResponse);
}

// The request of `ValidateOrderAmendment`.
message ValidateOrderAmendmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string order_amendment_id = 2;
  OrderAmendment order_amendment = 3;
  ValidateOrderAmendmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateOrderAmendment`.
message ValidateOrderAmendmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrderAmendment order_amendment = 1;
  ValidateOrderAmendmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

