    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Backorder backorder = 1;
  ResolveBackorderConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetBackorderSyncState`.
message GetBackorderSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string backorder_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetBackorderSyncState`.
message GetBackorderSyncStateResponse {
  Backorder backorder = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListBackorderConflicts`.
message ListBackorderConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BackorderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListBackorderConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListBackorderConflicts`.
message ListBackorderConflictsResponse {
  repeated Backorder backorders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
