    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Backorder backorder = 1;
  PullBackordersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileBackorders`.
message ReconcileBackordersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string backorder_id = 2;
  Backorder backorder = 3;
  ReconcileBackordersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileBackorders`.
message ReconcileBackordersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
