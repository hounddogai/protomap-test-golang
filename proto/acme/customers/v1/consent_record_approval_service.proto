syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "ConsentRecordApprovalServiceProto";
option java_package = "com.acme.customers.v1";

// Routes consent records through approval, with escalation and delegation.
service ConsentRecordApprovalService {
  // Submits a consent record.
  rpc SubmitConsentRecord(SubmitConsentRecordRequest) returns (SubmitConsentRecordResponse);

  // Approves a consent record.
  rpc ApproveConsentRecord(ApproveConsentRecordRequest) returns (ApproveConsentRecordResponse);

  // Rejects a consent record.
  rpc RejectConsentRecord(RejectConsentRecordRequest) returns (RejectConsentRecordResponse);

  // Escalates a consent record.
  rpc EscalateConsentRecord(EscalateConsentRecordRequest) returns (EscalateConsentRecordResponse);

  // Lists consent records a page at a time.
  rpc ListPendingConsentRecords(ListPendingConsentRecordsRequest) returns (ListPendingConsentRecordsResponse);

  // Delegates a consent record.
  rpc DelegateConsentRecordApproval(DelegateConsentRecordApprovalRequest) returns (DelegateConsentRecordApprovalResponse);

  // Recalls a consent record.
  rpc RecallConsentRecord(RecallConsentRecordRequest) returns (RecallConsentRecordResponse);

  // Returns a consent record.
  rpc GetConsentRecordApprovalStatus(GetConsentRecordApprovalStatusRequest) returns (GetConsentRecordApprovalStatusResponse);

  // Comments a consent record.
  rpc CommentConsentRecordApproval(CommentConsentRecordApprovalRequest) returns (CommentConsentRecordApprovalResponse);
}

// The request of `SubmitConsentRecord`.
message SubmitConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  SubmitConsentRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitConsentRecord`.
message SubmitConsentRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  SubmitConsentRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

