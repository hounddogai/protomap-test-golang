syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerCalculationServiceProto";
option java_package = "com.acme.customers.v1";

// Computes the figures of a customer, such as totals, taxes, and estimates.
service CustomerCalculationService {
  // Calculates a customer.
  rpc CalculateCustomer(CalculateCustomerRequest) returns (CalculateCustomerResponse);

  // Estimates a customer.
  rpc EstimateCustomer(EstimateCustomerRequest) returns (EstimateCustomerResponse);

  // Quotes a customer.
  rpc QuoteCustomer(QuoteCustomerRequest) returns (QuoteCustomerResponse);

  // Recalculates a customer.
  rpc RecalculateCustomers(RecalculateCustomersRequest) returns (RecalculateCustomersResponse);

  // Simulates a customer.
  rpc SimulateCustomer(SimulateCustomerRequest) returns (SimulateCustomerResponse);

  // Explains a customer.
  rpc ExplainCustomerCalculation(ExplainCustomerCalculationRequest) returns (ExplainCustomerCalculationResponse);

  // Returns a customer.
  rpc GetCustomerRates(GetCustomerRatesRequest) returns (GetCustomerRatesResponse);
}

// The request of `CalculateCustomer`.
message CalculateCustomerRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_id = 2;
  Customer customer = 3;
  CalculateCustomerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCustomer`.
message CalculateCustomerResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCustomerResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Customer customer = 1;
  CalculateCustomerResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

