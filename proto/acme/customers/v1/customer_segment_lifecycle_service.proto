option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerSegmentLifecycleServiceProto";
option java_package = "com.acme.customers.v1";

// Moves a customer segment between the states of its lifecycle.
service CustomerSegmentLifecycleService {
  // Activates a customer segment.
  rpc ActivateCustomerSegment(ActivateCustomerSegmentRequest) returns (ActivateCustomerSegmentResponse);

  // Suspends a customer segment.
  rpc SuspendCustomerSegment(SuspendCustomerSegmentRequest) returns (SuspendCustomerSegmentResponse);

  // Reinstates a customer segment.
  rpc ReinstateCustomerSegment(ReinstateCustomerSegmentRequest) returns (ReinstateCustomerSegmentResponse);

  // Terminates a customer segment.
  rpc TerminateCustomerSegment(TerminateCustomerSegmentRequest) returns (TerminateCustomerSegmentResponse);

  // Renews a customer segment.
  rpc RenewCustomerSegment(RenewCustomerSegmentRequest) returns (RenewCustomerSegmentResponse);

  // Expires a customer segment.
  rpc ExpireCustomerSegment(ExpireCustomerSegmentRequest) returns (ExpireCustomerSegmentResponse);

  // Returns a customer segment.
  rpc GetCustomerSegmentLifecycle(GetCustomerSegmentLifecycleRequest) returns (GetCustomerSegmentLifecycleResponse);

  // Schedules a customer segment.
  rpc ScheduleCustomerSegmentExpiry(ScheduleCustomerSegmentExpiryRequest) returns (ScheduleCustomerSegmentExpiryResponse);
}

// The request of `ActivateCustomerSegment`.
message ActivateCustomerSegmentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  ActivateCustomerSegmentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCustomerSegment`.
message ActivateCustomerSegmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  ActivateCustomerSegmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

