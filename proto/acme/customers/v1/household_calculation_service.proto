syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "HouseholdCalculationServiceProto";
option java_package = "com.acme.customers.v1";

// Computes the figures of a household, such as totals, taxes, and estimates.
service HouseholdCalculationService {
  // Calculates a household.
  rpc CalculateHousehold(CalculateHouseholdRequest) returns (CalculateHouseholdResponse);

  // Estimates a household.
  rpc EstimateHousehold(EstimateHouseholdRequest) returns (EstimateHouseholdResponse);

  // Quotes a household.
  rpc QuoteHousehold(QuoteHouseholdRequest) returns (QuoteHouseholdResponse);

  // Compares a household.
  rpc CompareHouseholdOptions(CompareHouseholdOptionsRequest) returns (CompareHouseholdOptionsResponse);

  // Recalculates a household.
  rpc RecalculateHouseholds(RecalculateHouseholdsRequest) returns (RecalculateHouseholdsResponse);

  // Simulates a household.
  rpc SimulateHousehold(SimulateHouseholdRequest) returns (SimulateHouseholdResponse);

  // Explains a household.
  rpc ExplainHouseholdCalculation(ExplainHouseholdCalculationRequest) returns (ExplainHouseholdCalculationResponse);
}

// The request of `CalculateHousehold`.
message CalculateHouseholdRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string household_id = 2;
  Household household = 3;
  CalculateHouseholdRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateHousehold`.
message CalculateHouseholdResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateHouseholdResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Household household = 1;
  CalculateHouseholdResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

