syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerSegmentApprovalServiceProto";
option java_package = "com.acme.customers.v1";

// Routes customer segments through approval, with escalation and delegation.
service CustomerSegmentApprovalService {
  // Submits a customer segment.
  rpc SubmitCustomerSegment(SubmitCustomerSegmentRequest) returns (SubmitCustomerSegmentResponse);

  // Approves a customer segment.
  rpc ApproveCustomerSegment(ApproveCustomerSegmentRequest) returns (ApproveCustomerSegmentResponse);

  // Rejects a customer segment.
  rpc RejectCustomerSegment(RejectCustomerSegmentRequest) returns (RejectCustomerSegmentResponse);

  // Escalates a customer segment.
  rpc EscalateCustomerSegment(EscalateCustomerSegmentRequest) returns (EscalateCustomerSegmentResponse);

  // Lists customer segments a page at a time.
  rpc ListPendingCustomerSegments(ListPendingCustomerSegmentsRequest) returns (ListPendingCustomerSegmentsResponse);

  // Recalls a customer segment.
  rpc RecallCustomerSegment(RecallCustomerSegmentRequest) returns (RecallCustomerSegmentResponse);

  // Returns a customer segment.
  rpc GetCustomerSegmentApprovalStatus(GetCustomerSegmentApprovalStatusRequest) returns (GetCustomerSegmentApprovalStatusResponse);

  // Comments a customer segment.
  rpc CommentCustomerSegmentApproval(CommentCustomerSegmentApprovalRequest) returns (CommentCustomerSegmentApprovalResponse);
}

// The request of `SubmitCustomerSegment`.
message SubmitCustomerSegmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  SubmitCustomerSegmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCustomerSegment`.
message SubmitCustomerSegmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  SubmitCustomerSegmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCustomerSegment`.
message ApproveCustomerSegmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
