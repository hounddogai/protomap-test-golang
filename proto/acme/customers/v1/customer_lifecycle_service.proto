syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerLifecycleServiceProto";
option java_package = "com.acme.customers.v1";

// Moves a customer between the states of its lifecycle.
service CustomerLifecycleService {
  // Activates a customer.
  rpc ActivateCustomer(ActivateCustomerRequest) returns (ActivateCustomerResponse);

  // Suspends a customer.
  rpc SuspendCustomer(SuspendCustomerRequest) returns (SuspendCustomerResponse);

  // Reinstates a customer.
  rpc ReinstateCustomer(ReinstateCustomerRequest) returns (ReinstateCustomerResponse);

  // Terminates a customer.
  rpc TerminateCustomer(TerminateCustomerRequest) returns (TerminateCustomerResponse);

  // Expires a customer.
  rpc ExpireCustomer(ExpireCustomerRequest) returns (ExpireCustomerResponse);

  // Schedules a customer.
  rpc ScheduleCustomerExpiry(ScheduleCustomerExpiryRequest) returns (ScheduleCustomerExpiryResponse);
}

// The request of `ActivateCustomer`.
message ActivateCustomerRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_id = 2;
  ActivateCustomerRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCustomer`.
message ActivateCustomerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Customer customer = 1;
  ActivateCustomerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

