syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "PreferenceReportingServiceProto";
option java_package = "com.acme.customers.v1";

// Builds and schedules reports about preferences.
service PreferenceReportingService {
  // Generates a preference.
  rpc GeneratePreferenceReport(GeneratePreferenceReportRequest) returns (GeneratePreferenceReportResponse);

  // Returns a preference.
  rpc FetchPreferenceReport(FetchPreferenceReportRequest) returns (FetchPreferenceReportResponse);

  // Schedules a preference.
  rpc SchedulePreferenceReport(SchedulePreferenceReportRequest) returns (SchedulePreferenceReportResponse);

  // Streams the changes of preferences as they happen.
  rpc StreamPreferenceMetrics(StreamPreferenceMetricsRequest) returns (stream StreamPreferenceMetricsResponse);

  // Lists preferences a page at a time.
  rpc ListPreferenceReports(ListPreferenceReportsRequest) returns (ListPreferenceReportsResponse);

  // Shares a preference.
  rpc SharePreferenceReport(SharePreferenceReportRequest) returns (SharePreferenceReportResponse);

  // Counts preferences by status.
  rpc CountPreferenceTotals(CountPreferenceTotalsRequest) returns (CountPreferenceTotalsResponse);

  // Deletes a preference.
  rpc DeletePreferenceReport(DeletePreferenceReportRequest) returns (DeletePreferenceReportResponse);
}

// The request of `GeneratePreferenceReport`.
message GeneratePreferenceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  GeneratePreferenceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePreferenceReport`.
message GeneratePreferenceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPreferenceReport`.
message FetchPreferenceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPreferenceReport`.
message FetchPreferenceReportResponse {
  Preference preference = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePreferenceReport`.
message SchedulePreferenceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  SchedulePreferenceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePreferenceReport`.
message SchedulePreferenceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPreferenceMetrics`.
message StreamPreferenceMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PreferenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPreferenceMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPreferenceMetrics`.
message StreamPreferenceMetricsResponse {
  Preference preference = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPreferenceReports`.
message ListPreferenceReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PreferenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPreferenceReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPreferenceReports`.
message ListPreferenceReportsResponse {
  repeated Preference preferences = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePreferenceReport`.
message SharePreferenceReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  SharePreferenceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePreferenceReport`.
message SharePreferenceReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  SharePreferenceReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPreferenceTotals`.
message CountPreferenceTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PreferenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPreferenceTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPreferenceTotals`.
message CountPreferenceTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePreferenceReport`.
message DeletePreferenceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePreferenceReport`.
message DeletePreferenceReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
