syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerSegmentCalculationServiceProto";
option java_package = "com.acme.customers.v1";

// Computes the figures of a customer segment, such as totals, taxes, and estimates.
service CustomerSegmentCalculationService {
  // Calculates a customer segment.
  rpc CalculateCustomerSegment(CalculateCustomerSegmentRequest) returns (CalculateCustomerSegmentResponse);

  // Estimates a customer segment.
  rpc EstimateCustomerSegment(EstimateCustomerSegmentRequest) returns (EstimateCustomerSegmentResponse);

  // Quotes a customer segment.
  rpc QuoteCustomerSegment(QuoteCustomerSegmentRequest) returns (QuoteCustomerSegmentResponse);

  // Compares a customer segment.
  rpc CompareCustomerSegmentOptions(CompareCustomerSegmentOptionsRequest) returns (CompareCustomerSegmentOptionsResponse);

  // Recalculates a customer segment.
  rpc RecalculateCustomerSegments(RecalculateCustomerSegmentsRequest) returns (RecalculateCustomerSegmentsResponse);

  // Simulates a customer segment.
  rpc SimulateCustomerSegment(SimulateCustomerSegmentRequest) returns (SimulateCustomerSegmentResponse);

  // Explains a customer segment.
  rpc ExplainCustomerSegmentCalculation(ExplainCustomerSegmentCalculationRequest) returns (ExplainCustomerSegmentCalculationResponse);

  // Returns a customer segment.
  rpc GetCustomerSegmentRates(GetCustomerSegmentRatesRequest) returns (GetCustomerSegmentRatesResponse);
}

// The request of `CalculateCustomerSegment`.
message CalculateCustomerSegmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  CalculateCustomerSegmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCustomerSegment`.
message CalculateCustomerSegmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCustomerSegmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CustomerSegment customer_segment = 1;
  CalculateCustomerSegmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

