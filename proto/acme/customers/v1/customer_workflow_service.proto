syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerWorkflowServiceProto";
option java_package = "com.acme.customers.v1";

// Runs the long-lived workflow that takes a customer from start to finish.
service CustomerWorkflowService {
  // Starts a customer.
  rpc StartCustomerWorkflow(StartCustomerWorkflowRequest) returns (StartCustomerWorkflowResponse);

  // Advances a customer.
  rpc AdvanceCustomerWorkflow(AdvanceCustomerWorkflowRequest) returns (AdvanceCustomerWorkflowResponse);

  // Retrys a customer.
  rpc RetryCustomerWorkflow(RetryCustomerWorkflowRequest) returns (RetryCustomerWorkflowResponse);

  // Pauses a customer.
  rpc PauseCustomerWorkflow(PauseCustomerWorkflowRequest) returns (PauseCustomerWorkflowResponse);

  // Resumes a customer.
  rpc ResumeCustomerWorkflow(ResumeCustomerWorkflowRequest) returns (ResumeCustomerWorkflowResponse);

  // Lists customers a page at a time.
  rpc ListCustomerWorkflows(ListCustomerWorkflowsRequest) returns (ListCustomerWorkflowsResponse);

  // Signals a customer.
  rpc SignalCustomerWorkflow(SignalCustomerWorkflowRequest) returns (SignalCustomerWorkflowResponse);
}

// The request of `StartCustomerWorkflow`.
message StartCustomerWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_id = 2;
  Customer customer = 3;
  StartCustomerWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCustomerWorkflow`.
message StartCustomerWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Customer customer = 1;
  StartCustomerWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

