syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerSegmentValidationServiceProto";
option java_package = "com.acme.customers.v1";

// Checks customer segments against the rules before anything acts on them.
service CustomerSegmentValidationService {
  // Validates a customer segment.
  rpc ValidateCustomerSegment(ValidateCustomerSegmentRequest) returns (ValidateCustomerSegmentResponse);

  // Previews a customer segment.
  rpc PreviewCustomerSegment(PreviewCustomerSegmentRequest) returns (PreviewCustomerSegmentResponse);

  // Checks a customer segment.
  rpc CheckCustomerSegmentEligibility(CheckCustomerSegmentEligibilityRequest) returns (CheckCustomerSegmentEligibilityResponse);

  // Explains a customer segment.
  rpc ExplainCustomerSegmentDecision(ExplainCustomerSegmentDecisionRequest) returns (ExplainCustomerSegmentDecisionResponse);

  // Lints a customer segment.
  rpc LintCustomerSegments(LintCustomerSegmentsRequest) returns (LintCustomerSegmentsResponse);

  // Returns a customer segment.
  rpc GetCustomerSegmentRules(GetCustomerSegmentRulesRequest) returns (GetCustomerSegmentRulesResponse);
}

// The request of `ValidateCustomerSegment`.
message ValidateCustomerSegmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  ValidateCustomerSegmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCustomerSegment`.
message ValidateCustomerSegmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  ValidateCustomerSegmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

