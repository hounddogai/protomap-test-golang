syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "PreferenceSyncServiceProto";
option java_package = "com.acme.customers.v1";

// Keeps preferences in step with the systems of record in other regions.
service PreferenceSyncService {
  // Syncs a preference.
  rpc SyncPreferences(SyncPreferencesRequest) returns (SyncPreferencesResponse);

  // Pushs a preference.
  rpc PushPreference(PushPreferenceRequest) returns (PushPreferenceResponse);

  // Pulls a preference.
  rpc PullPreferences(PullPreferencesRequest) returns (PullPreferencesResponse);

  // Reconciles a preference.
  rpc ReconcilePreferences(ReconcilePreferencesRequest) returns (ReconcilePreferencesResponse);

  // Exchanges changes of preferences with a peer.
  rpc StreamPreferenceChanges(stream StreamPreferenceChangesRequest) returns (stream StreamPreferenceChangesResponse);

  // Resolves a preference.
  rpc ResolvePreferenceConflict(ResolvePreferenceConflictRequest) returns (ResolvePreferenceConflictResponse);

  // Returns a preference.
  rpc GetPreferenceSyncState(GetPreferenceSyncStateRequest) returns (GetPreferenceSyncStateResponse);

  // Lists preferences a page at a time.
  rpc ListPreferenceConflicts(ListPreferenceConflictsRequest) returns (ListPreferenceConflictsResponse);
}

// The request of `SyncPreferences`.
message SyncPreferencesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  Preference preference = 3;
  SyncPreferencesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncPreferences`.
message SyncPreferencesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  SyncPreferencesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushPreference`.
message PushPreferenceRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
