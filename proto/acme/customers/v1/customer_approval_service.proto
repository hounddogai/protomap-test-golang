syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerApprovalServiceProto";
option java_package = "com.acme.customers.v1";

// Routes customers through approval, with escalation and delegation.
service CustomerApprovalService {
  // Submits a customer.
  rpc SubmitCustomer(SubmitCustomerRequest) returns (SubmitCustomerResponse);

  // Approves a customer.
  rpc ApproveCustomer(ApproveCustomerRequest) returns (ApproveCustomerResponse);

  // Rejects a customer.
  rpc RejectCustomer(RejectCustomerRequest) returns (RejectCustomerResponse);

  // Escalates a customer.
  rpc EscalateCustomer(EscalateCustomerRequest) returns (EscalateCustomerResponse);

  // Lists customers a page at a time.
  rpc ListPendingCustomers(ListPendingCustomersRequest) returns (ListPendingCustomersResponse);

  // Delegates a customer.
  rpc DelegateCustomerApproval(DelegateCustomerApprovalRequest) returns (DelegateCustomerApprovalResponse);

  // Recalls a customer.
  rpc RecallCustomer(RecallCustomerRequest) returns (RecallCustomerResponse);

  // Returns a customer.
  rpc GetCustomerApprovalStatus(GetCustomerApprovalStatusRequest) returns (GetCustomerApprovalStatusResponse);

  // Comments a customer.
  rpc CommentCustomerApproval(CommentCustomerApprovalRequest) returns (CommentCustomerApprovalResponse);
}

// The request of `SubmitCustomer`.
message SubmitCustomerRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_id = 2;
  Customer customer = 3;
  SubmitCustomerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCustomer`.
message SubmitCustomerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Customer customer = 1;
  SubmitCustomerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

