syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "ConsentRecordLifecycleServiceProto";
option java_package = "com.acme.customers.v1";

// Moves a consent record between the states of its lifecycle.
service ConsentRecordLifecycleService {
  // Activates a consent record.
  rpc ActivateConsentRecord(ActivateConsentRecordRequest) returns (ActivateConsentRecordResponse);

  // Suspends a consent record.
  rpc SuspendConsentRecord(SuspendConsentRecordRequest) returns (SuspendConsentRecordResponse);

  // Reinstates a consent record.
  rpc ReinstateConsentRecord(ReinstateConsentRecordRequest) returns (ReinstateConsentRecordResponse);

  // Terminates a consent record.
  rpc TerminateConsentRecord(TerminateConsentRecordRequest) returns (TerminateConsentRecordResponse);

  // Renews a consent record.
  rpc RenewConsentRecord(RenewConsentRecordRequest) returns (RenewConsentRecordResponse);

  // Returns a consent record.
  rpc GetConsentRecordLifecycle(GetConsentRecordLifecycleRequest) returns (GetConsentRecordLifecycleResponse);

  // Schedules a consent record.
  rpc ScheduleConsentRecordExpiry(ScheduleConsentRecordExpiryRequest) returns (ScheduleConsentRecordExpiryResponse);
}

// The request of `ActivateConsentRecord`.
message ActivateConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ActivateConsentRecordRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateConsentRecord`.
message ActivateConsentRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  ActivateConsentRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

