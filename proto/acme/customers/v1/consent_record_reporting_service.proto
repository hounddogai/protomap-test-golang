syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "ConsentRecordReportingServiceProto";
option java_package = "com.acme.customers.v1";

// Builds and schedules reports about consent records.
service ConsentRecordReportingService {
  // Generates a consent record.
  rpc GenerateConsentRecordReport(GenerateConsentRecordReportRequest) returns (GenerateConsentRecordReportResponse);

  // Returns a consent record.
  rpc FetchConsentRecordReport(FetchConsentRecordReportRequest) returns (FetchConsentRecordReportResponse);

  // Schedules a consent record.
  rpc ScheduleConsentRecordReport(ScheduleConsentRecordReportRequest) returns (ScheduleConsentRecordReportResponse);

  // Streams the changes of consent records as they happen.
  rpc StreamConsentRecordMetrics(StreamConsentRecordMetricsRequest) returns (stream StreamConsentRecordMetricsResponse);

  // Lists consent records a page at a time.
  rpc ListConsentRecordReports(ListConsentRecordReportsRequest) returns (ListConsentRecordReportsResponse);

  // Shares a consent record.
  rpc ShareConsentRecordReport(ShareConsentRecordReportRequest) returns (ShareConsentRecordReportResponse);

  // Counts consent records by status.
  rpc CountConsentRecordTotals(CountConsentRecordTotalsRequest) returns (CountConsentRecordTotalsResponse);

  // Deletes a consent record.
  rpc DeleteConsentRecordReport(DeleteConsentRecordReportRequest) returns (DeleteConsentRecordReportResponse);
}

// The request of `GenerateConsentRecordReport`.
message GenerateConsentRecordReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  GenerateConsentRecordReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateConsentRecordReport`.
message GenerateConsentRecordReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchConsentRecordReport`.
message FetchConsentRecordReportRequest {
  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchConsentRecordReport`.
message FetchConsentRecordReportResponse {
  ConsentRecord consent_record = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleConsentRecordReport`.
message ScheduleConsentRecordReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ScheduleConsentRecordReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleConsentRecordReport`.
message ScheduleConsentRecordReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamConsentRecordMetrics`.
message StreamConsentRecordMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConsentRecordStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamConsentRecordMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamConsentRecordMetrics`.
message StreamConsentRecordMetricsResponse {
  ConsentRecord consent_record = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListConsentRecordReports`.
message ListConsentRecordReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConsentRecordStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListConsentRecordReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListConsentRecordReports`.
message ListConsentRecordReportsResponse {
  repeated ConsentRecord consent_records = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareConsentRecordReport`.
message ShareConsentRecordReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ShareConsentRecordReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareConsentRecordReport`.
message ShareConsentRecordReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  ShareConsentRecordReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConsentRecordTotals`.
message CountConsentRecordTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConsentRecordStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConsentRecordTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConsentRecordTotals`.
message CountConsentRecordTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteConsentRecordReport`.
message DeleteConsentRecordReportRequest {
  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteConsentRecordReport`.
message DeleteConsentRecordReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
