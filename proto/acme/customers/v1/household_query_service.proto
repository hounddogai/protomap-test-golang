syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "HouseholdQueryServiceProto";
option java_package = "com.acme.customers.v1";

// Answers read-only questions about households, for screens and reports.
service HouseholdQueryService {
  // Returns a household.
  rpc LookupHousehold(LookupHouseholdRequest) returns (LookupHouseholdResponse);

  // Lists households a page at a time.
  rpc BrowseHouseholds(BrowseHouseholdsRequest) returns (BrowseHouseholdsResponse);

  // Lists households a page at a time.
  rpc FindHouseholds(FindHouseholdsRequest) returns (FindHouseholdsResponse);

  // Counts households by status.
  rpc CountHouseholds(CountHouseholdsRequest) returns (CountHouseholdsResponse);

  // Returns several households at once.
  rpc ResolveHouseholds(ResolveHouseholdsRequest) returns (ResolveHouseholdsResponse);

  // Streams every matching household.
  rpc ExportHouseholds(ExportHouseholdsRequest) returns (stream ExportHouseholdsResponse);

  // Summarizes a household.
  rpc SummarizeHouseholds(SummarizeHouseholdsRequest) returns (SummarizeHouseholdsResponse);

  // Lists households a page at a time.
  rpc SuggestHouseholds(SuggestHouseholdsRequest) returns (SuggestHouseholdsResponse);

  // Returns a household.
  rpc PeekHousehold(PeekHouseholdRequest) returns (PeekHouseholdResponse);
}

// The request of `LookupHousehold`.
message LookupHouseholdRequest {
  acme.common.v1.RequestContext context = 1;
  string household_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupHousehold`.
message LookupHouseholdResponse {
  Household household = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseHouseholds`.
message BrowseHouseholdsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HouseholdStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseHouseholdsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseHouseholds`.
message BrowseHouseholdsResponse {
  repeated Household households = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindHouseholds`.
message FindHouseholdsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HouseholdStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindHouseholdsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindHouseholds`.
message FindHouseholdsResponse {
  repeated Household households = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountHouseholds`.
message CountHouseholdsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HouseholdStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountHouseholdsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountHouseholds`.
message CountHouseholdsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveHouseholds`.
message ResolveHouseholdsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string household_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveHouseholds`.
message ResolveHouseholdsResponse {
  repeated Household households = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportHouseholds`.
message ExportHouseholdsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HouseholdStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportHouseholdsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportHouseholds`.
message ExportHouseholdsResponse {
  Household household = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeHouseholds`.
message SummarizeHouseholdsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string household_id = 2;
  SummarizeHouseholdsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeHouseholds`.
message SummarizeHouseholdsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestHouseholds`.
message SuggestHouseholdsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HouseholdStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestHouseholdsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestHouseholds`.
message SuggestHouseholdsResponse {
  repeated Household households = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekHousehold`.
message PeekHouseholdRequest {
  acme.common.v1.RequestContext context = 1;
  string household_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekHousehold`.
message PeekHouseholdResponse {
  Household household = 1;
  acme.common.v1.OperationResult result = 2;
}
