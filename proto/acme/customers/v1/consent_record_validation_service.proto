syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "ConsentRecordValidationServiceProto";
option java_package = "com.acme.customers.v1";

// Checks consent records against the rules before anything acts on them.
service ConsentRecordValidationService {
  // Validates a consent record.
  rpc ValidateConsentRecord(ValidateConsentRecordRequest) returns (ValidateConsentRecordResponse);

  // Previews a consent record.
  rpc PreviewConsentRecord(PreviewConsentRecordRequest) returns (PreviewConsentRecordResponse);

  // Normalizes a consent record.
  rpc NormalizeConsentRecord(NormalizeConsentRecordRequest) returns (NormalizeConsentRecordResponse);

  // Explains a consent record.
  rpc ExplainConsentRecordDecision(ExplainConsentRecordDecisionRequest) returns (ExplainConsentRecordDecisionResponse);

  // Scores a consent record.
  rpc ScoreConsentRecord(ScoreConsentRecordRequest) returns (ScoreConsentRecordResponse);

  // Returns a consent record.
  rpc GetConsentRecordRules(GetConsentRecordRulesRequest) returns (GetConsentRecordRulesResponse);
}

// The request of `ValidateConsentRecord`.
message ValidateConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  ValidateConsentRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateConsentRecord`.
message ValidateConsentRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  ValidateConsentRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewConsentRecord`.
message PreviewConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  PreviewConsentRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewConsentRecord`.
message PreviewConsentRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  PreviewConsentRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NormalizeConsentRecord`.
message NormalizeConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  NormalizeConsentRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `NormalizeConsentRecord`.
message NormalizeConsentRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  NormalizeConsentRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExplainConsentRecordDecision`.
message ExplainConsentRecordDecisionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  ExplainConsentRecordDecisionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainConsentRecordDecision`.
message ExplainConsentRecordDecisionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  ExplainConsentRecordDecisionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScoreConsentRecord`.
message ScoreConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  ScoreConsentRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreConsentRecord`.
message ScoreConsentRecordResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreConsentRecordResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ConsentRecord consent_record = 1;
  ScoreConsentRecordResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetConsentRecordRules`.
message GetConsentRecordRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetConsentRecordRules`.
message GetConsentRecordRulesResponse {
  ConsentRecord consent_record = 1;
  acme.common.v1.OperationResult result = 2;
}
