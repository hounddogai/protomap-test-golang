syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerSegmentSyncServiceProto";
option java_package = "com.acme.customers.v1";

// Keeps customer segments in step with the systems of record in other regions.
service CustomerSegmentSyncService {
  // Syncs a customer segment.
  rpc SyncCustomerSegments(SyncCustomerSegmentsRequest) returns (SyncCustomerSegmentsResponse);

  // Pushs a customer segment.
  rpc PushCustomerSegment(PushCustomerSegmentRequest) returns (PushCustomerSegmentResponse);

  // Pulls a customer segment.
  rpc PullCustomerSegments(PullCustomerSegmentsRequest) returns (PullCustomerSegmentsResponse);

  // Reconciles a customer segment.
  rpc ReconcileCustomerSegments(ReconcileCustomerSegmentsRequest) returns (ReconcileCustomerSegmentsResponse);

  // Exchanges changes of customer segments with a peer.
  rpc StreamCustomerSegmentChanges(stream StreamCustomerSegmentChangesRequest) returns (stream StreamCustomerSegmentChangesResponse);

  // Resolves a customer segment.
  rpc ResolveCustomerSegmentConflict(ResolveCustomerSegmentConflictRequest) returns (ResolveCustomerSegmentConflictResponse);

  // Returns a customer segment.
  rpc GetCustomerSegmentSyncState(GetCustomerSegmentSyncStateRequest) returns (GetCustomerSegmentSyncStateResponse);

  // Lists customer segments a page at a time.
  rpc ListCustomerSegmentConflicts(ListCustomerSegmentConflictsRequest) returns (ListCustomerSegmentConflictsResponse);
}

// The request of `SyncCustomerSegments`.
message SyncCustomerSegmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  SyncCustomerSegmentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncCustomerSegments`.
message SyncCustomerSegmentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  SyncCustomerSegmentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushCustomerSegment`.
message PushCustomerSegmentRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  PushCustomerSegmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushCustomerSegment`.
message PushCustomerSegmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  PushCustomerSegmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullCustomerSegments`.
message PullCustomerSegmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  PullCustomerSegmentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullCustomerSegments`.
message PullCustomerSegmentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  PullCustomerSegmentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileCustomerSegments`.
message ReconcileCustomerSegmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  ReconcileCustomerSegmentsRequest.Details details = 4;
  string reason = 5;
