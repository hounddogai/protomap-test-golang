option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "HouseholdWorkflowServiceProto";
option java_package = "com.acme.customers.v1";

// Runs the long-lived workflow that takes a household from start to finish.
service HouseholdWorkflowService {
  // Starts a household.
  rpc StartHouseholdWorkflow(StartHouseholdWorkflowRequest) returns (StartHouseholdWorkflowResponse);

  // Advances a household.
  rpc AdvanceHouseholdWorkflow(AdvanceHouseholdWorkflowRequest) returns (AdvanceHouseholdWorkflowResponse);

  // Cancels a household.
  rpc CancelHouseholdWorkflow(CancelHouseholdWorkflowRequest) returns (CancelHouseholdWorkflowResponse);

  // Retrys a household.
  rpc RetryHouseholdWorkflow(RetryHouseholdWorkflowRequest) returns (RetryHouseholdWorkflowResponse);

  // Pauses a household.
  rpc PauseHouseholdWorkflow(PauseHouseholdWorkflowRequest) returns (PauseHouseholdWorkflowResponse);

  // Resumes a household.
  rpc ResumeHouseholdWorkflow(ResumeHouseholdWorkflowRequest) returns (ResumeHouseholdWorkflowResponse);

  // Returns a household.
  rpc InspectHouseholdWorkflow(InspectHouseholdWorkflowRequest) returns (InspectHouseholdWorkflowResponse);

  // Lists households a page at a time.
  rpc ListHouseholdWorkflows(ListHouseholdWorkflowsRequest) returns (ListHouseholdWorkflowsResponse);

  // Signals a household.
  rpc SignalHouseholdWorkflow(SignalHouseholdWorkflowRequest) returns (SignalHouseholdWorkflowResponse);
}

// The request of `StartHouseholdWorkflow`.
message StartHouseholdWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string household_id = 2;
  Household household = 3;
  StartHouseholdWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartHouseholdWorkflow`.
message StartHouseholdWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Household household = 1;
  StartHouseholdWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

