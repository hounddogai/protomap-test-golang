// The request of `StreamConsentRecordChanges`.
message StreamConsentRecordChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    ConsentRecord change = 2;
    StreamConsentRecordChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamConsentRecordChanges`.
message StreamConsentRecordChangesResponse {
  ConsentRecord consent_record = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolveConsentRecordConflict`.
message ResolveConsentRecordConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  ResolveConsentRecordConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

