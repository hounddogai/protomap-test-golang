syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "ConsentRecordSyncServiceProto";
option java_package = "com.acme.customers.v1";

// Keeps consent records in step with the systems of record in other regions.
service ConsentRecordSyncService {
  // Syncs a consent record.
  rpc SyncConsentRecords(SyncConsentRecordsRequest) returns (SyncConsentRecordsResponse);

  // Pushs a consent record.
  rpc PushConsentRecord(PushConsentRecordRequest) returns (PushConsentRecordResponse);

  // Pulls a consent record.
  rpc PullConsentRecords(PullConsentRecordsRequest) returns (PullConsentRecordsResponse);

  // Reconciles a consent record.
  rpc ReconcileConsentRecords(ReconcileConsentRecordsRequest) returns (ReconcileConsentRecordsResponse);

  // Exchanges changes of consent records with a peer.
  rpc StreamConsentRecordChanges(stream StreamConsentRecordChangesRequest) returns (stream StreamConsentRecordChangesResponse);

  // Resolves a consent record.
  rpc ResolveConsentRecordConflict(ResolveConsentRecordConflictRequest) returns (ResolveConsentRecordConflictResponse);

  // Returns a consent record.
  rpc GetConsentRecordSyncState(GetConsentRecordSyncStateRequest) returns (GetConsentRecordSyncStateResponse);

  // Lists consent records a page at a time.
  rpc ListConsentRecordConflicts(ListConsentRecordConflictsRequest) returns (ListConsentRecordConflictsResponse);
}

// The request of `SyncConsentRecords`.
message SyncConsentRecordsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  SyncConsentRecordsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncConsentRecords`.
message SyncConsentRecordsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  SyncConsentRecordsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushConsentRecord`.
message PushConsentRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  PushConsentRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushConsentRecord`.
message PushConsentRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  PushConsentRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullConsentRecords`.
message PullConsentRecordsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  PullConsentRecordsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullConsentRecords`.
message PullConsentRecordsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  PullConsentRecordsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileConsentRecords`.
message ReconcileConsentRecordsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  ReconcileConsentRecordsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
