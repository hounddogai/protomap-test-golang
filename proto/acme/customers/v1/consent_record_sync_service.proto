message ResolveConsentRecordConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  ResolveConsentRecordConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetConsentRecordSyncState`.
message GetConsentRecordSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetConsentRecordSyncState`.
message GetConsentRecordSyncStateResponse {
  ConsentRecord consent_record = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListConsentRecordConflicts`.
message ListConsentRecordConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConsentRecordStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListConsentRecordConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListConsentRecordConflicts`.
message ListConsentRecordConflictsResponse {
  repeated ConsentRecord consent_records = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
