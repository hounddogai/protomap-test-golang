syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "PreferenceLifecycleServiceProto";
option java_package = "com.acme.customers.v1";

// Moves a preference between the states of its lifecycle.
service PreferenceLifecycleService {
  // Activates a preference.
  rpc ActivatePreference(ActivatePreferenceRequest) returns (ActivatePreferenceResponse);

  // Suspends a preference.
  rpc SuspendPreference(SuspendPreferenceRequest) returns (SuspendPreferenceResponse);

  // Reinstates a preference.
  rpc ReinstatePreference(ReinstatePreferenceRequest) returns (ReinstatePreferenceResponse);

  // Terminates a preference.
  rpc TerminatePreference(TerminatePreferenceRequest) returns (TerminatePreferenceResponse);

  // Renews a preference.
  rpc RenewPreference(RenewPreferenceRequest) returns (RenewPreferenceResponse);

  // Expires a preference.
  rpc ExpirePreference(ExpirePreferenceRequest) returns (ExpirePreferenceResponse);

  // Returns a preference.
  rpc GetPreferenceLifecycle(GetPreferenceLifecycleRequest) returns (GetPreferenceLifecycleResponse);

  // Schedules a preference.
  rpc SchedulePreferenceExpiry(SchedulePreferenceExpiryRequest) returns (SchedulePreferenceExpiryResponse);
}

// The request of `ActivatePreference`.
message ActivatePreferenceRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  ActivatePreferenceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePreference`.
message ActivatePreferenceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  ActivatePreferenceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

