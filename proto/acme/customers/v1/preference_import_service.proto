syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "PreferenceImportServiceProto";
option java_package = "com.acme.customers.v1";

// Takes preferences in bulk from partners and legacy systems.
service PreferenceImportService {
  // Takes a stream of preferences and answers once at the end.
  rpc ImportPreferences(stream ImportPreferencesRequest) returns (ImportPreferencesResponse);

  // Returns a preference.
  rpc GetPreferenceImportStatus(GetPreferenceImportStatusRequest) returns (GetPreferenceImportStatusResponse);

  // Cancels a preference.
  rpc CancelPreferenceImport(CancelPreferenceImportRequest) returns (CancelPreferenceImportResponse);

  // Validates a preference.
  rpc ValidatePreferenceImport(ValidatePreferenceImportRequest) returns (ValidatePreferenceImportResponse);

  // Lists preferences a page at a time.
  rpc ListPreferenceImports(ListPreferenceImportsRequest) returns (ListPreferenceImportsResponse);

  // Retrys a preference.
  rpc RetryPreferenceImport(RetryPreferenceImportRequest) returns (RetryPreferenceImportResponse);

  // Maps a preference.
  rpc MapPreferenceImportColumns(MapPreferenceImportColumnsRequest) returns (MapPreferenceImportColumnsResponse);
}

// The request of `ImportPreferences`.
message ImportPreferencesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportPreferencesRequest.StreamHeader header = 2;
    Preference record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportPreferences`.
message ImportPreferencesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string preference_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportPreferencesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetPreferenceImportStatus`.
message GetPreferenceImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPreferenceImportStatus`.
message GetPreferenceImportStatusResponse {
  Preference preference = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelPreferenceImport`.
message CancelPreferenceImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  CancelPreferenceImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelPreferenceImport`.
message CancelPreferenceImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  CancelPreferenceImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidatePreferenceImport`.
message ValidatePreferenceImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  Preference preference = 3;
  ValidatePreferenceImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePreferenceImport`.
message ValidatePreferenceImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  ValidatePreferenceImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPreferenceImports`.
message ListPreferenceImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PreferenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPreferenceImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPreferenceImports`.
message ListPreferenceImportsResponse {
  repeated Preference preferences = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryPreferenceImport`.
message RetryPreferenceImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  Preference preference = 3;
  RetryPreferenceImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryPreferenceImport`.
message RetryPreferenceImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  RetryPreferenceImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapPreferenceImportColumns`.
message MapPreferenceImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  Preference preference = 3;
  MapPreferenceImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapPreferenceImportColumns`.
message MapPreferenceImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  MapPreferenceImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
