syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "PreferenceValidationServiceProto";
option java_package = "com.acme.customers.v1";

// Checks preferences against the rules before anything acts on them.
service PreferenceValidationService {
  // Validates a preference.
  rpc ValidatePreference(ValidatePreferenceRequest) returns (ValidatePreferenceResponse);

  // Previews a preference.
  rpc PreviewPreference(PreviewPreferenceRequest) returns (PreviewPreferenceResponse);

  // Checks a preference.
  rpc CheckPreferenceEligibility(CheckPreferenceEligibilityRequest) returns (CheckPreferenceEligibilityResponse);

  // Normalizes a preference.
  rpc NormalizePreference(NormalizePreferenceRequest) returns (NormalizePreferenceResponse);

  // Explains a preference.
  rpc ExplainPreferenceDecision(ExplainPreferenceDecisionRequest) returns (ExplainPreferenceDecisionResponse);

  // Returns a preference.
  rpc GetPreferenceRules(GetPreferenceRulesRequest) returns (GetPreferenceRulesResponse);
}

// The request of `ValidatePreference`.
message ValidatePreferenceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string preference_id = 2;
  Preference preference = 3;
  ValidatePreferenceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePreference`.
message ValidatePreferenceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Preference preference = 1;
  ValidatePreferenceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

