syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerValidationServiceProto";
option java_package = "com.acme.customers.v1";

// Checks customers against the rules before anything acts on them.
service CustomerValidationService {
  // Validates a customer.
  rpc ValidateCustomer(ValidateCustomerRequest) returns (ValidateCustomerResponse);

  // Previews a customer.
  rpc PreviewCustomer(PreviewCustomerRequest) returns (PreviewCustomerResponse);

  // Checks a customer.
  rpc CheckCustomerEligibility(CheckCustomerEligibilityRequest) returns (CheckCustomerEligibilityResponse);

  // Explains a customer.
  rpc ExplainCustomerDecision(ExplainCustomerDecisionRequest) returns (ExplainCustomerDecisionResponse);

  // Scores a customer.
  rpc ScoreCustomer(ScoreCustomerRequest) returns (ScoreCustomerResponse);

  // Lints a customer.
  rpc LintCustomers(LintCustomersRequest) returns (LintCustomersResponse);

  // Returns a customer.
  rpc GetCustomerRules(GetCustomerRulesRequest) returns (GetCustomerRulesResponse);
}

// The request of `ValidateCustomer`.
message ValidateCustomerRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_id = 2;
  Customer customer = 3;
  ValidateCustomerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCustomer`.
message ValidateCustomerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Customer customer = 1;
  ValidateCustomerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

