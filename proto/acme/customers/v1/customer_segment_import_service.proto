syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "CustomerSegmentImportServiceProto";
option java_package = "com.acme.customers.v1";

// Takes customer segments in bulk from partners and legacy systems.
service CustomerSegmentImportService {
  // Takes a stream of customer segments and answers once at the end.
  rpc ImportCustomerSegments(stream ImportCustomerSegmentsRequest) returns (ImportCustomerSegmentsResponse);

  // Returns a customer segment.
  rpc GetCustomerSegmentImportStatus(GetCustomerSegmentImportStatusRequest) returns (GetCustomerSegmentImportStatusResponse);

  // Cancels a customer segment.
  rpc CancelCustomerSegmentImport(CancelCustomerSegmentImportRequest) returns (CancelCustomerSegmentImportResponse);

  // Validates a customer segment.
  rpc ValidateCustomerSegmentImport(ValidateCustomerSegmentImportRequest) returns (ValidateCustomerSegmentImportResponse);

  // Lists customer segments a page at a time.
  rpc ListCustomerSegmentImports(ListCustomerSegmentImportsRequest) returns (ListCustomerSegmentImportsResponse);

  // Retrys a customer segment.
  rpc RetryCustomerSegmentImport(RetryCustomerSegmentImportRequest) returns (RetryCustomerSegmentImportResponse);

  // Maps a customer segment.
  rpc MapCustomerSegmentImportColumns(MapCustomerSegmentImportColumnsRequest) returns (MapCustomerSegmentImportColumnsResponse);
}

// The request of `ImportCustomerSegments`.
message ImportCustomerSegmentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportCustomerSegmentsRequest.StreamHeader header = 2;
    CustomerSegment record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportCustomerSegments`.
message ImportCustomerSegmentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string customer_segment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportCustomerSegmentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetCustomerSegmentImportStatus`.
message GetCustomerSegmentImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCustomerSegmentImportStatus`.
message GetCustomerSegmentImportStatusResponse {
  CustomerSegment customer_segment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelCustomerSegmentImport`.
message CancelCustomerSegmentImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CancelCustomerSegmentImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelCustomerSegmentImport`.
message CancelCustomerSegmentImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  CancelCustomerSegmentImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateCustomerSegmentImport`.
message ValidateCustomerSegmentImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  ValidateCustomerSegmentImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCustomerSegmentImport`.
message ValidateCustomerSegmentImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  ValidateCustomerSegmentImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListCustomerSegmentImports`.
message ListCustomerSegmentImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CustomerSegmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCustomerSegmentImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCustomerSegmentImports`.
message ListCustomerSegmentImportsResponse {
  repeated CustomerSegment customer_segments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryCustomerSegmentImport`.
message RetryCustomerSegmentImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  RetryCustomerSegmentImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryCustomerSegmentImport`.
message RetryCustomerSegmentImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  RetryCustomerSegmentImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapCustomerSegmentImportColumns`.
message MapCustomerSegmentImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string customer_segment_id = 2;
  CustomerSegment customer_segment = 3;
  MapCustomerSegmentImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapCustomerSegmentImportColumns`.
message MapCustomerSegmentImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CustomerSegment customer_segment = 1;
  MapCustomerSegmentImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
