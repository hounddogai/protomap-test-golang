syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/customers/v1/customers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "HouseholdLifecycleServiceProto";
option java_package = "com.acme.customers.v1";

// Moves a household between the states of its lifecycle.
service HouseholdLifecycleService {
  // Activates a household.
  rpc ActivateHousehold(ActivateHouseholdRequest) returns (ActivateHouseholdResponse);

  // Suspends a household.
  rpc SuspendHousehold(SuspendHouseholdRequest) returns (SuspendHouseholdResponse);

  // Reinstates a household.
  rpc ReinstateHousehold(ReinstateHouseholdRequest) returns (ReinstateHouseholdResponse);

  // Terminates a household.
  rpc TerminateHousehold(TerminateHouseholdRequest) returns (TerminateHouseholdResponse);

  // Renews a household.
  rpc RenewHousehold(RenewHouseholdRequest) returns (RenewHouseholdResponse);

  // Expires a household.
  rpc ExpireHousehold(ExpireHouseholdRequest) returns (ExpireHouseholdResponse);

  // Returns a household.
  rpc GetHouseholdLifecycle(GetHouseholdLifecycleRequest) returns (GetHouseholdLifecycleResponse);

  // Schedules a household.
  rpc ScheduleHouseholdExpiry(ScheduleHouseholdExpiryRequest) returns (ScheduleHouseholdExpiryResponse);
}

// The request of `ActivateHousehold`.
message ActivateHouseholdRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string household_id = 2;
  ActivateHouseholdRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateHousehold`.
message ActivateHouseholdResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Household household = 1;
  ActivateHouseholdResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

