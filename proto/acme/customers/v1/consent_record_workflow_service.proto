syntax = "proto3";

package acme.customers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/customers/v1/customers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Customers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/customers/v1;customersv1";
option java_multiple_files = true;
option java_outer_classname = "ConsentRecordWorkflowServiceProto";
option java_package = "com.acme.customers.v1";

// Runs the long-lived workflow that takes a consent record from start to finish.
service ConsentRecordWorkflowService {
  // Starts a consent record.
  rpc StartConsentRecordWorkflow(StartConsentRecordWorkflowRequest) returns (StartConsentRecordWorkflowResponse);

  // Advances a consent record.
  rpc AdvanceConsentRecordWorkflow(AdvanceConsentRecordWorkflowRequest) returns (AdvanceConsentRecordWorkflowResponse);

  // Cancels a consent record.
  rpc CancelConsentRecordWorkflow(CancelConsentRecordWorkflowRequest) returns (CancelConsentRecordWorkflowResponse);

  // Pauses a consent record.
  rpc PauseConsentRecordWorkflow(PauseConsentRecordWorkflowRequest) returns (PauseConsentRecordWorkflowResponse);

  // Resumes a consent record.
  rpc ResumeConsentRecordWorkflow(ResumeConsentRecordWorkflowRequest) returns (ResumeConsentRecordWorkflowResponse);

  // Returns a consent record.
  rpc InspectConsentRecordWorkflow(InspectConsentRecordWorkflowRequest) returns (InspectConsentRecordWorkflowResponse);

  // Lists consent records a page at a time.
  rpc ListConsentRecordWorkflows(ListConsentRecordWorkflowsRequest) returns (ListConsentRecordWorkflowsResponse);
}

// The request of `StartConsentRecordWorkflow`.
message StartConsentRecordWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string consent_record_id = 2;
  ConsentRecord consent_record = 3;
  StartConsentRecordWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartConsentRecordWorkflow`.
message StartConsentRecordWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConsentRecord consent_record = 1;
  StartConsentRecordWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

