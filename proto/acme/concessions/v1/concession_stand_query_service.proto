syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionStandQueryServiceProto";
option java_package = "com.acme.concessions.v1";

// Answers read-only questions about concession stands, for screens and reports.
service ConcessionStandQueryService {
  // Returns a concession stand.
  rpc LookupConcessionStand(LookupConcessionStandRequest) returns (LookupConcessionStandResponse);

  // Lists concession stands a page at a time.
  rpc BrowseConcessionStands(BrowseConcessionStandsRequest) returns (BrowseConcessionStandsResponse);

  // Lists concession stands a page at a time.
  rpc FindConcessionStands(FindConcessionStandsRequest) returns (FindConcessionStandsResponse);

  // Counts concession stands by status.
  rpc CountConcessionStands(CountConcessionStandsRequest) returns (CountConcessionStandsResponse);

  // Returns several concession stands at once.
  rpc ResolveConcessionStands(ResolveConcessionStandsRequest) returns (ResolveConcessionStandsResponse);

  // Streams every matching concession stand.
  rpc ExportConcessionStands(ExportConcessionStandsRequest) returns (stream ExportConcessionStandsResponse);

  // Summarizes a concession stand.
  rpc SummarizeConcessionStands(SummarizeConcessionStandsRequest) returns (SummarizeConcessionStandsResponse);

  // Lists concession stands a page at a time.
  rpc SuggestConcessionStands(SuggestConcessionStandsRequest) returns (SuggestConcessionStandsResponse);

  // Returns a concession stand.
  rpc PeekConcessionStand(PeekConcessionStandRequest) returns (PeekConcessionStandResponse);
}

// The request of `LookupConcessionStand`.
message LookupConcessionStandRequest {
  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupConcessionStand`.
message LookupConcessionStandResponse {
  ConcessionStand concession_stand = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseConcessionStands`.
message BrowseConcessionStandsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionStandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseConcessionStandsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseConcessionStands`.
message BrowseConcessionStandsResponse {
  repeated ConcessionStand concession_stands = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindConcessionStands`.
message FindConcessionStandsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionStandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindConcessionStandsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindConcessionStands`.
message FindConcessionStandsResponse {
  repeated ConcessionStand concession_stands = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConcessionStands`.
message CountConcessionStandsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionStandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConcessionStandsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConcessionStands`.
message CountConcessionStandsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveConcessionStands`.
message ResolveConcessionStandsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string concession_stand_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveConcessionStands`.
message ResolveConcessionStandsResponse {
  repeated ConcessionStand concession_stands = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportConcessionStands`.
message ExportConcessionStandsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionStandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportConcessionStandsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportConcessionStands`.
message ExportConcessionStandsResponse {
  ConcessionStand concession_stand = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeConcessionStands`.
message SummarizeConcessionStandsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  SummarizeConcessionStandsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeConcessionStands`.
message SummarizeConcessionStandsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestConcessionStands`.
message SuggestConcessionStandsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionStandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestConcessionStandsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestConcessionStands`.
message SuggestConcessionStandsResponse {
  repeated ConcessionStand concession_stands = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekConcessionStand`.
message PeekConcessionStandRequest {
  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekConcessionStand`.
message PeekConcessionStandResponse {
  ConcessionStand concession_stand = 1;
  acme.common.v1.OperationResult result = 2;
}
