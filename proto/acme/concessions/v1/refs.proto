syntax = "proto3";

package acme.concessions.v1;

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.concessions.v1";

// A reference to a concession stand of the concessions domain.
message ConcessionStandRef {
  string concession_stand_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a concession order of the concessions domain.
message ConcessionOrderRef {
  string concession_order_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a menu item of the concessions domain.
message MenuItemRef {
  string menu_item_id = 1;
  string display_name = 2;
  string code = 3;
}
