syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/money.proto";
import "acme/identity/v1/refs.proto";
import "acme/venues/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "ShowsProto";
option java_package = "com.acme.shows.v1";

// Where a show is in its lifecycle.
enum ShowStatus {
  SHOW_STATUS_UNSPECIFIED = 0;
  SHOW_STATUS_TENTATIVE = 1;
  SHOW_STATUS_CONFIRMED = 2;
  SHOW_STATUS_CANCELLED = 3;
  SHOW_STATUS_COMPLETED = 4;
}

// Where a performance is in its lifecycle.
enum PerformanceStatus {
  PERFORMANCE_STATUS_UNSPECIFIED = 0;
  PERFORMANCE_STATUS_TENTATIVE = 1;
  PERFORMANCE_STATUS_CONFIRMED = 2;
  PERFORMANCE_STATUS_CANCELLED = 3;
  PERFORMANCE_STATUS_COMPLETED = 4;
}

// Where a lineup is in its lifecycle.
enum LineupStatus {
  LINEUP_STATUS_UNSPECIFIED = 0;
  LINEUP_STATUS_DRAFT = 1;
  LINEUP_STATUS_ISSUED = 2;
  LINEUP_STATUS_APPROVED = 3;
  LINEUP_STATUS_PAID = 4;
  LINEUP_STATUS_VOID = 5;
}

// The participant of a show.
message ShowParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a show.
message ShowDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a show.
message ShowWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A show of the shows domain.
message Show {
  string show_id = 1;
  string title = 2;
  ShowStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated ShowParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    ShowDailyRule daily = 7;
    ShowWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The participant of a performance.
message PerformanceParticipant {
  string participant_id = 1;
  string role = 2;
  acme.common.v1.ContactInfo contact = 3;
  bool required = 4;
}

// The daily rule of a performance.
message PerformanceDailyRule {
  int32 interval = 1;
  int32 at_hour = 2;
}

// The weekly rule of a performance.
message PerformanceWeeklyRule {
  repeated string days = 1;
  int32 interval = 2;
}

// A performance of the shows domain.
message Performance {
  string performance_id = 1;
  string title = 2;
  PerformanceStatus status = 3;
  acme.common.v1.TimeWindow window = 4;
  repeated PerformanceParticipant participants = 5;
  acme.common.v1.PostalAddress location = 6;
  oneof recurrence {
    PerformanceDailyRule daily = 7;
    PerformanceWeeklyRule weekly = 8;
    string cron_expression = 9;
  }
  repeated google.protobuf.Duration reminders = 10;
  acme.identity.v1.UserRef organizer = 11;
  map<string, string> metadata = 12;
  acme.common.v1.AuditInfo audit = 13;
}

// The line of a lineup.
message LineupLine {
  string line_id = 1;
  string sku = 2;
  string description = 3;
  int64 quantity = 4;
  acme.common.v1.Money unit_price = 5;
  acme.common.v1.Money amount = 6;
  LineupLineTax tax = 7;
  map<string, string> attributes = 8;
}

// The tax of a lineup line.
message LineupLineTax {
  string jurisdiction = 1;
  double rate = 2;
  acme.common.v1.Money amount = 3;
  repeated string exemptions = 4;
}

// The card settlement of a lineup.
message LineupCardSettlement {
  string holder_name = 1;
  string last4 = 2;
  string network = 3;
  string token = 4;
}

// The bank settlement of a lineup.
message LineupBankSettlement {
  string iban = 1;
  string bic = 2;
  string account_holder = 3;
}

// The attachment of a lineup.
message LineupAttachment {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
  string uri = 5;
}

// A lineup of the shows domain.
message Lineup {
  string lineup_id = 1;
  string number = 2;
  LineupStatus status = 3;
  acme.venues.v1.VenueRef counterparty = 4;
  repeated LineupLine lines = 5;
  acme.common.v1.Money total = 6;
  acme.common.v1.PostalAddress billing_address = 7;
  oneof settlement {
    LineupCardSettlement card = 8;
    LineupBankSettlement bank = 9;
    string voucher_code = 10;
  }
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  string notes = 13;
  repeated LineupAttachment attachments = 14;
  map<string, string> metadata = 15;
  acme.common.v1.AuditInfo audit = 16;
}
