syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "ShowCalculationServiceProto";
option java_package = "com.acme.shows.v1";

// Computes the figures of a show, such as totals, taxes, and estimates.
service ShowCalculationService {
  // Calculates a show.
  rpc CalculateShow(CalculateShowRequest) returns (CalculateShowResponse);

  // Estimates a show.
  rpc EstimateShow(EstimateShowRequest) returns (EstimateShowResponse);

  // Quotes a show.
  rpc QuoteShow(QuoteShowRequest) returns (QuoteShowResponse);

  // Compares a show.
  rpc CompareShowOptions(CompareShowOptionsRequest) returns (CompareShowOptionsResponse);

  // Recalculates a show.
  rpc RecalculateShows(RecalculateShowsRequest) returns (RecalculateShowsResponse);

  // Simulates a show.
  rpc SimulateShow(SimulateShowRequest) returns (SimulateShowResponse);

  // Explains a show.
  rpc ExplainShowCalculation(ExplainShowCalculationRequest) returns (ExplainShowCalculationResponse);

  // Returns a show.
  rpc GetShowRates(GetShowRatesRequest) returns (GetShowRatesResponse);
}

// The request of `CalculateShow`.
message CalculateShowRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string show_id = 2;
  Show show = 3;
  CalculateShowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateShow`.
message CalculateShowResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateShowResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Show show = 1;
  CalculateShowResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

