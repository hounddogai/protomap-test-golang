syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverServiceProto";
option java_package = "com.acme.drivers.v1";

// Manages drivers: creates, reads, changes, and lists them.
service DriverService {
  // Creates a driver.
  rpc CreateDriver(CreateDriverRequest) returns (CreateDriverResponse);

  // Returns a driver.
  rpc GetDriver(GetDriverRequest) returns (GetDriverResponse);

  // Changes a driver.
  rpc UpdateDriver(UpdateDriverRequest) returns (UpdateDriverResponse);

  // Lists drivers a page at a time.
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);

  // Returns several drivers at once.
  rpc BatchGetDrivers(BatchGetDriversRequest) returns (BatchGetDriversResponse);

  // Streams the changes of drivers as they happen.
  rpc WatchDrivers(WatchDriversRequest) returns (stream WatchDriversResponse);

  // Takes a stream of drivers and answers once at the end.
  rpc BatchCreateDrivers(stream BatchCreateDriversRequest) returns (BatchCreateDriversResponse);

  // Creates a driver.
  rpc CloneDriver(CloneDriverRequest) returns (CloneDriverResponse);
}

// The request of `CreateDriver`.
message CreateDriverRequest {
  acme.common.v1.RequestContext context = 1;
  Driver driver = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateDriver`.
message CreateDriverResponse {
  Driver driver = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetDriver`.
message GetDriverRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDriver`.
message GetDriverResponse {
  Driver driver = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateDriver`.
message UpdateDriverRequest {
  acme.common.v1.RequestContext context = 1;
  Driver driver = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateDriver`.
message UpdateDriverResponse {
  Driver driver = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListDrivers`.
message ListDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDriversRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDrivers`.
message ListDriversResponse {
  repeated Driver drivers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `BatchGetDrivers`.
message BatchGetDriversRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string driver_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `BatchGetDrivers`.
message BatchGetDriversResponse {
  repeated Driver drivers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchDrivers`.
message WatchDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchDriversRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchDrivers`.
message WatchDriversResponse {
  Driver driver = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateDrivers`.
message BatchCreateDriversRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateDriversRequest.StreamHeader header = 2;
    Driver record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateDrivers`.
message BatchCreateDriversResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string driver_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateDriversResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneDriver`.
message CloneDriverRequest {
  acme.common.v1.RequestContext context = 1;
  Driver driver = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneDriver`.
message CloneDriverResponse {
  Driver driver = 1;
  acme.common.v1.OperationResult result = 2;
}
