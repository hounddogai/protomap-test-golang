syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverQueryServiceProto";
option java_package = "com.acme.drivers.v1";

// Answers read-only questions about drivers, for screens and reports.
service DriverQueryService {
  // Returns a driver.
  rpc LookupDriver(LookupDriverRequest) returns (LookupDriverResponse);

  // Lists drivers a page at a time.
  rpc BrowseDrivers(BrowseDriversRequest) returns (BrowseDriversResponse);

  // Lists drivers a page at a time.
  rpc FindDrivers(FindDriversRequest) returns (FindDriversResponse);

  // Counts drivers by status.
  rpc CountDrivers(CountDriversRequest) returns (CountDriversResponse);

  // Returns several drivers at once.
  rpc ResolveDrivers(ResolveDriversRequest) returns (ResolveDriversResponse);

  // Streams every matching driver.
  rpc ExportDrivers(ExportDriversRequest) returns (stream ExportDriversResponse);

  // Summarizes a driver.
  rpc SummarizeDrivers(SummarizeDriversRequest) returns (SummarizeDriversResponse);

  // Lists drivers a page at a time.
  rpc SuggestDrivers(SuggestDriversRequest) returns (SuggestDriversResponse);

  // Returns a driver.
  rpc PeekDriver(PeekDriverRequest) returns (PeekDriverResponse);
}

// The request of `LookupDriver`.
message LookupDriverRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDriver`.
message LookupDriverResponse {
  Driver driver = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDrivers`.
message BrowseDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDriversRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDrivers`.
message BrowseDriversResponse {
  repeated Driver drivers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDrivers`.
message FindDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDriversRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDrivers`.
message FindDriversResponse {
  repeated Driver drivers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDrivers`.
message CountDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDriversRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDrivers`.
message CountDriversResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveDrivers`.
message ResolveDriversRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string driver_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveDrivers`.
message ResolveDriversResponse {
  repeated Driver drivers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDrivers`.
message ExportDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDriversRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDrivers`.
message ExportDriversResponse {
  Driver driver = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDrivers`.
message SummarizeDriversRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  SummarizeDriversRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDrivers`.
message SummarizeDriversResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestDrivers`.
message SuggestDriversRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestDriversRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestDrivers`.
message SuggestDriversResponse {
  repeated Driver drivers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekDriver`.
message PeekDriverRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDriver`.
message PeekDriverResponse {
  Driver driver = 1;
  acme.common.v1.OperationResult result = 2;
}
