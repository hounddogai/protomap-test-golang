syntax = "proto3";

package acme.drivers.v1;

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.drivers.v1";

// A reference to a driver of the drivers domain.
message DriverRef {
  string driver_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to a driver license of the drivers domain.
message DriverLicenseRef {
  string driver_license_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a duty status of the drivers domain.
message DutyStatusRef {
  string duty_status_id = 1;
  string display_name = 2;
  string kind = 3;
}
