syntax = "proto3";

package acme.audiences.v1;

option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.audiences.v1";

// A reference to an audience of the audiences domain.
message AudienceRef {
  string audience_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an audience member of the audiences domain.
message AudienceMemberRef {
  string audience_member_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to an audience sync of the audiences domain.
message AudienceSyncRef {
  string audience_sync_id = 1;
  string display_name = 2;
  string kind = 3;
}
