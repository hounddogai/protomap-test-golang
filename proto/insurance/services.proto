service PolicyRenewalOffer {
  rpc PrepareRenewal(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Policy terms preparation.
service PolicyTermsPreparation {
  rpc PrepareTerms(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Premium calculation.
service PremiumCalculation {
  rpc CalculatePremium(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Renewal risk assessment.
service RenewalRiskAssessment {
  rpc AssessRisk(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Settlement agreement preparation.
service SettlementAgreementPreparation {
  rpc PrepareAgreement(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}
