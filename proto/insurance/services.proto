syntax = "proto3";
package fixture.insurance.v1;
option go_package = "example.com/protomap-fixtures/gen/insurance;insurancepb";
import "common/common.proto";

// Claim adjudication coordination.
service ClaimAdjudicationCoordination {
  rpc Adjudicate(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim benefit calculation.
service ClaimBenefitCalculation {
  rpc CalculateBenefit(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim evidence lookup.
service ClaimEvidenceLookup {
  rpc FindEvidence(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim liability assessment.
service ClaimLiabilityAssessment {
  rpc AssessLiability(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim payee verification.
service ClaimPayeeVerification {
  rpc VerifyPayee(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim payout instruction.
service ClaimPayoutInstruction {
  rpc PreparePayout(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim reserve assessment.
service ClaimReserveAssessment {
  rpc AssessReserve(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Claim settlement coordination.
service ClaimSettlementCoordination {
  rpc Settle(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

