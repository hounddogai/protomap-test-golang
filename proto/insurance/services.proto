  rpc ValidateCoverage(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Policy history lookup.
service PolicyHistoryLookup {
  rpc FindHistory(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Policy issuance coordination.
service PolicyIssuanceCoordination {
  rpc Issue(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Policy renewal coordination.
service PolicyRenewalCoordination {
  rpc Renew(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

