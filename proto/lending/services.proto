syntax = "proto3";
package fixture.lending.v1;
option go_package = "example.com/protomap-fixtures/gen/lending;lendingpb";
import "common/common.proto";

// Borrower profile lookup.
service BorrowerProfileLookup {
  rpc FindBorrower(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Collateral valuation.
service CollateralValuation {
  rpc ValueCollateral(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Creditworthiness assessment.
service CreditworthinessAssessment {
  rpc AssessCreditworthiness(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Debt exposure assessment.
service DebtExposureAssessment {
  rpc AssessExposure(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Disbursement condition assessment.
service DisbursementConditionAssessment {
  rpc AssessConditions(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Disbursement schedule selection.
service DisbursementScheduleSelection {
  rpc SelectSchedule(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Income evidence lookup.
service IncomeEvidenceLookup {
  rpc FindIncome(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

