service LoanInterestCalculation {
  rpc CalculateInterest(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Loan offer preparation.
service LoanOfferPreparation {
  rpc PrepareOffer(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

