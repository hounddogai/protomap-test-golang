service LoanServicingCoordination {
  rpc Service(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Loan underwriting coordination.
service LoanUnderwritingCoordination {
  rpc Underwrite(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Repayment schedule lookup.
service RepaymentScheduleLookup {
  rpc FindSchedule(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Underwriting decision recording.
service UnderwritingDecisionRecording {
  rpc RecordDecision(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}
