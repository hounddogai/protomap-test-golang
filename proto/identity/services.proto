service RecoveryEvidenceLookup {
  rpc FindEvidence(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Session credential lookup.
service SessionCredentialLookup {
  rpc FindCredentials(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

