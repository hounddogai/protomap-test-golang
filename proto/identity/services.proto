service IdentityAccountLookup {
  rpc FindAccount(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Identity activation preparation.
service IdentityActivationPreparation {
  rpc PrepareActivation(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Identity attribute validation.
service IdentityAttributeValidation {
  rpc ValidateAttributes(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Identity directory lookup.
service IdentityDirectoryLookup {
  rpc FindDirectory(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Identity group assignment.
service IdentityGroupAssignment {
  rpc AssignGroups(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Identity provisioning coordination.
service IdentityProvisioningCoordination {
  rpc Provision(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Permission scope assessment.
service PermissionScopeAssessment {
  rpc AssessScope(fixture.common.v1.Request) returns (fixture.common.v1.Response);
