syntax = "proto3";
package fixture.identity.v1;
option go_package = "example.com/protomap-fixtures/gen/identity;identitypb";
import "common/common.proto";

// Access decision coordination.
service AccessDecisionCoordination {
  rpc DecideAccess(fixture.common.v1.Request) returns (fixture.common.v1.Response);
  // Review an access decision against its compliance assessment and audit.
  rpc ReviewAccess(fixture.common.v1.Request) returns (fixture.common.v1.Response);
  // Revoke access and record the revocation for compliance.
  rpc RevokeAccess(fixture.common.v1.Request) returns (fixture.common.v1.Response);
  // Explain an access decision to an auditor.
  rpc ExplainDecision(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Access policy resolution.
service AccessPolicyResolution {
  rpc ResolvePolicy(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Access token validation.
service AccessTokenValidation {
  rpc ValidateToken(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Account recovery coordination.
service AccountRecoveryCoordination {
  rpc RecoverAccount(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Authenticate service requests across the enterprise network.
service AuthService {
  rpc Authenticate(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

// Authentication factor assessment.
service AuthenticationFactorAssessment {
  rpc AssessFactors(fixture.common.v1.Request) returns (fixture.common.v1.Response);
}

